format: rulekit/project@1
name: folio
# THE LOGIC GATE — the sixth cross-corpus gate, and the first NON-ARITHMETIC one.
#
# FOLIO (Han et al. 2022, Yale-LILY, arxiv:2209.00840): human-written natural
# language first-order logic. Same packs as gsm8k, deliberately — they were mined
# on arithmetic word problems and have never seen a logic item.
#
# ⚡ ROLE CHANGE (FOLIO Phase 1, 2026-07-16): this is now a MINING TARGET, not a
# 0-commit safety gate. Verdicts commit (Answer.committed admits yes/no), the
# packs list below includes `logic` (phrase-keyed extraction + Horn synth +
# embedded asks — loaded by NO other project; pack scoping is the containment
# proof), and the standing expectation is GROWING correct with wrong PINNED AT
# 0. The number-asymmetry safety role survives unchanged: a committed number
# against a verdict/text gold still scores WRONG, and on a target corpus a
# nonzero `wrong` is now a live precision failure, not just a smell. On any
# suspicious `correct`, run the null control (swap the conclusion's subject for
# an unmentioned one; the answer must move) before calling it coverage.
#
# WHY THIS CORPUS AND NOT ANOTHER: the four checks in docs/HANDOFF.md, all
# measured before wiring (build_corpus.py has the numbers). The one that matters
# most is BALANCED LABELS — True 38.8% / Uncertain 32.4% / False 28.9%, so the
# majority-class null scores 38.8%, not 100%. difg's own logic domain fails that
# check (8 of 8 prose yes/no golds say 'Yes'), which is why it could never buy
# Frontier 2 and this corpus can. ProofWriter was REJECTED on natural English:
# 292,776 questions over a 52-word vocabulary is the MAWPS generator trap.
#
# THE MINING WORKLIST lives in the Phase 0a taxonomy (quantifier-only
# syllogisms first: 71 dev items, ~25-30 addressable by instantiation+chaining;
# the named next class is the 'citizens'-family plural-head morphology, 4
# items, which needs a plural on difg-mined's global 'citizen' entry and
# therefore a gsm8k TEST look — see HANDOFF). Premises reach consumers via the
# fact store; the logic-verdict consumer reads ONLY phrase-keyed Atom facts
# (packs/logic provenance), never the generic fold's head-lemma facts.
#
# FIREWALL. The bucket key is the PREMISE BLOCK, not the item — 1,001 rows share
# 340 stories, so a per-item hash would leak 661 of them across the cut. See
# build_corpus.py. `--slice dev` is the standing check; `--slice test` is
# one-look-only and ledgered, exactly like gsm8k.
#
# No `suite:` — a cross-corpus gate has no hand-curated items, only the DEV pool.
packs: [core-english, arithmetic, difg-mined, logic]
datasets:
  folio:
    # `gold: typed` — True/False land as kind='verdict' (compared as booleans);
    # 'Uncertain' lands as kind='text'. Uncertain is deliberately NOT a `decline`
    # gold: that would score an always-decline engine 'correct' on ~32% of the
    # corpus for zero reasoning. See build_corpus.py's gold-mapping note.
    # `group: story` — the INTERNAL dev-train/dev-holdout cut buckets by premise
    # block (the `story` parquet column), for the same reason the DEV/TEST cut
    # does: items sharing a story must never straddle a firewall. Only the train
    # split needs it; test items never enter the internal cut.
    train: {parquet: data/folio_dev.parquet, question: question, answer: answer, gold: typed, group: story}
    test: {parquet: data/folio_test.parquet, question: question, answer: answer, gold: typed}
