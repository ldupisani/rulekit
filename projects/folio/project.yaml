format: rulekit/project@1
name: folio
# THE LOGIC GATE — the sixth cross-corpus gate, and the first NON-ARITHMETIC one.
#
# FOLIO (Han et al. 2022, Yale-LILY, arxiv:2209.00840): human-written natural
# language first-order logic. Same packs as gsm8k, deliberately — they were mined
# on arithmetic word problems and have never seen a logic item.
#
# ITS ROLE IS SAFETY, LIKE SciBench — expect 0 commits, and a rising number is
# the engine GUESSING. Every other gate asks for a number, so not one of them can
# catch the engine asserting a NUMBER at logic prose. These premises are full of
# bindable numbers ("published a book in 1946"), and _judge_typed scores a
# committed number against a verdict/text gold WRONG. That asymmetry is what this
# corpus buys, and it costs no kernel change.
#
# WHY THIS CORPUS AND NOT ANOTHER: the four checks in docs/HANDOFF.md, all
# measured before wiring (build_corpus.py has the numbers). The one that matters
# most is BALANCED LABELS — True 38.8% / Uncertain 32.4% / False 28.9%, so the
# majority-class null scores 38.8%, not 100%. difg's own logic domain fails that
# check (8 of 8 prose yes/no golds say 'Yes'), which is why it could never buy
# Frontier 2 and this corpus can. ProofWriter was REJECTED on natural English:
# 292,776 questions over a 52-word vocabulary is the MAWPS generator trap.
#
# NOT A MINING WORKLIST YET. The engine has no inference machinery, so DEV is a
# precision/safety gate first. Mining it means reading PREMISES, which today are
# split off by engine.split_question and never reach answer() (the physics
# 'power' lesson) — that is the real cost of Frontier 2, and it is much larger
# than widening Answer.committed.
#
# FIREWALL. The bucket key is the PREMISE BLOCK, not the item — 1,001 rows share
# 340 stories, so a per-item hash would leak 661 of them across the cut. See
# build_corpus.py. `--slice dev` is the standing check; `--slice test` is
# one-look-only and ledgered, exactly like gsm8k.
#
# No `suite:` — a cross-corpus gate has no hand-curated items, only the DEV pool.
packs: [core-english, arithmetic, difg-mined]
datasets:
  folio:
    # `gold: typed` — True/False land as kind='verdict' (compared as booleans);
    # 'Uncertain' lands as kind='text'. Uncertain is deliberately NOT a `decline`
    # gold: that would score an always-decline engine 'correct' on ~32% of the
    # corpus for zero reasoning. See build_corpus.py's gold-mapping note.
    train: {parquet: data/folio_dev.parquet, question: question, answer: answer, gold: typed}
    test: {parquet: data/folio_test.parquet, question: question, answer: answer, gold: typed}
