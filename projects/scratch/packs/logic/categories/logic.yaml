format: rulekit/categories@1
# The conjunctive-predicate split gate (Stage 2.3). A SENSE gate cannot do
# this job: difg-mined lexicons 'or' as `conjunction` too, so sense alone
# would split a DISJUNCTION into two asserted disjuncts — caught by
# test_disjunction_asserts_neither_side before it shipped. Only words listed
# here license the both-conjuncts split; 'or' must never join ('either...or'
# is Stage 3's case-analysis machinery, and FOLIO's golds read it as XOR).
categories:
    conjunctive_marker:
        parent: conjunction
    # Stage 3: names the disjunction word so copular pred spans can REFUSE
    # disjunctive surfaces (span_blocks) — match subsumption ranks by
    # consumed units, and the copular rules' greedy spans (articles, punct)
    # otherwise swallow and silently subsume the narrower disjunction match.
    disjunctive_marker:
        parent: conjunction
    # 'either' is a difg-mined PRONOUN, which is doubly poisonous inside a
    # span: the bare-or rule's span swallows it (and then strictly SUBSUMES
    # the narrower either-rule match), and the anaphora resolver renders a
    # captured pronoun as its ANTECEDENT ('either a dog' rendered 'rex
    # dog'). Blocking it from the bare-form disjunct spans hands
    # either-surfaces to the either-rules alone. No lexicon shadowing —
    # packs may not redefine words; the category names the existing entry.
    either_marker:
        parent: pronoun
members:
    conjunctive_marker: [and]
    disjunctive_marker: [or]
    either_marker: [either]
