format: rulekit/categories@1
# The conjunctive-predicate split gate (Stage 2.3). A SENSE gate cannot do
# this job: difg-mined lexicons 'or' as `conjunction` too, so sense alone
# would split a DISJUNCTION into two asserted disjuncts — caught by
# test_disjunction_asserts_neither_side before it shipped. Only words listed
# here license the both-conjuncts split; 'or' must never join ('either...or'
# is Stage 3's case-analysis machinery, and FOLIO's golds read it as XOR).
categories:
    conjunctive_marker:
        parent: conjunction
    # Stage 3: names the disjunction word so copular pred spans can REFUSE
    # disjunctive surfaces (span_blocks) — match subsumption ranks by
    # consumed units, and the copular rules' greedy spans (articles, punct)
    # otherwise swallow and silently subsume the narrower disjunction match.
    disjunctive_marker:
        parent: conjunction
    # 'either' is a difg-mined PRONOUN, which is doubly poisonous inside a
    # span: the bare-or rule's span swallows it (and then strictly SUBSUMES
    # the narrower either-rule match), and the anaphora resolver renders a
    # captured pronoun as its ANTECEDENT ('either a dog' rendered 'rex
    # dog'). Blocking it from the bare-form disjunct spans hands
    # either-surfaces to the either-rules alone. No lexicon shadowing —
    # packs may not redefine words; the category names the existing entry.
    either_marker:
        parent: pronoun
    # Stage 5.1 note: the indefinite-existential gate (blocks_skipped:
    # indefinite_article on every name-subject slot) reuses CORE-ENGLISH's
    # existing `indefinite_article` category (created for generic unit-price
    # premises — the same a/an-vs-the distinction). No definition here.
    # Stage 8: the bare-plural universal rules refuse a DEFINITE subject —
    # "The dogs are hungry" / "The Beatles are a band" are GROUND statements
    # about particular referents, not generics, and 'the' is auto-skipped
    # (article sense) so only a blocks_skipped gate can see it. Mirror of
    # core-english's indefinite_article (the same a/an-vs-the distinction,
    # from the other side).
    definite_article:
        parent: article
    # S2 (composition-design.md): 'by' as the PASSIVE-AGENT marker. The
    # embedded-copular ASKS' pred spans refuse it (span_blocks) so a
    # passive-agent conclusion ("…is designed by a British architect?")
    # routes to the passive-agent asks ALONE — the Stage 3 lesson,
    # exclusion beats ordering (the copular span would otherwise swallow
    # the construction and win the ranking on id order). ASK SIDE ONLY:
    # premise rules keep reading copular preds containing 'by' ("a
    # business run and owned by Edwin Smith") — a blocked conclusion
    # declines either way, but an unread premise would lose real atoms.
    agent_marker:
        parent: preposition
    # Stage 9b: 'neither' is a difg-mined ADJECTIVE, so no span_blocks entry
    # could see it and "Tom is neither a Merriam's turkey nor a Rio Grande
    # turkey" minted a POSITIVE atom keyed on the whole negated phrase --
    # a negation swallowed into a phrase key, which this pack's header
    # forbids everywhere. Exact mirror of `either_marker`: naming the word
    # lets the plain copular spans REFUSE the construction, handing it to
    # the neither/nor rule alone. 'nor' needs no category (it is already
    # conjunction-sensed, so `span_blocks: conjunction` terminates the
    # left disjunct on it).
    neither_marker:
        parent: adjective
    # Stage 9f: verbs whose PASSIVE + 'as' asserts the resulting role as a
    # fact — "X was appointed as Y" ⊨ X is a Y. Membership is a SOUNDNESS
    # claim per word, not a syntax class: appointive/resultative verbs
    # (appoint, name, elect, crown) qualify; DESCRIPTIVE ones (describe,
    # regard, see, characterize) must NEVER join — "was regarded as the
    # best" asserts a reputation, not the role. One member today, the
    # measured buyer's; each addition needs its own measurement.
    appointive_verb:
        parent: verb
    # Stage 9g: the enumeration keyword — "There are N TYPES of X: A, B,
    # …" licenses reading each listed item as a subtype of X. Gating the
    # counted slot on this category is what keeps the rule off possessive
    # enumerations ("eight federal districts OF RUSSIA: …" — the items are
    # districts, not Russias; 'district' is not a member and must never
    # be). One word; 'kind'/'sort' join only with their own measurement.
    enumeration_type_noun:
        parent: noun
    # Phase B reader 45: irregular passive participles that cannot satisfy
    # the productive `-ed`/`-en` morphology gate. Membership is an overt-
    # form claim, not a lemma claim; finite/bare `make` must never join.
    irregular_past_participle:
        parent: verb
    # Phase B reader 46: any overt article before a proper-name subject
    # changes the construction away from bare named possession. Articles are
    # skippable, so one category must make all three surfaces visible to the
    # slot's `blocks_skipped` gate.
    named_subject_article:
        parent: article
    # Phase B reader 56: overt bare event verbs whose shared lexicon entry is
    # genuinely sense-ambiguous. Category membership supplies the local
    # grammatical selection without shadowing the shared entry or changing
    # any non-scratch registry. Each new member requires its own buyer.
    logic_bare_event_verb:
        parent: verb
    # Phase B reader 59: overt third-person-singular event forms licensed for
    # the singular-agreeing restricted `No` construction. Every member needs
    # a measured buyer; morphology alone is not guessed by the kernel.
    logic_singular_event_verb:
        parent: verb
members:
    conjunctive_marker: [and]
    disjunctive_marker: [or]
    either_marker: [either]
    definite_article: [the]
    agent_marker: [by]
    neither_marker: [neither]
    appointive_verb: [appointed]
    logic_bare_event_verb: [work]
    logic_singular_event_verb: [struggles]
    enumeration_type_noun: [type]
    irregular_past_participle: [made]
    named_subject_article: [a, an, the]
