format: rulekit/rules@1
# The FOLIO campaign's extraction + ask layer. Design rules this file lives by:
#
# - PHRASE-KEYED: class/predicate slots are `span:` captures — the fact's key
#   is the whole canonical phrase, so "opera singer" can never answer for
#   "singer" (the Fiedler trap, Phase 0a) and one-word-apart distractor
#   classes ("belonging to the company" vs "... to employees") stay distinct.
# - `span_blocks: negation` EVERYWHERE a span appears: polarity is read by an
#   explicit {lit: not} token or not at all; a negation swallowed into a
#   phrase key would be invisible to every consumer.
# - `at_start` on every premise rule's first token: an embedded clause (an
#   if-antecedent, a disjunct, a complement) must NEVER emit a ground fact —
#   `match_all` floats, and the FOLIO gate's first catch (b5655ca) was
#   exactly such a drift. The subject/quantifier sits at the sentence start
#   or the rule does not fire.
# - The generic SVO fold still runs beside these rules, but the
#   `logic-verdict` consumer reads ONLY `atom` facts — fold facts (which drop
#   qualifiers and mint junk from passives, Phase 0a) cannot reach a verdict.
#
# ⚠ COPULAR-ONLY, DELIBERATELY (the TEST-look-#1 narrowing — docs/
# negative-results.md, "FOLIO Phase 1 ... REVERTED"). The first landing also
# carried verbal universals, "All X are not Y", ground-verbal and the verbal
# asks; it passed every DEV gate and 919 items clean, then folio TEST look #1
# scored 0 correct / 1 WRONG. The culprit is TEST-only and undiagnosable by
# design, so the re-landing keeps only the narrowest readers:
#   - verbal universals DROPPED: a known-verb PARTICIPLE missplits the
#     cls/pred boundary ("All students TRAINED by Yale are..." -> v='trained')
#   - "All X are not Y" DROPPED: genuinely ambiguous scope (∀¬ vs ¬∀) that
#     FOLIO annotators decide per item — one mis-scoped item is one wrong
#   - ground-verbal + verbal asks DROPPED: the widest ground surface
# Each returns only as its own increment with its own TEST look.

rules:
  # ---- universals: "All/Every CLS are PRED" -> quantified(cls, pred, ±) ----
  - id: logic/universal-copular-all-are
    phase: read
    match:
      sentence:
        - {lit: all, at_start: true}
        - {slot: cls, span: true, span_blocks: [negation, disjunctive_marker]}
        - {lit: are}
        - {slot: pred, span: true, span_blocks: [negation, disjunctive_marker]}
    emits:
      - {fact: quantified, cls: "{cls}", pred: "{pred}", polarity: true}

  - id: logic/universal-copular-all-is
    phase: read
    match:
      sentence:
        - {lit: all, at_start: true}
        - {slot: cls, span: true, span_blocks: [negation, disjunctive_marker]}
        - {lit: is}
        - {slot: pred, span: true, span_blocks: [negation, disjunctive_marker]}
    emits:
      - {fact: quantified, cls: "{cls}", pred: "{pred}", polarity: true}

  - id: logic/universal-copular-every-is
    phase: read
    match:
      sentence:
        - {lit: every, at_start: true}
        - {slot: cls, span: true, span_blocks: [negation, disjunctive_marker]}
        - {lit: is}
        - {slot: pred, span: true, span_blocks: [negation, disjunctive_marker]}
    emits:
      - {fact: quantified, cls: "{cls}", pred: "{pred}", polarity: true}

  - id: logic/universal-copular-every-are
    phase: read
    match:
      sentence:
        - {lit: every, at_start: true}
        - {slot: cls, span: true, span_blocks: [negation, disjunctive_marker]}
        - {lit: are}
        - {slot: pred, span: true, span_blocks: [negation, disjunctive_marker]}
    emits:
      - {fact: quantified, cls: "{cls}", pred: "{pred}", polarity: true}

  - id: logic/universal-no-are
    phase: read
    match:
      sentence:
        - {lit: no, at_start: true}
        - {slot: cls, span: true, span_blocks: [negation, disjunctive_marker]}
        - {lit: are}
        - {slot: pred, span: true, span_blocks: [negation, disjunctive_marker]}
    emits:
      - {fact: quantified, cls: "{cls}", pred: "{pred}", polarity: false}

  - id: logic/universal-no-is
    phase: read
    match:
      sentence:
        - {lit: no, at_start: true}
        - {slot: cls, span: true, span_blocks: [negation, disjunctive_marker]}
        - {lit: is}
        - {slot: pred, span: true, span_blocks: [negation, disjunctive_marker]}
    emits:
      - {fact: quantified, cls: "{cls}", pred: "{pred}", polarity: false}

  # ---- ground atoms: "<Name> is/was [not] [a] PRED", "<Name> <verb> REST" --
  - id: logic/ground-copular-is
    phase: read
    match:
      sentence:
        - {slot: subj, type: name, at_start: true}
        - {lit: is}
        - {slot: pred, span: true, span_blocks: [negation, disjunctive_marker]}
    emits:
      - {fact: atom, entity: "{subj}", pred: "{pred}", polarity: true}

  - id: logic/ground-copular-was
    phase: read
    match:
      sentence:
        - {slot: subj, type: name, at_start: true}
        - {lit: was}
        - {slot: pred, span: true, span_blocks: [negation, disjunctive_marker]}
    emits:
      - {fact: atom, entity: "{subj}", pred: "{pred}", polarity: true}

  - id: logic/ground-copular-is-not
    phase: read
    match:
      sentence:
        - {slot: subj, type: name, at_start: true}
        - {lit: is}
        - {lit: not}
        - {slot: pred, span: true, span_blocks: [negation, disjunctive_marker]}
    emits:
      - {fact: atom, entity: "{subj}", pred: "{pred}", polarity: false}

  - id: logic/ground-copular-was-not
    phase: read
    match:
      sentence:
        - {slot: subj, type: name, at_start: true}
        - {lit: was}
        - {lit: not}
        - {slot: pred, span: true, span_blocks: [negation, disjunctive_marker]}
    emits:
      - {fact: atom, entity: "{subj}", pred: "{pred}", polarity: false}

  # ---- Stage 1: copular if-then conditionals (ROADMAP.md) --------------------
  # "If a X is P, then it/they is/are [not] Q" -> conditional(cls, pred,
  # then_pred, polarity): a class-scoped implication, instantiated by
  # synth/conditional-instantiation over TWO positive atoms. Design rules:
  #   - `at_start` on 'if': an embedded or trailing conditional never fires.
  #   - whole-construction or nothing: 'then' + the pronoun are mandatory
  #     literals, so "unless"/"only if"/comma-only variants leave the WHOLE
  #     sentence unread — monotone-safe (an ignored premise can only miss
  #     entailments, never invent them).
  #   - span_blocks: negation on the ANTECEDENT spans: "If a X is not P ..."
  #     matches nothing (negated antecedents need case analysis — Stage 3).
  #     The consequent's negation is read structurally by the -not variants.
  #   - the indefinite article before cls is auto-skipped (articles are
  #     skippable); a name-subject conditional therefore reads the name as a
  #     CLASS phrase — inert unless a premise asserts membership in it (see
  #     model.Conditional's docstring).
  - id: logic/conditional-is-then-it-is
    phase: read
    match:
      sentence:
        - {lit: if, at_start: true}
        - {slot: cls, span: true, span_blocks: [negation, disjunctive_marker]}
        - {lit: is}
        - {slot: p, span: true, span_blocks: negation}
        - {lit: then}
        - {lit: it}
        - {lit: is}
        - {slot: q, span: true, span_blocks: negation}
    emits:
      - {fact: conditional, cls: "{cls}", pred: "{p}", then_pred: "{q}", polarity: true}

  - id: logic/conditional-is-then-it-is-not
    phase: read
    match:
      sentence:
        - {lit: if, at_start: true}
        - {slot: cls, span: true, span_blocks: [negation, disjunctive_marker]}
        - {lit: is}
        - {slot: p, span: true, span_blocks: negation}
        - {lit: then}
        - {lit: it}
        - {lit: is}
        - {lit: not}
        - {slot: q, span: true, span_blocks: negation}
    emits:
      - {fact: conditional, cls: "{cls}", pred: "{p}", then_pred: "{q}", polarity: false}

  - id: logic/conditional-is-then-they-are
    phase: read
    match:
      sentence:
        - {lit: if, at_start: true}
        - {slot: cls, span: true, span_blocks: [negation, disjunctive_marker]}
        - {lit: is}
        - {slot: p, span: true, span_blocks: negation}
        - {lit: then}
        - {lit: they}
        - {lit: are}
        - {slot: q, span: true, span_blocks: negation}
    emits:
      - {fact: conditional, cls: "{cls}", pred: "{p}", then_pred: "{q}", polarity: true}

  - id: logic/conditional-is-then-they-are-not
    phase: read
    match:
      sentence:
        - {lit: if, at_start: true}
        - {slot: cls, span: true, span_blocks: [negation, disjunctive_marker]}
        - {lit: is}
        - {slot: p, span: true, span_blocks: negation}
        - {lit: then}
        - {lit: they}
        - {lit: are}
        - {lit: not}
        - {slot: q, span: true, span_blocks: negation}
    emits:
      - {fact: conditional, cls: "{cls}", pred: "{p}", then_pred: "{q}", polarity: false}

  # "If someone is P, then they are [not] Q" — the 1-antecedent degenerate
  # form IS a universal (∀x P(x) → [¬]Q(x)); emit quantified directly so the
  # EXISTING instantiation synth serves it, no new machinery
  - id: logic/conditional-someone-is-then-they-are
    phase: read
    match:
      sentence:
        - {lit: if, at_start: true}
        - {lit: someone}
        - {lit: is}
        - {slot: p, span: true, span_blocks: negation}
        - {lit: then}
        - {lit: they}
        - {lit: are}
        - {slot: q, span: true, span_blocks: negation}
    emits:
      - {fact: quantified, cls: "{p}", pred: "{q}", polarity: true}

  - id: logic/conditional-someone-is-then-they-are-not
    phase: read
    match:
      sentence:
        - {lit: if, at_start: true}
        - {lit: someone}
        - {lit: is}
        - {slot: p, span: true, span_blocks: negation}
        - {lit: then}
        - {lit: they}
        - {lit: are}
        - {lit: not}
        - {slot: q, span: true, span_blocks: negation}
    emits:
      - {fact: quantified, cls: "{p}", pred: "{q}", polarity: false}

  # ---- Stage 3: disjunction (ROADMAP.md). Exclusivity is SURFACE-DECIDED,
  # measured from folio DEV golds: bare 'or' is INCLUSIVE ("German or
  # Russian or both" golds True), 'either...or' is EXCLUSIVE (the James
  # minimal pair + the TikTok witness). Negated disjunctive surfaces are
  # UNREAD (scope-ambiguous); disjuncts never decompose (XOR is
  # non-monotone). 'or' is consumed as a LITERAL, so the fragment guard's
  # conjunction-sense veto is satisfied by reading, exactly as designed.
  - id: logic/disj-ground-bare
    phase: read
    match:
      sentence:
        - {slot: subj, type: name, at_start: true}
        - {lit: is}
        - {slot: l, span: true, span_blocks: [negation, conjunction, preposition, either_marker]}
        - {lit: or}
        - {slot: r, span: true, span_blocks: [negation, conjunction, preposition]}
    emits:
      - {fact: disjunction, entity: "{subj}", left: "{l}", right: "{r}", exclusive: false}

  - id: logic/disj-ground-either
    phase: read
    match:
      sentence:
        - {slot: subj, type: name, at_start: true}
        - {lit: is}
        - {lit: either}
        - {slot: l, span: true, span_blocks: [negation, conjunction, preposition, either_marker]}
        - {lit: or}
        - {slot: r, span: true, span_blocks: [negation, conjunction, preposition]}
    emits:
      - {fact: disjunction, entity: "{subj}", left: "{l}", right: "{r}", exclusive: true}

  - id: logic/qdisj-all-are-bare
    phase: read
    match:
      sentence:
        - {lit: all, at_start: true}
        - {slot: cls, span: true, span_blocks: [negation, disjunctive_marker]}
        - {lit: are}
        - {slot: l, span: true, span_blocks: [negation, conjunction, preposition, either_marker]}
        - {lit: or}
        - {slot: r, span: true, span_blocks: [negation, conjunction, preposition]}
    emits:
      - {fact: quantified_disjunction, cls: "{cls}", left: "{l}", right: "{r}", exclusive: false}

  - id: logic/qdisj-all-are-either
    phase: read
    match:
      sentence:
        - {lit: all, at_start: true}
        - {slot: cls, span: true, span_blocks: [negation, disjunctive_marker]}
        - {lit: are}
        - {lit: either}
        - {slot: l, span: true, span_blocks: [negation, conjunction, preposition, either_marker]}
        - {lit: or}
        - {slot: r, span: true, span_blocks: [negation, conjunction, preposition]}
    emits:
      - {fact: quantified_disjunction, cls: "{cls}", left: "{l}", right: "{r}", exclusive: true}

  - id: logic/qdisj-every-is-bare
    phase: read
    match:
      sentence:
        - {lit: every, at_start: true}
        - {slot: cls, span: true, span_blocks: [negation, disjunctive_marker]}
        - {lit: is}
        - {slot: l, span: true, span_blocks: [negation, conjunction, preposition, either_marker]}
        - {lit: or}
        - {slot: r, span: true, span_blocks: [negation, conjunction, preposition]}
    emits:
      - {fact: quantified_disjunction, cls: "{cls}", left: "{l}", right: "{r}", exclusive: false}

  - id: logic/qdisj-every-is-either
    phase: read
    match:
      sentence:
        - {lit: every, at_start: true}
        - {slot: cls, span: true, span_blocks: [negation, disjunctive_marker]}
        - {lit: is}
        - {lit: either}
        - {slot: l, span: true, span_blocks: [negation, conjunction, preposition, either_marker]}
        - {lit: or}
        - {slot: r, span: true, span_blocks: [negation, conjunction, preposition]}
    emits:
      - {fact: quantified_disjunction, cls: "{cls}", left: "{l}", right: "{r}", exclusive: true}

  # ---- Stage 4: quantifier morphology + existentials (ROADMAP.md) -----------
  # 'any' is an ARTICLE (difg-mined) — auto-skipped, so an ordinary lit can
  # never see it; `consume_skipped` (schemas.MatchToken) stops the skip AT
  # the word and claims it. 'each' is a plain quantifier lit. 'everyone' is
  # a difg pronoun, matched as a lit (never in a span — a captured pronoun
  # renders as its antecedent). 'some' rules CONSUME the quantifier, which
  # relaxes the fragment guard's veto for exactly these sentences — by
  # capability, never by editing the guard.
  - id: logic/universal-any-is
    phase: read
    match:
      sentence:
        - {lit: any, at_start: true, consume_skipped: true}
        - {slot: cls, span: true, span_blocks: [negation, disjunctive_marker]}
        - {lit: is}
        - {slot: pred, span: true, span_blocks: [negation, disjunctive_marker]}
    emits:
      - {fact: quantified, cls: "{cls}", pred: "{pred}", polarity: true}

  - id: logic/universal-any-are
    phase: read
    match:
      sentence:
        - {lit: any, at_start: true, consume_skipped: true}
        - {slot: cls, span: true, span_blocks: [negation, disjunctive_marker]}
        - {lit: are}
        - {slot: pred, span: true, span_blocks: [negation, disjunctive_marker]}
    emits:
      - {fact: quantified, cls: "{cls}", pred: "{pred}", polarity: true}

  - id: logic/universal-each-is
    phase: read
    match:
      sentence:
        - {lit: each, at_start: true}
        - {slot: cls, span: true, span_blocks: [negation, disjunctive_marker]}
        - {lit: is}
        - {slot: pred, span: true, span_blocks: [negation, disjunctive_marker]}
    emits:
      - {fact: quantified, cls: "{cls}", pred: "{pred}", polarity: true}

  - id: logic/universal-each-are
    phase: read
    match:
      sentence:
        - {lit: each, at_start: true}
        - {slot: cls, span: true, span_blocks: [negation, disjunctive_marker]}
        - {lit: are}
        - {slot: pred, span: true, span_blocks: [negation, disjunctive_marker]}
    emits:
      - {fact: quantified, cls: "{cls}", pred: "{pred}", polarity: true}

  - id: logic/universal-everyone-who-is
    phase: read
    match:
      sentence:
        - {lit: everyone, at_start: true}
        - {lit: who}
        - {lit: is}
        - {slot: p, span: true, span_blocks: [negation, disjunctive_marker]}
        - {lit: is}
        - {slot: q, span: true, span_blocks: [negation, disjunctive_marker]}
    emits:
      - {fact: quantified, cls: "{p}", pred: "{q}", polarity: true}

  - id: logic/universal-everyone-who-is-not
    phase: read
    match:
      sentence:
        - {lit: everyone, at_start: true}
        - {lit: who}
        - {lit: is}
        - {slot: p, span: true, span_blocks: [negation, disjunctive_marker]}
        - {lit: is}
        - {lit: not}
        - {slot: q, span: true, span_blocks: [negation, disjunctive_marker]}
    emits:
      - {fact: quantified, cls: "{p}", pred: "{q}", polarity: false}

  - id: logic/existential-some-are
    phase: read
    match:
      sentence:
        - {lit: some, at_start: true}
        - {slot: cls, span: true, span_blocks: [negation, disjunctive_marker]}
        - {lit: are}
        - {slot: pred, span: true, span_blocks: [negation, disjunctive_marker]}
    emits:
      - {fact: existential, cls: "{cls}", pred: "{pred}", polarity: true}

  - id: logic/existential-some-are-not
    phase: read
    match:
      sentence:
        - {lit: some, at_start: true}
        - {slot: cls, span: true, span_blocks: [negation, disjunctive_marker]}
        - {lit: are}
        - {lit: not}
        - {slot: pred, span: true, span_blocks: [negation, disjunctive_marker]}
    emits:
      - {fact: existential, cls: "{cls}", pred: "{pred}", polarity: false}

asks:
  # ---- asks: the FOLIO wrapper + an embedded declarative -------------------
  # The wrapper tokens are matched as literals — 'true' needs no sense for
  # that (it is in this pack's lexicon as an ADJECTIVE purely so no noun
  # sense can ever resurrect the is-membership shadow parse, Phase 0a).
  # The final span runs to the question's end BY CONSTRUCTION (a final span
  # must reach the sentence end), and the consumer verifies full consumption,
  # so "Is it true that Mary is a student AT YALE?" can never answer about
  # Mary-the-student-generally.
  # ---- Stage 3: disjunctive conclusions. The copular asks' pred spans REFUSE
  # the disjunctive marker (span_blocks), so an or-question is matched by
  # these asks ALONE — no ranking contest. (An id-order tie-break was tried
  # first and was the wrong mechanism: the copular span consumes MORE units
  # (articles/punct), so it OUTRANKED rather than tied. Exclusion beats
  # ordering.) Pinned by test_disjunctive_question_routes_to_its_consumer.
  # ---- Stage 4: existential conclusions --------------------------------------
  - id: ask/logic-existential-some-are
    match:
      question:
        - {lit: is, at_start: true}
        - {lit: it}
        - {lit: 'true'}
        - {lit: that}
        - {lit: some}
        - {slot: cls, span: true, span_blocks: [negation, disjunctive_marker]}
        - {lit: are}
        - {slot: pred, span: true, span_blocks: [negation, disjunctive_marker]}
    resolves:
      consumer: existential-verdict
      cls: "{cls}"
      pred: "{pred}"
      polarity: "true"

  - id: ask/logic-existential-some-are-not
    match:
      question:
        - {lit: is, at_start: true}
        - {lit: it}
        - {lit: 'true'}
        - {lit: that}
        - {lit: some}
        - {slot: cls, span: true, span_blocks: [negation, disjunctive_marker]}
        - {lit: are}
        - {lit: not}
        - {slot: pred, span: true, span_blocks: [negation, disjunctive_marker]}
    resolves:
      consumer: existential-verdict
      cls: "{cls}"
      pred: "{pred}"
      polarity: "false"

  - id: ask/logic-disj-embedded-bare
    match:
      question:
        - {lit: is, at_start: true}
        - {lit: it}
        - {lit: 'true'}
        - {lit: that}
        - {slot: subj, type: name}
        - {lit: is}
        - {slot: l, span: true, span_blocks: [negation, conjunction, preposition, either_marker]}
        - {lit: or}
        - {slot: r, span: true, span_blocks: [negation, conjunction, preposition]}
    resolves:
      consumer: logic-disjunction-verdict
      entity: "{subj}"
      left: "{l}"
      right: "{r}"
      exclusive: "false"

  - id: ask/logic-disj-embedded-either
    match:
      question:
        - {lit: is, at_start: true}
        - {lit: it}
        - {lit: 'true'}
        - {lit: that}
        - {slot: subj, type: name}
        - {lit: is}
        - {lit: either}
        - {slot: l, span: true, span_blocks: [negation, conjunction, preposition, either_marker]}
        - {lit: or}
        - {slot: r, span: true, span_blocks: [negation, conjunction, preposition]}
    resolves:
      consumer: logic-disjunction-verdict
      entity: "{subj}"
      left: "{l}"
      right: "{r}"
      exclusive: "true"

  - id: ask/logic-embedded-copular
    match:
      question:
        - {lit: is, at_start: true}
        - {lit: it}
        - {lit: 'true'}
        - {lit: that}
        - {slot: subj, type: name}
        - {lit: is}
        - {slot: pred, span: true, span_blocks: [negation, disjunctive_marker]}
    resolves:
      consumer: logic-verdict
      entity: "{subj}"
      pred: "{pred}"
      polarity: "true"

  - id: ask/logic-embedded-copular-was
    match:
      question:
        - {lit: is, at_start: true}
        - {lit: it}
        - {lit: 'true'}
        - {lit: that}
        - {slot: subj, type: name}
        - {lit: was}
        - {slot: pred, span: true, span_blocks: [negation, disjunctive_marker]}
    resolves:
      consumer: logic-verdict
      entity: "{subj}"
      pred: "{pred}"
      polarity: "true"

  - id: ask/logic-embedded-copular-not
    match:
      question:
        - {lit: is, at_start: true}
        - {lit: it}
        - {lit: 'true'}
        - {lit: that}
        - {slot: subj, type: name}
        - {lit: is}
        - {lit: not}
        - {slot: pred, span: true, span_blocks: [negation, disjunctive_marker]}
    resolves:
      consumer: logic-verdict
      entity: "{subj}"
      pred: "{pred}"
      polarity: "false"

  - id: ask/logic-embedded-copular-was-not
    match:
      question:
        - {lit: is, at_start: true}
        - {lit: it}
        - {lit: 'true'}
        - {lit: that}
        - {slot: subj, type: name}
        - {lit: was}
        - {lit: not}
        - {slot: pred, span: true, span_blocks: [negation, disjunctive_marker]}
    resolves:
      consumer: logic-verdict
      entity: "{subj}"
      pred: "{pred}"
      polarity: "false"

  # NOTE (scratch resurrection, 2026-07-17): ask/is-membership is NOT here —
  # it stayed in packs/arithmetic (with the {coll.qualified} collection fix),
  # and this project loads both packs, so a second copy would be a duplicate
  # ask id. The fronted-membership question routes through arithmetic's ask
  # and answer.py's membership-verdict (whose Atom fallback reads this
  # pack's ground facts when they consume the copular premise).
