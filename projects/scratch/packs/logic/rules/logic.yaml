        - {lit: 'true'}
        - {lit: that}
        - {slot: subj, type: name, blocks_skipped: indefinite_article}
        - {lit: is}
        - {slot: pred, span: true, span_blocks: [negation, disjunctive_marker, agent_marker]}
    resolves:
      consumer: logic-verdict
