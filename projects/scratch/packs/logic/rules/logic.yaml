      polarity: "true"

  - id: ask/logic-embedded-copular-was
    match:
      question:
        - {lit: is, at_start: true}
        - {lit: it}
        - {lit: 'true'}
        - {lit: that}
        - {slot: subj, type: name, blocks_skipped: indefinite_article}
        - {lit: was}
        - {slot: pred, span: true, span_blocks: [negation, disjunctive_marker, agent_marker]}
    resolves:
      consumer: logic-verdict
      entity: "{subj}"
      pred: "{pred}"
      polarity: "true"

  - id: ask/logic-embedded-copular-not
    match:
      question:
        - {lit: is, at_start: true}
        - {lit: it}
        - {lit: 'true'}
        - {lit: that}
        - {slot: subj, type: name, blocks_skipped: indefinite_article}
        - {lit: is}
        - {lit: not}
        - {slot: pred, span: true, span_blocks: [negation, disjunctive_marker, agent_marker]}
    resolves:
