        - {lit: that}
        - {slot: subj, type: name, blocks_skipped: indefinite_article}
        - {lit: is}
        - {slot: v, type: nonstate_verb}
        - {lit: by}
        - {lit: an, consume_skipped: true}
        - {slot: cls, span: true, span_blocks: [negation, disjunctive_marker]}
    resolves:
      consumer: passive-agent-verdict
      entity: "{subj}"
      verb: "{v}"
      cls: "{cls}"

  - id: ask/logic-passive-agent-was-a
    match:
      question:
        - {lit: is, at_start: true}
        - {lit: it}
        - {lit: 'true'}
        - {lit: that}
        - {slot: subj, type: name, blocks_skipped: indefinite_article}
        - {lit: was}
        - {slot: v, type: nonstate_verb}
        - {lit: by}
        - {lit: a, consume_skipped: true}
        - {slot: cls, span: true, span_blocks: [negation, disjunctive_marker]}
    resolves:
      consumer: passive-agent-verdict
      entity: "{subj}"
      verb: "{v}"
      cls: "{cls}"

  - id: ask/logic-passive-agent-was-an
    match:
      question:
        - {lit: is, at_start: true}
        - {lit: it}
        - {lit: 'true'}
        - {lit: that}
        - {slot: subj, type: name, blocks_skipped: indefinite_article}
        - {lit: was}
        - {slot: v, type: nonstate_verb}
        - {lit: by}
        - {lit: an, consume_skipped: true}
        - {slot: cls, span: true, span_blocks: [negation, disjunctive_marker]}
    resolves:
      consumer: passive-agent-verdict
      entity: "{subj}"
      verb: "{v}"
      cls: "{cls}"

  # ---- S1: the do-support-negated PP-object conclusion ----------------------
  # "Is it true that Ailton Silva does not play for a football club?" — the
  # question CLAIMS ¬∃; a stored VerbalRelation whose PP object is in the
  # class (saturated + decomposed — 'football club along with Braga' drops
  # to 'football club' via Stage 2.2) is the ∃ witness that contradicts it
  # -> 'no'. Open world: absence of a relation is never 'yes'. NO positive
  # twin ask yet ("…that X plays for a CLS?"): that surface ties with
  # ask/logic-embedded-verbal on consumed units and would fall to id order
  # — the ranking lesson says exclusion-or-nothing, and the negative form
  # has no contest ('does' fails the verbal ask's nonstate v slot).
  - id: ask/logic-verbal-obj-class-does-not-a
    match:
      question:
        - {lit: is, at_start: true}
        - {lit: it}
        - {lit: 'true'}
        - {lit: that}
        - {slot: subj, type: name, blocks_skipped: indefinite_article}
        - {lit: does}
        - {lit: not}
        - {slot: v, type: nonstate_verb}
        - {slot: prep, type: preposition}
        - {lit: a, consume_skipped: true}
        - {slot: cls, span: true, span_blocks: [negation, disjunctive_marker]}
    resolves:
      consumer: verbal-obj-class-verdict
      entity: "{subj}"
      verb: "{v}"
      prep: "{prep}"
      cls: "{cls}"
      polarity: "false"

  - id: ask/logic-verbal-obj-class-does-not-an
    match:
      question:
        - {lit: is, at_start: true}
        - {lit: it}
        - {lit: 'true'}
        - {lit: that}
        - {slot: subj, type: name, blocks_skipped: indefinite_article}
        - {lit: does}
        - {lit: not}
        - {slot: v, type: nonstate_verb}
        - {slot: prep, type: preposition}
        - {lit: an, consume_skipped: true}
        - {slot: cls, span: true, span_blocks: [negation, disjunctive_marker]}
    resolves:
      consumer: verbal-obj-class-verdict
      entity: "{subj}"
      verb: "{v}"
      prep: "{prep}"
      cls: "{cls}"
      polarity: "false"

  - id: ask/logic-disj-embedded-bare
    match:
      question:
        - {lit: is, at_start: true}
        - {lit: it}
        - {lit: 'true'}
        - {lit: that}
        - {slot: subj, type: name, blocks_skipped: indefinite_article}
