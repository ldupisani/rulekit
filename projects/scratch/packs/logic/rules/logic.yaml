format: rulekit/rules@1
# The FOLIO campaign's extraction + ask layer. Design rules this file lives by:
#
# - PHRASE-KEYED: class/predicate slots are `span:` captures — the fact's key
#   is the whole canonical phrase, so "opera singer" can never answer for
#   "singer" (the Fiedler trap, Phase 0a) and one-word-apart distractor
#   classes ("belonging to the company" vs "... to employees") stay distinct.
# - `span_blocks: negation` EVERYWHERE a span appears: polarity is read by an
#   explicit {lit: not} token or not at all; a negation swallowed into a
#   phrase key would be invisible to every consumer.
# - `at_start` on every premise rule's first token: an embedded clause (an
#   if-antecedent, a disjunct, a complement) must NEVER emit a ground fact —
#   `match_all` floats, and the FOLIO gate's first catch (b5655ca) was
#   exactly such a drift. The subject/quantifier sits at the sentence start
#   or the rule does not fire.
# - The generic SVO fold still runs beside these rules, but the
#   `logic-verdict` consumer reads ONLY `atom` facts — fold facts (which drop
#   qualifiers and mint junk from passives, Phase 0a) cannot reach a verdict.
#
# ⚠ COPULAR-ONLY, DELIBERATELY (the TEST-look-#1 narrowing — docs/
# negative-results.md, "FOLIO Phase 1 ... REVERTED"). The first landing also
# carried verbal universals, "All X are not Y", ground-verbal and the verbal
# asks; it passed every DEV gate and 919 items clean, then folio TEST look #1
# scored 0 correct / 1 WRONG. The culprit is TEST-only and undiagnosable by
# design, so the re-landing keeps only the narrowest readers:
#   - verbal universals DROPPED: a known-verb PARTICIPLE missplits the
#     cls/pred boundary ("All students TRAINED by Yale are..." -> v='trained')
#   - "All X are not Y" DROPPED: genuinely ambiguous scope (∀¬ vs ¬∀) that
#     FOLIO annotators decide per item — one mis-scoped item is one wrong
#   - ground-verbal + verbal asks DROPPED: the widest ground surface
# Each returns only as its own increment with its own TEST look.

rules:
  # ---- universals: "All/Every CLS are PRED" -> quantified(cls, pred, ±) ----
  - id: logic/universal-copular-all-are
    phase: read
    match:
      sentence:
        - {lit: all, at_start: true}
        - {slot: cls, span: true, span_blocks: [negation, disjunctive_marker]}
        - {lit: are}
        - {slot: pred, span: true, span_blocks: [negation, disjunctive_marker]}
    emits:
      - {fact: quantified, cls: "{cls.singular}", pred: "{pred.singular}", polarity: true}

  # Stage 9i: the indefinite-generic copular universal — "A carp is a
  # fish" / "An osprey is a bird" reads as ∀ carp → fish, the generic
  # frame (indefinite article on BOTH sides, bare singular nouns, positive
  # polarity). SINGULAR-agreeing, so keys render PLAIN, never .singular
  # (the Stage 8d symmetry: -is constructions join ground atom preds
  # verbatim; only the plural-agreeing family folds). Both articles claimed
  # with consume_skipped (they are skippable senses — the dead-literal
  # lesson) so the whole construction is consumed for the fragment guard.
  - id: logic/universal-indefinite-copular
    phase: read
    match:
      sentence:
        - {lit: [a, an], at_start: true, consume_skipped: true}
        - {slot: cls, span: true, span_blocks: [negation, conjunction, preposition, disjunctive_marker]}
        - {lit: is}
        - {lit: [a, an], consume_skipped: true}
        - {slot: pred, span: true, span_blocks: [negation, conjunction, preposition, disjunctive_marker]}
    emits:
      - {fact: quantified, cls: "{cls}", pred: "{pred}", polarity: true}

  # Phase B reader 3: the negative sibling, deliberately restricted to the
  # same two-article nominal frame — "A god is not a destroyer" asserts
  # forall god -> not destroyer. The explicit `not` owns polarity; neither
  # span may swallow another negation or coordination. Adjectival predicates
  # without an article and larger coordinated predicates remain unread as
  # separate constructions.
  - id: logic/universal-indefinite-copular-not
    phase: read
    match:
      sentence:
        - {lit: [a, an], at_start: true, consume_skipped: true}
        - {slot: cls, span: true, span_blocks: [negation, conjunction, preposition, disjunctive_marker]}
        - {lit: is}
        - {lit: not}
        - {lit: [a, an], consume_skipped: true}
        - {slot: pred, span: true, span_blocks: [negation, conjunction, preposition, disjunctive_marker]}
    emits:
      - {fact: quantified, cls: "{cls}", pred: "{pred}", polarity: false}

  - id: logic/universal-copular-all-is
    phase: read
    match:
      sentence:
        - {lit: all, at_start: true}
        - {slot: cls, span: true, span_blocks: [negation, disjunctive_marker]}
        - {lit: is}
        - {slot: pred, span: true, span_blocks: [negation, disjunctive_marker]}
    emits:
      - {fact: quantified, cls: "{cls}", pred: "{pred}", polarity: true}

  - id: logic/universal-copular-every-is
    phase: read
    match:
      sentence:
        - {lit: every, at_start: true}
        - {slot: cls, span: true, span_blocks: [negation, disjunctive_marker]}
        - {lit: is}
        - {slot: pred, span: true, span_blocks: [negation, disjunctive_marker]}
    emits:
      - {fact: quantified, cls: "{cls}", pred: "{pred}", polarity: true}

  - id: logic/universal-copular-every-are
    phase: read
    match:
      sentence:
        - {lit: every, at_start: true}
        - {slot: cls, span: true, span_blocks: [negation, disjunctive_marker]}
        - {lit: are}
        - {slot: pred, span: true, span_blocks: [negation, disjunctive_marker]}
    emits:
      - {fact: quantified, cls: "{cls.singular}", pred: "{pred.singular}", polarity: true}

  - id: logic/universal-no-are
    phase: read
    match:
      sentence:
        - {lit: no, at_start: true}
        - {slot: cls, span: true, span_blocks: [negation, disjunctive_marker]}
        - {lit: are}
        - {slot: pred, span: true, span_blocks: [negation, disjunctive_marker]}
    emits:
      - {fact: quantified, cls: "{cls.singular}", pred: "{pred.singular}", polarity: false}

  - id: logic/universal-no-is
    phase: read
    match:
      sentence:
        - {lit: no, at_start: true}
        - {slot: cls, span: true, span_blocks: [negation, disjunctive_marker]}
        - {lit: is}
        - {slot: pred, span: true, span_blocks: [negation, disjunctive_marker]}
    emits:
      - {fact: quantified, cls: "{cls}", pred: "{pred}", polarity: false}

  # Phase B reader 11: negative possessive universals — "No CLSs have P" /
  # "No CLS has P". The agreement pair shares the exact predicate key
  # `have P`; only the plural subject frame folds its class key. The class
  # span refuses verbs and modals so relative restrictions ("No facts that
  # Dan knows have ...") and capacity forms ("No reptiles can have ...")
  # cannot be mistaken for the simple frame, while the predicate refuses
  # perfect/verbal, negated, and coordinated continuations.
  - id: logic/universal-no-have
    phase: read
    match:
      sentence:
        - {lit: 'no', at_start: true}
        - {slot: cls, span: true, span_blocks: [negation, conjunction, disjunctive_marker, verb, future_modal, capacity_modal]}
        - {lit: have}
        - {slot: pred, span: true, span_blocks: [negation, conjunction, disjunctive_marker, verb]}
    emits:
      - {fact: quantified, cls: "{cls.singular}", pred: "have {pred}", polarity: false}

  - id: logic/universal-no-has
    phase: read
    match:
      sentence:
        - {lit: 'no', at_start: true}
        - {slot: cls, span: true, span_blocks: [negation, conjunction, disjunctive_marker, verb, future_modal, capacity_modal]}
        - {lit: has}
        - {slot: pred, span: true, span_blocks: [negation, conjunction, disjunctive_marker, verb]}
    emits:
      - {fact: quantified, cls: "{cls}", pred: "have {pred}", polarity: false}

  # Phase B reader 17: singular positive possessive universals —
  # "Every CLS has P". `has` is state syntax and therefore remains outside
  # the event-oriented `nonstate_verb` family; this dedicated reader
  # canonicalizes it to the same `have P` key as ground possession and the
  # negative possessive universals. Scoped, relative, signed, coordinated,
  # modal, perfect/verbal, either-marked, and counted predicates refuse.
  - id: logic/universal-every-has
    phase: read
    match:
      sentence:
        - {lit: every, at_start: true}
        - {slot: cls, span: true, span_blocks: [negation, quantifier, conjunction, disjunctive_marker, either_marker, verb, future_modal, capacity_modal, interrogative, complementizer, wh_which]}
        - {lit: has}
        - {slot: pred, span: true, span_blocks: [negation, quantifier, conjunction, disjunctive_marker, either_marker, verb, future_modal, capacity_modal], span_blocks_counted: true}
    emits:
      - {fact: quantified, cls: "{cls}", pred: "have {pred}", polarity: true}

  # Phase B reader 26: plural-agreeing positive possessive universals —
  # "All CLSs have P". `All` plus bare `have` licenses singularizing the
  # class key, while the possessed predicate stays unfolded to echo named
  # possession facts. Relative restrictors and any second verb are separate
  # constructions; signed, modal, coordinated, quantified-object, and merged
  # counted-noun variants remain whole-unread rather than losing scope or
  # cardinality.
  - id: logic/universal-all-have
    phase: read
    match:
      sentence:
        - {lit: all, at_start: true}
        - {slot: cls, span: true, span_blocks: [negation, quantifier, conjunction, disjunctive_marker, either_marker, verb, future_modal, capacity_modal, interrogative, complementizer, wh_which]}
        - {lit: have}
        - {slot: pred, span: true, span_blocks: [negation, quantifier, conjunction, disjunctive_marker, either_marker, verb, future_modal, capacity_modal, interrogative, complementizer, wh_which], span_blocks_counted: true}
    emits:
      - {fact: quantified, cls: "{cls.singular}", pred: "have {pred}", polarity: true}

  # Phase B reader 12: plural-agreeing negative event universals —
  # "No CLSs V P". A bare-form, single-token event verb is the structural
  # plural-agreement signal, licensing `.singular` on the class while the
  # verbal predicate stays unfolded to echo ground-verbal keys. Relative,
  # modal, negated, coordinated, perfect, and singular-agreeing forms fail
  # the exact spans/gates and remain unread.
  - id: logic/universal-no-verbal-plural
    phase: read
    match:
      sentence:
        - {lit: 'no', at_start: true}
        - {slot: cls, span: true, span_blocks: [negation, conjunction, disjunctive_marker, verb, future_modal, capacity_modal, interrogative, complementizer, wh_which]}
        - {slot: v, type: nonstate_verb, bare_form: true, single_word: true}
        - {slot: pred, span: true, span_blocks: [negation, conjunction, disjunctive_marker, verb, future_modal, capacity_modal], span_blocks_counted: true}
    emits:
      - {fact: quantified, cls: "{cls.singular}", pred: "{v} {pred}", polarity: false}

  # Phase B reader 15: future-negative indefinite generics —
  # "A/An CLS will not V P". The leading article marks the singular generic
  # class, `will` contributes tense only, and the explicit negator owns the
  # polarity. A bare, single-token event verb plus its predicate preserves
  # the same key as ground-verbal facts and questions. Larger signed, modal,
  # coordinated, perfect/particle, and counted constructions refuse.
  - id: logic/universal-indefinite-future-not-verbal
    phase: read
    match:
      sentence:
        - {lit: [a, an], at_start: true, consume_skipped: true}
        - {slot: cls, span: true, span_blocks: [negation, conjunction, disjunctive_marker, verb, future_modal, capacity_modal]}
        - {lit: will}
        - {lit: not}
        - {slot: v, type: nonstate_verb, bare_form: true, single_word: true}
        - {slot: pred, span: true, span_blocks: [negation, conjunction, disjunctive_marker, verb, future_modal, capacity_modal], span_blocks_counted: true}
    emits:
      - {fact: quantified, cls: "{cls}", pred: "{v} {pred}", polarity: false}

  # ⚠ THE `.singular` TEMPLATE ATTR (the unknown-plural-morphology increment):
  # every cls/pred key in the PLURAL-AGREEING family (quantifier + 'are',
  # bare-plural subjects, 'some ... are') renders with unknown-word plurals
  # naively folded to singular (patterns._naive_singular — lexicon words keep
  # their lemma path, names keep their surface). The construction's own
  # plural agreement licenses the fold, and it must stay SYMMETRIC: premise
  # rules and conclusion asks fold together or echo breaks. The -is/-was
  # variants are SINGULAR constructions and must never fold — their keys join
  # ground-copular atom preds verbatim ("X is a lens" / "Every lens is ...").
  # Measured buyer at landing: an unknown-plural universal joining the
  # singular copular atom ("T is a rapper" + "Rappers are not opera singers"
  # ⊢ no), a premise↔premise join the zero-measurement of this family never
  # covered (it checked conclusion↔premise pairs only).

  # ---- Stage 8: BARE-PLURAL universals — "CLS are [not] PRED" ---------------
  # FOLIO's FOL reads a bare-plural copular generic as ∀ ("Mushrooms are
  # fungi" ⇒ ∀x mushroom(x)→fungus(x)); 57 dev-train premises carry the
  # shape (measured 2026-07-17). The subject is ONE unit, two variants:
  #   - type: bare_plural — a KNOWN plural noun that can head a generic
  #     ('Dogs are animals'): refuses possessive-merged subjects ("Bob's
  #     dogs are friendly" is definite reference), compound generics
  #     ("Guard dogs are protective" stays unread — monotone-safe), and
  #     COUNT-merged subjects ("Three dogs are pets" is three particular
  #     dogs — merge-count leaves exactly a plural noun unit, caught by an
  #     adversarial probe after the first test round passed clean).
  #   - type: proper_name — an UNKNOWN capitalized subject ('Mushrooms')
  #     annotates as a name; proper_name (NOT `name`) so a resolved pronoun
  #     can never mint a universal from "They are dogs".
  # Both refuse a skipped DEFINITE article (blocks_skipped: "The dogs are
  # hungry" is ground, not generic) and negation in the subject position by
  # construction (a single unit carries none). The -not variants are
  # UNAMBIGUOUS ∀¬ — unlike "All X are not Y" (dropped for ∀¬-vs-¬∀ scope),
  # a bare plural has no quantifier for negation to out-scope: "Mushrooms
  # are not plants" reads only as ∀¬ (19 such premises measured).
  # The quantifier-led forms cannot reach these rules: 'all'/'no'/'every'
  # are not skippable senses, so at_start fails on them and the quantified
  # rules above keep their territory.
  - id: logic/universal-bare-plural-noun
    phase: read
    match:
      sentence:
        - {slot: cls, type: bare_plural, at_start: true, blocks_skipped: definite_article}
        - {lit: are}
        - {slot: pred, span: true, span_blocks: [negation, disjunctive_marker]}
    emits:
      - {fact: quantified, cls: "{cls.singular}", pred: "{pred.singular}", polarity: true}

  - id: logic/universal-bare-plural-noun-not
    phase: read
    match:
      sentence:
        - {slot: cls, type: bare_plural, at_start: true, blocks_skipped: definite_article}
        - {lit: are}
        - {lit: not}
        - {slot: pred, span: true, span_blocks: [negation, disjunctive_marker]}
    emits:
      - {fact: quantified, cls: "{cls.singular}", pred: "{pred.singular}", polarity: false}

  - id: logic/universal-bare-plural-name
    phase: read
    match:
      sentence:
        - {slot: cls, type: proper_name, at_start: true, blocks_skipped: definite_article}
        - {lit: are}
        - {slot: pred, span: true, span_blocks: [negation, disjunctive_marker]}
    emits:
      - {fact: quantified, cls: "{cls.singular}", pred: "{pred.singular}", polarity: true}

  - id: logic/universal-bare-plural-name-not
    phase: read
    match:
      sentence:
        - {slot: cls, type: proper_name, at_start: true, blocks_skipped: definite_article}
        - {lit: are}
        - {lit: not}
        - {slot: pred, span: true, span_blocks: [negation, disjunctive_marker]}
    emits:
      - {fact: quantified, cls: "{cls.singular}", pred: "{pred.singular}", polarity: false}

  # ---- Stage 8f: BARE-PLURAL VERBAL universals — "CLS <verb> REST" ----------
  # The Stage 8 subject family applied to the Stage 6 verbal reading:
  # "Writers create innovative ideas" is FOLIO-FOL's ∀ exactly as the
  # copular generic is. The copular pair's plural-agreement literal {lit:
  # are} has no verbal counterpart, so the v slot carries `bare_form` —
  # English marks plural agreement on the bare present, which is the
  # structural generic-vs-ground signal ("Mary CREATES ideas" stays
  # ground; "Douglas Adams CREATED the book" stays ground — past tense is
  # not the bare form). The p span must NOT fold (.singular): it joins
  # ask/logic-embedded-verbal's UNFOLDED span render, and an asymmetric
  # fold would break the echo. The ground-verbal atom still emits beside
  # the universal (all triggered rules run) — echo-inert, byte-identical.
  - id: logic/universal-verbal-bare-plural-noun
    phase: read
    match:
      sentence:
        - {slot: cls, type: bare_plural, at_start: true, blocks_skipped: definite_article}
        - {slot: v, type: nonstate_verb, bare_form: true}
        - {slot: p, span: true, span_blocks: [negation, disjunctive_marker, verb], span_blocks_counted: true}
    emits:
      - {fact: quantified, cls: "{cls.singular}", pred: "{v} {p}", polarity: true}

  - id: logic/universal-verbal-bare-plural-name
    phase: read
    match:
      sentence:
        - {slot: cls, type: proper_name, at_start: true, blocks_skipped: definite_article}
        - {slot: v, type: nonstate_verb, bare_form: true}
        - {slot: p, span: true, span_blocks: [negation, disjunctive_marker, verb], span_blocks_counted: true}
    emits:
      - {fact: quantified, cls: "{cls.singular}", pred: "{v} {p}", polarity: true}

  # Phase B reader 29: active-participial compound verbal universals —
  # "V-ing CLSs V2 P". The present participle modifies the plural class head;
  # together they form the exact class key used by named copular membership.
  # The bare-form main verb is the plural-agreement proof and its unfolded
  # tail echoes named ground-verbal keys. Finite/adjectival modifiers,
  # singular classes, state/modal/signed or coordinated consequences,
  # particle/perfect verbs, relatives, and counted tails remain whole-unread.
  - id: logic/universal-participial-bare-plural-verbal
    phase: read
    match:
      sentence:
        - {slot: modifier, type: nonstate_verb, at_start: true, blocks_skipped: definite_article, single_word: true, present_participle: true}
        - {slot: cls, type: bare_plural}
        - {slot: v, type: nonstate_verb, bare_form: true, single_word: true}
        - {slot: p, span: true, span_blocks: [negation, conjunction, preposition, verb_particle, disjunctive_marker, verb, future_modal, capacity_modal, complementizer, interrogative, wh_which], span_blocks_counted: true}
    emits:
      - {fact: quantified, cls: "{modifier} {cls.singular}", pred: "{v} {p}", polarity: true}

  # ---- Stage 8g: the VERBAL generic conditional, negated-consequent form --
  # "If a CLS <v> <obj>[,] they no longer <v2> <rest>" — the Stage 1
  # someone-form's verbal sibling ("If a player leaves a team they no
  # longer play for that team"). Whole-construction or nothing: 'they' +
  # 'no' + 'longer' are mandatory skeleton literals, so every other verbal
  # conditional surface stays unread (monotone-safe). Both spans block
  # verbs, which makes the parse deterministic (cls stops before the
  # antecedent verb; p stops before 'they'). The consequent keeps its
  # anaphoric surface verbatim ('play for that team' — echo-exact, so the
  # derived negative can only ever answer a conclusion phrasing the same
  # bound anaphor; FOLIO conclusions do not, which is honest: "RL left
  # Bayern Munchen" entails "no longer plays for Bayern" only through the
  # world knowledge that Bayern IS a team — a premise this corpus never
  # states, so that conclusion must keep declining). The rule's measured
  # effect is READING the sentence: the fragment guard stops pricing the
  # unread 'if'/'no' into every verdict in the story.
  - id: logic/conditional-verbal-no-longer
    phase: read
    match:
      sentence:
        - {lit: if, at_start: true}
        - {slot: cls, span: true, span_blocks: [negation, disjunctive_marker, verb]}
        - {slot: v, type: nonstate_verb}
        - {slot: p, span: true, span_blocks: [negation, disjunctive_marker, verb], span_blocks_counted: true}
        - {lit: they}
        - {lit: 'no'}
        - {lit: longer}
        - {slot: v2, type: nonstate_verb}
        - {slot: p2, span: true, span_blocks: [negation, disjunctive_marker, verb], span_blocks_counted: true}
    emits:
      - {fact: conditional, cls: "{cls}", pred: "{v} {p}", then_pred: "{v2} {p2}", polarity: false}

  # ---- ground atoms: "<Name> is/was [not] [a] PRED", "<Name> <verb> REST" --
  # `neither_marker` in the pred span (Stage 9b) enforces this file's own
  # header rule -- a negation may never be swallowed into a phrase key.
  # 'neither' is a difg-mined ADJECTIVE, so no span_blocks entry could see
  # it and "Tom is neither a Merriam's turkey nor a Rio Grande turkey" minted
  # a POSITIVE atom keyed on the whole negated phrase. Refusing it leaves the
  # sentence unread at the atom layer (monotone-safe: the atom it replaced
  # was junk). The sound De Morgan READER -- two negative atoms, ¬A ∧ ¬B --
  # is written and measured NEUTRAL but is NOT landed: it has zero buyers on
  # dev-train, and an enabler must be bought (the _TOKEN precedent).
  - id: logic/ground-copular-is
    phase: read
    match:
      sentence:
        - {slot: subj, type: name, at_start: true, blocks_skipped: indefinite_article}
        - {lit: is}
        - {slot: pred, span: true, span_blocks: [negation, disjunctive_marker, neither_marker]}
    emits:
      - {fact: atom, entity: "{subj}", pred: "{pred}", polarity: true}

  - id: logic/ground-copular-was
    phase: read
    match:
      sentence:
        - {slot: subj, type: name, at_start: true, blocks_skipped: indefinite_article}
        - {lit: was}
        - {slot: pred, span: true, span_blocks: [negation, disjunctive_marker]}
    emits:
      - {fact: atom, entity: "{subj}", pred: "{pred}", polarity: true}

  # Stage 9e: the stated alias — "NAME is/was (also) known as NAME2" asserts
  # an identity between two names, so ground atoms carry across it in BOTH
  # directions (synth/alias-copy-*). Both slots are `proper_name` (a
  # resolved pronoun never states an identity between names), and the alias
  # side refuses a skipped DEFINITE article: "known as THE King of Pop" is
  # an epithet — a description, not a second name — and copying atoms onto
  # a description key would let it collide with real predicates. Negated
  # forms never match (the 'not' between copula and 'known' breaks lit
  # adjacency), so no polarity field exists to get wrong. The general
  # ground-copular rule still reads the same sentence into its (junk,
  # joinless) phrase-key atom — harmless, and its span is what consumes the
  # sentence for the fragment guard.
  # Stage 9g: the typed enumeration — "There are N TYPES of CLS: A, B, …,
  # and F" reads each listed item as a subtype universal (∀x A(x)→CLS(x) —
  # a listed TYPE of wild turkey is a wild turkey). The counted slot is
  # gated on `enumeration_type_noun` ('type' only), which keeps the rule
  # off possessive enumerations ("eight federal districts of RUSSIA: …" —
  # its items are not Russias; unread is sound, misread is not). The list
  # span deliberately admits 'and' — it is a LIST separator here, consumed
  # and understood by the per-item emit (schemas.FactEmit.each), which is
  # exactly what the fragment guard's contract asks of a conjunction.
  # Exhaustiveness ("there are EXACTLY six") is NOT captured — the n-way
  # elimination that would need it is a separate, unbuilt stage — so the
  # emitted facts are sound under-reading.
  - id: logic/enumeration-of-types
    phase: read
    match:
      sentence:
        - {lit: there, at_start: true}
        - {lit: [are, is]}
        - {slot: n, cat: enumeration_type_noun}
        - {lit: of}
        - {slot: cls, span: true, span_blocks: [negation, disjunctive_marker]}
        - {lit: ':', consume_skipped: true}
        - {slot: list, span: true, span_blocks: [negation, disjunctive_marker]}
    emits:
      # item folds .singular: list items in this construction are plural-
      # agreeing generics ("… of pets: dogs, cats"), the same license the
      # Stage 8d fold family carries
      - {fact: quantified, each: list, cls: "{item.singular}", pred: "{cls.singular}", polarity: true}
      # Stage 9h: the SAME list emitted once as an exhaustive n-way
      # disjunction — minted only when the stated count ({n.value}, the
      # counted-merge numeral on 'six types') equals the number of listed
      # segments; a mismatched or countless enumeration emits nothing
      # (fail closed — exhaustiveness is exactly what the numeral
      # licenses, and a partial list claims nothing). Consumed only by
      # synth/enumeration-elimination (n-way: all but one refuted for a
      # stated member ⊢ the last).
      - {fact: enumerated_disjunction, options_from: list, cls: "{cls.singular}", count: "{n.value}"}

  # Stage 9g: the De Morgan neither/nor reader — landed WITH its first
  # buyer exactly as the 9b bank prescribed. "X is neither A nor B" asserts
  # ¬A(x) ∧ ¬B(x): two NEGATIVE atoms, never a disjunction (this is the one
  # disjunctive surface whose reading needs no exclusivity measurement).
  # Both spans block `neither_marker` (a second 'neither' may never ride
  # inside a disjunct) and `conjunction` (the left span must stop at
  # 'nor'), mirroring logic/disj-ground-either.
  - id: logic/neither-nor-ground
    phase: read
    match:
      sentence:
        - {slot: subj, type: name, at_start: true, blocks_skipped: indefinite_article}
        - {lit: is}
        - {lit: neither}
        - {slot: l, span: true, span_blocks: [negation, conjunction, preposition, neither_marker]}
        - {lit: nor}
        - {slot: r, span: true, span_blocks: [negation, conjunction, preposition, neither_marker]}
    emits:
      - {fact: atom, entity: "{subj}", pred: "{l}", polarity: false}
      - {fact: atom, entity: "{subj}", pred: "{r}", polarity: false}

  # Stage 9f: the appointive passive — "NAME is/was APPOINTED as PRED"
  # asserts the resulting role as a fact ("was appointed as a referee
  # observer" ⊨ is a referee observer). The verb slot is gated on
  # `appointive_verb` (a SOUNDNESS category: resultative members only,
  # never descriptive 'regarded/described' — see categories/logic.yaml).
  # The pred span keeps any trailing PP in its key ('… after his
  # retirement'); atom_variants' existing PP drop mints the bare role from
  # it, so no new decomposition machinery. The cat gate also makes this
  # rule STRICTLY more specific than the general copular reading on equal
  # consumed units, so the joinless 'appointed as …' phrase-key atom is
  # subsumed away rather than duplicated.
  - id: logic/passive-appointive-as
    phase: read
    match:
      sentence:
        - {slot: subj, type: proper_name, at_start: true, blocks_skipped: indefinite_article}
        - {lit: [is, was]}
        - {slot: v, cat: appointive_verb}
        - {lit: as}
        # the role's article, claimed on purpose (the 9e trailing-period
        # lesson, one skippable over): the general copular rule's span
        # CAPTURES the article while this rule's skip loop jumps it, so
        # without the claim the copular match consumes a strict superset
        # and this rule is silently subsumed at admit_rule_results.
        - opt:
            - {lit: [a, an, the], consume_skipped: true}
        - {slot: pred, span: true, span_blocks: [negation, disjunctive_marker]}
    emits:
      - {fact: atom, entity: "{subj}", pred: "{pred}", polarity: true}

  - id: logic/alias-known-as
    phase: read
    match:
      sentence:
        - {slot: a, type: proper_name, at_start: true, blocks_skipped: indefinite_article}
        - {lit: [is, was]}
        - opt:
            - {lit: also}
        - {lit: known}
        - {lit: as}
        - {slot: b, type: proper_name, blocks_skipped: definite_article}
        # the trailing period, claimed on purpose: the general copular rule's
        # pred SPAN swallows it, so without this token its match consumes a
        # strict SUPERSET of this rule's units and admit_rule_results drops
        # the alias as subsumed. Claiming the same skippable makes the two
        # matches tie — both fire, which is the intent: the copular rule's
        # joinless phrase-key atom is harmless beside the alias fact.
        - opt:
            - {lit: ".", consume_skipped: true}
    emits:
      - {fact: alias, a: "{a}", b: "{b}"}

  - id: logic/ground-copular-is-not
    phase: read
    match:
      sentence:
        - {slot: subj, type: name, at_start: true, blocks_skipped: indefinite_article}
        - {lit: is}
        - {lit: not}
        - {slot: pred, span: true, span_blocks: [negation, disjunctive_marker]}
    emits:
      - {fact: atom, entity: "{subj}", pred: "{pred}", polarity: false}

  - id: logic/ground-copular-was-not
    phase: read
    match:
      sentence:
        - {slot: subj, type: name, at_start: true, blocks_skipped: indefinite_article}
        - {lit: was}
        - {lit: not}
        - {slot: pred, span: true, span_blocks: [negation, disjunctive_marker]}
    emits:
      - {fact: atom, entity: "{subj}", pred: "{pred}", polarity: false}

  # ---- Stage 1: copular if-then conditionals (ROADMAP.md) --------------------
  # "If a X is P, then it/they is/are [not] Q" -> conditional(cls, pred,
  # then_pred, polarity): a class-scoped implication, instantiated by
  # synth/conditional-instantiation over TWO positive atoms. Design rules:
  #   - `at_start` on 'if': an embedded or trailing conditional never fires.
  #   - whole-construction or nothing: 'then' + the pronoun are mandatory
  #     literals, so "unless"/"only if"/comma-only variants leave the WHOLE
  #     sentence unread — monotone-safe (an ignored premise can only miss
  #     entailments, never invent them).
  #   - span_blocks: negation on the ANTECEDENT spans: "If a X is not P ..."
  #     matches nothing (negated antecedents need case analysis — Stage 3).
  #     The consequent's negation is read structurally by the -not variants.
  #   - the indefinite article before cls is auto-skipped (articles are
  #     skippable); a name-subject conditional therefore reads the name as a
  #     CLASS phrase — inert unless a premise asserts membership in it (see
  #     model.Conditional's docstring).
  - id: logic/conditional-is-then-it-is
    phase: read
    match:
      sentence:
        - {lit: if, at_start: true}
        - {slot: cls, span: true, span_blocks: [negation, disjunctive_marker]}
        - {lit: is}
        - {slot: p, span: true, span_blocks: negation}
        - {lit: then}
        - {lit: it}
        - {lit: is}
        - {slot: q, span: true, span_blocks: negation}
    emits:
      - {fact: conditional, cls: "{cls}", pred: "{p}", then_pred: "{q}", polarity: true}

  - id: logic/conditional-is-then-it-is-not
    phase: read
    match:
      sentence:
        - {lit: if, at_start: true}
        - {slot: cls, span: true, span_blocks: [negation, disjunctive_marker]}
        - {lit: is}
        - {slot: p, span: true, span_blocks: negation}
        - {lit: then}
        - {lit: it}
        - {lit: is}
        - {lit: not}
        - {slot: q, span: true, span_blocks: negation}
    emits:
      - {fact: conditional, cls: "{cls}", pred: "{p}", then_pred: "{q}", polarity: false}

  - id: logic/conditional-is-then-they-are
    phase: read
    match:
      sentence:
        - {lit: if, at_start: true}
        - {slot: cls, span: true, span_blocks: [negation, disjunctive_marker]}
        - {lit: is}
        - {slot: p, span: true, span_blocks: negation}
        - {lit: then}
        - {lit: they}
        - {lit: are}
        - {slot: q, span: true, span_blocks: negation}
    emits:
      - {fact: conditional, cls: "{cls}", pred: "{p}", then_pred: "{q}", polarity: true}

  - id: logic/conditional-is-then-they-are-not
    phase: read
    match:
      sentence:
        - {lit: if, at_start: true}
        - {slot: cls, span: true, span_blocks: [negation, disjunctive_marker]}
        - {lit: is}
        - {slot: p, span: true, span_blocks: negation}
        - {lit: then}
        - {lit: they}
        - {lit: are}
        - {lit: not}
        - {slot: q, span: true, span_blocks: negation}
    emits:
      - {fact: conditional, cls: "{cls}", pred: "{p}", then_pred: "{q}", polarity: false}

  # Phase B reader 5: a verbal restrictor with a copular consequence —
  # "If a CLS V P, then it is Q" means forall e, CLS(e) and V(P)(e) -> Q(e).
  # This is the existing Conditional contract with the antecedent predicate
  # rendered exactly like ground-verbal. `single_word` preserves reader 4's
  # key-safety boundary: particle/perfect merges keep only their base lemma
  # under `{v}` and therefore stay unread. Coordination, negation, modals, and
  # a second verb remain separate conditional constructions.
  - id: logic/conditional-verbal-then-it-is
    phase: read
    match:
      sentence:
        - {lit: if, at_start: true}
        - {slot: cls, span: true, span_blocks: [negation, conjunction, disjunctive_marker, verb, future_modal, capacity_modal]}
        - {slot: v, type: nonstate_verb, single_word: true}
        - {slot: p, span: true, span_blocks: [negation, conjunction, disjunctive_marker, verb, future_modal, capacity_modal], span_blocks_counted: true}
        - {lit: then}
        - {lit: it}
        - {lit: is}
        - {slot: q, span: true, span_blocks: [negation, conjunction, disjunctive_marker, verb, future_modal, capacity_modal]}
    emits:
      - {fact: conditional, cls: "{cls}", pred: "{v} {p}", then_pred: "{q}", polarity: true}

  # "If someone is P, then they are [not] Q" — the 1-antecedent degenerate
  # form IS a universal (∀x P(x) → [¬]Q(x)); emit quantified directly so the
  # EXISTING instantiation synth serves it, no new machinery
  - id: logic/conditional-someone-is-then-they-are
    phase: read
    match:
      sentence:
        - {lit: if, at_start: true}
        - {lit: someone}
        - {lit: is}
        - {slot: p, span: true, span_blocks: negation}
        - {lit: then}
        - {lit: they}
        - {lit: are}
        - {slot: q, span: true, span_blocks: negation}
    emits:
      - {fact: quantified, cls: "{p}", pred: "{q}", polarity: true}

  - id: logic/conditional-someone-is-then-they-are-not
    phase: read
    match:
      sentence:
        - {lit: if, at_start: true}
        - {lit: someone}
        - {lit: is}
        - {slot: p, span: true, span_blocks: negation}
        - {lit: then}
        - {lit: they}
        - {lit: are}
        - {lit: not}
        - {slot: q, span: true, span_blocks: negation}
    emits:
      - {fact: quantified, cls: "{p}", pred: "{q}", polarity: false}

  # Phase B reader 7: the someone-form's PLURAL-generic twin — "If people
  # are P, then they are [not] Q". Bare 'people' plays exactly someone's
  # grammatical role (the unrestricted human quantifier; FOLIO-FOL renders
  # both as ∀x P(x) → [¬]Q(x)), so the same degenerate-universal reading
  # applies and the EXISTING quantified fact + instantiation synth serve
  # it, no new machinery. The antecedent/consequent spans mirror the
  # someone rules' guard profile (span_blocks: negation only): passive
  # participial predicates ('criticized by their boss') and coordinated
  # nominal phrases ride as EXACT phrase keys — swallowed conjunctions can
  # only narrow reachability, never loosen a join (the Fiedler
  # discipline). Unlike someone (singular-agreeing, keys render PLAIN),
  # 'people are' is PLURAL-agreeing, so both spans fold `.singular` per
  # the 8d invariant — the 9a lesson: a plural-agreeing key that does not
  # fold can never meet the singular ground atoms it must instantiate.
  # Verbal and do-support consequents ('then they attend …', 'then they
  # do not receive …') are separate constructions and stay whole-unread,
  # monotone-safe.
  - id: logic/conditional-people-are-then-they-are
    phase: read
    match:
      sentence:
        - {lit: if, at_start: true}
        - {lit: people}
        - {lit: are}
        - {slot: p, span: true, span_blocks: negation}
        - {lit: then}
        - {lit: they}
        - {lit: are}
        - {slot: q, span: true, span_blocks: negation}
    emits:
      - {fact: quantified, cls: "{p.singular}", pred: "{q.singular}", polarity: true}

  - id: logic/conditional-people-are-then-they-are-not
    phase: read
    match:
      sentence:
        - {lit: if, at_start: true}
        - {lit: people}
        - {lit: are}
        - {slot: p, span: true, span_blocks: negation}
        - {lit: then}
        - {lit: they}
        - {lit: are}
        - {lit: not}
        - {slot: q, span: true, span_blocks: negation}
    emits:
      - {fact: quantified, cls: "{p.singular}", pred: "{q.singular}", polarity: false}

  # Phase B reader 23: the second-person generic conditional —
  # "If you are a P, then you are a Q". Repeated generic `you` supplies one
  # universally bound variable; it is not discourse anaphora and therefore
  # needs no referent. Requiring both indefinite articles and the overt
  # comma/then boundary keeps the rule on the nominal generic frame. Signed,
  # coordinated, modal, verbal, counted, mixed-person, and comma-less siblings
  # remain whole-unread.
  - id: logic/conditional-generic-you-are-then-you-are
    phase: read
    match:
      sentence:
        - {lit: if, at_start: true}
        - {lit: you}
        - {lit: are}
        - {lit: [a, an], consume_skipped: true}
        - {slot: p, span: true, span_blocks: [negation, quantifier, conjunction, disjunctive_marker, verb, future_modal, capacity_modal], span_blocks_counted: true}
        - {lit: ',', consume_skipped: true}
        - {lit: then}
        - {lit: you}
        - {lit: are}
        - {lit: [a, an], consume_skipped: true}
        - {slot: q, span: true, span_blocks: [negation, quantifier, conjunction, disjunctive_marker, verb, future_modal, capacity_modal], span_blocks_counted: true}
    emits:
      - {fact: quantified, cls: "{p}", pred: "{q}", polarity: true}

  # Phase B reader 22: implicit-restrictor property universals — the dual
  # surfaces "Anything P is Q" (∀x. P→Q) and "No one P is Q"
  # (∀x. P→¬Q). `Anything` and `No one` supply the variable and never enter
  # a key; the property spans render plain because both frames are singular-
  # agreeing. The narrow no-one rule additionally corrects the generic
  # universal-no-is fallback's over-literal `one P` key without changing
  # that older rule's behavior. Signed, relative, modal, verbal,
  # coordinated, disjunctive, and counted siblings stay whole-unread.
  - id: logic/universal-anything-copular
    phase: read
    match:
      sentence:
        - {lit: anything, at_start: true}
        - {slot: p, span: true, span_blocks: [negation, conjunction, disjunctive_marker, verb, future_modal, capacity_modal, complementizer, interrogative, wh_which], span_blocks_counted: true}
        - {lit: is}
        - {slot: q, span: true, span_blocks: [negation, conjunction, disjunctive_marker, verb, future_modal, capacity_modal], span_blocks_counted: true}
    emits:
      - {fact: quantified, cls: "{p}", pred: "{q}", polarity: true}

  - id: logic/universal-no-one-copular
    phase: read
    match:
      sentence:
        - {lit: no, at_start: true}
        - {lit: one}
        - {slot: p, span: true, span_blocks: [negation, conjunction, disjunctive_marker, verb, future_modal, capacity_modal, complementizer, interrogative, wh_which], span_blocks_counted: true}
        - {lit: is}
        - {slot: q, span: true, span_blocks: [negation, conjunction, disjunctive_marker, verb, future_modal, capacity_modal], span_blocks_counted: true}
    emits:
      - {fact: quantified, cls: "{p}", pred: "{q}", polarity: false}

  # Phase B reader 18: the verbal-consequent sibling —
  # "If people are P, then they V Q". Reader 7 established the plural-
  # agreeing antecedent key: P folds to the singular key emitted for a named
  # witness. The bare, single-token non-state consequence head plus its exact
  # predicate renders like ground-verbal, so the existing quantified
  # instantiation synth supplies the join. As in reader 7, coordination may
  # remain inside the antecedent phrase key; it narrows rather than invents a
  # join. Signed antecedents and signed/modal/coordinated/count-bearing or
  # multi-verb consequences stay unread.
  - id: logic/conditional-people-are-then-they-verbal
    phase: read
    match:
      sentence:
        - {lit: if, at_start: true}
        - {lit: people}
        - {lit: are}
        - {slot: p, span: true, span_blocks: negation}
        - {lit: then}
        - {lit: they}
        - {slot: v, type: nonstate_verb, bare_form: true, single_word: true}
        - {slot: q, span: true, span_blocks: [negation, conjunction, disjunctive_marker, verb, future_modal, capacity_modal], span_blocks_counted: true}
    emits:
      - {fact: quantified, cls: "{p.singular}", pred: "{v} {q}", polarity: true}

  # Phase B reader 19: indefinite-generic verbal conditionals —
  # "If a/an CLS V P, [then] they V2 Q". The article licenses a singular
  # generic subject; its event head is third-person singular, while the
  # pronoun consequence takes the plural bare form. Both event keys are flat
  # and echo ground-verbal, so Quantified instantiation supplies composition.
  # Paired explicit-then and comma-only rules cover both skeletons without
  # loosening any semantic span. Signed, modal, stative, coordinated, particle/perfect,
  # and counted variants stay whole-unread.
  - id: logic/conditional-indefinite-verbal-then-they-verbal-then
    phase: read
    match:
      sentence:
        - {lit: if, at_start: true}
        - {lit: [a, an], consume_skipped: true}
        - {slot: cls, span: true, span_blocks: [negation, conjunction, disjunctive_marker, verb, future_modal, capacity_modal]}
        - {slot: v, type: nonstate_verb, single_word: true}
        - {slot: p, span: true, span_blocks: [negation, conjunction, disjunctive_marker, verb, future_modal, capacity_modal], span_blocks_counted: true}
        - {lit: then}
        - {lit: they}
        - {slot: v2, type: nonstate_verb, bare_form: true, single_word: true}
        - {slot: q, span: true, span_blocks: [negation, conjunction, disjunctive_marker, verb, future_modal, capacity_modal], span_blocks_counted: true}
    emits:
      - {fact: quantified, cls: "{v} {p}", pred: "{v2} {q}", polarity: true}

  - id: logic/conditional-indefinite-verbal-comma-they-verbal
    phase: read
    match:
      sentence:
        - {lit: if, at_start: true}
        - {lit: [a, an], consume_skipped: true}
        - {slot: cls, span: true, span_blocks: [negation, conjunction, disjunctive_marker, verb, future_modal, capacity_modal]}
        - {slot: v, type: nonstate_verb, single_word: true}
        - {slot: p, span: true, span_blocks: [negation, conjunction, disjunctive_marker, verb, future_modal, capacity_modal], span_blocks_counted: true}
        - {lit: ',', consume_skipped: true}
        - {lit: they}
        - {slot: v2, type: nonstate_verb, bare_form: true, single_word: true}
        - {slot: q, span: true, span_blocks: [negation, conjunction, disjunctive_marker, verb, future_modal, capacity_modal], span_blocks_counted: true}
    emits:
      - {fact: quantified, cls: "{v} {p}", pred: "{v2} {q}", polarity: true}

  # Phase B reader 27: free-relative consequences on comma-bound
  # indefinite-generic verbal conditionals —
  # "If a/an CLS V P, they V2 what SUBJECT V3 Q". The embedded subject and
  # verb belong to the object phrase headed by `what`; they are preserved in
  # the outer consequence key rather than asserted as another proposition.
  # The explicit segmentation prevents the ordinary consequence span from
  # swallowing an arbitrary second verb. Explicit-then, signed, modal,
  # coordinated, perfect/particle, and counted siblings remain whole-unread.
  - id: logic/conditional-indefinite-verbal-comma-they-verbal-free-relative
    phase: read
    match:
      sentence:
        - {lit: if, at_start: true}
        - {lit: [a, an], consume_skipped: true}
        - {slot: cls, span: true, span_blocks: [negation, conjunction, disjunctive_marker, verb, future_modal, capacity_modal]}
        - {slot: v, type: nonstate_verb, single_word: true}
        - {slot: p, span: true, span_blocks: [negation, conjunction, disjunctive_marker, verb, future_modal, capacity_modal], span_blocks_counted: true}
        - {lit: ',', consume_skipped: true}
        - {lit: they}
        - {slot: v2, type: nonstate_verb, bare_form: true, single_word: true}
        - {lit: what}
        - {slot: embedded_subject, span: true, span_blocks: [negation, conjunction, disjunctive_marker, verb, auxiliary, future_modal, capacity_modal], span_blocks_counted: true}
        - {slot: v3, type: nonstate_verb, single_word: true}
        - {slot: q, span: true, span_blocks: [negation, conjunction, disjunctive_marker, verb, future_modal, capacity_modal], span_blocks_counted: true}
    emits:
      - {fact: quantified, cls: "{v} {p}", pred: "{v2} what {embedded_subject} {v3} {q}", polarity: true}

  # Phase B reader 20: reduced-relative people universals —
  # "People V P are Q". As with reader 7's explicit people conditional,
  # `people` supplies FOLIO's unrestricted human variable rather than a
  # separately asserted class antecedent. The non-state verb and its exact
  # complement therefore form the Quantified class key. The consequence is
  # one blocking whole span. When that span contains one capitalized nominal
  # (the structural proper-name fallback used for demonyms such as
  # "Americans"), the established `.singular` rule folds it to the singular
  # ground/ask spelling. Signed, coordinated, counted, overt-relative, and
  # verbal-consequent siblings remain separate constructions and stay
  # whole-unread.
  - id: logic/universal-people-reduced-relative-copular
    phase: read
    match:
      sentence:
        - {lit: people, at_start: true, blocks_skipped: definite_article}
        - {slot: v, type: nonstate_verb, single_word: true}
        - {slot: p, span: true, span_blocks: [negation, conjunction, disjunctive_marker, verb, future_modal, capacity_modal], span_blocks_counted: true}
        - {lit: are}
        - {slot: q, span: true, span_blocks: [negation, conjunction, disjunctive_marker, verb, future_modal, capacity_modal], span_blocks_counted: true}
    emits:
      - {fact: quantified, cls: "{v} {p.singular}", pred: "{q.singular}", polarity: true}

  # Phase B reader 8: the class-scoped bare-plural copular relative —
  # "CLSs who are P are [not] Q" means ∀e. CLS(e) ∧ P(e) → [¬]Q(e).
  # This is the EXISTING Conditional contract and its two-antecedent
  # instantiation synth: unlike reader 7's unrestricted generic 'people',
  # the overt class must be retained ("pets who are naughty" requires both
  # pet(e) and naughty(e)). All three plural-agreeing positions fold through
  # `.singular`, so their keys meet singular ground atoms. The explicit final
  # 'not' alone owns polarity; negative relatives, verbal relatives,
  # verbal consequences, definite/counted subjects, and singular subjects
  # are separate constructions and stay whole-unread.
  - id: logic/conditional-bare-plural-who-are
    phase: read
    match:
      sentence:
        - {slot: cls, type: bare_plural, at_start: true, blocks_skipped: definite_article}
        - {lit: who}
        - {lit: are}
        - {slot: p, span: true, span_blocks: [negation, disjunctive_marker]}
        - {lit: are}
        - {slot: q, span: true, span_blocks: [negation, disjunctive_marker]}
    emits:
      - {fact: conditional, cls: "{cls.singular}", pred: "{p.singular}", then_pred: "{q.singular}", polarity: true}

  - id: logic/conditional-bare-plural-who-are-not
    phase: read
    match:
      sentence:
        - {slot: cls, type: bare_plural, at_start: true, blocks_skipped: definite_article}
        - {lit: who}
        - {lit: are}
        - {slot: p, span: true, span_blocks: [negation, disjunctive_marker]}
        - {lit: are}
        - {lit: not}
        - {slot: q, span: true, span_blocks: [negation, disjunctive_marker]}
    emits:
      - {fact: conditional, cls: "{cls.singular}", pred: "{p.singular}", then_pred: "{q.singular}", polarity: false}

  # ---- Stage 3: disjunction (ROADMAP.md). Exclusivity is SURFACE-DECIDED,
  # measured from folio DEV golds: bare 'or' is INCLUSIVE ("German or
  # Russian or both" golds True), 'either...or' is EXCLUSIVE (the James
  # minimal pair + the TikTok witness). Negated disjunctive surfaces are
  # UNREAD (scope-ambiguous); disjuncts never decompose (XOR is
  # non-monotone). 'or' is consumed as a LITERAL, so the fragment guard's
  # conjunction-sense veto is satisfied by reading, exactly as designed.
  - id: logic/disj-ground-bare
    phase: read
    match:
      sentence:
        - {slot: subj, type: name, at_start: true, blocks_skipped: indefinite_article}
        - {lit: is}
        - {slot: l, span: true, span_blocks: [negation, conjunction, preposition, either_marker]}
        - {lit: or}
        - {slot: r, span: true, span_blocks: [negation, conjunction, preposition]}
    emits:
      - {fact: disjunction, entity: "{subj}", left: "{l}", right: "{r}", exclusive: false}

  # Phase B reader 16: mixed named possession/event disjunctions —
  # "NAME has P or V Q". Bare `or` carries the established inclusive reading.
  # The stative left branch canonicalizes singular-agreeing `has` to the
  # existing `have P` atom key; the right branch lemma-renders exactly like a
  # named ground-verbal event. Each branch refuses its own larger signed,
  # coordinated, modal, verbal, particle, and counted constructions.
  - id: logic/disj-ground-has-or-verbal
    phase: read
    match:
      sentence:
        - {slot: subj, type: name, at_start: true, blocks_skipped: indefinite_article}
        - {lit: has}
        - {slot: left, span: true, span_blocks: [negation, quantifier, conjunction, disjunctive_marker, either_marker, verb, future_modal, capacity_modal], span_blocks_counted: true}
        - {lit: or}
        - {slot: v, type: nonstate_verb, single_word: true}
        - {slot: right, span: true, span_blocks: [negation, conjunction, disjunctive_marker, verb, future_modal, capacity_modal], span_blocks_counted: true}
    emits:
      - {fact: disjunction, entity: "{subj}", left: "have {left}", right: "{v} {right}", exclusive: false}

  # Stage 9j: the restricted stative-'have' universal — "CLSs that are
  # RESTRICTOR have NP PARTICIPLE at them" ("Speedways that are still
  # being used have races held at them") -> Conditional(cls, restrictor,
  # 'have NP PARTICIPLE'): ∀e. e∈cls ∧ restrictor(e) → have-np(e). The
  # verbal-universal family EXCLUDES state verbs (the be-twin
  # discipline), so stative possession gets its own construction reader
  # with 'have' as skeleton, exactly as the copular family holds 'is'.
  # The anaphoric PP tail ('at them') is CONSUMED as skeleton and kept
  # OUT of the key: the pronoun is grammatically bound to the subject,
  # and its number differs between the universal ('them') and a ground
  # denial ('at it') — keying it would unjoin the pair this rule exists
  # to serve. Both emit keys render through the same path as its ground
  # sibling below, which is the whole join contract.
  - id: logic/conditional-restricted-plural-have-at
    phase: read
    match:
      sentence:
        - {slot: cls, type: proper_name, at_start: true, blocks_skipped: definite_article}
        - {lit: that}
        - {lit: are}
        - {slot: p, span: true, span_blocks: [negation, conjunction, preposition, disjunctive_marker]}
        - {lit: have}
        - {slot: q, span: true, span_blocks: [negation, conjunction, preposition, disjunctive_marker]}
        - {lit: at}
        - {slot: anaph, type: pronoun}
        - opt:
            - {lit: ".", consume_skipped: true}
    emits:
      - {fact: conditional, cls: "{cls.singular}", pred: "{p}", then_pred: "have {q}", polarity: true}

  # Stage 9j: the do-support stative denial — "NAME does not have NP
  # PARTICIPLE at it" ("Islip doesn't have races held at it") -> a
  # NEGATIVE atom whose key echoes the restricted universal's consequent
  # ('have {q}', anaphor consumed unkeyed, same as above). The ground
  # sibling of the restricted-'have' universal; together they are the
  # modus-tollens pair.
  - id: logic/ground-do-not-have-at
    phase: read
    match:
      sentence:
        - {slot: subj, type: name, at_start: true, blocks_skipped: indefinite_article}
        - {lit: does}
        - {lit: not}
        - {lit: have}
        - {slot: q, span: true, span_blocks: [negation, conjunction, preposition, disjunctive_marker]}
        - {lit: at}
        - {slot: anaph, type: pronoun}
        - opt:
            - {lit: ".", consume_skipped: true}
    emits:
      - {fact: atom, entity: "{subj}", pred: "have {q}", polarity: false}

  # Stage 9i: the ground disjunctive conditional — "If NAME is either A
  # or B, then NAME is not (also) C" -> (A(x) ⊕ B(x)) → ¬C(x). The
  # antecedent subject repeats as a name in the consequent; same_lemma
  # pins the two to one entity (a different name in the consequent is a
  # different construction and stays unread). 'also' is grammatical
  # skeleton of the 'not also' surface, claimed by opt (the alias rule's
  # precedent). Only the negative-consequent form is built — it is the
  # form with a buyer; the positive twin waits for its own (the _TOKEN
  # bank discipline).
  - id: logic/conditional-name-either-or-then-is-not
    phase: read
    match:
      sentence:
        - {lit: if, at_start: true}
        - {slot: subj, type: name, blocks_skipped: indefinite_article}
        - {lit: is}
        - {lit: either}
        - {slot: l, span: true, span_blocks: [negation, conjunction, preposition, either_marker]}
        - {lit: or}
        - {slot: r, span: true, span_blocks: [negation, conjunction, preposition]}
        - {lit: then}
        - {slot: subj2, type: name, blocks_skipped: indefinite_article}
        - {lit: is}
        - {lit: not}
        - opt:
            - {lit: also}
        - {slot: c, span: true, span_blocks: [negation, conjunction, preposition]}
    where:
      - {same_lemma: [subj, subj2]}
    emits:
      - {fact: disjunctive_conditional, entity: "{subj}", left: "{l}", right: "{r}", then_pred: "{c}", then_polarity: false, exclusive: true}

  # Phase B reader 6: the negative-antecedent same-entity ground conditional
  # — "If NAME is not P, then NAME is Q" (repeated name, same_lemma-pinned,
  # the 9i precedent). The pronoun surfaces ("then he/she/they is Q") stay
  # unread until coreference is represented as evidence: consuming a literal
  # pronoun as skeleton can misbind it when the antecedent names another
  # entity. Semantics
  # ¬P(e) → Q(e), held by the dedicated GROUND fact — a name must never
  # ride Conditional.cls (that fact is inert without a membership premise;
  # the delphi plan pins the boundary). Whole-construction or nothing:
  # 'not' is consumed as the STRUCTURAL negation, and both spans refuse
  # further negation, coordination, and either/neither marking, so the
  # measured coordinated surfaces (Mike/Emily/Clyde/Thomas/Carol) stay
  # whole-unread. A DIFFERENT name in the consequent is a cross-entity
  # conditional: it fails same_lemma and stays unread. The negative-
  # consequent anaphoric variant ("then they are not paid ...") and the
  # 'she' twin are BANKED — each has no cross-split buyer yet.
  - id: logic/ground-conditional-not-then-name-is
    phase: read
    match:
      sentence:
        - {lit: if, at_start: true}
        - {slot: subj, type: name, blocks_skipped: indefinite_article}
        - {lit: is}
        - {lit: not}
        - {slot: p, span: true, span_blocks: [negation, conjunction, disjunctive_marker, either_marker, neither_marker]}
        - {lit: then}
        - {slot: subj2, type: name, blocks_skipped: indefinite_article}
        - {lit: is}
        - {slot: q, span: true, span_blocks: [negation, conjunction, disjunctive_marker, either_marker, neither_marker]}
    where:
      - {same_lemma: [subj, subj2]}
    emits:
      - {fact: ground_conditional, entity: "{subj}", pred: "{p}", then_pred: "{q}", then_polarity: true}

  - id: logic/disj-ground-either
    phase: read
    match:
      sentence:
        - {slot: subj, type: name, at_start: true, blocks_skipped: indefinite_article}
        - {lit: is}
        - {lit: either}
        - {slot: l, span: true, span_blocks: [negation, conjunction, preposition, either_marker]}
        - {lit: or}
        - {slot: r, span: true, span_blocks: [negation, conjunction, preposition]}
    emits:
      - {fact: disjunction, entity: "{subj}", left: "{l}", right: "{r}", exclusive: true}

  # Phase B reader 1: "X is either [both] A and B, or neither" states a
  # GROUND equivalence A(X) ↔ B(X). It does not assert either predicate by
  # itself; synth/equivalence-* only propagates a polarity supplied by
  # another premise or a reductio hypothesis. Two exact corpus surfaces are
  # admitted: bare "or neither" and the anaphoric "or he/it is neither".
  # A required final period makes both whole-construction-or-nothing: a
  # trailing third conjunct can never be silently ignored. Negation and a
  # second coordination marker inside either predicate fail closed.
  - id: logic/equivalence-ground-both-or-neither
    phase: read
    match:
      sentence:
        - {slot: subj, type: proper_name, at_start: true, blocks_skipped: indefinite_article}
        - {lit: is}
        - {lit: either}
        - opt:
            - {lit: both}
        - {slot: l, span: true, span_blocks: [negation, conjunction, disjunctive_marker, neither_marker]}
        - {lit: and}
        - {slot: r, span: true, span_blocks: [negation, conjunction, disjunctive_marker, neither_marker]}
        - {lit: or}
        - {lit: neither}
        - {lit: ".", consume_skipped: true}
    emits:
      - {fact: equivalence, entity: "{subj}", left: "{l}", right: "{r}"}

  - id: logic/equivalence-ground-both-or-anaphor-neither
    phase: read
    match:
      sentence:
        - {slot: subj, type: proper_name, at_start: true, blocks_skipped: indefinite_article}
        - {lit: is}
        - {lit: either}
        - opt:
            - {lit: both}
        - {slot: l, span: true, span_blocks: [negation, conjunction, disjunctive_marker, neither_marker]}
        - {lit: and}
        - {slot: r, span: true, span_blocks: [negation, conjunction, disjunctive_marker, neither_marker]}
        - {lit: or}
        - {slot: anaph, type: pronoun}
        - {lit: is}
        - {lit: neither}
        - {lit: ".", consume_skipped: true}
    emits:
      - {fact: equivalence, entity: "{subj}", left: "{l}", right: "{r}"}

  # Phase B reader 21: the fully repeated equivalence surface —
  # "X is either both A and B or neither A nor B". The repeated negative
  # branch is not decorative: same_phrase guards prove its two predicates
  # are exactly the positive branch's predicates before the existing
  # Equivalence fact is licensed. Articles are grammatical skeleton and
  # auto-skip; sign, nested coordination, mismatched/swapped repeats, and
  # trailing larger constructions remain whole-unread.
  - id: logic/equivalence-ground-both-or-neither-repeated
    phase: read
    match:
      sentence:
        - {slot: subj, type: proper_name, at_start: true, blocks_skipped: indefinite_article}
        - {lit: is}
        - {lit: either}
        - {lit: both}
        - {slot: l, span: true, span_blocks: [negation, conjunction, disjunctive_marker, neither_marker]}
        - {lit: and}
        - {slot: r, span: true, span_blocks: [negation, conjunction, disjunctive_marker, neither_marker]}
        - {lit: or}
        - {lit: neither}
        - {slot: l2, span: true, span_blocks: [negation, conjunction, disjunctive_marker, neither_marker]}
        - {lit: nor}
        - {slot: r2, span: true, span_blocks: [negation, conjunction, disjunctive_marker, neither_marker]}
        - {lit: ".", consume_skipped: true}
    where:
      - {same_phrase: [l, l2]}
      - {same_phrase: [r, r2]}
    emits:
      - {fact: equivalence, entity: "{subj}", left: "{l}", right: "{r}"}

  - id: logic/qdisj-all-are-bare
    phase: read
    match:
      sentence:
        - {lit: all, at_start: true}
        - {slot: cls, span: true, span_blocks: [negation, disjunctive_marker]}
        - {lit: are}
        - {slot: l, span: true, span_blocks: [negation, conjunction, preposition, either_marker]}
        - {lit: or}
        - {slot: r, span: true, span_blocks: [negation, conjunction, preposition]}
    emits:
      - {fact: quantified_disjunction, cls: "{cls.singular}", left: "{l.singular}", right: "{r.singular}", exclusive: false}

  - id: logic/qdisj-all-are-either
    phase: read
    match:
      sentence:
        - {lit: all, at_start: true}
        - {slot: cls, span: true, span_blocks: [negation, disjunctive_marker]}
        - {lit: are}
        - {lit: either}
        - {slot: l, span: true, span_blocks: [negation, conjunction, preposition, either_marker]}
        - {lit: or}
        - {slot: r, span: true, span_blocks: [negation, conjunction, preposition]}
    emits:
      - {fact: quantified_disjunction, cls: "{cls.singular}", left: "{l.singular}", right: "{r.singular}", exclusive: true}

  - id: logic/qdisj-every-is-bare
    phase: read
    match:
      sentence:
        - {lit: every, at_start: true}
        - {slot: cls, span: true, span_blocks: [negation, disjunctive_marker]}
        - {lit: is}
        - {slot: l, span: true, span_blocks: [negation, conjunction, preposition, either_marker]}
        - {lit: or}
        - {slot: r, span: true, span_blocks: [negation, conjunction, preposition]}
    emits:
      - {fact: quantified_disjunction, cls: "{cls}", left: "{l}", right: "{r}", exclusive: false}

  - id: logic/qdisj-every-is-either
    phase: read
    match:
      sentence:
        - {lit: every, at_start: true}
        - {slot: cls, span: true, span_blocks: [negation, disjunctive_marker]}
        - {lit: is}
        - {lit: either}
        - {slot: l, span: true, span_blocks: [negation, conjunction, preposition, either_marker]}
        - {lit: or}
        - {slot: r, span: true, span_blocks: [negation, conjunction, preposition]}
    emits:
      - {fact: quantified_disjunction, cls: "{cls}", left: "{l}", right: "{r}", exclusive: true}

  # Phase B reader 10: the two-article indefinite-generic disjunction —
  # "A/An CLS is either a/an L or a/an R". This is the disjunctive sibling of
  # universal-indefinite-copular: the leading article marks a generic class,
  # not a named witness, and the singular-agreeing construction keeps all
  # keys plain. The overt `either` carries Stage 3 exclusivity. All three
  # articles are claimed as structural skeleton; requiring the two predicate
  # articles proves both branches are nominal even when their words are
  # unknown. Articleless, negated, coordinated, verbal, prepositional,
  # bare-`or`, and larger disjuncts stay whole-unread.
  - id: logic/qdisj-indefinite-copular-either
    phase: read
    match:
      sentence:
        - {lit: [a, an], at_start: true, consume_skipped: true}
        - {slot: cls, span: true, span_blocks: [negation, conjunction, preposition, disjunctive_marker, verb]}
        - {lit: is}
        - {lit: either}
        - {lit: [a, an], consume_skipped: true}
        - {slot: l, span: true, span_blocks: [negation, conjunction, preposition, either_marker, verb]}
        - {lit: or}
        - {lit: [a, an], consume_skipped: true}
        - {slot: r, span: true, span_blocks: [negation, conjunction, preposition, disjunctive_marker, verb]}
    emits:
      - {fact: quantified_disjunction, cls: "{cls}", left: "{l}", right: "{r}", exclusive: true}

  # Phase B reader 28: the inclusive two-article indefinite-generic
  # disjunction — "A/An CLS is a/an L or a/an R". This is reader 10's bare-
  # `or` sibling: the three articles still prove a generic nominal class and
  # two nominal branches, but the missing `either` selects Stage 3's inclusive
  # semantics. Each structural article is consumed even when its noun is
  # unknown. Signed, coordinated, verbal, prepositional, articleless,
  # either-marked, and larger disjuncts remain whole-unread.
  - id: logic/qdisj-indefinite-copular-bare
    phase: read
    match:
      sentence:
        - {lit: [a, an], at_start: true, consume_skipped: true}
        - {slot: cls, span: true, span_blocks: [negation, conjunction, preposition, disjunctive_marker, verb]}
        - {lit: is}
        - {lit: [a, an], consume_skipped: true}
        - {slot: l, span: true, span_blocks: [negation, conjunction, preposition, either_marker, verb]}
        - {lit: or}
        - {lit: [a, an], consume_skipped: true}
        - {slot: r, span: true, span_blocks: [negation, conjunction, preposition, disjunctive_marker, verb]}
    emits:
      - {fact: quantified_disjunction, cls: "{cls}", left: "{l}", right: "{r}", exclusive: false}

  # Phase B reader 9: restricted-pronominal quantified disjunctions —
  # "Everyone RESTRICTION is [either] L or R". `Everyone` supplies the
  # universal variable; the non-empty restriction is its joinable antecedent
  # predicate ("at the event" joins the ground atom from "Rex is at the
  # event"). Reuse QuantifiedDisjunction and its existing instantiation/case
  # analysis synths. As throughout Stage 3, bare `or` is inclusive and overt
  # `either` is exclusive. Negated, coordinated, verbal, three-way, `who`,
  # and unrestricted surfaces fail the exact construction and stay unread.
  - id: logic/qdisj-everyone-restricted-is-bare
    phase: read
    match:
      sentence:
        - {lit: everyone, at_start: true}
        - {slot: cls, span: true, span_blocks: [negation, conjunction, disjunctive_marker, verb, future_modal, capacity_modal]}
        - {lit: is}
        - {slot: l, span: true, span_blocks: [negation, conjunction, preposition, either_marker, verb]}
        - {lit: or}
        - {slot: r, span: true, span_blocks: [negation, conjunction, preposition, disjunctive_marker, verb]}
    emits:
      - {fact: quantified_disjunction, cls: "{cls}", left: "{l}", right: "{r}", exclusive: false}

  - id: logic/qdisj-everyone-restricted-is-either
    phase: read
    match:
      sentence:
        - {lit: everyone, at_start: true}
        - {slot: cls, span: true, span_blocks: [negation, conjunction, disjunctive_marker, verb, future_modal, capacity_modal]}
        - {lit: is}
        - {lit: either}
        - {slot: l, span: true, span_blocks: [negation, conjunction, preposition, either_marker, verb]}
        - {lit: or}
        - {slot: r, span: true, span_blocks: [negation, conjunction, preposition, disjunctive_marker, verb]}
    emits:
      - {fact: quantified_disjunction, cls: "{cls}", left: "{l}", right: "{r}", exclusive: true}

  # Stage 9d: the RESTRICTED bare-plural exclusive disjunction — "CLSs
  # <restrictor> are either A or B" ("Vehicles produced by Chevrolet in this
  # batch are either cars or vans"). The banked "bare-plural disjunctive
  # premises" fix, landed with its first measured buyer: its effect is
  # READING (the fragment guard's veto lifts for the story), the 8g
  # precedent's fourth occurrence. The restrictor span rides INSIDE the cls
  # key — a universal's antecedent is downward-monotone, so the restriction
  # may never be dropped there, only carried verbatim. The subject is the
  # same `bare_plural` unit as the Stage 8 universals (counted/possessive/
  # definite subjects refused for the same reasons); the restrictor must
  # capture something meaningful, so the UNRESTRICTED form ("Dogs are either
  # wet or dry") stays unread — no measured buyer, and a separate rule the
  # day one appears.
  - id: logic/qdisj-bare-plural-restricted-either
    phase: read
    match:
      sentence:
        - {slot: cls, type: bare_plural, at_start: true, blocks_skipped: definite_article}
        - {slot: rest, span: true, span_blocks: [negation, disjunctive_marker, either_marker]}
        - {lit: are}
        - {lit: either}
        - {slot: l, span: true, span_blocks: [negation, conjunction, preposition, either_marker]}
        - {lit: or}
        - {slot: r, span: true, span_blocks: [negation, conjunction, preposition]}
    emits:
      - {fact: quantified_disjunction, cls: "{cls.singular} {rest}", left: "{l.singular}", right: "{r.singular}", exclusive: true}

  # Phase B reader 2: the Stage 8 banked UNRESTRICTED bare-plural family now
  # has one buyer on each grouped split ("Bananas are grasses or fruits";
  # "Events are either happy or sad"). The same bare_plural slot that guards
  # ordinary generic universals refuses counted, qualified, possessive, and
  # definite subjects. Bare 'or' remains inclusive; overt 'either' remains
  # exclusive under Stage 3's measured surface contract. Each disjunct is one
  # positive predicate span; negation and larger coordination fail closed.
  - id: logic/qdisj-bare-plural-unrestricted-bare
    phase: read
    match:
      sentence:
        - {slot: cls, type: bare_plural, at_start: true, blocks_skipped: definite_article}
        - {lit: are}
        - {slot: l, span: true, span_blocks: [negation, conjunction, preposition, either_marker]}
        - {lit: or}
        - {slot: r, span: true, span_blocks: [negation, conjunction, preposition]}
    emits:
      - {fact: quantified_disjunction, cls: "{cls.singular}", left: "{l.singular}", right: "{r.singular}", exclusive: false}

  - id: logic/qdisj-bare-plural-unrestricted-either
    phase: read
    match:
      sentence:
        - {slot: cls, type: bare_plural, at_start: true, blocks_skipped: definite_article}
        - {lit: are}
        - {lit: either}
        - {slot: l, span: true, span_blocks: [negation, conjunction, preposition, either_marker]}
        - {lit: or}
        - {slot: r, span: true, span_blocks: [negation, conjunction, preposition]}
    emits:
      - {fact: quantified_disjunction, cls: "{cls.singular}", left: "{l.singular}", right: "{r.singular}", exclusive: true}

  # Phase B reader 14: future-event generic disjunctions —
  # "CLSs will either V P or V2 Q". The plural class and both bare,
  # single-token event verbs preserve the same keys as ground-verbal facts;
  # `will` contributes tense but not a separate predicate key. Explicit
  # `either` carries the established exclusive reading. Signed, coordinated,
  # modal-internal, perfect/particle, counted, and three-way branches refuse.
  - id: logic/qdisj-bare-plural-future-events-either
    phase: read
    match:
      sentence:
        - {slot: cls, type: bare_plural, at_start: true, blocks_skipped: definite_article}
        - {lit: will}
        - {lit: either}
        - {slot: v1, type: nonstate_verb, bare_form: true, single_word: true}
        - {slot: p1, span: true, span_blocks: [negation, conjunction, disjunctive_marker, verb, future_modal, capacity_modal], span_blocks_counted: true}
        - {lit: or}
        - {slot: v2, type: nonstate_verb, bare_form: true, single_word: true}
        - {slot: p2, span: true, span_blocks: [negation, conjunction, disjunctive_marker, verb, future_modal, capacity_modal], span_blocks_counted: true}
    emits:
      - {fact: quantified_disjunction, cls: "{cls.singular}", left: "{v1} {p1}", right: "{v2} {p2}", exclusive: true}

  # ---- Stage 4: quantifier morphology + existentials (ROADMAP.md) -----------
  # 'any' is an ARTICLE (difg-mined) — auto-skipped, so an ordinary lit can
  # never see it; `consume_skipped` (schemas.MatchToken) stops the skip AT
  # the word and claims it. 'each' is a plain quantifier lit. 'everyone' is
  # a difg pronoun, matched as a lit (never in a span — a captured pronoun
  # renders as its antecedent). 'some' rules CONSUME the quantifier, which
  # relaxes the fragment guard's veto for exactly these sentences — by
  # capability, never by editing the guard.
  - id: logic/universal-any-is
    phase: read
    match:
      sentence:
        - {lit: any, at_start: true, consume_skipped: true}
        - {slot: cls, span: true, span_blocks: [negation, disjunctive_marker]}
        - {lit: is}
        - {slot: pred, span: true, span_blocks: [negation, disjunctive_marker]}
    emits:
      - {fact: quantified, cls: "{cls}", pred: "{pred}", polarity: true}

  - id: logic/universal-any-are
    phase: read
    match:
      sentence:
        - {lit: any, at_start: true, consume_skipped: true}
        - {slot: cls, span: true, span_blocks: [negation, disjunctive_marker]}
        - {lit: are}
        - {slot: pred, span: true, span_blocks: [negation, disjunctive_marker]}
    emits:
      - {fact: quantified, cls: "{cls.singular}", pred: "{pred.singular}", polarity: true}

  - id: logic/universal-each-is
    phase: read
    match:
      sentence:
        - {lit: each, at_start: true}
        - {slot: cls, span: true, span_blocks: [negation, disjunctive_marker]}
        - {lit: is}
        - {slot: pred, span: true, span_blocks: [negation, disjunctive_marker]}
    emits:
      - {fact: quantified, cls: "{cls}", pred: "{pred}", polarity: true}

  - id: logic/universal-each-are
    phase: read
    match:
      sentence:
        - {lit: each, at_start: true}
        - {slot: cls, span: true, span_blocks: [negation, disjunctive_marker]}
        - {lit: are}
        - {slot: pred, span: true, span_blocks: [negation, disjunctive_marker]}
    emits:
      - {fact: quantified, cls: "{cls.singular}", pred: "{pred.singular}", polarity: true}

  - id: logic/universal-everyone-who-is
    phase: read
    match:
      sentence:
        - {lit: everyone, at_start: true}
        - {lit: who}
        - {lit: is}
        - {slot: p, span: true, span_blocks: [negation, disjunctive_marker]}
        - {lit: is}
        - {slot: q, span: true, span_blocks: [negation, disjunctive_marker]}
    emits:
      - {fact: quantified, cls: "{p}", pred: "{q}", polarity: true}

  - id: logic/universal-everyone-who-is-not
    phase: read
    match:
      sentence:
        - {lit: everyone, at_start: true}
        - {lit: who}
        - {lit: is}
        - {slot: p, span: true, span_blocks: [negation, disjunctive_marker]}
        - {lit: is}
        - {lit: not}
        - {slot: q, span: true, span_blocks: [negation, disjunctive_marker]}
    emits:
      - {fact: quantified, cls: "{p}", pred: "{q}", polarity: false}

  # Phase B reader 4: the verbal sibling — "Everyone who V P V2 Q" is the
  # universal implication V(P) -> V2(Q). Quantified.cls intentionally holds
  # the antecedent predicate key; ground-verbal emits that same flat key for
  # named witnesses, so the existing universal-instantiation synth composes
  # without a new fact type. Both spans block verbs to expose the one clause
  # boundary, and block coordination/negation so multi-antecedent, modal, and
  # signed relatives remain separate constructions.
  - id: logic/universal-everyone-who-verbal
    phase: read
    match:
      sentence:
        - {lit: everyone, at_start: true}
        - {lit: who}
        - {slot: v, type: nonstate_verb, single_word: true}
        - {slot: p, span: true, span_blocks: [negation, conjunction, disjunctive_marker, verb, future_modal, capacity_modal], span_blocks_counted: true}
        - {slot: v2, type: nonstate_verb, single_word: true}
        - {slot: q, span: true, span_blocks: [negation, conjunction, disjunctive_marker, verb, future_modal, capacity_modal], span_blocks_counted: true}
    emits:
      - {fact: quantified, cls: "{v} {p}", pred: "{v2} {q}", polarity: true}

  # Phase B reader 25: active reduced-relative possessive universals —
  # "Everyone V-ing P has Q" means V(P) -> have(Q). The opt-in present-
  # participle gate distinguishes the non-finite restrictor from a finite
  # verbal clause; its lemma-rendered key echoes named ground-verbal facts.
  # The possessive consequence deliberately stays the narrow literal `has`
  # sibling of reader 17, so modal, negative, verbal, passive, coordinated,
  # particle/perfect, and counted constructions remain whole-unread.
  - id: logic/universal-everyone-participial-has
    phase: read
    match:
      sentence:
        - {lit: everyone, at_start: true}
        - {slot: v, type: nonstate_verb, single_word: true, present_participle: true}
        - {slot: p, span: true, span_blocks: [negation, quantifier, conjunction, disjunctive_marker, either_marker, verb, future_modal, capacity_modal, interrogative, complementizer, wh_which], span_blocks_counted: true}
        - {lit: has}
        - {slot: q, span: true, span_blocks: [negation, quantifier, conjunction, disjunctive_marker, either_marker, verb, future_modal, capacity_modal], span_blocks_counted: true}
    emits:
      - {fact: quantified, cls: "{v} {p}", pred: "have {q}", polarity: true}

  # Phase B reader 30: named-PP existential premises —
  # "There is a/an CLS PREPOSITION NAME". `there` contributes existence,
  # never an entity; the noun and name slots give the indefinite NP and PP
  # exact boundaries without splitting a free span. A claimed terminal period
  # rejects relative/passive tails. Plural copulas, non-indefinite determiners,
  # signed/coordinated classes, common/count objects, and larger clauses stay
  # whole-unread.
  - id: logic/existential-there-is-indefinite-named-pp
    phase: read
    match:
      sentence:
        - {lit: there, at_start: true}
        - {lit: is}
        - {lit: [a, an], consume_skipped: true}
        - {slot: cls, type: noun}
        - {slot: prep, type: preposition}
        - {slot: obj, type: name}
        - {lit: ".", consume_skipped: true}
    emits:
      - {fact: existential, cls: "{cls}", pred: "{prep} {obj}", polarity: true}

  # Phase B reader 31: direct passive named-agent premises —
  # "The PATIENT is V-ed by NAME" is the active relation V(NAME, PATIENT).
  # The definite article and terminal period claim the whole construction;
  # the bounded patient span permits multi-unit product/place names without
  # treating their incomplete lexical tagging as grammar. The opt-in past-
  # participle gate is the voice evidence: finite/bare verbs after `is` do
  # not match. Only a named, definite agent is represented; indefinite or
  # common-noun agents require existential/reference machinery and remain
  # unread, as do signed, coordinated, modal, perfect, and PP-tail siblings.
  - id: logic/passive-dobj-definite-patient-named-agent
    phase: read
    match:
      sentence:
        - {lit: the, at_start: true, consume_skipped: true}
        - {slot: patient, span: true, span_blocks: [negation, quantifier, conjunction, disjunctive_marker, either_marker, verb, preposition, future_modal, capacity_modal, interrogative, complementizer, wh_which], span_blocks_counted: true}
        - {lit: is}
        - {slot: v, type: nonstate_verb, single_word: true, past_participle: true}
        - {lit: by}
        - {slot: agent, type: name}
        - {lit: ".", consume_skipped: true}
    emits:
      - {fact: verbal_relation, entity: "{agent}", verb: "{v}", obj: "{patient}", polarity: true}

  - id: logic/existential-some-are
    phase: read
    match:
      sentence:
        - {lit: some, at_start: true}
        - {slot: cls, span: true, span_blocks: [negation, disjunctive_marker]}
        - {lit: are}
        - {slot: pred, span: true, span_blocks: [negation, disjunctive_marker]}
    emits:
      - {fact: existential, cls: "{cls.singular}", pred: "{pred.singular}", polarity: true}

  - id: logic/existential-some-are-not
    phase: read
    match:
      sentence:
        - {lit: some, at_start: true}
        - {slot: cls, span: true, span_blocks: [negation, disjunctive_marker]}
        - {lit: are}
        - {lit: not}
        - {slot: pred, span: true, span_blocks: [negation, disjunctive_marker]}
    emits:
      - {fact: existential, cls: "{cls.singular}", pred: "{pred.singular}", polarity: false}

  # Stage 9f: the VERBAL existential premise — "Some CLS <v> <obj>" ("Some
  # football referees become referee observers"). The copular 'some' pair
  # above already consumed its quantifier; this is the same reading for a
  # verbal predicate, mirroring the verbal universal's construction
  # exactly: the cls span blocks verbs (so it cannot swallow the verb and
  # fall back to a junk copular parse), `bare_form` on the verb is the
  # plural-agreement signal, and the object span does NOT fold (the 8f
  # unfolded-render contract — it must mirror the embedded-verbal ask's
  # render or the keys drift). cls folds, exactly like the copular pair.
  - id: logic/existential-some-verbal
    phase: read
    match:
      sentence:
        - {lit: some, at_start: true}
        - {slot: cls, span: true, span_blocks: [negation, disjunctive_marker, verb], span_blocks_counted: true}
        - {slot: v, type: nonstate_verb, bare_form: true}
        - {slot: p, span: true, span_blocks: [negation, disjunctive_marker, verb], span_blocks_counted: true}
    emits:
      - {fact: existential, cls: "{cls.singular}", pred: "{v} {p}", polarity: true}

  # ---- Stage 6: the VERBAL frontier (re-landed from v1, hazards designed out)
  # - v slot `type: nonstate_verb`: 'is'/'was' stay copular (the 'be'-twin).
  # - the verbal universal's pred span BLOCKS verb-sensed words, so a
  #   participial cls ("All students TRAINED by Yale are smart") fails here
  #   and falls to the copular rule, which reads cls='students trained by
  #   yale' as a phrase key — the v1 missplit is structurally impossible.
  # - `span_blocks_counted`: merged counted nouns ('3 apples') stay the
  #   FOLD's — a consumed sentence suppresses fold facts, and arithmetic in
  #   the scratch registry must keep its Quantities. Bare values pass
  #   ('published a book in 1946').
  # - atom preds are 'v-lemma + span' ('publish book in 1946') — tense
  #   collapses via the verb lemma, matching FOLIO's tenseless FOL
  #   (measured, the campaign's tense probe).
  - id: logic/ground-verbal
    phase: read
    match:
      sentence:
        - {slot: subj, type: name, at_start: true, blocks_skipped: indefinite_article}
        - {slot: v, type: nonstate_verb}
        - {slot: p, span: true, span_blocks: [negation, disjunctive_marker], span_blocks_counted: true}
    emits:
      - {fact: atom, entity: "{subj}", pred: "{v} {p}", polarity: true}

  # ---- S2: conjunctive SUBJECTS distribute over a copular pred -------------
  # "Oxford Street and Regent Street are in London" ⊢ in-london(os) ∧
  # in-london(rs). Distribution is sound for distributive predicates and
  # WRONG for collectives ("Ann and Bob are A TEAM" — neither is a team);
  # the structural gate is the collective's own signal: a collective
  # predicate takes the indefinite article ('a team', 'a couple'), a
  # distributive one never does ('teachers', 'in London', 'famous') — so
  # the pred refuses the article BOTH ways an article can ride: on the
  # span's LEADING EDGE (blocks_skipped — the pre-token skip loop advances
  # past it before capture, the Phase 0 asymmetry) and in its interior
  # (span_blocks — captured skippables are block-checked). The collective
  # surface stays unread (monotone-safe; the fragment guard keeps vetoing
  # its story). Exactly two name conjuncts; longer lists stay unread.
  - id: logic/ground-copular-conj-subjects
    phase: read
    match:
      sentence:
        - {slot: s1, type: name, at_start: true, blocks_skipped: indefinite_article}
        - {lit: and}
        - {slot: s2, type: name}
        - {lit: are}
        - {slot: pred, span: true, span_blocks: [negation, disjunctive_marker, indefinite_article], blocks_skipped: indefinite_article}
    emits:
      - {fact: atom, entity: "{s1}", pred: "{pred}", polarity: true}
      - {fact: atom, entity: "{s2}", pred: "{pred}", polarity: true}

  # ---- S1 (composition-design.md): ACTIVE relative-clause predication ------
  # "Ailton Silva is a Brazilian footballer WHO PLAYS FOR Náutico" — the
  # restrictive relative also PREDICATES of the subject: VR('ailton silva',
  # 'play', 'for', 'náutico'). Fires BESIDE ground-copular-is (which still
  # emits the full phrase-keyed atom + Stage 2.1's drops). Active clauses
  # only: 'was/is' after 'who' fails the nonstate_verb slot, so PASSIVE
  # relatives ("who was loaned out to Braga") stay unread here — the
  # passive-relative form is its own deferred increment (phrasal particles
  # + a recipient bridge). A second PP in the obj span refuses (whole-
  # construction-or-nothing; the copular atom still reads the sentence).
  - id: logic/relative-verbal-pp
    phase: read
    match:
      sentence:
        - {slot: subj, type: name, at_start: true, blocks_skipped: indefinite_article}
        - {lit: is}
        - {slot: cls, span: true, span_blocks: [negation, disjunctive_marker]}
        - {lit: who}
        - {slot: v, type: nonstate_verb}
        - {slot: prep, type: preposition}
        - {slot: obj, span: true, span_blocks: [negation, disjunctive_marker, preposition], span_blocks_counted: true}
    emits:
      - {fact: verbal_relation, entity: "{subj}", verb: "{v}", prep: "{prep}", obj: "{obj}", polarity: true}

  # ---- S2 (composition-design.md): the structured verbal relation ----------
  # Emitted BESIDE ground-verbal's flat atom (both rules fire; the flat key
  # stays echo-exact and untouched). The obj span additionally blocks
  # PREPOSITIONS: this rule reads DIRECT objects only ("designed Oxford
  # Circus"), and a PP tail ("designed a construction ON Regent Street")
  # falls back to the flat atom alone — whole-construction-or-nothing, so
  # a mis-segmented object can never exist. Segmentation by match tokens,
  # never key surgery (§2.1).
  - id: logic/verbal-relation-dobj
    phase: read
    match:
      sentence:
        - {slot: subj, type: name, at_start: true, blocks_skipped: indefinite_article}
        - {slot: v, type: nonstate_verb}
        - {slot: obj, span: true, span_blocks: [negation, disjunctive_marker, preposition], span_blocks_counted: true}
    emits:
      - {fact: verbal_relation, entity: "{subj}", verb: "{v}", obj: "{obj}", polarity: true}

  # Phase B reader 13: named ground do-support event denials —
  # "NAME does not V P". Do-support supplies the bare event verb while the
  # explicit negator owns the Atom polarity. The event and predicate render
  # exactly like ground-verbal, preserving echo and universal joins. State,
  # modal, particle/perfect, coordinated, counted, and multi-verb surfaces
  # fail the structural gates and remain whole-unread.
  - id: logic/ground-verbal-does-not
    phase: read
    match:
      sentence:
        - {slot: subj, type: name, at_start: true, blocks_skipped: indefinite_article}
        - {lit: does}
        - {lit: not}
        - {slot: v, type: nonstate_verb, bare_form: true, single_word: true}
        - {slot: pred, span: true, span_blocks: [negation, conjunction, disjunctive_marker, verb, future_modal, capacity_modal], span_blocks_counted: true}
    emits:
      - {fact: atom, entity: "{subj}", pred: "{v} {pred}", polarity: false}

  - id: logic/universal-verbal-all
    phase: read
    match:
      sentence:
        - {lit: all, at_start: true}
        - {slot: cls, span: true, span_blocks: [negation, disjunctive_marker]}
        - {slot: v, type: nonstate_verb}
        - {slot: p, span: true, span_blocks: [negation, disjunctive_marker, verb], span_blocks_counted: true}
    emits:
      # `{cls.singular}` for the same reason universal-copular-all-are folds
      # (Stage 8d): 'All' + a bare verb is the PLURAL-AGREEING construction, so
      # its restrictor is plural by grammar ('All CITIZENS of Lawton Park use
      # ...') while every ground fact naming that class is singular ('Tom is a
      # CITIZEN of Lawton Park'). The fold is symmetric across the family --
      # 'every'/'each' below take a SINGULAR restrictor and must never fold
      # (it would truncate an s-final singular: 'every species' -> 'specie').
      - {fact: quantified, cls: "{cls.singular}", pred: "{v} {p}", polarity: true}

  - id: logic/universal-verbal-every
    phase: read
    match:
      sentence:
        - {lit: every, at_start: true}
        - {slot: cls, span: true, span_blocks: [negation, disjunctive_marker]}
        - {slot: v, type: nonstate_verb}
        - {slot: p, span: true, span_blocks: [negation, disjunctive_marker, verb], span_blocks_counted: true}
    emits:
      - {fact: quantified, cls: "{cls}", pred: "{v} {p}", polarity: true}

asks:
  # ---- asks: the FOLIO wrapper + an embedded declarative -------------------
  # The wrapper tokens are matched as literals — 'true' needs no sense for
  # that (it is in this pack's lexicon as an ADJECTIVE purely so no noun
  # sense can ever resurrect the is-membership shadow parse, Phase 0a).
  # The final span runs to the question's end BY CONSTRUCTION (a final span
  # must reach the sentence end), and the consumer verifies full consumption,
  # so "Is it true that Mary is a student AT YALE?" can never answer about
  # Mary-the-student-generally.
  # ---- Stage 3: disjunctive conclusions. The copular asks' pred spans REFUSE
  # the disjunctive marker (span_blocks), so an or-question is matched by
  # these asks ALONE — no ranking contest. (An id-order tie-break was tried
  # first and was the wrong mechanism: the copular span consumes MORE units
  # (articles/punct), so it OUTRANKED rather than tied. Exclusion beats
  # ordering.) Pinned by test_disjunctive_question_routes_to_its_consumer.
  # ---- Stage 4: existential conclusions --------------------------------------
  # ---- Stage 6: verbal conclusions -------------------------------------------
  - id: ask/logic-embedded-verbal
    match:
      question:
        - {lit: is, at_start: true}
        - {lit: it}
        - {lit: 'true'}
        - {lit: that}
        - {slot: subj, type: name, blocks_skipped: indefinite_article}
        - {slot: v, type: nonstate_verb}
        - {slot: p, span: true, span_blocks: [negation, disjunctive_marker], span_blocks_counted: true}
    resolves:
      consumer: logic-verdict
      entity: "{subj}"
      pred: "{v} {p}"
      polarity: "true"

  # the user-example form: "Is it true that A Czech published a book in
  # 1946?" — an EXISTENTIAL (the indefinite marks it; consume_skipped stops
  # the article skip at 'a'/'an'), answered by the existential-verdict
  # consumer's WITNESS search: an entity holding atom(e, cls) and
  # atom(e, 'v p'). Reuses the Stage 4 consumer verbatim.
  #
  # 'a'/'an' is ALLOMORPHY — one article with two surfaces chosen by the
  # following sound — so it is one alternation, not two asks. It is also the
  # case a category could not serve: both are article-sensed, but `article` is
  # a SKIPPABLE sense, so a gated slot would be skipped past rather than
  # matched. `consume_skipped` on the literal is the only thing that can stop
  # the skip AT the article, and it now claims whichever surface is present.
  - id: ask/logic-existential-verbal
    match:
      question:
        - {lit: is, at_start: true}
        - {lit: it}
        - {lit: 'true'}
        - {lit: that}
        - {lit: [a, an], consume_skipped: true}
        - {slot: cls, span: true, span_blocks: [negation, disjunctive_marker]}
        - {slot: v, type: nonstate_verb}
        - {slot: p, span: true, span_blocks: [negation, disjunctive_marker], span_blocks_counted: true}
    resolves:
      consumer: existential-verdict
      cls: "{cls}"
      pred: "{v} {p}"
      polarity: "true"

  - id: ask/logic-existential-some-are
    match:
      question:
        - {lit: is, at_start: true}
        - {lit: it}
        - {lit: 'true'}
        - {lit: that}
        - {lit: some}
        - {slot: cls, span: true, span_blocks: [negation, disjunctive_marker]}
        - {lit: are}
        - {slot: pred, span: true, span_blocks: [negation, disjunctive_marker]}
    resolves:
      consumer: existential-verdict
      cls: "{cls.singular}"
      pred: "{pred.singular}"
      polarity: "true"

  - id: ask/logic-existential-some-are-not
    match:
      question:
        - {lit: is, at_start: true}
        - {lit: it}
        - {lit: 'true'}
        - {lit: that}
        - {lit: some}
        - {slot: cls, span: true, span_blocks: [negation, disjunctive_marker]}
        - {lit: are}
        - {lit: not}
        - {slot: pred, span: true, span_blocks: [negation, disjunctive_marker]}
    resolves:
      consumer: existential-verdict
      cls: "{cls.singular}"
      pred: "{pred.singular}"
      polarity: "false"

  # ---- universal conclusions: "Is it true that all/no CLS are PRED?" ---------
  # The consumer (universal-verdict) reads the SATURATED Quantified closure:
  # yes from an echo or synth/universal-chain fact at the claimed polarity;
  # no ONLY from a counterexample WITNESS (an entity in the class holding the
  # pred at the opposite polarity) — never from the opposite universal alone,
  # which would smuggle existential import into FOL-verified golds (both
  # universals are vacuously true over an empty class). "All X are not Y"
  # stays unread by span_blocks: negation — ∀¬-vs-¬∀ scope is genuinely
  # per-item in FOLIO (the v1 revert's 'All X are not Y' lesson).
  # The quantifier lits match the wrapper's CAPITALIZED 'All'/'No' because a
  # quantifier-sensed word is exempt from capitalization-naming (senses.py).
  - id: ask/logic-universal-all-are
    match:
      question:
        - {lit: is, at_start: true}
        - {lit: it}
        - {lit: 'true'}
        - {lit: that}
        - {lit: all}
        - {slot: cls, span: true, span_blocks: [negation, disjunctive_marker]}
        - {lit: are}
        - {slot: pred, span: true, span_blocks: [negation, disjunctive_marker]}
    resolves:
      consumer: universal-verdict
      cls: "{cls.singular}"
      pred: "{pred.singular}"
      polarity: "true"

  - id: ask/logic-universal-all-is
    match:
      question:
        - {lit: is, at_start: true}
        - {lit: it}
        - {lit: 'true'}
        - {lit: that}
        - {lit: all}
        - {slot: cls, span: true, span_blocks: [negation, disjunctive_marker]}
        - {lit: is}
        - {slot: pred, span: true, span_blocks: [negation, disjunctive_marker]}
    resolves:
      consumer: universal-verdict
      cls: "{cls}"
      pred: "{pred}"
      polarity: "true"

  - id: ask/logic-universal-no-are
    match:
      question:
        - {lit: is, at_start: true}
        - {lit: it}
        - {lit: 'true'}
        - {lit: that}
        - {lit: 'no'}
        - {slot: cls, span: true, span_blocks: [negation, disjunctive_marker]}
        - {lit: are}
        - {slot: pred, span: true, span_blocks: [negation, disjunctive_marker]}
    resolves:
      consumer: universal-verdict
      cls: "{cls.singular}"
      pred: "{pred.singular}"
      polarity: "false"

  - id: ask/logic-universal-no-is
    match:
      question:
        - {lit: is, at_start: true}
        - {lit: it}
        - {lit: 'true'}
        - {lit: that}
        - {lit: 'no'}
        - {slot: cls, span: true, span_blocks: [negation, disjunctive_marker]}
        - {lit: is}
        - {slot: pred, span: true, span_blocks: [negation, disjunctive_marker]}
    resolves:
      consumer: universal-verdict
      cls: "{cls}"
      pred: "{pred}"
      polarity: "false"

  # ---- Stage 8b: the VERBAL 'some' conclusion — "Is it true that Some CLS
  # <verb> P?" ("Some soccer team holds the Lithuanian Super Cup", gold True
  # — the measured buyer; its witness is a ground-verbal atom + a copular
  # membership). Reuses the Stage 4 existential-verdict consumer verbatim:
  # yes from a WITNESS entity holding atom(e, cls) ∧ atom(e, 'v p'), no only
  # from a refuting negative universal, else undetermined. The v slot's
  # nonstate_verb gate keeps do-support negation OUT ("Some pets DO not have
  # fur" — 'do' is not verb-sensed, the sentence stays unread; pinned).
  - id: ask/logic-existential-some-verbal
    match:
      question:
        - {lit: is, at_start: true}
        - {lit: it}
        - {lit: 'true'}
        - {lit: that}
        - {lit: some}
        - {slot: cls, span: true, span_blocks: [negation, disjunctive_marker]}
        - {slot: v, type: nonstate_verb}
        - {slot: p, span: true, span_blocks: [negation, disjunctive_marker], span_blocks_counted: true}
    resolves:
      consumer: existential-verdict
      cls: "{cls}"
      pred: "{v} {p}"
      polarity: "true"

  # ---- S2 (composition-design.md): the passive-agent conclusion -----------
  # "Is it true that Oxford Circus is designed by a British architect?" —
  # answered by the MEMBERSHIP BRIDGE (∃-intro over the agent, sound for
  # any verb): a VerbalRelation whose obj is the subject and whose agent
  # holds the class atom (saturated + decomposed, so 'a British architect
  # who…' variants count). The 'a/an' is CLAIMED (consume_skipped) — the
  # indefinite marks the existential, and 'by THE architect' (definite
  # agent) matches no ask and declines (reference resolution unbuilt).
  # The embedded-copular asks' pred spans refuse agent_marker so this
  # family owns the construction outright (exclusion beats ordering).
  # "Is it true that X is/was <verb>ed by a/an <cls>?" — ONE ask over BOTH
  # axes. The four it replaces differed only in the copula tense and the
  # article surface, and all four resolved byte-identically: the tense is not
  # read by this consumer, and 'a'/'an' is allomorphy.
  #
  # ⚠ THE ASK SIDE ONLY. The PREMISE rules' is/are split is NOT interchangeable
  # and must never be merged this way: `universal-copular-all-are` emits
  # `{cls.singular}` while `-all-is` emits `{cls}` — there the copula carries
  # the Stage 8d `.singular` fold invariant. Here it carries nothing, which is
  # exactly why the resolves are identical and this collapse is a no-op.
  #
  # The id is a PREFIX of all four it replaces, so it still sorts first among
  # them and cannot lose a tie the earliest sibling previously won
  # (match_ask's final tie-break is id order).
  #
  # ⚠ WHY NOT A `copula` CATEGORY (the `alternation-should-be-category` lint
  # warns here and this is the answer it demands): 'is'/'was' do share the
  # `verb` sense, so a category is sense-feasible — they are already both in
  # `state`. It is still wrong twice over. A `cat` gate is only legal on a
  # SLOT, so it would bind a slot no consumer reads; and a category CONTRIBUTES
  # GATE DEPTH to `_ask_rank`, which would raise this ask's rank above the four
  # it replaces. That turns a provable no-op into a ranking change, which is
  # the one thing these collapses are built not to be. An alternation says
  # "these two surfaces and nothing else" and perturbs no key.
  - id: ask/logic-passive-agent
    match:
      question:
        - {lit: is, at_start: true}
        - {lit: it}
        - {lit: 'true'}
        - {lit: that}
        - {slot: subj, type: name, blocks_skipped: indefinite_article}
        - {lit: [is, was]}
        - {slot: v, type: nonstate_verb}
        - {lit: by}
        - {lit: [a, an], consume_skipped: true}
        - {slot: cls, span: true, span_blocks: [negation, disjunctive_marker]}
    resolves:
      consumer: passive-agent-verdict
      entity: "{subj}"
      verb: "{v}"
      cls: "{cls}"

  - id: ask/logic-verbal-obj-class-does-not
    match:
      question:
        - {lit: is, at_start: true}
        - {lit: it}
        - {lit: 'true'}
        - {lit: that}
        - {slot: subj, type: name, blocks_skipped: indefinite_article}
        - {lit: does}
        - {lit: not}
        - {slot: v, type: nonstate_verb}
        - {slot: prep, type: preposition}
        - {lit: [a, an], consume_skipped: true}
        - {slot: cls, span: true, span_blocks: [negation, disjunctive_marker]}
    resolves:
      consumer: verbal-obj-class-verdict
