format: rulekit/synth@1
# The inference layer: Horn-clause closure over phrase-keyed logic facts,
# saturated to a fixpoint by the SAME machinery as synth/transitive-before.
# Soundness rests on the phrase keys being exact (patterns._canonical_phrase)
# and on monotonicity: derived True/False can only grow, never flip, as more
# premises are read (guards._check_verdict's docstring).
rules:
  # x ∈ C, ∀C→P  ⊢  P(x)   (both polarities of the universal propagate;
  # the atom feeding it must itself be POSITIVE — "Tom is NOT a citizen"
  # licenses nothing about citizens' properties)
  - id: synth/universal-instantiation
    when:
      - {fact: atom, entity: X, pred: C, polarity: true}
      - {fact: quantified, cls: C, pred: P, polarity: POL}
    unless:
      - {fact: atom, entity: X, pred: P}
    emit:
      - {fact: atom, entity: X, pred: P, polarity: POL}

  # ∀A→B, ∀B→C  ⊢  ∀A→C   (the first hop must be positive: "no A are B"
  # says nothing about what B's are)
  - id: synth/universal-chain
    when:
      - {fact: quantified, cls: A, pred: B, polarity: true}
      - {fact: quantified, cls: B, pred: C, polarity: POL}
    unless:
      - {fact: quantified, cls: A, pred: C}
    emit:
      - {fact: quantified, cls: A, pred: C, polarity: POL}

  # x ∈ C, P(x), ∀C: P→[¬]Q  ⊢  [¬]Q(x)   (Stage 1: conditional
  # instantiation — BOTH antecedent atoms must be POSITIVE; a negative atom
  # licenses nothing, exactly as universal-instantiation's gate)
  - id: synth/conditional-instantiation
    when:
      - {fact: atom, entity: X, pred: C, polarity: true}
      - {fact: atom, entity: X, pred: P, polarity: true}
      - {fact: conditional, cls: C, pred: P, then_pred: Q, polarity: POL}
    unless:
      - {fact: atom, entity: X, pred: Q}
    emit:
      - {fact: atom, entity: X, pred: Q, polarity: POL}

  # ---- Stage 3: disjunction (exclusivity measured from DEV golds) ----------
  # x ∈ C, ∀C: L∨R  ⊢  x ∈ L∨R  (instantiation; exclusivity carried through)
  - id: synth/qdisj-instantiation
    when:
      - {fact: atom, entity: X, pred: C, polarity: true}
      - {fact: quantified_disjunction, cls: C, left: L, right: R, exclusive: E}
    unless:
      - {fact: disjunction, entity: X, left: L, right: R}
    emit:
      - {fact: disjunction, entity: X, left: L, right: R, exclusive: E}

  # x ∈ L∨R, L⊆T, R⊆T  ⊢  x ∈ T   (case analysis — sound for BOTH readings:
  # ⊕ implies ∨, and ∨ suffices for the union)
  - id: synth/case-analysis
    when:
      - {fact: disjunction, entity: X, left: L, right: R}
      - {fact: quantified, cls: L, pred: T, polarity: true}
      - {fact: quantified, cls: R, pred: T, polarity: true}
    unless:
      - {fact: atom, entity: X, pred: T}
    emit:
      - {fact: atom, entity: X, pred: T, polarity: true}

  # x ∈ L∨R, x ∉ L  ⊢  x ∈ R   (disjunctive syllogism — sound for both
  # readings; both mirrors)
  - id: synth/disjunctive-syllogism-left
    when:
      - {fact: disjunction, entity: X, left: L, right: R}
      - {fact: atom, entity: X, pred: L, polarity: false}
    unless:
      - {fact: atom, entity: X, pred: R}
    emit:
      - {fact: atom, entity: X, pred: R, polarity: true}

  - id: synth/disjunctive-syllogism-right
    when:
      - {fact: disjunction, entity: X, left: L, right: R}
      - {fact: atom, entity: X, pred: R, polarity: false}
    unless:
      - {fact: atom, entity: X, pred: L}
    emit:
      - {fact: atom, entity: X, pred: L, polarity: true}

  # x ∈ L⊕R, x ∈ L  ⊢  x ∉ R   (XOR-elimination — EXCLUSIVE facts only,
  # bought by the James minimal pair + the TikTok witness; both mirrors)
  - id: synth/xor-elimination-left
    when:
      - {fact: disjunction, entity: X, left: L, right: R, exclusive: true}
      - {fact: atom, entity: X, pred: L, polarity: true}
    unless:
      - {fact: atom, entity: X, pred: R}
    emit:
      - {fact: atom, entity: X, pred: R, polarity: false}

  - id: synth/xor-elimination-right
    when:
      - {fact: disjunction, entity: X, left: L, right: R, exclusive: true}
      - {fact: atom, entity: X, pred: R, polarity: true}
    unless:
      - {fact: atom, entity: X, pred: L}
    emit:
      - {fact: atom, entity: X, pred: L, polarity: false}
