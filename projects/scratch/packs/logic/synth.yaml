format: rulekit/synth@1
# The inference layer: Horn-clause closure over phrase-keyed logic facts,
# saturated to a fixpoint by the SAME machinery as synth/transitive-before.
# Soundness rests on the phrase keys being exact (patterns._canonical_phrase)
# and on monotonicity: derived True/False can only grow, never flip, as more
# premises are read (guards._check_verdict's docstring).
rules:
  # x ∈ C, ∀C→P  ⊢  P(x)   (both polarities of the universal propagate;
  # the atom feeding it must itself be POSITIVE — "Tom is NOT a citizen"
  # licenses nothing about citizens' properties)
  - id: synth/universal-instantiation
    when:
      - {fact: atom, entity: X, pred: C, polarity: true}
      - {fact: quantified, cls: C, pred: P, polarity: POL}
    unless:
      - {fact: atom, entity: X, pred: P}
    emit:
      - {fact: atom, entity: X, pred: P, polarity: POL}

  # ∀A→B, ∀B→C  ⊢  ∀A→C   (the first hop must be positive: "no A are B"
  # says nothing about what B's are)
  - id: synth/universal-chain
    when:
      - {fact: quantified, cls: A, pred: B, polarity: true}
      - {fact: quantified, cls: B, pred: C, polarity: POL}
    unless:
      - {fact: quantified, cls: A, pred: C}
    emit:
      - {fact: quantified, cls: A, pred: C, polarity: POL}

  # M⊆F, P∩F=∅  ⊢  P∩M=∅   (Stage 8: negative chain through the
  # SUPERCLASS — anything in both P and M would be in F. The contraposed
  # sibling of universal-chain: there the negative rides in the SECOND
  # hop's pred position (A⊆B, no B are C); here the two universals SHARE
  # the pred ("Mushrooms are fungi. No plants are fungi." ⊢ no plants are
  # mushrooms). Not derivable from universal-chain: its first hop must be
  # positive and nothing chains FROM a ∀¬ fact.)
  - id: synth/negative-chain
    when:
      - {fact: quantified, cls: M, pred: F, polarity: true}
      - {fact: quantified, cls: P, pred: F, polarity: false}
    unless:
      - {fact: quantified, cls: P, pred: M}
    emit:
      - {fact: quantified, cls: P, pred: M, polarity: false}

  # x ∈ C, P(x), ∀C: P→[¬]Q  ⊢  [¬]Q(x)   (Stage 1: conditional
  # instantiation — BOTH antecedent atoms must be POSITIVE; a negative atom
  # licenses nothing, exactly as universal-instantiation's gate)
  - id: synth/conditional-instantiation
    when:
      - {fact: atom, entity: X, pred: C, polarity: true}
      - {fact: atom, entity: X, pred: P, polarity: true}
      - {fact: conditional, cls: C, pred: P, then_pred: Q, polarity: POL}
    unless:
      - {fact: atom, entity: X, pred: Q}
    emit:
      - {fact: atom, entity: X, pred: Q, polarity: POL}

  # ---- Stage 3: disjunction (exclusivity measured from DEV golds) ----------
  # x ∈ C, ∀C: L∨R  ⊢  x ∈ L∨R  (instantiation; exclusivity carried through)
  - id: synth/qdisj-instantiation
    when:
      - {fact: atom, entity: X, pred: C, polarity: true}
      - {fact: quantified_disjunction, cls: C, left: L, right: R, exclusive: E}
    unless:
      - {fact: disjunction, entity: X, left: L, right: R}
    emit:
      - {fact: disjunction, entity: X, left: L, right: R, exclusive: E}

  # x ∈ L∨R, L⊆T, R⊆T  ⊢  x ∈ T   (case analysis — sound for BOTH readings:
  # ⊕ implies ∨, and ∨ suffices for the union)
  - id: synth/case-analysis
    when:
      - {fact: disjunction, entity: X, left: L, right: R}
      - {fact: quantified, cls: L, pred: T, polarity: true}
      - {fact: quantified, cls: R, pred: T, polarity: true}
    unless:
      - {fact: atom, entity: X, pred: T}
    emit:
      - {fact: atom, entity: X, pred: T, polarity: true}

  # x ∈ L∨R, x ∉ L  ⊢  x ∈ R   (disjunctive syllogism — sound for both
  # readings; both mirrors)
  - id: synth/disjunctive-syllogism-left
    when:
      - {fact: disjunction, entity: X, left: L, right: R}
      - {fact: atom, entity: X, pred: L, polarity: false}
    unless:
      - {fact: atom, entity: X, pred: R}
    emit:
      - {fact: atom, entity: X, pred: R, polarity: true}

  - id: synth/disjunctive-syllogism-right
    when:
      - {fact: disjunction, entity: X, left: L, right: R}
      - {fact: atom, entity: X, pred: R, polarity: false}
    unless:
      - {fact: atom, entity: X, pred: L}
    emit:
      - {fact: atom, entity: X, pred: L, polarity: true}

  # x ∈ L⊕R, x ∈ L  ⊢  x ∉ R   (XOR-elimination — EXCLUSIVE facts only,
  # bought by the James minimal pair + the TikTok witness; both mirrors)
  - id: synth/xor-elimination-left
    when:
      - {fact: disjunction, entity: X, left: L, right: R, exclusive: true}
      - {fact: atom, entity: X, pred: L, polarity: true}
    unless:
      - {fact: atom, entity: X, pred: R}
    emit:
      - {fact: atom, entity: X, pred: R, polarity: false}

  - id: synth/xor-elimination-right
    when:
      - {fact: disjunction, entity: X, left: L, right: R, exclusive: true}
      - {fact: atom, entity: X, pred: R, polarity: true}
    unless:
      - {fact: atom, entity: X, pred: L}
    emit:
      - {fact: atom, entity: X, pred: L, polarity: false}

  # ---- Stage 9i: modus tollens + the ground disjunctive conditional --------
  # ∀A→B, ¬B(x)  ⊢  ¬A(x)   (the contrapositive of universal-instantiation;
  # only the POSITIVE universal contraposes — "no A are B" + ¬B(x) licenses
  # nothing)
  - id: synth/modus-tollens
    when:
      - {fact: quantified, cls: A, pred: B, polarity: true}
      - {fact: atom, entity: X, pred: B, polarity: false}
    unless:
      - {fact: atom, entity: X, pred: A}
    emit:
      - {fact: atom, entity: X, pred: A, polarity: false}

  # ---- Stage 9j: modus tollens over a conditional ---------------------------
  # ∀C: P→Q, x∈C, ¬Q(x)  ⊢  ¬P(x)   (the contrapositive of
  # conditional-instantiation; only the then-POSITIVE conditional
  # contraposes — ¬Q against a "then not Q" conditional licenses nothing)
  - id: synth/conditional-modus-tollens
    when:
      - {fact: conditional, cls: C, pred: P, then_pred: Q, polarity: true}
      - {fact: atom, entity: X, pred: C, polarity: true}
      - {fact: atom, entity: X, pred: Q, polarity: false}
    unless:
      - {fact: atom, entity: X, pred: P}
    emit:
      - {fact: atom, entity: X, pred: P, polarity: false}

  # (L ∨/⊕ R) → [¬]Q at x, L(x), ¬R(x)  ⊢  [¬]Q(x)  — EXACTLY-ONE
  # established fires under BOTH readings (⊕ needs exactly one; L∧¬R
  # satisfies L∨R), so no exclusivity gate. One true disjunct with the
  # other UNDECIDED fires NOTHING: under ⊕ the antecedent is not yet
  # established (model.DisjunctiveConditional).
  # ⚠ DELIBERATELY NO `unless`: when the consequent's opposite is already
  # stored, this emission must COLLIDE so the store quarantines both —
  # that collision is the reductio engine's contradiction signal
  # (consumers/logic_verdict.py); an unless guard here would silently
  # suppress the very inconsistency assumption-testing exists to detect.
  # In MAIN saturation the same collision means genuinely contradictory
  # premises, and quarantine -> decline is the correct reading.
  - id: synth/disj-conditional-fire-left
    when:
      - {fact: disjunctive_conditional, entity: X, left: L, right: R, then_pred: Q, then_polarity: POL}
      - {fact: atom, entity: X, pred: L, polarity: true}
      - {fact: atom, entity: X, pred: R, polarity: false}
    emit:
      - {fact: atom, entity: X, pred: Q, polarity: POL}

  - id: synth/disj-conditional-fire-right
    when:
      - {fact: disjunctive_conditional, entity: X, left: L, right: R, then_pred: Q, then_polarity: POL}
      - {fact: atom, entity: X, pred: R, polarity: true}
      - {fact: atom, entity: X, pred: L, polarity: false}
    emit:
      - {fact: atom, entity: X, pred: Q, polarity: POL}

  # ---- Stage 9e: the stated alias (identity of names) ----------------------
  # alias(A,B), P(A)  ⊢  P(B) — and the mirror, because identity is
  # symmetric. Both polarities carry: an identity transfers what is DENIED
  # of one name as much as what is asserted. Only ground Atoms copy —
  # a name never heads a class, so Quantified/Conditional have no A-slot
  # for an alias to reach.
  - id: synth/alias-copy-forward
    when:
      - {fact: alias, a: A, b: B}
      - {fact: atom, entity: A, pred: P, polarity: POL}
    unless:
      - {fact: atom, entity: B, pred: P}
    emit:
      - {fact: atom, entity: B, pred: P, polarity: POL}

  - id: synth/alias-copy-backward
    when:
      - {fact: alias, a: A, b: B}
      - {fact: atom, entity: B, pred: P, polarity: POL}
    unless:
      - {fact: atom, entity: A, pred: P}
    emit:
      - {fact: atom, entity: A, pred: P, polarity: POL}
