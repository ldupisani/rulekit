format: rulekit/pack@1
name: logic
version: 0.1.0
requires:
- core-english
- difg-mined  # 'or'/'either' (disjunctive_marker/either_marker members) live there
description: >
  The FOLIO logic campaign's pack: phrase-keyed universal/ground extraction,
  Horn-clause synth (instantiation + chaining), and the embedded-declarative
  verdict asks. RESURRECTED INTO projects/scratch ONLY (2026-07-17, from
  bbfc03c) after the FOLIO campaign closed — no benchmark project loads it,
  which is the containment: folio itself stays logic-free (the 0/0 safety
  gate), and widening Answer.committed cannot change any benchmark outcome.
  Facts here are keyed by FULL canonical phrases, never lemma heads — see
  model.Atom's docstring for why anything looser is a confident-wrong
  machine on logic prose.
