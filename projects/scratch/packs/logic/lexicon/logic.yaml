format: rulekit/lexicon@1
# The FOLIO wrapper's one word, plus nothing else (yet).
#
# 'true' is an ADJECTIVE, deliberately and load-bearingly: as a NOUN it makes
# `ask/is-membership` match the wrapper itself — "Is it true that ..." parses
# as "is <member=it> <coll=true>", the pronoun resolves to the story subject,
# and the engine returns an answer INVARIANT TO ITS OWN QUESTION (measured in
# Phase 0a; today a harmless 'undetermined', post-commitment a null-control
# catastrophe). An adjective can never bind a `{type: noun}` slot, so the
# shadow parse is impossible by sense, not by luck. The embedded asks match it
# as the literal {lit: true}, which needs no sense at all — this entry exists
# so the word is KNOWN (diagnostics) and known-safely.
entries:
  'true': {senses: [adjective]}
  # Stage 9f: the appointive passive ("was APPOINTED as X"). Admitted for
  # the appointive_verb category (categories/logic.yaml) — pack-scoped, so
  # no benchmark corpus ever sees the word.
  appointed: {senses: [verb], verb: {lemma: appoint}}
  # Phase B reader 41: productive passive morphology for the pack-scoped
  # "Everything displayed ..." construction. The mined bare `display`
  # remains noun-only; only this overt participle gains a verb lemma.
  displayed: {senses: [verb], verb: {lemma: display}}
  # Phase B reader 44 buyer: plural morphology is the structural evidence
  # that the restricted subject is a generic class rather than a name.
  lipstick: {senses: [noun], plural: lipsticks}
  satin: {senses: [adjective]}
  velvet: {senses: [adjective]}
  # Phase B lexical activation after reader 47: the pre-existing Stage 9f
  # verbal existential already reads "Some CLSs VERB OBJECT" safely, but
  # its train buyer was dormant because the plural class morphology and bare
  # verb were not registered consistently across premise and ask rendering.
  # These are pack-scoped form facts; the grammar itself is unchanged.
  act: {senses: [noun], plural: acts}
  prevent: {senses: [verb], verb: {lemma: prevent}}
  # Phase B reader 48 buyer morphology: plural class plus bare intransitive
  # event. Pack-scoped so it cannot alter any standard benchmark registry.
  sophist: {senses: [noun], plural: sophists}
  reason: {senses: [verb], verb: {lemma: reason}}
  # Phase B reader 49: overt productive passive morphology for the measured
  # past-passive existential. Bare `establish` remains outside this form claim.
  established: {senses: [verb], verb: {lemma: establish}}
  # Phase B reader 50: productive passive form for the second modal-passive
  # buyer. Bare `spot` remains noun-only; only the overt participle is verbal.
  spotted: {senses: [verb], verb: {lemma: spot}}
  # Stage 6 ground-verbal activation: overt regular-past forms preserve the
  # tense-normalized predicate keys without admitting the bare lemmas here.
  supported: {senses: [verb], verb: {lemma: support}}
  researched: {senses: [verb], verb: {lemma: research}}
  # Phase B reader 51: overt regular form for the finite main event. The
  # fronted `being ADJECTIVE` adjunct needs no new lexical claim.
  retired: {senses: [verb], verb: {lemma: retire}}
  # Stage 6 ground-verbal activation: the finite controller and bare
  # infinitive preserve one exact controlled-event predicate.
  plots: {senses: [verb], verb: {lemma: plot}}
  swallow: {senses: [verb]}
  # Phase B reader 53: CamelCase does not receive capitalization-name
  # fallback, so the measured named subject is declared pack-locally.
  tiktok: {senses: [name]}
  # Phase B reader 59: measured overt 3sg event morphology for the
  # PP-restricted singular `No` universal. Bare/plural `struggle` remains a
  # separate surface and cannot satisfy the reader's category gate.
  struggles: {senses: [verb], verb: {lemma: struggle}}
  # Phase B lexical activation after reader 62: the existing unrestricted
  # `All CLSs V P` reader already covers the company-device universal. These
  # pack-scoped form facts make its plural class and bare event head reachable
  # without changing shared benchmark vocabulary or universal semantics.
  device: {senses: [noun], plural: devices}
  logo: {senses: [noun], plural: logos}
  belong: {senses: [verb], verb: {lemma: belong}}
  # Phase B lexical activation: the existing copular universal reader can
  # already preserve an attributive league modifier. All-caps tokens do not
  # receive the ordinary adjective fallback, so declare this modifier only in
  # the isolated logic pack.
  nba: {senses: [adjective]}
  # Phase B lexical activation: explicit plural morphology lets the existing
  # copular universal fold the sport-role class symmetrically across premise
  # and query keys.
  defender: {senses: [noun], plural: defenders}
  # Phase B lexical activation: explicit sport-role morphology serves both
  # positive `All` and negative `No` copular universals without changing
  # either construction.
  umpire: {senses: [noun], plural: umpires}
  # Phase B lexical activation: explicit title-role morphology makes the
  # existing Grand-Slam copular universals and ground disjunctions fully
  # readable without changing their fact shapes.
  champion: {senses: [noun], plural: champions}
  # Phase B lexical activation: a venue noun carried inside exact PP-qualified
  # class keys. The existing universal and conditional readers already retain
  # the preposition and object; this entry only removes the unknown-unit veto.
  mixer: {senses: [noun]}
  # Phase B lexical activation: an adjectival consequence/property shared by
  # an existing restricted generic conditional and a ground conditional.
  famous: {senses: [adjective]}
  # Phase B lexical activation: an adjectival consequence in an existing
  # long PP/appositive-qualified universal. Its eight-row buyer is isolated.
  refillable: {senses: [adjective]}
  # Phase B lexical activation: explicit sortal morphology shared by existing
  # copular universals and ground disjunction/equivalence readers.
  human: {senses: [noun], plural: humans}
  # Phase B lexical activation: closed-compound sport-role morphology. The
  # hyphenated `center-backs` sibling remains blocked because global `back` is
  # adverb-only and is deliberately not widened here.
  centerback: {senses: [noun], plural: centerbacks}
  # Phase B lexical activation: explicit participial/property forms for the
  # existing company-device universals. Bare `belong` was admitted earlier;
  # this keeps its progressive class key lemma-stable.
  belonging: {senses: [verb], verb: {lemma: belong}}
  connected: {senses: [adjective]}
  # Phase B lexical activation: negative adjectival consequence for the
  # existing restricted-someone conditional.
  scared: {senses: [adjective]}
  # Phase B lexical activation: explicit object morphology for the existing
  # ground-verbal `make car bodies` fact.
  body: {senses: [noun], plural: bodies}
  # Phase B lexical activation: exact PP-object morphology for the existing
  # ground event `work for airforces`.
  airforce: {senses: [noun], plural: airforces}
  # Phase B lexical activation: venue object for the existing modal-passive
  # existential `Some turtles can be spotted near the campus`.
  campus: {senses: [noun]}
