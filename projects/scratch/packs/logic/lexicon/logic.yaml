format: rulekit/lexicon@1
# The FOLIO wrapper's one word, plus nothing else (yet).
#
# 'true' is an ADJECTIVE, deliberately and load-bearingly: as a NOUN it makes
# `ask/is-membership` match the wrapper itself — "Is it true that ..." parses
# as "is <member=it> <coll=true>", the pronoun resolves to the story subject,
# and the engine returns an answer INVARIANT TO ITS OWN QUESTION (measured in
# Phase 0a; today a harmless 'undetermined', post-commitment a null-control
# catastrophe). An adjective can never bind a `{type: noun}` slot, so the
# shadow parse is impossible by sense, not by luck. The embedded asks match it
# as the literal {lit: true}, which needs no sense at all — this entry exists
# so the word is KNOWN (diagnostics) and known-safely.
entries:
  'true': {senses: [adjective]}
  # Stage 9f: the appointive passive ("was APPOINTED as X"). Admitted for
  # the appointive_verb category (categories/logic.yaml) — pack-scoped, so
  # no benchmark corpus ever sees the word.
  appointed: {senses: [verb], verb: {lemma: appoint}}
  # Phase B reader 41: productive passive morphology for the pack-scoped
  # "Everything displayed ..." construction. The mined bare `display`
  # remains noun-only; only this overt participle gains a verb lemma.
  displayed: {senses: [verb], verb: {lemma: display}}
  # Phase B reader 44 buyer: plural morphology is the structural evidence
  # that the restricted subject is a generic class rather than a name.
  lipstick: {senses: [noun], plural: lipsticks}
  satin: {senses: [adjective]}
  velvet: {senses: [adjective]}
  # Phase B lexical activation after reader 47: the pre-existing Stage 9f
  # verbal existential already reads "Some CLSs VERB OBJECT" safely, but
  # its train buyer was dormant because the plural class morphology and bare
  # verb were not registered consistently across premise and ask rendering.
  # These are pack-scoped form facts; the grammar itself is unchanged.
  act: {senses: [noun], plural: acts}
  prevent: {senses: [verb], verb: {lemma: prevent}}
  # Phase B reader 48 buyer morphology: plural class plus bare intransitive
  # event. Pack-scoped so it cannot alter any standard benchmark registry.
  sophist: {senses: [noun], plural: sophists}
  reason: {senses: [verb], verb: {lemma: reason}}
  # Phase B reader 49: overt productive passive morphology for the measured
  # past-passive existential. Bare `establish` remains outside this form claim.
  established: {senses: [verb], verb: {lemma: establish}}
  # Phase B reader 50: productive passive form for the second modal-passive
  # buyer. Bare `spot` remains noun-only; only the overt participle is verbal.
  spotted: {senses: [verb], verb: {lemma: spot}}
