format: rulekit/categories@1
categories:
  semantic_complement_matrix_verb:
    parent: verb
  semantic_agent_theme_verb:
    parent: verb
  semantic_bare_theme_noun:
    parent: semantic_nominal_entity_noun
  semantic_ccomp_matrix_verb:
    parent: semantic_complement_matrix_verb
  semantic_to_dative_verb:
    parent: verb
  semantic_intransitive_agent_verb:
    parent: verb
  semantic_intransitive_theme_verb:
    parent: verb
  semantic_nominal_modifier_object_noun:
    parent: semantic_nominal_entity_noun
  semantic_nominal_modifier_preposition:
    parent: preposition
  semantic_nominal_entity_noun:
    parent: noun
  semantic_passive_participle:
    parent: verb
  semantic_xcomp_agent_verb:
    parent: verb
  semantic_xcomp_matrix_verb:
    parent: semantic_complement_matrix_verb
  # Marks event forms first admitted by this pack. The legacy
  # VerbalRelation evaluation bridge yields to the first-class semantic
  # reader for these forms, so vocabulary cannot accidentally buy an
  # unserved neighbouring construction.
  semantic_projection_owned_verb:
    parent: verb
  # Project-local members may withhold a verb from first-class role
  # projection when an independent annotation scheme assigns a different
  # semantic role. Empty for COGS; this is an explicit fail-closed boundary,
  # not a change to the COGS lexical licence.
  semantic_projection_role_quarantined_verb:
    parent: verb
  # Empty reusable licences for the PMB common-subject intransitive buyer.
  # Project-local packs provide members; empty here keeps COGS unchanged.
  semantic_indefinite_common_agent_subject_noun:
    parent: noun
  semantic_indefinite_common_agent_verb:
    parent: verb
  # Empty reusable licences for PMB's typed proper-name simple-past Agent
  # graph. PMB supplies the independently audited members.
  semantic_pmb_male_name:
    parent: noun
  semantic_pmb_female_name:
    parent: noun
  semantic_pmb_simple_past_agent_verb:
    parent: verb
  # Empty reusable licences for PMB's exact simple-past transitive buyer.
  semantic_pmb_male_pronoun:
    parent: pronoun
  semantic_pmb_female_pronoun:
    parent: pronoun
  semantic_pmb_person_pronoun:
    parent: pronoun
  semantic_pmb_simple_past_agent_theme_verb:
    parent: verb
  semantic_pmb_indefinite_theme_noun:
    parent: noun
  # Empty reusable licences for PMB's exact Recipient-PP buyer.
  semantic_pmb_person_quantified_pronoun:
    parent: pronoun
  semantic_pmb_female_object_pronoun:
    parent: pronoun
  semantic_pmb_person_object_pronoun:
    parent: pronoun
  semantic_pmb_recipient_at_verb:
    parent: verb
  semantic_pmb_recipient_to_verb:
    parent: verb
  # Empty paired licences for PMB's exact possessive-role attachment buyer.
  # Each noun/adjective pair has its own rule; the PMB pack supplies members.
  semantic_pmb_possessive_aged_role:
    parent: noun
  semantic_pmb_possessive_aged_adjective:
    parent: adjective
  semantic_pmb_possessive_angry_role:
    parent: noun
  semantic_pmb_possessive_angry_adjective:
    parent: adjective
  semantic_pmb_possessive_famous_role:
    parent: noun
  semantic_pmb_possessive_famous_adjective:
    parent: adjective
  semantic_pmb_possessive_tall_role:
    parent: noun
  semantic_pmb_possessive_tall_adjective:
    parent: adjective
  semantic_pmb_possessive_synthetic_role:
    parent: noun
  semantic_pmb_possessive_synthetic_adjective:
    parent: adjective
members:
  # Overt finite forms whose active direct-object construction licenses the
  # agent/theme interpretation in Phase B increment 1. Unsafe self-lemma
  # forms stay out until their lexical normalization is independently known.
  semantic_agent_theme_verb:
    [admired, adored, appreciated, ate, burned, changed, cleaned, collapsed,
     crumpled, decomposed, disintegrated, dusted, enlarged,
     examined, floated, found, froze, grew, heard, held, helped, hunted,
     improved, knew, liked, loved, noticed, nursed, observed, packed, painted,
     pierced, poked, respected, rolled, saw, shortened, sketched, slid,
     snapped, split, stabbed, studied, tolerated, tossed, touched, valued,
     worshipped]
  # Unambiguous singular common-noun heads admitted as existential themes.
  # Sense-ambiguous rose/drink/watch remain outside the licence.
  semantic_bare_theme_noun:
    [baby, bag, ball, balloon, bean, bear, bell, bird, block, bottle, box,
     boy, brush, bucket, cake, captain, cat, chair, champion, chemical,
     chicken, child, cloud, coach, cookie, cow, crayon, cup, customer,
     director, dog, doll, donut, duke, flag, frog, game, girl,
     hamburger, hammer, horse, jacket, judge, knife, leaf, liver,
     lollipop, melon, monkey, mouse, muffin, needle, newspaper, pancake,
     patient, pen, pickle, pillow, pizza, plate, potato, present, president,
     pretzel, prince, princess, pumpkin, pupil, puppy, purse, queen, raisin,
     ring, sandwich, soap, strawberry, student, sweetcorn, teacher, tenant,
     toothbrush, towel, turtle, visitor, weapon, zephyrstone]
  # Matrix forms whose exact `Name V that Name V` construction licenses an
  # agentive event with a ccomp edge to the embedded event.
  semantic_ccomp_matrix_verb:
    [admired, believed, confessed, dreamed, hoped, imagined, liked, noticed,
     respected]
  # Overt forms whose exact active `Name V a N to Name` construction
  # licenses agent, theme, and recipient roles. This construction-specific
  # category is deliberately not a generic ditransitive licence: a
  # double-object surface needs its own independently audited category.
  semantic_to_dative_verb:
    [brought, fed, gave, offered, passed, rented, sent, sold]
  # Overt finite forms whose bare named-subject intransitive construction
  # licenses an AGENT role. Theme-class forms live in the disjoint category
  # below: identical syntax is not permission to guess the role.
  semantic_intransitive_agent_verb:
    [ate, cleaned, cried, danced, dusted, examined, frowned, gasped, giggled,
     heard, hunted, investigated, jogged, juggled, knew, laughed, napped,
     noticed, nursed, observed, packed, painted, ran, saw, scoffed, screamed,
     sketched, slept, smiled, smirked, sneezed, snoozed, snored, studied,
     stuttered, talked, walked]
  # Overt finite forms whose bare named-subject intransitive construction
  # licenses a THEME role. This set is intentionally disjoint from the agent
  # class above; bad self-lemmas `broke` and `doubled` remain excluded.
  semantic_intransitive_theme_verb:
    [burned, collapsed, crumpled, decomposed, disintegrated, enlarged, floated,
     froze, grew, improved, inflated, reddened, rolled, shattered, shortened,
     slid, snapped, split]
  # Unambiguous noun-only PP objects for the first nominal-modifier class.
  # This licence is separate from event themes so adding attachment vocabulary
  # cannot silently widen the Phase B active/passive constructions.
  semantic_nominal_modifier_object_noun:
    [bed, book, box, cabinet, chair, desk, garden, glass, hole, house, leaf,
     notebook, pot, road, rock, room, sofa, storage, surface, table, tree,
     vase, vehicle, zephyrstone]
  semantic_nominal_modifier_preposition: [beside, in, on]
  # Overt forms licensed as the participle after `was` in the exact
  # indefinite-theme passive construction. Irregular morphology is admitted
  # only when the registry already supplies the correct event lemma.
  semantic_passive_participle:
    [admired, adored, appreciated, burned, changed, cleaned, collapsed,
     crumpled, decomposed, disintegrated, dusted, eaten, enlarged, floated,
     found, heard, held, helped, hunted, improved, inflated, investigated,
     juggled, liked, loved, noticed, nursed, observed, packed, painted,
     pierced, poked, reddened, respected, rolled, shortened, sketched, slid,
     snapped, split, studied, tossed, touched, valued, worshipped]
  # Infinitival agent-event forms and matrix subject-control forms for the
  # exact `Name V to V` xcomp construction.
  semantic_xcomp_agent_verb:
    [call, clean, cook, dust, eat, giggle, investigate, jog, paint, read, run,
     sketch, sleep, smirk, sneeze, talk, walk]
  semantic_xcomp_matrix_verb:
    [dreamed, hoped, liked, loved, needed, wanted]
  semantic_projection_owned_verb:
    [admired, adored, appreciated, burned, cleaned, collapsed, crumpled,
     decomposed, disintegrated, dusted, enlarged, examined, floated, froze,
     heard, hunted, improved, inflated, loved, noticed, nursed, observed,
     packed, pierced, poked, reddened, respected, rolled, shattered, shortened,
     sketched, slid, snapped, stabbed, tolerated, tossed, touched, valued,
     worshipped,
     cried, danced, frowned, gasped, giggled, investigated, juggled, laughed,
     napped, scoffed, screamed, smiled, smirked, sneezed, snoozed, snored,
     stuttered, talked,
     believed, confessed, dreamed, hoped, imagined,
     dust, giggle, investigate, sketch, smirk, sneeze, talk]
