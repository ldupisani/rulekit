format: rulekit/rules@1
rules:
  # Phase B increment 1: one complete active-transitive semantic graph.
  #
  # The two lexical categories license the role interpretation. The explicit
  # indefinite article, sentence anchors, bare noun, and terminal punctuation
  # keep passive, definite, ditransitive, PP-tailed, coordinated, and embedded
  # neighbours outside this rule. Runtime refs are local span identities; the
  # COGS adapter alone maps them to its token-indexed evaluation variables.
  - id: semantic/active-name-indefinite-theme
    phase: read
    match:
      sentence:
        - {slot: agent, type: proper_name, at_start: true,
           blocks_skipped: indefinite_article}
        - {slot: event, cat: semantic_agent_theme_verb, single_word: true}
        - {lit: [a, an], consume_skipped: true}
        - {slot: theme, cat: semantic_bare_theme_noun, bare: true}
        - {lit: ".", consume_skipped: true}
    where:
      - slot_not_category:
          {slot: event, cat: semantic_projection_role_quarantined_verb}
    emits:
      - {fact: semantic_graph_node, ref: "name:{agent}", kind: entity,
         span_start: "{agent.span_start}", span_end: "{agent.span_end}"}
      - {fact: semantic_graph_node, ref: "event:{event.span_start}", kind: event,
         span_start: "{event.span_start}", span_end: "{event.span_end}"}
      - {fact: semantic_graph_node, ref: "entity:{theme.span_start}", kind: entity,
         span_start: "{theme.span_start}", span_end: "{theme.span_end}"}
      - {fact: semantic_graph_edge, kind: event,
         source: "event:{event.span_start}", label: "{event}",
         span_start: "{event.span_start}", span_end: "{event.span_end}"}
      - {fact: semantic_graph_edge, kind: type,
         source: "entity:{theme.span_start}", label: "{theme}",
         span_start: "{theme.span_start}", span_end: "{theme.span_end}"}
      - {fact: semantic_graph_edge, kind: role,
         source: "event:{event.span_start}", target: "name:{agent}", label: agent,
         span_start: "{agent.span_start}", span_end: "{theme.span_end}"}
      - {fact: semantic_graph_edge, kind: role,
         source: "event:{event.span_start}", target: "entity:{theme.span_start}",
         label: theme,
         span_start: "{agent.span_start}", span_end: "{theme.span_end}"}

  # Phase E increment 1: a definite common-noun subject in the licensed
  # active frame. The article contributes discourse definiteness only.
  - id: semantic/active-definite-agent-indefinite-theme
    phase: read
    match:
      sentence:
        - {lit: the, consume_skipped: true, at_start: true}
        - {slot: agent, cat: semantic_nominal_entity_noun, bare: true}
        - {slot: event, cat: semantic_agent_theme_verb, single_word: true}
        - {lit: [a, an], consume_skipped: true}
        - {slot: theme, cat: semantic_bare_theme_noun, bare: true}
        - {lit: ".", consume_skipped: true}
    emits:
      - {fact: semantic_graph_node, ref: "entity:{agent.span_start}",
         kind: entity, span_start: "{agent.span_start}",
         span_end: "{agent.span_end}"}
      - {fact: semantic_graph_node, ref: "event:{event.span_start}", kind: event,
         span_start: "{event.span_start}", span_end: "{event.span_end}"}
      - {fact: semantic_graph_node, ref: "entity:{theme.span_start}",
         kind: entity, span_start: "{theme.span_start}",
         span_end: "{theme.span_end}"}
      - {fact: semantic_graph_edge, kind: type,
         source: "entity:{agent.span_start}", label: "{agent}",
         span_start: "{agent.span_start}", span_end: "{agent.span_end}"}
      - {fact: semantic_graph_edge, kind: definite,
         source: "entity:{agent.span_start}", span_start: "0",
         span_end: "{agent.span_end}"}
      - {fact: semantic_graph_edge, kind: event,
         source: "event:{event.span_start}", label: "{event}",
         span_start: "{event.span_start}", span_end: "{event.span_end}"}
      - {fact: semantic_graph_edge, kind: type,
         source: "entity:{theme.span_start}", label: "{theme}",
         span_start: "{theme.span_start}", span_end: "{theme.span_end}"}
      - {fact: semantic_graph_edge, kind: role,
         source: "event:{event.span_start}", target: "entity:{agent.span_start}",
         label: agent, span_start: "{agent.span_start}",
         span_end: "{theme.span_end}"}
      - {fact: semantic_graph_edge, kind: role,
         source: "event:{event.span_start}", target: "entity:{theme.span_start}",
         label: theme, span_start: "{agent.span_start}",
         span_end: "{theme.span_end}"}

  # Phase F: the indefinite common-subject counterpart. Both articles license
  # existential entities, but neither contributes a definite edge.
  - id: semantic/active-indefinite-agent-indefinite-theme
    phase: read
    match:
      sentence:
        - {lit: [a, an], consume_skipped: true, at_start: true}
        - {slot: agent, cat: semantic_nominal_entity_noun, bare: true}
        - {slot: event, cat: semantic_agent_theme_verb, single_word: true}
        - {lit: [a, an], consume_skipped: true}
        - {slot: theme, cat: semantic_bare_theme_noun, bare: true}
        - {lit: ".", consume_skipped: true}
    emits:
      - {fact: semantic_graph_node, ref: "entity:{agent.span_start}",
         kind: entity, span_start: "{agent.span_start}",
         span_end: "{agent.span_end}"}
      - {fact: semantic_graph_node, ref: "event:{event.span_start}", kind: event,
         span_start: "{event.span_start}", span_end: "{event.span_end}"}
      - {fact: semantic_graph_node, ref: "entity:{theme.span_start}",
         kind: entity, span_start: "{theme.span_start}",
         span_end: "{theme.span_end}"}
      - {fact: semantic_graph_edge, kind: type,
         source: "entity:{agent.span_start}", label: "{agent}",
         span_start: "{agent.span_start}", span_end: "{agent.span_end}"}
      - {fact: semantic_graph_edge, kind: event,
         source: "event:{event.span_start}", label: "{event}",
         span_start: "{event.span_start}", span_end: "{event.span_end}"}
      - {fact: semantic_graph_edge, kind: type,
         source: "entity:{theme.span_start}", label: "{theme}",
         span_start: "{theme.span_start}", span_end: "{theme.span_end}"}
      - {fact: semantic_graph_edge, kind: role,
         source: "event:{event.span_start}", target: "entity:{agent.span_start}",
         label: agent, span_start: "{agent.span_start}",
         span_end: "{theme.span_end}"}
      - {fact: semantic_graph_edge, kind: role,
         source: "event:{event.span_start}", target: "entity:{theme.span_start}",
         label: theme, span_start: "{agent.span_start}",
         span_end: "{theme.span_end}"}

  # Phase C increment 1: attach one indefinite nominal PP to the already
  # licensed direct-object theme. The ordinary modifier edge records the head
  # and object refs plus the captured preposition; it is not depth-specific.
  - id: semantic/active-name-indefinite-theme-indefinite-modifier
    phase: read
    match:
      sentence:
        - {slot: agent, type: proper_name, at_start: true,
           blocks_skipped: indefinite_article}
        - {slot: event, cat: semantic_agent_theme_verb, single_word: true}
        - {lit: [a, an], consume_skipped: true}
        - {slot: theme, cat: semantic_bare_theme_noun, bare: true}
        - {slot: link, cat: semantic_nominal_modifier_preposition,
           single_word: true}
        - {lit: [a, an], consume_skipped: true}
        - {slot: modifier, cat: semantic_nominal_modifier_object_noun,
           bare: true}
        - {lit: ".", consume_skipped: true}
    emits:
      - {fact: semantic_graph_node, ref: "name:{agent}", kind: entity,
         span_start: "{agent.span_start}", span_end: "{agent.span_end}"}
      - {fact: semantic_graph_node, ref: "event:{event.span_start}", kind: event,
         span_start: "{event.span_start}", span_end: "{event.span_end}"}
      - {fact: semantic_graph_node, ref: "entity:{theme.span_start}", kind: entity,
         span_start: "{theme.span_start}", span_end: "{theme.span_end}"}
      - {fact: semantic_graph_node, ref: "entity:{modifier.span_start}",
         kind: entity, span_start: "{modifier.span_start}",
         span_end: "{modifier.span_end}"}
      - {fact: semantic_graph_edge, kind: event,
         source: "event:{event.span_start}", label: "{event}",
         span_start: "{event.span_start}", span_end: "{event.span_end}"}
      - {fact: semantic_graph_edge, kind: type,
         source: "entity:{theme.span_start}", label: "{theme}",
         span_start: "{theme.span_start}", span_end: "{theme.span_end}"}
      - {fact: semantic_graph_edge, kind: type,
         source: "entity:{modifier.span_start}", label: "{modifier}",
         span_start: "{modifier.span_start}", span_end: "{modifier.span_end}"}
      - {fact: semantic_graph_edge, kind: role,
         source: "event:{event.span_start}", target: "name:{agent}", label: agent,
         span_start: "{agent.span_start}", span_end: "{theme.span_end}"}
      - {fact: semantic_graph_edge, kind: role,
         source: "event:{event.span_start}", target: "entity:{theme.span_start}",
         label: theme, span_start: "{agent.span_start}",
         span_end: "{theme.span_end}"}
      - {fact: semantic_graph_edge, kind: modifier,
         source: "entity:{theme.span_start}",
         target: "entity:{modifier.span_start}", label: "{link}",
         span_start: "{theme.span_start}", span_end: "{modifier.span_end}"}

  # Phase C increment 5 root: recognize the licensed active frame before a
  # nominal PP chain. No depth or sentence-end template lives here; the local
  # overlapping link rule below emits every attachment independently.
  - id: semantic/active-name-indefinite-theme-modifier-chain-root
    phase: read
    match:
      sentence:
        - {slot: agent, type: proper_name, at_start: true,
           blocks_skipped: indefinite_article}
        - {slot: event, cat: semantic_agent_theme_verb, single_word: true}
        - {lit: [a, an], consume_skipped: true}
        - {slot: theme, cat: semantic_bare_theme_noun, bare: true}
        - {slot: link, cat: semantic_nominal_modifier_preposition,
           single_word: true}
        - {lit: [a, an], consume_skipped: true}
        - {slot: modifier, cat: semantic_nominal_modifier_object_noun,
           bare: true}
    where:
      - {absent: {cat: conjunction}}
    emits:
      - {fact: semantic_graph_node, ref: "name:{agent}", kind: entity,
         span_start: "{agent.span_start}", span_end: "{agent.span_end}"}
      - {fact: semantic_graph_node, ref: "event:{event.span_start}", kind: event,
         span_start: "{event.span_start}", span_end: "{event.span_end}"}
      - {fact: semantic_graph_node, ref: "entity:{theme.span_start}", kind: entity,
         span_start: "{theme.span_start}", span_end: "{theme.span_end}"}
      - {fact: semantic_graph_edge, kind: event,
         source: "event:{event.span_start}", label: "{event}",
         span_start: "{event.span_start}", span_end: "{event.span_end}"}
      - {fact: semantic_graph_edge, kind: type,
         source: "entity:{theme.span_start}", label: "{theme}",
         span_start: "{theme.span_start}", span_end: "{theme.span_end}"}
      - {fact: semantic_graph_edge, kind: role,
         source: "event:{event.span_start}", target: "name:{agent}", label: agent,
         span_start: "{agent.span_start}", span_end: "{theme.span_end}"}
      - {fact: semantic_graph_edge, kind: role,
         source: "event:{event.span_start}", target: "entity:{theme.span_start}",
         label: theme, span_start: "{agent.span_start}",
         span_end: "{theme.span_end}"}

  # One local rule handles every adjacent nominal link at every depth. The
  # opt-in overlapping matcher advances from the match START, allowing the
  # object of one link to become the head of the next.
  - id: semantic/nominal-modifier-chain-link
    phase: read
    overlapping: true
    match:
      sentence:
        - {slot: head, cat: semantic_nominal_entity_noun, bare: true}
        - {slot: link, cat: semantic_nominal_modifier_preposition,
           single_word: true}
        - {lit: [a, an], consume_skipped: true}
        - {slot: modifier, cat: semantic_nominal_entity_noun, bare: true}
    emits:
      - {fact: semantic_graph_node, ref: "entity:{head.span_start}",
         kind: entity, span_start: "{head.span_start}",
         span_end: "{head.span_end}"}
      - {fact: semantic_graph_node, ref: "entity:{modifier.span_start}",
         kind: entity, span_start: "{modifier.span_start}",
         span_end: "{modifier.span_end}"}
      - {fact: semantic_graph_edge, kind: type,
         source: "entity:{head.span_start}", label: "{head}",
         span_start: "{head.span_start}", span_end: "{head.span_end}"}
      - {fact: semantic_graph_edge, kind: type,
         source: "entity:{modifier.span_start}", label: "{modifier}",
         span_start: "{modifier.span_start}",
         span_end: "{modifier.span_end}"}
      - {fact: semantic_graph_edge, kind: modifier,
         source: "entity:{head.span_start}",
         target: "entity:{modifier.span_start}", label: "{link}",
         span_start: "{head.span_start}", span_end: "{modifier.span_end}"}

  # Phase C increment 2: join two complete named-agent event subgraphs with
  # one overt `that`-licensed ccomp edge. Event refs remain span-local even
  # when both agent slots bind the same named entity.
  - id: semantic/ccomp-name-agent-name-agent
    phase: read
    match:
      sentence:
        - {slot: matrix_agent, type: proper_name, at_start: true,
           blocks_skipped: article}
        - {slot: matrix_event, cat: semantic_ccomp_matrix_verb,
           single_word: true}
        - {lit: that}
        - {slot: embedded_agent, type: proper_name, blocks_skipped: article}
        - {slot: embedded_event, cat: semantic_intransitive_agent_verb,
           single_word: true}
        - {lit: ".", consume_skipped: true}
    emits:
      - {fact: semantic_graph_node, ref: "name:{matrix_agent}", kind: entity,
         span_start: "{matrix_agent.span_start}",
         span_end: "{matrix_agent.span_end}"}
      - {fact: semantic_graph_node, ref: "event:{matrix_event.span_start}",
         kind: event, span_start: "{matrix_event.span_start}",
         span_end: "{matrix_event.span_end}"}
      - {fact: semantic_graph_node, ref: "name:{embedded_agent}", kind: entity,
         span_start: "{embedded_agent.span_start}",
         span_end: "{embedded_agent.span_end}"}
      - {fact: semantic_graph_node, ref: "event:{embedded_event.span_start}",
         kind: event, span_start: "{embedded_event.span_start}",
         span_end: "{embedded_event.span_end}"}
      - {fact: semantic_graph_edge, kind: event,
         source: "event:{matrix_event.span_start}", label: "{matrix_event}",
         span_start: "{matrix_event.span_start}",
         span_end: "{matrix_event.span_end}"}
      - {fact: semantic_graph_edge, kind: event,
         source: "event:{embedded_event.span_start}", label: "{embedded_event}",
         span_start: "{embedded_event.span_start}",
         span_end: "{embedded_event.span_end}"}
      - {fact: semantic_graph_edge, kind: role,
         source: "event:{matrix_event.span_start}",
         target: "name:{matrix_agent}", label: agent,
         span_start: "{matrix_agent.span_start}",
         span_end: "{matrix_event.span_end}"}
      - {fact: semantic_graph_edge, kind: role,
         source: "event:{embedded_event.span_start}",
         target: "name:{embedded_agent}", label: agent,
         span_start: "{embedded_agent.span_start}",
         span_end: "{embedded_event.span_end}"}
      - {fact: semantic_graph_edge, kind: complement,
         source: "event:{matrix_event.span_start}",
         target: "event:{embedded_event.span_start}", label: ccomp,
         span_start: "{matrix_event.span_start}",
         span_end: "{embedded_event.span_end}"}

  # Phase C increment 3: subject-control xcomp. Both agent edges deliberately
  # target one named entity ref; the two events remain independently
  # span-addressed and are joined by the overt `to`-licensed xcomp edge.
  - id: semantic/xcomp-name-agent-shared-agent
    phase: read
    match:
      sentence:
        - {slot: controller, type: proper_name, at_start: true,
           blocks_skipped: article}
        - {slot: matrix_event, cat: semantic_xcomp_matrix_verb,
           single_word: true}
        - {lit: to}
        - {slot: embedded_event, cat: semantic_xcomp_agent_verb,
           single_word: true}
        - {lit: ".", consume_skipped: true}
    emits:
      - {fact: semantic_graph_node, ref: "name:{controller}", kind: entity,
         span_start: "{controller.span_start}",
         span_end: "{controller.span_end}"}
      - {fact: semantic_graph_node, ref: "event:{matrix_event.span_start}",
         kind: event, span_start: "{matrix_event.span_start}",
         span_end: "{matrix_event.span_end}"}
      - {fact: semantic_graph_node, ref: "event:{embedded_event.span_start}",
         kind: event, span_start: "{embedded_event.span_start}",
         span_end: "{embedded_event.span_end}"}
      - {fact: semantic_graph_edge, kind: event,
         source: "event:{matrix_event.span_start}", label: "{matrix_event}",
         span_start: "{matrix_event.span_start}",
         span_end: "{matrix_event.span_end}"}
      - {fact: semantic_graph_edge, kind: event,
         source: "event:{embedded_event.span_start}", label: "{embedded_event}",
         span_start: "{embedded_event.span_start}",
         span_end: "{embedded_event.span_end}"}
      - {fact: semantic_graph_edge, kind: role,
         source: "event:{matrix_event.span_start}",
         target: "name:{controller}", label: agent,
         span_start: "{controller.span_start}",
         span_end: "{matrix_event.span_end}"}
      - {fact: semantic_graph_edge, kind: role,
         source: "event:{embedded_event.span_start}",
         target: "name:{controller}", label: agent,
         span_start: "{controller.span_start}",
         span_end: "{embedded_event.span_end}"}
      - {fact: semantic_graph_edge, kind: complement,
         source: "event:{matrix_event.span_start}",
         target: "event:{embedded_event.span_start}", label: xcomp,
         span_start: "{matrix_event.span_start}",
         span_end: "{embedded_event.span_end}"}

  # Phase C increment 6: one overlapping local rule emits every ccomp hop in
  # a nested complement chain. The target may itself be either a ccomp matrix
  # or the terminal xcomp matrix through their shared structural parent.
  - id: semantic/z-complement-chain-ccomp-link
    phase: read
    overlapping: true
    match:
      sentence:
        - {slot: matrix_agent, type: proper_name, blocks_skipped: article}
        - {slot: matrix_event, cat: semantic_ccomp_matrix_verb,
           single_word: true}
        - {lit: that}
        - {slot: embedded_agent, type: proper_name, blocks_skipped: article}
        - {slot: embedded_event, cat: semantic_complement_matrix_verb,
           single_word: true}
    emits:
      - {fact: semantic_graph_node, ref: "name:{matrix_agent}", kind: entity,
         span_start: "{matrix_agent.span_start}",
         span_end: "{matrix_agent.span_end}"}
      - {fact: semantic_graph_node, ref: "event:{matrix_event.span_start}",
         kind: event, span_start: "{matrix_event.span_start}",
         span_end: "{matrix_event.span_end}"}
      - {fact: semantic_graph_node, ref: "name:{embedded_agent}", kind: entity,
         span_start: "{embedded_agent.span_start}",
         span_end: "{embedded_agent.span_end}"}
      - {fact: semantic_graph_node, ref: "event:{embedded_event.span_start}",
         kind: event, span_start: "{embedded_event.span_start}",
         span_end: "{embedded_event.span_end}"}
      - {fact: semantic_graph_edge, kind: event,
         source: "event:{matrix_event.span_start}", label: "{matrix_event}",
         span_start: "{matrix_event.span_start}",
         span_end: "{matrix_event.span_end}"}
      - {fact: semantic_graph_edge, kind: event,
         source: "event:{embedded_event.span_start}", label: "{embedded_event}",
         span_start: "{embedded_event.span_start}",
         span_end: "{embedded_event.span_end}"}
      - {fact: semantic_graph_edge, kind: role,
         source: "event:{matrix_event.span_start}",
         target: "name:{matrix_agent}", label: agent,
         span_start: "{matrix_agent.span_start}",
         span_end: "{matrix_event.span_end}"}
      - {fact: semantic_graph_edge, kind: role,
         source: "event:{embedded_event.span_start}",
         target: "name:{embedded_agent}", label: agent,
         span_start: "{embedded_agent.span_start}",
         span_end: "{embedded_event.span_end}"}
      - {fact: semantic_graph_edge, kind: complement,
         source: "event:{matrix_event.span_start}",
         target: "event:{embedded_event.span_start}", label: ccomp,
         span_start: "{matrix_event.span_start}",
         span_end: "{embedded_event.span_end}"}

  # The terminal local xcomp link makes the final controller sharing explicit.
  # It also safely dedupes with the anchored depth-1 xcomp rule.
  - id: semantic/z-complement-chain-xcomp-terminal
    phase: read
    overlapping: true
    match:
      sentence:
        - {slot: controller, type: proper_name, blocks_skipped: article}
        - {slot: matrix_event, cat: semantic_xcomp_matrix_verb,
           single_word: true}
        - {lit: to}
        - {slot: embedded_event, cat: semantic_xcomp_agent_verb,
           single_word: true}
    emits:
      - {fact: semantic_graph_node, ref: "name:{controller}", kind: entity,
         span_start: "{controller.span_start}",
         span_end: "{controller.span_end}"}
      - {fact: semantic_graph_node, ref: "event:{matrix_event.span_start}",
         kind: event, span_start: "{matrix_event.span_start}",
         span_end: "{matrix_event.span_end}"}
      - {fact: semantic_graph_node, ref: "event:{embedded_event.span_start}",
         kind: event, span_start: "{embedded_event.span_start}",
         span_end: "{embedded_event.span_end}"}
      - {fact: semantic_graph_edge, kind: event,
         source: "event:{matrix_event.span_start}", label: "{matrix_event}",
         span_start: "{matrix_event.span_start}",
         span_end: "{matrix_event.span_end}"}
      - {fact: semantic_graph_edge, kind: event,
         source: "event:{embedded_event.span_start}", label: "{embedded_event}",
         span_start: "{embedded_event.span_start}",
         span_end: "{embedded_event.span_end}"}
      - {fact: semantic_graph_edge, kind: role,
         source: "event:{matrix_event.span_start}",
         target: "name:{controller}", label: agent,
         span_start: "{controller.span_start}",
         span_end: "{matrix_event.span_end}"}
      - {fact: semantic_graph_edge, kind: role,
         source: "event:{embedded_event.span_start}",
         target: "name:{controller}", label: agent,
         span_start: "{controller.span_start}",
         span_end: "{embedded_event.span_end}"}
      - {fact: semantic_graph_edge, kind: complement,
         source: "event:{matrix_event.span_start}",
         target: "event:{embedded_event.span_start}", label: xcomp,
         span_start: "{matrix_event.span_start}",
         span_end: "{embedded_event.span_end}"}

  # Phase B increment 2: the syntactically bare named-subject intransitive.
  # Agent/theme is lexically licensed: a theme-class verb in this identical
  # frame must not inherit the role merely from word order.
  - id: semantic/intransitive-name-agent
    phase: read
    match:
      sentence:
        - {slot: agent, type: proper_name, at_start: true,
           blocks_skipped: indefinite_article}
        - {slot: event, cat: semantic_intransitive_agent_verb,
           single_word: true}
        - {lit: ".", consume_skipped: true}
    where:
      - slot_not_category:
          {slot: event, cat: semantic_projection_role_quarantined_verb}
    emits:
      - {fact: semantic_graph_node, ref: "name:{agent}", kind: entity,
         span_start: "{agent.span_start}", span_end: "{agent.span_end}"}
      - {fact: semantic_graph_node, ref: "event:{event.span_start}", kind: event,
         span_start: "{event.span_start}", span_end: "{event.span_end}"}
      - {fact: semantic_graph_edge, kind: event,
         source: "event:{event.span_start}", label: "{event}",
         span_start: "{event.span_start}", span_end: "{event.span_end}"}
      - {fact: semantic_graph_edge, kind: role,
         source: "event:{event.span_start}", target: "name:{agent}", label: agent,
         span_start: "{agent.span_start}", span_end: "{event.span_end}"}

  # Phase B increment 3: the theme-class minimal pair of the preceding rule.
  # The surface is identical; only the disjoint YAML verb class licenses the
  # semantic role.
  - id: semantic/intransitive-name-theme
    phase: read
    match:
