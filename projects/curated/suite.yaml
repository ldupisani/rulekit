# The curated validation suite — synthetic strings only, NEVER benchmark
# items (the firewall). Each item: text + expect (number | yes/no verdict |
# "decline"). A decline expectation asserts the engine's honesty: committing
# anything there is a precision failure.
items:
  # ---- single-entity quantities -------------------------------------------
  - id: qty-single
    text: Tom has 3 apples. How many apples does Tom have?
    expect: 3
  - id: qty-single-worded
    text: Tom has seven apples. How many apples does Tom have?
    expect: 7
  - id: qty-single-compound-number
    text: Tom has twenty five marbles. How many marbles does Tom have?
    expect: 25
  - id: qty-single-comma-number
    text: Mary has 1,200 stickers. How many stickers does Mary have?
    expect: 1200
  - id: qty-two-entities-ask-one
    text: Tom has 3 apples. Mary has 4 apples. How many apples does Tom have?
    expect: 3
  - id: qty-two-measures-ask-one
    text: Tom has 3 apples. Tom has 5 books. How many books does Tom have?
    expect: 5

  # ---- accumulation with signed verbs -------------------------------------
  - id: acc-gain
    text: Tom has 10 marbles. Tom finds 5 marbles. How many marbles does Tom have?
    expect: 15
  - id: acc-loss
    text: Tom has 10 apples. Tom ate 4 apples. How many apples does Tom have?
    expect: 6
  - id: acc-gain-loss-chain
    text: Tom has 10 coins. Tom finds 3 coins. Tom lost 2 coins. How many coins does Tom have?
    expect: 11
  - id: acc-events-only
    text: Tom bought 6 eggs. Tom ate 2 eggs. How many eggs does Tom have?
    expect: 4

  # ---- combined / aggregation ----------------------------------------------
  - id: sum-two
    text: Tom has 3 apples. Mary has 4 apples. How many apples do they have altogether?
    expect: 7
  - id: sum-three
    text: Tom has 3 balls. Mary has 4 balls. Sue has 5 balls. How many balls do they have altogether?
    expect: 12

  # ---- relational quantities -----------------------------------------------
  - id: rel-more
    text: Tom has 3 apples. Mary has 2 more apples than Tom. How many apples does Mary have?
    expect: 5
  - id: rel-fewer
    text: Tom has 8 books. Mary has 3 fewer books than Tom. How many books does Mary have?
    expect: 5
  - id: rel-twice
    text: Tom has 3 apples. Mary has twice as many apples as Tom. How many apples does Mary have?
    expect: 6
  - id: rel-then-sum
    text: Tom has 4 toys. Mary has twice as many toys as Tom. How many toys do they have altogether?
    expect: 12
  - id: rel-chain
    text: Tom has 2 cards. Mary has 3 more cards than Tom. Sue has twice as many cards as Mary. How many cards does Sue have?
    expect: 10

  # ---- difference ------------------------------------------------------------
  - id: diff-more-than
    text: Tom has 3 apples. Mary has 7 apples. How many more apples does Mary have than Tom?
    expect: 4

  # ---- membership & the epistemic square ------------------------------------
  - id: member-yes
    text: Bob is a student. Is Bob a student?
    expect: "yes"
  - id: member-no
    text: Bob is not a student. Is Bob a student?
    expect: "no"
  - id: member-undetermined
    text: The rose wilted. Is Bob a student?
    expect: "undetermined"

  # ---- sense ambiguity (coverage arbitration) --------------------------------
  - id: ambig-rose-noun
    text: The rose wilted. Is Rose a teacher?
    expect: "undetermined"

  # ---- money: currency amounts are counted nouns -----------------------------
  - id: money-holdings
    text: Tom has $20. Tom spent $8. How much does Tom have?
    expect: 12
  - id: money-event-ask
    text: Tom spent $8. How much did Tom spend?
    expect: 8
  - id: money-dollars-word
    text: Tom has $20. How many dollars does Tom have?
    expect: 20
  - id: decline-rate
    text: Tom finds 3 coins a day. How many coins does Tom have?
    expect: decline

  # ---- entity-less asks (unique-entity consumer) ------------------------------
  - id: entityless-left
    text: Tom has 10 marbles. Tom lost 3 marbles. How many marbles are left?
    expect: 7
  - id: decline-entityless-two-holders
    text: Tom has 10 marbles. Mary has 5 marbles. How many marbles are left?
    expect: decline

  # ---- discourse: the document re-parse loop ---------------------------------
  - id: pronoun-unique-antecedent
    text: Tom has 10 apples. He ate 4 apples. How many apples does Tom have?
    expect: 6
  - id: pronoun-she
    text: Mary has 5 books. She finds 2 books. How many books does Mary have?
    expect: 7
  - id: pronoun-chain
    text: Tom has 2 coins. He finds 3 coins. He finds 5 coins. How many coins does Tom have?
    expect: 10
  - id: decline-ambiguous-pronoun
    text: Tom has 3 apples. Mary has 4 apples. He ate 2 apples. How many apples does Tom have?
    expect: decline

  # ---- transfer (awaiting packs/arithmetic/rules/transfer.yaml) --------------
  # These DECLINE until the transfer rule exists — safely: the unbound value
  # trips the value-accounting guard. Writing the rule flips them to correct.
  - id: transfer-recipient
    text: Tom has 10 apples. Mary has 2 apples. Tom gave Mary 3 apples. How many apples does Mary have?
    expect: 5
  - id: transfer-giver
    text: Tom has 10 apples. Mary has 2 apples. Tom gave Mary 3 apples. How many apples does Tom have?
    expect: 7

  # ---- declines: the honesty checks (each would be a precision failure) ------
  - id: decline-unknown-word
    text: Tom has 3 wugs. How many wugs does Tom have?
    expect: decline
  - id: decline-unknown-entity
    text: Tom has 3 apples. How many apples does Sue have?
    expect: decline
  - id: decline-wrong-measure
    text: Tom has 3 apples. How many books does Tom have?
    expect: decline
  - id: decline-no-relation-anchor
    text: Mary has 2 more apples than Tom. How many apples does Mary have?
    expect: decline
  - id: decline-unused-value
    text: Tom has 3 apples and 4 unknownthings. How many apples does Tom have?
    expect: decline
  - id: decline-conflicting-states
    text: Tom has 3 apples. Tom has 5 apples. How many apples does Tom have?
    expect: decline
  - id: repeat-events-accumulate
    text: Tom finds 3 coins. Tom finds 3 coins. How many coins does Tom have?
    expect: 6
  - id: event-verb-ask
    text: Tom bought 6 eggs. Tom ate 2 eggs. How many eggs did Tom eat?
    expect: 2
  - id: decline-event-ask-without-event
    text: Tom bought 6 eggs. How many eggs did Tom sell?
    expect: decline
  - id: decline-conjoined-subject
    text: Tom and Mary have 10 apples. How many apples does Tom have?
    expect: decline
  - id: decline-question-carries-unread-number
    text: Lisa walks 10 meters each minute. How many meters will Lisa walk in two days?
    expect: decline
