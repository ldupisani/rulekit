format: rulekit/elements@1
# Standard atomic weights (IUPAC conventional values), symbol -> g/mol.
#
# DATA, not code: an atomic mass keyed on a SYMBOL is a word-specific fact, so
# it lives here and the `molar-mass` consumer names no element (constitution
# rule 1). The table is also the VALIDATOR — numbers.py reads a token as a
# formula only when EVERY symbol in it appears here, which is what stops an
# acronym-shaped word being parsed as a compound.
#
# Deliberately not the whole periodic table: these are the elements the
# measured corpus questions use, plus the common light elements a neighbouring
# question would reach for. Adding a row is a one-line data change.
masses:
