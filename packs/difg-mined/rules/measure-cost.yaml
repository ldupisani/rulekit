format: rulekit/rules@1
# GEOMETRIC-MEASURE COSTING: "How much does it cost to tile a 4 meter by 6
# meter floor at $8 per square meter?" (192), "...plus 8% tax?" (207.36),
# "How much to fence a 4 by 6 yard at $5 per meter?" (100).
#
# THE CLASS: cost = (a geometric measure of a W-by-H rectangle) x (a unit
# rate), optionally taxed. One consumer, one arithmetic, no per-item branch.
#
# CONSTITUTION: the operation word is a CATEGORY gate (`area_measure` /
# `perimeter_measure`), never a literal list and never a word in Python. Each
# ask names its own structural OPCODE in `resolves` (op: area / op: perimeter),
# exactly as the arithmetic family picks add/subtract per-ask. 'tile', 'carpet'
# and 'fence' are NOUN-sensed in the lexicon, so a noun-rooted category accepts
# them; 'paint' is deliberately absent because it is a VERB there, and forcing
# a noun sense onto it is the trap that broke the `average` consumer.
#
# THE RATE UNIT CROSS-CHECKS THE OPERATION, and that is the point of splitting
# the asks rather than sharing one. An area ask REQUIRES "per SQUARE <unit>";
# a perimeter ask requires a bare "per <unit>". So "tile ... at $5 per meter"
# — an area job quoted at a linear rate — matches NEITHER shape and DECLINES,
# instead of confidently multiplying an area by a length rate. Two independent
# signals must agree or the engine refuses.
#
# `runit` gates on `measure_unit` for a structural reason, not decoration: a
# match sequence FLOATS, and 'square' is itself noun-sensed, so a bare
# `type: noun` slot would let the PERIMETER ask match "per square meter" with
# runit='square' and silently claim the area shape. 'square' is not a
# measure_unit; 'meter' is.
#
# THE PERIMETER FORMULA ASSUMES A RECTANGLE (2*(w+h)), which is what "a W by H
# yard" states. A shape that is not W-by-H never reaches this ask -- the
# literal 'by' between two measures is the whole gate.
# ⚠ THREE OF THE FOUR ASKS CANNOT FIRE YET, and the reason is NOT that their
# shapes are wrong -- their DEV items exist and their operands arrive. They are
# blocked by `obligations.disambiguate`, which commits only a UNIQUE winner: a
# SECOND ambiguous unit anywhere in the sentence can tie the arbitration, mark
# every ambiguous unit unresolved, and let the `ambiguity` guard veto before
# any ask is tried. "How much ..." always contributes one ('much':
# interrogative/quantifier); the long frame adds 'cost' (noun/verb) and an area
# rate adds 'square' (adjective/noun). Only the short frame with a length rate
# gets through today -- 1 DEV item of 3.
#
# This is BLOCKED, not DEAD (contrast the `power` formula physics removed,
# whose operands could never arrive at all): breaking that one tie converts the
# other two immediately. The blocker is pinned in tests/test_measure_cost.py so
# it stays visible, and a structural interrogative-after-interrogative
# pre-filter was tried and does NOT fix it -- 'cost'/'square' tie two ways on
# their own.
rules: []
asks:
  # ONE ask per operation. `type: number` tests the VALUE KIND and never the
  # sense, so it already matches BOTH "4 by 6" and "4 meter by 6 meter" -- a
  # `type: counted` twin for the unit-carrying form would be strictly narrower
  # and could never uniquely match. (It was written, and it was dead.)
  - id: ask/measure-cost-area
    match:
      question:
        - {lit: how}
        - {lit: much}
        - opt:
            - {lit: does}
            - {lit: it}
            - {lit: cost}
        - {lit: to}
        - {slot: op, cat: area_measure}
        - {slot: d1, type: number}
        - {lit: by}
        - {slot: d2, type: counted}
        - {lit: at}
        - {slot: rate, type: counted}
        - {lit: per}
        - {lit: square}
        - {slot: runit, cat: measure_unit}
        - opt:
            - {lit: plus}
            - {slot: tax, type: percent}
            - {lit: tax}
    resolves:
      consumer: measure-cost
      op: area
      d1: "{d1.value}"
      d2: "{d2.value}"
      rate: "{rate.value}"
      tax: "{tax.value}"

  # --- PERIMETER: the same shape, with a LENGTH rate ---------------------
  - id: ask/measure-cost-perimeter
    match:
      question:
        - {lit: how}
        - {lit: much}
        - opt:
            - {lit: does}
            - {lit: it}
            - {lit: cost}
        - {lit: to}
        - {slot: op, cat: perimeter_measure}
        - {slot: d1, type: number}
        - {lit: by}
        - {slot: d2, type: counted}
        - {lit: at}
        - {slot: rate, type: counted}
        - {lit: per}
        - {slot: runit, cat: measure_unit}
        - opt:
            - {lit: plus}
            - {slot: tax, type: percent}
            - {lit: tax}
    resolves:
      consumer: measure-cost
      op: perimeter
      d1: "{d1.value}"
      d2: "{d2.value}"
      rate: "{rate.value}"
      tax: "{tax.value}"
