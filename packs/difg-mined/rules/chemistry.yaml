format: rulekit/rules@1
# MOLAR MASS: "What is the molar mass of H2O?" -> 18.02 g/mol.
#
# The enabling piece is a READER, not a rule (the ISO-date precedent): a
# formula is ONE token carrying value_kind "formula" (tokenize.py keeps the
# subscripted run together, numbers.py validates every symbol against the
# element table). Before that "H2O" reached the ask as the three units H, 2, O.
#
# CONSTITUTION: the atomic masses are DATA (`rulekit/elements@1`) and the
# consumer sums them by symbol — no element is named in Python.
#
# 'molar mass' is ONE literal, not two: admitting 'molar' (as an adjective, so
# it cannot head anything) still lets condense merge it with the following noun
# into a single compound unit whose fold is 'molar mass' -- the documented
# 'square root' gotcha, confirmed with a trace before the ask was written. The
# word had to be admitted at all only because the unknown-word guard blocks a
# commit while any question word is unknown. That also FIXES THE
# SHAPE tightly, which matters more here than usual: the formula reader is
# permissive by construction — an acronym whose letters are all real symbols
# ('FBI' is F+B+I) reads as a formula — so the ask's own literals are what keep
# a stray one from ever being bound.
rules: []
asks:
  - id: ask/chem-molar-mass
    match:
      question:
        - {lit: what}
        - {lit: is}
        - {lit: molar mass}
        - {lit: of}
        - {slot: f, type: formula}
    resolves:
      consumer: molar-mass
      formula: "{f.components}"

  # --- quantities DERIVED from a formula's molar mass ----------------------
  # All three go to the same consumer with a structural opcode, because they
  # are one computation with different tails: moles <-> grams via the molar
  # mass, then an ordinary rate or the weight formula on top.
  #
  # NO CONSTANT ENTERS PYTHON for any of them. The gram->kilogram factor comes
  # from `rulekit/conversions@1` and g (9.8) from `rulekit/formulas@1`'s
  # `weight` expression, both already in the packs — so the consumer names no
  # unit and no constant.

  # "How many moles are in 36 grams of H2O?" -> grams / molar mass
  - id: ask/chem-moles-from-grams
    match:
      question:
        - {lit: how}
        - {lit: many}
        - {lit: moles}
        - {lit: are}
        - {lit: in}
        - {slot: g, cat: measure_unit}
        - {lit: of}
        - {slot: f, type: formula}
    resolves:
      consumer: molar-mass
      op: moles_from_grams
      formula: "{f.components}"
      amount: "{g.value}"

  # "What is the cost of 3 moles of NaCl at $0.50 per gram?"
  #   -> moles * molar mass * rate
  - id: ask/chem-cost-of-moles
    match:
      question:
        - {lit: what}
        - {lit: is}
        - {lit: cost}
        - {lit: of}
        - {slot: n, cat: measure_unit}
        - {lit: of}
        - {slot: f, type: formula}
        - {lit: at}
        - {slot: rate, type: counted}
        - {lit: per}
        - {slot: runit, cat: measure_unit}
    resolves:
      consumer: molar-mass
      op: cost_of_moles
      formula: "{f.components}"
      amount: "{n.value}"
      rate: "{rate.value}"

  # "What is the weight of 2 moles of H2O?" -> grams -> kilograms -> weight
  - id: ask/chem-weight-of-moles
    match:
      question:
        - {lit: what}
        - {lit: is}
        - {lit: weight}
        - {lit: of}
        - {slot: n, cat: measure_unit}
        - {lit: of}
        - {slot: f, type: formula}
    resolves:
      consumer: molar-mass
      op: weight_of_moles
      formula: "{f.components}"
      amount: "{n.value}"
