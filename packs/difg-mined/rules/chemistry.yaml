format: rulekit/rules@1
# MOLAR MASS: "What is the molar mass of H2O?" -> 18.02 g/mol.
#
# The enabling piece is a READER, not a rule (the ISO-date precedent): a
# formula is ONE token carrying value_kind "formula" (tokenize.py keeps the
# subscripted run together, numbers.py validates every symbol against the
# element table). Before that "H2O" reached the ask as the three units H, 2, O.
#
# CONSTITUTION: the atomic masses are DATA (`rulekit/elements@1`) and the
# consumer sums them by symbol — no element is named in Python.
#
# 'molar mass' is ONE literal, not two: admitting 'molar' (as an adjective, so
# it cannot head anything) still lets condense merge it with the following noun
# into a single compound unit whose fold is 'molar mass' -- the documented
# 'square root' gotcha, confirmed with a trace before the ask was written. The
# word had to be admitted at all only because the unknown-word guard blocks a
# commit while any question word is unknown. That also FIXES THE
# SHAPE tightly, which matters more here than usual: the formula reader is
# permissive by construction — an acronym whose letters are all real symbols
# ('FBI' is F+B+I) reads as a formula — so the ask's own literals are what keep
# a stray one from ever being bound.
rules: []
asks:
  - id: ask/chem-molar-mass
    match:
      question:
        - {lit: what}
        - {lit: is}
        - {lit: molar mass}
        - {lit: of}
        - {slot: f, type: formula}
    resolves:
      consumer: molar-mass
      formula: "{f.components}"
