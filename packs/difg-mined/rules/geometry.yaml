format: rulekit/rules@1
# The optional right-angle ask preserves its explicit compound boundary.
# General shape-property questions belong to the shared arithmetic grammar.
rules: []
asks:
- id: ask/geometry-hypotenuse
  match:
    question:
    - {lit: what}
    - {lit: is}
    - {lit: hypotenuse}
    - {lit: of}
    - {lit: right triangle}
    - {lit: with}
    - {lit: legs}
    - {slot: a, type: number}
    - {lit: and}
    - {slot: b, type: number}
  resolves:
    consumer: geometry
    shape: right triangle
    quantity: hypotenuse
    dim1: leg1
    val1: '{a.value}'
    dim2: leg2
    val2: '{b.value}'
