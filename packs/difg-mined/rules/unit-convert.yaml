format: rulekit/rules@1
# The difg `unit_conversion` domain: "How many inches are in 3 feet?" -> 36,
# "How many seconds are in 5 minutes?" -> 300, "How many ounces are in 2
# pounds?" -> 32.
#
# THE FIRST TYPED-GOLD DOMAIN. Its golds are quantities ("36 in", "300 s", "32
# oz"), not bare numbers, so before `gold: typed` (project.yaml) these items were
# DROPPED at build time and this domain had no mining signal at all. The engine
# answers the VALUE; the value is what is scored (harness/bench.py
# `_judge_typed`), and for a conversion the value encodes the unit — you cannot
# get 36 from "3 feet" without having converted to inches.
#
# THE CONVERSION FACTORS ARE DATA the engine already had: `conversions.yaml`
# (pack kind rulekit/conversions@1), which the registry stores in BOTH
# directions. This family adds no factor and no unit word — it only asks the
# table a question it could already answer. Adding new PAIRS is a separate
# increment with its own blast radius: the same table drives word-problem
# convertible-unit folds ("3 gallons of milk... 128 ounces").
#
# SPECIFICITY: both unit slots gate on `measure_unit` (categories/units.yaml)
# so this ask outranks ask/how-many-in-place, which otherwise claims the shape
# and reads "3 feet" as a PLACE ("how many inches does the foot have" — it
# declines). See that category's comment. When the nouns are not units, no member
# matches and that ask keeps the question exactly as it does today.
#
# THE IMPERATIVE FORM needed no kernel change after all: `imperative` is already
# an ASK_CUE_SENSE (engine.py), so "Convert 5 kilometers to meters" becomes a
# question the moment 'convert' carries that sense in the LEXICON — data, exactly
# as 'compute'/'calculate'/'determine' already do. See lexicon/a-f.yaml's
# 'convert' entry for why the other difg imperatives ('find'/'evaluate'/'solve')
# are deliberately NOT admitted.
rules: []
asks:
  - id: ask/unit-convert-how-many-in
    # "How many inches are in 3 feet?" — 'are'/'in' are skeleton literals here,
    # where ask/how-many-in-place has generic verb/preposition slots.
    match:
      question:
        - {lit: how}
        - {lit: many}
        - {slot: to, cat: measure_unit}
        - {lit: are}
        - {lit: in}
        - {slot: qty, cat: measure_unit}
    resolves:
      consumer: unit-convert
      value: "{qty.value}"
      from: "{qty}"
      to: "{to}"

  - id: ask/unit-convert-how-many-is
    # "How many km is 5 miles?" — the singular-copula variant of the same shape.
    match:
      question:
        - {lit: how}
        - {lit: many}
        - {slot: to, cat: measure_unit}
        - {lit: is}
        - {slot: qty, cat: measure_unit}
    resolves:
      consumer: unit-convert
      value: "{qty.value}"
      from: "{qty}"
      to: "{to}"

  - id: ask/unit-convert-imperative
    # "Convert 5 kilometers to meters" / "Convert 500 grams to kilograms" — the
    # imperative frame. Reachable only because 'convert' carries the `imperative`
    # sense (lexicon/a-f.yaml); the ask itself is the same shape as the
    # interrogative ones, one frame over.
    match:
      question:
        - {lit: convert}
        - {slot: qty, cat: measure_unit}
        - {lit: to}
        - {slot: to, cat: measure_unit}
    resolves:
      consumer: unit-convert
      value: "{qty.value}"
      from: "{qty}"
      to: "{to}"
