format: rulekit/rules@1
# DISCOUNTED / TAXED TOTALS: "What is 17% off $240 then 8% tax?" (215.14),
# "What is the total for 5 shirts at $20 each with 10% off and 8% tax?" (97.2).
#
# THE CLASS: a price -- flat, or per-unit times a count -- adjusted by an
# optional DISCOUNT and an optional TAX, applied multiplicatively in that
# order. One consumer, one arithmetic:
#     total = base x [qty] x (1 - discount) x (1 + tax)
#
# ORDER IS SEMANTIC, not incidental: tax applies to the DISCOUNTED price, which
# is what "17% off $240 then 8% tax" says and what every jurisdiction does.
# Applying them in the other order gives a different number, so the consumer
# fixes the order rather than leaving it to slot arrival.
#
# CONSTITUTION: 'off'/'tax'/'each'/'then'/'total' are grammatical skeleton
# literals, exactly like 'plus'/'minus' in the arithmetic family. No new
# lexicon, no new categories. The percent slots use `type: percent`, which
# numbers.py already folds ("17%" -> a percent-flagged fraction of 0.17), so a
# WORD fraction ("half off") structurally cannot reach these asks -- it is not
# percent-flagged. That is deliberate: "half off then 8% tax" is a fine English
# sentence this family has not measured, and an unmatched shape declines.
rules: []
asks:
  # "What is 17% off $240 [then 8% tax]?" -- a flat price, no count.
  - id: ask/discounted-total-flat
    match:
      question:
        - {lit: what}
        - {lit: is}
        - {slot: discount, type: percent}
        - {lit: 'off'}
        - {slot: base, type: counted}
        - opt:
            - {lit: then}
            - {slot: tax, type: percent}
            - {lit: tax}
    resolves:
      consumer: discounted-total
      base: "{base.value}"
      discount: "{discount.value}"
      tax: "{tax.value}"

  # "What is the total for 5 shirts at $20 each with 10% off [and 8% tax]?"
  - id: ask/discounted-total-per-unit
    match:
      question:
        - {lit: what}
        - {lit: is}
        - {lit: total}
        - {lit: for}
        - {slot: qty, type: counted}
        - {lit: at}
        - {slot: base, type: counted}
        - {lit: each}
        - {lit: with}
        - {slot: discount, type: percent}
        - {lit: 'off'}
        - opt:
            - {lit: and}
            - {slot: tax, type: percent}
            - {lit: tax}
    resolves:
      consumer: discounted-total
      base: "{base.value}"
      qty: "{qty.value}"
      discount: "{discount.value}"
      tax: "{tax.value}"
