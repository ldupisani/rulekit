  - repainted
  - repainting
  - repaints
  - trade
  - traded
  - trades
  - meet
  - meets
  - met
  animate_subject_verb: [cough, coughed, coughs, know, knew, knowing, knows]
  animate_object_verb: [meet, meets, met]
  holding_anchor_adverb:
    [already, also, always, initially, later, originally, recently, still, then]
  shucking_verb: [shuck, shucked, shucking, shucks]
  shuckable_item: [corn, ear, oyster, peas]
  # extends core-english's `animate` (see its note there): these 43
  # person-denoting nouns are lexically defined in THIS pack, so their
  # membership must be declared here — a member absent from the loading
  # project's lexicon is a CompileError, and core-english alone has only
  # five of them.
  animate: [baker, farmer, boy, girl, man, woman, mother, father,
            sister, brother, kid, doctor, nurse, worker, painter, chef,
            driver, dancer, seller, buyer, customer, neighbor, cousin,
            aunt, uncle, grandmother, grandfather, son, daughter, baby,
            parent, person, clerk, manager, guest, captain, shopkeeper,
            carpenter, tailor, fisherman, hunter, artist, writer,
            soldier]
  # Generic unit nouns are measures rather than bare quantity holders. The
  # core category owns the refusal boundary; this pack extends it beside the
  # specialized unit vocabulary it owns.
  non_quantity_holder:
