format: rulekit/categories@1
categories:
  accompany:
    parent: verb
  attach:
    parent: verb
  building:
    parent: noun
  capacity_attribute:
    parent: adjective
    notes: "Capacity-state predicates such as 'full'."
  capacity_noun:
    parent: noun
    notes: "Container nouns that license a capacity-state predicate."
  cashtoken:
    parent: noun
  charge:
    parent: noun
  clothing:
    parent: noun
  coin:
    parent: noun
  contribute:
    parent: verb
  discount:
    parent: noun
    notes: >
      'coupon'/'discount'/'tip' — any stated price ADJUSTMENT on top of a
      raw priced-purchase total (mining candidate change-asks: gates the
      change consumer's own unconsumed-predicate check, answer.py — the
      increment-10 'splits the cost' discipline generalized to a dobj
      CATEGORY rather than one specific verb, since a tip/discount is
      stated as a noun object, not a verb). Previously an unreferenced
      pack category (data only); this is its first kernel consumer.
  divide:
    parent: verb
  higher:
    parent: comparative
    antonym: lower
    polarity: 1
  journey:
    parent: noun
  marital_status_attribute:
    parent: adjective
    notes: "Marital-status predicates licensed only for animate nouns."
  lower:
    parent: comparative
    antonym: higher
    polarity: -1
  motion:
    parent: motion_comparison_verb
  multiplier_marker:
    parent: noun
    notes: >
      the multiplicative-ratio clause marker 'times' (as in "N times as
      many/much/the number of X as Y") — sensed 'noun' in the lexicon
      (t-z.yaml); the merged 'N times' MULTIPLIER value itself is assigned
      structurally in kernel/numbers.py and is unrelated to this category.
      engine.py's `_is_relational_clause` (mining candidate conjoined-
      clause-holdings) ORs membership in this category alongside
      'comparative'/'multiplier' to recognize a comparative/ratio clause
      structurally — the SAME "test a category, never enumerate the word
      in Python" shape as 'clause_marker_prep' below.
  person:
    parent: noun
  persongroup:
    parent: quantity_holder
  produce:
    parent: verb
    polarity: 1
  quality_attribute:
    parent: adjective
    notes: >
      Broad evaluative adjectives. Compatibility is still explicit: the
      adjective may describe either a declared quality bearer or an animate
      noun without making those noun categories equivalent.
  quality_bearer_noun:
    parent: noun
    notes: "Inanimate nouns with a measured ordinary quality predicate."
  receive:
    parent: verb
    polarity: 1
  retain:
    parent: verb
  tender_verb:
    parent: verb
    notes: >
      'pay'/'give' when their object is a stated currency amount ("pays
      with a $50 bill" / "gave $250 [to the cashier]" — mining candidate
      change-asks) is the buyer's TENDER, a narrower concept than the
      general 'lose' polarity event both verbs already carry (spending
      money is a loss for the general money fold; a change ask needs the
      specific "amount handed over" isolated from that, the same
      multi-membership pattern as 'sell' beside 'lose'). The already-
      general SVO fold emits the plain currency Quantity event on its
      own (no learn.py change needed); this category only lets the
      change consumer (answer.py) name tender events specifically
      without picking up 'ate'/'sold'/'spent'/etc, which also live under
      'lose'. Gated additionally on the fact's measure resolving to
      `currency` — an ordinary "gives 3 apples" never qualifies.
  vehicle:
    parent: motion_participant
