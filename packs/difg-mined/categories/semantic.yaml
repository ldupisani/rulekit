format: rulekit/categories@1
members:
  # Optional corpus-mined extensions to the core measurement vocabulary.
  measurement_container: [tray]
  # Cross-pack extensions of the explicit adjective/noun compatibility
  # boundary used by partition-attribute-of-noun.
  color_attribute: [white]
  quantity_event_verb: [trade, traded, trades]
  # Optional personal-reference vocabulary stays beside its lexical owner.
  animate: [tailor, uncle, woman, writer]
  # Generic unit nouns are measures rather than bare quantity holders. The
  # core category owns the refusal boundary; this pack extends it beside the
  # specialized unit vocabulary it owns.
  non_quantity_holder: [yard]
  duration_total_subject: [tape, video]
  # Container/place heads proven in quantitative PP adjuncts.
  quantity_location: [wardrobe, wheel, zoo]
  quantity_interior_location: [wardrobe, zoo]
  quantity_surface_location: [table, wheel]
  frame_prepositional_verb:
  - threw
  - throws
  ratio_particle_verb:
  - threw
  - throws
  motion_comparison_measure: [yard]
  length_measure: [yard]
  dimension_difference_measure: [yard]
  linear_unit_dimension_adjective: [wide]
  building: [tower, towers]
  discount: [tip, tips]
  lose: [threw, throws]
  person: [teammate, visitor, visitors, woman, women]
  vehicle: [taxi, taxis, tractor, tractors, tricycle, tricycles, van, vans, vehicle, wagon, wagons]
  means_noun: [train, vehicle]
