  # Extends core-english's reader-exclusion boundary with the copular forms
  # lexically defined in this pack. They are deliberately NOT `state` members:
  # that narrower subclass controls arithmetic holding/event semantics.
  non_event_verb: [been, being]
  # These transitive surfaces do not assert possession or acquisition of a
  # counted object. They may be useful elsewhere, but not in the direct
  # arithmetic quantity-object frame.
  non_quantity_object_verb:
  - afford
  - affords
  - came
  - come
  - comes
  - equals
  - measure
  - measured
  - measures
  quantity_event_verb:
