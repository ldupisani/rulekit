format: rulekit/categories@1
categories:
  accompany:
    parent: verb
  attach:
    parent: verb
  building:
    parent: noun
  cashtoken:
    parent: noun
  charge:
    parent: noun
  clothing:
    parent: noun
  coin:
    parent: noun
  contribute:
    parent: verb
  discount:
    parent: noun
    notes: >
      'coupon'/'discount'/'tip' — any stated price ADJUSTMENT on top of a
      raw priced-purchase total (mining candidate change-asks: gates the
      change consumer's own unconsumed-predicate check, answer.py — the
      increment-10 'splits the cost' discipline generalized to a dobj
      CATEGORY rather than one specific verb, since a tip/discount is
      stated as a noun object, not a verb). Previously an unreferenced
      pack category (data only); this is its first kernel consumer.
  divide:
    parent: verb
  higher:
    parent: comparative
    antonym: lower
    polarity: 1
  journey:
    parent: noun
  lower:
    parent: comparative
    antonym: higher
    polarity: -1
  motion:
    parent: verb
  multiplier_marker:
    parent: noun
    notes: >
      the multiplicative-ratio clause marker 'times' (as in "N times as
      many/much/the number of X as Y") — sensed 'noun' in the lexicon
      (t-z.yaml); the merged 'N times' MULTIPLIER value itself is assigned
      structurally in kernel/numbers.py and is unrelated to this category.
      engine.py's `_is_relational_clause` (mining candidate conjoined-
      clause-holdings) ORs membership in this category alongside
      'comparative'/'multiplier' to recognize a comparative/ratio clause
      structurally — the SAME "test a category, never enumerate the word
      in Python" shape as 'clause_marker_prep' below.
  person:
    parent: noun
  persongroup:
    parent: noun
  produce:
    parent: verb
    polarity: 1
  price_verb:
    parent: verb
    notes: >
      'ITEM cost(s) $X each' states a PER-UNIT price with the item as
      grammatical SUBJECT (not the object of buy) — gates the learn.py
      Price-fact emission site keyed on the subject noun, mirroring
      spend_verb's role as a pure consumer/emission gate (no polarity:
      a price is never a holding or an event quantity).
  purchase:
    parent: acquire
  receive:
    parent: verb
    polarity: 1
  retain:
    parent: verb
  sell:
    parent: lose
    notes: >
      narrow gate for the sales-revenue consumer (answer.py's
      _revenue_total, the sell-side mirror of increment 10's
      purchase-total) — same multi-membership pattern as 'purchase'/
      'acquire': 'sell'/'sold' stays tagged 'lose' too for the general
      event fold (an item sold is an item no longer held), while this
      narrower tag lets the revenue consumer name sell-events
      specifically without picking up 'ate'/'gave'/'threw'/etc, which
      also live under 'lose'.
  spend_target_prep:
    parent: preposition
    notes: >
      'for'/'on' — the trailing marker in "paid $5 FOR the shirt"/"spent
      $5 ON the shirt" (mining candidate priced-quantity-cost-asks): the
      priced-quantity-cost ask's own trailing prep slot is gated to this
      narrow pair rather than the general 'preposition' sense so it can
      never also match 'in' — a LITERAL already reserved by ask/how-
      much-rate-span and ask/earn-span for their own SPAN clause. A
      general preposition gate here would tie those asks on consumed-
      unit count for "how much did WHO pay IN N months" and let
      alphabetical id order silently mis-route a span question to the
      wrong consumer (mirrors clause_marker_prep's rationale in
      packs/difg-mined/categories/clauses.yaml for the same root sense).
      Lives here (not core-english) because 'for' is only lexically
      defined in this pack.
  tender_verb:
    parent: verb
    notes: >
      'pay'/'give' when their object is a stated currency amount ("pays
      with a $50 bill" / "gave $250 [to the cashier]" — mining candidate
      change-asks) is the buyer's TENDER, a narrower concept than the
      general 'lose' polarity event both verbs already carry (spending
      money is a loss for the general money fold; a change ask needs the
      specific "amount handed over" isolated from that, the same
      multi-membership pattern as 'sell' beside 'lose'). The already-
      general SVO fold emits the plain currency Quantity event on its
      own (no learn.py change needed); this category only lets the
      change consumer (answer.py) name tender events specifically
      without picking up 'ate'/'sold'/'spent'/etc, which also live under
      'lose'. Gated additionally on the fact's measure resolving to
      `currency` — an ordinary "gives 3 apples" never qualifies.
  timeperiod:
    parent: noun
  vehicle:
    parent: noun
members:
  # extends core-english's `animate` (see its note there): these 43
  # person-denoting nouns are lexically defined in THIS pack, so their
  # membership must be declared here — a member absent from the loading
  # project's lexicon is a CompileError, and core-english alone has only
  # five of them.
  animate: [baker, farmer, boy, girl, man, woman, mother, father,
            sister, brother, kid, doctor, nurse, worker, painter, chef,
            driver, dancer, seller, buyer, customer, neighbor, cousin,
            aunt, uncle, grandmother, grandfather, son, daughter, baby,
            parent, person, clerk, manager, guest, captain, shopkeeper,
            carpenter, tailor, fisherman, hunter, artist, writer,
            soldier]
  # mining candidate sum-constraint-premise-surfaces: 'age' is a difg-mined
  # lexicon word (packs/difg-mined/lexicon/a-f.yaml); the category itself
  # (parent/notes) is declared in core-english (packs/core-english/
  # categories/core.yaml — see that file's notes for the full mechanism),
  # mirroring 'child'/'toy'/'fish' below.
  age_noun:
