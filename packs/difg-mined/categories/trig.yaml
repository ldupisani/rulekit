format: rulekit/categories@1
# The angle-unit gate for the difg `trigonometry` domain. "30 degrees" folds into
# ONE counted unit (merge-count: "count '30' quantifies 'degrees' — one concept"),
# so the trig asks (rules/trig-ops.yaml) bind that unit and gate it on this
# category — a structural category name, never a word list in Python
# (constitution rule 1).
#
# The gate is what keeps the class honest in two directions:
#   1. "What is the sine of 30 APPLES?" cannot match, so an angle-less operand
#      declines instead of committing a nonsense number.
#   2. The `trigonometry` consumer converts DEGREES to radians unconditionally.
#      That conversion is only correct because this category admits the degree
#      unit and nothing else — 'radian'/'radians' are deliberately absent, so
#      "the sine of 2 radians" declines (definitive-or-decline) rather than being
#      silently read as degrees. A radian ask needs its own opcode, not a member
#      added here.
categories:
  angle_degrees: {parent: noun}
members:
  angle_degrees: [degree, degrees]
