format: rulekit/categories@1
# Exact compound selected by the existing right-angle question. The declaration
# does not classify bare triangles or admit an unstated right angle.
formulas:
  right triangle:
    hypotenuse:
      inputs: {leg1: length, leg2: length}
      expr: (leg1**2 + leg2**2)**0.5
      result_dimension: length
