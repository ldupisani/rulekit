format: rulekit/categories@1
# The measure-unit gate for the difg `unit_conversion` domain. Membership is
# exactly the unit set that `conversions.yaml` knows how to convert — a category
# name is structure; the words are DATA here, never a list in Python.
#
# The gate is what makes a conversion ask WIN over ask/how-many-in-place, which
# otherwise claims "How many inches are in 3 feet?" and reads it as "how many
# inches does the place 'foot' have" (it declines: no such quantity). Ask
# specificity ranks by (required tokens, Σ category-gate DEPTHS, where-count), so
# a two-cat-gated conversion ask outranks that one-gate ask on the SAME token
# count. The gate is therefore load-bearing, not decoration.
#
# It is also the honest reading: "how many X are in N Y" is a CONVERSION question
# exactly when X and Y are both units. When they are not ("how many apples are in
# the bowl"), no member matches, the conversion ask cannot fire, and
# ask/how-many-in-place keeps the question unchanged.
categories:
  measure_unit: {parent: noun}
  amount_of_substance_unit:
    parent: measure_unit
    notes: >
      Units that count chemical amount for molar-mass calculations. This is
      narrower than the general conversion-unit inventory.
  molar_mass_base_unit:
    parent: measure_unit
    notes: >
      Mass units whose numeric value is already in the base unit expected by
      the molar-mass consumer. Other convertible mass units are not silently
      treated as base-unit values.
  calendar_span_unit: {parent: noun}
  # RELATIVE CHANGE (rules/arithmetic-ops.yaml): English spells the same
  # computation four ways ('percent'/'percentage' x 'increase'/'decrease').
  # Naming the two word-classes turns four near-identical asks into one --
  # and 'increase'/'decrease' are VERB-sensed, hence a verb parent.
  percent_word: {parent: noun}
  change_direction: {parent: verb}
  area_measure: {parent: noun}
  perimeter_measure: {parent: noun}
members:
  amount_of_substance_unit: [moles]
  molar_mass_base_unit: [gram]
  measure_unit:
    # 'moles' is an AMOUNT-OF-SUBSTANCE unit, so the chemistry asks can gate on
    # it the same way every other quantity slot does. Plural form only -- see
    # the lexicon entry for why the singular is deliberately absent.
    - moles
    # THE ANGLE PAIR (the degrees<->radians increment). 'degree' keeps its
    # `angle_degrees` membership -- a word may sit in both, and the trig asks
    # gate on `angle_degrees` alone, so their territory is unchanged. What
    # this adds is reachability for the conversions table, which is the only
    # thing that reads `measure_unit` pairwise.
    - degree
    - radian
    - meter
    - centimeter
    - kilometer
    - mile
    - foot
    - inch
    - yard
    - gram
    - kilogram
    - ounce
    - pound
    - gallon
    - liter
    - milliliter
    - pint
    - quart
    # 'second' is DELIBERATELY ABSENT. In the lexicon it is an ADJECTIVE — the
    # ordinal ("the second box"), not the time unit — so it cannot be a member of
    # a noun-rooted category (the registry rejects it outright: "member 'second'
    # lacks the root sense 'noun'"). Giving it a noun sense to force it in is the
    # documented trap that broke the `average` consumer, and pytest caught that
    # one, NOT the dev gate. The cost is one declined item ("How many seconds are
    # in 5 minutes?"); the fix, if ever wanted, is a literal-variant ask, never a
    # second sense on an overloaded word.
    - minute
    - hour
    - day
    - week
  # The calendar-span family (ask/calendar-span-between). Deliberately NOT
  # `measure_unit`: that category is what the conversions table reads pairwise,
  # and admitting 'month'/'year' there would change unit folding in every
  # word-problem corpus. These four are only ever a span's unit.
  calendar_span_unit:
    - day
    - week
    - month
    - year
  # Geometric-measure COSTING (rules/measure-cost.yaml): the word that names
  # which measure of a W-by-H rectangle is being paid for. All NOUN-sensed in
  # the lexicon, so a noun-rooted category accepts them. 'paint' is
  # deliberately absent: it is a VERB there, and adding a noun sense to reach
  # a category is the `average`/`second` trap.
  percent_word:
    - percent
    - percentage
  change_direction:
    - increase
    - decrease
  area_measure:
    - tile
    - carpet
  perimeter_measure:
    - fence
