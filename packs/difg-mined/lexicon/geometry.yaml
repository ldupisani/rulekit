format: rulekit/lexicon@1
# Geometry shape/quantity/dimension nouns the difg geometry domain needs and
# core-english lacks (area/perimeter/length/width/side/base/height/rectangle/
# triangle already exist). Plain nouns; the geometry categories + formula table
# (geometry-categories.yaml, geometry.yaml) do the domain work.
entries:
  circle: {senses: [noun], plural: circles}
  cube: {senses: [noun], plural: cubes}
  sphere: {senses: [noun], plural: spheres}
  cylinder: {senses: [noun], plural: cylinders}
  radius: {senses: [noun], plural: radii}
  volume: {senses: [noun], plural: volumes}
  circumference: {senses: [noun], plural: circumferences}
  diagonal: {senses: [noun], plural: diagonals}
  # 'surface' as an ADJECTIVE so "surface area" merges (condense.py merge-
  # attribute) into one quantity unit (lemma 'area', qualifier 'surface') the
  # geometry_quantity slot matches; a sphere's plain 'area' IS its surface area,
  # so the (sphere, area) formula answers both phrasings.
  surface: {senses: [adjective]}
  # NOTE: 'square' gains its shape NOUN sense in n-s.yaml (it already had the
  # adjective there); it is a geometry_shape member in categories/geometry.yaml.
