    senses:
    - noun
    plural:
    - kg
    - kilograms
  # scibench: 'kJ' is the SYMBOL (a number-form of its unit, folded to 'kj' —
  # the 'kg' precedent above); the physics consumer scales it to the canonical
  # 'joule' through the conversions table at bind time
  kilojoule:
    senses:
    - noun
    plural:
    - kj
    - kilojoules
  kilometer:
    senses:
    - noun
    plural:
    # 'km' is the SYMBOL, and a symbol is a number-form of its unit exactly as
    # 'kg' already is for kilogram two entries up — that entry is the precedent,
    # this one just lacked the mirror. Without it 'km' keeps its own standalone
    # lemma and no conversion keyed on 'kilometer' can ever be reached from it
    # ("How many km is 5 miles?"). The plural map canonicalizes even when the
    # surface has its own entry (senses.py), which is why 'km' can stay listed
    # elsewhere without conflicting.
    - km
    - kilometers
