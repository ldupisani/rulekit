format: rulekit/lexicon@1
# The two arithmetic-operator words the unknown-word guard needs admitted so the
# `arithmetic` ask family (rules/arithmetic-ops.yaml) can commit: "the POWER of"
# ("2 to the power of 10") and "square ROOT of" ("the square root of 144"). Both
# plain nouns; every other operator word (plus/minus/times/divided/percent) was
# already admitted. Neither is quarantined (holdout-poison list checked). The
# operations themselves live in answer.py's `arithmetic` consumer, keyed by a
# structural opcode — no word-specific arithmetic fact in Python.
entries:
  power: {senses: [noun]}
  root: {senses: [noun]}
