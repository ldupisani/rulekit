format: rulekit/lexicon@1
# Vocabulary admitted specifically for the difg `physics` formula table. Every
# entry is load-bearing for a formula that fires; admitting a word removes an
# unknown-word decline guard, so each block records its own collision scope and
# gates. The first voltage entries below were collision-grepped across every
# corpus: they occur only in SciBench (1-4 items each), with zero exposure in
# GSM8K / ASDiv / SVAMP / MAWPS. None are quarantined.
#
# STILL NOT ADMITTED — 'force', 'density', 'newton'. They belong to
# formulas whose dimensions/scales remain deliberately unregistered ('force' 1
# GSM8K TEST, 'density' 4 train, 'newton' 1 TEST as the NAME). Preserving their
# compound symbols does not by itself admit either quantity.
#
# 'energy' WAS on that list; its refusal reason expired when the entropy-change
# formula landed (formulas.yaml: ΔS = energy/temperature, bought by the scibench
# entropy pair — a formula that FIRES). Exposure re-measured 2026-07-20: gsm8k
# train 8 / TEST 2, folio 3 — the six-corpus diff is the arbiter, as ever.
entries:
  voltage: {senses: [noun]}
  # not a unit — admitted only so the unknown-word guard stops blocking the
  # voltage item ("a 5 OHM RESISTOR"), whose operands both bind. 1 SciBench item.
  resistor: {senses: [noun], plural: resistors}
  ohm: {senses: [noun], plural: ohms}
  amp: {senses: [noun], plural: amps}
  # the entropy-pair sentence ("...when 25 kJ of ENERGY is TRANSFERRED
  # REVERSIBLY and ISOTHERMALLY as HEAT to a large block of IRON at 100 degrees
  # C"). Collision-grepped 2026-07-20: reversibly/isothermally 0 everywhere;
  # transferred gsm8k-train 4 + folio 3; heat gsm8k 3+3, folio 8; iron gsm8k
  # 9+2, folio 2. The unknown-word guard is what these lift — gated on all six.
  energy: {senses: [noun]}
  transferred: {senses: [verb], verb: {lemma: transfer}}
  reversibly: {senses: [adverb]}
  isothermally: {senses: [adverb]}
  heat: {senses: [noun]}
  iron: {senses: [noun]}
  # Wien buyer: declarative vocabulary only. `blackbody` modifies the emitted
  # radiation; Earth is noun-sensed so the ordinary possessive compound reader
  # can resolve "Earth's ..." without a word-specific kernel branch.
  earth: {senses: [noun]}
  blackbody: {senses: [adjective]}
  radiation: {senses: [noun]}
  # Canonical energy unit for the document-scoped power formula. The plural and
  # singular are one identity, following kilogram/kilograms and kilojoule/kJ.
  joule: {senses: [noun], plural: joules}
  # Exact output-quantity modifiers for the gravitational-potential formula.
  # They remain data; the ask routes the complete qualified phrase generically.
  gravitational: {senses: [adjective]}
  potential: {senses: [adjective]}
  # Momentum buyer: `m/s` is a number-form of one semantic velocity unit, just
  # as `kg` is a number-form of kilogram. `moving` is ordinary verbal syntax;
  # admitting it removes the unknown-word guard without giving the kernel a
  # word-specific branch. GSM8K exposure is gated explicitly for this change.
  momentum: {senses: [noun]}
  moving: {senses: [verb], verb: {lemma: move}}
  meter_per_second: {senses: [noun], plural: [m/s]}
