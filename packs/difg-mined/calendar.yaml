format: rulekit/calendar@1
# How many DAYS make one unit of each calendar span. Word-specific facts, so
# they live here rather than in the consumer (constitution rule 1).
#
# 'month' and 'year' are AVERAGES (30.44 = 365.25/12, 365.25 = the Julian
# year), because a calendar month has no fixed length. That is exact enough
# for a whole-unit span -- difg's golds are whole months/years and the
# typed-gold comparator is 1% relative -- and it is why this table is not
# `conversions.yaml`: putting 'month -> day' in THAT table would let the
# word-problem convertible-unit fold silently rewrite "$5 per month" in every
# arithmetic corpus. A separate table keeps the blast radius at this consumer.
span_units:
  day: 1.0
  week: 7.0
  month: 30.4375
  year: 365.25

# Month names and their usual three-letter abbreviations. Word-specific facts,
# so they are data (constitution rule 1) -- the `calendar` consumer builds a
# date from (day, month, year) slots and never names a month.
months:
  january: 1
  jan: 1
  february: 2
  feb: 2
  march: 3
  mar: 3
  april: 4
  apr: 4
  may: 5
  june: 6
  jun: 6
  july: 7
  jul: 7
  august: 8
  aug: 8
  september: 9
  sep: 9
  sept: 9
  october: 10
  oct: 10
  november: 11
  nov: 11
  december: 12
  dec: 12
