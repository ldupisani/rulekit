format: rulekit/lexicon@1
entries:
  # Ordinary vocabulary required by the reusable base formulas. These words
  # previously lived in difg-mined even though neither their meaning nor the
  # supported questions are corpus-specific.
  done: {senses: [adjective]}
  earth: {senses: [noun]}
  energy: {senses: [noun]}
  gravitational: {senses: [adjective]}
  joule: {senses: [noun], plural: joules}
  meter_per_second: {senses: [noun], plural: [m/s]}
  momentum: {senses: [noun]}
  moving: {senses: [verb], verb: {lemma: move}}
  object: {senses: [noun], plural: objects}
  power: {senses: [noun]}
  potential: {senses: [adjective]}
  speed: {senses: [noun], plural: speeds}
