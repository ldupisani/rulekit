format: rulekit/rules@1
rules:
  # Personal role-at-place premises live in arithmetic/rules/role-locations.yaml.
  # Numeric possessive universals stay structured instead of becoming an
  # opaque predicate phrase. The bare-plural slot supplies the grammatical
  # evidence for singularizing the class key.
  - id: logic-arithmetic/universal-all-have-quantity
    phase: read
    match:
      sentence:
        - {lit: all, at_start: true}
        - {slot: cls, type: bare_plural}
        - {lit: have}
        - {slot: item, type: counted}
        - {lit: ".", consume_skipped: true}
    where:
      - slot_not_category: {slot: item, cat: many_incompatible_noun}
    emits:
      - {fact: quantified_quantity, cls: "{cls.singular}", measure: "{item}", value: "{item.value}", verb: have}

  # Keep a rejected raw count head from falling through to the generic fold.
  - id: logic-arithmetic/universal-all-have-incompatible-item-safety
    phase: read
    generation: safety
    match:
      sentence:
        - {lit: all, at_start: true}
        - {slot: cls, type: bare_plural}
        - {lit: have}
        - {slot: item, cat: many_incompatible_noun, counted: true}
        - {lit: ".", consume_skipped: true}
    emits: []

  # The one-PP restricted sibling preserves its complete class phrase and is
  # kept separate so every slot remains directly generatable and reviewable.
  # A spatial word alone is not enough: the exact preposition/place pair must
  # also be licensed by the shared compatibility table.
  - id: logic-arithmetic/universal-all-have-quantity-pp
    phase: read
    match:
      sentence:
        - {lit: all, at_start: true}
        - {slot: cls, type: bare_plural}
        - {slot: prep, cat: class_restriction_preposition}
        - {lit: the, consume_skipped: true}
        - {slot: restriction, cat: class_restriction_place}
        - {lit: have}
        - {slot: item, type: counted}
        - {lit: ".", consume_skipped: true}
    where:
      - attribute_compatible: {attribute: prep, noun: restriction}
      - slot_not_category: {slot: item, cat: many_incompatible_noun}
    emits:
      - {fact: quantified_quantity, cls: "{cls.singular} {prep} {restriction}", measure: "{item}", value: "{item.value}", verb: have}

  # PP-restricted counterpart of the raw-item refusal above. It consumes the
  # complete clause and therefore cannot leak a holding for the PP object.
  - id: logic-arithmetic/universal-all-have-quantity-pp-incompatible-item-safety
    phase: read
    generation: safety
    match:
      sentence:
        - {lit: all, at_start: true}
        - {slot: cls, type: bare_plural}
        - {slot: prep, cat: class_restriction_preposition}
        - {lit: the, consume_skipped: true}
        - {slot: restriction, cat: class_restriction_place}
        - {lit: have}
        - {slot: item, cat: many_incompatible_noun, counted: true}
        - {lit: ".", consume_skipped: true}
    where:
      - attribute_compatible: {attribute: prep, noun: restriction}
    emits: []

  # An elided additive universal is not an entity-to-entity event. Keep the
  # class, signed offset, measure, and state verb explicit until saturation
  # can prove an exact refining member and find one compatible class-wide
  # baseline. `generic_plural` permits a compound class while still refusing
  # a counted or possessive subject; `.qualified` preserves that whole class.
  - id: logic-arithmetic/universal-all-have-adjustment
    phase: read
    match:
      sentence:
        - {lit: all, at_start: true}
        - {slot: cls, type: generic_plural}
        - {lit: have}
        - {slot: n, type: number, standalone: true}
        - {slot: dir, cat: count_quantity_delta}
        - {slot: item, cat: noun}
        - {lit: ".", consume_skipped: true}
    where:
      - same_number: [n, item]
    consumes: [n]
    satisfies: {n: [quantifies]}
    emits:
      - {fact: quantified_adjustment, cls: "{cls.qualified}", measure: "{item}", offset: "n * sign(dir)", verb: have}

  # A binary named coordination shares one finite bare-form verb and one
  # definite PP. Emit the structured verbal relation once per subject; a
  # separate pack-owned mapping decides whether that relation licenses a
  # nominal role. Disjunction, coordinated objects, additional PP material,
  # singular verb agreement, missing sentence boundaries, and undeclared
  # preposition/place pairs do not match.
  - id: logic-arithmetic/coordinated-named-verbal-pp
    phase: read
    match:
      sentence:
        - {slot: left, type: name, at_start: true}
        - {slot: conjunction, cat: holder_list_conjunction}
        - {slot: right, type: name}
        - {slot: verb, cat: subject_role_predicate, bare_form: true, single_word: true}
        - {slot: prep, cat: class_restriction_preposition}
        - {lit: the, consume_skipped: true}
        - {slot: restriction, cat: class_restriction_place}
        - {lit: ".", consume_skipped: true}
    where:
      - distinct: [left, right]
      - attribute_compatible: {attribute: prep, noun: restriction}
    satisfies: {verb: [subject]}
    emits:
      - {fact: verbal_relation, entity: "{left}", verb: "{verb}", prep: "{prep}", obj: "{restriction}", polarity: true}
      - {fact: verbal_relation, entity: "{right}", verb: "{verb}", prep: "{prep}", obj: "{restriction}", polarity: true}

  # A question-scoped or asserted universal inability to terminate location.
  # The negative subject, impossibility modal, departure predicate, definite
  # place, and sentence boundary are all explicit. `may`/`must`/`should` do
  # not enter the modal category, so prohibition or obligation never becomes
  # physical impossibility. The pronoun's ordinary referential obligation is
  # discharged by this quantified construction rather than by inventing an
  # antecedent for `nobody`.
  - id: logic-arithmetic/universal-location-exit-impossibility
    phase: read
    question_assumption: true
    match:
      sentence:
        - {slot: subject, cat: negative_person_pronoun, at_start: true}
        - {slot: modal, cat: location_impossibility_modal}
        - {slot: verb, cat: location_terminating_verb, bare_form: true, single_word: true}
        - {lit: the, consume_skipped: true}
        - {slot: place, cat: spatial_reference_noun}
        - {lit: ".", consume_skipped: true}
    satisfies:
      subject: [refers]
    emits:
      - fact: location_constraint
        place: "{place}"
        transition: terminates
        modality: impossible
        subject_class: person

  # Factual absence of departures during the current narrative interval. This
  # is not inability: it records that no qualifying transition occurred up to
  # the question's reference day. The exact past category keeps bare/present
  # departure forms out, and the quantified rule discharges `nobody` without
  # inventing an antecedent.
  - id: logic-arithmetic/universal-location-exit-absence
    phase: read
    match:
      sentence:
        - {slot: subject, cat: negative_person_pronoun, at_start: true}
        - {slot: verb, cat: location_terminating_past_verb, single_word: true}
        - {lit: the, consume_skipped: true}
        - {slot: place, cat: spatial_reference_noun}
        - {lit: ".", consume_skipped: true}
    satisfies:
      subject: [refers]
    emits:
      - fact: location_transition_absence
        place: "{place}"
        transition: terminates
        scope: narrative-through-reference
        subject_class: person

  - id: logic-arithmetic/dated-location-arrival
    phase: read
    description: >
      A named arrival at one declared place and day, such as "Aven arrived at
      the garden yesterday". The generic spatial and temporal learners retain
      the event facts; this exact grammar gives contextual ask generation a
      reviewable premise target. A past arrival may occur yesterday or
      earlier today; a future day requires a different verb construction.
    match:
      sentence:
        - {slot: who, type: name, at_start: true}
        - {slot: verb, cat: location_initiating_past_verb, finite_form: true}
        - {slot: prep, cat: arrival_goal_preposition}
        - {lit: the, consume_skipped: true}
        - {slot: place, cat: spatial_reference_noun}
        - {slot: when, cat: day_deictic_marker}
        - {lit: ".", consume_skipped: true}
    where:
      - slot_not_category: {slot: when, cat: future_day_marker}

asks:
  # Finite-domain temporal location selection. `them` must already denote one
  # conservative prior named-subject group; the ask never enumerates every
  # name or fact holder on its own. Day-grained time deliberately excludes
  # `now`, whose instant semantics requires tense/aspect work beyond this slice.
  - id: ask/which-discourse-group-at-day
    match:
      question:
        - {lit: which, at_start: true}
        - {lit: of}
        - {slot: group, cat: discourse_group_pronoun}
        - {slot: copula, cat: plural_copula}
        - {slot: prep, cat: spatial_location_preposition}
        - {lit: the, consume_skipped: true}
        - {slot: place, cat: spatial_reference_noun}
        - {slot: when, cat: day_deictic_marker}
    resolves:
      consumer: location-witnesses
      candidates: "{group.group_members}"
      place: "{place}"
      when: "{when}"
    generation:
      context_required: true
      context_strategy: evidence
      slot_categories:
        prep: [arrival_goal_preposition]
        # The declared evidence plan supplies past arrivals. Restrict only
        # generated scenarios; the reader still accepts future witness asks.
        when: [past_day_marker, current_day_marker]
      evidence_rules:
        - rule: logic-arithmetic/dated-location-arrival
          bindings: {who: candidates.0, place: place, when: when}
        - rule: logic-arithmetic/dated-location-arrival
          bindings: {who: candidates.1, place: place, when: when}
