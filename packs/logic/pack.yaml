format: rulekit/pack@1
name: logic
version: 0.1.0
requires:
- core-english
description: >
  The FOLIO logic campaign's pack: phrase-keyed universal/ground extraction,
  Horn-clause synth (instantiation + chaining), and the embedded-declarative
  verdict asks. LISTED ONLY BY projects/folio — pack scoping is the campaign's
  cross-corpus containment (no other corpus loads a single verdict-producing
  rule, so widening Answer.committed cannot change their outcomes; the proof
  the ship gate then verifies). Facts here are keyed by FULL canonical
  phrases, never lemma heads — see model.Atom's docstring for why anything
  looser is a confident-wrong machine on logic prose.
