format: rulekit/categories@1
# The attribute-selection gate for reference lookups, exactly the
# physics_quantity pattern: ask/reference-* gates its slot on this and the
# reference-lookup consumer takes the WORD to the compiled table. Members are
# exactly the attributes geography.yaml declares — an attribute without data
# cannot match the gate, so it declines at the ask.
categories:
  reference_attribute: {parent: noun}
members:
  reference_attribute: [population, area]
  # `population` is lexically owned by this pack. Extend the generic
  # compatibility categories here rather than making core-english depend on a
  # word unavailable to core-only and benchmark projects.
  magnitude_noun: [population]
  remainder_collection_noun: [population]
  # Bare plural populations need an explicit demographic/ecological frame;
  # ordinary possession comparison does not infer one from `has` alone.
  bare_possession_incompatible_noun: [population]
