format: rulekit/rules@1
# Reference lookups: "What is the <attribute> of <Entity> [in <year>]?".
# Two shapes, not one with an optional tail: the year form consumes more units,
# so ask-ranking (max consumed) picks it exactly when a year is stated. The
# entity slot is a NAME (the affine-convert precedent) — proper names need no
# lexicon entry, and an entity the table does not hold declines in the
# consumer, never guesses. A YEAR-LESS ask against a by-year attribute also
# declines (registry stores no year-less key for a time series) — "the
# population of France" does not get a silently-chosen year.
rules: []
asks:
  - id: ask/reference-attribute
    match:
      question:
        - {lit: what}
        - {lit: is}
        - {slot: a, cat: reference_attribute}
        - {lit: of}
        - {slot: e, type: name}
    resolves:
      consumer: reference-lookup
      attribute: "{a}"
      entity: "{e}"
  - id: ask/reference-attribute-year
    match:
      question:
        - {lit: what}
        - {lit: is}
        - {slot: a, cat: reference_attribute}
        - {lit: of}
        - {slot: e, type: name}
        - {lit: in}
        - {slot: y, type: number}
    resolves:
      consumer: reference-lookup
      attribute: "{a}"
      entity: "{e}"
      year: "{y.value}"
  # Aggregates over a GROUP (B2): "What is the total population of Europe in
  # 2020?" — computed over the set of entities whose group column names the
  # slot value, in DuckDB (rulekit.reference.db), derived from the same frozen
  # tables. 'total'/'average' are literals exactly as statistics.yaml's
  # 'average' is; the op reaches the consumer as data. Year forms win by
  # consumed length when a year is stated; a year-less ask against a by-year
  # attribute finds no rows and declines.
  - id: ask/reference-aggregate-total
    match:
      question:
        - {lit: what}
        - {lit: is}
        - {lit: total}
        - {slot: a, cat: reference_attribute}
        - {lit: of}
        - {slot: g, type: name}
    resolves:
      consumer: reference-aggregate
      op: total
      attribute: "{a}"
      group: "{g}"
  - id: ask/reference-aggregate-total-year
    match:
      question:
        - {lit: what}
        - {lit: is}
        - {lit: total}
        - {slot: a, cat: reference_attribute}
        - {lit: of}
        - {slot: g, type: name}
        - {lit: in}
        - {slot: y, type: number}
    resolves:
      consumer: reference-aggregate
      op: total
      attribute: "{a}"
      group: "{g}"
      year: "{y.value}"
  - id: ask/reference-aggregate-average
    match:
      question:
        - {lit: what}
        - {lit: is}
        - {lit: average}
        - {slot: a, cat: reference_attribute}
        - {lit: of}
        - {slot: g, type: name}
    resolves:
      consumer: reference-aggregate
      op: average
      attribute: "{a}"
      group: "{g}"
  - id: ask/reference-aggregate-average-year
    match:
      question:
        - {lit: what}
        - {lit: is}
        - {lit: average}
        - {slot: a, cat: reference_attribute}
        - {lit: of}
        - {slot: g, type: name}
        - {lit: in}
        - {slot: y, type: number}
    resolves:
      consumer: reference-aggregate
      op: average
      attribute: "{a}"
      group: "{g}"
      year: "{y.value}"
