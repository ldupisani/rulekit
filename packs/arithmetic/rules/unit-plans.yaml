format: rulekit/rules@1
rules:
- id: arithmetic/scheduled-unit-count
  match:
    sentence:
    - slot: during
      cat: temporal_interval_preposition
      at_start: true
    - slot: period
      cat: duration_measure
      counted: true
      bare: true
      value_min: 1
    - lit: ','
      consume_skipped: true
    - slot: there
      cat: existential
    - slot: be
      cat: plural_copula
    - slot: events
      cat: scheduled_event
      counted: true
      qualified: true
    - lit: through
      consume_skipped: true
    - slot: site
      type: entity
      common_noun_cat: quantity_location
      referential: true
    - lit: .
      consume_skipped: true
  emits:
  - fact: batch_evidence
    kind: unit-plan-link
    entity: ''
    measure: '{events}'
    value: events
    position: '{events.span_start}'
    container: '{period}'
    attribute: '{events.qualifier}'
    acquisition: '{events.qualifier}'
    per_member: period
  consumes:
  - period
  - events
  - be
  satisfies:
    during:
    - object
    be:
    - subject
  where: []
  description: Preserve a declared object, resource, application or unit ratio in one quantity plan; the
    consumer checks identity and actual use versus capacity.
