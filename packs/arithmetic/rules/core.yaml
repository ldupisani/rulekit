      NOUN" merge, never a bare common noun, so this can't be confused
      with times-as-many/times-as-much's own "as many/as much ITEM as Y"
      shape: those require a LITERAL 'as' immediately after the
      multiplier, which this rule's very next token (the possessed noun
      itself) can never satisfy, and vice versa — the two families are
      structurally disjoint spans, not a specificity tie-break. `standard:
      "{std.owner}"` / `measure: "{std}"` read the OWNER and the noun's
      own lemma separately off the SAME merged unit (`_slot_value`'s
      `owner` attribute vs. its default lemma lookup, patterns.py) — the
      Relation's standard is the PERSON ('cecil'), its measure the noun
      itself ('marble'), never the reverse. A distinct owner predicate
      rejects self-comparisons such as "Fia has twice Fia's marbles";
      ordinary `distinct` compares the slot lemmas `fia` and `marble` and
      cannot express that boundary. PROVEN minimal pair on
      unmodified main: "Catherine has twice as much money as Cecil"
      commits while "Catherine has twice Cecil's money" declines outright.
      `who, type: name`: unwidened, matching times-as-much's own
      (not-yet-widened) slot type — this candidate's own structural sample
      never needed the common-noun-subject widening times-as-many/times-
      as-much-elided-standard already carry.
    match:
      sentence:
        - {slot: who, type: name}
        - {slot: verb, cat: possession_state}
        - {slot: k, type: nonunit_multiplier}
        - {slot: std, cat: noun, possessed: true, number: plural}
    where:
      - number_compatible: [who, verb]
      - slot_not_category: {slot: std, cat: mass_quantity_noun}
      - distinct_from_owner: {entity: who, possessed: std}
    emits:
      - fact: relation
        subject: "{who}"
        standard: "{std.owner}"
        measure: "{std}"
        factor: "k"
        offset: 0.0
        verb: "{verb}"

