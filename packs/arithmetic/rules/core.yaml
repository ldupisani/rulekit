  - id: arithmetic/times-as-many-possessive-standard
    phase: read
    description: >
      mining candidate relation-standard-frames: "Carmela has twice
      Cecil's marbles" — the count possessive-NP standard, one measure
      family over from arithmetic/times-as-old-as-possessive-standard: a
      declared plural owned measure noun, never restricted to 'age' — that
      rule's own `cat: age_noun` gate makes it strictly MORE
