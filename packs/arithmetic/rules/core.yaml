format: rulekit/rules@1
# Minimum-structure rule: only the grammatical skeleton is literal; every
# content word is a captured, gated slot. Rules emit FACTS — the shared
# saturate/answer pipeline finishes. There is no priority field anywhere.
rules:
  - id: arithmetic/anchored-relation
    phase: read
    description: >
      "X has N more/fewer ITEM than Y" — a Relation fact; the relation
      synthesizer resolves it against Y's known quantity.
    match:
      sentence:
        - {slot: who, type: name}
        - {slot: verb, type: verb}
        - {slot: n, type: number}
        - {slot: dir, cat: delta}
        - {slot: item, type: plural}
        - {lit: than}
        - {slot: std, type: name}
    where:
      - distinct: [who, std]
    consumes: [n]
    emits:
      - fact: relation
        subject: "{who}"
        standard: "{std}"
        measure: "{item}"
        factor: 1.0
        offset: "n * sign(dir)"
        verb: "{verb}"

  - id: arithmetic/anchored-relation-postfix
    phase: read
    description: >
      "X picked 12 apples more than Y" — the POSTFIX comparative order: the
      count has already condensed into the noun, and the direction word
      follows it. Same Relation fact as the prefix form.
    match:
      sentence:
        - {slot: who, type: name}
        - {slot: verb, type: verb}
        - {slot: item, type: counted}
        - {slot: dir, cat: delta}
        - {lit: than}
        - {slot: std, type: name}
    where:
      - distinct: [who, std]
    consumes: [item]
    emits:
      - fact: relation
        subject: "{who}"
        standard: "{std}"
        measure: "{item}"
        factor: 1.0
        offset: "item * sign(dir)"
        verb: "{verb}"

  - id: arithmetic/times-as-many
    phase: read
    description: >
      "X has twice as many ITEM as Y" — a pure-ratio Relation fact
      (the rarer, more specific trigger; the offset case needs the
      anchored-relation shape).
    match:
      sentence:
        - {slot: who, type: name}
        - {slot: verb, type: verb}
        - {slot: k, type: multiplier}
        - {lit: as}
        - {lit: many}
        - {slot: item, type: plural}
        - {lit: as}
        - {slot: std, type: name}
    where:
      - distinct: [who, std]
    emits:
      - fact: relation
        subject: "{who}"
        standard: "{std}"
        measure: "{item}"
        factor: "k"
        offset: 0.0
        verb: "{verb}"

  - id: arithmetic/fraction-delta-relation
    phase: read
    description: >
      "twenty percent FEWER frogs than Lassie Lake" / "50% MORE X than Y" —
      a proportional delta: subject = (1 + f·sign(dir)) × standard.
    match:
      sentence:
        - {slot: who, type: name}
        - {slot: verb, type: verb}
        - {slot: f, type: fraction}
        - {slot: dir, cat: delta}
        - {slot: item, type: noun}
        - {lit: than}
        - {slot: std, type: name}
    where:
      - distinct: [who, std]
    consumes: [f]
    emits:
      - fact: relation
        subject: "{who}"
        standard: "{std}"
        measure: "{item}"
        factor: "1 + f * sign(dir)"
        offset: 0.0
        verb: "{verb}"

  - id: arithmetic/times-the-number-of
    phase: read
    description: >
      "has four times the number of sharks as Newport" — the times-as-many
      ratio in its 'the number of' frame ('number'/'amount' are the frame's
      skeleton, like 'total of').
    match:
      sentence:
        - {slot: who, type: name}
        - {slot: verb, type: verb}
        - {slot: k, type: multiplier}
        - {slot: frame, cat: aggregate_noun}
        - {lit: of}
        - {slot: item, type: noun}
        - {lit: as}
        - {slot: std, type: name}
    where:
      - distinct: [who, std]
    emits:
      - fact: relation
        subject: "{who}"
        standard: "{std}"
        measure: "{item}"
        factor: "k"
        offset: 0.0
        verb: "{verb}"

  - id: arithmetic/affine-frame-relation
    phase: read
    description: >
      "Greg has read 9 more than twice the number of books that Kelcie has
      read" — the AFFINE frame: subject = k·standard + n·sign(dir).
    match:
      sentence:
        - {slot: who, type: name}
        - {slot: verb, type: verb}
        - {slot: n, type: number}
        - {slot: dir, cat: delta}
        - {lit: than}
        - {slot: k, type: multiplier}
        - {slot: frame, cat: aggregate_noun}
        - {lit: of}
        - {slot: item, type: noun}
        - {slot: c, cat: complementizer}
        - {slot: std, type: name}
    where:
      - distinct: [who, std]
    consumes: [n]
    emits:
      - fact: relation
        subject: "{who}"
        standard: "{std}"
        measure: "{item}"
        factor: "k"
        offset: "n * sign(dir)"
        verb: "{verb}"

  - id: arithmetic/fraction-frame-relation
    phase: read
    description: >
      "Kelcie has read 1/4 the amount of books that Megan has read" — a
      pure-fraction ratio in the frame form.
    match:
      sentence:
        - {slot: who, type: name}
        - {slot: verb, type: verb}
        - {slot: f, type: fraction}
        - {slot: frame, cat: aggregate_noun}
        - {lit: of}
        - {slot: item, type: noun}
        - {slot: c, cat: complementizer}
        - {slot: std, type: name}
    where:
      - distinct: [who, std]
    consumes: [f]
    emits:
      - fact: relation
        subject: "{who}"
        standard: "{std}"
        measure: "{item}"
        factor: "f"
        offset: 0.0
        verb: "{verb}"

  - id: arithmetic/fraction-as-many
    phase: read
    description: >
      "Kelcie read half as many books as Megan" — the times-as-many shape
      with a FRACTION ratio.
    match:
      sentence:
        - {slot: who, type: name}
        - {slot: verb, type: verb}
        - {slot: f, type: fraction}
        - {lit: as}
        - {lit: many}
        - {slot: item, type: plural}
        - {lit: as}
        - {slot: std, type: name}
    where:
      - distinct: [who, std]
    consumes: [f]
    emits:
      - fact: relation
        subject: "{who}"
        standard: "{std}"
        measure: "{item}"
        factor: "f"
        offset: 0.0
        verb: "{verb}"

  - id: arithmetic/existential-premise
    phase: read
    description: >
      "There are 15 trees in the grove" — a located existential: the place
      holds the counted noun as a state quantity.
    match:
      sentence:
        - {lit: there}
        - {slot: verb, type: verb}
        - {slot: item, type: counted}
        - {slot: prep, cat: preposition}
        - {slot: place, type: noun}
    where:
      - absent: {cat: aggregate}
    consumes: [item]
    emits:
      - fact: quantity
        entity: "{place}"
        measure: "{item}"
        value: "item"
        verb: have

  - id: arithmetic/existential-premise-bare
    phase: read
    description: >
      "There are 12 chairs." — an unlocated existential; the holder is the
      scene itself (the `world` entity, a data constant this pack owns).
      The located form strictly subsumes this one on shared matches.
    match:
      sentence:
        - {lit: there}
        - {slot: verb, type: verb}
        - {slot: item, type: counted}
    where:
      # "There are 160 toys ALTOGETHER" is a group TOTAL (a sum constraint
      # over the entities), never an independent holding
      - absent: {cat: aggregate}
    consumes: [item]
    emits:
      - fact: quantity
        entity: world
        measure: "{item}"
        value: "item"
        verb: have

  - id: arithmetic/fraction-of-pool
    phase: read
    description: >
      "Tom ate half of the sandwiches" / "spent 40% of the money" — a
      fraction of the DEFINITE pool. Emits a FractionQuantity the synthesizer
      resolves against the DEFINITE POOL — the signed sum of the measure's
      prior-sentence facts, which prior fractions deplete. That makes
      "of the remaining pages" correct here too: the current pool IS the
      remainder. Unresolved ones veto commits.
    match:
      sentence:
        - {slot: who, type: name}
        - {slot: verb, type: verb}
        - {slot: f, type: fraction}
        - {lit: of}
        - {slot: item, type: noun}
    consumes: [f]
    emits:
      - fact: fraction_quantity
        entity: "{who}"
        measure: "{item}"
        fraction: "f"
        verb: "{verb}"

  - id: arithmetic/fraction-of-pronoun
    phase: read
    description: >
      "She spent one-half OF IT" — the pronoun denotes the pool itself; the
      synthesizer resolves it by the unique-measure principle (one measure
      in play, else unresolved and the guard declines).
    match:
      sentence:
        - {slot: who, type: name}
        - {slot: verb, type: verb}
        - {slot: f, type: fraction}
        - {lit: of}
        - {slot: ref, type: pronoun}
    consumes: [f]
    emits:
      - fact: fraction_quantity
        entity: "{who}"
        measure: "{ref}"
        fraction: "f"
        verb: "{verb}"

  - id: arithmetic/fraction-of-remnant
    phase: read
    description: >
      "put half of THE REST in savings" — the remnant word names no measure;
      the synthesizer's unique-measure principle supplies the pool.
    match:
      sentence:
        - {slot: who, type: name}
        - {slot: verb, type: verb}
        - {slot: f, type: fraction}
        - {lit: of}
        - {slot: r, cat: remnant}
    consumes: [f]
    emits:
      - fact: fraction_quantity
        entity: "{who}"
        measure: "{r}"
        fraction: "f"
        verb: "{verb}"

  - id: arithmetic/rest-of-pool
    phase: read
    description: >
      "He picked THE REST" — the remainder of the unique pool after its
      events. Emits a RestQuantity; the synthesizer supplies the value or
      the unresolved-derivation guard declines.
    match:
      sentence:
        - {slot: who, type: name}
        - {slot: verb, type: verb}
        - {slot: r, cat: remnant}
    emits:
      - fact: rest_quantity
        entity: "{who}"
        verb: "{verb}"

  - id: arithmetic/partition-attribute
    phase: read
    description: >
      "Ten of THEM are yellow" — N members of a prior collection share an
      attribute (a PartitionQuantity). The plural pronoun denotes the
      collection; the partition synthesizer resolves it against the unique
      prior collection fact (ambiguous or absent context leaves it
      unresolved, and the unresolved-derivation guard declines).
    match:
      sentence:
        - {slot: n, type: number}
        - {lit: of}
        - {slot: coll, type: pronoun}
        - {slot: verb, type: verb}
        - {slot: attr, type: adjective}
    consumes: [n]
    emits:
      - fact: partition_quantity
        collection: "{coll}"
        attribute: "{attr}"
        value: "n"
        verb: "{verb}"

  - id: arithmetic/partition-membership
    phase: read
    description: >
      "8 of THEM are dogs" — a MEMBERSHIP-style partition: N members of a
      prior collection ARE a plural common noun, not an adjective (the
      dominant real-world phrasing of a partition). Resolved identically to
      partition-attribute (the same synthesizer resolves the plural pronoun
      against the unique prior collection); a companion synth step then
      emits a Quantity for the named subset noun, so the general
      entity-less "how many NOUN are there" ask answers it directly — no
      bespoke consumer needed.
    match:
      sentence:
        - {slot: n, type: number}
        - {lit: of}
        - {slot: coll, type: pronoun}
        - {slot: verb, type: verb}
        - {slot: attr, type: noun}
    consumes: [n]
    emits:
      - fact: partition_quantity
        collection: "{coll}"
        attribute: "{attr}"
        value: "n"
        verb: "{verb}"
        kind: membership

asks:
  - id: ask/how-many-in-place
    match:
      question:
        - {lit: how}
        - {lit: many}
        - {slot: item, type: noun}
        - {slot: verb, type: verb}
        - {slot: prep, cat: preposition}
        - {slot: place, type: noun}
    resolves:
      consumer: single-entity
      entity: "{place}"
      measure: "{item}"
      verb: have

  - id: ask/how-many-combined
    match:
      question:
        - {lit: how}
        - {lit: many}
        - {slot: item, type: noun}
        - opt:
            - {slot: aux, type: auxiliary}
            - {slot: who, type: pronoun}
            - {slot: verb, type: verb}
        - opt:
            - {slot: p, cat: preposition}
        - {slot: agg, cat: aggregate}
    resolves:
      consumer: combined
      measure: "{item}"
      verb: "{verb}"

  - id: ask/how-many-more
    match:
      question:
        - {lit: how}
        - {lit: many}
        - {slot: dir, cat: delta}
        - {slot: item, type: noun}
        - {slot: aux, type: auxiliary}
        - {slot: a, type: name}
        - {slot: verb, type: verb}
        - {lit: than}
        - {slot: b, type: name}
    resolves:
      consumer: difference
      a: "{a}"
      b: "{b}"
      measure: "{item}"
      verb: "{verb}"

  - id: ask/how-many-entity
    match:
      question:
        - {lit: how}
        - {lit: many}
        - {slot: item, type: noun}
        - {slot: aux, type: auxiliary}
        - {slot: who, type: name}
        - {slot: verb, type: verb}
    resolves:
      consumer: single-entity
      entity: "{who}"
      measure: "{item}"
      verb: "{verb}"

  - id: ask/how-many-left-entityless
    match:
      question:
        - {lit: how}
        - {lit: many}
        - {slot: item, type: noun}
        - {slot: verb, type: verb}
        - {lit: left}
    resolves:
      consumer: unique-entity
      measure: "{item}"

  - id: ask/how-many-there
    match:
      question:
        - {lit: how}
        - {lit: many}
        - {slot: item, type: noun}
        - {slot: verb, type: verb}
        - {lit: there}
    resolves:
      consumer: unique-entity
      measure: "{item}"

  - id: ask/how-much-bare-entity
    match:
      question:
        - {lit: how}
        - {lit: much}
        - {slot: aux, type: auxiliary}
        - {slot: who, type: name}
        - {slot: verb, type: verb}
    resolves:
      consumer: single-entity
      entity: "{who}"
      # the CATEGORY, not a currency: resolved to the unique currency
      # measure present in the facts (mixed currencies decline)
      measure: currency
      verb: "{verb}"

  - id: ask/how-much-noun-entity
    match:
      question:
        - {lit: how}
        - {lit: much}
        - {slot: item, type: noun}
        - {slot: aux, type: auxiliary}
        - {slot: who, type: name}
        - {slot: verb, type: verb}
    resolves:
      consumer: single-entity
      entity: "{who}"
      measure: "{item}"
      verb: "{verb}"

  - id: ask/how-much-noun-more-than
    match:
      question:
        - {lit: how}
        - {lit: much}
        - {slot: dir, cat: delta}
        - {slot: item, type: noun}
        - {slot: aux, type: auxiliary}
        - {slot: a, type: name}
        - {slot: verb, type: verb}
        - {lit: than}
        - {slot: b, type: name}
    resolves:
      consumer: difference
      a: "{a}"
      b: "{b}"
      measure: "{item}"
      verb: "{verb}"

  - id: ask/how-many-rate-span
    match:
      question:
        - {lit: how}
        - {lit: many}
        - {slot: item, type: noun}
        - {slot: aux, type: auxiliary}
        - {slot: who, type: entity}
        - {slot: verb, type: verb}
        - {lit: in}
        - {slot: span, type: counted}
    resolves:
      consumer: rate-span
      entity: "{who}"
      measure: "{item}"
      span_unit: "{span}"
      span_value: "{span.value}"

  - id: ask/how-much-rate-span
    match:
      question:
        - {lit: how}
        - {lit: much}
        - {slot: aux, type: auxiliary}
        - {slot: who, type: entity}
        - {slot: verb, type: verb}
        - {lit: in}
        - {slot: span, type: counted}
    resolves:
      consumer: rate-span
      entity: "{who}"
      measure: currency
      span_unit: "{span}"
      span_value: "{span.value}"

  - id: ask/earn-span
    # 'how much does WHO earn/make (in SPAN)?' — wage-earnings asks (rate
    # x worked span). The verb is gated to the narrow wage_verb category
    # (packs/arithmetic/categories/wage.yaml), not the general 'acquire'/
    # 'produce' categories, so an unrelated 'how much did Mary buy' never
    # matches here. The 'in SPAN' clause is OPTIONAL: a span may instead
    # be stated in an earlier sentence ("Rob works 8 hours") and read off
    # a plain quantity fact by the rate-span consumer itself. This id is
    # sorted (alphabetically) before ask/how-much-bare-entity on purpose —
    # both shapes consume the same units when no span clause is present,
    # and the earlier id wins the deterministic tie (patterns.match_ask),
    # so a wage-verb question is routed to rate-span instead of the
    # event-fold, which never had a matching event to fold in the first
    # place (dev-train probe: 0 correct answers from event-fold on any
    # earn/make question — see mining candidate wage-span-earnings).
    match:
      question:
        - {lit: how}
        - {lit: much}
        - {slot: aux, type: auxiliary}
        - {slot: who, type: entity}
        - {slot: verb, cat: wage_verb}
        - opt:
            - {lit: in}
            - {slot: span, type: counted}
    resolves:
      consumer: rate-span
      entity: "{who}"
      measure: currency
      span_unit: "{span}"
      span_value: "{span.value}"

  - id: ask/is-membership
    match:
      question:
        - {lit: is}
        - {slot: member, type: name}
        - {slot: coll, type: noun}
    resolves:
      consumer: membership-verdict
      member: "{member}"
      collection: "{coll}"

  - id: ask/how-many-capacity
    match:
      question:
        - {lit: how}
        - {lit: many}
        - {slot: item, type: noun}
        - {slot: modal, type: modal}
        - {slot: who, type: entity}
        - {slot: verb, type: verb}
        - opt:
            - {lit: with}
            - {slot: budget, type: counted}
    resolves:
      consumer: capacity
      entity: "{who}"
      item: "{item}"
      budget_value: "{budget.value}"

  - id: ask/how-many-partition
    match:
      question:
        - {lit: how}
        - {lit: many}
        - {slot: item, type: noun}
        - {slot: verb, type: verb}
        - {slot: attr, type: adjective}
    resolves:
      consumer: partition-complement
      item: "{item}"
      attribute: "{attr}"
      negated: "false"

  - id: ask/how-many-partition-negated
    match:
      question:
        - {lit: how}
        - {lit: many}
        - {slot: item, type: noun}
        - {slot: verb, type: verb}
        - {lit: not}
        - {slot: attr, type: adjective}
    resolves:
      consumer: partition-complement
      item: "{item}"
      attribute: "{attr}"
      negated: "true"
