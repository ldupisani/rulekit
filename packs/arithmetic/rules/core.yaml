      - verb_role_compatible: {verb: verb, roles: [item], verb_cat: transfer_out, excluded_role_cat: remnant}
      - slot_not_category: {slot: verb, cat: non_quantity_object_verb}
      - slot_not_category: {slot: who, cat: non_quantity_holder}
      - slot_not_category: {slot: pp_prep, cat: quantity_remainder_preposition}
      - attribute_compatible: {attribute: pp_prep, noun: pp_obj}
      - distinct: [who, std]
    consumes: [n]
    emits:
      - fact: relation
        subject: "{who}"
        standard: "{std}"
        measure: "{item}"
        factor: "k"
        offset: "n * sign(dir)"
        verb: "{verb}"

  - id: arithmetic/affine-times-as-much-elided
    phase: read
    description: >
      mining candidate affine-nominal-relations: "Ben has 250 dollars less
      than twice as much as Ana" — the ELIDED-ITEM sibling of arithmetic/
      affine-times-as-much (no noun between 'much' and 'as'), exactly the
      additive-elision pairing arithmetic/times-as-much-elided provides
      for arithmetic/times-as-much, one offset field over. Same
      `measure: null` UNRESOLVED-sentinel emission and standard-anchored
      recovery — see arithmetic/anchored-relation-elided's comment.
      Structurally disjoint from arithmetic/affine-times-as-much: that
      rule's `item, type: noun` slot sits directly after 'much' and 'as'
