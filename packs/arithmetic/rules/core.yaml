        - {slot: verb, type: verb}
        - {slot: n, type: number}
        - {slot: dir, cat: mass_quantity_delta}
        - {lit: than}
        - {slot: k, type: nonunit_multiplier}
        - {lit: as}
        - {lit: much}
        - {lit: as}
