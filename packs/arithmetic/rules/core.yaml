        standard: "{std}"
        measure: year
        factor: "k"
        offset: 0.0
        verb: "{verb}"

  - id: arithmetic/temporal-offset-times-as-old-as-future
    phase: read
    description: >
      "In four years, Annika will be three times as old as Hans" (mining
      candidate temporal-offset-age-recut) — the FUTURE-offset sibling of
      arithmetic/times-as-old-as: the ratio is stated at a point N years
      from now, not today, and — per this candidate's stated convention —
      a BARE comparative (no explicit "is now"/"today" marker on the
      standard) inherits the sentence's own offset on BOTH sides. Emits
      the SAME Relation shape times-as-old-as does, plus the two new
      `subject_offset`/`standard_offset` fields (model.py, default 0.0 —
      "today" — on every relation that predates this candidate) set to
      the stated `n`, so `_relations_synth`'s general offset-aware
      formula resolves EITHER direction with zero further kernel change:
      the standard's stated current age resolving the subject, or the
      subject's stated current age resolving the standard (the inverse
      direction `_relations_synth` already supports for a plain
      relation). ask/how-old-is answers off the resulting Quantity
      exactly as it does for a plain relation — no new consumer. `{lit:
      be}` (not `cat: state`) mirrors arithmetic/temporal-offset-age-
      future's own reasoning: English always uses the bare infinitive
      after a modal ("will be"), never 'is'/'was' — structure, not
      lexicon.

      Decline-safety: `absent: {cat: temporal_marker}` blocks this BARE
      form the instant the clause ALSO carries a trailing "is now"/
      "today" standard-marker — the sibling -future-std-now rule below
      handles that shape with a DIFFERENT `standard_offset`. Without this
      gate both rules would match the same clause and emit two Relation
      facts that disagree only in `standard_offset` (now part of `key()`,
      so they would NOT dedupe as one restated fact); `_relations_synth`
      would then derive two conflicting Quantity values for the same
      entity, and facts.py's collision handling quarantines both —
      silently losing the correct answer instead of committing it.
      `distinct: [who, std]` blocks the genuinely self-referential
      reading ("he will be... as he was... years ago") the same way
      every other relation rule does; `_relations_synth` additionally
      declines that shape defense-in-depth (saturate.py), since a self-
      reference could in principle reach this synth some OTHER way in
      the future.
    match:
      sentence:
        - {lit: in}
        - {slot: n, cat: age_measure, counted: true}
        - {slot: who, type: name}
        - {slot: aux, type: future_modal}
        - {lit: be}
        - {slot: k, type: multiplier}
        - {lit: as}
        - {lit: old}
        - {lit: as}
        - opt:
