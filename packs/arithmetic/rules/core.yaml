      sentence:
        - {slot: who, type: name}
        - {slot: verb, cat: possession_state}
        - {slot: n, type: number}
        - {slot: dir, cat: count_quantity_delta}
        - {lit: than}
        - {slot: k, type: nonunit_multiplier}
        - {slot: std, cat: noun, possessed: true, number: plural}
    where:
      - number_compatible: [who, verb]
      - slot_not_category: {slot: std, cat: mass_quantity_noun}
      - distinct_from_owner: {entity: who, possessed: std}
    consumes: [n]
    emits:
      - fact: relation
        subject: "{who}"
        standard: "{std.owner}"
        measure: "{std}"
        factor: "k"
        offset: "n * sign(dir)"
        verb: "{verb}"

