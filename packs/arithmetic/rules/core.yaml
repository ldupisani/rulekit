format: rulekit/rules@1
# Minimum-structure rule: only the grammatical skeleton is literal; every
# content word is a captured, gated slot. Rules emit FACTS — the shared
# saturate/answer pipeline finishes. There is no priority field anywhere.
rules:
  - id: arithmetic/anchored-relation
    phase: read
    description: >
      "X has N more/fewer ITEM than Y" — a Relation fact; the relation
      synthesizer resolves it against Y's known quantity. `who`/`std,
      type: entity` (mining candidate common-noun-relation-subjects):
      widened from `type: name` so a definite/possessive common-noun
      subject or standard ("Her cousin has 6 fewer rubber bands than he
      has") can anchor a relation too — the fold and the combined-ask
      consumer already resolve entity keys generally (a bare common-noun
      holding folds fine on its own); only the relation rules themselves
      required a name. `distinct: [item, std]` blocks a DIFFERENT
      collision the widening opens up: "has 2 fewer animal stickers than
      flower stickers" bare-folds `item` and `std` to the SAME measure
      lemma ('sticker') — that sentence compares two MEASURES of the
      speaker's own holding (elliptical for "than [he has] flower
      stickers"), not two holders' quantities of one measure, and must
      keep declining rather than mint a self-referential Relation whose
      standard IS the measure being counted.
    match:
      sentence:
        - {slot: who, type: entity}
        - {slot: verb, type: verb}
        - {slot: n, type: number}
        - {slot: dir, cat: delta}
        - {slot: item, type: plural}
        - {lit: than}
        - {slot: std, type: entity}
    where:
      - distinct: [who, std]
      - distinct: [item, std]
    consumes: [n]
    emits:
      - fact: relation
        subject: "{who}"
        standard: "{std}"
        measure: "{item}"
        factor: 1.0
        offset: "n * sign(dir)"
        verb: "{verb}"

  - id: arithmetic/anchored-relation-postfix
    phase: read
    description: >
      "X picked 12 apples more than Y" — the POSTFIX comparative order: the
      count has already condensed into the noun, and the direction word
      follows it. Same Relation fact as the prefix form. `who`/`std,
      type: entity` (mining candidate common-noun-relation-subjects):
      same widening and same `distinct: [item, std]` self-referential
      guard as arithmetic/anchored-relation — see its comment.
    match:
      sentence:
        - {slot: who, type: entity}
        - {slot: verb, type: verb}
        - {slot: item, type: counted}
        - {slot: dir, cat: delta}
        - {lit: than}
        - {slot: std, type: entity}
    where:
      - distinct: [who, std]
      - distinct: [item, std]
    consumes: [item]
    emits:
      - fact: relation
        subject: "{who}"
        standard: "{std}"
        measure: "{item}"
        factor: 1.0
        offset: "item * sign(dir)"
        verb: "{verb}"

  - id: arithmetic/anchored-relation-postfix-dimension
    phase: read
    description: >
      mining candidate dimension-comparatives: "Jake's snake is 12 inches
      longer than Jenny's snake" — the physical-dimension sibling of
      arithmetic/anchored-relation-postfix, identical shape, gated on the
      new `dimension_comparative` category instead of `delta` (see that
      category's note in packs/core-english/categories/core.yaml — 'delta'
      itself is deliberately NOT widened). Without this rule the direction
      word falls through and the general SVO fold reads "[N inches]" as a
      bare stated Quantity — a latent confident-wrong (e.g. answering an
      unrelated length question from a comparative clause), not merely a
      decline; this rule intercepts that clause and emits the correct
      Relation instead. `who`/`std, type: entity` (same widening as the
      sibling rule) so a possessive-noun subject/standard ("Jake's snake",
      "Jenny's snake") anchors the relation too. Same Relation fact shape
      as every other relation rule; the existing saturate.py fixpoint and
      generic fold/ask machinery finish the job with no further change.
    match:
      sentence:
        - {slot: who, type: entity}
        - {slot: verb, type: verb}
        - {slot: item, type: counted}
        - {slot: dir, cat: dimension_comparative}
        - {lit: than}
        - {slot: std, type: entity}
    where:
      - distinct: [who, std]
      - distinct: [item, std]
    consumes: [item]
    emits:
      - fact: relation
        subject: "{who}"
        standard: "{std}"
        measure: "{item}"
        factor: 1.0
        offset: "item * sign(dir)"
        verb: "{verb}"

  - id: arithmetic/dangling-comparative-relation
    phase: read
    description: >
      "Emma is 2 years older" — a POSTFIX comparative with NO "than Y"
      anchor at all. Resolving an IMPLICIT anchor (the previous sentence's
      subject, say) is a different, unbuilt mechanism — declined on
      purpose (precision before coverage). This rule emits NOTHING; it
      exists only to CONSUME the clause so the general SVO fold does not
      independently misread "is [N ITEM]" as a bare stated Quantity of N,
      silently discarding the dangling comparative — a genuine
      confident-wrong once anything queries that measure (mining candidate
      age-asks, dev-holdout look: "is 2 years older" read as a stated
      Quantity(2) once 'year' became an askable measure). Overlaps
      anchored-relation-postfix's own span when "than Y" IS present; that
      rule's Relation fact still emits normally — this one just adds a
      harmless second (empty) consumption of the same tokens.
    match:
      sentence:
        - {slot: who, type: name}
        - {slot: verb, cat: state}
        - {slot: n, type: counted}
        - {slot: dir, cat: delta}
    emits: []

  - id: arithmetic/times-comparative-age-relation
    phase: read
    description: >
      "Thor is 13 times older than Captain America" — a MULTIPLICATIVE age
      comparative with NO stated noun at all (unlike anchored-relation-
      postfix's "N years older than Y", which condenses a counted item);
      'old' is implicit, exactly like arithmetic/stated-age's own literal-
      'old' anchor. The comparative word is gated on the new
      `age_comparative` category — scoped to exactly 'older'/'younger' —
      so a general "N times more/fewer/less than Y" (money, marbles, ...)
      is NOT swept in and given a spurious 'year' measure; those keep
      declining until some OTHER rule states their measure. Emits the
      SAME Relation fact shape as every other relation rule in this file;
      the existing saturate.py fixed point (already round-based to a
      fixpoint) chains it with any other relation hop — forward or
      inverse — with no kernel change. `k**sign(dir)`: 'older' (sign +1)
      keeps the ratio as stated (subject = k * standard); 'younger'
      (sign -1) inverts it (subject = standard / k), matching the
      symmetric reading "N times older" / "N times younger" already
      established for the additive form's sign(dir)*n offset.
    match:
      sentence:
        - {slot: who, type: name}
        - {slot: verb, cat: state}
        - {slot: k, type: multiplier}
        - {slot: dir, cat: age_comparative}
        - {lit: than}
        - {slot: std, type: name}
    where:
      - distinct: [who, std]
    emits:
      - fact: relation
        subject: "{who}"
        standard: "{std}"
        measure: year
        factor: "k**sign(dir)"
        offset: 0.0
        verb: "{verb}"

  - id: arithmetic/times-as-old-as
    phase: read
    description: >
      "Zhang is twice as old as Li" — the EQUATIVE sibling of arithmetic/
      times-comparative-age-relation ('N times OLDER THAN Y'): English
      states this ratio equatively far more often than comparatively.
      Same implicit-'old' anchor (no stated noun — 'old' is the literal
      itself), same emitted Relation shape (measure `year`, `factor: k`,
      `offset: 0`) and same `distinct: [who, std]` self-reference guard,
      so the existing saturate.py relation fixpoint, arithmetic/anchored-
      relation-postfix and ask/how-old-is resolve it with ZERO further
      change. Decline-safety: `absent: {cat: temporal_marker}` blocks the
      rule the instant the SAME sentence also carries a trailing temporal
      qualifier ("Diana is twice as old as Grace IS TODAY") — that clause
      pairs the relation with an offset-anchored premise elsewhere in the
      document ("Grace turned 3 a year ago") that this rule cannot read;
      committing the plain 'twice as old as Grace' ratio over the RAW
      pre-offset anchor is a confident-wrong (dev-train d22b0162e42c),
      so the whole item stays declined rather than resolving on a partial
      reading, mirroring temporal-offset-age-future/past's own `absent:
      relational_marker`/`multiplier_marker` clause-boundary gates.
    match:
      sentence:
        - {slot: who, type: name}
        - {slot: verb, cat: state}
        - {slot: k, type: multiplier}
        - {lit: as}
        - {lit: old}
        - {lit: as}
        - {slot: std, type: name}
    where:
      - distinct: [who, std]
      - absent: {cat: temporal_marker}
    emits:
      - fact: relation
        subject: "{who}"
        standard: "{std}"
        measure: year
        factor: "k"
        offset: 0.0
        verb: "{verb}"

  - id: arithmetic/times-as-many
    phase: read
    description: >
      "X has twice as many ITEM as Y" — a pure-ratio Relation fact
      (the rarer, more specific trigger; the offset case needs the
      anchored-relation shape). `who`/`std, type: entity` (mining
      candidate common-noun-relation-subjects): same widening and same
      `distinct: [item, std]` self-referential guard as
      arithmetic/anchored-relation — see its comment.
    match:
      sentence:
        - {slot: who, type: entity}
        - {slot: verb, type: verb}
        - {slot: k, type: multiplier}
        - {lit: as}
        - {lit: many}
        - {slot: item, type: plural}
        - {lit: as}
        - {slot: std, type: entity}
    where:
      - distinct: [who, std]
      - distinct: [item, std]
    emits:
      - fact: relation
        subject: "{who}"
        standard: "{std}"
        measure: "{item}"
        factor: "k"
        offset: 0.0
        verb: "{verb}"

  - id: arithmetic/times-as-much
    phase: read
    description: >
      "Catherine has twice as much money as Cecil" — times-as-many's
      MASS-NOUN counterpart: 'much' in place of 'many', and the item slot
      is `type: noun` (any common noun) rather than `type: plural`, since a
      mass noun (money, water, sand...) never carries plural morphology.
      Same Relation fact and downstream resolution as times-as-many; the
      anchor-measure resolver (saturate.py) is what lets a 'money'-measured
      relation resolve against an anchor's own currency holding ('dollar').
    match:
      sentence:
        - {slot: who, type: name}
        - {slot: verb, type: verb}
        - {slot: k, type: multiplier}
        - {lit: as}
        - {lit: much}
        - {slot: item, type: noun}
        - {lit: as}
        - {slot: std, type: name}
    where:
      - distinct: [who, std]
    emits:
      - fact: relation
        subject: "{who}"
        standard: "{std}"
        measure: "{item}"
        factor: "k"
        offset: 0.0
        verb: "{verb}"

  - id: arithmetic/fraction-delta-relation
    phase: read
    description: >
      "twenty percent FEWER frogs than Lassie Lake" / "50% MORE X than Y" —
      a proportional delta: subject = (1 + f·sign(dir)) × standard.
    match:
      sentence:
        - {slot: who, type: name}
        - {slot: verb, type: verb}
        - {slot: f, type: fraction}
        - {slot: dir, cat: delta}
        - {slot: item, type: noun}
        - {lit: than}
        - {slot: std, type: name}
    where:
      - distinct: [who, std]
    consumes: [f]
    emits:
      - fact: relation
        subject: "{who}"
        standard: "{std}"
        measure: "{item}"
        factor: "1 + f * sign(dir)"
        offset: 0.0
        verb: "{verb}"

  - id: arithmetic/times-the-number-of
    phase: read
    description: >
      "has four times the number of sharks as Newport" — the times-as-many
      ratio in its 'the number of' frame ('number'/'amount' are the frame's
      skeleton, like 'total of').
    match:
      sentence:
        - {slot: who, type: name}
        - {slot: verb, type: verb}
        - {slot: k, type: multiplier}
        - {slot: frame, cat: aggregate_noun}
        - {lit: of}
        - {slot: item, type: noun}
        - {lit: as}
        - {slot: std, type: name}
    where:
      - distinct: [who, std]
    emits:
      - fact: relation
        subject: "{who}"
        standard: "{std}"
        measure: "{item}"
        factor: "k"
        offset: 0.0
        verb: "{verb}"

  - id: arithmetic/affine-frame-relation
    phase: read
    description: >
      "Greg has read 9 more than twice the number of books that Kelcie has
      read" — the AFFINE frame: subject = k·standard + n·sign(dir).
    match:
      sentence:
        - {slot: who, type: name}
        - {slot: verb, type: verb}
        - {slot: n, type: number}
        - {slot: dir, cat: delta}
        - {lit: than}
        - {slot: k, type: multiplier}
        - {slot: frame, cat: aggregate_noun}
        - {lit: of}
        - {slot: item, type: noun}
        - {slot: c, cat: complementizer}
        - {slot: std, type: name}
    where:
      - distinct: [who, std]
    consumes: [n]
    emits:
      - fact: relation
        subject: "{who}"
        standard: "{std}"
        measure: "{item}"
        factor: "k"
        offset: "n * sign(dir)"
        verb: "{verb}"

  - id: arithmetic/fraction-frame-relation
    phase: read
    description: >
      "Kelcie has read 1/4 the amount of books that Megan has read" — a
      pure-fraction ratio in the frame form.
    match:
      sentence:
        - {slot: who, type: name}
        - {slot: verb, type: verb}
        - {slot: f, type: fraction}
        - {slot: frame, cat: aggregate_noun}
        - {lit: of}
        - {slot: item, type: noun}
        - {slot: c, cat: complementizer}
        - {slot: std, type: name}
    where:
      - distinct: [who, std]
    consumes: [f]
    emits:
      - fact: relation
        subject: "{who}"
        standard: "{std}"
        measure: "{item}"
        factor: "f"
        offset: 0.0
        verb: "{verb}"

  - id: arithmetic/fraction-as-many
    phase: read
    description: >
      "Kelcie read half as many books as Megan" — the times-as-many shape
      with a FRACTION ratio. `who`/`std, type: entity` (mining candidate
      common-noun-relation-subjects): same widening and same
      `distinct: [item, std]` self-referential guard as
      arithmetic/anchored-relation — see its comment.
    match:
      sentence:
        - {slot: who, type: entity}
        - {slot: verb, type: verb}
        - {slot: f, type: fraction}
        - {lit: as}
        - {lit: many}
        - {slot: item, type: plural}
        - {lit: as}
        - {slot: std, type: entity}
    where:
      - distinct: [who, std]
      - distinct: [item, std]
    consumes: [f]
    emits:
      - fact: relation
        subject: "{who}"
        standard: "{std}"
        measure: "{item}"
        factor: "f"
        offset: 0.0
        verb: "{verb}"

  - id: arithmetic/fraction-as-much
    phase: read
    description: >
      "Ian has half as much money as Jessica" — fraction-as-many's
      MASS-NOUN counterpart, exactly mirroring how times-as-much relates
      to times-as-many: 'much' in place of 'many', item slot `type: noun`
      in place of `type: plural`.
    match:
      sentence:
        - {slot: who, type: name}
        - {slot: verb, type: verb}
        - {slot: f, type: fraction}
        - {lit: as}
        - {lit: much}
        - {slot: item, type: noun}
        - {lit: as}
        - {slot: std, type: name}
    where:
      - distinct: [who, std]
    consumes: [f]
    emits:
      - fact: relation
        subject: "{who}"
        standard: "{std}"
        measure: "{item}"
        factor: "f"
        offset: 0.0
        verb: "{verb}"

  - id: arithmetic/affine-times-as-many
    phase: read
    description: >
      "Andrew has 5 more than twice as many goats as Adam" — the AFFINE
      "as many" form: subject = k·standard + n·sign(dir). The times-as-many
      ratio shape, PREFIXED with the anchored-relation offset ("N more/fewer
      than") the way affine-frame-relation prefixes the 'the number of'
      frame — this is the same offset+ratio combination for the bare
      "as many ITEM as STD" frame instead. `who`/`std, type: entity`
      (mining candidate common-noun-relation-subjects): same widening and
      same `distinct: [item, std]` self-referential guard as
      arithmetic/anchored-relation — see its comment.
    match:
      sentence:
        - {slot: who, type: entity}
        - {slot: verb, type: verb}
        - {slot: n, type: number}
        - {slot: dir, cat: delta}
        - {lit: than}
        - {slot: k, type: multiplier}
        - {lit: as}
        - {lit: many}
        - {slot: item, type: plural}
        - {lit: as}
        - {slot: std, type: entity}
    where:
      - distinct: [who, std]
      - distinct: [item, std]
    consumes: [n]
    emits:
      - fact: relation
        subject: "{who}"
        standard: "{std}"
        measure: "{item}"
        factor: "k"
        offset: "n * sign(dir)"
        verb: "{verb}"

  - id: arithmetic/affine-fraction-as-many
    phase: read
    description: >
      "Randy has 5 less than half as many coconut trees as ITEM" — the
      same AFFINE "as many" form as affine-times-as-many, with a FRACTION
      ratio in place of the multiplier (mirrors how fraction-as-many sits
      beside times-as-many): subject = f·standard + n·sign(dir). `who`/
      `std, type: entity` (mining candidate common-noun-relation-
      subjects): same widening and same `distinct: [item, std]` self-
      referential guard as arithmetic/anchored-relation — see its comment.
    match:
      sentence:
        - {slot: who, type: entity}
        - {slot: verb, type: verb}
        - {slot: n, type: number}
        - {slot: dir, cat: delta}
        - {lit: than}
        - {slot: f, type: fraction}
        - {lit: as}
        - {lit: many}
        - {slot: item, type: plural}
        - {lit: as}
        - {slot: std, type: entity}
    where:
      - distinct: [who, std]
      - distinct: [item, std]
    consumes: [n]
    emits:
      - fact: relation
        subject: "{who}"
        standard: "{std}"
        measure: "{item}"
        factor: "f"
        offset: "n * sign(dir)"
        verb: "{verb}"

  - id: arithmetic/existential-premise
    phase: read
    description: >
      "There are 15 trees in the grove" — a located existential: the place
      holds the counted noun as a state quantity.
    match:
      sentence:
        - {lit: there}
        - {slot: verb, type: verb}
        - {slot: item, type: counted}
        - {slot: prep, cat: preposition}
        - {slot: place, type: noun}
    where:
      - absent: {cat: aggregate}
    consumes: [item]
    emits:
      - fact: quantity
        entity: "{place}"
        measure: "{item}"
        value: "item"
        verb: have

  - id: arithmetic/existential-premise-bare
    phase: read
    description: >
      "There are 12 chairs." — an unlocated existential; the holder is the
      scene itself (the `world` entity, a data constant this pack owns).
      The located form strictly subsumes this one on shared matches.
    match:
      sentence:
        - {lit: there}
        - {slot: verb, type: verb}
        - {slot: item, type: counted}
    where:
      # "There are 160 toys ALTOGETHER" is a group TOTAL (a sum constraint
      # over the entities), never an independent holding
      - absent: {cat: aggregate}
    consumes: [item]
    emits:
      - fact: quantity
        entity: world
        measure: "{item}"
        value: "item"
        verb: have

  - id: arithmetic/existential-premise-total
    phase: read
    description: >
      "There are 160 toys altogether." — the totality-marked sibling of
      arithmetic/existential-premise-bare (mining candidate sum-constraint-
      relations): the identical "there VERB N ITEM" shape, but a REQUIRED
      trailing aggregate marker (total/altogether/together/combined —
      cat: aggregate) makes this a GROUP TOTAL across whichever entities
      the passage names, never an independent holding of the bare `world`
      scene-holder — exactly the reading existential-premise-bare's own
      `absent: {cat: aggregate}` guard refuses. The two rules never both
      fire on the same sentence: that guard declines whenever an aggregate
      word appears ANYWHERE in the sentence, and this rule's own required
      `agg` slot only matches when one is actually present.
    match:
      sentence:
        - {lit: there}
        - {slot: verb, type: verb}
        - {slot: item, type: counted}
        - opt:
            - {slot: p, cat: preposition}
        - {slot: agg, cat: aggregate}
    consumes: [item]
    emits:
      - fact: group_total
        measure: "{item}"
        value: "item"
        verb: have

  - id: arithmetic/group-total-of
    phase: read
    description: >
      "...a total of 160 toys" / "...a total of 35 floors" (mining
      candidate sum-constraint-relations) — a stated SUM across the
      entities the passage names, wherever in the sentence the framing
      falls: matching scans every starting position, so this fires
      identically for "Together they have a total of X", "A and B have
      been VERBing for a total of X", and "WHO will VERB a total of X"
      without needing to parse the varying subject/tense that precedes
      it — only the "a total of N ITEM" tail itself is the sum-constraint
      marker. Distinct from arithmetic/existential-premise-total's bare
      "there are N X <aggregate>" existential (no 'total of' framing at
      all, and the aggregate marker trails the noun rather than fronts
      it): the two match disjoint literal skeletons and never tie.
    match:
      sentence:
        - opt:
            - {lit: a}
        - {lit: total}
        - {lit: of}
        - {slot: item, type: counted}
    consumes: [item]
    emits:
      - fact: group_total
        measure: "{item}"
        value: "item"
        verb: have

  - id: arithmetic/group-total-trailing
    phase: read
    description: >
      "Tom and Jerry have 29 apples together." / "They picked 274 apples
      total." (mining candidate group-total-phrasings) — a stated quantity
      followed by a TRAILING totality marker (cat: aggregate — together/
      altogether/total/combined, packs/core-english/lexicon/core.yaml,
      optionally preceded by the quantifier 'all' — "all together" — or a
      preposition — "in total") is a GROUP TOTAL across whichever entities
      the passage names, never one entity's own independent holding —
      exactly the reading arithmetic/existential-premise-bare's own
      `absent: {cat: aggregate}` guard refuses for the bare "there are N
      X" shape. Matching scans every starting position (mirrors
      arithmetic/group-total-of): only the "N ITEM <marker>" tail itself
      is the sum-constraint marker, so this fires regardless of the
      preceding subject/verb — "A and B have N X together", "WHO will
      VERB N X all together" match identically without needing to parse
      the varying subject/tense that precedes the tail. The matched
      item's noun unit is the SAME unit the sentence's own verb would
      otherwise bind as its dobj; consuming it here (pattern_consumed)
      suppresses learn.py's ordinary per-entity fold for this clause
      (`learn.py`: `consumed = verb.features.get("pattern_consumed") or
      dobj...`), so the stated number is read exactly once — as a group
      total, never ALSO as an independent holding (the double-count this
      brief's decline-safety analysis flags). Routes to the existing,
      unchanged synth/sum-constraint plugin (saturate.py) — no new fact
      kind, no new consumer, no new ask shape.
    match:
      sentence:
        - {slot: item, type: counted}
        - opt:
            - {lit: all}
        - opt:
            - {slot: p, cat: preposition}
        - {slot: agg, cat: aggregate}
    consumes: [item]
    emits:
      - fact: group_total
        measure: "{item}"
        value: "item"
        verb: have

  - id: arithmetic/group-total-leading
    phase: read
    description: >
      "In total, they sold 120 oranges." (mining candidate group-total-
      phrasings) — the LEADING sibling of arithmetic/group-total-trailing:
      the same "in total" marker fronts the clause (comma skippable punct)
      instead of trailing it, ahead of the ordinary SUBJ VERB N ITEM
      skeleton. `who` binds any single subject token generically (`type:
      word` — a name, common noun, or pronoun, resolved or not) purely to
      bridge across it from the marker to the verb; its identity is never
      read in the emitted fact — like every sibling GroupTotal rule here,
      the fact deliberately carries no subject/owner, exactly the unowned
      "sum across the passage's entities" semantics synth/sum-constraint
      (saturate.py, unchanged) already consumes. Requiring the real VERB
      and counted ITEM slots (not a generic skip) means the matched item
      is the sentence's own dobj, so capturing it here suppresses
      learn.py's per-entity fold for the identical double-count reason
      arithmetic/group-total-trailing documents — an ordinary single-
      holder reading and a group total can never both register for the
      same clause.
    match:
      sentence:
        - {lit: in}
        - {lit: total}
        - {slot: who, type: word}
        - {slot: verb, type: verb}
        - {slot: item, type: counted}
    consumes: [item]
    emits:
      - fact: group_total
        measure: "{item}"
        value: "item"
        verb: "{verb}"

  - id: arithmetic/fraction-of-pool
    phase: read
    description: >
      "Tom ate half of the sandwiches" / "spent 40% of the money" — a
      fraction of the DEFINITE pool. Emits a FractionQuantity the synthesizer
      resolves against the DEFINITE POOL — the signed sum of the measure's
      prior-sentence facts, which prior fractions deplete. That makes
      "of the remaining pages" correct here too: the current pool IS the
      remainder. Unresolved ones veto commits.
    match:
      sentence:
        - {slot: who, type: name}
        - {slot: verb, type: verb}
        - {slot: f, type: fraction}
        - {lit: of}
        - {slot: item, type: noun}
    consumes: [f]
    emits:
      - fact: fraction_quantity
        entity: "{who}"
        measure: "{item}"
        fraction: "f"
        verb: "{verb}"

  - id: arithmetic/fraction-of-pronoun
    phase: read
    description: >
      "She spent one-half OF IT" — the pronoun denotes the pool itself; the
      synthesizer resolves it by the unique-measure principle (one measure
      in play, else unresolved and the guard declines).
    match:
      sentence:
        - {slot: who, type: name}
        - {slot: verb, type: verb}
        - {slot: f, type: fraction}
        - {lit: of}
        - {slot: ref, type: pronoun}
    consumes: [f]
    emits:
      - fact: fraction_quantity
        entity: "{who}"
        measure: "{ref}"
        fraction: "f"
        verb: "{verb}"

  - id: arithmetic/fraction-of-remnant
    phase: read
    description: >
      "put half of THE REST in savings" — the remnant word names no measure;
      the synthesizer's unique-measure principle supplies the pool.
    match:
      sentence:
        - {slot: who, type: name}
        - {slot: verb, type: verb}
        - {slot: f, type: fraction}
        - {lit: of}
        - {slot: r, cat: remnant}
    consumes: [f]
    emits:
      - fact: fraction_quantity
        entity: "{who}"
        measure: "{r}"
        fraction: "f"
        verb: "{verb}"

  - id: arithmetic/rest-of-pool
    phase: read
    description: >
      "He picked THE REST" — the remainder of the unique pool after its
      events. Emits a RestQuantity; the synthesizer supplies the value or
      the unresolved-derivation guard declines.
    match:
      sentence:
        - {slot: who, type: name}
        - {slot: verb, type: verb}
        - {slot: r, cat: remnant}
    emits:
      - fact: rest_quantity
        entity: "{who}"
        verb: "{verb}"

  - id: arithmetic/partition-attribute
    phase: read
    description: >
      "Ten of THEM are yellow" — N members of a prior collection share an
      attribute (a PartitionQuantity). The plural pronoun denotes the
      collection; the partition synthesizer resolves it against the unique
      prior collection fact (ambiguous or absent context leaves it
      unresolved, and the unresolved-derivation guard declines).
    match:
      sentence:
        - {slot: n, type: number}
        - {lit: of}
        - {slot: coll, type: pronoun}
        - {slot: verb, type: verb}
        - {slot: attr, type: adjective}
    consumes: [n]
    emits:
      - fact: partition_quantity
        collection: "{coll}"
        attribute: "{attr}"
        value: "n"
        verb: "{verb}"

  - id: arithmetic/partition-membership
    phase: read
    description: >
      "8 of THEM are dogs" — a MEMBERSHIP-style partition: N members of a
      prior collection ARE a plural common noun, not an adjective (the
      dominant real-world phrasing of a partition). Resolved identically to
      partition-attribute (the same synthesizer resolves the plural pronoun
      against the unique prior collection); a companion synth step then
      emits a Quantity for the named subset noun, so the general
      entity-less "how many NOUN are there" ask answers it directly — no
      bespoke consumer needed.
    match:
      sentence:
        - {slot: n, type: number}
        - {lit: of}
        - {slot: coll, type: pronoun}
        - {slot: verb, type: verb}
        - {slot: attr, type: noun}
    consumes: [n]
    emits:
      - fact: partition_quantity
        collection: "{coll}"
        attribute: "{attr}"
        value: "n"
        verb: "{verb}"
        kind: membership

  - id: arithmetic/partition-attribute-fraction
    phase: read
    description: >
      "25% of THEM are red" / "Half of THEM are red" — the FRACTIONAL
      counterpart of partition-attribute: a stated PROPORTION (not a
      cardinal) of a prior collection shares an attribute. Resolved
      identically to partition-attribute (the plural pronoun resolves
      against the unique prior collection); the synthesizer additionally
      sizes the fraction against that collection's own total before
      committing, so an unresolvable total (ambiguous or absent pool)
      leaves it unresolved exactly like fraction-of-pool.
    match:
      sentence:
        - {slot: f, type: fraction}
        - {lit: of}
        - {slot: coll, type: pronoun}
        - {slot: verb, type: verb}
        - {slot: attr, type: adjective}
    consumes: [f]
    emits:
      - fact: partition_quantity
        collection: "{coll}"
        attribute: "{attr}"
        value: "f"
        verb: "{verb}"
        is_fraction: true

  - id: arithmetic/partition-membership-fraction
    phase: read
    description: >
      "25% of THEM are dogs" — the FRACTIONAL counterpart of
      partition-membership: a stated PROPORTION of a prior collection ARE a
      plural common noun, not an adjective. Resolved identically to
      partition-membership once the fraction sizes against the collection's
      total (see partition-attribute-fraction); the same companion
      membership synth then emits a Quantity for the named subset noun, so
      the general entity-less "how many NOUN are there" ask answers it
      directly — no bespoke consumer needed.
    match:
      sentence:
        - {slot: f, type: fraction}
        - {lit: of}
        - {slot: coll, type: pronoun}
        - {slot: verb, type: verb}
        - {slot: attr, type: noun}
    consumes: [f]
    emits:
      - fact: partition_quantity
        collection: "{coll}"
        attribute: "{attr}"
        value: "f"
        verb: "{verb}"
        kind: membership
        is_fraction: true

  - id: arithmetic/partition-attribute-of-noun
    phase: read
    description: >
      "6 of the marbles are red" — the definite-NP partition surface: the
      collection is a plural common noun named directly ("the" is a
      SKIPPABLE article, never a literal here) instead of the pronoun
      placeholder partition-attribute matches. Since the noun IS the
      measure, there is nothing to resolve — the partition synthesizer's
      "already names a real measure" branch leaves it as-is, and the
      unresolved-derivation guard's structural known-measure check (not a
      rule-identity check) recognizes it as resolved directly. Same
      PartitionQuantity fact and partition-complement consumer as
      partition-attribute, reused unchanged.
    match:
      sentence:
        - {slot: n, type: number}
        - {lit: of}
        - {slot: coll, type: plural}
        - {slot: verb, type: verb}
        - {slot: attr, type: adjective}
    consumes: [n]
    emits:
      - fact: partition_quantity
        collection: "{coll}"
        attribute: "{attr}"
        value: "n"
        verb: "{verb}"

  - id: arithmetic/partition-membership-of-noun
    phase: read
    description: >
      "8 of the animals are dogs" — the definite-NP counterpart of
      partition-membership: the collection is a named plural noun, the
      attribute a distinct plural common noun (membership, not a
      modifier). Same PartitionQuantity fact (kind: membership); the
      companion membership synth step's gate also accepts a collection
      that already names a known measure directly (not only one resolved
      via synth/partition), a structural widening shared with the pronoun
      form, not a per-rule special case.
      `verb, cat: state` (not the general `verb` type — mining candidate
      modal-spend-measure-price): a membership partition is always a
      COPULAR predication ("ARE dogs"), never any other verb; the
      unrestricted `type: verb` previously let this rule swallow an
      unrelated priced-measure sentence sharing the same surface token
      order ("4 pounds of coffee beans COST 10 dollars each" — 'cost' is a
      verb too), stealing it from learn.py's price-verb emission before it
      ever ran and producing a bogus PartitionQuantity(collection='bean')
      instead of any Price fact. Every real membership-partition instance
      already uses a state verb (is/are/was/were), so this is a pure
      narrowing with no coverage loss.
    match:
      sentence:
        - {slot: n, type: number}
        - {lit: of}
        - {slot: coll, type: plural}
        - {slot: verb, cat: state}
        - {slot: attr, type: noun}
    consumes: [n]
    emits:
      - fact: partition_quantity
        collection: "{coll}"
        attribute: "{attr}"
        value: "n"
        verb: "{verb}"
        kind: membership

  - id: arithmetic/partition-rest-attribute
    phase: read
    description: >
      "The REST are grey" (mining candidate rest-partitions) — the EXACT
      COMPLEMENT of every OTHER partition already stated for the same
      collection. The rest determiner ("rest"/"remainder", cat: remnant) is
      the same word rest-of-pool already resolves for POOLS; this is its
      PARTITION sibling. `collection` starts as the bare remnant word,
      never a real measure, resolved by the partition synthesizer exactly
      as the pronoun placeholder is (the unique-pool-in-play principle) —
      but only once every earlier partition of that collection has itself
      resolved to a real count, at which point the value becomes the
      collection's own total as of this sentence minus their signed sum,
      re-emitted with `is_rest` cleared. `verb, cat: state`: a rest
      partition is always a copular predication (is/are/was/were), never
      any other verb — narrower than partition-attribute's pronoun form on
      purpose, since "the rest" (unlike "N of them") could otherwise sit in
      front of an unrelated priced/rated verb.

      The optional "of the ITEM" span ("the rest OF THE CATS are grey") is
      consumed but its noun is deliberately never bound into `collection`
      — the collection stays the bare remnant-word placeholder either way,
      resolved through the SAME unique-pool-in-play synth step as the bare
      surface. A named `collection` (the -of-noun surface partition-
      attribute-of-noun uses for the CARDINAL/stated form) would give this
      premise fact the exact same key as its own resolved-value re-
      emission (collection/attribute/verb, unchanged by sizing) and
      self-collide the moment the value changed from the 0 placeholder to
      the real count — is_fraction sizing has the identical constraint,
      which is why it too only ever fires from a placeholder collection.
    match:
      sentence:
        - {slot: r, cat: remnant}
        - opt:
            - {lit: of}
            - {slot: item, type: plural}
        - {slot: verb, cat: state}
        - {slot: attr, type: adjective}
    emits:
      - fact: partition_quantity
        collection: "{r}"
        attribute: "{attr}"
        value: "0"
        verb: "{verb}"
        is_rest: true

  - id: arithmetic/partition-rest-membership
    phase: read
    description: >
      "The REST are dogs" (mining candidate rest-partitions) — the
      MEMBERSHIP-style counterpart of partition-rest-attribute: the rest
      names a plural common noun subset, not an adjective. Resolved
      identically (see partition-rest-attribute); the existing companion
      membership synth (`synth/partition-membership-quantity`) then emits a
      Quantity for the named subset noun once the collection resolves, so
      the general entity-less "how many NOUN are there" ask answers it
      directly — no bespoke consumer needed, exactly like
      partition-membership. The same optional, deliberately-unbound "of the
      ITEM" span as partition-rest-attribute (see its description for why).
    match:
      sentence:
        - {slot: r, cat: remnant}
        - opt:
            - {lit: of}
            - {slot: item, type: plural}
        - {slot: verb, cat: state}
        - {slot: attr, type: noun}
    emits:
      - fact: partition_quantity
        collection: "{r}"
        attribute: "{attr}"
        value: "0"
        verb: "{verb}"
        kind: membership
        is_rest: true

  - id: arithmetic/stated-age
    phase: read
    description: >
      "Sara is 4 years old" — the copula age predicate: a stated Quantity
      fact scoped to the DATA measure 'year' (the copula + a counted noun +
      the literal 'old' is the grammatical skeleton; the counted noun's own
      word is not restricted in Python — only in this pack's data). This
      lets the general single-entity consumer answer "how old is WHO"
      directly, and the already-shipped anchored-relation-postfix
      synthesizer ("X is N years older/younger than Y") chain through it —
      no new consumer, no date arithmetic, no 'in N years' futures.
    match:
      sentence:
        - {slot: who, type: name}
        - {slot: verb, cat: state}
        - {slot: n, type: counted}
        - {lit: old}
    consumes: [n]
    emits:
      - fact: quantity
        entity: "{who}"
        measure: year
        value: n
        verb: "{verb}"

  - id: arithmetic/temporal-offset-age-future
    phase: read
    description: >
      "In 3 years, Tessa will be 21 years old" (mining candidate
      temporal-offset-age-premises) — a FUTURE temporal-offset age
      premise: the entity's age at a point N years from now, not a direct
      current holding. Emits the SAME Quantity shape arithmetic/stated-age
      does (measure 'year', a state — no `occurrence`), just computed as
      stated-age MINUS the offset, so ask/how-old-is and the relation
      synthesizers chain through it completely unchanged — no new fact
      kind, no new consumer, no date arithmetic beyond one subtraction.
      `{lit: be}` (not `cat: state`) is the grammatical skeleton here:
      English always uses the bare infinitive after a modal ("will be"),
      never 'is'/'was' — this is structure, not a lexicon fact, so it
      needs no category widening. Decline-safety: `absent: relational_
      marker`/`multiplier_marker` (increment 57's clause-boundary
      categories) aborts emission the instant the SAME sentence carries a
      comparative or ratio marker ("will be HALF of Ernesto's age", "will
      be TWICE as old") — those clauses stay for the relation/ratio
      synthesizers to resolve (this pattern's own literal 'old'-anchored,
      plain-number shape never matches them anyway, since a fraction/
      multiplier word never presents as a `type: counted` unit — but the
      explicit gate documents the boundary and blocks the paraphrase-of-
      the-same-clause case where a plain number ALSO happens to appear
      alongside a relational word). Both consumed numbers (the offset and
      the stated future age) are the same accounting story arithmetic/
      stated-age and arithmetic/anchored-relation already use: `consumes`
      marks the slot units read directly, independent of the emitted
      fact's own fields.
    match:
      sentence:
        - {lit: in}
        - {slot: n, type: counted}
        - {slot: who, type: name}
        - {slot: aux, type: future_modal}
        - {lit: be}
        - {slot: m, type: counted}
        - {lit: old}
    where:
      - absent: {cat: relational_marker}
      - absent: {cat: multiplier_marker}
    consumes: [n, m]
    emits:
      - fact: quantity
        entity: "{who}"
        measure: year
        value: "m - n"
        verb: be

  - id: arithmetic/temporal-offset-age-past
    phase: read
    description: >
      "Five years ago, Tessa was 21 years old" (mining candidate
      temporal-offset-age-premises) — the mirrored PAST form of
      arithmetic/temporal-offset-age-future: the entity's age N years ago,
      resolved to its current age by ADDING the offset (the past form
      naturally uses an ordinary state verb — 'was'/'were' — already
      tagged `cat: state`, no bare-infinitive skeleton needed here). Same
      Quantity shape, same decline-safety gate, same consumes-based value
      accounting as the future sibling above.
    match:
      sentence:
        - {slot: n, type: counted}
        - {lit: ago}
        - {slot: who, type: name}
        - {slot: verb, cat: state}
        - {slot: m, type: counted}
        - {lit: old}
    where:
      - absent: {cat: relational_marker}
      - absent: {cat: multiplier_marker}
    consumes: [n, m]
    emits:
      - fact: quantity
        entity: "{who}"
        measure: year
        value: "m + n"
        verb: "{verb}"

  - id: arithmetic/goal-desire-quantity
    phase: read
    description: >
      "Lena wants to collect 30 stamps" — a DESIRE verb ('want', a category
      this pack gates on so 'wish'/etc admit the same way as mined vocabulary
      grows) plus an infinitive VERB introduces a stated GOAL quantity, never
      an event: a wanted purchase is not a purchase (the increment-14 kirsty
      lesson generalized). Emits a Goal fact; the deficit consumer resolves
      it against the entity's single current holding of the same measure.
    match:
      sentence:
        - {slot: who, type: name}
        - {slot: want, cat: desire}
        - {lit: to}
        - {slot: verb, type: verb}
        - {slot: item, type: counted}
    consumes: [item]
    emits:
      - fact: goal
        entity: "{who}"
        measure: "{item}"
        value: "item"
        verb: "{want}"

  - id: arithmetic/goal-need-quantity
    phase: read
    description: >
      "Tom needs 30 apples" — a stated NEED ('need_premise', a category
      untagged for polarity like 'desire' — a needed quantity is not a
      receipt) directly followed by a counted item is a stated GOAL,
      never a holding/event: the direct-object counterpart to
      goal-desire-quantity's "wants to VERB N X" infinitive form (no
      infinitive here — 'need' takes the item directly). Emits the same
      Goal fact the existing goal-deficit consumer already resolves against
      the entity's single current holding of the measure.
    match:
      sentence:
        - {slot: who, type: name}
        - {slot: need, cat: need_premise}
        - {slot: item, type: counted}
    consumes: [item]
    emits:
      - fact: goal
        entity: "{who}"
        measure: "{item}"
        value: "item"
        verb: "{need}"

asks:
  - id: ask/how-many-in-place
    match:
      question:
        - {lit: how}
        - {lit: many}
        - {slot: item, type: noun}
        - {slot: verb, type: verb}
        - {slot: prep, cat: preposition}
        - {slot: place, type: noun}
    resolves:
      consumer: single-entity
      entity: "{place}"
      measure: "{item}"
      verb: have

  - id: ask/how-many-combined
    match:
      question:
        - {lit: how}
        - {lit: many}
        - {slot: item, type: noun}
        - opt:
            # `future_modal`, not `auxiliary` (mining candidate
            # will-tense-asks): also accepts "how many X will/would they
            # have altogether" alongside the ordinary "do/does/did" form —
            # see ask/how-many-entity's comment for the class rationale.
            - {slot: aux, type: future_modal}
            - {slot: who, type: pronoun}
            - {slot: verb, type: verb}
        - opt:
            - {slot: p, cat: preposition}
        - {slot: agg, cat: aggregate}
    resolves:
      consumer: combined
      measure: "{item}"
      verb: "{verb}"

  - id: ask/how-many-combined-named
    # "how many ITEM do/does/did NAME and NAME have together/in total/
    # altogether?" (mining candidate named-pair-combined) — the named-pair
    # sibling of ask/how-many-combined, binding the two holders DIRECTLY
    # the same way ask/what-is-the-difference-named binds its a/b instead
    # of resolving them from the pronoun-only fact enumeration. `aux,
    # type: auxiliary` (not `future_modal` like the pronoun sibling): the
    # do/does/did class is the narrower, exact cut this candidate targets.
    #
    # Never a tie/shadow risk with ask/how-many-combined: that ask's own
    # opt group binds `who, type: pronoun`, which a proper name can never
    # satisfy, so it fails to match a named-pair question at all rather
    # than partially matching and tying on consumed units. This ask is
    # also strictly more specific regardless (required item/aux/a/and/b/
    # verb tokens vs. the pronoun sibling's mostly-optional group).
    match:
      question:
        - {lit: how}
        - {lit: many}
        - {slot: item, type: noun}
        - {slot: aux, type: auxiliary}
        - {slot: a, type: name}
        - {lit: and}
        - {slot: b, type: name}
        - {slot: verb, type: verb}
        - opt:
            - {slot: p, cat: preposition}
        - {slot: agg, cat: aggregate}
    resolves:
      consumer: combined
      a: "{a}"
      b: "{b}"
      measure: "{item}"
      verb: "{verb}"

  - id: ask/how-many-more
    match:
      question:
        - {lit: how}
        - {lit: many}
        - {slot: dir, cat: delta}
        - {slot: item, type: noun}
        - {slot: aux, type: auxiliary}
        - {slot: a, type: name}
        - {slot: verb, type: verb}
        - {lit: than}
        - {slot: b, type: name}
    resolves:
      consumer: difference
      a: "{a}"
      b: "{b}"
      measure: "{item}"
      verb: "{verb}"

  - id: ask/how-many-entity
    # NOTE (mining candidate pronoun-entity-asks): a widening of `who` to
    # `type: entity` was tried here and DROPPED — it ties on consumed-unit
    # count with ask/how-many-entity-possessed and ask/how-many-entity-
    # qualified (both also 6 tokens: how/many/item/aux/who/verb) and the
    # alphabetical id tie-break (patterns.match_ask) then routes a
    # possessive- or attribute-qualified subject HERE instead of to the
    # narrower ask, dropping their `entity_owner`/`entity_qualifier`
    # binding and breaking the owner/qualifier-scoped fallback (caught by
    # tests/test_mining_increment_25.py and _34.py). Left as `type: name`.
    match:
      question:
        - {lit: how}
        - {lit: many}
        - {slot: item, type: noun}
        # `future_modal`, not `auxiliary` (mining candidate
        # will-tense-asks): also accepts "how many X will/would WHO have"
        # alongside the ordinary "do/does/did" form — a future/conditional-
        # tense phrasing of the SAME factual question, over the same
        # premises. The 6 capacity/hypothetical modals (can/could/should/
        # may/might/must) are excluded, so this can never widen into
        # ask/how-many-capacity's own territory (increment 19/14).
        - {slot: aux, type: future_modal}
        - {slot: who, type: name}
        - {slot: verb, type: verb}
    resolves:
      consumer: single-entity
      entity: "{who}"
      measure: "{item}"
      verb: "{verb}"

  - id: ask/how-many-entity-elided-measure
    # mining candidate elided-measure-entity-asks: sibling of
    # ask/how-many-entity with NO `item` slot at all — "How many does Tom
    # have?" / "How many did Tom make?" elide the measure entirely; the
    # consumer supplies it as the entity's own unique measure in play (see
    # answer.py's `single-entity-elided-measure` branch). Exactly 5
    # consumed units (how/many/aux/who/verb) vs. every itemed sibling's 6
    # (how/many/item/aux/who/verb) — this ALWAYS loses the specificity
    # tie-break in patterns.match_ask whenever an item noun is present, so
    # it can never shadow ask/how-many-entity or its
    # possessed/qualified siblings. It also can never match the same
    # sentence as those asks in the first place: with no item slot, this
    # ask requires `aux` to immediately follow "how many" (skippable units
    # are articles/punctuation only — see patterns.SKIPPABLE_SENSES), so
    # any sentence with an item noun there fails this ask's own match
    # before specificity is ever compared.
    match:
      question:
        - {lit: how}
        - {lit: many}
        - {slot: aux, type: future_modal}
        - {slot: who, type: name}
        - {slot: verb, type: verb}
    resolves:
      consumer: single-entity-elided-measure
      entity: "{who}"
      verb: "{verb}"

  - id: ask/how-many-entity-possessed
    match:
      question:
        - {lit: how}
        - {lit: many}
        - {slot: item, type: noun}
        - {slot: aux, type: auxiliary}
        # `possessed`, not `name`/`entity`: matches ONLY a noun merged from
        # "OWNER 's NOUN" (condense.py merge-possessive tags it with an
        # `owner` feature) — "Kennedy's house", never a bare common noun
        # ("the store"). A separate ask id (not a widened `who` slot on
        # ask/how-many-entity) so this can never shadow that ask's existing
        # name-subject matches; scoped precisely to the possessive-qualified
        # entity class this candidate targets.
        - {slot: who, type: possessed}
        - {slot: verb, type: verb}
    resolves:
      consumer: single-entity
      entity: "{who}"
      measure: "{item}"
      verb: "{verb}"
      # the fold side only re-keys entity to "house[kennedy]" when a real
      # same-key VALUE conflict forced the split (facts.py); the bare
      # "{who}" above still resolves the common (non-conflicting) case
      # unchanged. This is the fallback the single-entity consumer retries
      # when the bare entity comes back empty.
      entity_owner: "{who.owner}"

  - id: ask/how-many-entity-qualified
    match:
      question:
        - {lit: how}
        - {lit: many}
        - {slot: item, type: noun}
        - {slot: aux, type: auxiliary}
        # `qualified`, not `name`/`entity`/`possessed`: matches ONLY a noun
        # merged from ADJECTIVE+NOUN or NOUN+NOUN (condense.py merge-
        # attribute / merge-compound tags it with a `qualifier` feature) —
        # "coconut trees", "red apples", never a bare common noun ("the
        # store"). A separate ask id (not a widened `who` slot on
        # ask/how-many-entity) so this can never shadow that ask's existing
        # name-subject matches; scoped precisely to the attribute-qualified
        # entity class this candidate targets. Increment 34, mirroring
        # increment 25's ask/how-many-entity-possessed.
        - {slot: who, type: qualified}
        - {slot: verb, type: verb}
    resolves:
      consumer: single-entity
      entity: "{who}"
      measure: "{item}"
      verb: "{verb}"
      # the fold side only re-keys entity to "tree[coconut]" when a real
      # same-key VALUE conflict forced the split (facts.py); the bare
      # "{who}" above still resolves the common (non-conflicting) case
      # unchanged. This is the fallback the single-entity consumer retries
      # when the bare entity comes back empty.
      entity_qualifier: "{who.qualifier}"

  - id: ask/how-many-left-entityless
    match:
      question:
        - {lit: how}
        - {lit: many}
        - {slot: item, type: noun}
        - {slot: verb, type: verb}
        - {lit: left}
    resolves:
      consumer: unique-entity
      measure: "{item}"

  - id: ask/how-many-there
    match:
      question:
        - {lit: how}
        - {lit: many}
        - {slot: item, type: noun}
        - {slot: verb, type: verb}
        - {lit: there}
    resolves:
      consumer: unique-entity
      measure: "{item}"

  - id: ask/how-many-there-combined
    # "how many X are/were there in total/altogether/together/combined?"
    # (mining candidate entityless-total-recut, re-cutting parked candidate
    # entityless-total-there-asks) — the totality-marked sibling of
    # ask/how-many-there: the same entity-less "how many X ARE THERE"
    # premise-read shape, but with a REQUIRED trailing aggregate marker
    # (cat: aggregate — total/altogether/together/combined, packs/
    # core-english/lexicon/core.yaml; optionally preceded by a
    # preposition, so "in total" parses as prep 'in' + agg 'total' exactly
    # like ask/how-many-combined's own tail). That marker is explicit
    # license to sum EVERY holder of the measure, so this routes to the
    # SAME 'combined' consumer (answer.py) the pronoun/named-pair combined
    # asks already use — no new consumer logic: _combined_holder_totals
    # already enumerates every holder of the measure when no a/b is bound
    # (mining candidates how-many-combined / average-asks), which is
    # exactly the entity-less read this ask needs.
    #
    # ask/how-many-there itself is byte-unchanged and keeps its exactly-
    # one-holder discipline (unique-entity consumer) — that gate exists
    # precisely because a bare "how many X are there?" over 2+ holders is
    # ambiguous without a totality marker. This ask's tail (item/verb/
    # there/[prep]/agg) always consumes MORE units than the bare sibling's
    # (item/verb/there), so patterns.match_ask's max-consumed-units rule
    # (the ask/how-much-money-entity-left "money-left" precedent) always
    # prefers this ask when the marker is present, and this ask simply
    # fails to match at all when it's absent — never a partial-match tie.
    #
    # `exclude_entity: world` (pack data, not a Python constant — see
    # HANDOFF's "'world' entity ... pack-owned data constants" invariant):
    # the bare `world` scene-holder (arithmetic/existential-premise-bare's
    # unlocated "There are N X" fact, entity literally named `world` in
    # THAT rule's own emits block above) can co-occur with a real named
    # holder of the same measure ("Sam has 5 chairs. There are 12 chairs.
    # How many chairs are there in total?") — summing it alongside a real
    # holder would double-count a scene-level restatement as an
    # independent third holding. This ask alone opts a specific entity out
    # of the sum by naming it here as data; answer.py's
    # `_combined_holder_totals` reads it via a generic `exclude_entity`
    # parameter (default None — every existing combined/average ask is
    # byte-unchanged) and never hardcodes the literal itself.
    #
    # OUT of scope (named at ship time): conjoined-item totality tails
    # ("how many dogs and cats are there in all?") — single measure only.
    # 'in all' itself is also OUT — 'all' is a bare quantifier sense
    # (packs/core-english/lexicon/core.yaml), not tagged `aggregate`, and
    # admitting that sense is a separate mining candidate (in-all-
    # totality-tails) with its own blast-radius review.
    #
    # Trailing optional group (mining candidate plural-np-totality-asks):
    # "...are there in total IN THE TWO LAKES?" — a collective NP naming
    # the holders, appended after the aggregate marker. This NEVER binds a
    # new query field (the consumer still enumerates every holder from the
    # facts, unchanged) — it exists solely so the collective NP's own
    # cardinal ("two") is CONSUMED (the `{grp.value}` precedent below,
    # mirroring `span_value`/`item_value` elsewhere in this file) rather
    # than left as an unaccounted stated count that trips value-accounting
    # (methodology §5.2's "the 3 people" case). `grp, type: plural` alone
    # (no new slot type): the SAME slot type as `arithmetic/anchored-
    # relation`'s `item` binds a bare plural noun OR a cardinal-merged one
    # ("lakes"/"two lakes") identically, since condense.py's count-merge
    # keeps the head noun's `number: plural` feature on the merged unit.
    match:
      question:
        - {lit: how}
        - {lit: many}
        - {slot: item, type: noun}
        - {slot: verb, type: verb}
        - {lit: there}
        - opt:
            - {slot: p, cat: preposition}
        - {slot: agg, cat: aggregate}
        - opt:
            - {slot: p2, cat: preposition}
            - opt:
                - {lit: the}
            - {slot: grp, type: plural}
    resolves:
      consumer: combined
      measure: "{item}"
      verb: "{verb}"
      exclude_entity: world
      grp_value: "{grp.value}"

  - id: ask/how-many-plural-combined
    # "how many ITEM do/does/did (THE) PLURAL-COMMON-NOUN have TOTAL-
    # MARKER?" (mining candidate plural-np-totality-asks) — the definite-
    # plural / collective-subject sibling of ask/how-many-combined
    # (pronoun subject: "how many ITEM do THEY have combined?") and
    # ask/how-many-combined-named (named-pair subject). Here the subject
    # is a PLURAL COMMON NOUN standing in for two or more holders named
    # earlier ("the two boys", "the girls") rather than a pronoun or an
    # explicit name pair. `who, type: plural` (no new slot type): matches
    # a bare plural noun OR a cardinal-merged one ("boys"/"two boys")
    # identically — condense.py's count-merge keeps the head noun's
    # `number: plural` feature, so a leading cardinal never needs its own
    # slot. `who` itself is captured ONLY to consume the subject NP
    # structurally (mirrors ask/how-many-combined's own pronoun `who`,
    # which the resolves block below also never binds to a query field);
    # this ask NEVER names a specific entity, so it routes to the SAME
    # entity-less enumeration `_combined_holder_totals` performs when no
    # a/b is bound — summing every holder of the measure is exactly the
    # collective read "the boys" asserts.
    #
    # A leading cardinal on `who` ("the two boys") is explicitly consumed
    # via `who_value: "{who.value}"` (the `span_value`/`item_value`
    # precedent elsewhere in this file) so value-accounting never rejects
    # it as an unaccounted stated count.
    #
    # Never a tie with ask/how-many-combined (pronoun `who`) or ask/how-
    # many-combined-named (`type: name` a/b pair): both require a
    # DIFFERENT slot type on the same position that a plural common noun
    # can never satisfy, so at most one of the three asks matches a given
    # question at all.
    match:
      question:
        - {lit: how}
        - {lit: many}
        - {slot: item, type: noun}
        - {slot: aux, type: auxiliary}
        - opt:
            - {lit: the}
        - {slot: who, type: plural}
        - {slot: verb, type: verb}
        - opt:
            - {slot: p, cat: preposition}
        - {slot: agg, cat: aggregate}
    resolves:
      consumer: combined
      measure: "{item}"
      verb: "{verb}"
      who_value: "{who.value}"

  - id: ask/how-many-all-combined
    # "how many ITEM do/does/did ALL OF THEM have TOTAL-MARKER?" (mining
    # candidate plural-np-totality-asks) — the plural-pronoun collective
    # sibling of ask/how-many-plural-combined above: "all of them" instead
    # of a definite plural common noun. `all`/`of` are literal skeleton
    # (both known words — `all` a `quantifier` sense, packs/core-english/
    # lexicon/core.yaml); `who, type: pronoun` — a bare pronoun slot never
    # requires a resolved antecedent (unlike `type: name`/`type: entity`)
    # because, exactly like ask/how-many-combined's own pronoun `who`,
    # this ask's resolves block never binds `who` to a query field — it
    # is consumed purely to satisfy the match skeleton, and the 'combined'
    # consumer enumerates every holder of the measure from the facts.
    #
    # A separate ask id from ask/how-many-combined (not a widened `who`
    # slot there): that ask's own opt group binds [aux, who, verb] as ONE
    # inseparable subsequence, so inserting "all of" between `aux` and
    # `who` makes it fail to match at all rather than partially matching —
    # this ask alone claims the "all of them" surface, never shadowing the
    # bare "they"/"we" form.
    match:
      question:
        - {lit: how}
        - {lit: many}
        - {slot: item, type: noun}
        - {slot: aux, type: auxiliary}
        - {lit: all}
        - {lit: of}
        - {slot: who, type: pronoun}
        - {slot: verb, type: verb}
        - opt:
            - {slot: p, cat: preposition}
        - {slot: agg, cat: aggregate}
    resolves:
      consumer: combined
      measure: "{item}"
      verb: "{verb}"

  - id: ask/how-many-combined-named-elided-measure
    # "how many do/does/did NAME and NAME have TOTAL-MARKER?" (mining
    # candidate plural-np-totality-asks) — the elided-measure sibling of
    # ask/how-many-combined-named: no `item` slot at all, the same elision
    # ask/how-many-entity-elided-measure (increment 62) already admits for
    # a SINGLE named entity, here over a NAMED PAIR. Routed to a NEW
    # consumer (`combined-elided-measure`, answer.py) rather than
    # `single-entity-elided-measure`: that consumer resolves the elided
    # measure as the entity's own unique held measure, which has no
    # meaning for TWO entities — the new consumer instead takes the
    # measure BOTH named holders share (set intersection of their held
    # measures), declining unless exactly one is common to both, then
    # reuses `_combined_holder_totals` UNCHANGED (a/b bound, so it sums
    # exactly those two, never the enumerate-all-holders fallback).
    #
    # Exactly 8 consumed units (how/many/aux/a/and/b/verb/agg) vs. ask/
    # how-many-combined-named's 9+ (item present) — this ask's `aux`
    # position immediately follows "many" with no item noun in between,
    # so any question with an item noun there fails THIS ask's own match
    # before the two could ever tie on specificity.
    match:
      question:
        - {lit: how}
        - {lit: many}
        - {slot: aux, type: auxiliary}
        - {slot: a, type: name}
        - {lit: and}
        - {slot: b, type: name}
        - {slot: verb, type: verb}
        - opt:
            - {slot: p, cat: preposition}
        - {slot: agg, cat: aggregate}
    resolves:
      consumer: combined-elided-measure
      a: "{a}"
      b: "{b}"
      verb: "{verb}"

  - id: ask/how-much-bare-entity
    # NOTE (mining candidate pronoun-entity-asks): a widening of `who` to
    # `type: entity` was tried here and DROPPED — it ties on consumed-unit
    # count with ask/how-much-item-cost (both 5 tokens once `who` admits a
    # bare noun: how/much/aux/who/verb here vs. how/much/aux/item/verb
    # there) and the alphabetical id tie-break (patterns.match_ask) then
    # routes an item-subject cost question ("how much do the jackets
    # cost?") HERE — a `have`-style single-entity read with no matching
    # fact — instead of to the item-cost consumer (caught by
    # tests/test_mining_increment_38.py). Left as `type: name`.
    match:
      question:
        - {lit: how}
        - {lit: much}
        # `future_modal`, not `auxiliary` (mining candidate
        # modal-spend-measure-price): also accepts "how much will/would
        # WHO pay?" alongside the ordinary "do/does/did" form — see
        # ask/how-many-entity's comment for the class rationale.
        - {slot: aux, type: future_modal}
        - {slot: who, type: name}
        - {slot: verb, type: verb}
    resolves:
      consumer: single-entity
      entity: "{who}"
      # the CATEGORY, not a currency: resolved to the unique currency
      # measure present in the facts (mixed currencies decline)
      measure: currency
      verb: "{verb}"

  - id: ask/how-much-noun-entity
    # `who, type: entity` (mining candidate pronoun-entity-asks): widened
    # from `type: name` — see ask/how-many-entity's comment for the class
    # rationale and ask/how-much-bare-entity's comment for why a plural
    # pronoun subject can never collide with ask/how-much-combined.
    #
    # The `opt: [in, req_unit]` group (mining candidate unit-parenthetical-
    # asks) matches a parenthetical unit qualifier inserted mid-question
    # ("How much money, in dollars, does Tom have?") — the surrounding
    # commas are already globally-skippable punct (patterns.
    # SKIPPABLE_SENSES), so only the literal 'in' plus a noun slot need
    # authoring. Unbound when the parenthetical is absent (the ordinary
    # "how much money does Tom have?" case is unchanged — the opt group
    # simply fails to match and contributes nothing, exactly like every
    # other optional group in this file). When bound, answer.py's
    # single-entity consumer checks `req_unit` against the measure it
    # actually resolves and DECLINES on a mismatch (asked dollars, facts
    # in quarters) rather than silently answering in the wrong unit —
    # never a new vocabulary admission, `type: noun` is structural.
    match:
      question:
        - {lit: how}
        - {lit: much}
        - {slot: item, type: noun}
        - opt:
            - {lit: in}
            - {slot: req_unit, type: noun}
        # `future_modal`, not `auxiliary` (mining candidate
        # will-tense-asks): see ask/how-many-entity's comment for the class
        # rationale — "how much ITEM will/would WHO have" alongside the
        # ordinary "do/does/did" form.
        - {slot: aux, type: future_modal}
        - {slot: who, type: entity}
        - {slot: verb, type: verb}
    resolves:
      consumer: single-entity
      entity: "{who}"
      measure: "{item}"
      verb: "{verb}"
      req_unit: "{req_unit}"

  - id: ask/how-much-combined
    # "how much money do they have in total/altogether?" — the how-much
    # sibling of ask/how-many-combined (mining candidate how-much-combined):
    # identical shape, 'much' in place of 'many', routed to the SAME
    # 'combined' consumer (answer.py) that already sums N entities' totals
    # for a measure. 'item' is a required noun right after 'how much'
    # ('money', or any counted noun) — this can never collide with
    # ask/how-much-noun-entity or ask/how-much-bare-entity because those
    # require {who, type: name}, a proper name, while this ask's who slot
    # is {type: pronoun} ('they'/'we') — a name-subject question never
    # matches here and a pronoun-subject question never matches those.
    # measure: currency resolution for the bare 'money' item is the
    # existing interchangeable-category machinery (_resolve_measure,
    # increment 26 precedent) — no new vocabulary needed.
    match:
      question:
        - {lit: how}
        - {lit: much}
        - {slot: item, type: noun}
        - opt:
            - {slot: aux, type: auxiliary}
            - {slot: who, type: pronoun}
            - {slot: verb, type: verb}
        - opt:
            - {slot: p, cat: preposition}
        - {slot: agg, cat: aggregate}
    resolves:
      consumer: combined
      measure: "{item}"
      verb: "{verb}"

  - id: ask/how-much-combined-named
    # "how much ITEM do/does/did NAME and NAME have together/in total/
    # altogether?" — the how-much sibling of ask/how-many-combined-named,
    # identical rationale: named holders bind DIRECTLY instead of the
    # pronoun-only enumeration ask/how-much-combined above uses. Cannot
    # tie/shadow that ask for the same reason documented there: its own
    # opt group binds `who, type: pronoun`, which a proper name never
    # satisfies, so it fails to match a named-pair question outright
    # rather than partially matching. Also cannot collide with ask/how-
    # much-noun-entity or ask/how-much-bare-entity (both require a SINGLE
    # `who, type: name` immediately followed by `verb` — "NAME and NAME
    # have" has 'and' between the first name and the verb, which neither
    # of those asks' sequences can skip over, so they fail to match here
    # too).
    match:
      question:
        - {lit: how}
        - {lit: much}
        - {slot: item, type: noun}
        - {slot: aux, type: auxiliary}
        - {slot: a, type: name}
        - {lit: and}
        - {slot: b, type: name}
        - {slot: verb, type: verb}
        - opt:
            - {slot: p, cat: preposition}
        - {slot: agg, cat: aggregate}
    resolves:
      consumer: combined
      a: "{a}"
      b: "{b}"
      measure: "{item}"
      verb: "{verb}"

  - id: ask/how-much-noun-more-than
    match:
      question:
        - {lit: how}
        - {lit: much}
        - {slot: dir, cat: delta}
        - {slot: item, type: noun}
        - {slot: aux, type: auxiliary}
        - {slot: a, type: name}
        - {slot: verb, type: verb}
        - {lit: than}
        - {slot: b, type: name}
    resolves:
      consumer: difference
      a: "{a}"
      b: "{b}"
      measure: "{item}"
      verb: "{verb}"

  - id: ask/what-is-the-difference-named
    match:
      question:
        # "what is the difference in/between the number of ITEM NAME and
        # NAME have" — the wh-difference CLASS routed to the EXISTING
        # 'difference' consumer shared with ask/how-many-more; 'the'/'a'
        # articles are skippable senses, never authored as literals.
        # `cat: state` reuses the established has/have/is/are/was/were/
        # own/owns equivalence class (core-english categories) for the
        # copula, exactly as ask/how-old-is does.
        - {lit: what}
        - {slot: be, cat: state}
        - {lit: difference}
        - opt:
            - {slot: prep, cat: preposition}
        - opt:
            # "the number of"/"the amount of" framing (same aggregate_noun
            # + 'of' pairing as arithmetic/times-the-number-of) — optional
            # because "the difference in ITEM ..." also occurs bare.
            - {slot: frame, cat: aggregate_noun}
            - {lit: of}
        - {slot: item, type: noun}
        - {slot: a, type: name}
        - {lit: and}
        - {slot: b, type: name}
        - {slot: verb, type: verb}
    resolves:
      consumer: difference
      a: "{a}"
      b: "{b}"
      measure: "{item}"
      verb: "{verb}"

  - id: ask/what-is-the-difference-pronoun
    match:
      question:
        # the pronoun mirror of ask/what-is-the-difference-named ("...ITEM
        # they have?") — no named pair to bind, so the consumer resolves
        # the pair itself from the FACTS (exactly two holders of the
        # measure, or decline; mirrors the 'combined' consumer's holder
        # enumeration, but difference is inherently BINARY, never a Σ).
        - {lit: what}
        - {slot: be, cat: state}
        - {lit: difference}
        - opt:
            - {slot: prep, cat: preposition}
        - opt:
            - {slot: frame, cat: aggregate_noun}
            - {lit: of}
        - {slot: item, type: noun}
        - {slot: who, type: pronoun}
        - {slot: verb, type: verb}
    resolves:
      consumer: difference
      measure: "{item}"
      verb: "{verb}"

  - id: ask/how-many-rate-span
    match:
      question:
        - {lit: how}
        - {lit: many}
        - {slot: item, type: noun}
        - {slot: aux, type: auxiliary}
        - {slot: who, type: entity}
        - {slot: verb, type: verb}
        - {lit: in}
        - {slot: span, type: counted}
    resolves:
      consumer: rate-span
      entity: "{who}"
      measure: "{item}"
      span_unit: "{span}"
      span_value: "{span.value}"

  - id: ask/how-much-rate-span
    match:
      question:
        - {lit: how}
        - {lit: much}
        - {slot: aux, type: auxiliary}
        - {slot: who, type: entity}
        - {slot: verb, type: verb}
        - {lit: in}
        - {slot: span, type: counted}
    resolves:
      consumer: rate-span
      entity: "{who}"
      measure: currency
      span_unit: "{span}"
      span_value: "{span.value}"

  - id: ask/earn-span
    # 'how much does WHO earn/make (in SPAN)?' — wage-earnings asks (rate
    # x worked span). The verb is gated to the narrow wage_verb category
    # (packs/arithmetic/categories/wage.yaml), not the general 'acquire'/
    # 'produce' categories, so an unrelated 'how much did Mary buy' never
    # matches here. The 'in SPAN' clause is OPTIONAL: a span may instead
    # be stated in an earlier sentence ("Rob works 8 hours") and read off
    # a plain quantity fact by the rate-span consumer itself. This id is
    # sorted (alphabetically) before ask/how-much-bare-entity on purpose —
    # both shapes consume the same units when no span clause is present,
    # and the earlier id wins the deterministic tie (patterns.match_ask),
    # so a wage-verb question is routed to rate-span instead of the
    # event-fold, which never had a matching event to fold in the first
    # place (dev-train probe: 0 correct answers from event-fold on any
    # earn/make question — see mining candidate wage-span-earnings).
    match:
      question:
        - {lit: how}
        - {lit: much}
        - {slot: aux, type: auxiliary}
        - {slot: who, type: entity}
        - {slot: verb, cat: wage_verb}
        - opt:
            - {lit: in}
            - {slot: span, type: counted}
    resolves:
      consumer: rate-span
      entity: "{who}"
      measure: currency
      span_unit: "{span}"
      span_value: "{span.value}"

  - id: ask/how-long-take-span
    # 'how long does/did it take WHO to VERB N ITEM?' — the INVERSE of the
    # forward rate-span asks above: amount ASKED divided by a known Rate,
    # instead of a known span multiplied by a known Rate. "it take" is
    # structural skeleton (the extraposed-infinitive idiom), not lexicon.
    # `aux, type: future_modal` (mining candidate modal-how-long-asks):
    # widened from `type: auxiliary` — also accepts "how long will/would it
    # take" alongside the ordinary "do/does/did" form, the SAME future/
    # conditional-tense widening already applied to ask/how-many-entity and
    # ask/how-much-money-entity-left (see their comments for the class
    # rationale). The 6 capacity/hypothetical modals (can/could/should/
    # may/might/must) are excluded — only will/would are in the
    # `future_modal` category — so a genuinely hypothetical/capacity-shaped
    # question still cannot bind here. Routed to a NEW consumer
    # (rate-span-inverse) — the forward 'rate-span' consumer/branch above
    # is untouched byte-for-byte.
    match:
      question:
        - {lit: how}
        - {lit: long}
        - {slot: aux, type: future_modal}
        - {lit: it}
        - {lit: take}
        - {slot: who, type: entity}
        - {lit: to}
        - {slot: verb, type: verb}
        - {slot: item, type: counted}
    resolves:
      consumer: rate-span-inverse
      entity: "{who}"
      item: "{item}"
      item_value: "{item.value}"

  - id: ask/how-many-timeunit-take-span
    # 'how many TIMEUNIT does/did it take WHO to VERB N ITEM?' — same
    # inverse class as ask/how-long-take-span above, but the asked time
    # UNIT is named explicitly ("how many hours...") instead of left to the
    # rate's own per-unit; the consumer additionally requires the named
    # unit to match the committing rate's per-unit, or declines.
    #
    # `aux, type: future_modal` (mining candidate modal-how-long-asks):
    # same will/would widening as ask/how-long-take-span above. This is the
    # one ask of the pair with a real adjacency risk: ask/how-many-capacity
    # ALSO gates on a will/would-capable `modal` slot ("how many hours will
    # WHO VERB" — increment 14/19) and could in principle tie on the same
    # question. It cannot in practice: this ask's literal 'it'/'take'/'to'
    # tokens are required, non-optional, and ask/how-many-capacity has no
    # such literals in its shape, so a question that satisfies THIS ask's
    # full 9-token span (how/many/span_unit/aux/it/take/who/to/verb, plus
    # the counted item — 10 consumed units) either fails capacity's shape
    # entirely (the expletive "it" cannot satisfy capacity's `who, type:
    # entity` slot — an unresolved pronoun never does, per `_slot_ok`) or,
    # on the rare reading where it did, loses on specificity (10 consumed
    # units here vs. capacity's 6, `patterns.specificity` — the same
    # max-consumed-units check increment 49 verified for its own modal
    # widening). Confirmed against packs/difg-mined/quarantine.yaml: no new
    # vocabulary admitted, this is a pure slot-type widening.
    match:
      question:
        - {lit: how}
        - {lit: many}
        - {slot: span_unit, type: noun}
        - {slot: aux, type: future_modal}
        - {lit: it}
        - {lit: take}
        - {slot: who, type: entity}
        - {lit: to}
        - {slot: verb, type: verb}
        - {slot: item, type: counted}
    resolves:
      consumer: rate-span-inverse
      entity: "{who}"
      item: "{item}"
      item_value: "{item.value}"
      span_unit: "{span_unit}"

  - id: ask/how-old-is
    match:
      question:
        - {lit: how}
        - {lit: old}
        - {slot: verb, cat: state}
        - {slot: who, type: name}
    resolves:
      consumer: single-entity
      entity: "{who}"
      # the DATA measure the stated-age rule commits to — matches its
      # emitted Quantity's measure exactly, no category resolution needed
      measure: year
      verb: "{verb}"

  - id: ask/how-many-unit-dimension-is
    # mining candidate dimension-comparatives: "How many inches tall is
    # Jake?" — a unit-qualified dimension ask: the unit is named
    # explicitly, so the ordinary `single-entity` consumer resolves the
    # measure from it exactly like every other itemed ask (`item, type:
    # noun` = "inches"). Modelled on ask/how-old-is directly above, but
    # needs a CATEGORY of base adjectives (`dimension_adjective`:
    # tall/heavy/wide/high/large/small/short) rather than one literal
    # ('old'), since several words gate this ask, not one. The `adj`
    # slot is matched skeletally (not referenced by `resolves`) — it is
    # what distinguishes this shape from ask/how-many-entity ("how many
    # inches does Jake have"), which has no adjective at all; the two
    # never tie because ask/how-many-entity's `aux, type: future_modal`
    # slot can never match an adjective word and vice versa, so at most
    # one of them fully matches any given question.
    #
    # A sibling BARE ask ("How tall is Jake?", no unit named, resolving
    # via the `single-entity-elided-measure` consumer) was tried and
    # DROPPED: it caught a genuine DECL->WRONG on dev-train ("How long is
    # their combined experience?" answered -40 instead of declining —
    # 'long' is the standard English DURATION idiom as much as a physical
    # one, and its `who` slot bound a mis-resolved plural pronoun). Every
    # OTHER member of `dimension_adjective` narrowed the collision but
    # didn't eliminate the underlying risk (an elided, unit-less measure
    # resolved off a resolved-pronoun entity, on a category that keeps
    # growing) revealed again on dev-holdout — so the whole no-stated-unit
    # ask shape was dropped rather than chasing it word by word. This
    # unit-qualified ask keeps working: the stated unit forces an exact
    # measure match or a decline, never a wrong guess.
    match:
      question:
        - {lit: how}
        - {lit: many}
        - {slot: item, type: noun}
        - {slot: adj, cat: dimension_adjective}
        - {slot: verb, cat: state}
        - {slot: who, type: name}
    resolves:
      consumer: single-entity
      entity: "{who}"
      measure: "{item}"
      verb: "{verb}"

  - id: ask/is-membership
    match:
      question:
        - {lit: is}
        - {slot: member, type: name}
        - {slot: coll, type: noun}
    resolves:
      consumer: membership-verdict
      member: "{member}"
      collection: "{coll}"

  - id: ask/how-many-capacity
    match:
      question:
        - {lit: how}
        - {lit: many}
        - {slot: item, type: noun}
        - {slot: modal, type: modal}
        - {slot: who, type: entity}
        - {slot: verb, type: verb}
        - opt:
            - {lit: with}
            - {slot: budget, type: counted}
    resolves:
      consumer: capacity
      entity: "{who}"
      item: "{item}"
      budget_value: "{budget.value}"

  - id: ask/how-many-partition
    match:
      question:
        - {lit: how}
        - {lit: many}
        - {slot: item, type: noun}
        - {slot: verb, type: verb}
        - {slot: attr, type: adjective}
    resolves:
      consumer: partition-complement
      item: "{item}"
      attribute: "{attr}"
      negated: "false"

  - id: ask/how-many-partition-negated
    match:
      question:
        - {lit: how}
        - {lit: many}
        - {slot: item, type: noun}
        - {slot: verb, type: verb}
        - {lit: not}
        - {slot: attr, type: adjective}
    resolves:
      consumer: partition-complement
      item: "{item}"
      attribute: "{attr}"
      negated: "true"

  - id: ask/how-many-attribute-partition-in-place
    # mining candidate rest-partitions-qualified: PRENOMINAL sibling of
    # ask/how-many-partition ("how many X are ADJ") — "how many ADJ X are
    # in PLACE?" states the attribute BEFORE the noun instead of after a
    # copula ("how many GREY cats are in this house?"). `type: qualified`
    # (not a separate `type: adjective` slot before `item`): condense.py's
    # merge-attribute already fuses ADJECTIVE+NOUN into ONE unit before
    # asks ever run (the same convention ask/how-many-entity-qualified
    # relies on for its subject), so there is no standalone adjective
    # token left to match — `item.qualifier` reads the fused modifier off
    # that single unit. Same partition-complement consumer and target
    # fact (a resolved PartitionQuantity keyed on item/attribute — the
    # rest-partition payoff and the ordinary "N of them are ADJ"
    # partitions alike) as the postfix ask/how-many-partition.
    #
    # `type: qualified` is a STRICT SUBSET of ask/how-many-in-place's bare
    # `type: noun` item (a qualified unit is still sense=='noun', so that
    # ask still matches this sentence too, consuming the identical number
    # of units — merge-attribute already fused the modifier into one
    # unit, so there is no extra token left to out-consume it with,
    # unlike ask/how-many-partition's postfix attr). patterns.match_ask
    # breaks that tie by rule-id sort order alone (its own documented
    # mechanism — see ask/how-many-entity's comment for the precedent of
    # reasoning about it explicitly); this id is spelled to sort BEFORE
    # "ask/how-many-in-place" ('a' < 'i' right after the shared
    # "ask/how-many-" prefix) so a qualified item always routes here
    # first. Never shadows the bare ask for an unqualified item — a
    # `type: qualified` mismatch means this ask simply fails to match at
    # all, leaving ask/how-many-in-place as the only candidate.
    match:
      question:
        - {lit: how}
        - {lit: many}
        - {slot: item, type: qualified}
        - {slot: verb, type: verb}
        - {slot: prep, cat: preposition}
        - {slot: place, type: noun}
    resolves:
      consumer: partition-complement
      item: "{item}"
      attribute: "{item.qualifier}"
      negated: "false"

  - id: ask/how-many-attribute-partition-there
    # mining candidate rest-partitions-qualified: the entity-less sibling
    # of ask/how-many-attribute-partition-in-place, mirroring
    # ask/how-many-there the same way that ask mirrors
    # ask/how-many-in-place — "how many ADJ X are there?" with no place
    # named. Same partition-complement consumer and `type: qualified`
    # item (see the in-place sibling's comment for the merge-attribute
    # and id-sort-order reasoning); "attribute-partition-there" sorts
    # before "there" the same way, so it wins the tie against the bare
    # ask/how-many-there whenever the modifier is present.
    match:
      question:
        - {lit: how}
        - {lit: many}
        - {slot: item, type: qualified}
        - {slot: verb, type: verb}
        - {lit: there}
    resolves:
      consumer: partition-complement
      item: "{item}"
      attribute: "{item.qualifier}"
      negated: "false"

  - id: ask/how-many-more-goal-need
    match:
      question:
        - {lit: how}
        - {lit: many}
        - {slot: dir, cat: delta}
        - {slot: item, type: noun}
        - {slot: aux, type: auxiliary}
        - {slot: who, type: name}
        - {slot: verb, cat: need_ask_verb}
    resolves:
      consumer: deficit
      entity: "{who}"
      measure: "{item}"

  - id: ask/how-much-money-entity-left
    # "how much money does WHO have left" — the remaining-money class: a
    # stated single money holding minus the entity's priced purchases
    # (the money-left consumer, answer.py). The literal 'money' plus the
    # trailing 'left' make this ask consume MORE units than the existing
    # ask/how-much-noun-entity ("how much money does Tom have", no 'left')
    # over the same question, so max-consumed specificity (patterns.
    # match_ask) routes a 'left' question here instead of to the raw-
    # holding read that ask would otherwise give. The verb is gated to the
    # `state` category (have/has/had/...), never the general `verb` type,
    # because only a STATED HOLDING — not an event fold — is a valid base
    # to subtract purchases from.
    # `who, type: entity` (mining candidate pronoun-entity-asks): widened
    # from `type: name` — see ask/how-many-entity's comment for the class
    # rationale.
    #
    # The `opt: [in, req_unit]` group (mining candidate unit-parenthetical-
    # asks): same mid-question parenthetical-unit mechanism as
    # ask/how-much-noun-entity's comment above, applied here between the
    # literal 'money' and 'aux' — "How much money, in dollars, does Ian
    # have left?". Unbound when absent; bound, answer.py's money-left
    # consumer checks it against the resolved currency measure the same
    # way.
    match:
      question:
        - {lit: how}
        - {lit: much}
        - {lit: money}
        - opt:
            - {lit: in}
            - {slot: req_unit, type: noun}
        # `future_modal`, not `auxiliary` (mining candidate
        # will-tense-asks): see ask/how-many-entity's comment for the class
        # rationale — "how much money will/would WHO have left" alongside
        # the ordinary "do/does/did" form.
        - {slot: aux, type: future_modal}
        - {slot: who, type: entity}
        - {slot: verb, cat: state}
        - {lit: left}
    resolves:
      consumer: money-left
      entity: "{who}"
      measure: currency
      req_unit: "{req_unit}"

  - id: ask/how-much-change
    # "how much change does/did/will WHO get/receive/take (back)" (mining
    # candidate change-asks): the buyer's TENDER — a stated payment amount
    # handed over ("pays with a $50 bill" / "paid $200" / "gave $250 [to
    # the cashier]", any tender_verb-category event whose measure is
    # currency; packs/difg-mined/categories/semantic.yaml) — minus the
    # SAME priced-purchase total ask/how-much-money-entity-left's
    # money-left consumer already uses (answer.py's _purchase_total,
    # UNCHANGED: the increment-10 invariant travels with it unscoped —
    # any unpriced purchase or a cost-splitting predicate on this entity
    # declines the whole total). 'change' is a specific, rare surface
    # literal (methodology §5.3) rather than a category gate: no other
    # ask in this file matches it, so a change question is never
    # confused with a plain money-holding one.
    #
    # `verb, type: verb` deliberately UNCONSTRAINED (not gated to a
    # receive/get category): the dev-train evidence for this class uses
    # several different verbs for the identical "how much change did
    # WHO ___?" shape ("get back" / "receive back" / "receive" / "take")
    # and the answer never depends on which one — the change consumer
    # computes tender minus spend regardless, so gating the verb would
    # only narrow coverage with no safety benefit. The optional trailing
    # 'back' group is unbound (and harmless) whenever the question omits
    # it. `aux, type: future_modal` (not `auxiliary`): "will/would WHO
    # receive" is the majority phrasing in the evidence, alongside the
    # ordinary "does/did" form — see ask/how-many-entity's comment for
    # the class rationale.
    match:
      question:
        - {lit: how}
        - {lit: much}
        - {lit: change}
        - {slot: aux, type: future_modal}
        - {slot: who, type: entity}
        - {slot: verb, type: verb}
        - opt:
            - {lit: back}
    resolves:
      consumer: change
      entity: "{who}"

  - id: ask/how-much-item-cost
    # "how much do/does/did ITEM cost" — the item-SUBJECT cost ask (mining
    # candidate item-cost-asks): the item is the grammatical subject of
    # 'cost' itself, never a name (there is no `who` slot at all), so this
    # can never collide with the how-much-noun-entity family ("how much
    # money does Tom have"), which needs item, THEN aux, THEN a name, THEN
    # a general verb — a different token order entirely. The verb is
    # gated to the EXISTING `price_verb` category (cost/costs, increment
    # 15) rather than the general `verb` type, so an unrelated "how much
    # do the shirts weigh" never reaches the item-cost consumer.
    match:
      question:
        - {lit: how}
        - {lit: much}
        - {slot: aux, type: auxiliary}
        - {slot: item, type: noun}
        - {slot: verb, cat: price_verb}
    resolves:
      consumer: item-cost
      item: "{item}"

  - id: ask/how-much-pay-for-quantity
    # "how much did WHO pay/spend for/on N ITEM" (mining candidate priced-
    # quantity-cost-asks): the ask itself states the quantity ("4 shirts",
    # one merge-count unit) rather than relying on an existing Quantity
    # fact — this is the class of question that INTRODUCES its own
    # hypothetical count over a priced item, routed to the new
    # 'cost-of-quantity' consumer (answer.py), which commits N (the
    # question's own count) times the item's unique Price fact and checks
    # the buyer's own cost-splitting predicates (increment 10's
    # invariant) before committing.
    #
    # NOTE: the sibling no-buyer surface ("how much does it cost to buy N
    # ITEM") was tried and DROPPED — 'cost' is a noun/verb homograph
    # (charge-category noun vs price_verb), and a trailing purchase
    # infinitive ("...to buy 4 shirts") gives the infinitive's own verb a
    # SECOND viable subject candidate (the noun reading of 'cost' itself,
    # nearer than the pronoun 'it'), which ties the coverage-arbitration
    # score between the noun and verb readings of 'cost' for EVERY
    # instance of that surface form (obligations.py's disambiguate(),
    # confirmed via --trace on synthetic probes) — 'much'/'cost' stay
    # permanently flagged ambiguous and the guard vetoes any commit
    # regardless of ask/consumer design. Out of scope to fix here (a
    # shared disambiguation tie-break, not this candidate's files); worth
    # its own future mining candidate.
    #
    # The verb is gated to the EXISTING `spend_verb` category (pay/paid/
    # pays/spend/spends/spent — already members via packs/core-english
    # and packs/difg-mined, no new vocabulary), and the trailing
    # preposition to the narrow `spend_target_prep` category ('for'/'on'
    # only — see that category's own note for why the general
    # `preposition` sense is NOT used here: it would tie ask/how-much-
    # rate-span and ask/earn-span on consumed-unit count for "how much
    # did WHO pay IN N months" and let alphabetical id order silently
    # mis-route a span question here). Consumes MORE units than the
    # existing ask/how-much-bare-entity ("how much did Tom pay", 5
    # tokens) whenever this trailing clause is present, so max-consumed
    # specificity (patterns.match_ask) routes here instead —
    # ask/how-much-bare-entity's own spend_verb branch (answer.py's
    # _purchase_total) still wins unchanged on the bare form, with no
    # trailing "for/on N ITEM" clause to consume.
    match:
      question:
        - {lit: how}
        - {lit: much}
        # `future_modal`, not `auxiliary` (mining candidate
        # modal-spend-measure-price): also accepts "how much will/would
        # WHO pay for N ITEM" alongside the ordinary "do/does/did" form —
        # see ask/how-many-entity's comment for the class rationale.
        - {slot: aux, type: future_modal}
        - {slot: who, type: name}
        - {slot: verb, cat: spend_verb}
        - {slot: prep, cat: spend_target_prep}
        - {slot: qty, type: counted}
    resolves:
      consumer: cost-of-quantity
      entity: "{who}"
      item: "{qty}"
      qty_value: "{qty.value}"

  - id: ask/what-total-combined
    # "What is/was the total (number/amount) of ITEM (that) they VERB?" —
    # the wh-copular total ask (mining candidate wh-total-asks): 'what'
    # plus a copula ({cat: state}: is/was/are/were) FRONTS the aggregate
    # word instead of ask/how-many-combined's item-first "how many X ...
    # in total" phrasing; both route to the same unchanged 'combined'
    # consumer (Σ over every holder of the resolved measure). The
    # 'number'/'amount' frame noun and the trailing "(that) WHO VERB"
    # clause are both optional — a bare "what is the total of X?" needs
    # neither. The trailing clause is scoped to a bare pronoun ('they'),
    # never a counted/named subject ("the two have", "Mia and Leo have"):
    # those need holder-count or multi-name binding logic this candidate
    # does not add, so a counted/named subject simply fails the
    # {type: pronoun} slot and that optional clause goes unconsumed —
    # the ask still resolves via the SAME default verb ('have') the
    # combined consumer already falls back to for how-many-combined's own
    # unbound {verb} (answer.py's `query.get("verb", "have")`), so no new
    # fallback path is introduced.
    match:
      question:
        # no literal 'the': article is a globally-skippable sense
        # (patterns.SKIPPABLE_SENSES), so a required 'the' token could
        # never match anyway — skip advances past it before any literal
        # comparison runs, same as every other ask in this file (none of
        # them spell 'the' out either).
        - {lit: what}
        - {slot: be, cat: state}
        - {lit: total}
        - opt:
            - {slot: agg_noun, cat: aggregate_noun}
            - {lit: of}
        - {slot: item, type: noun}
        - opt:
            - opt:
                - {lit: that}
            - {slot: who, type: pronoun}
            - {slot: verb, type: verb}
    resolves:
      consumer: combined
      measure: "{item}"
      verb: "{verb}"

  - id: ask/what-total-combined-contracted
    # Same class as ask/what-total-combined, for the "what's" contraction.
    # tokenize.py's _CONTRACTIONS table never expands "'s" (unlike n't/
    # 're/'ll/'ve — see tokenize.py's comment: "kept as its own token,
    # possessive/copula resolved later"), so "what's" always splits into
    # the literal units 'what' + "'s" and the copula slot there can never
    # be a {cat: state} verb. A literal "'s" token plays the skeletal role
    # {slot: be, cat: state} plays in the is/was form above. Kept as a
    # SEPARATE ask id rather than widening the shared 'state' category to
    # admit "'s": "'s" is lexiconed as sense=possessive, not verb, and
    # admitting it into 'state' would change every other state-gated rule
    # and ask (ask/how-old-is, ask/how-much-money-entity-left, the
    # goal/state sentence rules, ...), not just this one — the HANDOFF
    # invariant against widening a shared gate for one caller.
    match:
      question:
        - {lit: what}
        - {lit: "'s"}
        - {lit: total}
        - opt:
            - {slot: agg_noun, cat: aggregate_noun}
            - {lit: of}
        - {slot: item, type: noun}
        - opt:
            - opt:
                - {lit: that}
            - {slot: who, type: pronoun}
            - {slot: verb, type: verb}
    resolves:
      consumer: combined
      measure: "{item}"
      verb: "{verb}"

  - id: ask/what-average-combined
    # "What is/was the average (number/amount) of ITEM (that) they VERB?"
    # (mining candidate average-asks): the average sibling of
    # ask/what-total-combined — IDENTICAL shape, 'average' in place of
    # 'total', routed to a NEW 'average' consumer (answer.py) that reuses
    # ask/what-total-combined's own 'combined' holder-enumeration helper
    # UNCHANGED (same Σ over every holder of the resolved measure, same
    # >=2-holders-or-decline discipline, same state/event-verb fallback)
    # and divides by the holder count. Can never collide with
    # ask/what-total-combined: the two asks differ on the required literal
    # right after the copula ('average' vs 'total'), so a question can
    # only ever supply one of them — mutually exclusive matches, not a
    # specificity contest. The trailing "(that) WHO VERB" clause is
    # scoped to a bare pronoun exactly as in ask/what-total-combined, for
    # the same reason: a counted/named subject needs holder-count/multi-
    # name binding this candidate does not add, so it is left unconsumed
    # and the ask still resolves via the same default verb ('have').
    # Weighted-average and per-unit-rate phrasing ("average speed ... per
    # hour", "average X per day/month/game") never reaches a WRONG answer
    # here: those measures are not the kind of >=2 named holders the
    # 'average' consumer enumerates (Quantity facts keyed by a real
    # holder), so the consumer's own decline path — inherited unchanged
    # from 'combined' — catches them (fewer than two holders, or no
    # resolvable per-entity total), exactly as it already does for
    # ask/what-total-combined's own equivalent risk surface.
    match:
      question:
        - {lit: what}
        - {slot: be, cat: state}
        - {lit: average}
        - opt:
            - {slot: agg_noun, cat: aggregate_noun}
            - {lit: of}
        - {slot: item, type: noun}
        - opt:
            - opt:
                - {lit: that}
            - {slot: who, type: pronoun}
            - {slot: verb, type: verb}
    resolves:
      consumer: average
      measure: "{item}"
      verb: "{verb}"

  - id: ask/what-average-combined-contracted
    # Same class as ask/what-average-combined, for the "what's" contraction
    # — mirrors ask/what-total-combined-contracted's own rationale for why
    # this needs a separate ask id rather than widening 'state' to admit
    # the literal "'s" token.
    match:
      question:
        - {lit: what}
        - {lit: "'s"}
        - {lit: average}
        - opt:
            - {slot: agg_noun, cat: aggregate_noun}
            - {lit: of}
        - {slot: item, type: noun}
        - opt:
            - opt:
                - {lit: that}
            - {slot: who, type: pronoun}
            - {slot: verb, type: verb}
    resolves:
      consumer: average
      measure: "{item}"
      verb: "{verb}"
