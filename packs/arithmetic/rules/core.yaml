      - number_compatible: [who_b, verb_b]
      - same_lemma: [who_a, who_b]
      - same_lemma: [verb_a, verb_b]
      - same_lemma: [item_a, item_b]
      - distinct: [prior_period, current_period]
      - slot_not_category: {slot: k, cat: predeterminer_multiplier}
      - verb_roles_compatible:
