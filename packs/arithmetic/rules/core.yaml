      sentence:
        - {slot: who, type: entity, common_noun_cat: quantity_holder, referential: true}
        - {slot: verb, type: verb, finite_form: true}
        - {slot: item1, type: counted}
        - opt:
            - {slot: pp_prep, cat: preposition}
            - opt:
                - {slot: pp_det, cat: possessive_determiner}
            - {slot: pp_obj, type: noun, referential: true, bare_reference_category: bare_pp_object, determinerless_category: named_calendar_period}
        - {lit: and}
        - {slot: k, type: nonunit_multiplier}
        - {lit: [that, this], consume_skipped: true}
        - {lit: many}
        - opt:
            - {slot: item2_seen, type: plural}
    where:
      - slot_not_category: {slot: verb, cat: intransitive_process_verb}
      - number_compatible: [who, verb]
      - slot_not_category: {slot: k, cat: predeterminer_multiplier}
      - verb_role_compatible: {verb: verb, roles: [who], verb_cat: quantity_event_verb, role_cat: quantity_event_participant}
      - verb_role_compatible: {verb: verb, roles: [who], verb_cat: animate_subject_verb, role_cat: quantity_event_participant}
      - verb_role_compatible: {verb: verb, roles: [item1], verb_cat: animate_object_verb, role_cat: teaching_quantity_object}
      - verb_roles_compatible:
          verb: verb
          roles:
            actor: [who]
            theme: [item1]
          allow_proper_name: [who]
      - slot_not_category: {slot: verb, cat: non_quantity_object_verb}
      - slot_not_category: {slot: who, cat: non_quantity_holder}
      - slot_not_category: {slot: item1, cat: many_incompatible_noun}
      - attribute_compatible: {attribute: pp_prep, noun: pp_obj}
      - modifier_host_compatible: {modifier: pp_prep, host: item1, object: pp_obj}
      - bound_rejects_category: {bound: pp_det, slot: pp_obj, cat: named_calendar_period}
      - verb_role_compatible: {verb: pp_det, roles: [who], verb_cat: third_person_animate_possessive_determiner, role_cat: animate, allow_unbound_trigger: true}
      - distinct: [who, pp_obj]
      - unbound: [item2_seen]
    emits:
      - fact: quantity
        entity: "{who}"
        measure: "{item1}"
        measure_qualifier: "{item1.qualifier}"
        value: "item1"
        verb: "{verb}"
      - fact: quantity
        entity: "{who}"
        measure: "{item1}"
        measure_qualifier: "{item1.qualifier}"
        value: "k * item1"
        verb: "{verb}"
        # The anaphor reuses `item1`, so both facts have the same measure key.
        # `segment` keeps them as separate conjuncts.
        segment: 1




  - id: arithmetic/times-as-many-possessive-standard
    phase: read
    description: >
      mining candidate relation-standard-frames: "Carmela has twice
      Cecil's marbles" — the count possessive-NP standard, one measure
      family over from arithmetic/times-as-old-as-possessive-standard: a
      declared plural owned measure noun, never restricted to 'age' — that
      rule's own `cat: age_noun` gate makes it strictly MORE
      specific on the identical span whenever the possessed noun really is
      'age' (patterns.subsumes: same consumed tokens, higher gate depth),
      so the two never double-emit; this rule is the one that survives
      for every OTHER measure noun. `std, type: possessed` (condense.py
      merge-possessive's own `owner` tag — the same slot type ask/how-
      many-entity-possessed already gates on) requires an ACTUAL "OWNER's
      NOUN" merge, never a bare common noun, so this can't be confused
      with times-as-many/times-as-much's own "as many/as much ITEM as Y"
      shape: those require a LITERAL 'as' immediately after the
      multiplier, which this rule's very next token (the possessed noun
      itself) can never satisfy, and vice versa — the two families are
      structurally disjoint spans, not a specificity tie-break. `standard:
      "{std.owner}"` / `measure: "{std}"` read the OWNER and the noun's
      own lemma separately off the SAME merged unit (`_slot_value`'s
      `owner` attribute vs. its default lemma lookup, patterns.py) — the
      Relation's standard is the PERSON ('cecil'), its measure the noun
      itself ('marble'), never the reverse. A distinct owner predicate
      rejects self-comparisons such as "Fia has twice Fia's marbles";
      ordinary `distinct` compares the slot lemmas `fia` and `marble` and
      cannot express that boundary. PROVEN minimal pair on
      unmodified main: "Catherine has twice as much money as Cecil"
      commits while "Catherine has twice Cecil's money" declines outright.
      `who, type: name`: unwidened, matching times-as-much's own
      (not-yet-widened) slot type — this candidate's own structural sample
      never needed the common-noun-subject widening times-as-many/times-
      as-much-elided-standard already carry.
    match:
      sentence:
        - {slot: who, type: name}
        - {slot: verb, cat: possession_state}
        - {slot: k, type: nonunit_multiplier}
        - {slot: std, cat: noun, possessed: true, number: plural}
    where:
      - number_compatible: [who, verb]
      - slot_not_category: {slot: std, cat: mass_quantity_noun}
      - distinct_from_owner: {entity: who, possessed: std}
    emits:
      - fact: relation
        subject: "{who}"
        standard: "{std.owner}"
        measure: "{std}"
        factor: "k"
        offset: 0.0
        verb: "{verb}"


  - id: arithmetic/affine-times-as-many-possessive-standard
    phase: read
    description: >
      mining candidate affine-nominal-relations: "Ben has 50 more than
      twice Ana's money" — the AFFINE-PREFIXED sibling of arithmetic/
      times-as-many-possessive-standard (the general possessive-NP
      standard, "Carmela has twice Cecil's money"), one offset field over
      exactly like arithmetic/affine-times-as-much sits beside arithmetic/
      times-as-much. `std, type: possessed` (see times-as-many-possessive-
      standard's own comment for the full owner/measure-read mechanism —
      an ACTUAL "OWNER's NOUN" merge, never a bare common noun) sits
      directly after the multiplier, same as its non-affine sibling.
      Structurally disjoint from every 'as many'/'as much' sibling in this
      file: those all require a literal 'as' immediately after the
      multiplier (or after an item noun that itself follows the
      multiplier), and 'as' can never satisfy `std, type: possessed` (a
      possessive merge, never particle-sensed) — vice versa, a possessed
      NP directly after `k` can never satisfy any of those rules' own
      'as'-anchored continuations, so the spans never tie. `who, type:
      name`: unwidened, matching times-as-many-possessive-standard's own
      (not-yet-widened) slot type. The possessive standard is a count
      quantity NP and therefore requires declared plural morphology; the
      mass-noun sibling below owns singular mass standards. Its verb is a
      possession state because the
      possessed standard denotes the owner's holding, not an unrelated event
      performed by the subject. The additive direction is quantity-only, and
      the multiplier must be non-unit: English does not use adverbial "once"
      directly before this possessive NP. PROVEN minimal pair on unmodified main:
      "Ben has 50 more than twice Ana's money. Ana has 600 dollars. How
      much money does Ben have?" declines outright even though the
      identical non-affine ratio ("Ben has twice Ana's money") already
      resolves via arithmetic/times-as-many-possessive-standard.
    match:
      sentence:
        - {slot: who, type: name}
        - {slot: verb, cat: possession_state}
        - {slot: n, type: number}
        - {slot: dir, cat: count_quantity_delta}
        - {lit: than}
        - {slot: k, type: nonunit_multiplier}
        - {slot: std, cat: noun, possessed: true, number: plural}
    where:
      - number_compatible: [who, verb]
      - slot_not_category: {slot: std, cat: mass_quantity_noun}
      - distinct_from_owner: {entity: who, possessed: std}
    satisfies: {n: [quantifies]}
    consumes: [n]
    emits:
      - fact: relation
        subject: "{who}"
        standard: "{std.owner}"
        measure: "{std}"
        factor: "k"
        offset: "n * sign(dir)"
        verb: "{verb}"


  - id: arithmetic/fraction-delta-relation
