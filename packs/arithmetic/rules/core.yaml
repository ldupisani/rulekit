        standard: "{std}"
        measure: null
        factor: "k"
        offset: "n * sign(dir)"
        verb: "{verb}"

  - id: arithmetic/existential-premise
    phase: read
    description: >
      "There are 15 trees in the grove" — a located existential: the place
      holds the counted noun as a state quantity. The surface requires an
      agreeing copula; constructional `there` cannot turn an arbitrary event
      verb into an existential holding. `measure_qualifier:
      "{item.qualifier}"` (mining candidate qualified-measure-keys): the
      SVO fold has carried this since increment 70 (learn.py's `_qualifier`
      helper at every emission site) but this existential premise never
      did — "There are 16 red apples in a bowl. There are 28 green apples
      in the bowl." both bare-fold to measure='apple' with NO qualifier at
      all, so facts.py's admit-time qualifier split (which requires BOTH
      sides non-null) never engages and the two counts genuinely conflict
      instead of splitting into 'apple[red]'/'apple[green]'. Byte-identical
      whenever `item` carries no qualifier (the overwhelming existing case).
    match:
      sentence:
        - {lit: there}
        - {slot: verb, cat: copula}
        - {slot: item, type: counted}
        - {slot: prep, cat: preposition}
        - opt:
            - {slot: place_det, cat: possessive_determiner}
        - {slot: place, type: noun, referential: true, bare_reference_category: bare_pp_object}
    where:
      - absent: {cat: aggregate}
      - number_compatible: [item, verb]
      - slot_not_category: {slot: item, cat: existential_incompatible_noun}
      - attribute_compatible: {attribute: prep, noun: place}
    consumes: [item]
    emits:
      - fact: quantity
        entity: "{place}"
        measure: "{item}"
        measure_qualifier: "{item.qualifier}"
        value: "item"
        verb: have

  - id: arithmetic/existential-premise-distributive
    phase: read
    description: >
      "There are 20 chairs in EACH row" (mining candidate distributive-
      each-totals) — the located existential above, widened to a
      DISTRIBUTIVE place: a quantifier ('each'/'every' — the `quantifier`
      sense, same word class `_has_distributive_determiner`/`_is_rate`
      already recognize elsewhere in the kernel) between the preposition
      and the place noun makes the count PER-CONTAINER rather than a
      located total — "in each row" names the CONTAINER (row) as the
      quantity's holder exactly like "each box has 8 pens" already does
      via the ordinary SVO fold, just phrased existentially instead of
      with a stating verb. Emits the SAME per-container Quantity shape
      (entity=container, measure=content) so saturate.py's distributive-
      container-total synth composes it with the container's own stated
      count identically regardless of which surface produced it.

      Strictly more specific than both arithmetic/existential-premise
      (whose `place` slot requires a bare noun immediately after the
      preposition — a quantifier there fails that slot, so the two rules
      never tie) and arithmetic/existential-premise-bare (whose shorter
      "there VERB item" span this rule's longer match subsumes on any
      sentence with a trailing "PREP QUANTIFIER NOUN" tail): ordinary
      "There are 12 chairs." (no such tail) is untouched.
    match:
      sentence:
        - {lit: there}
        - {slot: verb, cat: copula}
        - {slot: item, type: counted}
        - {slot: prep, cat: preposition}
        - {slot: q, cat: distributive_quantifier}
        - {slot: place, type: noun}
    where:
      - absent: {cat: aggregate}
      - number_compatible: [item, verb]
      - slot_not_category: {slot: item, cat: existential_incompatible_noun}
    consumes: [item]
    emits:
      - fact: quantity
        entity: "{place}"
        measure: "{item}"
        measure_qualifier: "{item.qualifier}"
        value: "item"
        verb: have

  - id: arithmetic/existential-premise-bare
    phase: read
    description: >
      "There are 12 chairs." — an unlocated existential; the holder is the
      scene itself (the `world` entity, a data constant this pack owns).
      The located form strictly subsumes this one on shared matches. Optional
      continuation sentinels make that ownership explicit: a following
      preposition or complete counted conjunction must be validated by the
      corresponding longer sibling and cannot fall back to this rule's prefix.
      A declared `quantity_container` may retain its own count before an
      explicit partitive content tail ("30 boxes of apples"); arbitrary
      `ITEM of NOUN` sequences receive no such exception.
    match:
      sentence:
        - {lit: there}
        - {slot: verb, cat: copula}
        - {slot: item, type: counted}
        - opt:
            - {slot: tail_partitive, cat: partitive}
            - {slot: tail_content, type: noun}
        - opt:
            - {slot: tail_prep_seen, cat: preposition}
        - opt:
            - {lit: and}
            - {slot: item2_seen, type: counted}
    where:
      # "There are 160 toys ALTOGETHER" is a group TOTAL (a sum constraint
      # over the entities), never an independent holding
      - absent: {cat: aggregate}
      - number_compatible: [item, verb]
      - slot_not_category: {slot: item, cat: existential_incompatible_noun}
      - bound_requires_category: {bound: tail_partitive, slot: item, cat: quantity_container}
      - unbound: [tail_prep_seen, item2_seen]
    consumes: [item]
    emits:
      - fact: quantity
        entity: world
        measure: "{item}"
        measure_qualifier: "{item.qualifier}"
        value: "item"
        verb: have

  - id: arithmetic/existential-premise-bare-conjoined
    phase: read
    description: >
      "There are 34 girls and 841 boys." — the CONJOINED sibling of
      arithmetic/existential-premise-bare. That rule matches a single
      `{slot: item, type: counted}` and so mints only the FIRST conjunct,
      silently DROPPING the second: the sentence above minted girl=34 and
      no boy fact at all, which is not a decline but a SILENT partial
      reading — every downstream consumer then sees a store missing a
      quantity the text plainly states.

      The ordinary SVO fold already reads this conjunction correctly
      ("The basket has 7 red peaches and 8 green peaches" mints BOTH,
      qualifiers included); only the existential surface lacked it. This
      rule closes that asymmetry, emitting the SAME `world` scene-holder
      shape its bare sibling emits, once per conjunct.

      Strictly LONGER than arithmetic/existential-premise-bare, so it
      subsumes that rule on every sentence carrying the "and COUNTED"
      tail, exactly as -distributive subsumes -premise; a single-item
      "There are 12 chairs." has no such tail and is untouched.

      The `absent: {cat: aggregate}` guard is inherited verbatim: "There
      are 34 girls and 841 boys ALTOGETHER" is a group TOTAL (a sum
      constraint), never two independent holdings, and must keep routing
      to arithmetic/existential-premise-total. Both conjuncts also refuse the
      declared mass-measure class: a unit amount such as "40 pounds" is not a
      second independently enumerable population.
    match:
      sentence:
        - {lit: there}
        - {slot: verb, cat: copula}
        - {slot: item, type: counted}
        - {lit: and}
        - {slot: item2, type: counted}
    where:
      - absent: {cat: aggregate}
      - number_compatible: [item, verb]
      - slot_not_category: {slot: item, cat: existential_incompatible_noun}
      - slot_not_category: {slot: item2, cat: existential_incompatible_noun}
      - slot_not_category: {slot: item, cat: mass_measure}
      - slot_not_category: {slot: item2, cat: mass_measure}
    consumes: [item, item2]
    emits:
      - fact: quantity
        entity: world
        measure: "{item}"
        measure_qualifier: "{item.qualifier}"
        value: "item"
        verb: have
      - fact: quantity
        entity: world
        measure: "{item2}"
        measure_qualifier: "{item2.qualifier}"
        value: "item2"
        verb: have

  - id: arithmetic/existential-premise-total
    phase: read
    description: >
      "There are 160 toys altogether." — the totality-marked sibling of
      arithmetic/existential-premise-bare (mining candidate sum-constraint-
      relations): the identical "there VERB N ITEM" shape, but a REQUIRED
      trailing declared totality marker makes this a GROUP TOTAL across
      whichever entities the passage names, never an independent holding
      of the bare `world` scene-holder. `aggregate` also includes `average`,
      which is an operation but not a sum marker, so this rule uses the
      narrower lexicon sense `group_total_marker`. The optional preposition
      is likewise restricted to the declared "in total" collocation;
      arbitrary combinations such as "with combined" or "to total" are not
      premises. The bare rule's broader `absent: {cat: aggregate}` remains
      conservative.
    match:
      sentence:
        - {lit: there}
        - {slot: verb, cat: copula}
        - {slot: item, type: counted}
        - opt:
            - {slot: p, cat: group_total_preposition}
        - {slot: agg, cat: group_total_marker}
    where:
      - number_compatible: [item, verb]
      - slot_not_category: {slot: item, cat: existential_incompatible_noun}
      - bound_requires_category: {bound: p, slot: agg, cat: prepositional_group_total_marker}
    consumes: [item]
    emits:
      - fact: group_total
        measure: "{item}"
        value: "item"
        verb: have

  - id: arithmetic/group-total-of
    phase: read
    description: >
      "...a total of 160 toys" / "...a total of 35 floors" (mining
      candidate sum-constraint-relations) — a stated SUM across the
      entities the passage names, wherever in the sentence the framing
      falls: matching scans every starting position, so this fires
      identically for "Together they have a total of X", "A and B have
      been VERBing for a total of X", and "WHO will VERB a total of X"
      without needing to parse the varying subject/tense that precedes
      it — only the "a total of N ITEM" tail itself is the sum-constraint
      marker. Distinct from arithmetic/existential-premise-total's bare
      "there are N X <aggregate>" existential (no 'total of' framing at
      all, and the aggregate marker trails the noun rather than fronts
      it): the two match disjoint literal skeletons and never tie.
    match:
      sentence:
        - {lit: total}
        - {lit: of}
        - {slot: item, type: counted}
    consumes: [item]
    emits:
      - fact: group_total
        measure: "{item}"
        value: "item"
        verb: have

  - id: arithmetic/group-total-trailing
    phase: read
    description: >
      "Tom and Jerry have 29 apples together." / "They picked 274 apples
      total." (mining candidate group-total-phrasings) — a stated quantity
      followed by a TRAILING totality marker (the narrower
      `group_total_marker` sense — together/altogether/total/combined,
      packs/core-english/lexicon/core.yaml). A declared optional totality
      quantifier is compatible only with its declared marker ("all
      together"), just as a declared preposition is compatible only with its
      own marker ("in total"). These paired categories prevent arbitrary
      cross-products such as "all total" or "in combined". The complete
      phrase is a GROUP TOTAL across whichever entities the passage names,
      never one entity's own independent holding —
      exactly the reading arithmetic/existential-premise-bare's own
      `absent: {cat: aggregate}` guard refuses for the bare "there are N
      X" shape. Matching scans every starting position (mirrors
      arithmetic/group-total-of): only the "N ITEM <marker>" tail itself
      is the sum-constraint marker, so this fires regardless of the
      preceding subject/verb — "A and B have N X together", "WHO will
      VERB N X all together" match identically without needing to parse
      the varying subject/tense that precedes the tail. The matched
      item's noun unit is the SAME unit the sentence's own verb would
      otherwise bind as its dobj; consuming it here (pattern_consumed)
      suppresses learn.py's ordinary per-entity fold for this clause
      (`learn.py`: `consumed = verb.features.get("pattern_consumed") or
      dobj...`), so the stated number is read exactly once — as a group
      total, never ALSO as an independent holding (the double-count this
      brief's decline-safety analysis flags). Routes to the existing,
      unchanged synth/sum-constraint plugin (saturate.py) — no new fact
      kind, no new consumer, no new ask shape.
    match:
      sentence:
        - {slot: item, type: counted}
        - opt:
            - {slot: q, cat: group_total_quantifier}
        - opt:
            - {slot: p, cat: group_total_preposition}
        - {slot: agg, cat: group_total_marker}
    where:
      - bound_requires_category: {bound: q, slot: agg, cat: quantified_group_total_marker}
      - bound_requires_category: {bound: p, slot: agg, cat: prepositional_group_total_marker}
    consumes: [item]
    emits:
      - fact: group_total
        measure: "{item}"
        value: "item"
        verb: have

  - id: arithmetic/group-total-trailing-in-all
    phase: read
    description: >
      "There are 11 areas in all" / "A and B have 11 areas in all" — the
      conventional two-word total marker sibling of
      arithmetic/group-total-trailing. `all` is correctly quantifier-sensed,
      so it cannot belong to the aggregate-rooted `group_total_marker`
      category used by "in total" and bare "together". This literal grammar
      keeps the two senses honest while emitting the same unscoped GroupTotal.
      The counted item is consumed so the sentence cannot also become an
      independent holder quantity.
    match:
      sentence:
        - {slot: item, type: counted}
        - {lit: in}
        - {lit: all}
    consumes: [item]
    emits:
      - fact: group_total
        measure: "{item}"
        value: "item"
        verb: have

  - id: arithmetic/group-total-leading
    phase: read
    description: >
      "In total, they sold 120 oranges." (mining candidate group-total-
      phrasings) — the LEADING sibling of arithmetic/group-total-trailing:
      the same "in total" marker fronts the clause (comma skippable punct)
      instead of trailing it, ahead of the ordinary SUBJ VERB N ITEM
      skeleton. `who` binds any single subject token generically (`type:
      word` — a name, common noun, or pronoun, resolved or not) and its exact
      normalized identity is retained as the GroupTotal's optional `scope`.
      This distinguishes two explicitly named groups over the same measure
      without pretending a tail-only total has an owner. Requiring the real VERB
      and counted ITEM slots (not a generic skip) means the matched item
      is the sentence's own dobj, so capturing it here suppresses
      learn.py's per-entity fold for the identical double-count reason
      arithmetic/group-total-trailing documents — an ordinary single-
      holder reading and a group total can never both register for the
      same clause.
    match:
      sentence:
        - {lit: in, at_start: true}
        - {lit: total}
        - {slot: who, type: word}
        - {slot: verb, type: verb}
        - {slot: item, type: counted}
    where:
      - slot_not_category: {slot: who, cat: existential}
    consumes: [item]
    emits:
      - fact: group_total
        measure: "{item}"
        value: "item"
        scope: "{who}"
        verb: "{verb}"

  - id: arithmetic/group-total-leading-marker
    phase: read
    description: >
      "Together, they have 34 years." / "Combined, they weigh 98
      kilograms." (mining candidate sum-constraint-premise-surfaces) — the
      BARE-MARKER sibling of arithmetic/group-total-leading: that rule
      requires the specific two-word literal "in total" fronting the
      clause; a single fronting `aggregate` word ('together'/'combined'/
      'altogether'/'total' itself) never satisfied its literal 'in'+
      'total' skeleton and declined outright. Same "SUBJ VERB N ITEM"
      tail, same generic `who, type: word` bridge slot whose identity is
      retained as the emitted GroupTotal's optional `scope`, same
      double-count discipline: capturing the counted ITEM here suppresses
      learn.py's per-entity fold for this clause
      (arithmetic/group-total-leading's own comment). This rule's own
      `agg` is anchored to the sentence start. Without that structural
      boundary, a TRAILING marker in "...birds together and have 30 birds"
      could float into this rule as if `and` were the scoped subject. The
      two-word "In total" surface remains owned by its anchored sibling
      arithmetic/group-total-leading.
    match:
      sentence:
        - {slot: agg, cat: group_total_marker, at_start: true}
        - {slot: who, type: word}
        - {slot: verb, type: verb}
        - {slot: item, type: counted}
    where:
      - slot_not_category: {slot: who, cat: existential}
    consumes: [item]
    emits:
      - fact: group_total
        measure: "{item}"
        value: "item"
        scope: "{who}"
        verb: "{verb}"

  - id: arithmetic/group-total-leading-existential
    phase: read
    description: >
      "In total, there are 12 coins." — the existential sibling of
      arithmetic/group-total-leading. The scoped rule deliberately excludes
      existential subjects: 'there' introduces the existence of an unscoped
      collection and is not itself a group identity. Requiring the literal
      existential marker followed by an agreeing copula separates this
      construction from action clauses such as "there drops 2 coins", whose
      missing semantic subject must remain declined. The normalized holding
      verb gives the resulting unscoped GroupTotal the same semantics as
      other existential quantities without treating the surface copula as an
      event.
    match:
      sentence:
        - {lit: in, at_start: true}
        - {lit: total}
        - {lit: there}
        - {slot: verb, cat: copula}
        - {slot: item, type: counted}
    where:
      - same_number: [verb, item]
    consumes: [item]
    emits:
      - fact: group_total
        measure: "{item}"
        value: "item"
        verb: have

  - id: arithmetic/group-total-leading-marker-existential
    phase: read
    description: >
      "Altogether, there is 1 coin." — the bare-marker existential sibling
      of arithmetic/group-total-leading-marker. A leading aggregate marker
      plus literal existential 'there' and an agreeing copula states an
      unscoped collection total; it does not license 'there' as GroupTotal
      scope and does not admit arbitrary event verbs. The narrow
      `group_total_marker` sense excludes 'average': that word shares the
      broad `aggregate` sense for average asks, but "Average there is..." is
      not an English existential-total marker. The counted item is consumed
      for the same single-reading discipline as the scoped leading rules.
    match:
      sentence:
        - {slot: agg, cat: group_total_marker, at_start: true}
        - {lit: there}
        - {slot: verb, cat: copula}
        - {slot: item, type: counted}
    where:
      - same_number: [verb, item]
    consumes: [item]
    emits:
      - fact: group_total
        measure: "{item}"
        value: "item"
        verb: have

  - id: arithmetic/group-total-sum-of-age
    phase: read
    description: >
      "Rachel is 4 years older than Leah. If the sum of their ages is 34,
      how old is Rachel?" (mining candidate sum-constraint-premise-
      surfaces) — a COPULAR sum-of-ages constraint: none of the existing
      group-total-* rules read this shape at all (they all anchor on an
      `aggregate` marker trailing or fronting a stated quantity; here
      there is no `aggregate` word anywhere — 'sum' names the total, and
      the age noun and the value sit on OPPOSITE sides of the copula, "of
      their ages IS 34", never adjacent the way a counted noun would be).
      `noun, cat: age_noun` (a single-word category, packs/core-english/
      categories/core.yaml — 'age' only, never a bare 'age' measure key
      the age family elsewhere never matches) is what lets this rule emit
      the same DATA measure 'year' arithmetic/stated-age and ask/how-old-
      is already commit to, hardcoded exactly as those two rules already
      hardcode it (constitution rule 1: a single pack-owned data literal,
      not a Python word list). `n, type: number` binds the bare trailing
      value (no noun follows it here, unlike every sibling's `type:
      counted` item) — consuming it suppresses learn.py's own bare-count
      fold for this clause (learn.py's elided-measure-anchor branch, which
      would otherwise mis-anchor an AnchorQuantity to whichever noun its
      own subject-binding happens to pick), the identical double-count
      guard every sibling GroupTotal rule here already relies on.
    match:
      sentence:
        - {lit: the, consume_skipped: true}
        - {lit: sum}
        - {lit: of}
        - opt:
            - {slot: poss, cat: plural_possessive_determiner}
        - {slot: noun, cat: age_noun, number: plural}
        - {slot: verb, cat: copula, number: singular}
        - {slot: n, type: number}
    consumes: [n]
    emits:
      - fact: group_total
        measure: year
        value: n
        verb: have

  - id: arithmetic/group-total-of-age
    phase: read
    description: >
      "Amy, Jeremy, and Chris have a combined age of 132." / "their
      combined age is 132" (mining candidate sum-constraint-premise-
      surfaces) — an AGGREGATE-QUALIFIED dimension NP: arithmetic/group-
      total-of only reads "a total of N ITEM" (the literal word 'total',
      the counted noun TRAILING the number); here the aggregate word
      QUALIFIES the age noun itself, and the age noun FRONTS the number
      ("combined AGE of 132"), an entirely disjoint token order group-
      total-of's own skeleton cannot match. `agg, cat: group_total_marker`
      excludes `average`, which is not a sum. There is no "In total, ..."
      literal to collide with here: the position right before 'age' can
      never be confused with that other rule's own two-literal skeleton.
      `noun, cat: age_noun`
      (the same single-word category arithmetic/group-total-sum-of-age
      uses) resolves to the hardcoded DATA measure 'year' the age family
      already commits to everywhere. `n, type: number` also accepts an
      already-condensed "132 years" counted noun (its own `value_kind`
      stays 'count' after merging — the hardcoded 'year' measure below
      does not depend on capturing that trailing unit word at all).
    match:
      sentence:
        - {slot: agg, cat: group_total_marker}
        - {slot: noun, cat: age_noun}
        - {lit: of}
        - {slot: n, type: number}
    consumes: [n]
    emits:
      - fact: group_total
        measure: year
        value: n
        verb: have

  - id: arithmetic/fraction-of-pool
    phase: read
    description: >
      "Tom ate half of the sandwiches" / "spent 40% of the money" — a
      fraction of the DEFINITE pool. Emits a FractionQuantity the synthesizer
      resolves against the DEFINITE POOL — the signed sum of the measure's
      prior-sentence facts, which prior fractions deplete. That makes
      "of the remaining pages" correct here too: the current pool IS the
      remainder. A part of one finite pool cannot exceed the whole; improper
      fractions remain available to unbounded ratio and comparison rules.
      Unresolved ones veto commits.
    match:
      sentence:
        - {slot: who, type: name}
        - {slot: verb, type: verb, finite_form: true}
        - {slot: f, type: fraction, fraction_within_whole: true}
        - {lit: of}
        - {lit: the, consume_skipped: true}
        - {slot: item, type: noun}
    where:
      - number_compatible: [who, verb]
      - verb_role_compatible: {verb: verb, roles: [item], verb_cat: animate_object_verb, role_cat: quantity_event_participant}
    consumes: [f]
    emits:
      - fact: fraction_quantity
        entity: "{who}"
        measure: "{item}"
        fraction: "f"
        verb: "{verb}"

  - id: arithmetic/fraction-of-pronoun
    phase: read
    description: >
      "She spent one-half OF IT" — the pronoun DENOTES THE POOL itself; the
      synthesizer resolves it by the unique-measure principle (one measure
      in play, else unresolved and the guard declines).

      `cat: pool_pronoun` (not `type: pronoun`) is load-bearing, and the
      category's own notes carry the measurement. A POSSESSIVE determiner
      senses as 'pronoun' too but is a DIFFERENT CONSTRUCTION: in "Ben gave
      half of HIS marbles", 'his' does not denote the pool — it modifies
      'marbles' and names a possessor whose holdings are the intended base.
      Ungated, this rule matched it and the synth sized `half` against the
      whole pool, so with two holders Ben gave away half of Ben's 18 PLUS
      John's 17. A possessive fraction needs a rule that BINDS THE POSSESSOR;
      until one exists the fraction stays unconsumed and the value-accounting
      guard declines, which is the honest outcome and costs nothing (all 78
      GSM8K dev-train and 76 dev-holdout possessive items already declined).
    match:
      sentence:
        - {slot: who, type: name}
        - {slot: verb, type: verb}
        - {slot: f, type: fraction, fraction_within_whole: true}
        - {lit: of}
        - {slot: ref, cat: pool_pronoun}
    where:
      - number_compatible: [who, verb]
    consumes: [f]
    emits:
      - fact: fraction_quantity
        entity: "{who}"
        measure: "{ref}"
        fraction: "f"
        verb: "{verb}"

  - id: arithmetic/fraction-of-remnant
    phase: read
    description: >
      "put half of THE REST in savings" — the remnant word names no measure;
      the synthesizer's unique-measure principle supplies the pool. The
      fraction is a part of that one finite remainder and therefore cannot
      exceed the whole.
    match:
      sentence:
        - {slot: who, type: name}
        - {slot: verb, type: verb}
        - {slot: f, type: fraction, fraction_within_whole: true}
        - {lit: of}
        - {slot: r, cat: remnant}
    where:
      - number_compatible: [who, verb]
    consumes: [f]
    emits:
      - fact: fraction_quantity
        entity: "{who}"
        measure: "{r}"
        fraction: "f"
        verb: "{verb}"

  - id: arithmetic/rest-of-pool
    phase: read
    description: >
      "He picked THE REST" — the remainder of the unique pool after its
      events. Emits a RestQuantity; the synthesizer supplies the value or
      the unresolved-derivation guard declines. Ordinary subject/verb
      agreement applies, and the narrow `non_quantity_object_verb` category
      excludes predicates that cannot take this quantitative object.
    match:
      sentence:
        - {slot: who, type: name}
        - {slot: verb, type: verb}
        - {slot: r, cat: remnant}
    where:
      - number_compatible: [who, verb]
      - slot_not_category: {slot: verb, cat: non_quantity_object_verb}
    emits:
      - fact: rest_quantity
        entity: "{who}"
        verb: "{verb}"

  - id: arithmetic/partition-attribute
    phase: read
    description: >
      "Ten of THEM are yellow" — N members of a prior collection share an
      attribute (a PartitionQuantity). The plural pronoun denotes the
      collection; the partition synthesizer resolves it against the unique
      prior collection fact (ambiguous or absent context leaves it
      unresolved, and the unresolved-derivation guard declines).
    match:
      sentence:
        - {slot: n, type: number}
        - {lit: of}
        - {slot: coll, cat: plural_object_pronoun}
        - {slot: verb, cat: copula}
        - {slot: attr, type: adjective}
    where:
      - same_number: [n, verb]
    consumes: [n]
    emits:
      - fact: partition_quantity
        collection: "{coll}"
        attribute: "{attr}"
        value: "n"
        verb: "{verb}"

  - id: arithmetic/partition-membership
    phase: read
    description: >
      "8 of THEM are dogs" — a MEMBERSHIP-style partition: N members of a
      prior collection ARE a plural common noun, not an adjective (the
      dominant real-world phrasing of a partition). Resolved identically to
      partition-attribute (the same synthesizer resolves the plural pronoun
      against the unique prior collection); a companion synth step then
      emits a Quantity for the named subset noun, so the general
      entity-less "how many NOUN are there" ask answers it directly — no
      bespoke consumer needed.
    match:
      sentence:
        - {slot: n, type: number}
        - {lit: of}
        - {slot: coll, cat: plural_object_pronoun}
        - {slot: verb, cat: copula}
        - {slot: attr, type: plural}
    where:
      - same_number: [n, verb, attr]
    consumes: [n]
    emits:
      - fact: partition_quantity
        collection: "{coll}"
        attribute: "{attr}"
        value: "n"
        verb: "{verb}"
        kind: membership

  - id: arithmetic/partition-attribute-fraction
    phase: read
    description: >
      "25% of THEM are red" / "Half of THEM are red" — the FRACTIONAL
      counterpart of partition-attribute: a stated PROPORTION (not a
      cardinal) of a prior collection shares an attribute. Resolved
      identically to partition-attribute (the plural pronoun resolves
      against the unique prior collection); the synthesizer additionally
      sizes the fraction against that collection's own total before
      committing, so an unresolvable total (ambiguous or absent pool)
      leaves it unresolved exactly like fraction-of-pool.
    match:
      sentence:
        - {slot: f, type: fraction}
        - {lit: of}
        - {slot: coll, cat: plural_object_pronoun}
        - {slot: verb, cat: plural_copula}
        - {slot: attr, type: adjective}
    consumes: [f]
    emits:
      - fact: partition_quantity
        collection: "{coll}"
        attribute: "{attr}"
        value: "f"
        verb: "{verb}"
        is_fraction: true

  - id: arithmetic/partition-membership-fraction
    phase: read
    description: >
      "25% of THEM are dogs" — the FRACTIONAL counterpart of
      partition-membership: a stated PROPORTION of a prior collection ARE a
      plural common noun, not an adjective. Resolved identically to
      partition-membership once the fraction sizes against the collection's
      total (see partition-attribute-fraction); the same companion
      membership synth then emits a Quantity for the named subset noun, so
      the general entity-less "how many NOUN are there" ask answers it
      directly — no bespoke consumer needed.
    match:
      sentence:
        - {slot: f, type: fraction}
        - {lit: of}
        - {slot: coll, cat: plural_object_pronoun}
        - {slot: verb, cat: plural_copula}
        - {slot: attr, type: plural}
    consumes: [f]
    emits:
      - fact: partition_quantity
        collection: "{coll}"
        attribute: "{attr}"
        value: "f"
        verb: "{verb}"
        kind: membership
        is_fraction: true

  - id: arithmetic/partition-attribute-of-noun
    phase: read
    description: >
      "6 of the marbles are red" — the definite-NP partition surface: the
      collection is a plural common noun named directly. The definite
      article is claimed explicitly: automatic article skipping must not
      turn the ungrammatical "6 of marbles" into this construction. Since
      the noun IS the
      measure, there is nothing to resolve — the partition synthesizer's
      "already names a real measure" branch leaves it as-is, and the
      unresolved-derivation guard's structural known-measure check (not a
      rule-identity check) recognizes it as resolved directly. Same
      PartitionQuantity fact and partition-complement consumer as
      partition-attribute, reused unchanged. The adjective must additionally
      be licensed for the named noun by a project-declared compatibility
      category pair; this prevents a grammatical token sequence from making
      an unsupported semantic commitment.
    match:
      sentence:
        - {slot: n, type: number}
        - {lit: of}
        - {lit: the, consume_skipped: true}
        - {slot: coll, type: plural}
        - {slot: verb, cat: copula}
        - {slot: attr, type: adjective}
    where:
      - same_number: [n, verb]
      - attribute_compatible: {attribute: attr, noun: coll}
    consumes: [n]
    emits:
      - fact: partition_quantity
        collection: "{coll}"
        attribute: "{attr}"
        value: "n"
        verb: "{verb}"

  - id: arithmetic/partition-membership-of-noun
    phase: read
    description: >
      "8 of the animals are dogs" — the definite-NP counterpart of
      partition-membership: the collection is a named plural noun, the
      attribute a distinct plural common noun (membership, not a
      modifier). Same PartitionQuantity fact (kind: membership); the
      companion membership synth step's gate also accepts a collection
      that already names a known measure directly (not only one resolved
      via synth/partition), a structural widening shared with the pronoun
      form, not a per-rule special case.
      `verb, cat: copula` (not the general `verb` type — mining candidate
      modal-spend-measure-price): a membership partition is always a
      COPULAR predication ("ARE dogs"), never any other verb; the
      unrestricted `type: verb` previously let this rule swallow an
      unrelated priced-measure sentence sharing the same surface token
      order ("4 pounds of coffee beans COST 10 dollars each" — 'cost' is a
      verb too), stealing it from learn.py's price-verb emission before it
      ever ran and producing a bogus PartitionQuantity(collection='bean')
      instead of any Price fact. Every real membership-partition instance
      already uses a copula (is/are/was/were), so this is a pure
      narrowing with no coverage loss.
    match:
      sentence:
        - {slot: n, type: number}
        - {lit: of}
        - {lit: the, consume_skipped: true}
        - {slot: coll, type: plural}
        - {slot: verb, cat: copula}
        - {slot: attr, type: plural}
    where:
      - same_number: [n, verb, attr]
    consumes: [n]
    emits:
      - fact: partition_quantity
        collection: "{coll}"
        attribute: "{attr}"
        value: "n"
        verb: "{verb}"
        kind: membership

  - id: arithmetic/partition-rest-attribute
    phase: read
    description: >
      "The REST are grey" (mining candidate rest-partitions) — the EXACT
      COMPLEMENT of every OTHER partition already stated for the same
      collection. `partition_remnant` deliberately licenses definite
      "the rest" here, not singular "remainder" or an article-free noun.
      `collection` starts as the remnant placeholder,
      never a real measure, resolved by the partition synthesizer exactly
      as the pronoun placeholder is (the unique-pool-in-play principle) —
      but only once every earlier partition of that collection has itself
      resolved to a real count, at which point the value becomes the
      collection's own total as of this sentence minus their signed sum,
      re-emitted with `is_rest` cleared. `verb, cat: plural_copula`: a rest
      partition is a plural copular predication (are/were), never a
      possession or event verb. That is narrower than
      partition-attribute's cardinal pronoun form on purpose, since "the
      rest" (unlike "N of them") could otherwise sit in front of an
      unrelated priced/rated verb.

      The optional "of the ITEM" span ("the rest OF THE CATS are grey") is
      consumed, including its required definite article, but its noun is
      deliberately never bound into `collection` — the collection stays the
      bare remnant-word placeholder either way, resolved through the SAME
      unique-pool-in-play synth step as the bare surface. A named
      `collection` (the -of-noun surface partition-
      attribute-of-noun uses for the CARDINAL/stated form) would give this
      premise fact the exact same key as its own resolved-value re-
      emission (collection/attribute/verb, unchanged by sizing) and
      self-collide the moment the value changed from the 0 placeholder to
      the real count — is_fraction sizing has the identical constraint,
      which is why it too only ever fires from a placeholder collection.
      When that optional noun is present, `attribute_compatible` requires a
      declared adjective/noun pairing. With no explicit noun the predicate is
      neutral and the discourse-backed "the rest" reading remains available.
    match:
      sentence:
        - {slot: r, cat: partition_remnant, referential: true}
        - opt:
            - {lit: of}
            - {lit: the, consume_skipped: true}
            - {slot: item, type: plural}
        - {slot: verb, cat: plural_copula}
        - {slot: attr, type: adjective}
    where:
      - attribute_compatible: {attribute: attr, noun: item}
    emits:
      - fact: partition_quantity
        collection: "{r}"
        attribute: "{attr}"
        value: "0"
        verb: "{verb}"
        is_rest: true

  - id: arithmetic/partition-rest-membership
    phase: read
    description: >
      "The REST are dogs" (mining candidate rest-partitions) — the
      MEMBERSHIP-style counterpart of partition-rest-attribute: the rest
      names a plural common noun subset, not an adjective. Resolved
      identically (see partition-rest-attribute); the existing companion
      membership synth (`synth/partition-membership-quantity`) then emits a
      Quantity for the named subset noun once the collection resolves, so
      the general entity-less "how many NOUN are there" ask answers it
      directly — no bespoke consumer needed, exactly like
      partition-membership. The same optional, deliberately-unbound "of the
      ITEM" span as partition-rest-attribute (see its description for why).
      Declared non-class predicates such as temporal `times` are refused
      locally without removing that noun from explicit frequency rules.
    match:
      sentence:
        - {slot: r, cat: partition_remnant, referential: true}
        - opt:
            - {lit: of}
            - {lit: the, consume_skipped: true}
            - {slot: item, type: plural}
        - {slot: verb, cat: plural_copula}
        - {slot: attr, type: plural}
    where:
      - bound_requires_category: {bound: item, slot: item, cat: membership_collection_noun}
      - bound_requires_category: {bound: item, slot: attr, cat: membership_member_noun}
      - slot_not_category: {slot: attr, cat: membership_predicate_incompatible_noun}
    emits:
      - fact: partition_quantity
        collection: "{r}"
        attribute: "{attr}"
        value: "0"
        verb: "{verb}"
        kind: membership
        is_rest: true

  - id: arithmetic/ratio-split-of-to
    phase: read
    description: >
      "the ratio of BOYS to GIRLS is 3:2" (mining candidate ratio-split-
      premises) — a collection split by a STATED two-part ratio between
      two labels. Emits a RatioQuantity per label (`fraction` = each
      label's own share of the unnamed collection, m/(m+n) and n/(m+n));
      the ratio synthesizer (saturate.py's `_ratio_split_synth`) resolves
      the collection anchor. That synth deliberately does NOT reuse
      `_pool_before`/`_partition_synth`: a ratio clause typically shares
      its OWN sentence with its anchor ("There are 100 students in class
      AND the ratio of boys to girls is 3:2" — one sentence, joined by
      'and'), unlike the fraction/partition pool machinery, which only
      ever looks at STRICTLY PRIOR sentences (a load-bearing invariant
      elsewhere) — widening that shared scan to also look at the CURRENT
      sentence would be exactly the kind of global tightening
      docs/HANDOFF.md's `_is_rate`/`_price_each_value` lesson warns
      against, so this candidate gives RatioQuantity its own fact kind
      and its own synth instead, leaving every existing pool caller
      byte-for-byte untouched. `verb, cat: state` — a ratio is always a
      stated copular fact ("is"/"was" 3:2), never any other verb.

      No leading 'the'/'a' token: SKIPPABLE_SENSES already auto-skips any
      article before 'ratio', so both "THE ratio of..." and "A ratio
      of..." match identically, same convention every other rule in this
      file relies on instead of hardcoding an article literal.

      The colon in "3:2" needs no explicit match token either: tokenize.py
      already splits it into its own punctuation unit (senses.py's PUNCT
      set marks ':' as sense 'punct'), which SKIPPABLE_SENSES auto-skips
      between the two adjacent number slots — checked first, per this
      candidate's own brief, before touching the tokenizer at all; no
      kernel touch was needed there.
    match:
      sentence:
        - {lit: ratio}
        - {lit: of}
        - {slot: a, type: plural}
        - {lit: to}
        - {slot: b, type: plural}
        - {slot: verb, cat: state}
        - {slot: m, type: number}
        - {slot: n, type: number}
    emits:
      - fact: ratio_quantity
        attribute: "{a}"
        fraction: "m / (m + n)"
        verb: "{verb}"
      - fact: ratio_quantity
        attribute: "{b}"
        fraction: "n / (m + n)"
        verb: "{verb}"

  - id: arithmetic/stated-age-at-year
    phase: read
    generation: premise
    description: >
      "The teacher was 20 years old in 1999" states an age at one absolute
      calendar-year coordinate. The entity must be a complete reference and
      compatible with the declared age measure. The final standalone number
      is kept as the coordinate rather than discarded or turned into an
      ordinary timeless Quantity. This licenses elapsed-year projection only
      for the dedicated dated-age fact; other quantities do not inherit a
      trend from appearing beside a year.
    match:
      sentence:
        - {slot: who, type: entity, referential: true, bare_reference_category: bare_entity_reference}
        - {slot: verb, cat: copula}
        - {slot: n, cat: age_measure, counted: true}
        - {lit: old}
        - {lit: in}
        - {slot: calendar_year, type: number, standalone: true, integer: true}
    where:
      - number_compatible: [who, verb]
      - measure_holder_compatible: {measure: n, holders: [who], allow_proper_name: true}
    satisfies: {calendar_year: [quantifies]}
    consumes: [n, calendar_year]
    emits:
      - fact: age_at_year
        entity: "{who}"
        measure: "{n}"
        value: n
        year: calendar_year
        verb: "{verb}"
        owner: "{who.owner}"
        qualifier: "{who.qualifier}"
        label: "{who.label}"

  - id: arithmetic/stated-age
    phase: read
    description: >
      "Sara is 4 years old" — the copula age predicate: a stated Quantity
      fact scoped to the DATA measure 'year' (the copula + a counted
      `age_measure` noun + the literal 'old' is the grammatical skeleton;
      both the copula and permitted unit remain declared in pack data). This
      lets the general single-entity consumer answer "how old is WHO"
      directly, and the already-shipped anchored-relation-postfix
      synthesizer ("X is N years older/younger than Y") chain through it —
      no new consumer, no date arithmetic, no 'in N years' futures.
    match:
      sentence:
        - {slot: who, type: name}
        - {slot: verb, cat: copula}
        - {slot: n, cat: age_measure, counted: true}
        - {lit: old}
    where:
      - same_number: [who, verb]
    consumes: [n]
    emits:
      - fact: quantity
        entity: "{who}"
        measure: year
        value: n
        verb: "{verb}"

  - id: arithmetic/temporal-offset-age-future
    phase: read
    description: >
      "In 3 years, Tessa will be 21 years old" (mining candidate
      temporal-offset-age-premises) — a FUTURE temporal-offset age
      premise: the entity's age at a point N years from now, not a direct
      current holding. Emits the SAME Quantity shape arithmetic/stated-age
      does (measure 'year', a state — no `occurrence`), just computed as
      stated-age MINUS the offset, so ask/how-old-is and the relation
      synthesizers chain through it completely unchanged — no new fact
      kind, no new consumer, no date arithmetic beyond one subtraction.
      `{lit: be}` (not `cat: state`) is the grammatical skeleton here:
      English always uses the bare infinitive after a modal ("will be"),
      never 'is'/'was' — this is structure, not a lexicon fact, so it
      needs no category widening. Decline-safety: `absent: relational_
      marker`/`multiplier_marker` (increment 57's clause-boundary
      categories) aborts emission the instant the SAME sentence carries a
      comparative or ratio marker ("will be HALF of Ernesto's age", "will
      be TWICE as old") — those clauses stay for the relation/ratio
      synthesizers to resolve (this pattern's own literal 'old'-anchored,
      plain-number shape never matches them anyway, since a fraction/
      multiplier word never presents as a `type: counted` unit — but the
      explicit gate documents the boundary and blocks the paraphrase-of-
      the-same-clause case where a plain number ALSO happens to appear
      alongside a relational word). Both consumed numbers (the offset and
      the stated future age) are the same accounting story arithmetic/
      stated-age and arithmetic/anchored-relation already use: `consumes`
      marks the slot units read directly, independent of the emitted
      fact's own fields.
    match:
      sentence:
        - {lit: in}
        - {slot: n, cat: age_measure, counted: true}
        - {slot: who, type: name}
        - {slot: aux, type: future_modal}
        - {lit: be}
        - {slot: m, cat: age_measure, counted: true}
        - {lit: old}
    where:
      - absent: {cat: relational_marker}
      - absent: {cat: multiplier_marker}
    consumes: [n, m]
    emits:
      - fact: quantity
        entity: "{who}"
        measure: year
        value: "m - n"
        verb: be

  - id: arithmetic/temporal-offset-age-past
    phase: read
    description: >
      "Five years ago, Tessa was 21 years old" (mining candidate
      temporal-offset-age-premises) — the mirrored PAST form of
      arithmetic/temporal-offset-age-future: the entity's age N years ago,
      resolved to its current age by ADDING the offset (the past form
      naturally uses a past copula — 'was'/'were' — gated by
      `cat: past_copula`, no bare-infinitive skeleton needed here). Same
      Quantity shape, same decline-safety gate, same consumes-based value
      accounting as the future sibling above.
    match:
      sentence:
        - {slot: n, cat: age_measure, counted: true}
        - {lit: ago}
        - {slot: who, type: name}
        - {slot: verb, cat: past_copula}
        - {slot: m, cat: age_measure, counted: true}
        - {lit: old}
    where:
      - number_compatible: [who, verb]
      - absent: {cat: relational_marker}
      - absent: {cat: multiplier_marker}
    consumes: [n, m]
    emits:
      - fact: quantity
        entity: "{who}"
        measure: year
        value: "m + n"
        verb: "{verb}"

  - id: arithmetic/temporal-offset-age-future-intensified
    phase: read
    description: >
      mining candidate relation-standard-frames: "In eight MORE years,
      Tessa will be 40 years old" — the intensifier-tolerant sibling of
      arithmetic/temporal-offset-age-future: an INTENSIFIER word
      ('more' — `cat: count_intensifier`, packs/core-english/categories/
      core.yaml — deliberately NOT the same category as 'more_dir'/
      'delta', see its own note) wedged between the bare count and its
      noun blocks condense.py's ordinary count+noun merge (`_count_pass`
      only merges ADJACENT units), so the base rule's `n, type: counted`
      slot — which requires that merge to have already happened — can
      never match "eight more years" at all; PROVEN on unmodified main:
      "in eight years" commits 64.0, "in eight more years" declines
      outright. Rather than widen `_count_pass` itself (a SHARED
      condense-time function every "N NOUN" merge in the pack depends on —
      the HANDOFF invariant against globally widening shared scan
      functions for one caller), this is a SEPARATE sibling rule matching
      the UNMERGED three-token span directly (`n, type: number` + the
      intensifier + `yr, type: noun`, instead of one `type: counted`
      slot) — so "5 MORE apples THAN Tom" (the ordinary delta-relation
      reading of the same word 'more') is completely untouched: that
      shape is read by a DIFFERENT rule family entirely (anchored-
      relation-postfix and friends), never this one, and never will be,
      since this rule's own literal skeleton has no 'than' anywhere.
      `yr` is consumed but not read by the emitted fact (the measure is
      hardcoded 'year' exactly like the base rule's own `m`/`n` — neither
      rule's emitted Quantity depends on which noun word actually
      followed the count). Same decline-safety gates and same Quantity
      shape as the base rule; `consumes: [n, yr, m]` mirrors its own
      `consumes: [n, m]` one slot wider, for the extra unmerged noun.
    match:
      sentence:
        - {lit: in}
        - {slot: n, type: number}
        - {slot: mod, cat: count_intensifier}
        - {slot: yr, cat: age_measure}
        - {slot: who, type: name}
        - {slot: aux, type: future_modal}
        - {lit: be}
        - {slot: m, cat: age_measure, counted: true}
        - {lit: old}
    where:
      - same_number: [n, yr]
      - absent: {cat: relational_marker}
      - absent: {cat: multiplier_marker}
    consumes: [n, yr, m]
    emits:
      - fact: quantity
        entity: "{who}"
        measure: year
        value: "m - n"
        verb: be

  - id: arithmetic/goal-desire-quantity
    phase: read
    description: >
      "Lena wants to collect 30 stamps" — a DESIRE verb ('want', a category
      this pack gates on so 'wish'/etc admit the same way as mined vocabulary
      grows) plus an infinitive VERB introduces a stated GOAL quantity, never
      an event: a wanted purchase is not a purchase (the increment-14 kirsty
      lesson generalized). Emits a Goal fact; the deficit consumer resolves
      it against the entity's single current holding of the same measure.
    match:
      sentence:
        - {slot: who, type: name}
        - {slot: want, cat: finite_desire, finite_form: true}
        - {lit: to}
        - {slot: verb, type: verb, bare_form: true}
        - {slot: item, type: counted}
    where:
      - number_compatible: [who, want]
    consumes: [item]
    emits:
      - fact: goal
        entity: "{who}"
        measure: "{item}"
        value: "item"
        verb: "{want}"

  - id: arithmetic/goal-need-quantity
    phase: read
    description: >
      "Tom needs 30 apples" — a stated NEED ('need_premise', a category
      untagged for polarity like 'desire' — a needed quantity is not a
      receipt) directly followed by a counted item is a stated GOAL,
      never a holding/event: the direct-object counterpart to
      goal-desire-quantity's "wants to VERB N X" infinitive form (no
      infinitive here — 'need' takes the item directly). Emits the same
      Goal fact the existing goal-deficit consumer already resolves against
      the entity's single current holding of the measure.
    match:
      sentence:
        - {slot: who, type: name}
        - {slot: need, cat: need_premise}
        - {slot: item, type: counted}
    where:
      - number_compatible: [who, need]
    consumes: [item]
    emits:
      - fact: goal
        entity: "{who}"
        measure: "{item}"
        value: "item"
        verb: "{need}"

  - id: arithmetic/goal-need-comparative-quantity
    phase: read
    description: >
      "Fia needs 20 fewer pencils than Cato" — a comparative stated NEED.
      This is not the ordinary holdings/event relation: `need_premise` keeps
      the subject quantity goal-scoped, while the explicit count-agreeing
      measure, count-only direction, and named standard state the relative
      target. The standalone count and noun share declared grammatical
      number, so `1 fewer shopper` and `2 fewer shoppers` use the same rule
      without admitting either disagreement.
      It is deliberately separate from goal-need-quantity's absolute counted
      object and from anchored-relation, whose quantitative-object verb guard
      correctly excludes need.
    match:
      sentence:
        - {slot: who, type: name}
        - {slot: need, cat: need_premise}
        - {slot: n, type: number, standalone: true}
        - {slot: dir, cat: count_quantity_delta}
        - {slot: item, cat: noun}
        - {lit: than}
        - {slot: std, type: name}
    where:
      - number_compatible: [who, need]
      - same_number: [n, item]
      - distinct: [who, std]
      - slot_not_category: {slot: item, cat: many_incompatible_noun}
    consumes: [n]
    emits:
      - fact: relation
        subject: "{who}"
        standard: "{std}"
        measure: "{item}"
        factor: 1.0
        offset: "n * sign(dir)"
        verb: "{need}"

  - id: arithmetic/extraposed-duration-rate
    phase: read
    description: >
      "It takes her 5 minutes to paint a lily" (mining candidate
      extraposed-duration-rates) — the extraposed-infinitive duration
      idiom as a PREMISE, stating a COMPOUND rate exactly like
      `_compound_rate_span` in learn.py ("reads 8 pages in 20 minutes"),
      just SVO-inverted: the elapsed span comes before the infinitive
      clause naming the counted item, so value = item/span with
      numerator/denominator preserved for value-accounting exactly as
      the SVO compound-rate branch does (Rate's docstring, model.py).
      The 'it'/'to' literals are grammatical skeleton — the SAME
      extraposed-infinitive construction ask/how-long-take-span's own
      comment already documents as structure, not lexicon. The verb is
      gated on the narrow `duration_verb` category — declared in
      packs/core-english/categories/core.yaml (parent: verb, no members
      there, since 'take' is a difg-mined-only lexicon entry), membered
      in packs/difg-mined/categories/semantic.yaml, the SAME
      declared-in-core/membered-in-mined split 'negation'/'future_modal'
      already use, so a core-english-only registry still compiles this
      rule — rather than a literal: unlike the ask side (always the bare
      infinitive after a modal — one literal fold), a declarative
      premise inflects for tense (takes/took), so the category names
      both inflections directly — mirrors the
      spend_verb/price_verb/wage_verb narrow-gate precedent.

      `consumes: [span, item]` marks the two counted slots read directly
      (independent of the emitted fact's own fields — the same
      discipline arithmetic/temporal-offset-age-future documents).
      Because `verb` and `item` are inside this rule's OWN matched span,
      they become `pattern_consumed` (document.py round 0), which makes
      learn.py's general SVO fold skip the infinitive clause entirely
      (a pattern_consumed verb or dobj is never re-folded) — so it never
      ALSO folds as a bare Quantity holding on the entity (today's
      behavior, and a fold CONFLICT the instant more than one such
      clause is conjoined in one sentence, since they collide on the
      same signed-quantity key). Never a holding — a compound rate is
      not a balance (the increment-58 invariant, verbatim).

      Infrastructure only: the existing rate-span-inverse consumer
      (answer.py) already resolves the inverse span ask the instant a
      matching Rate exists (verified: "Dev can wash 4 windows in 10
      minutes. How many minutes will it take Dev to wash 64 windows?"
      commits 160.0 today) — this rule only supplies the missing Rate
      for the PREMISE side of the idiom. 0 SOLVED is expected from this
      increment alone; the payoff is a separate widening of the
      how-long/how-many-timeunit-take-span asks' `item` slot and a
      conjoined-list consumer sum, named in this candidate's `unblocks`.
    match:
      sentence:
        - {lit: it}
        - {slot: v, cat: duration_verb}
        - {slot: who, type: entity, referential: true, bare_reference_category: bare_entity_reference}
        - {slot: span, cat: duration_measure, counted: true}
        - {lit: to}
        - {slot: verb, type: verb, bare_form: true}
        - {slot: item, type: counted}
    where:
      # The intervening entity controls the infinitive: in "It takes the
      # teacher 5 minutes to receive 4 parcels", the teacher is the receiver.
      # Quantity-changing verbs therefore require a declared plausible event
      # participant. Other infinitives keep their existing entity breadth.
      - verb_role_compatible: {verb: verb, roles: [who], verb_cat: quantity_event_verb, role_cat: quantity_event_participant}
    consumes: [span, item]
    emits:
      - fact: rate
        entity: "{who}"
        measure: "{item}"
        per: "{span}"
        value: "item / span"
        verb: "{verb}"
        numerator: "{item.value}"
        denominator: "{span.value}"

  - id: arithmetic/periodic-rate-every-span
    phase: read
    description: >
      "A wheel makes 6 turns every 30 seconds" (mining candidate
      rate-every-span-asks) — a PERIODIC rate premise: the SVO-direct
      twin of the compound-rate fold already read for "reads 8 pages in
      20 minutes" (`_compound_rate_span`, learn.py), just marked with a
      definite frequency quantifier ('every') instead of the
      `span_preposition` category ('in'). The dedicated
      `frequency_quantifier` class excludes existential/amount quantifiers
      such as `some`, while `duration_measure, counted: true` requires an
      explicit denominator such as "6 years" rather than an unrelated
      counted object. Emits the SAME Rate fact shape as
      arithmetic/extraposed-duration-rate above (a COMPOUND rate,
      numerator/denominator preserved for value-accounting), read by the
      existing rate-span/rate-span-inverse consumers unchanged.

      Fixes a LATENT PRECISION hazard, not only a coverage gap: today
      this exact sentence shape never satisfies `_compound_rate_span`
      (whose forward scan requires a `preposition`-sense word, and
      'every' is sensed `quantifier`), so the general SVO fold instead
      reads the dobj as a bare Quantity (entity=wheel, measure=turns,
      value=6) and SEPARATELY reads the "every 30 seconds" span as a
      second, unrelated Quantity (measure=seconds, value=30) — two junk
      facts in the store instead of one Rate. Because this rule's own
      match span covers `verb` and `item` (and `span`), ALL of them are
      marked `pattern_consumed` at document.py round 0, and learn.py's
      general fold explicitly skips any verb whose dobj is
      `pattern_consumed` (the same short-circuit arithmetic/extraposed-
      duration-rate already relies on for its own infinitive clause) —
      so the moment this rule matches, both junk Quantities disappear
      and only the Rate fact remains. A sentence that does NOT match
      this shape (no quantifier immediately after the counted item, or
      no counted noun immediately after the quantifier) is completely
      unaffected — the general fold runs exactly as before.

      `consumes: [item, span]` documents the two directly-read counted
      slots for value-accounting, mirroring arithmetic/extraposed-
      duration-rate's own convention (the field itself is informational;
      the actual pattern_consumed marking comes from the match span).

      `opt: [{slot: aux, type: modal}]` between `who` and `verb`: a
      CAPACITY-marked premise ("Priya CAN produce 8 pages every 4
      minutes") states the same periodic rate with a modal auxiliary
      between subject and verb — the general SVO fold already binds
      subject/dobj through this via OBLIGATIONS regardless of the
      intervening token (learn.py's `_bound` reads the dependency graph,
      not surface adjacency), but this rule matches raw TOKEN sequence,
      so without the optional slot a modal premise fails to match at all
      and falls through to the same junk distributive-multiply reading
      this rule exists to subsume. When that optional modal binds,
      `bound_requires_form` requires the following verb's bare form; without
      a modal, ordinary finite SVO agreement remains valid. The auxiliary
      binds nothing downstream (never referenced in `emits`) — it exists so
      the token is consumed when present.
    match:
      sentence:
        - {slot: who, type: entity, common_noun_cat: quantity_holder, referential: true, bare_reference_category: bare_entity_reference}
        - opt:
            - {slot: aux, type: modal}
        - {slot: verb, type: verb, finite_form: true}
        - {slot: item, type: counted}
        - {slot: freq, cat: frequency_quantifier}
        - {slot: span, cat: duration_measure, counted: true}
    where:
      - bound_requires_form: {bound: aux, slot: verb, form: bare}
      - verb_role_compatible: {verb: verb, roles: [who], verb_cat: quantity_event_verb, role_cat: quantity_event_participant}
      - slot_not_category: {slot: who, cat: non_quantity_holder}
    consumes: [item, span]
    emits:
      - fact: rate
        entity: "{who}"
        measure: "{item}"
        per: "{span}"
        value: "item / span"
        verb: "{verb}"
        numerator: "{item.value}"
        denominator: "{span.value}"

  - id: arithmetic/discount-percent-off
    phase: read
    description: >
      mining candidate discounted-purchase-totals: "N% off" ("50% off",
      "on sale for 50% off", "10% off all purchases") — a stated PERCENT
      reduction on a priced purchase, scope=total (the bare/default
      reading: applies once to the summed purchase total). Emits a
      Discount fact the purchase-total consumer (answer.py's
      `_purchase_total`) applies to its Σ price × qty total before
      committing — see that function and model.Discount for the full
      mechanism and the decline-safety discipline around more than one
      stated discount. `type: percent` (patterns.py) gates on the SAME
      fraction value_kind every percent relation rule already reads,
      restricted to the `percent` feature numbers.py sets only for "%"/
      "percent" tokens — a bare fraction WORD ("half off") never matches
      this slot type, so this rule cannot collide with the existing
      relation-standard machinery (which reads plain fractions under a
      completely different trailing literal: "more"/"fewer"/"as many as",
      never "off"/"discount").
    match:
      sentence:
        - {slot: pct, type: percent}
        - {lit: off}
    consumes: [pct]
    emits:
      - fact: discount
        value: "pct"
        percent: true
        scope: total

  - id: arithmetic/discount-percent-noun
    phase: read
    description: >
      mining candidate discounted-purchase-totals: "gets a 15% discount" /
      "a 15% discount" — the percent-BEFORE-noun order, sibling of
      arithmetic/discount-percent-off's percent-BEFORE-'off' order. Same
      Discount fact shape, scope=total; see that rule's comment for the
      `type: percent` disjointness argument.
    match:
      sentence:
        - {slot: pct, type: percent}
        - {lit: discount}
    consumes: [pct]
    emits:
      - fact: discount
        value: "pct"
        percent: true
        scope: total

  - id: arithmetic/discount-of-percent
    phase: read
    description: >
      mining candidate discounted-purchase-totals: "he is given a discount
      of 50%" / "there is a discount of 20%" — the percent-AFTER-'discount
      of' order (compare arithmetic/discount-percent-noun's percent-BEFORE
      order — a genuinely different token sequence, so the two rules can
      never both match the same span). Same Discount fact shape,
      scope=total.
    match:
      sentence:
        - {lit: discount}
        - {lit: of}
        - {slot: pct, type: percent}
    consumes: [pct]
    emits:
      - fact: discount
        value: "pct"
        percent: true
        scope: total

  - id: arithmetic/discount-flat-noun
    phase: read
    description: >
      mining candidate discounted-purchase-totals: "a $100 discount" — the
      FLAT-dollar sibling of arithmetic/discount-percent-noun (amount
      BEFORE the 'discount' noun). The amount is a single-token currency
      count such as "$100": the declared currency category excludes bare
      counts, and `single_word` keeps a spelled-out "100 dollars" from
      merging with the following noun into a different phrase. This remains
      structurally disjoint from percent discounts. scope=total (the bare
      reading).
    match:
      sentence:
        - {slot: amt, cat: currency, counted: true, single_word: true}
        - {lit: discount}
    consumes: [amt]
    emits:
      - fact: discount
        value: "amt"
        percent: false
        scope: total

  - id: arithmetic/discount-flat-off
    phase: read
    description: >
      mining candidate discounted-purchase-totals: "$100 off" — the FLAT
      sibling of arithmetic/discount-percent-off. scope=total.
    match:
      sentence:
        - {slot: amt, type: number}
        - {lit: off}
    consumes: [amt]
    emits:
      - fact: discount
        value: "amt"
        percent: false
        scope: total

  - id: arithmetic/discount-of-flat-total
    phase: read
    description: >
      mining candidate discounted-purchase-totals: "a discount of $2" (NO
      trailing 'each') — the flat sibling of arithmetic/discount-of-percent,
      scope=total. Deliberately less specific than arithmetic/discount-of-
      flat-per-unit below (consumes fewer tokens — no 'each'), so a genuine
      per-unit discount ("a discount of $2 each") is always won by that
      strictly-more-specific sibling via ordinary subsumption
      (patterns.subsumes: a superset match at higher specificity wins
      silently); this rule only ever survives a match when 'each' is truly
      absent from the span, matching byte-identical to today whenever this
      candidate's machinery isn't in play at all.
    match:
      sentence:
        - {lit: discount}
        - {lit: of}
        - {slot: amt, type: number}
    consumes: [amt]
    emits:
      - fact: discount
        value: "amt"
        percent: false
        scope: total

  - id: arithmetic/discount-of-flat-per-unit
    phase: read
    description: >
      mining candidate discounted-purchase-totals: "she was given a
      discount of $0.5 EACH" / "given a discount of $2 each" — the
      trailing 'each' scopes the flat discount to EVERY purchased unit
      rather than the summed total (compare arithmetic/discount-of-flat-
      total's bare form). scope=per_unit: the purchase-total consumer
      multiplies this per-unit amount by the purchased quantity before
      subtracting, rather than subtracting it once from the total.
    match:
      sentence:
        - {lit: discount}
        - {lit: of}
        - {slot: amt, type: number}
        - {lit: each}
    consumes: [amt]
    emits:
      - fact: discount
        value: "amt"
        percent: false
        scope: per_unit

asks:
  - id: ask/how-many-in-place
    # If the named place has no matching fact, this rule alone may retry the
    # pack-owned `world` scene. Other single-entity questions do not use this
    # fallback.
    match:
      question:
        - {lit: how}
        - {lit: many}
        - {slot: item, type: noun}
        - {slot: verb, type: verb}
        - {slot: prep, cat: preposition}
        - {slot: place, type: noun}
    resolves:
      consumer: single-entity
      entity: "{place}"
      measure: "{item}"
      verb: have
      place_fallback_entity: world
      # A bare measure may sum compatible qualified variants. For example,
      # "red apples" and "green apples" can answer "how many apples?"
      sum_measure_variants: "true"
      # Preserve a place qualifier so "the first chapter" cannot resolve to
      # facts about another chapter.
      entity_qualifier: "{place.qualifier}"

  - id: ask/how-many-in-place-partitive
    # Handles a qualified measure in a location question, such as "how many
    # cups of flour are left in the bowl?" `qual` selects the exact
    # `cup[flour]` measure instead of combining cups of different substances.
    # The "of QUALIFIER" tail is required, so this rule cannot compete with
    # the bare-measure `ask/how-many-in-place` rule.
    match:
      question:
        - {lit: how}
        - {lit: many}
        - {slot: item, type: noun}
        - {lit: of}
        - {slot: qual, type: noun}
        - {slot: verb, type: verb}
        - {slot: prep, cat: preposition}
        - {slot: place, type: noun}
    resolves:
      consumer: single-entity
      entity: "{place}"
      measure: "{item}"
      measure_qualifier: "{qual}"
      verb: have
      place_fallback_entity: world

  - id: ask/how-many-there-in-possessed-place
    # The possessed-container sibling: "how many trees are there in Mira's
    # garden?" explicitly names Mira as the holder through the possessive.
    # Requiring a pack-declared `quantity_location` head prevents arbitrary
    # possessions ("Mira's idea", "Mira's dog") from being reinterpreted as
    # locations. The owner is the query entity; the container noun is the
    # grammatical location that licenses this indirect holder reference.
    match:
      question:
        - {lit: how}
        - {lit: many}
        - {slot: item, type: noun}
        - {slot: verb, cat: state}
        - {lit: there}
        - {slot: prep, cat: quantity_location_preposition}
        - {slot: place, cat: quantity_location, possessed: true, number: singular}
    resolves:
      consumer: single-entity
      entity: "{place.owner}"
      measure: "{item}"
      verb: have
      measure_qualifier: "{item.qualifier}"
      sum_measure_variants: "true"

  - id: ask/how-many-combined
    match:
      question:
        - {lit: how}
        - {lit: many}
        - {slot: item, type: noun}
        - opt:
            # Accept ordinary and will/would forms, but not capacity modals.
            - {slot: aux, type: future_modal}
            - {slot: who, type: pronoun}
            - {slot: verb, type: verb}
        - opt:
            - {slot: p, cat: preposition}
        - {slot: agg, cat: aggregate}
    resolves:
      consumer: combined
      measure: "{item}"
      verb: "{verb}"

  - id: ask/how-many-combined-in-all
    # Handles the two-word total marker "in all". It needs its own rule
    # because the base rule expects one aggregate token, while this marker is
    # a two-token sequence. Do not add `all` to the aggregate category: it is
    # also a general quantifier. The base rule cannot match this tail, so the
    # two rules do not compete.
    match:
      question:
        - {lit: how}
        - {lit: many}
        - {slot: item, type: noun}
        - opt:
            - {slot: aux, type: future_modal}
            - {slot: who, type: pronoun}
            - {slot: verb, type: verb}
        - {lit: in}
        - {lit: all}
    resolves:
      consumer: combined
      measure: "{item}"
      verb: "{verb}"

  - id: ask/how-many-combined-named
    # Handles totals for two named holders, such as "how many books do Ana
    # and Ben have together?" It binds both names directly. The pronoun form
    # cannot match a named pair, so it remains separate.
    match:
      question:
        - {lit: how}
        - {lit: many}
        - {slot: item, type: noun}
        - {slot: aux, type: auxiliary}
        - {slot: a, type: name}
        - {lit: and}
        - {slot: b, type: name}
        - {slot: verb, type: verb}
        - opt:
            - {slot: p, cat: preposition}
        - {slot: agg, cat: aggregate}
    resolves:
      consumer: combined
      a: "{a}"
      b: "{b}"
      measure: "{item}"
      verb: "{verb}"

  - id: ask/how-many-combined-named-list
    # Two or more explicitly named holders, including serial-comma surfaces:
    # "How many books do Ana, Ben, Cato, and Dena have together?" The span
    # backtracks against the required verb, then `{holders.name_list}` checks
    # that every enumeration segment is exactly one name and that the final
    # pair is joined by a declared conjunctive marker. It therefore rejects
    # comma-only lists, disjunctions, and arbitrary noun phrases. The older
    # two-name rule wins its equal-length tie by id and stays byte-compatible.
    # Longer lists preserve exact scope in `holders`; the combined consumer
    # must not enumerate an unrelated same-measure holder.
    match:
      question:
        - {lit: how}
        - {lit: many}
        - {slot: item, type: noun}
        - {slot: aux, type: auxiliary}
        - {slot: holders, span: true}
        - {slot: verb, type: verb}
        - opt:
            - {slot: p, cat: preposition}
        - {slot: agg, cat: aggregate}
    resolves:
      consumer: combined
      holders: "{holders.name_list}"
      measure: "{item}"
      verb: "{verb}"

  - id: ask/how-many-each-named-list
    # One labelled answer per explicitly named holder: "How many books do
    # Ana, Ben, and Cato each have?" `{holders.name_list}` provides the same
    # exact conjunction, uniqueness, and no-authored-arity contract as the
    # combined-total sibling. The narrow postpositive category admits `each`
    # without accepting the container-determiner-only `every` in this slot.
    # The per-holder consumer reuses combined's all-or-nothing holder folds but
    # preserves each value rather than summing them.
    match:
      question:
        - {lit: how}
        - {lit: many}
        - {slot: item, type: noun}
        - {slot: aux, type: auxiliary}
        - {slot: holders, span: true}
        - {slot: q, cat: postpositive_distributive_quantifier}
        - {slot: verb, type: verb}
    resolves:
      consumer: per-holder
      holders: "{holders.name_list}"
      measure: "{item}"
      measure_surface: "{item.surface}"
      verb: "{verb}"

  - id: ask/how-many-each-named-list-postverbal
    # Postverbal marker sibling: "How many books do Ana and Ben have each?"
    # Exact holder-list validation and answer behavior are identical to the
    # preverbal `each` form above; only the grammatical marker position moves.
    match:
      question:
        - {lit: how}
        - {lit: many}
        - {slot: item, type: noun}
        - {slot: aux, type: auxiliary}
        - {slot: holders, span: true}
        - {slot: verb, type: verb}
        - {slot: q, cat: postpositive_distributive_quantifier}
    resolves:
      consumer: per-holder
      holders: "{holders.name_list}"
      measure: "{item}"
      measure_surface: "{item.surface}"
      verb: "{verb}"

  - id: ask/how-many-individually-named-list
    # Preverbal manner-marker form: "How many books do Ana and Ben
    # individually have?" The adverb category is deliberately separate from
    # quantifier-sensed `each`; both resolve to the same semantic ask.
    match:
      question:
        - {lit: how}
        - {lit: many}
        - {slot: item, type: noun}
        - {slot: aux, type: auxiliary}
        - {slot: holders, span: true}
        - {slot: marker, cat: individualizing_adverb}
        - {slot: verb, type: verb}
    resolves:
      consumer: per-holder
      holders: "{holders.name_list}"
      measure: "{item}"
      measure_surface: "{item.surface}"
      verb: "{verb}"

  - id: ask/how-many-individually-named-list-postverbal
    # Postverbal manner-marker sibling: "How many books do Ana and Ben have
    # individually?" No ordinary manner adverb can enter this slot.
    match:
      question:
        - {lit: how}
        - {lit: many}
        - {slot: item, type: noun}
        - {slot: aux, type: auxiliary}
        - {slot: holders, span: true}
        - {slot: verb, type: verb}
        - {slot: marker, cat: individualizing_adverb}
    resolves:
      consumer: per-holder
      holders: "{holders.name_list}"
      measure: "{item}"
      measure_surface: "{item.surface}"
      verb: "{verb}"

  - id: ask/how-many-combined-named-list-all-together
    # Two-token aggregate-marker sibling of the exact named-list ask:
    # "How many books do Ana, Ben, and Cato have all together?" The marker
    # words are admitted through the same narrow categories that license the
    # trailing GroupTotal premise, so this cannot widen to "all total" or a
    # misspelled one-token form. `{holders.name_list}` retains the ordinary
    # exact-scope, conjunction, uniqueness, and no-authored-arity contract.
    match:
      question:
        - {lit: how}
        - {lit: many}
        - {slot: item, type: noun}
        - {slot: aux, type: auxiliary}
        - {slot: holders, span: true}
        - {slot: verb, type: verb}
        - {slot: q, cat: group_total_quantifier}
        - {slot: agg, cat: quantified_group_total_marker}
    resolves:
      consumer: combined
      holders: "{holders.name_list}"
      measure: "{item}"
      verb: "{verb}"

  - id: ask/how-many-combined-named-in-all
    # Named-pair form with the two-word marker "in all". The ordinary named
    # form expects one aggregate token and therefore cannot match this tail.
    match:
      question:
        - {lit: how}
        - {lit: many}
        - {slot: item, type: noun}
        - {slot: aux, type: auxiliary}
        - {slot: a, type: name}
        - {lit: and}
        - {slot: b, type: name}
        - {slot: verb, type: verb}
        - {lit: in}
        - {lit: all}
    resolves:
      consumer: combined
      a: "{a}"
      b: "{b}"
      measure: "{item}"
      verb: "{verb}"

  - id: ask/how-many-combined-partitive
    # Handles combined partitive measures, such as "how many cups of flour
    # do they have altogether?" `measure_substance` prevents values for a
    # different substance under the same unit from joining the total—for
    # example, pairs of socks must not answer a question about pairs of
    # shoes. The required "of QUALIFIER" tail keeps this rule separate from
    # the bare-measure form.
    match:
      question:
        - {lit: how}
        - {lit: many}
        - {slot: item, type: noun}
        - {lit: of}
        - {slot: qual, type: noun}
        - opt:
            - {slot: aux, type: future_modal}
            - {slot: who, type: pronoun}
            - {slot: verb, type: verb}
        - opt:
            - {slot: p, cat: preposition}
        - {slot: agg, cat: aggregate}
    resolves:
      consumer: combined
      measure: "{item}"
      measure_qualifier: "{qual}"
      measure_substance: "{qual}"
      verb: "{verb}"

  - id: ask/how-many-combined-partitive-in-all
    # Partitive form with the two-word marker "in all". The ordinary
    # partitive form expects one aggregate token and cannot match this tail.
    match:
      question:
        - {lit: how}
        - {lit: many}
        - {slot: item, type: noun}
        - {lit: of}
        - {slot: qual, type: noun}
        - opt:
            - {slot: aux, type: future_modal}
            - {slot: who, type: pronoun}
            - {slot: verb, type: verb}
        - {lit: in}
        - {lit: all}
    resolves:
      consumer: combined
      measure: "{item}"
      measure_qualifier: "{qual}"
      measure_substance: "{qual}"
      verb: "{verb}"

  - id: ask/how-many-combined-named-partitive
    # Partitive form for two named holders. It binds both names directly and
    # uses `measure_substance` to avoid mixing different substances that use
    # the same unit.
    match:
      question:
        - {lit: how}
        - {lit: many}
        - {slot: item, type: noun}
        - {lit: of}
        - {slot: qual, type: noun}
        - {slot: aux, type: auxiliary}
        - {slot: a, type: name}
        - {lit: and}
        - {slot: b, type: name}
        - {slot: verb, type: verb}
        - opt:
            - {slot: p, cat: preposition}
        - {slot: agg, cat: aggregate}
    resolves:
      consumer: combined
      a: "{a}"
      b: "{b}"
      measure: "{item}"
      measure_qualifier: "{qual}"
      measure_substance: "{qual}"
      verb: "{verb}"

  - id: ask/how-many-combined-cardinal-pronoun
    # Handles a numbered holder group, such as "how many books do the three
    # of them have in total?" The cardinal states the expected group size;
    # it does not choose the holders. `holder_count` makes the consumer check
    # that the premises actually contain that many holders and also marks the
    # cardinal as used. The pronoun and named-pair forms cannot match a bare
    # cardinal.
    match:
      question:
        - {lit: how}
        - {lit: many}
        - {slot: item, type: noun}
        - {slot: aux, type: auxiliary}
        - {slot: n, type: number}
        - opt:
            - {lit: of}
            - {lit: them}
        - {slot: verb, type: verb}
        - opt:
            - {slot: p, cat: preposition}
        - {slot: agg, cat: aggregate}
    resolves:
      consumer: combined
      measure: "{item}"
      verb: "{verb}"
      holder_count: "{n.value}"

  - id: ask/how-many-more
    match:
      question:
        - {lit: how}
        - {lit: many}
        - {slot: dir, cat: delta}
        - {slot: item, type: noun}
        - {slot: aux, type: auxiliary}
        - {slot: a, type: name}
        - {slot: verb, type: verb}
        - {lit: than}
        - {slot: b, type: name}
    resolves:
      consumer: difference
      a: "{a}"
      b: "{b}"
      measure: "{item}"
      verb: "{verb}"

  - id: ask/how-many-more-partitive
    # Handles differences between qualified measures, such as "how many more
    # pairs of shoes does Ann have than Bob?" `measure_substance` prevents a
    # holder's pairs of socks from answering a question about shoes. The
    # required "of QUALIFIER" tail keeps this rule separate from the bare
    # measure form.
    match:
      question:
        - {lit: how}
        - {lit: many}
        - {slot: dir, cat: delta}
        - {slot: item, type: noun}
        - {lit: of}
        - {slot: qual, type: noun}
        - {slot: aux, type: auxiliary}
        - {slot: a, type: name}
        - {slot: verb, type: verb}
        - {lit: than}
        - {slot: b, type: name}
    resolves:
      consumer: difference
      a: "{a}"
      b: "{b}"
      measure: "{item}"
      measure_qualifier: "{qual}"
      measure_substance: "{qual}"
      verb: "{verb}"

  - id: ask/how-many-more-label-comparative
    # Compares two measure labels, as in "how many more boys than girls are
    # there?" This is not a comparison between named holders. The consumer
    # resolves both measures and requires them to belong to exactly one
    # shared holder.
    match:
      question:
        - {lit: how}
        - {lit: many}
        - {slot: dir, cat: delta}
        - {slot: a, type: plural}
        - {lit: than}
        - {slot: b, type: plural}
        - {slot: verb, cat: state}
        - {lit: there}
    resolves:
      consumer: label-difference
      a: "{a}"
      b: "{b}"

  - id: ask/how-many-more-label-comparative-held
    # Held form of the label comparison: "how many more peaches than apples
    # does Steven have?" The order "A than B" before the auxiliary is
    # essential. It excludes questions that compare people, times, or
    # actions instead of two measures. Do not relax that order. The named
    # holder is a hint; the consumer still requires one shared holder for
    # both measures.
    match:
      question:
        - {lit: how}
        - {lit: many}
        - {slot: dir, cat: delta}
        - {slot: a, type: plural}
        - {lit: than}
        - {slot: b, type: plural}
        - {slot: aux, type: auxiliary}
        - {slot: who, type: entity}
        - {slot: verb, type: verb}
    resolves:
      consumer: label-difference
      a: "{a}"
      b: "{b}"
      # the HOLDER the question names ("...does Steven have?"). A HINT, not
      # a requirement: `label-difference` uses it only when that entity
      # actually holds BOTH measures, and otherwise falls back to its
      # exactly-one-SHARED-holder discipline unchanged. The existential
      # sibling ask names no holder and binds nothing here, so its path is
      # byte-identical. See the consumer for why the fallback (rather than
      # a decline) is the safe direction.
      holder: "{who}"
      # the ask's VERB selects state-vs-activity totals in the consumer,
      # exactly as in the sibling `difference` branch. SVAMP asks the SAME
      # premises both ways ("did baker SELL?" vs "did baker MAKE?") with
      # DIFFERENT golds. The existential sibling binds a `cat: state` verb
      # and therefore keeps the stative path.
      verb: "{verb}"

  - id: ask/how-many-entity
    # Keep `who` restricted to a name. A general entity would overlap the
    # possessed and qualified forms, losing their owner or qualifier data.
    match:
      question:
        - {lit: how}
        - {lit: many}
        - {slot: item, type: noun}
        # `future_modal` accepts do/does/did and will/would forms, but excludes
        # capacity modals such as can or must.
        - {slot: aux, type: future_modal}
        - {slot: who, type: name}
        - {slot: verb, type: verb}
    resolves:
      consumer: single-entity
      entity: "{who}"
      measure: "{item}"
      verb: "{verb}"
      # Preserve an item qualifier so "green apples" first looks for the
      # exact `apple[green]` measure.
      measure_qualifier: "{item.qualifier}"
      # A bare item may sum compatible qualified variants, but only after
      # exact lookups fail. A qualified question never uses this fallback.
      sum_measure_variants: "true"
      # Do not add a partitive tail here. The single-entity fold does not
      # convert units, so a question in ounces over premises in gallons could
      # produce a confident wrong answer. That form needs conversion-aware
      # consumer logic.

  - id: ask/how-many-entity-prenominal-marker
    # Handles an aggregate marker before the measure, such as "how many total
    # toys does James buy?" The total belongs to one holder, so this uses the
    # single-entity consumer. The marker is required; without it, the base
    # single-entity rule applies.
    match:
      question:
        - {lit: how}
        - {lit: many}
        - {slot: pre, cat: aggregate}
        - {slot: item, type: noun}
        - {slot: aux, type: future_modal}
        - {slot: who, type: name}
        - {slot: verb, type: verb}
    resolves:
      consumer: single-entity
      entity: "{who}"
      measure: "{item}"
      verb: "{verb}"

  - id: ask/how-many-entity-elided-measure
    # Handles questions that omit the measure, such as "how many does Tom
    # have?" The consumer can answer only when Tom has one clear measure.
    # Because the auxiliary must follow "how many" immediately, this rule
    # cannot claim a question that names an item.
    match:
      question:
        - {lit: how}
        - {lit: many}
        - {slot: aux, type: future_modal}
        - {slot: who, type: name}
        - {slot: verb, type: verb}
    resolves:
      consumer: single-entity-elided-measure
      entity: "{who}"
      verb: "{verb}"

  - id: ask/how-many-entity-possessed
    match:
      question:
        - {lit: how}
        - {lit: many}
        - {slot: item, type: noun}
        - {slot: aux, type: auxiliary}
        # `possessed` requires an owner, as in "Kennedy's house". Keeping it
        # separate preserves that owner and excludes a bare common noun.
        - {slot: who, type: possessed}
        - {slot: verb, type: verb}
    resolves:
      consumer: single-entity
      entity: "{who}"
      measure: "{item}"
      verb: "{verb}"
      # If the bare entity lookup is empty, retry the owner-qualified key.
      entity_owner: "{who.owner}"

  - id: ask/what-is-the-number-of-possessed
    # Handles a nominal possessive question such as "what is the number of
    # Ana's siblings?" The possessive owner is the entity and the possessed
    # noun is the measure. With no verb in the question, the consumer uses
    # "have".
    match:
      question:
        - {lit: what}
        - {lit: is}
        - {slot: frame, cat: aggregate_noun}
        - {lit: of}
        - {slot: who, type: possessed}
    resolves:
      consumer: single-entity
      entity: "{who.owner}"
      measure: "{who}"

  - id: ask/how-many-entity-qualified
    match:
      question:
        - {lit: how}
        - {lit: many}
        - {slot: item, type: noun}
        - {slot: aux, type: auxiliary}
        # `qualified` requires a merged modifier, as in "coconut trees" or
        # "red apples". Keeping it separate preserves the qualifier.
        - {slot: who, type: qualified}
        - {slot: verb, type: verb}
    resolves:
      consumer: single-entity
      entity: "{who}"
      measure: "{item}"
      verb: "{verb}"
      # If the bare entity lookup is empty, retry the qualified key.
      entity_qualifier: "{who.qualifier}"

  - id: ask/how-many-entity-common-noun
    # Handles a singular common-noun holder, such as "how many parts does the
    # vehicle have?" `common_noun` deliberately excludes names, possessives,
    # qualified nouns, and plurals. Those forms have separate rules whose
    # owner, qualifier, or group information must be preserved.
    match:
      question:
        - {lit: how}
        - {lit: many}
        - {slot: item, type: noun}
        - {slot: aux, type: future_modal}
        - {slot: who, type: common_noun}
        - {slot: verb, type: verb}
    resolves:
      consumer: single-entity
      entity: "{who}"
      measure: "{item}"
      verb: "{verb}"
      measure_qualifier: "{item.qualifier}"
      sum_measure_variants: "true"

  # There is intentionally no single-holder partitive rule for questions
  # such as "how many pairs of shoes does Ann have?" The current consumer
  # cannot safely distinguish unit conversions or a qualified measure that
  # exists only through a relation. Its bare-measure fallback can mix
  # substances or units and produce a confident wrong answer. Add this form
  # only with a consumer that can guard those cases.

  - id: ask/how-many-left-entityless
    match:
      question:
        - {lit: how}
        - {lit: many}
        - {slot: item, type: noun}
        # Optional "of SUBSTANCE" tail. The substance is used only to prevent
        # a measure with the same name but different contents from answering.
        - opt:
            - {lit: of}
            - {slot: substance, type: noun}
        - {slot: verb, type: verb}
        - {lit: left}
    resolves:
      consumer: unique-entity
      measure: "{item}"
      measure_substance: "{substance}"

  - id: ask/how-many-there
    match:
      question:
        - {lit: how}
        - {lit: many}
        - {slot: item, type: noun}
        # Optional "of SUBSTANCE" tail, used as a decline-safety guard.
        - opt:
            - {lit: of}
            - {slot: substance, type: noun}
        - {slot: verb, type: verb}
        - {lit: there}
    resolves:
      consumer: unique-entity
      measure: "{item}"
      measure_substance: "{substance}"

  - id: ask/how-many-there-combined
    # Handles an entity-less total, such as "how many chairs are there in
    # total?" The aggregate marker is required because it authorizes a sum
    # across holders; without it, the bare rule requires one unique holder.
    #
    # `exclude_entity: world` prevents an unlocated scene-level fact from
    # being counted again beside named holders. An optional partitive tail
    # guards the substance, and an optional trailing group such as "in the
    # two lakes" lets `grp_value` mark its cardinal as used. This rule still
    # supports only one measure at a time.
    match:
      question:
        - {lit: how}
        - {lit: many}
        - {slot: item, type: noun}
        - opt:
            - {lit: of}
            - {slot: substance, type: noun}
        - {slot: verb, type: verb}
        - {lit: there}
        - opt:
            - {slot: p, cat: preposition}
        - {slot: agg, cat: aggregate}
        - opt:
            - {slot: p2, cat: preposition}
            - {slot: grp, type: plural}
    resolves:
      consumer: combined
      measure: "{item}"
      verb: "{verb}"
      exclude_entity: world
      grp_value: "{grp.value}"
      measure_substance: "{substance}"

  - id: ask/how-many-passive-combined
    # Passive total form: "how many pies were eaten in total?" The copula and
    # participle identify a subjectless passive clause. The verb slot resolves
    # the participle to its lemma, so the existing combined consumer can sum
    # the event facts.
    #
    # This rule shares the substance, trailing-group, and `world` safeguards
    # of the preceding entity-less total rule. The total marker is essential:
    # a bare passive question would use the wrong signed fold. Passive
    # comparisons by time also remain unsupported because they need a
    # time-scoped consumer.
    match:
      question:
        - {lit: how}
        - {lit: many}
        - {slot: item, type: noun}
        - opt:
            - {lit: of}
            - {slot: substance, type: noun}
        - {slot: be, cat: state}
        - {slot: verb, type: verb}
        - opt:
            - {slot: p, cat: preposition}
        - {slot: agg, cat: aggregate}
        - opt:
            - {slot: p2, cat: preposition}
            - {slot: grp, type: plural}
    resolves:
      consumer: combined
      measure: "{item}"
      verb: "{verb}"
      exclude_entity: world
      grp_value: "{grp.value}"
      measure_substance: "{substance}"

  - id: ask/how-many-plural-combined
    # Handles a collective plural subject, such as "how many books do the
    # two boys have in total?" The subject identifies a group rather than a
    # particular holder, so the consumer enumerates the holders. `who_value`
    # marks any merged cardinal as used. Pronoun and named-pair subjects have
    # separate, non-overlapping rules.
    match:
      question:
        - {lit: how}
        - {lit: many}
        - {slot: item, type: noun}
        - {slot: aux, type: auxiliary}
        - {slot: who, type: plural}
        - {slot: verb, type: verb}
        - opt:
            - {slot: p, cat: preposition}
        - {slot: agg, cat: aggregate}
    resolves:
      consumer: combined
      measure: "{item}"
      verb: "{verb}"
      who_value: "{who.value}"

  - id: ask/how-many-all-combined
    # Handles "all of them" as a collective subject. The pronoun is only
    # part of the sentence shape; the consumer finds every holder from the
    # facts. The inserted words "all of" keep this form separate from the
    # bare "they" or "we" rule.
    match:
      question:
        - {lit: how}
        - {lit: many}
        - {slot: item, type: noun}
        - {slot: aux, type: auxiliary}
        - {lit: all}
        - {lit: of}
        - {slot: who, type: pronoun}
        - {slot: verb, type: verb}
        - opt:
            - {slot: p, cat: preposition}
        - {slot: agg, cat: aggregate}
    resolves:
      consumer: combined
      measure: "{item}"
      verb: "{verb}"

  - id: ask/how-many-plural-combined-prenominal-marker
    # Handles the aggregate marker before the measure: "how many total toys
    # do the boys have?" The marker is required. A bare plural question
    # still needs either a trailing total marker or an explicit cardinal.
    # `who_value` marks a cardinal in the plural subject as used.
    match:
      question:
        - {lit: how}
        - {lit: many}
        - {slot: pre, cat: aggregate}
        - {slot: item, type: noun}
        - {slot: aux, type: auxiliary}
        - {slot: who, type: plural}
        - {slot: verb, type: verb}
    resolves:
      consumer: combined
      measure: "{item}"
      verb: "{verb}"
      who_value: "{who.value}"

  - id: ask/how-many-combined-prenominal-marker
    # Pronoun-subject sibling of the plural common-noun rule above:
    # "how many total animals do they have?" The required total marker
    # authorizes the existing combined consumer to enumerate the facts; the
    # pronoun itself does not guess a holder. This keeps the form separate
    # from single-name asks and from unmarked "how many animals do they have?"
    # questions, which remain unsupported without an explicit total signal.
    match:
      question:
        - {lit: how}
        - {lit: many}
        - {slot: pre, cat: aggregate}
        - {slot: item, type: noun}
        - {slot: aux, type: future_modal}
        - {slot: who, type: pronoun}
        - {slot: verb, type: verb}
    resolves:
      consumer: combined
      measure: "{item}"
      verb: "{verb}"

  - id: ask/how-many-plural-combined-quantified-subject
    # Handles a quantifier before a plural noun, such as "all boys" or
    # "both teams". A trailing aggregate marker is still required because
    # the subject has no cardinal of its own. This is distinct from the bare
    # plural form and from the pronoun phrase "all of them".
    match:
      question:
        - {lit: how}
        - {lit: many}
        - {slot: item, type: noun}
        - {slot: aux, type: auxiliary}
        - {slot: q, cat: quantifier}
        - {slot: who, type: plural}
        - {slot: verb, type: verb}
        - opt:
            - {slot: p, cat: preposition}
        - {slot: agg, cat: aggregate}
    resolves:
      consumer: combined
      measure: "{item}"
      verb: "{verb}"
      who_value: "{who.value}"

  - id: ask/how-many-plural-combined-cardinal-subject
    # Handles an explicit cardinal in the subject, such as "the two boys",
    # "these three boys", or "all three friends". The cardinal itself makes
    # the group total clear, so no aggregate marker is required. `counted` is
    # the essential guard: never widen it to a bare plural subject. If a
    # trailing marker is present, the more specific marked rule wins.
    match:
      question:
        - {lit: how}
        - {lit: many}
        - {slot: item, type: noun}
        - {slot: aux, type: auxiliary}
        - opt:
            - {slot: q, cat: quantifier}
        - {slot: who, type: counted}
        - {slot: verb, type: verb}
    resolves:
      consumer: combined
      measure: "{item}"
      verb: "{verb}"
      who_value: "{who.value}"

  - id: ask/how-many-combined-named-elided-measure
    # Handles a named pair when the measure is omitted: "how many do Ana and
    # Ben have in total?" The consumer finds the one measure shared by both
    # holders and declines if there is not exactly one. Because the auxiliary
    # follows "how many" immediately, this rule cannot claim an itemed form.
    match:
      question:
        - {lit: how}
        - {lit: many}
        - {slot: aux, type: auxiliary}
        - {slot: a, type: name}
        - {lit: and}
        - {slot: b, type: name}
        - {slot: verb, type: verb}
        - opt:
            - {slot: p, cat: preposition}
        - {slot: agg, cat: aggregate}
    resolves:
      consumer: combined-elided-measure
      a: "{a}"
      b: "{b}"
      verb: "{verb}"

  - id: ask/how-much-bare-entity
    # Keep `who` restricted to a name. Allowing any entity would make an
    # item-cost question such as "how much do the jackets cost?" look like a
    # question about one holder and route it to the wrong consumer.
    match:
      question:
        - {lit: how}
        - {lit: much}
        # Accept ordinary and will/would forms, but not capacity modals.
        - {slot: aux, type: future_modal}
        - {slot: who, type: name}
        - {slot: verb, type: verb}
    resolves:
      consumer: single-entity
      entity: "{who}"
      # the CATEGORY, not a currency: resolved to the unique currency
      # measure present in the facts (mixed currencies decline)
      measure: currency
      verb: "{verb}"

  - id: ask/how-much-noun-entity
    # `who` accepts any supported entity because the named item keeps this
    # form distinct from the bare "how much" rules. The optional "in UNIT"
    # phrase handles questions such as "how much money, in dollars, does Tom
    # have?" When supplied, `req_unit` must match the resolved unit; otherwise
    # the consumer declines instead of returning the value in another unit.
    match:
      question:
        - {lit: how}
        - {lit: much}
        - {slot: item, type: noun}
        - opt:
            - {lit: in}
            - {slot: req_unit, type: noun}
        # Accept ordinary and will/would forms, but not capacity modals.
        - {slot: aux, type: future_modal}
        - {slot: who, type: entity}
        - {slot: verb, type: verb}
    resolves:
      consumer: single-entity
      entity: "{who}"
      measure: "{item}"
      verb: "{verb}"
      req_unit: "{req_unit}"

  - id: ask/how-much-noun-entity-uninverted
    # Handles non-inverted word order: "how much money she will have?" The
    # ordinary form places the modal before the subject. The next token after
    # the item is different in each form, so the two rules cannot overlap.
    match:
      question:
        - {lit: how}
        - {lit: much}
        - {slot: item, type: noun}
        - {slot: who, type: entity}
        - {slot: aux, type: future_modal}
        - {slot: verb, type: verb}
    resolves:
      consumer: single-entity
      entity: "{who}"
      measure: "{item}"
      verb: "{verb}"

  - id: ask/how-much-combined
    # Combined "how much" form, such as "how much money do they have in
    # total?" It uses the same total consumer as the "how many" form. The
    # required item and pronoun subject keep it separate from single-holder
    # questions.
    match:
      question:
        - {lit: how}
        - {lit: much}
        - {slot: item, type: noun}
        - opt:
            - {slot: aux, type: auxiliary}
            - {slot: who, type: pronoun}
            - {slot: verb, type: verb}
        - opt:
            - {slot: p, cat: preposition}
        - {slot: agg, cat: aggregate}
    resolves:
      consumer: combined
      measure: "{item}"
      verb: "{verb}"
      # a SINGULAR subject ("how much does HE have total") sums that ONE
      # holder's own state+event holdings, not a multi-holder combination — the
      # combined consumer reads this to accept a lone holder there (see its
      # comment). Empty for a subjectless/plural ask, keeping the >=2 guard.
      subject_number: "{who.number}"

  - id: ask/how-much-combined-in-all
    # "How much" form with the two-word marker "in all". The ordinary form
    # expects one aggregate token and cannot match this tail.
    match:
      question:
        - {lit: how}
        - {lit: much}
        - {slot: item, type: noun}
        - opt:
            - {slot: aux, type: auxiliary}
            - {slot: who, type: pronoun}
            - {slot: verb, type: verb}
        - {lit: in}
        - {lit: all}
    resolves:
      consumer: combined
      measure: "{item}"
      verb: "{verb}"

  - id: ask/how-much-combined-named
    # Combined "how much" form for two named holders. It binds both names
    # directly. The pronoun form and the single-name forms cannot match the
    # "NAME and NAME" sequence.
    match:
      question:
        - {lit: how}
        - {lit: much}
        - {slot: item, type: noun}
        - {slot: aux, type: auxiliary}
        - {slot: a, type: name}
        - {lit: and}
        - {slot: b, type: name}
        - {slot: verb, type: verb}
        - opt:
            - {slot: p, cat: preposition}
        - {slot: agg, cat: aggregate}
    resolves:
      consumer: combined
      a: "{a}"
      b: "{b}"
      measure: "{item}"
      verb: "{verb}"

  - id: ask/how-much-combined-named-in-all
    # Named-pair "how much" form with the two-word marker "in all". The
    # ordinary named form expects one aggregate token and cannot match it.
    match:
      question:
        - {lit: how}
        - {lit: much}
        - {slot: item, type: noun}
        - {slot: aux, type: auxiliary}
        - {slot: a, type: name}
        - {lit: and}
        - {slot: b, type: name}
        - {slot: verb, type: verb}
        - {lit: in}
        - {lit: all}
    resolves:
      consumer: combined
      a: "{a}"
      b: "{b}"
      measure: "{item}"
      verb: "{verb}"

  - id: ask/how-much-combined-cardinal-pronoun
    # how-much sibling of ask/how-many-combined-cardinal-pronoun — see
    # that ask's comment for the full class rationale (bare cardinal
    # holder set, literal "of them" tail, `holder_count` double duty).
    # Never a tie with ask/how-much-combined: same non-tie argument as
    # ask/how-many-combined-cardinal-pronoun vs ask/how-many-combined
    # (the pronoun sibling's opt group requires `type: auxiliary` +
    # `type: pronoun` + verb as one atomic subsequence; a cardinal
    # satisfies neither).
    match:
      question:
        - {lit: how}
        - {lit: much}
        - {slot: item, type: noun}
        - {slot: aux, type: auxiliary}
        - {slot: n, type: number}
        - opt:
            - {lit: of}
            - {lit: them}
        - {slot: verb, type: verb}
        - opt:
            - {slot: p, cat: preposition}
        - {slot: agg, cat: aggregate}
    resolves:
      consumer: combined
      measure: "{item}"
      verb: "{verb}"
      holder_count: "{n.value}"

  - id: ask/how-much-noun-more-than
    match:
      question:
        - {lit: how}
        - {lit: much}
        - {slot: dir, cat: delta}
        - {slot: item, type: noun}
        - {slot: aux, type: auxiliary}
        - {slot: a, type: name}
        - {slot: verb, type: verb}
        - {lit: than}
        - {slot: b, type: name}
    resolves:
      consumer: difference
      a: "{a}"
      b: "{b}"
      measure: "{item}"
      verb: "{verb}"

  - id: ask/what-is-the-difference-named
    match:
      question:
        # "what is the difference in/between the number of ITEM NAME and
        # NAME have" — the wh-difference CLASS routed to the EXISTING
        # 'difference' consumer shared with ask/how-many-more; 'the'/'a'
        # articles are skippable senses, never authored as literals.
        # `cat: state` reuses the established has/have/is/are/was/were/
        # own/owns equivalence class (core-english categories) for the
        # copula, exactly as ask/how-old-is does.
        - {lit: what}
        - {slot: be, cat: state}
        - {lit: difference}
        - opt:
            - {slot: prep, cat: preposition}
        - opt:
            # "the number of"/"the amount of" framing (same aggregate_noun
            # + 'of' pairing as arithmetic/times-the-number-of) — optional
            # because "the difference in ITEM ..." also occurs bare.
            - {slot: frame, cat: aggregate_noun}
            - {lit: of}
        - {slot: item, type: noun}
        - {slot: a, type: name}
        - {lit: and}
        - {slot: b, type: name}
        - {slot: verb, type: verb}
    resolves:
      consumer: difference
      a: "{a}"
      b: "{b}"
      measure: "{item}"
      verb: "{verb}"

  - id: ask/what-is-the-difference-pronoun
    match:
      question:
        # the pronoun mirror of ask/what-is-the-difference-named ("...ITEM
        # they have?") — no named pair to bind, so the consumer resolves
        # the pair itself from the FACTS (exactly two holders of the
        # measure, or decline; mirrors the 'combined' consumer's holder
        # enumeration, but difference is inherently BINARY, never a Σ).
        - {lit: what}
        - {slot: be, cat: state}
        - {lit: difference}
        - opt:
            - {slot: prep, cat: preposition}
        - opt:
            - {slot: frame, cat: aggregate_noun}
            - {lit: of}
        - {slot: item, type: noun}
        - {slot: who, type: pronoun}
        - {slot: verb, type: verb}
    resolves:
      consumer: difference
      measure: "{item}"
      verb: "{verb}"

  - id: ask/how-many-unit-dimension-comparative-than
    # Handles dimensional differences, such as "how many inches taller is
    # Vlad than his sister?" Taller/shorter and heavier/lighter use one rule
    # because the answer is an absolute difference.
    #
    # The copula is a verb here, not an auxiliary. The optional possessive
    # pronoun must be consumed before `b`; otherwise "his" could be mistaken
    # for the standard instead of "sister". `fold_units` combines compatible
    # units—for example, 6 feet 3 inches must become 75 inches before the
    # comparison.
    match:
      question:
        - {lit: how}
        - {lit: many}
        - {slot: item, type: noun}
        - {slot: dir, cat: dimension_comparative}
        - {slot: aux, type: verb}
        - {slot: a, type: entity}
        - {lit: than}
        - opt:
            - {slot: poss, type: pronoun}
        - {slot: b, type: entity}
    resolves:
      consumer: difference
      a: "{a}"
      b: "{b}"
      measure: "{item}"
      verb: "{aux}"
      fold_units: "true"

  - id: ask/how-much-dimension-comparative-than-unit
    # Same dimensional comparison with the requested unit at the end:
    # "how much taller is Mike than Mark in inches?" It uses the same
    # possessive guard and compatible-unit folding as the preceding rule.
    match:
      question:
        - {lit: how}
        - {lit: much}
        - {slot: dir, cat: dimension_comparative}
        - {slot: aux, type: verb}
        - {slot: a, type: entity}
        - {lit: than}
        - opt:
            - {slot: poss, type: pronoun}
        - {slot: b, type: entity}
        - {lit: in}
        - {slot: item, type: noun}
    resolves:
      consumer: difference
      a: "{a}"
      b: "{b}"
      measure: "{item}"
      verb: "{aux}"
      fold_units: "true"

  - id: ask/how-much-age-comparative-than
    # Age form of the dimensional comparison: "how much older is Andy than
    # Rahim?" The comparative implies years, so the rule supplies `year`
    # directly. Ages do not need mixed-unit folding.
    match:
      question:
        - {lit: how}
        - {lit: much}
        - {slot: dir, cat: age_comparative}
        - {slot: aux, type: verb}
        - {slot: a, type: entity}
        - {lit: than}
        - opt:
            - {slot: poss, type: pronoun}
        - {slot: b, type: entity}
    resolves:
      consumer: difference
      a: "{a}"
      b: "{b}"
      measure: year
      verb: "{aux}"

  - id: ask/how-many-rate-span
    match:
      question:
        - {lit: how}
        - {lit: many}
        - {slot: item, type: noun}
        - {slot: aux, type: auxiliary}
        - {slot: who, type: entity}
        - {slot: verb, type: verb}
        - {lit: in}
        - {slot: span, type: counted}
    resolves:
      consumer: rate-span
      entity: "{who}"
      measure: "{item}"
      span_unit: "{span}"
      span_value: "{span.value}"

  - id: ask/how-much-rate-span
    match:
      question:
        - {lit: how}
        - {lit: much}
        - {slot: aux, type: auxiliary}
        - {slot: who, type: entity}
        - {slot: verb, type: verb}
        - {lit: in}
        - {slot: span, type: counted}
    resolves:
      consumer: rate-span
      entity: "{who}"
      measure: currency
      span_unit: "{span}"
      span_value: "{span.value}"

  - id: ask/how-many-rate-span-modal
    # Modal rate question: "how many apples can he eat in 2 hours?"
    # `capacity_modal` covers capacity or hypothetical modals, but excludes
    # future "will/would" questions because stated future exceptions may make
    # simple rate projection unsafe. The required "in SPAN" tail keeps this
    # separate from budget-based purchase-capacity questions.
    match:
      question:
        - {lit: how}
        - {lit: many}
        - {slot: item, type: noun}
        - {slot: aux, cat: capacity_modal}
        - {slot: who, type: entity}
        - {slot: verb, type: verb}
        - {lit: in}
        - {slot: span, type: counted}
    resolves:
      consumer: rate-span
      entity: "{who}"
      measure: "{item}"
      span_unit: "{span}"
      span_value: "{span.value}"

  - id: ask/how-much-rate-span-modal
    # Modal currency-rate question. As in the "how many" form, the required
    # "in SPAN" tail keeps it separate from purchase-capacity questions.
    match:
      question:
        - {lit: how}
        - {lit: much}
        - {slot: aux, cat: capacity_modal}
        - {slot: who, type: entity}
        - {slot: verb, type: verb}
        - {lit: in}
        - {slot: span, type: counted}
    resolves:
      consumer: rate-span
      entity: "{who}"
      measure: currency
      span_unit: "{span}"
      span_value: "{span.value}"

  - id: ask/earn-span
    # Wage question: "how much does Rob earn in 8 hours?" The narrow
    # `wage_verb` category prevents unrelated buying or producing questions
    # from matching. The span is optional because an earlier premise may
    # already state it. This rule sorts before the general bare-entity form
    # so wage verbs reach the rate consumer when their shapes tie.
    match:
      question:
        - {lit: how}
        - {lit: much}
        - {slot: aux, type: auxiliary}
        - {slot: who, type: entity}
        - {slot: verb, cat: wage_verb}
        - opt:
            - {lit: in}
            - {slot: span, type: counted}
    resolves:
      consumer: rate-span
      entity: "{who}"
      measure: currency
      span_unit: "{span}"
      span_value: "{span.value}"

  - id: ask/how-long-take-span
    # Inverse rate question: "how long will it take Ana to paint 8 doors?"
    # The consumer divides the requested amount by a known rate. `future_modal`
    # accepts ordinary and future forms but excludes capacity modals. "for"
    # before the person is optional.
    match:
      question:
        - {lit: how}
        - {lit: long}
        - {slot: aux, type: future_modal}
        - {lit: it}
        - {lit: take}
        - opt:
            - {lit: for}
        - {slot: who, type: entity}
        - {lit: to}
        - {slot: verb, type: verb}
        - {slot: item, type: counted}
    resolves:
      consumer: rate-span-inverse
      entity: "{who}"
      item: "{item}"
      item_value: "{item.value}"

  - id: ask/how-long-take-span-totality-item
    # Totality form of the inverse rate question: "how long will it take Ana
    # to paint all of the doors?" The item count comes from one unambiguous
    # quantity in the premises. The required "all" marker keeps this form
    # separate from the rule that expects a stated numeral.
    match:
      question:
        - {lit: how}
        - {lit: long}
        - {slot: aux, type: future_modal}
        - {lit: it}
        - {lit: take}
        - opt:
            - {lit: for}
        - {slot: who, type: entity}
        - {lit: to}
        - {slot: verb, type: verb}
        - {lit: all}
        - opt:
            - {lit: of}
        - {slot: item, type: noun}
    resolves:
      consumer: rate-span-inverse
      entity: "{who}"
      item: "{item}"

  - id: ask/how-many-timeunit-take-span
    # Inverse rate question with an explicit time unit: "how many hours will
    # it take Ana to paint 8 doors?" The requested unit must match the rate's
    # unit. The required "it take ... to" frame keeps this distinct from a
    # general purchase-capacity question. "for" before the person is optional.
    match:
      question:
        - {lit: how}
        - {lit: many}
        - {slot: span_unit, type: noun}
        - {slot: aux, type: future_modal}
        - {lit: it}
        - {lit: take}
        - opt:
            - {lit: for}
        - {slot: who, type: entity}
        - {lit: to}
        - {slot: verb, type: verb}
        - {slot: item, type: counted}
    resolves:
      consumer: rate-span-inverse
      entity: "{who}"
      item: "{item}"
      item_value: "{item.value}"
      span_unit: "{span_unit}"

  - id: ask/how-many-timeunit-take-span-totality-item
    # Explicit-time-unit form for "all of the ITEM". The required totality
    # marker separates it from the version that expects a stated count.
    match:
      question:
        - {lit: how}
        - {lit: many}
        - {slot: span_unit, type: noun}
        - {slot: aux, type: future_modal}
        - {lit: it}
        - {lit: take}
        - opt:
            - {lit: for}
        - {slot: who, type: entity}
        - {lit: to}
        - {slot: verb, type: verb}
        - {lit: all}
        - opt:
            - {lit: of}
        - {slot: item, type: noun}
    resolves:
      consumer: rate-span-inverse
      entity: "{who}"
      item: "{item}"
      span_unit: "{span_unit}"

  - id: ask/how-old-is
    match:
      question:
        - {lit: how}
        - {lit: old}
        - {slot: verb, cat: state}
        - {slot: who, type: name}
    resolves:
      consumer: single-entity
      entity: "{who}"
      # the DATA measure the stated-age rule commits to — matches its
      # emitted Quantity's measure exactly, no category resolution needed
      measure: year
      verb: "{verb}"

  - id: ask/how-old-at-year
    # "How old was the teacher in 2022?" queries an explicit absolute
    # calendar coordinate. The consumer projects only AgeAtYear facts and
    # requires every matching source coordinate to agree on one result.
    match:
      question:
        - {lit: how}
        - {lit: old}
        - {slot: verb, cat: state}
        - {slot: who, type: entity, referential: true, bare_reference_category: bare_entity_reference}
        - {lit: in}
        - {slot: target_year, type: number, standalone: true, integer: true}
    resolves:
      consumer: age-at-year
      entity: "{who}"
      entity_owner: "{who.owner}"
      entity_qualifier: "{who.qualifier}"
      entity_label: "{who.label}"
      measure: year
      target_year: "{target_year.value}"

  - id: ask/how-old-discourse-group-now
    # "How old are they now?" returns one labelled age for every member of
    # the exact prior referential-subject group. The subject-case pronoun is
    # deliberately separate from object-case `them`; the current-moment
    # category is deliberately narrower than yesterday/tomorrow. `now` only
    # supplies a relative coordinate here: the caller must provide the
    # absolute reference year, so replay and benchmarks never read a hidden
    # wall clock.
    match:
      question:
        - {lit: how}
        - {lit: old}
        - {slot: verb, cat: plural_copula}
        - {slot: group, cat: discourse_subject_group_pronoun}
        - {slot: when, cat: temporal_marker}
    resolves:
      consumer: age-at-year
      holders: "{group.group_members}"
      measure: year
      target_marker: "{when}"

  - id: ask/what-combined-age-at-year
    # "What was their combined age in 2020?" binds the possessive to the
    # exact prior referential-subject group, projects every member to the
    # explicit integral year, and only then requests a sum. The prenominal
    # marker category admits "combined age" and "total age" without also
    # accepting postpositive "together age"/"altogether age" surfaces.
    match:
      question:
        - {lit: what, at_start: true}
        - {slot: verb, cat: copula}
        - {slot: group, cat: plural_possessive_determiner}
        - {slot: agg, cat: prenominal_group_total_marker}
        - {slot: noun, cat: age_noun}
        - {lit: in}
        - {slot: target_year, type: number, standalone: true, integer: true}
    resolves:
      consumer: age-at-year
      holders: "{group.group_members}"
      measure: year
      target_year: "{target_year.value}"
      aggregate: sum

  - id: ask/how-old-is-possessed
    # "How old is her child?" and "How old is Mary's child?" query the
    # exact owner-qualified animate noun. The optional determiner supports
    # the two-unit pronoun form; apostrophe-s possession is already one
    # owner-tagged noun unit. A different owner's same-headed noun is never
    # used as a fallback.
    match:
      question:
        - {lit: how}
        - {lit: old}
        - {slot: verb, cat: state}
        - opt:
            - {slot: poss_det, cat: possessive_determiner}
        - {slot: who, cat: animate, possessed: true}
    resolves:
      consumer: single-entity
      entity: "{who}"
      entity_owner: "{who.owner}"
      measure: year
      verb: "{verb}"

  - id: ask/how-many-years-old-is
    # Unit-explicit age question: "how many years old is Rachel?" It resolves
    # the same `year` measure as the shorter "how old" form. Their literal
    # word order keeps the rules separate.
    match:
      question:
        - {lit: how}
        - {lit: many}
        - {lit: years}
        - {lit: old}
        - {slot: verb, cat: state}
        - {slot: who, type: name}
    resolves:
      consumer: single-entity
      entity: "{who}"
      measure: year
      verb: "{verb}"

  - id: ask/how-old-will-be-projected
    # Projected age question: "how old will Rachel be in 8 years?" or
    # "after 8 years?" The consumer adds the counted offset to Rachel's
    # current age. The preposition category covers both wordings.
    match:
      question:
        - {lit: how}
        - {lit: old}
        - {slot: aux, type: future_modal}
        - {slot: who, type: name}
        - {lit: be}
        - {slot: prep, cat: preposition}
        - {slot: n, type: counted}
    resolves:
      consumer: age-projected
      entity: "{who}"
      offset: "{n.value}"
      # constitution rule 1: the DATA measure the stated-age rule commits
      # to, read by the age-projected consumer from query["measure"] —
      # never a hardcoded Python literal, exactly as ask/how-old-is does.
      measure: year

  - id: ask/how-old-will-be-projected-from-now
    # Projected-age form with a trailing anchor: "how old will Rachel be
    # 8 years from now?" It uses the same age-plus-offset consumer.
    match:
      question:
        - {lit: how}
        - {lit: old}
        - {slot: aux, type: future_modal}
        - {slot: who, type: name}
        - {lit: be}
        - {slot: n, type: counted}
        - {lit: from}
        - {lit: now}
    resolves:
      consumer: age-projected
      entity: "{who}"
      offset: "{n.value}"
      measure: year

  - id: ask/how-many-unit-dimension-is
    # Unit-qualified dimension question: "how many inches tall is Jake?"
    # The adjective identifies a dimension frame and the stated unit selects
    # the exact measure. Do not add a unit-less sibling such as "how tall is
    # Jake?" An elided measure can confuse physical dimensions with duration
    # or other meanings; requiring the unit makes the rule safe.
    match:
      question:
        - {lit: how}
        - {lit: many}
        - {slot: item, type: noun}
        - {slot: adj, cat: dimension_adjective}
        - {slot: verb, cat: state}
        - {slot: who, type: name}
    resolves:
      consumer: single-entity
      entity: "{who}"
      measure: "{item}"
      verb: "{verb}"

  - id: ask/is-membership
    # `at_start` marks this 'is' as the FRONTED AUXILIARY, and it is load-bearing
    # grammar, not tuning. English inverts subject and auxiliary to ask ("IS Mary
    # a student?"), so here the subject FOLLOWS the copula — which is the only
    # reason `is <name> <noun>` reads a membership question at all.
    #
    # An EMBEDDED DECLARATIVE leaves the copula in place ("...that Jim is a
    # Knicks player"), so its subject PRECEDES it. Unanchored, this shape floated
    # onto that construction and bound the complement's proper-noun modifier
    # ('Knicks') as the member, dropping the real subject entirely — answering
    # about the Knicks a question asked about Jim. Two grammars, one token run.
    match:
      question:
        - {lit: is, at_start: true}
        # blocks_skipped: an INDEFINITE article before the member marks an
        # existential ("Is a Czech a spy?"), never a reference. The
        # `indefinite_article` category lives in the scratch logic pack
        # ONLY, so every benchmark registry is a no-op by construction.
        - {slot: member, type: name, blocks_skipped: indefinite_article}
        - {slot: coll, type: noun}
    resolves:
      consumer: membership-verdict
      member: "{member}"
      # `.qualified` (patterns._slot_value): the full modifier+head phrase,
      # falling back to the bare lemma for a plain noun — a qualified
      # question ("Is Rex a CHOCOLATE dog?") queries the qualified fact key
      # and can never be satisfied by the bare-head fact alone.
      collection: "{coll.qualified}"

  - id: ask/how-many-capacity
    # Purchase capacity question: "how many pens can Mary buy with £10?"
    # The consumer divides a budget by a unit price, so the verb must be in
    # the narrow `purchase` category. Do not widen it to every verb or to the
    # broader `acquire` category: reading, receiving, earning, or merely
    # having an item does not imply that money was spent.
    match:
      question:
        - {lit: how}
        - {lit: many}
        - {slot: item, type: noun}
        - {slot: modal, type: modal}
        - {slot: who, type: entity}
        - {slot: verb, cat: purchase}
        - opt:
            - {lit: with}
            - {slot: budget, type: counted}
    resolves:
      consumer: capacity
      entity: "{who}"
      item: "{item}"
      budget_value: "{budget.value}"

  - id: ask/how-many-partition
    match:
      question:
        - {lit: how}
        - {lit: many}
        - {slot: item, type: noun}
        - {slot: verb, type: verb}
        - {slot: attr, type: adjective}
    resolves:
      consumer: partition-complement
      item: "{item}"
      attribute: "{attr}"
      negated: "false"

  - id: ask/how-many-partition-negated
    match:
      question:
        - {lit: how}
        - {lit: many}
        - {slot: item, type: noun}
        - {slot: verb, type: verb}
        - {lit: not}
        - {slot: attr, type: adjective}
    resolves:
      consumer: partition-complement
      item: "{item}"
      attribute: "{attr}"
      negated: "true"

  - id: ask/how-many-attribute-partition-in-place
    # Prenominal partition question: "how many grey cats are in this house?"
    # The adjective and noun have already merged into one `qualified` unit,
    # so `item.qualifier` supplies the attribute. A qualified noun also fits
    # the general in-place rule; this rule's id intentionally sorts first so
    # the attribute is preserved. An unqualified noun cannot match here.
    match:
      question:
        - {lit: how}
        - {lit: many}
        - {slot: item, type: qualified}
        - {slot: verb, type: verb}
        - {slot: prep, cat: preposition}
        - {slot: place, type: noun}
    resolves:
      consumer: partition-complement
      item: "{item}"
      attribute: "{item.qualifier}"
      negated: "false"

  - id: ask/how-many-attribute-partition-there
    # Entity-less qualified partition: "how many grey cats are there?" As
    # above, the rule id sorts before the bare "there" rule so the modifier
    # is preserved.
    match:
      question:
        - {lit: how}
        - {lit: many}
        - {slot: item, type: qualified}
        - {slot: verb, type: verb}
        - {lit: there}
    resolves:
      consumer: partition-complement
      item: "{item}"
      attribute: "{item.qualifier}"
      negated: "false"

  - id: ask/how-many-of-collection-are-label
    # Partitive label question: "how many of the children are girls?" The
    # collection is consumed as sentence structure; the label is the measure
    # to resolve for one unique holder. Complement labels may come from a
    # synthesized partition fact. The verb must be copular because this is a
    # membership statement, not a general action.
    match:
      question:
        - {lit: how}
        - {lit: many}
        - {lit: of}
        - {slot: collection, type: noun}
        - {slot: verb, cat: state}
        - {slot: label, type: noun}
    resolves:
      consumer: unique-entity
      measure: "{label}"

  - id: ask/how-many-more-goal-need
    match:
      question:
        - {lit: how}
        - {lit: many}
        - {slot: dir, cat: delta}
        - {slot: item, type: noun}
        - {slot: aux, type: auxiliary}
        - {slot: who, type: name}
        - {slot: verb, cat: need_ask_verb}
    resolves:
      consumer: deficit
      entity: "{who}"
      measure: "{item}"

  - id: ask/how-much-money-entity-left
    # Remaining-money question: "how much money does Ian have left?" The
    # consumer subtracts Ian's priced purchases from one stated holding. The
    # verb must describe a state, because an event total is not a valid
    # starting balance. The optional "in UNIT" phrase requires the result to
    # use that currency unit. The word "left" makes this more specific than a
    # plain money-holding question.
    match:
      question:
        - {lit: how}
        - {lit: much}
        - {lit: money}
        - opt:
            - {lit: in}
            - {slot: req_unit, type: noun}
        # Accept ordinary and will/would forms, but not capacity modals.
        - {slot: aux, type: future_modal}
        - {slot: who, type: entity}
        - {slot: verb, cat: state}
        - {lit: left}
    resolves:
      consumer: money-left
      entity: "{who}"
      measure: currency
      req_unit: "{req_unit}"

  - id: ask/how-much-change
    # Change question: "how much change did Ana get back?" The consumer
    # subtracts priced purchases from the tendered amount. Any unpriced or
    # split-cost purchase makes it decline. The answer does not depend on
    # whether the question says get, receive, or take, so the verb remains
    # general; "back" is optional.
    match:
      question:
        - {lit: how}
        - {lit: much}
        - {lit: change}
        - {slot: aux, type: future_modal}
        - {slot: who, type: entity}
        - {slot: verb, type: verb}
        - opt:
            - {lit: back}
    resolves:
      consumer: change
      entity: "{who}"

  - id: ask/how-much-item-cost
    # "how much do/does/did ITEM cost" — the item-SUBJECT cost ask (mining
    # candidate item-cost-asks): the item is the grammatical subject of
    # 'cost' itself, never a name (there is no `who` slot at all), so this
    # can never collide with the how-much-noun-entity family ("how much
    # money does Tom have"), which needs item, THEN aux, THEN a name, THEN
    # a general verb — a different token order entirely. The verb is
    # gated to the EXISTING `price_verb` category (cost/costs, increment
    # 15) rather than the general `verb` type, so an unrelated "how much
    # do the shirts weigh" never reaches the item-cost consumer.
    match:
      question:
        - {lit: how}
        - {lit: much}
        - {slot: aux, type: auxiliary}
        - {slot: item, type: noun}
        - {slot: verb, cat: price_verb}
    resolves:
      consumer: item-cost
      item: "{item}"

  - id: ask/how-much-pay-for-quantity
    # Cost for a stated quantity: "how much did Ana pay for 4 shirts?" The
    # consumer multiplies the question's count by the item's unique price and
    # checks cost-splitting constraints. `spend_target_prep` is limited to
    # "for" and "on" so a time-span question such as "pay in 3 months" is
    # not misrouted.
    #
    # The subjectless form "how much does it cost to buy 4 shirts?" remains
    # unsupported because the noun and verb readings of "cost" are ambiguous
    # in that structure.
    match:
      question:
        - {lit: how}
        - {lit: much}
        # Accept ordinary and will/would forms, but not capacity modals.
        - {slot: aux, type: future_modal}
        - {slot: who, type: name}
        - {slot: verb, cat: spend_verb}
        - {slot: prep, cat: spend_target_prep}
        - {slot: qty, type: counted}
    resolves:
      consumer: cost-of-quantity
      entity: "{who}"
      item: "{qty}"
      qty_value: "{qty.value}"

  - id: ask/how-much-each-item-cost
    # Unit-price question with "each". When no individual Price fact exists,
    # the consumer recovers the unit price from the stated purchase total.
    # The required "each" keeps this separate from a direct item-cost lookup.
    match:
      question:
        - {lit: how}
        - {lit: much}
        - {slot: aux, type: auxiliary}
        - {lit: each}
        - {slot: item, type: noun}
        - {slot: verb, cat: price_verb}
    resolves:
      consumer: unit-price-from-total
      item: "{item}"

  - id: ask/what-is-the-cost-of-quantity
    # Cost question with a stated quantity: "what is the cost of 2 pans?"
    # The consumer recovers the unit price from the purchase total, then
    # multiplies it by `qty_value`.
    match:
      question:
        - {lit: what}
        - {slot: be, cat: state}
        - {lit: cost}
        - {lit: of}
        - {slot: qty, type: counted}
    resolves:
      consumer: unit-price-from-total
      item: "{qty}"
      qty_value: "{qty.value}"

  - id: ask/what-total-combined
    # Copular total question: "what is the total number of books that they
    # have?" The frame noun and trailing pronoun clause are optional. Named
    # or counted subjects need other rules with explicit holder binding. If
    # the verb is omitted, the combined consumer defaults to "have".
    match:
      question:
        # no literal 'the': article is a globally-skippable sense
        # (patterns.SKIPPABLE_SENSES), so a required 'the' token could
        # never match anyway — skip advances past it before any literal
        # comparison runs, same as every other ask in this file (none of
        # them spell 'the' out either).
        - {lit: what}
        - {slot: be, cat: state}
        - {lit: total}
        - opt:
            - {slot: agg_noun, cat: aggregate_noun}
            - {lit: of}
        - {slot: item, type: noun}
        - opt:
            - opt:
                - {lit: that}
            - {slot: who, type: pronoun}
            - {slot: verb, type: verb}
    resolves:
      consumer: combined
      measure: "{item}"
      verb: "{verb}"

  - id: ask/what-total-combined-contracted
    # Contracted form of the preceding rule. The tokenizer keeps "'s" as its
    # own token rather than resolving it as a state verb. Matching it literally
    # here avoids widening the shared `state` category for every other rule.
    match:
      question:
        - {lit: what}
        - {lit: "'s"}
        - {lit: total}
        - opt:
            - {slot: agg_noun, cat: aggregate_noun}
            - {lit: of}
        - {slot: item, type: noun}
        - opt:
            - opt:
                - {lit: that}
            - {slot: who, type: pronoun}
            - {slot: verb, type: verb}
    resolves:
      consumer: combined
      measure: "{item}"
      verb: "{verb}"

  - id: ask/what-average-combined
    # Average form of the preceding total question. It enumerates at least
    # two holders, sums their values, and divides by the holder count. The
    # literal "average" keeps it separate from "total". Weighted averages
    # and per-unit rates decline because they do not provide the required set
    # of per-holder quantities.
    match:
      question:
        - {lit: what}
        - {slot: be, cat: state}
        - {lit: average}
        - opt:
            - {slot: agg_noun, cat: aggregate_noun}
            - {lit: of}
        - {slot: item, type: noun}
        - opt:
            - opt:
                - {lit: that}
            - {slot: who, type: pronoun}
            - {slot: verb, type: verb}
    resolves:
      consumer: average
      measure: "{item}"
      verb: "{verb}"

  - id: ask/what-average-combined-contracted
    # Same class as ask/what-average-combined, for the "what's" contraction
    # — mirrors ask/what-total-combined-contracted's own rationale for why
    # this needs a separate ask id rather than widening 'state' to admit
    # the literal "'s" token.
    match:
      question:
        - {lit: what}
        - {lit: "'s"}
        - {lit: average}
        - opt:
            - {slot: agg_noun, cat: aggregate_noun}
            - {lit: of}
        - {slot: item, type: noun}
        - opt:
            - opt:
                - {lit: that}
            - {slot: who, type: pronoun}
            - {slot: verb, type: verb}
    resolves:
      consumer: average
      measure: "{item}"
      verb: "{verb}"

  - id: ask/imperative-combined-dimension
    # Imperative dimension total: "calculate their combined height" or
    # "determine the combined weight of the three". `dimension_noun` names
    # a dimension rather than a unit, so `dimension_measure` resolves the
    # compatible measure from the facts. The optional cardinal supplies an
    # expected holder count. "combined" is literal so this rule cannot be
    # confused with the average form below.
    match:
      question:
        - {slot: verb, cat: compute_verb}
        - opt:
            - {slot: who, type: pronoun}
        - {lit: combined}
        - {slot: item, cat: dimension_noun}
        - opt:
            - {lit: of}
            - {slot: n, type: number}
    resolves:
      consumer: combined
      measure: "{item}"
      dimension_measure: "true"
      holder_count: "{n.value}"

  - id: ask/imperative-single-dimension
    # Imperative single-holder dimension: "calculate the age of Arden".
    # `dimension_noun` names the dimension while `dimension_measure` asks the
    # single-entity consumer to resolve the compatible concrete measure from
    # Arden's facts (for age, normally `year`).  This is intentionally a
    # separate rule from the combined/average asks: no aggregate word is
    # present and exactly one explicit holder is selected.  The optional
    # coordinated tail is captured only so the consumer can decline it rather
    # than answering a prefix about the first holder.
    match:
      question:
        - {slot: cue, cat: compute_verb}
        - {lit: the, consume_skipped: true}
        - {slot: item, cat: dimension_noun}
        - {lit: of}
        - {slot: who, type: entity, referential: true, bare_reference_category: bare_entity_reference}
        - opt:
            - {lit: and}
            - {slot: other, type: entity, referential: true, bare_reference_category: bare_entity_reference}
    resolves:
      consumer: single-entity
      entity: "{who}"
      measure: "{item}"
      dimension_measure: "true"
      other_entity: "{other}"

  - id: ask/imperative-average-dimension
    # Average counterpart to the preceding imperative total rule. The literal
    # "average" selects the average consumer and prevents overlap with
    # "combined".
    match:
      question:
        - {slot: verb, cat: compute_verb}
        - opt:
            - {slot: who, type: pronoun}
        - {lit: average}
        - {slot: item, cat: dimension_noun}
        - opt:
            - {lit: of}
            - {slot: n, type: number}
    resolves:
      consumer: average
      measure: "{item}"
      dimension_measure: "true"
      holder_count: "{n.value}"

  - id: ask/how-long-is-total-dimension
    # Total-duration question: "how long is the total tape?" `long` is a
    # literal here and resolves through `time_measure`. Do not add it to the
    # general dimension-adjective category: without an explicit duration
    # context it can mean physical length or experience. The required "total"
    # authorizes summing the duration holders. `item` only consumes the head
    # noun; it is not used as the measure.
    match:
      question:
        - {lit: how}
        - {lit: long}
        - {slot: verb, cat: state}
        - {lit: total}
        - {slot: item, type: noun}
    resolves:
      consumer: combined
      measure: time_measure
      dimension_measure: "true"
      verb: "{verb}"
