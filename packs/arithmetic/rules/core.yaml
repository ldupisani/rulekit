      carries plural morphology). Same AFFINE shape: subject = k·standard
      + n·sign(dir). `who`/`std, type: name`: unwidened, matching times-
      as-much's own (not-yet-widened) slot type. Increment 46 (affine-
      relations-recut) only ever built the affine-offset prefix onto the
      COUNT/'as many' form; this closes the MASS/'as much' gap the
      relation-standard-frames candidate's own structural sample names
      directly. PROVEN minimal pair on unmodified main: "250 less than
      twice as many dollars as Cecil" commits while "250 less than twice
      as much money as Cecil" declines outright. As in the non-affine mass
