format: rulekit/rules@1
# Authoring principles
#
# Keep literal text to the grammatical frame. Capture content words in typed
# or category-gated slots. Read rules emit facts; later stages combine those
# facts and answer questions. Rule order does not set priority.
#
# A relation standard may include a short description before a proper name:
# "than his friend Sam" or "than her sister, Gigi". In that case,
# `appos_det` and `appos_role` consume the description and `std` binds the
# name. If no description is present, `std` may still bind any supported
# entity. `bound_requires_type` prevents an unfinished description such as
# "than his sister" from being treated as a complete standard.
#
# A comparative measure may include a location before "as" or "than":
# "twice as many shoes in his wardrobe as belts". The optional PP is part of
# the sentence structure but does not add fields to the emitted fact. Its noun
# must be referential, unless its category explicitly allows a bare PP object.
# Because "as" and "than" are particles, they cannot be mistaken for the
# optional preposition.
#
# Complete nominal comparisons use the positive `quantity_comparison_verb`
# boundary. Older comparison families retain their established vocabulary
# contracts and exclude intransitive processes through semantic categories.
# Category-owned selectional frames further constrain actors and objects;
# mixture recovery retains its own source and conservation evidence.
rules:
  - id: arithmetic/anchored-relation
    phase: read
    description: >
      "X has N more/fewer ITEM than Y" — a Relation fact; the relation
      synthesizer resolves it against Y's known quantity. `who`/`std,
      type: entity` (mining candidate common-noun-relation-subjects):
      widened from `type: name` so a definite/possessive common-noun
      subject or standard ("Her cousin has 6 fewer rubber bands than he
      has") can anchor a relation too — the fold and the combined-ask
      consumer already resolve entity keys generally (a bare common-noun
      holding folds fine on its own); only the relation rules themselves
      required a name. `distinct_measure: [item, std]` (mining candidate
      qualified-measure-keys, patterns.py's qualifier-aware sibling of
      `distinct`) blocks a DIFFERENT collision the widening opens up: "has
      2 fewer animal stickers than flower stickers" bare-folds `item` and
      `std` to the SAME measure lemma ('sticker') with the SAME (absent)
      qualifier on both sides — that sentence compares two MEASURES of the
      speaker's own holding (elliptical for "than [he has] flower
      stickers"), not two holders' quantities of one measure, and must
      keep declining rather than mint a self-referential Relation whose
      standard IS the measure being counted. A pair that shares the lemma
      but carries two DIFFERENT non-null qualifiers ("12 more GREEN apples
      than RED apples") is NOT that self-reference — it is two
      attribute-qualified variants of the SAME holder's own measure — and
      is deliberately let through: `measure_qualifier`/`standard_qualifier`
      below carry each side's own qualifier so saturate.py's same-holder
      subtype branch can resolve the standard against the SPECIFIC
      qualified sibling and tag the derived quantity with its own
      qualifier, letting facts.py's existing measure-qualifier collision
      split (increment 70) re-key both cleanly instead of colliding.
    match:
      sentence:
        - {slot: who, type: entity, common_noun_cat: quantity_holder, referential: true, bare_reference_category: bare_entity_reference}
        - {slot: verb, type: verb, finite_form: true}
        - {slot: n, type: number}
        - {slot: dir, cat: delta}
        - {slot: item, type: plural}
        - opt:
            - {slot: pp_prep, cat: preposition}
            - opt:
                - {slot: pp_det, cat: possessive_determiner}
            - {slot: pp_obj, type: noun, referential: true, bare_reference_category: bare_pp_object, determinerless_category: named_calendar_period}
        - {lit: than}
        - opt:
            - {slot: appos_det, cat: animate_possessive_determiner}
            - {slot: appos_role, cat: animate}
        - {slot: std, type: entity, referential: true, bare_reference_category: bare_entity_reference}
        - opt:
            # A repeated predicate may finish a holder comparison. An overt
            # object after it belongs to the fuller item-comparison reader.
            - {slot: standard_tail_verb, type: verb, finite_form: true}
            - opt:
                - {slot: standard_tail_item, type: noun}
        - opt:
            # Negative lookahead for the fuller same-clause anchor shape.
            # A bare coordinated next clause ("..., and Karen has ...") is
            # independent and must not suppress this relation.
            - {lit: and}
            - opt:
                - {slot: conjunction_adv, cat: holding_anchor_adverb}
            - {slot: conjunction_verb, cat: state}
            - {slot: conjunction_seen, type: counted}
    where:
      - slot_not_category: {slot: standard_tail_verb, cat: intransitive_process_verb}
      - slot_not_category: {slot: verb, cat: intransitive_process_verb}
      - bound_requires_type: {bound: appos_role, slot: std, type: proper_name}
      - number_compatible: [who, verb]
      - number_compatible: [std, standard_tail_verb]
      - verb_roles_compatible:
          verb: verb
          roles:
            actor: [who, std]
            theme: [item]
          # The legacy rule already carries construction-local guards for its
          # other verb families. Opt this complete category-owned frame into
          # the one reviewed gap without replacing teaching's deliberately
          # broader animate-object contract.
          frame_categories: [initiation_quantity_verb]
          allow_proper_name: [who, std]
          allow_plural_class: [std]
      - verb_role_compatible: {verb: verb, roles: [who, std], verb_cat: animate_subject_verb, role_cat: quantity_event_participant}
      - verb_role_compatible: {verb: verb, roles: [item], verb_cat: animate_object_verb, role_cat: quantity_event_participant}
      - verb_role_compatible: {verb: verb, roles: [item], verb_cat: find_quantity_verb, role_cat: findable_quantity_object}
      - verb_role_compatible: {verb: verb, roles: [who], verb_cat: transfer_out, role_cat: quantity_event_participant}
      - verb_role_compatible: {verb: verb, roles: [who, std], verb_cat: task_completion_verb, role_cat: quantity_event_participant}
      - verb_role_compatible: {verb: verb, roles: [item], verb_cat: task_completion_verb, role_cat: finishable_quantity_object}
      - verb_role_compatible: {verb: verb, roles: [who], verb_cat: past_departure_quantity_verb, role_cat: quantity_event_participant}
      - verb_role_compatible: {verb: verb, roles: [item], verb_cat: past_departure_quantity_verb, role_cat: transferable_quantity_object}
      - measure_holder_compatible: {measure: item, holders: [who], allow_proper_name: true, when_declared: true}
      - slot_not_category: {slot: verb, cat: non_quantity_object_verb}
      - slot_not_category: {slot: verb, cat: goal_predicate}
      - slot_not_category: {slot: who, cat: non_quantity_holder}
      - slot_not_category: {slot: std, cat: non_quantity_holder}
      - slot_not_category: {slot: item, cat: many_incompatible_noun}
      - slot_not_category: {slot: dir, cat: age_comparative}
      - attribute_compatible: {attribute: pp_prep, noun: pp_obj}
      - modifier_host_compatible: {modifier: pp_prep, host: item, object: pp_obj}
      - distinct: [who, std]
      - category_nonoverlap: [who, std]
      - distinct_measure: [item, std]
      # a TIME PERIOD is not a holder — see slot_not_category in schemas.py
      - slot_not_category: {slot: std, cat: timeperiod}
      - unbound: [conjunction_seen, standard_tail_item]
    generation_where:
      - same_lemma: [verb, standard_tail_verb]
    satisfies:
      n: [quantifies]
    consumes: [n]
    emits:
      - fact: relation
        subject: "{who}"
        standard: "{std}"
        measure: "{item}"
        measure_qualifier: "{item.qualifier}"
        standard_qualifier: "{std.qualifier}"
        factor: 1.0
        offset: "n * sign(dir)"
        verb: "{verb}"
        subject_label: "{who.label}"
        standard_label: "{std.label}"
        subject_owner: "{who.owner}"
        standard_owner: "{std.owner}"

  - id: arithmetic/anchored-relation-conjoined-measures
    phase: read
    description: >
      "Jake has 6 fewer peaches and 8 more apples than Steven" — the
      CONJOINED-MEASURE sibling of arithmetic/anchored-relation. That rule
      requires `than` after a SINGLE `item` (modulo its PP tail), so a
      second "and N DIR ITEM" conjunct before the `than` fails its match
      outright and the sentence mints NO relation at all — not one
      relation plus a dropped conjunct, but nothing. Both conjuncts share
      the ONE trailing standard ("...than Steven" scopes over both), so
      this emits two Relations differing only in measure/offset.

      The SAME asymmetry the conjoined existential closed: the engine's
      conjunction handling is per-construction, and each construction has
      to earn it. Strictly longer than arithmetic/anchored-relation, so
      the single-conjunct sentence is untouched.

      GUARDS INHERITED VERBATIM, once per conjunct: `distinct: [who, std]`
      (a relation to oneself is a misread, never a fact) and
      `distinct_measure` on BOTH item/std and item2/std — the self-
      reference that guard blocks ("2 fewer animal stickers than flower
      stickers", an elliptical MEASURE comparison on one holder) can
      appear in either conjunct independently, so a single check would
      leave the other conjunct unguarded.
    match:
      sentence:
        - {slot: who, type: entity, common_noun_cat: quantity_holder}
        - {slot: verb, type: verb, finite_form: true}
        - {slot: n, type: number}
        - {slot: dir, cat: count_quantity_delta}
        - {slot: item, type: plural}
        - {lit: and}
        - {slot: n2, type: number}
        - {slot: dir2, cat: count_quantity_delta}
        - {slot: item2, type: plural}
        - {lit: than}
        - {slot: std, type: entity, common_noun_cat: quantity_holder}
    where:
      - slot_not_category: {slot: verb, cat: intransitive_process_verb}
      - number_compatible: [who, verb]
      - verb_roles_compatible:
          verb: verb
          roles:
            actor: [who, std]
            theme: [item, item2]
          allow_proper_name: [who, std]
          allow_plural_class: [who, std]
      - verb_role_compatible: {verb: verb, roles: [who], verb_cat: quantity_event_verb, role_cat: quantity_event_participant}
      - verb_role_compatible: {verb: verb, roles: [std], verb_cat: quantity_event_verb, role_cat: quantity_event_participant, allow_plural_class: true}
      - slot_not_category: {slot: verb, cat: non_quantity_object_verb}
      - slot_not_category: {slot: who, cat: non_quantity_holder}
      - slot_not_category: {slot: std, cat: non_quantity_holder}
      - slot_not_category: {slot: item, cat: many_incompatible_noun}
      - slot_not_category: {slot: item2, cat: many_incompatible_noun}
      - slot_not_category: {slot: dir, cat: age_comparative}
      - slot_not_category: {slot: dir2, cat: age_comparative}
      - distinct: [who, std]
      - category_nonoverlap: [who, std]
      - distinct_measure: [item, std]
      # a TIME PERIOD is not a holder — see slot_not_category in schemas.py
      - slot_not_category: {slot: std, cat: timeperiod}
      - distinct_measure: [item2, std]
    satisfies: {n: [quantifies], n2: [quantifies]}
    consumes: [n, n2]
    emits:
      - fact: relation
        subject: "{who}"
        standard: "{std}"
        measure: "{item}"
        measure_qualifier: "{item.qualifier}"
        standard_qualifier: "{std.qualifier}"
        factor: 1.0
        offset: "n * sign(dir)"
        verb: "{verb}"
        subject_label: "{who.label}"
        standard_label: "{std.label}"
        subject_owner: "{who.owner}"
        standard_owner: "{std.owner}"
      - fact: relation
        subject: "{who}"
        standard: "{std}"
        measure: "{item2}"
        measure_qualifier: "{item2.qualifier}"
        standard_qualifier: "{std.qualifier}"
        factor: 1.0
        offset: "n2 * sign(dir2)"
        verb: "{verb}"
        subject_label: "{who.label}"
        standard_label: "{std.label}"
        subject_owner: "{who.owner}"
        standard_owner: "{std.owner}"

  - id: arithmetic/anchored-relation-possessive-kinship-standard
    phase: read
    description: >
      mining candidate relation-standard-frames: "Her sister has 8 more
      pencils than their grandmother" — the POSSESSIVE-KINSHIP sibling of
      arithmetic/anchored-relation: the standard is a bare POSSESSIVE-
      DETERMINER + common-noun NP ("their grandmother") with NO trailing
      name at all, unlike the appositive prefix documented at the top of
      this file ("than his friend Sam") which always expects a NAME to
      follow the [pronoun, noun] pair. `std_det, type: pronoun`
      (unconditional, same sense gate as every other appositive-prefix use
      in this file) is mandatory here, never optional — this rule exists
      ONLY for the determiner+noun shape. `standard: "{std}"` reads the
      noun head while `standard_owner` preserves the determiner's owner.
      It therefore joins "their grandmother" to the same owner-qualified
      noun elsewhere without borrowing another person's grandmother. When
      a name DOES follow ("than their grandmother Rosa"), arithmetic/
      anchored-relation's own longer appositive-prefix match consumes MORE
      tokens (through the name) and this rule's shorter match is dropped
      by `subsumes` (facts.py) exactly the way the file's other "bare vs.
      fuller" sibling pairs already rely on (e.g. arithmetic/times-as-
      many-elided-standard vs. arithmetic/times-as-many).
    match:
      sentence:
        - {slot: who, type: entity, common_noun_cat: quantity_holder, referential: true, bare_reference_category: bare_entity_reference}
        - {slot: verb, type: verb, finite_form: true}
        - {slot: n, type: number}
        - {slot: dir, cat: delta}
        - {slot: item, type: plural}
        - opt:
            - {slot: pp_prep, cat: preposition}
            - opt:
                - {slot: pp_det, cat: possessive_determiner}
            - {slot: pp_obj, type: noun, referential: true, bare_reference_category: bare_pp_object, determinerless_category: named_calendar_period}
        - {lit: than}
        - {slot: std_det, cat: possessive_determiner}
        - {slot: std, cat: animate}
    where:
      - slot_not_category: {slot: verb, cat: intransitive_process_verb}
      - number_compatible: [who, verb]
      - verb_role_compatible: {verb: verb, roles: [who], verb_cat: quantity_event_verb, role_cat: quantity_event_participant}
      - verb_role_compatible: {verb: verb, roles: [std], verb_cat: quantity_event_verb, role_cat: quantity_event_participant, allow_plural_class: true}
      - verb_roles_compatible:
          verb: verb
          roles:
            actor: [who, std]
            theme: [item]
          allow_proper_name: [who, std]
          allow_plural_class: [std]
      - verb_role_compatible: {verb: verb, roles: [who, std], verb_cat: animate_subject_verb, role_cat: quantity_event_participant}
      - verb_role_compatible: {verb: verb, roles: [item], verb_cat: animate_object_verb, role_cat: quantity_event_participant}
      - verb_role_compatible: {verb: verb, roles: [who], verb_cat: past_departure_quantity_verb, role_cat: quantity_event_participant}
      - verb_role_compatible: {verb: verb, roles: [item], verb_cat: past_departure_quantity_verb, role_cat: transferable_quantity_object}
      - slot_not_category: {slot: verb, cat: non_quantity_object_verb}
      - slot_not_category: {slot: who, cat: non_quantity_holder}
      - slot_not_category: {slot: item, cat: many_incompatible_noun}
      - slot_not_category: {slot: dir, cat: age_comparative}
      - attribute_compatible: {attribute: pp_prep, noun: pp_obj}
      - modifier_host_compatible: {modifier: pp_prep, host: item, object: pp_obj}
      - distinct: [who, std]
      - category_nonoverlap: [who, std]
      - distinct_measure: [item, std]
      # a TIME PERIOD is not a holder — see slot_not_category in schemas.py
      - slot_not_category: {slot: std, cat: timeperiod}
    satisfies: {n: [quantifies]}
    consumes: [n]
    emits:
      - fact: relation
        subject: "{who}"
        standard: "{std}"
        measure: "{item}"
        measure_qualifier: "{item.qualifier}"
        standard_qualifier: "{std.qualifier}"
        factor: 1.0
        offset: "n * sign(dir)"
        verb: "{verb}"
        subject_label: "{who.label}"
        standard_label: "{std.label}"
        subject_owner: "{who.owner}"
        standard_owner: "{std.owner}"

  - id: arithmetic/anchored-relation-conjoined-anchor
    phase: read
    description: >
      mining candidate cross-measure-relation-fixes: "Clinton has 2 more
      belts than hats AND CURRENTLY HAS 5 hats" — arithmetic/anchored-
      relation's own "N more/fewer ITEM than STD" clause, immediately
      followed by a CONJOINED trailing clause that states the STANDARD's
      own quantity. This is the state-verb conjunction gap (increment 35)
      reaching a RELATION-bearing clause, a shape increment 35 never
      covered: that walker (learn.py's `_conjoined_purchase_items`)
      recovers a second BARE-NOUN conjunct of the SAME verb ("has 3
      apples and 5 oranges"), not a second FULL clause with its own
      elided subject and its own verb. Left to the general fold, the
      trailing clause's elided subject wrongly adjacency-binds to the
      NEAREST preceding noun — the relation's own standard noun ("hats"),
      not the sentence's real subject (obligations.py's `_candidates`
      picks the strictly-nearer candidate) — a latent
      Quantity(entity='hat', measure='hat', ...) that answers nothing
      today but would silently misattribute the anchor were anything ever
      to query it. Rather than touch that shared adjacency arbitration
      (used by every verb's subject binding — HANDOFF's own "never widen
      a shared scan globally" lesson), this rule matches the WHOLE
      conjoined sentence structurally and emits TWO facts: the ordinary
      Relation (byte-identical to anchored-relation's own) plus a
      same-holder Quantity for `who`'s own STANDARD measure — exactly the
      shape saturate.py's SAME-HOLDER SUBTYPE branch already resolves
      (`quantities.get((rel.subject, rel.standard))`), so "hats" anchors
      the relation with ZERO saturate.py change. The trailing count+noun
      ("5 hats") condenses to a SINGLE merged unit (the same `type:
      counted` shape anchored-relation-postfix's own item slot uses), so
      it needs its OWN slot name (`std_echo`) rather than reusing `std` —
      `where: same_lemma: [std, std_echo]` is the cross-slot equality
      check instead (patterns.py's pre-existing predicate), so "...than
      hats and currently has 5 BELTS" (a different noun) fails this rule
      outright rather than mis-anchoring a different measure; it stays
      declined exactly as before this candidate (only the unmodified
      anchored-relation's own Relation still fires there). `trailing_adv`
      is independently skippable and uses the narrow
      `holding_anchor_adverb` category, so temporal/aspectual forms such as
      "currently" and "still" remain available without admitting a
      directional adverb such as "off". Pack data relates those adverb
      categories to compatible possession tenses: "currently has" is valid,
      while "currently had" is not. A bare "...and has 5 hats" also matches.
      Both predicates must be the same finite possession surface. This keeps
      the relation and its anchor in one temporal and semantic frame instead
      of using a current holding to resolve an unrelated event count. The
      standard must be a complete reference, so a bare plural such as "hats"
      is valid while bare singular "egg" is not. Count nouns use the
      count-compatible direction family (`fewer`/`more`, never `less`).
      Byte-identical to plain anchored-relation when no conjoined tail
      follows 'than STD': the mandatory 'and' literal simply fails to
      match there, so only the unmodified anchored-relation rule (still
      present, untouched) ever fires on that shorter shape.
    match:
      sentence:
        - {slot: who, type: entity, common_noun_cat: quantity_holder, referential: true, bare_reference_category: bare_entity_reference}
        - {slot: verb, cat: possession_state, finite_form: true}
        - {slot: n, type: number}
        - {slot: dir, cat: count_quantity_delta}
        - {slot: item, type: plural}
        - opt:
            - {slot: pp_prep, cat: preposition}
            - opt:
                - {slot: pp_det, cat: possessive_determiner}
            - {slot: pp_obj, type: noun, referential: true, bare_reference_category: bare_pp_object, determinerless_category: named_calendar_period}
        - {lit: than}
        - opt:
            - {slot: appos_det, cat: animate_possessive_determiner}
            - {slot: appos_role, cat: animate}
        - {slot: std, type: plural}
        - {lit: and}
        - opt:
            - {slot: trailing_adv, cat: holding_anchor_adverb}
        - {slot: trailing_verb, cat: possession_state, finite_form: true}
        - {slot: std_echo, type: counted}
    where:
      - bound_requires_type: {bound: appos_role, slot: std, type: proper_name}
      - number_compatible: [who, verb]
      - number_compatible: [who, trailing_verb]
      - verb_roles_compatible:
          verb: verb
          roles:
            actor: [who]
            theme: [item]
          allow_proper_name: [who]
      - measure_holder_compatible: {measure: item, holders: [who], allow_proper_name: true, when_declared: true}
      - same_surface: [verb, trailing_verb]
      - adverb_verb_compatible: {adverb: trailing_adv, verb: trailing_verb}
      - slot_not_category: {slot: who, cat: non_quantity_holder}
      - slot_not_category: {slot: std, cat: non_quantity_holder}
      - slot_not_category: {slot: item, cat: many_incompatible_noun}
      - slot_not_category: {slot: std, cat: many_incompatible_noun}
      - slot_not_category: {slot: std_echo, cat: many_incompatible_noun}
      - slot_not_category: {slot: dir, cat: age_comparative}
      - slot_not_category: {slot: pp_prep, cat: quantity_remainder_preposition}
      - attribute_compatible: {attribute: pp_prep, noun: pp_obj}
      - modifier_host_compatible: {modifier: pp_prep, host: item, object: pp_obj}
      - bound_rejects_category: {bound: pp_det, slot: pp_obj, cat: named_calendar_period}
      - distinct: [who, std]
      - distinct: [who, pp_obj]
      - category_nonoverlap: [who, std]
      - distinct: [item, std]
      - same_lemma: [std, std_echo]
    satisfies: {n: [quantifies]}
    consumes: [n, std_echo]
    emits:
      - fact: relation
        subject: "{who}"
        standard: "{std}"
        measure: "{item}"
        factor: 1.0
        offset: "n * sign(dir)"
        verb: "{verb}"
        subject_label: "{who.label}"
        standard_label: "{std.label}"
      - fact: quantity
        entity: "{who}"
        measure: "{std_echo}"
        value: "std_echo"
        verb: "{trailing_verb}"

  - id: arithmetic/anchored-relation-elided
    phase: read
    description: >
      mining candidate elided-measure-relations: "Ben has 3 more than Ann" —
      the additive comparative with the MEASURE NOUN elided entirely (no
      "marbles"/"apples" between the delta word and 'than'; compare
      arithmetic/anchored-relation's "N more ITEM than Y"). Emits the SAME
      Relation fact shape with `measure: null` — an explicit UNRESOLVED
      sentinel, never a guess — which saturate.py's `_relations_synth`
      recovers from the STANDARD's own unique in-play quantity (the same
      unique-pool-in-play discipline synth/fraction-of-pool and synth/
      partition-of-collection already use): the standard holding exactly
      one measure resolves it; zero or two-or-more measures declines,
      never guesses (see that function's comment). This rule's sequence
      requires 'than' IMMEDIATELY after the delta word, and its number slot is
      `standalone`: the condensed counted-noun unit in "6 marbles more than"
      cannot satisfy it. Arithmetic/anchored-relation-postfix is therefore
      the only rule whose sequence matches that stated-item surface, with
      zero arbitration needed (the two spans are structurally disjoint, not
      merely differently-specific). Covers the postfix idiom too ("Ben picked 3
      more than Ann"): with the item elided, prefix and postfix comparatives
      collapse to the identical NUMBER-DELTA-'than'-STD token stream, so no
      separate postfix-elided rule is needed. `who`/`std, type: entity`:
      same widening and same self-reference guard as arithmetic/
      anchored-relation.
    match:
      sentence:
        - {slot: who, type: entity, common_noun_cat: quantity_holder, referential: true, bare_reference_category: bare_entity_reference}
        - {slot: verb, type: verb, finite_form: true}
        - {slot: n, type: number, standalone: true}
        - {slot: dir, cat: delta}
        - {lit: than}
        - opt:
            - {slot: appos_det, cat: possessive_determiner}
            - {slot: appos_role, cat: animate}
        - {slot: std, type: entity, common_noun_cat: quantity_holder, referential: true, bare_reference_category: bare_entity_reference}
    where:
      - slot_not_category: {slot: verb, cat: intransitive_process_verb}
      - bound_requires_type: {bound: appos_role, slot: std, type: proper_name}
      - number_compatible: [who, verb]
      - verb_role_compatible: {verb: verb, roles: [who], verb_cat: quantity_event_verb, role_cat: quantity_event_participant}
      - verb_role_compatible: {verb: verb, roles: [std], verb_cat: quantity_event_verb, role_cat: quantity_event_participant, allow_plural_class: true}
      - verb_roles_compatible:
          verb: verb
          roles:
            actor: [who, std]
          allow_proper_name: [who, std]
          allow_plural_class: [std]
      - slot_not_category: {slot: verb, cat: non_quantity_object_verb}
      - slot_not_category: {slot: who, cat: non_quantity_holder}
      - slot_not_category: {slot: dir, cat: age_comparative}
      - distinct: [who, std]
      - category_nonoverlap: [who, std]
    satisfies: {n: [quantifies]}
    consumes: [n]
    emits:
      - fact: relation
        subject: "{who}"
        standard: "{std}"
        measure: null
        factor: 1.0
        offset: "n * sign(dir)"
        verb: "{verb}"
        subject_label: "{who.label}"
        standard_label: "{std.label}"

  - id: arithmetic/anchored-relation-elided-standard
    phase: read
    description: >
      "Tom has 3 apples. Mary has 5 more apples." — a possession-state
      comparative states its measure but elides the comparison standard.
      This is the additive sibling of the existing multiplicative
      elided-standard rules. It emits the ordinary Relation shape with
      standard: $elided:standard$; _relations_synth resolves that sentinel
      only from the unique OTHER entity holding the same measure in an
      earlier sentence. Zero or multiple candidates decline.

      Sentence-wide negative premises require both a relational marker and a
      conjunction to be absent. That rejects every explicit-standard or
      conjoined continuation independently of how its noun phrase parses, so
      the existing fuller rules remain their sole owners. The possession-state
      requirement is intentional: "Mary buys 5 more apples" describes a
      change to Mary's own quantity, not an omitted comparison with Tom.
    match:
      sentence:
        - {slot: who, type: entity, common_noun_cat: quantity_holder, referential: true}
        - {slot: verb, cat: possession_state}
        - {slot: n, type: number, standalone: true}
        - {slot: dir, cat: delta}
        - {slot: item, cat: noun}
        - opt:
            - {slot: pp_prep, cat: preposition}
            - opt:
                - {slot: pp_det, cat: possessive_determiner}
            - {slot: pp_obj, type: noun, referential: true, bare_reference_category: bare_pp_object, determinerless_category: named_calendar_period}
    where:
      - number_compatible: [who, verb]
      - same_number: [n, item]
      - slot_not_category: {slot: verb, cat: non_quantity_object_verb}
      - slot_not_category: {slot: who, cat: non_quantity_holder}
      - slot_not_category: {slot: who, cat: named_calendar_period}
      - slot_not_category: {slot: item, cat: many_incompatible_noun}
      - measure_holder_compatible: {measure: item, holders: [who], allow_proper_name: true, when_declared: true}
      - verb_roles_compatible:
          verb: verb
          roles:
            actor: [who]
            theme: [item]
          allow_proper_name: [who]
      - slot_not_category: {slot: dir, cat: age_comparative}
      - attribute_compatible: {attribute: pp_prep, noun: pp_obj}
      - modifier_host_compatible: {modifier: pp_prep, host: item, object: pp_obj}
      - absent: {cat: relational_marker}
      - absent: {cat: conjunction}
    satisfies: {n: [quantifies]}
    consumes: [n]
    emits:
      - fact: relation
        subject: "{who}"
        standard: "$elided:standard$"
        measure: "{item}"
        measure_qualifier: "{item.qualifier}"
        factor: 1.0
        offset: "n * sign(dir)"
        verb: "{verb}"
        subject_label: "{who.label}"

  - id: arithmetic/anchored-relation-fully-elided
    phase: read
    description: >
      "Tom has 3 apples. Mary has 5 more." — a possession-state comparison
      elides both the measure and standard. The Relation keeps those
      omissions explicit:
      measure: null and standard: $elided:standard$. The same generic
      elided-standard resolver recovers both fields only when exactly one
      earlier Quantity belongs to another entity; that fact supplies its
      holder as the standard and its measure as the comparison measure.
      No antecedent or multiple antecedents decline rather than guessing.

      The optional item slot rejects a stated measure through unbound.
      Sentence-wide absence premises reject every relational-marker or
      conjoined continuation. Consequently this rule cannot claim a prefix
      of "5 more apples", "5 more than Tom", or the fully explicit
      "5 more apples than Tom"; those surfaces remain owned by their
      stated-measure or stated-standard siblings. Event/change verbs are
      excluded because "Mary buys 5 more" adds to Mary's own quantity.
    match:
      sentence:
        - {slot: who, type: entity, referential: true}
        - {slot: verb, cat: possession_state}
        - {slot: n, type: number, standalone: true}
        - {slot: dir, cat: delta}
        - opt:
            - {slot: item_seen, cat: noun}
    where:
      - number_compatible: [who, verb]
      - slot_not_category: {slot: verb, cat: non_quantity_object_verb}
      - slot_not_category: {slot: who, cat: non_quantity_holder}
      - slot_not_category: {slot: dir, cat: age_comparative}
      - absent: {cat: relational_marker}
      - absent: {cat: conjunction}
      - unbound: [item_seen]
    satisfies: {n: [quantifies]}
    consumes: [n]
    emits:
      - fact: relation
        subject: "{who}"
        standard: "$elided:standard$"
        measure: null
        factor: 1.0
        offset: "n * sign(dir)"
        verb: "{verb}"
        subject_label: "{who.label}"

  - id: arithmetic/anchored-relation-postfix
    phase: read
    description: >
      "X picked 12 apples more than Y" — the POSTFIX count-comparative
      order: the count has already condensed into the noun, and a declared
      quantity direction (`more`/`fewer`/`less`) follows it. Same Relation fact as the
      prefix form. Age words do not belong to this count frame; the copular
      `N years older/younger than` construction has its own sibling below.
      Both holders must be complete references. This keeps names,
      determiner-backed and possessed common nouns, labeled entities, and
      bare plural comparison classes while refusing an unanchored singular
      such as `than can`. The qualifier-aware `distinct_measure: [item,
      std]` guard remains the same as arithmetic/anchored-relation — see its
      comment (mining candidate qualified-measure-keys).
    match:
      sentence:
        - {slot: who, type: entity, common_noun_cat: quantity_holder, referential: true, bare_reference_category: bare_entity_reference}
        - {slot: verb, type: verb, finite_form: true}
        - {slot: item, type: counted}
        - {slot: dir, cat: quantity_delta}
        - {lit: than}
        - opt:
            - {slot: appos_det, cat: animate_possessive_determiner}
            - {slot: appos_role, cat: animate}
        - {slot: std, type: entity, referential: true, bare_reference_category: bare_entity_reference}
    where:
      - slot_not_category: {slot: verb, cat: intransitive_process_verb}
      - bound_requires_type: {bound: appos_role, slot: std, type: proper_name}
      - number_compatible: [who, verb]
      - verb_role_compatible: {verb: verb, roles: [who], verb_cat: quantity_event_verb, role_cat: quantity_event_participant}
      - verb_role_compatible: {verb: verb, roles: [std], verb_cat: quantity_event_verb, role_cat: quantity_event_participant, allow_plural_class: true}
      - verb_role_compatible: {verb: verb, roles: [who], verb_cat: motion_comparison_verb, role_cat: motion_participant}
      - verb_role_compatible: {verb: verb, roles: [std], verb_cat: motion_comparison_verb, role_cat: motion_participant}
      - verb_role_compatible: {verb: verb, roles: [who, std], verb_cat: animate_subject_verb, role_cat: quantity_event_participant}
      - verb_role_compatible: {verb: verb, roles: [item], verb_cat: animate_object_verb, role_cat: quantity_event_participant}
      - verb_role_compatible: {verb: verb, roles: [item], verb_cat: shucking_verb, role_cat: shuckable_item}
      - verb_role_compatible: {verb: verb, roles: [who], verb_cat: transfer_out, role_cat: quantity_event_participant}
      - verb_role_compatible: {verb: verb, roles: [who, std], verb_cat: task_completion_verb, role_cat: quantity_event_participant}
      - verb_role_compatible: {verb: verb, roles: [item], verb_cat: task_completion_verb, role_cat: finishable_quantity_object}
      - measure_holder_compatible: {measure: item, holders: [who], allow_proper_name: true, when_declared: true}
      - slot_not_category: {slot: verb, cat: arrival_motion_verb}
      - slot_not_category: {slot: who, cat: non_quantity_holder}
      - slot_not_category: {slot: std, cat: non_quantity_holder}
      - distinct: [who, std]
      - category_nonoverlap: [who, std]
      - distinct_measure: [item, std]
      # a TIME PERIOD is not a holder — see slot_not_category in schemas.py
      - slot_not_category: {slot: std, cat: timeperiod}
    consumes: [item]
    emits:
      - fact: relation
        subject: "{who}"
        standard: "{std}"
        measure: "{item}"
        measure_qualifier: "{item.qualifier}"
        standard_qualifier: "{std.qualifier}"
        factor: 1.0
        offset: "item * sign(dir)"
        verb: "{verb}"
        subject_label: "{who.label}"
        standard_label: "{std.label}"
        subject_owner: "{who.owner}"
        standard_owner: "{std.owner}"

  - id: arithmetic/anchored-relation-postfix-age
    phase: read
    description: >
      "Fia is 19 years older than Cato" — the age-specific sibling of
      arithmetic/anchored-relation-postfix. The direction must be a declared
      age comparative, its counted measure must be a declared age unit, and
      the predicate must be a number-compatible copula. Keeping those three
      premises together prevents event/count cross-products such as "sells
      19 areas older" or "sells 19 years older" without banning `sell` from
      ordinary `more`/`fewer` quantity comparisons. Both sides are complete
      references for the same reason as the count sibling; a bare plural may
      still name a comparison class, while a bare singular cannot silently
      become an individual holder.
    match:
      sentence:
        - {slot: who, type: entity, referential: true, bare_reference_category: bare_entity_reference}
        - {slot: verb, cat: copula}
        - {slot: item, cat: age_measure, counted: true}
        - {slot: dir, cat: age_comparative}
        - {lit: than}
        - opt:
            - {slot: appos_det, cat: animate_possessive_determiner}
            - {slot: appos_role, cat: animate}
        - {slot: std, type: entity, referential: true, bare_reference_category: bare_entity_reference}
    where:
      - bound_requires_type: {bound: appos_role, slot: std, type: proper_name}
      - number_compatible: [who, verb]
      - measure_holder_compatible: {measure: item, holders: [who, std], allow_proper_name: true}
      - distinct: [who, std]
      - category_nonoverlap: [who, std]
      - distinct: [item, std]
      - slot_not_category: {slot: std, cat: timeperiod}
    consumes: [item]
    emits:
      - fact: relation
        temporal_perspective: "{verb.surface}"
        subject: "{who}"
        standard: "{std}"
        measure: "{item}"
        factor: 1.0
        offset: "item * sign(dir)"
        verb: "{verb}"
        subject_label: "{who.label}"
        standard_label: "{std.label}"
        subject_owner: "{who.owner}"
        standard_owner: "{std.owner}"

  - id: arithmetic/anchored-relation-postfix-age-possessive-standard
    phase: read
    description: >
      "The teacher is 6 years older than her child" — the age comparison
      whose standard is a complete possessive-determiner noun phrase. The
      determiner stays visible as grammar while condensation records its
      owner on the governed animate noun. The emitted relation therefore
      distinguishes `her child`, `his child`, and `their child`, and can
      join an exact owner-qualified age stated elsewhere. A following name
      belongs to the longer appositive form handled by the ordinary age
      sibling above.
    match:
      sentence:
        - {slot: who, type: entity, referential: true, bare_reference_category: bare_entity_reference}
        - {slot: verb, cat: copula}
        - {slot: item, cat: age_measure, counted: true}
        - {slot: dir, cat: age_comparative}
        - {lit: than}
        - {slot: std_det, cat: possessive_determiner}
        - {slot: std, cat: animate}
    where:
      - number_compatible: [who, verb]
      - measure_holder_compatible: {measure: item, holders: [who, std], allow_proper_name: true}
      - distinct: [who, std]
      - category_nonoverlap: [who, std]
      - distinct: [item, std]
      - slot_not_category: {slot: std, cat: timeperiod}
    consumes: [item]
    emits:
      - fact: relation
        temporal_perspective: "{verb.surface}"
        subject: "{who}"
        standard: "{std}"
        measure: "{item}"
        factor: 1.0
        offset: "item * sign(dir)"
        verb: "{verb}"
        subject_label: "{who.label}"
        standard_label: "{std.label}"
        subject_owner: "{who.owner}"
        standard_owner: "{std.owner}"

  - id: arithmetic/anchored-relation-postfix-dimension
    phase: read
    description: >
      mining candidate dimension-comparatives: "Jake's snake is 12 inches
      longer than Jenny's snake" — the physical-dimension sibling of
      arithmetic/anchored-relation-postfix, identical shape, gated on the
      new `dimension_comparative` category instead of `delta` (see that
      category's note in packs/core-english/categories/core.yaml — 'delta'
      itself is deliberately NOT widened). Without this rule the direction
      word falls through and the general SVO fold reads "[N inches]" as a
      bare stated Quantity — a latent confident-wrong (e.g. answering an
      unrelated length question from a comparative clause), not merely a
      decline; this rule intercepts that clause and emits the correct
      Relation instead. `who`/`std, type: entity` (same widening as the
      sibling rule) so a possessive-noun subject/standard ("Jake's snake",
      "Jenny's snake") anchors the relation too. Same Relation fact shape
      as every other relation rule; the existing saturate.py fixpoint and
      generic fold/ask machinery finish the job with no further change.
    match:
      sentence:
        - {slot: who, type: entity, referential: true, bare_reference_category: bare_entity_reference}
        - {slot: verb, cat: copula}
        - {slot: item, type: counted}
        - {slot: dir, cat: dimension_comparative}
        - {lit: than}
        - opt:
            - {slot: appos_det, cat: possessive_determiner}
            - {slot: appos_role, cat: animate}
        - {slot: std, type: entity, referential: true, bare_reference_category: bare_entity_reference}
    where:
      - bound_requires_type: {bound: appos_role, slot: std, type: proper_name}
      - number_compatible: [who, verb]
      - attribute_compatible: {attribute: dir, noun: item}
      - measure_holder_compatible: {measure: item, holders: [who, std], allow_proper_name: true, proper_name_measure_categories: [length_measure, mass_measure]}
      - slot_not_category: {slot: who, cat: non_quantity_holder}
      - slot_not_category: {slot: std, cat: non_quantity_holder}
      - distinct: [who, std]
      - category_nonoverlap: [who, std]
      - distinct: [item, std]
    consumes: [item]
    emits:
      - fact: relation
        subject: "{who}"
        standard: "{std}"
        measure: "{item}"
        factor: 1.0
        offset: "item * sign(dir)"
        verb: "{verb}"
        subject_label: "{who.label}"
        standard_label: "{std.label}"
        subject_owner: "{who.owner}"
        standard_owner: "{std.owner}"

  - id: arithmetic/dangling-comparative-relation
    phase: read
    description: >
      "Emma is 2 years older" or "the gap is 18 days shorter" — a POSTFIX
      measured comparative with NO "than Y" anchor at all. Resolving an
      IMPLICIT anchor (the previous sentence's
      subject, say) is a different, unbuilt mechanism — declined on
      purpose (precision before coverage). The comparative and measure must
      form a declared pair, so the Designer presents grammatical incomplete
      premises such as "2 years older", never "18 dogs wider". This rule
      emits NOTHING; it exists only to CONSUME the clause so the general SVO fold does not
      independently misread "is [N ITEM]" as a bare stated Quantity of N,
      silently discarding the dangling comparative — a genuine
      confident-wrong once anything queries that measure (mining candidate
      age-asks, dev-holdout look: "is 2 years older" read as a stated
      Quantity(2) once 'year' became an askable measure). Overlaps
      anchored-relation-postfix's own span when "than Y" IS present; that
      rule's Relation fact still emits normally — this one just adds a
      harmless second (empty) consumption of the same tokens.
    match:
      sentence:
        - {slot: who, type: entity, common_noun_cat: quantity_holder, referential: true, bare_reference_category: bare_entity_reference}
        - {slot: verb, cat: copula}
        - {slot: n, cat: measured_comparative_offset_measure, counted: true}
        - {slot: dir, cat: measured_comparative}
    where:
      - number_compatible: [who, verb]
      - attribute_compatible: {attribute: dir, noun: n}
      - measure_holder_compatible: {attribute: dir, measure: n, holders: [who], allow_proper_name: true, proper_name_measure_categories: [age_measure]}
      - absent: {cat: relational_marker}
    emits: []

  - id: arithmetic/dangling-comparative-safety
    phase: read
    generation: safety
    description: >
      Broad consume-only safety net for an incompatible or otherwise invalid
      dangling measured comparative. It deliberately emits no fact, but still
      prevents the fallback SVO fold from turning the counted span into an
      absolute Quantity after the reviewable sibling declines. Because this
      rule recognizes prose known not to be a valid premise, the Designer must
      never offer it as a generation target.
    match:
      sentence:
        - {slot: who, type: entity, common_noun_cat: quantity_holder, referential: true, bare_reference_category: bare_entity_reference}
        - {slot: verb, cat: copula}
        - {slot: n, type: counted}
        - {slot: dir, cat: measured_comparative}
    where:
      - number_compatible: [who, verb]
    emits: []

  - id: arithmetic/times-comparative-age-relation
    phase: read
    description: >
      "Thor is 13 times older than Captain America" — a MULTIPLICATIVE age
      comparative with NO stated noun at all (unlike anchored-relation-
      postfix's "N years older than Y", which condenses a counted item);
      'old' is implicit, exactly like arithmetic/stated-age's own literal-
      'old' anchor. The comparative word is gated on the new
      `age_comparative` category — scoped to exactly 'older'/'younger' —
      so a general "N times more/fewer/less than Y" (money, marbles, ...)
      is NOT swept in and given a spurious 'year' measure; those keep
      declining until some OTHER rule states their measure. Emits the
      SAME Relation fact shape as every other relation rule in this file;
      the existing saturate.py fixed point (already round-based to a
      fixpoint) chains it with any other relation hop — forward or
      inverse — with no kernel change. `k**sign(dir)`: 'older' (sign +1)
      keeps the ratio as stated (subject = k * standard); 'younger'
      (sign -1) inverts it (subject = standard / k), matching the
      symmetric reading "N times older" / "N times younger" already
      established for the additive form's sign(dir)*n offset.
    match:
      sentence:
        - {slot: who, type: name}
        - {slot: verb, cat: copula}
        - {slot: k, type: multiplier}
        - {slot: dir, cat: age_comparative}
        - {lit: than}
        - opt:
            - {slot: appos_det, cat: animate_possessive_determiner}
            - {slot: appos_role, cat: animate}
        - {slot: std, type: name}
    where:
      - bound_requires_type: {bound: appos_role, slot: std, type: proper_name}
      - number_compatible: [who, verb]
      - slot_not_category: {slot: k, cat: predeterminer_multiplier}
      - distinct: [who, std]
    emits:
      - fact: relation
        temporal_perspective: "{verb.surface}"
        subject: "{who}"
        standard: "{std}"
        measure: year
        factor: "k**sign(dir)"
        offset: 0.0
        verb: "{verb}"

  - id: arithmetic/times-as-old-as
    phase: read
    description: >
      "Zhang is twice as old as Li" — the EQUATIVE sibling of arithmetic/
      times-comparative-age-relation ('N times OLDER THAN Y'): English
      states this ratio equatively far more often than comparatively.
      Same implicit-'old' anchor (no stated noun — 'old' is the literal
      itself), same emitted Relation shape (measure `year`, `factor: k`,
      `offset: 0`) and same `distinct: [who, std]` self-reference guard,
      so the existing saturate.py relation fixpoint, arithmetic/anchored-
      relation-postfix and ask/how-old-is resolve it with ZERO further
      change. Decline-safety: `absent: {cat: temporal_marker}` blocks the
      rule the instant the SAME sentence also carries a trailing temporal
      qualifier ("Diana is twice as old as Grace IS TODAY") — that clause
      pairs the relation with an offset-anchored premise elsewhere in the
      document ("Grace turned 3 a year ago") that this rule cannot read;
      committing the plain 'twice as old as Grace' ratio over the RAW
      pre-offset anchor is a confident-wrong (dev-train d22b0162e42c),
      so the whole item stays declined rather than resolving on a partial
      reading, mirroring temporal-offset-age-future/past's own `absent:
      relational_marker`/`multiplier_marker` clause-boundary gates.
    match:
      sentence:
        - {slot: who, type: name}
        - {slot: verb, cat: copula}
        - {slot: k, type: multiplier}
        - {lit: as}
        - {lit: old}
        - {lit: as}
        - opt:
            - {slot: appos_det, cat: animate_possessive_determiner}
            - {slot: appos_role, cat: animate}
        - {slot: std, type: name}
    where:
      - bound_requires_type: {bound: appos_role, slot: std, type: proper_name}
      - number_compatible: [who, verb]
      - slot_not_category: {slot: k, cat: predeterminer_multiplier}
      - distinct: [who, std]
      - absent: {cat: temporal_marker}
    emits:
      - fact: relation
        temporal_perspective: "{verb.surface}"
        subject: "{who}"
        standard: "{std}"
        measure: year
        factor: "k"
        offset: 0.0
        verb: "{verb}"

  - id: arithmetic/temporal-offset-times-as-old-as-future
    phase: read
    description: >
      "In four years, Annika will be three times as old as Hans" (mining
      candidate temporal-offset-age-recut) — the FUTURE-offset sibling of
      arithmetic/times-as-old-as: the ratio is stated at a point N years
      from now, not today, and — per this candidate's stated convention —
      a BARE comparative (no explicit "is now"/"today" marker on the
      standard) inherits the sentence's own offset on BOTH sides. Emits
      the SAME Relation shape times-as-old-as does, plus the two new
      `subject_offset`/`standard_offset` fields (model.py, default 0.0 —
      "today" — on every relation that predates this candidate) set to
      the stated `n`, so `_relations_synth`'s general offset-aware
      formula resolves EITHER direction with zero further kernel change:
      the standard's stated current age resolving the subject, or the
      subject's stated current age resolving the standard (the inverse
      direction `_relations_synth` already supports for a plain
      relation). ask/how-old-is answers off the resulting Quantity
      exactly as it does for a plain relation — no new consumer. `{lit:
      be}` (not `cat: state`) mirrors arithmetic/temporal-offset-age-
      future's own reasoning: English always uses the bare infinitive
      after a modal ("will be"), never 'is'/'was' — structure, not
      lexicon.

      Decline-safety: `absent: {cat: temporal_marker}` blocks this BARE
      form the instant the clause ALSO carries a trailing "is now"/
      "today" standard-marker — the sibling -future-std-now rule below
      handles that shape with a DIFFERENT `standard_offset`. Without this
      gate both rules would match the same clause and emit two Relation
      facts that disagree only in `standard_offset` (now part of `key()`,
      so they would NOT dedupe as one restated fact); `_relations_synth`
      would then derive two conflicting Quantity values for the same
      entity, and facts.py's collision handling quarantines both —
      silently losing the correct answer instead of committing it.
      `distinct: [who, std]` blocks the genuinely self-referential
      reading ("he will be... as he was... years ago") the same way
      every other relation rule does; `_relations_synth` additionally
      declines that shape defense-in-depth (saturate.py), since a self-
      reference could in principle reach this synth some OTHER way in
      the future.
    match:
      sentence:
        - {lit: in}
        - {slot: n, cat: age_measure, counted: true}
        - {slot: who, type: name}
        - {slot: aux, cat: future_modal}
        - {lit: be}
        - {slot: k, type: multiplier}
        - {lit: as}
        - {lit: old}
        - {lit: as}
        - opt:
            - {slot: appos_det, cat: animate_possessive_determiner}
            - {slot: appos_role, cat: animate}
        - {slot: std, type: name}
    where:
      - bound_requires_type: {bound: appos_role, slot: std, type: proper_name}
      - slot_not_category: {slot: k, cat: predeterminer_multiplier}
      - distinct: [who, std]
      - absent: {cat: temporal_marker}
    consumes: [n]
    emits:
      - fact: relation
        temporal_perspective: present
        subject: "{who}"
        standard: "{std}"
        measure: year
        factor: "k"
        offset: 0.0
        verb: be
        subject_offset: "n"
        standard_offset: "n"

  - id: arithmetic/temporal-offset-times-as-old-as-future-std-now
    phase: read
    description: >
      "In 7 years, Kaylee will be 3 times as old as Matt IS NOW" / "In
      twenty years, Ramon will be twice as old as Loui TODAY" (mining
      candidate temporal-offset-age-recut) — the STANDARD-PINNED sibling
      of -future above: an explicit trailing "is now"/"today" marker on
      the standard (`cat: temporal_marker` — widened this increment to
      also cover 'now' alongside its pre-existing 'today' member, packs/
      difg-mined/categories/semantic.yaml) states that THAT side of the
      ratio is evaluated at the CURRENT moment, not the sentence's own
      future offset — so `standard_offset` is 0.0 while `subject_offset`
      still carries the stated `n`. `opt: [{lit: is}]` covers both the
      copula form ("Matt IS now") and the bare trailing-adverb form
      ("Loui TODAY", no copula) in one rule, since English drops 'is'
      before 'today' far more often than before 'now'. A separate rule id
      (not a widened optional slot on -future) because the two forms
      emit GENUINELY DIFFERENT `standard_offset` values for the same
      clause shape — one rule per distinct equation, mirroring every
      other relation-rule-family split in this file (e.g. times-
      comparative-age-relation vs. times-as-old-as itself). No `absent`
      gate needed here: -future's OWN `absent: {cat: temporal_marker}` is
      what keeps the two rules from ever double-firing on the same
      clause (see that rule's docstring).
    match:
      sentence:
        - {lit: in}
        - {slot: n, cat: age_measure, counted: true}
        - {slot: who, type: name}
        - {slot: aux, cat: future_modal}
        - {lit: be}
        - {slot: k, type: multiplier}
        - {lit: as}
        - {lit: old}
        - {lit: as}
        - opt:
            - {slot: appos_det, cat: animate_possessive_determiner}
            - {slot: appos_role, cat: animate}
        - {slot: std, type: name}
        - opt:
            - {lit: is}
        - {slot: mark, cat: temporal_marker}
    where:
      - bound_requires_type: {bound: appos_role, slot: std, type: proper_name}
      - slot_not_category: {slot: k, cat: predeterminer_multiplier}
      - distinct: [who, std]
    consumes: [n]
    emits:
      - fact: relation
        temporal_perspective: present
        subject: "{who}"
        standard: "{std}"
        measure: year
        factor: "k"
        offset: 0.0
        verb: be
        subject_offset: "n"
        standard_offset: 0.0

  - id: arithmetic/temporal-offset-times-as-old-as-past
    phase: read
    description: >
      "N years ago, WHO was K times as old as STD" — the PAST-offset
      mirror of -future above (mining candidate temporal-offset-age-
      recut), exactly like arithmetic/temporal-offset-age-past mirrors
      arithmetic/temporal-offset-age-future: same bare-comparative-
      inherits-the-sentence's-own-offset convention, just NEGATIVE (N
      years ago = -n from today) and the ordinary state verb ('was'/
      'were', gated by `cat: past_copula`) instead of a bare infinitive after a
      modal — a past tense needs no modal at all. Symmetric completion of
      the same class, not a guess: shipped once the full dev-train/
      holdout diff (0 BROKE, 0 DECL->WRONG) confirmed it, the same gate
      every increment in this file goes through.
    match:
      sentence:
        - {slot: n, cat: age_measure, counted: true}
        - {lit: ago}
        - {slot: who, type: name}
        - {slot: verb, cat: past_copula}
        - {slot: k, type: multiplier}
        - {lit: as}
        - {lit: old}
        - {lit: as}
        - opt:
            - {slot: appos_det, cat: animate_possessive_determiner}
            - {slot: appos_role, cat: animate}
        - {slot: std, type: name}
    where:
      - bound_requires_type: {bound: appos_role, slot: std, type: proper_name}
      - number_compatible: [who, verb]
      - slot_not_category: {slot: k, cat: predeterminer_multiplier}
      - distinct: [who, std]
      - absent: {cat: temporal_marker}
    consumes: [n]
    emits:
      - fact: relation
        temporal_perspective: present
        subject: "{who}"
        standard: "{std}"
        measure: year
        factor: "k"
        offset: 0.0
        verb: "{verb}"
        subject_offset: "-n"
        standard_offset: "-n"

  - id: arithmetic/times-as-old-as-possessive-standard
    phase: read
    description: >
      mining candidate relation-standard-frames: "Jerica is twice Louis'
      age" — the POSSESSIVE-NP sibling of arithmetic/times-as-old-as: the
      standard is stated as an owned age noun ("Louis' age") instead of
      the equative "as old as Y" frame, so there is no 'as'/'old'/'as'
      literal skeleton to anchor on at all — the multiplier is immediately
      followed by the possessive NP. `std, cat: age_noun, possessed: true`
      (declared and membered in packs/core-english/categories/core.yaml —
      the SAME single-word category
      arithmetic/group-total-sum-of-age already gates on) matches the noun
      only after condense.py's merge-possessive has folded an "OWNER 's"
      prefix onto it. The category-qualified possessive premise rejects bare
      `age`, which never supplies a relation standard. `standard:
      "{std.owner}"` (not "{std}") is the whole
      mechanism: `_slot_value`'s `owner` attribute (patterns.py, the same
      lookup ask/how-many-entity-possessed already uses for `entity_
      owner`) reads the possessive's OWNER off the merged noun's own
      `owner` feature — "Louis' age" merges to a noun whose lemma is
      'age' but whose `owner` is 'louis', so the Relation's standard is
      the PERSON, never the measure word. Same hardcoded DATA measure
      'year' arithmetic/stated-age and ask/how-old-is already commit to
      everywhere (constitution rule 1: one pack-owned literal, not a
      Python word list). PROVEN minimal pair on unmodified main: "Jerica
      is twice as old as Louis..." commits 35.0 (the gold) while "Jerica
      is twice Louis' age..." declines outright — this rule is what
      closes that gap.
    match:
      sentence:
        - {slot: who, type: name}
        - {slot: verb, cat: copula}
        - {slot: k, type: multiplier}
        - {slot: std, cat: age_noun, possessed: true, number: singular}
    where:
      - same_number: [who, verb, std]
    emits:
      - fact: relation
        temporal_perspective: "{verb.surface}"
        subject: "{who}"
        standard: "{std.owner}"
        measure: year
        factor: "k"
        offset: 0.0
        verb: "{verb}"

  - id: arithmetic/times-as-old-as-both-possessive
    phase: read
    description: >
      mining candidate relation-standard-frames: "Ana's age is twice
      Beto's age" — the DOUBLY-possessive sibling of arithmetic/times-as-
      old-as-possessive-standard: BOTH the subject and the standard are
      owned age NPs, so `who` ALSO needs `{std.owner}`'s own treatment
      (`"{who.owner}"`) rather than the bare-name `"{who}"` the one-sided
      sibling uses. Gated the same way (`cat: age_noun, possessed: true`
      on both slots,
      never `type: possessed` combined with a category gate — the schema
      forbids a slot naming both `type` and `cat`), so this rule and its
      one-sided sibling both fire off the exact same underlying merge
      (condense.py's merge-possessive) and never collide: a subject that
      IS a possessive age NP can only ever match THIS rule's `who` slot
      (`type: name` on the sibling rejects a merged noun outright), so the
      two are structurally disjoint, not a specificity tie-break.
    match:
      sentence:
        - {slot: who, cat: age_noun, possessed: true, number: singular}
        - {slot: verb, cat: copula}
        - {slot: k, type: multiplier}
        - {slot: std, cat: age_noun, possessed: true, number: singular}
    where:
      - distinct_owner: [who, std]
      - same_number: [who, verb, std]
    emits:
      - fact: relation
        temporal_perspective: "{verb.surface}"
        subject: "{who.owner}"
        standard: "{std.owner}"
        measure: year
        factor: "k"
        offset: 0.0
        verb: "{verb}"

  - id: arithmetic/times-as-many-elided
    phase: read
    description: >
      mining candidate elided-measure-relations: "Ben has twice as many as
      Ann" — times-as-many with the plural ITEM noun elided entirely (no
      noun between 'many' and 'as'; compare arithmetic/times-as-many's "N
      times as many ITEM as Y"). Same `measure: null` UNRESOLVED-sentinel
      emission and the same standard-anchored recovery in saturate.py's
      `_relations_synth` as arithmetic/anchored-relation-elided — see its
      comment. Requires 'as' immediately after 'many', so this can never
      match text that states the item noun (the two rules' spans are
      structurally disjoint). `who`/`std, type: entity`: same widening and
      same self-reference guard as arithmetic/times-as-many.
    match:
      sentence:
        - {slot: who, type: entity, common_noun_cat: quantity_holder, referential: true}
        - {slot: verb, type: verb, finite_form: true}
        - {slot: k, type: nonunit_multiplier}
        - {lit: as}
        - {lit: many}
        - {lit: as}
        - opt:
            - {slot: appos_det, cat: animate_possessive_determiner}
            - {slot: appos_role, cat: animate}
        - {slot: std, type: entity, common_noun_cat: quantity_holder, referential: true, bare_reference_category: bare_entity_reference}
    where:
      - slot_not_category: {slot: verb, cat: intransitive_process_verb}
      - bound_requires_type: {bound: appos_role, slot: std, type: proper_name}
      - bound_requires_category: {bound: appos_role, slot: who, cat: quantity_event_participant, allow_proper_name: true}
      - number_compatible: [who, verb]
      - slot_not_category: {slot: k, cat: predeterminer_multiplier}
      - verb_role_compatible: {verb: verb, roles: [who], verb_cat: quantity_event_verb, role_cat: quantity_event_participant}
      - verb_role_compatible: {verb: verb, roles: [std], verb_cat: quantity_event_verb, role_cat: quantity_event_participant, allow_plural_class: true}
      - verb_role_compatible: {verb: verb, roles: [who, std], verb_cat: animate_subject_verb, role_cat: quantity_event_participant}
      - verb_roles_compatible:
          verb: verb
          roles:
            actor: [who, std]
          allow_proper_name: [who, std]
          allow_plural_class: [who, std]
      - slot_not_category: {slot: verb, cat: non_quantity_object_verb}
      - slot_not_category: {slot: verb, cat: motion_comparison_verb}
      - slot_not_category: {slot: who, cat: non_quantity_holder}
      - slot_not_category: {slot: std, cat: non_quantity_holder}
      - distinct: [who, std]
      - category_nonoverlap: [who, std]
    emits:
      - fact: relation
        subject: "{who}"
        standard: "{std}"
        measure: null
        factor: "k"
        offset: 0.0
        verb: "{verb}"
        subject_label: "{who.label}"
        standard_label: "{std.label}"

  - id: arithmetic/times-as-many-elided-standard
    phase: read
    description: >
      mining candidate elided-comparative-standards: "Boy A holds 7 fish.
      Boy B has three times as many fish in his aquarium." — times-as-many
      with the STANDARD clause elided entirely (no "as Y" after the item
      noun at all; compare arithmetic/times-as-many-elided, which elides
      the ITEM noun instead and still states "as Y"). The comparison
      entity is not named anywhere in this sentence — it is the discourse
      antecedent, the most recent OTHER holder of the SAME measure. Emits
      the SAME Relation shape times-as-many does, with `standard` set to
      the reserved `$elided:standard$` sentinel (never a guess) instead of
      a slot-bound entity; saturate.py's `_relations_synth` recovers it
      from the unique earlier same-measure Quantity, the same
      unique-pool-in-play discipline the measure-elided siblings already
      use for the mirror-image gap. The trailing `opt: [as, ..., std_seen]`
      block mirrors times-as-many's own mandatory "as Y" continuation
      structurally, but binds it to `std_seen` and then `where: unbound:
      [std_seen]` REJECTS this whole match if it ever binds — the general
      negative-lookahead mirror (schemas.py's own comment on `unbound`):
      relying only on `patterns.subsumes` to drop this rule's redundant
      shorter match whenever times-as-many's own fuller one wins is NOT
      enough, because the fuller rule can itself decline for an unrelated
      reason (its `distinct: [item, std]` self-reference guard rejects a
      same-lemma-different-qualifier pair like "4 times as many purple
      marbles as orange marbles" — a pre-existing, separate gap, not
      qualifier-aware the way arithmetic/anchored-relation's `distinct_
      measure` already is) — with no competing match to subsume, this
      rule would otherwise be the ONLY survivor and misread the truncated
      prefix as a genuinely elided standard, when a std was actually
      right there in the text (dev-train look: 7fc8fb0445e6 caught this
      as a DECL->WRONG before the `unbound` guard was added). Matching
      `std_seen` into a slot and rejecting on it self-declines regardless
      of whether the fuller rule accepts or rejects that same span — this
      rule only ever survives when no "as Y" continuation is even
      grammatically present to consume, i.e. exactly the elided case.
      `who, type: entity`: same widening as arithmetic/times-as-many.
    match:
      sentence:
        - {slot: who, type: entity, common_noun_cat: quantity_holder, referential: true}
        - {slot: verb, type: verb, finite_form: true}
        - {slot: k, type: nonunit_multiplier}
        - {lit: as}
        - {lit: many}
        - {slot: item, type: plural}
        - opt:
            - {slot: pp_prep, cat: preposition}
            - opt:
                - {slot: pp_det, cat: possessive_determiner}
            - {slot: pp_obj, type: noun, referential: true, bare_reference_category: bare_pp_object, determinerless_category: named_calendar_period}
        - opt:
            - {lit: as}
            - opt:
                - {slot: std_det_seen, cat: possessive_determiner}
            - {slot: std_seen, type: entity}
    where:
      - slot_not_category: {slot: verb, cat: intransitive_process_verb}
      - number_compatible: [who, verb]
      - slot_not_category: {slot: k, cat: predeterminer_multiplier}
      - verb_role_compatible: {verb: verb, roles: [who], verb_cat: quantity_event_verb, role_cat: quantity_event_participant}
      - slot_not_category: {slot: verb, cat: non_quantity_object_verb}
      - slot_not_category: {slot: who, cat: non_quantity_holder}
      - slot_not_category: {slot: item, cat: many_incompatible_noun}
      - attribute_compatible: {attribute: pp_prep, noun: pp_obj}
      - unbound: [std_seen]
    emits:
      - fact: relation
        subject: "{who}"
        standard: "$elided:standard$"
        measure: "{item}"
        factor: "k"
        offset: 0.0
        verb: "{verb}"
        subject_label: "{who.label}"

  - id: arithmetic/times-as-many-possessive-kinship-standard
    phase: read
    description: >
      "Deka has three times as many pencils as her sister" — the ratio
      standard is a complete possessive-determiner + personal-relation-noun phrase,
      with no trailing name. The noun head remains `sister` and its owner is
      preserved separately, so it joins only the same owned sister elsewhere.
      A following name ("as her sister Gigi") belongs to the longer
      appositive rule; the shorter rule requires a sentence boundary.
    match:
      sentence:
        - {slot: who, type: entity, common_noun_cat: quantity_holder, referential: true, bare_reference_category: bare_entity_reference}
        - {slot: verb, type: verb, finite_form: true}
        - {slot: k, type: nonunit_multiplier}
        - {lit: as}
        - {lit: many}
        - {slot: item, type: plural}
        - opt:
            - {slot: pp_prep, cat: preposition}
            - opt:
                - {slot: pp_det, cat: possessive_determiner}
            - {slot: pp_obj, type: noun, referential: true, bare_reference_category: bare_pp_object, determinerless_category: named_calendar_period}
        - {lit: as}
        - {slot: std_det, cat: possessive_determiner}
        - {slot: std, cat: personal_relation_role}
        - {lit: ".", consume_skipped: true}
    where:
      - slot_not_category: {slot: verb, cat: intransitive_process_verb}
      - bound_requires_category: {bound: std_det, bound_cat: third_person_possessive_determiner, slot: who, cat: quantity_event_participant, allow_proper_name: true}
      - modifier_host_compatible: {modifier: pp_prep, host: verb, object: pp_obj, host_type: verb, nominal_host: item}
      - modifier_host_compatible: {modifier: pp_prep, host: item, object: pp_obj}
      - number_compatible: [who, verb]
      - slot_not_category: {slot: k, cat: predeterminer_multiplier}
      - verb_role_compatible: {verb: verb, roles: [who], verb_cat: quantity_event_verb, role_cat: quantity_event_participant}
      - verb_role_compatible: {verb: verb, roles: [std], verb_cat: quantity_event_verb, role_cat: quantity_event_participant, allow_plural_class: true}
      - verb_roles_compatible:
          verb: verb
          roles:
            actor: [who, std]
            theme: [item]
          allow_proper_name: [who, std]
      - slot_not_category: {slot: verb, cat: non_quantity_object_verb}
      - slot_not_category: {slot: who, cat: non_quantity_holder}
      - slot_not_category: {slot: std, cat: non_quantity_holder}
      - slot_not_category: {slot: item, cat: many_incompatible_noun}
      - attribute_compatible: {attribute: pp_prep, noun: pp_obj}
      - distinct: [who, std]
      - distinct: [item, std]
    emits:
      - fact: relation
        subject: "{who}"
        standard: "{std}"
        measure: "{item}"
        factor: "k"
        offset: 0.0
        verb: "{verb}"
        subject_label: "{who.label}"
        standard_label: "{std.label}"
        subject_owner: "{who.owner}"
        standard_owner: "{std.owner}"

  # Comparative second conjuncts
  #
  # These rules read clauses such as "Sam has 21 pens and twice as many
  # pencils". The general object reader only sees the first conjunct, so a
  # rule here consumes the whole clause and emits both quantities itself.
  # `item1` is a counted unit: it carries both the noun and its value.
  #
  # When the second conjunct omits a standard, its standard is `item1` in
  # this same clause. The rule can therefore emit `k * item1` directly.
  # This family currently covers plural count nouns with "many", not mass
  # nouns with "much".
  - id: arithmetic/times-as-many-conjunct
    phase: read
    description: >
      "Sam has 21 pens and twice as many pencils as Jamie has erasers" — the
      full "as many ITEM as STD" continuation is present, so this emits an
      ordinary Relation for the second conjunct (the SAME shape and
      saturate.py resolution as arithmetic/times-as-many, just read from a
      conjunct position). See the family header comment above for the
      shared consumption/re-emission mechanism.
    match:
      sentence:
        - {slot: who, type: entity, common_noun_cat: quantity_holder, referential: true}
        - {slot: verb, type: verb, finite_form: true}
        - {slot: item1, type: counted}
        - opt:
            - {slot: pp_prep, cat: preposition}
            - opt:
                - {slot: pp_det, cat: possessive_determiner}
            - {slot: pp_obj, type: noun, referential: true, bare_reference_category: bare_pp_object, determinerless_category: named_calendar_period}
        - {lit: and}
        - {slot: k, type: nonunit_multiplier}
        - {lit: as}
        - {lit: many}
        - {slot: item2, type: plural}
        - {lit: as}
        - opt:
            - {slot: appos_det, cat: possessive_determiner}
            - {slot: appos_role, cat: animate}
        - {slot: std, type: entity, common_noun_cat: quantity_holder, referential: true}
    where:
      - slot_not_category: {slot: verb, cat: intransitive_process_verb}
      - bound_requires_type: {bound: appos_role, slot: std, type: proper_name}
      - bound_requires_category: {bound: appos_role, slot: who, cat: quantity_event_participant, allow_proper_name: true}
      - number_compatible: [who, verb]
      - slot_not_category: {slot: k, cat: predeterminer_multiplier}
      - verb_role_compatible: {verb: verb, roles: [who], verb_cat: quantity_event_verb, role_cat: quantity_event_participant}
      - verb_role_compatible: {verb: verb, roles: [std], verb_cat: quantity_event_verb, role_cat: quantity_event_participant, allow_plural_class: true}
      - verb_roles_compatible:
          verb: verb
          roles:
            actor: [who, std]
          allow_proper_name: [who, std]
      - verb_roles_compatible:
          verb: verb
          frame_categories: [consumption_quantity_verb]
          roles:
            theme: [item1, item2]
      - slot_not_category: {slot: verb, cat: non_quantity_object_verb}
      - slot_not_category: {slot: who, cat: non_quantity_holder}
      - slot_not_category: {slot: std, cat: non_quantity_holder}
      - slot_not_category: {slot: item1, cat: many_incompatible_noun}
      - slot_not_category: {slot: item2, cat: many_incompatible_noun}
      - measure_holder_compatible: {measure: item1, holders: [who], allow_proper_name: true, when_declared: true}
      - measure_holder_compatible: {measure: item2, holders: [who, std], allow_proper_name: true, when_declared: true}
      - same_category_membership: {slots: [item1, item2], cat: timeperiod}
      - attribute_compatible: {attribute: pp_prep, noun: pp_obj}
      - distinct: [who, std]
      - category_nonoverlap: [who, std]
    emits:
      - fact: quantity
        entity: "{who}"
        measure: "{item1}"
        measure_qualifier: "{item1.qualifier}"
        value: "item1"
        verb: "{verb}"
      - fact: relation
        subject: "{who}"
        standard: "{std}"
        measure: "{item2}"
        factor: "k"
        offset: 0.0
        verb: "{verb}"
        subject_label: "{who.label}"
        standard_label: "{std.label}"

  - id: arithmetic/times-as-many-conjunct-elided-standard
    phase: read
    description: >
      "A truck holds 20 large boxes and twice as many small boxes" — the
      second conjunct names its own ITEM but no "as STD" continuation
      follows at all: the standard is the IMMEDIATELY PRECEDING conjunct's
      own quantity (`item1`'s own bound value), already bound in this same
      clause, so this emits the second conjunct's Quantity DIRECTLY (`k *
      item1`) — see the family header comment. `where: unbound:
      [std_seen]` is the same general negative-lookahead mirror
      arithmetic/times-as-many-elided-standard's own comment documents: an
      "as STD" continuation, when actually present, is claimed by
      arithmetic/times-as-many-conjunct instead — this rule only ever
      survives when no such continuation is grammatically present, so the
      two rules never both fire on the same clause.
    match:
      sentence:
        - {slot: who, type: entity, common_noun_cat: quantity_holder, referential: true}
        - {slot: verb, type: verb, finite_form: true}
        - {slot: item1, type: counted}
        - opt:
            - {slot: pp_prep, cat: preposition}
            - opt:
                - {slot: pp_det, cat: possessive_determiner}
            - {slot: pp_obj, type: noun, referential: true, bare_reference_category: bare_pp_object, determinerless_category: named_calendar_period}
        - {lit: and}
        - {slot: k, type: nonunit_multiplier}
        - {lit: as}
        - {lit: many}
        - {slot: item2, type: plural}
        - opt:
            - {lit: as}
            - opt:
                - {slot: appos_det, cat: possessive_determiner}
                - {slot: appos_role, cat: animate}
            - {slot: std_seen, type: entity}
    where:
      - slot_not_category: {slot: verb, cat: intransitive_process_verb}
      - bound_requires_type: {bound: appos_role, slot: std_seen, type: proper_name}
      - number_compatible: [who, verb]
      - slot_not_category: {slot: k, cat: predeterminer_multiplier}
      - verb_role_compatible: {verb: verb, roles: [who], verb_cat: quantity_event_verb, role_cat: quantity_event_participant}
      - verb_roles_compatible:
          verb: verb
          roles:
            actor: [who]
          allow_proper_name: [who]
      - slot_not_category: {slot: verb, cat: non_quantity_object_verb}
      - slot_not_category: {slot: who, cat: non_quantity_holder}
      - slot_not_category: {slot: item1, cat: many_incompatible_noun}
      - slot_not_category: {slot: item2, cat: many_incompatible_noun}
      - slot_not_category: {slot: item2, cat: conjunct_comparison_incompatible_noun}
      - same_category_membership: {slots: [item1, item2], cat: timeperiod}
      - attribute_compatible: {attribute: pp_prep, noun: pp_obj}
      - unbound: [std_seen]
    emits:
      - fact: quantity
        entity: "{who}"
        measure: "{item1}"
        measure_qualifier: "{item1.qualifier}"
        value: "item1"
        verb: "{verb}"
      - fact: quantity
        entity: "{who}"
        measure: "{item2}"
        measure_qualifier: "{item2.qualifier}"
        value: "k * item1"
        verb: "{verb}"
        # Keep this conjunct separate when both conjuncts use the same
        # measure. Without `segment`, the two facts would have the same key
        # and one could be treated as a duplicate. Different measures already
        # have different keys, so the field has no effect on them.
        segment: 1

  - id: arithmetic/times-as-many-conjunct-elided-item
    phase: read
    description: >
      "A vehicle holds 20 parts on one side and twice as many on the other"
      — the second conjunct names NEITHER its own item noun NOR a standard:
      "and K times as many" with nothing structurally meaningful following
      ('on the other side' is a bare adjunct, not a measure noun or an
      entity). The elided item is the SAME measure as the first conjunct,
      and (exactly like the elided-standard sibling above) the antecedent
      count is already bound in this same clause (`item1`'s own `value`),
      so this emits the SAME-measure Quantity DIRECTLY (`k * item1`) — see
      the family header comment. `where: unbound: [item2_seen, std_seen]`
      rejects this match whenever either an explicit item noun
      (arithmetic/times-as-many-conjunct-elided-standard's own territory)
      or an explicit "as STD" continuation (arithmetic/times-as-many-
      conjunct's territory) is actually present immediately after 'many' —
      the same general negative-lookahead mirror used throughout this
      family, keeping all three rules mutually exclusive on any one clause.
    match:
      sentence:
        - {slot: who, type: entity, common_noun_cat: quantity_holder, referential: true, bare_reference_category: bare_entity_reference}
        - {slot: verb, type: verb, finite_form: true}
        - {slot: item1, type: counted}
        - opt:
            - {slot: pp_prep, cat: preposition}
            - opt:
                - {slot: pp_det, cat: possessive_determiner}
            - {slot: pp_obj, type: noun, referential: true, bare_reference_category: bare_pp_object, determinerless_category: named_calendar_period}
        - {lit: and}
        - {slot: k, type: nonunit_multiplier}
        - {lit: as}
        - {lit: many}
        - opt:
            - {slot: item2_seen, type: plural}
        - opt:
            - {lit: as}
            - opt:
                - {slot: appos_det, cat: possessive_determiner}
                - {slot: appos_role, cat: animate}
            - {slot: std_seen, type: entity}
        - opt:
            - {slot: pp2_prep, cat: preposition}
            - opt:
                - {slot: pp2_det, cat: possessive_determiner}
            - {slot: pp2_obj, type: noun, referential: true, bare_reference_category: bare_pp_object, determinerless_category: named_calendar_period}
    where:
      - slot_not_category: {slot: verb, cat: intransitive_process_verb}
      - bound_requires_type: {bound: appos_role, slot: std_seen, type: proper_name}
      - attribute_compatible: {attribute: pp_prep, noun: pp_obj}
      - attribute_compatible: {attribute: pp2_prep, noun: pp2_obj}
      - same_presence: [pp_prep, pp2_prep]
      - number_compatible: [who, verb]
      - slot_not_category: {slot: k, cat: predeterminer_multiplier}
      - verb_role_compatible: {verb: verb, roles: [who], verb_cat: quantity_event_verb, role_cat: quantity_event_participant}
      - verb_roles_compatible:
          verb: verb
          roles:
            actor: [who]
          allow_proper_name: [who]
      - slot_not_category: {slot: verb, cat: non_quantity_object_verb}
      - slot_not_category: {slot: verb, cat: frame_prepositional_verb}
      - slot_not_category: {slot: who, cat: non_quantity_holder}
      - slot_not_category: {slot: item1, cat: many_incompatible_noun}
      - unbound: [item2_seen, std_seen]
    emits:
      - fact: quantity
        entity: "{who}"
        measure: "{item1}"
        measure_qualifier: "{item1.qualifier}"
        value: "item1"
        verb: "{verb}"
      - fact: quantity
        entity: "{who}"
        measure: "{item1}"
        measure_qualifier: "{item1.qualifier}"
        value: "k * item1"
        verb: "{verb}"
        # The elided item reuses `item1`, so both facts have the same measure
        # key. `segment` keeps them as separate conjuncts.
        segment: 1

  - id: arithmetic/anaphoric-multiplier-conjunct-many
    phase: read
    description: >
      "The bird caught 8 fish by day and twice this many by night" — the
      DEMONSTRATIVE-anaphor sibling (arithmetic/anaphoric-multiplier-
      standard-many's own "twice THAT/THIS MANY" shape — no `{lit: as}`
      anywhere in that idiom. The demonstrative is consumed explicitly:
      `that` is complementizer-sensed while `this` is article-sensed, so
      `consume_skipped` lets one literal alternation claim either without
      ever admitting the ungrammatical bare "twice many". This rule is read
      from a CONJUNCT position instead of a
      fresh sentence: the antecedent is the IMMEDIATELY PRECEDING
      conjunct's own literal count (`item1`'s own bound value), not a
      document-wide unique prior Quantity, so — exactly like the
      elided-item sibling above — this emits the second conjunct's
      Quantity DIRECTLY (`k * item1`) under the SAME measure as the first
      conjunct. Structurally disjoint from every 'as many' sibling above:
      this sequence has no `{lit: as}` token at all, so it can never match
      where 'as' actually appears in the text (patterns.py's matcher does
      not auto-skip a `particle`-sensed token the way it does
      'article'/'punct'). `where: unbound: [item2_seen]` guards the rarer
      case where an explicit item noun DOES follow the demonstrative
      ("twice this many fish") — declining here defers to general
      machinery rather than risk mis-eliding a stated noun. The quantity
      pro-form takes an adverbial multiplier such as `twice`, not the declared
      noun-phrase predeterminers `double`/`triple`.
