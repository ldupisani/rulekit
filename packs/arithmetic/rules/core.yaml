  - id: arithmetic/existential-premise
    phase: read
    satisfies: {verb: [subject]}
    description: >
      "There are 15 trees in the grove" — a located existential: the place
      holds the counted noun as a state quantity. The surface requires an
      agreeing copula; constructional `there` cannot turn an arbitrary event
      verb into an existential holding. `measure_qualifier:
      "{item.qualifier}"` (mining candidate qualified-measure-keys): the
      SVO fold has carried this since increment 70 (learn.py's `_qualifier`
      helper at every emission site) but this existential premise never
      did — "There are 16 red apples in a bowl. There are 28 green apples
      in the bowl." both bare-fold to measure='apple' with NO qualifier at
      all, so facts.py's admit-time qualifier split (which requires BOTH
      sides non-null) never engages and the two counts genuinely conflict
      instead of splitting into 'apple[red]'/'apple[green]'. Byte-identical
      whenever `item` carries no qualifier (the overwhelming existing case).
    match:
      sentence:
        - {lit: there}
        - {slot: verb, cat: copula}
        - {slot: item, type: counted}
        - {slot: prep, cat: preposition}
        - opt:
            - {slot: place_det, cat: possessive_determiner}
        - {slot: place, type: noun, referential: true, bare_reference_category: bare_pp_object, determinerless_category: named_calendar_period}
    where:
      - absent: {cat: aggregate}
      - number_compatible: [item, verb]
      - slot_not_category: {slot: item, cat: existential_incompatible_noun}
      - slot_not_category: {slot: item, cat: many_incompatible_noun}
      - slot_not_category: {slot: prep, cat: spatial_goal_preposition}
      - attribute_compatible: {attribute: prep, noun: place}
      - modifier_host_compatible: {modifier: prep, host: item}
    consumes: [item]
    emits:
      - fact: quantity
        entity: "{place}"
        measure: "{item}"
        measure_qualifier: "{item.qualifier}"
        value: "item"
        verb: have

  - id: arithmetic/existential-premise-distributive
    phase: read
    description: >
      "There are 20 chairs in EACH row" (mining candidate distributive-
      each-totals) — the located existential above, widened to a
      DISTRIBUTIVE place: a quantifier ('each'/'every' — the `quantifier`
      sense, same word class `_has_distributive_determiner`/`_is_rate`
      already recognize elsewhere in the kernel) between the preposition
      and the place noun makes the count PER-CONTAINER rather than a
      located total — "in each row" names the CONTAINER (row) as the
      quantity's holder exactly like "each box has 8 pens" already does
      via the ordinary SVO fold, just phrased existentially instead of
      with a stating verb. Emits the SAME per-container Quantity shape
      (entity=container, measure=content) so saturate.py's distributive-
      container-total synth composes it with the container's own stated
      count identically regardless of which surface produced it.

      Strictly more specific than both arithmetic/existential-premise
      (whose `place` slot requires a bare noun immediately after the
      preposition — a quantifier there fails that slot, so the two rules
      never tie) and arithmetic/existential-premise-bare (whose shorter
      "there VERB item" span this rule's longer match subsumes on any
      sentence with a trailing "PREP QUANTIFIER NOUN" tail): ordinary
      "There are 12 chairs." (no such tail) is untouched.
    match:
      sentence:
        - {lit: there}
        - {slot: verb, cat: copula}
        - {slot: item, type: counted}
        - {slot: prep, cat: preposition}
        - {slot: q, cat: distributive_quantifier}
        - {slot: place, type: noun}
    where:
      - absent: {cat: aggregate}
      - number_compatible: [item, verb]
      - slot_not_category: {slot: item, cat: existential_incompatible_noun}
      - slot_not_category: {slot: item, cat: many_incompatible_noun}
      - slot_not_category: {slot: prep, cat: spatial_goal_preposition}
      - attribute_compatible: {attribute: prep, noun: place}
      - modifier_host_compatible: {modifier: prep, host: item}
    consumes: [item]
    emits:
      - fact: quantity
        entity: "{place}"
        measure: "{item}"
        measure_qualifier: "{item.qualifier}"
        value: "item"
        verb: have

  - id: arithmetic/existential-premise-bare
    phase: read
    satisfies: {verb: [subject]}
    description: >
      "There are 12 chairs." — an unlocated existential; the holder is the
      scene itself (the `world` entity, a data constant this pack owns).
      The located form strictly subsumes this one on shared matches. Optional
      continuation sentinels make that ownership explicit: a following
      preposition or complete counted conjunction must be validated by the
      corresponding longer sibling and cannot fall back to this rule's prefix.
      A declared `quantity_container` may retain its own count before an
      explicit partitive content tail ("30 boxes of apples"); arbitrary
      `ITEM of NOUN` sequences receive no such exception.
    match:
      sentence:
        - {lit: there}
        - {slot: verb, cat: copula}
        - {slot: item, type: counted}
        - opt:
            - {slot: tail_partitive, cat: partitive}
            - {slot: tail_content, type: noun}
        - opt:
            - {slot: tail_prep_seen, cat: preposition}
        - opt:
            - {lit: and}
            - {slot: item2_seen, type: counted}
    where:
      # "There are 160 toys ALTOGETHER" is a group TOTAL (a sum constraint
      # over the entities), never an independent holding
      - absent: {cat: aggregate}
      - number_compatible: [item, verb]
      - slot_not_category: {slot: item, cat: existential_incompatible_noun}
      - slot_not_category: {slot: item, cat: many_incompatible_noun}
      - bound_requires_category: {bound: tail_partitive, slot: item, cat: quantity_container}
      - partitive_compatible: {measure: item, substance: tail_content}
      - unbound: [tail_prep_seen, item2_seen]
    consumes: [item]
    emits:
      - fact: quantity
        entity: world
        measure: "{item}"
        measure_qualifier: "{item.qualifier}"
        value: "item"
        verb: have

  - id: arithmetic/existential-premise-bare-conjoined
    phase: read
    question_assumption: true
    description: >
      "There are 34 girls and 841 boys." — the CONJOINED sibling of
      arithmetic/existential-premise-bare. That rule matches a single
      `{slot: item, type: counted}` and so mints only the FIRST conjunct,
      silently DROPPING the second: the sentence above minted girl=34 and
      no boy fact at all, which is not a decline but a SILENT partial
      reading — every downstream consumer then sees a store missing a
      quantity the text plainly states.

      The ordinary SVO fold already reads this conjunction correctly
      ("The basket has 7 red peaches and 8 green peaches" mints BOTH,
      qualifiers included); only the existential surface lacked it. This
      rule closes that asymmetry, emitting the SAME `world` scene-holder
      shape its bare sibling emits, once per conjunct.

      Strictly LONGER than arithmetic/existential-premise-bare, so it
      subsumes that rule on every sentence carrying the "and COUNTED"
      tail, exactly as -distributive subsumes -premise; a single-item
      "There are 12 chairs." has no such tail and is untouched.

      The `absent: {cat: aggregate}` guard is inherited verbatim: "There
      are 34 girls and 841 boys ALTOGETHER" is a group TOTAL (a sum
      constraint), never two independent holdings, and must keep routing
      to arithmetic/existential-premise-total. Both conjuncts also refuse the
      declared mass-measure class: a unit amount such as "40 pounds" is not a
      second independently enumerable population.
    match:
      sentence:
        - {lit: there}
        - {slot: verb, cat: copula}
        - {slot: item, type: counted}
        - {lit: and}
        - {slot: item2, type: counted}
    where:
      - absent: {cat: aggregate}
      - number_compatible: [item, verb]
      - slot_not_category: {slot: item, cat: existential_incompatible_noun}
      - slot_not_category: {slot: item2, cat: existential_incompatible_noun}
      - slot_not_category: {slot: item, cat: many_incompatible_noun}
      - slot_not_category: {slot: item2, cat: many_incompatible_noun}
      - slot_not_category: {slot: item, cat: mass_measure}
      - slot_not_category: {slot: item2, cat: mass_measure}
    satisfies: {verb: [subject]}
    consumes: [item, item2]
    emits:
      - fact: quantity
        entity: world
        measure: "{item}"
        measure_qualifier: "{item.qualifier}"
        value: "item"
        verb: have
      - fact: quantity
        entity: world
        measure: "{item2}"
        measure_qualifier: "{item2.qualifier}"
        value: "item2"
        verb: have

  - id: arithmetic/existential-premise-total
    phase: read
    description: >
      "There are 160 toys altogether." — the totality-marked sibling of
      arithmetic/existential-premise-bare (mining candidate sum-constraint-
      relations): the identical "there VERB N ITEM" shape, but a REQUIRED
      trailing declared totality marker makes this a GROUP TOTAL across
      whichever entities the passage names, never an independent holding
      of the bare `world` scene-holder. `aggregate` also includes `average`,
      which is an operation but not a sum marker, so this rule uses the
      narrower lexicon sense `group_total_marker`. The optional preposition
      is likewise restricted to the declared "in total" collocation;
      arbitrary combinations such as "with combined" or "to total" are not
      premises. The bare rule's broader `absent: {cat: aggregate}` remains
      conservative.
    match:
      sentence:
        - {lit: there}
        - {slot: verb, cat: copula}
        - {slot: item, type: counted}
        - opt:
            - {slot: p, cat: group_total_preposition}
        - {slot: agg, cat: group_total_marker}
    where:
      - number_compatible: [item, verb]
      - slot_not_category: {slot: item, cat: existential_incompatible_noun}
      - slot_not_category: {slot: item, cat: many_incompatible_noun}
      - bound_requires_category: {bound: p, slot: agg, cat: prepositional_group_total_marker}
    consumes: [item]
    emits:
      - fact: group_total
        measure: "{item}"
        value: "item"
        verb: have

  - id: arithmetic/group-total-of
    phase: read
    description: >
      "...a total of 160 toys" / "...a total of 35 floors" (mining
      candidate sum-constraint-relations) — a stated SUM across the
      entities the passage names, wherever in the sentence the framing
      falls: matching scans every starting position, so this fires
      identically for "Together they have a total of X", "A and B have
      been VERBing for a total of X", and "WHO will VERB a total of X"
      without needing to parse the varying subject/tense that precedes
      it — only the "a total of N ITEM" tail itself is the sum-constraint
      marker. Distinct from arithmetic/existential-premise-total's bare
      "there are N X <aggregate>" existential (no 'total of' framing at
      all, and the aggregate marker trails the noun rather than fronts
      it): the two match disjoint literal skeletons and never tie.
    match:
      sentence:
        - {lit: total}
        - {lit: of}
        - {slot: item, type: counted}
    consumes: [item]
    emits:
      - fact: group_total
        measure: "{item}"
        value: "item"
        verb: have

  - id: arithmetic/group-total-trailing
    phase: read
    description: >
      "Tom and Jerry have 29 apples together." / "They picked 274 apples
      total." (mining candidate group-total-phrasings) — a stated quantity
      followed by a TRAILING totality marker (the narrower
      `group_total_marker` sense — together/altogether/total/combined,
      packs/core-english/lexicon/core.yaml). A declared optional totality
      quantifier is compatible only with its declared marker ("all
      together"), just as a declared preposition is compatible only with its
      own marker ("in total"). These paired categories prevent arbitrary
      cross-products such as "all total" or "in combined". The complete
      phrase is a GROUP TOTAL across whichever entities the passage names,
      never one entity's own independent holding —
      exactly the reading arithmetic/existential-premise-bare's own
      `absent: {cat: aggregate}` guard refuses for the bare "there are N
      X" shape. Matching scans every starting position (mirrors
      arithmetic/group-total-of): only the "N ITEM <marker>" tail itself
      is the sum-constraint marker, so this fires regardless of the
      preceding subject/verb — "A and B have N X together", "WHO will
      VERB N X all together" match identically without needing to parse
      the varying subject/tense that precedes the tail. The matched
      item's noun unit is the SAME unit the sentence's own verb would
      otherwise bind as its dobj; consuming it here (pattern_consumed)
      suppresses learn.py's ordinary per-entity fold for this clause
      (`learn.py`: `consumed = verb.features.get("pattern_consumed") or
      dobj...`), so the stated number is read exactly once — as a group
      total, never ALSO as an independent holding (the double-count this
      brief's decline-safety analysis flags). Routes to the existing,
      unchanged synth/sum-constraint plugin (saturate.py) — no new fact
      kind, no new consumer, no new ask shape.
    match:
      sentence:
        - {slot: item, type: counted}
        - opt:
            - {slot: q, cat: group_total_quantifier}
        - opt:
            - {slot: p, cat: group_total_preposition}
        - {slot: agg, cat: group_total_marker}
    where:
      - bound_requires_category: {bound: q, slot: agg, cat: quantified_group_total_marker}
      - bound_requires_category: {bound: p, slot: agg, cat: prepositional_group_total_marker}
    satisfies:
      q: [collection]
      p: [object]
    consumes: [item]
    emits:
      - fact: group_total
        measure: "{item}"
        value: "item"
        verb: have

  - id: arithmetic/group-total-trailing-in-all
    phase: read
    description: >
      "There are 11 areas in all" / "A and B have 11 areas in all" — the
      conventional two-word total marker sibling of
      arithmetic/group-total-trailing. `all` is correctly quantifier-sensed,
      so it cannot belong to the aggregate-rooted `group_total_marker`
      category used by "in total" and bare "together". This literal grammar
      keeps the two senses honest while emitting the same unscoped GroupTotal.
      The counted item is consumed so the sentence cannot also become an
      independent holder quantity. The complete idiom satisfies its own
      preposition and totality obligations; it must not consume the prefix
      of an ordinary quantified location such as "in all gardens" or
      "in all of the gardens".
    match:
      sentence:
        - {slot: item, type: counted}
        - {slot: p, cat: group_total_preposition}
        - {slot: q, cat: group_total_quantifier}
        - opt:
            - {slot: collection_seen, type: noun}
        - opt:
            - {slot: partitive_seen, cat: partitive}
    where:
      - unbound: [collection_seen, partitive_seen]
    satisfies:
      p: [object]
      q: [collection]
    consumes: [item]
    emits:
      - fact: group_total
        measure: "{item}"
        value: "item"
        verb: have

  - id: arithmetic/group-total-leading
    phase: read
    description: >
      "In total, they sold 120 oranges." (mining candidate group-total-
      phrasings) — the LEADING sibling of arithmetic/group-total-trailing:
      the same "in total" marker fronts the clause (comma skippable punct)
      instead of trailing it, ahead of the ordinary SUBJ VERB N ITEM
      skeleton. `who` binds any single subject token generically (`type:
      word` — a name, common noun, or pronoun, resolved or not) and its exact
      normalized identity is retained as the GroupTotal's optional `scope`.
      This distinguishes two explicitly named groups over the same measure
      without pretending a tail-only total has an owner. Requiring the real VERB
      and counted ITEM slots (not a generic skip) means the matched item
      is the sentence's own dobj, so capturing it here suppresses
      learn.py's per-entity fold for the identical double-count reason
      arithmetic/group-total-trailing documents — an ordinary single-
      holder reading and a group total can never both register for the
      same clause.
    match:
      sentence:
        - {lit: in, at_start: true}
        - {lit: total}
        - {slot: who, type: word}
        - {slot: verb, type: verb, finite_form: true}
        - {slot: item, type: counted}
    where:
      - number_compatible: [who, verb]
      - slot_not_category: {slot: who, cat: existential}
      - slot_not_category: {slot: who, cat: preposition}
      - slot_not_category: {slot: who, cat: timeperiod}
      - slot_not_category: {slot: verb, cat: arrival_motion_verb}
      - verb_roles_compatible:
          verb: verb
          roles:
            actor: [who]
            theme: [item]
          allow_proper_name: [who]
          allow_plural_pronoun: [who]
    satisfies: {verb: [subject]}
    consumes: [item]
    emits:
      - fact: group_total
        measure: "{item}"
        value: "item"
        scope: "{who}"
        verb: "{verb}"

  - id: arithmetic/group-total-leading-marker
    phase: read
    description: >
      "Together, they have 34 years." / "Combined, they weigh 98
      kilograms." (mining candidate sum-constraint-premise-surfaces) — the
      BARE-MARKER sibling of arithmetic/group-total-leading: that rule
      requires the specific two-word literal "in total" fronting the
      clause; a single fronting `aggregate` word ('together'/'combined'/
      'altogether'/'total' itself) never satisfied its literal 'in'+
      'total' skeleton and declined outright. Same "SUBJ VERB N ITEM"
      tail, same generic `who, type: word` bridge slot whose identity is
      retained as the emitted GroupTotal's optional `scope`, same
      double-count discipline: capturing the counted ITEM here suppresses
      learn.py's per-entity fold for this clause
      (arithmetic/group-total-leading's own comment). This rule's own
      `agg` is anchored to the sentence start. Without that structural
      boundary, a TRAILING marker in "...birds together and have 30 birds"
      could float into this rule as if `and` were the scoped subject. The
      two-word "In total" surface remains owned by its anchored sibling
      arithmetic/group-total-leading.
    match:
      sentence:
        - {slot: agg, cat: group_total_marker, at_start: true}
        - {slot: who, type: word}
        - {slot: verb, type: verb, finite_form: true}
        - {slot: item, type: counted}
    where:
      - number_compatible: [who, verb]
      - slot_not_category: {slot: who, cat: existential}
      - slot_not_category: {slot: who, cat: preposition}
      - slot_not_category: {slot: who, cat: timeperiod}
      - slot_not_category: {slot: verb, cat: arrival_motion_verb}
      - verb_roles_compatible:
          verb: verb
          roles:
            actor: [who]
            theme: [item]
          allow_proper_name: [who]
          allow_plural_pronoun: [who]
    satisfies: {verb: [subject]}
    consumes: [item]
    emits:
      - fact: group_total
        measure: "{item}"
        value: "item"
        scope: "{who}"
        verb: "{verb}"

  - id: arithmetic/group-total-leading-existential
    phase: read
    description: >
      "In total, there are 12 coins." — the existential sibling of
      arithmetic/group-total-leading. The scoped rule deliberately excludes
      existential subjects: 'there' introduces the existence of an unscoped
      collection and is not itself a group identity. Requiring the literal
      existential marker followed by an agreeing copula separates this
      construction from action clauses such as "there drops 2 coins", whose
      missing semantic subject must remain declined. The normalized holding
      verb gives the resulting unscoped GroupTotal the same semantics as
      other existential quantities without treating the surface copula as an
      event.
    match:
      sentence:
        - {lit: in, at_start: true}
        - {lit: total}
        - {lit: there}
        - {slot: verb, cat: copula}
        - {slot: item, type: counted}
    where:
      - same_number: [verb, item]
    consumes: [item]
    emits:
      - fact: group_total
        measure: "{item}"
        value: "item"
        verb: have

  - id: arithmetic/group-total-leading-marker-existential
    phase: read
    description: >
      "Altogether, there is 1 coin." — the bare-marker existential sibling
      of arithmetic/group-total-leading-marker. A leading aggregate marker
      plus literal existential 'there' and an agreeing copula states an
      unscoped collection total; it does not license 'there' as GroupTotal
      scope and does not admit arbitrary event verbs. The narrow
      `group_total_marker` sense excludes 'average': that word shares the
      broad `aggregate` sense for average asks, but "Average there is..." is
      not an English existential-total marker. The counted item is consumed
      for the same single-reading discipline as the scoped leading rules.
    match:
      sentence:
        - {slot: agg, cat: group_total_marker, at_start: true}
        - {lit: there}
        - {slot: verb, cat: copula}
        - {slot: item, type: counted}
    where:
      - same_number: [verb, item]
    consumes: [item]
    emits:
      - fact: group_total
        measure: "{item}"
        value: "item"
        verb: have

  - id: arithmetic/group-total-sum-of-age
    phase: read
    description: >
      "Rachel is 4 years older than Leah. If the sum of their ages is 34,
      how old is Rachel?" (mining candidate sum-constraint-premise-
      surfaces) — a COPULAR sum-of-ages constraint: none of the existing
      group-total-* rules read this shape at all (they all anchor on an
      `aggregate` marker trailing or fronting a stated quantity; here
      there is no `aggregate` word anywhere — 'sum' names the total, and
      the age noun and the value sit on OPPOSITE sides of the copula, "of
      their ages IS 34", never adjacent the way a counted noun would be).
      `noun, cat: age_noun` (a single-word category, packs/core-english/
      categories/core.yaml — 'age' only, never a bare 'age' measure key
      the age family elsewhere never matches) is what lets this rule emit
      the same DATA measure 'year' arithmetic/stated-age and ask/how-old-
      is already commit to, hardcoded exactly as those two rules already
      hardcode it (constitution rule 1: a single pack-owned data literal,
      not a Python word list). `n, type: number` binds the bare trailing
      value (no noun follows it here, unlike every sibling's `type:
      counted` item) — consuming it suppresses learn.py's own bare-count
      fold for this clause (learn.py's elided-measure-anchor branch, which
      would otherwise mis-anchor an AnchorQuantity to whichever noun its
      own subject-binding happens to pick), the identical double-count
      guard every sibling GroupTotal rule here already relies on.
    match:
      sentence:
        - {lit: the, consume_skipped: true}
        - {lit: sum}
        - {lit: of}
        - opt:
            - {slot: poss, cat: plural_possessive_determiner}
        - {slot: noun, cat: age_noun, number: plural}
        - {slot: verb, cat: copula, number: singular}
        - {slot: n, type: number}
    # The age noun precedes the value, beyond local count attachment.
    satisfies: {n: [quantifies]}
    consumes: [n]
    emits:
      - fact: group_total
        temporal_perspective: "{verb.surface}"
        measure: year
        value: n
        verb: have

  - id: arithmetic/group-total-of-age
    phase: read
    description: >
      "Amy, Jeremy, and Chris have a combined age of 132." / "their
      combined age is 132" (mining candidate sum-constraint-premise-
      surfaces) — an AGGREGATE-QUALIFIED dimension NP: arithmetic/group-
      total-of only reads "a total of N ITEM" (the literal word 'total',
      the counted noun TRAILING the number); here the aggregate word
      QUALIFIES the age noun itself, and the age noun FRONTS the number
      ("combined AGE of 132"), an entirely disjoint token order group-
      total-of's own skeleton cannot match. `agg, cat: group_total_marker`
      excludes `average`, which is not a sum. There is no "In total, ..."
      literal to collide with here: the position right before 'age' can
      never be confused with that other rule's own two-literal skeleton.
      `noun, cat: age_noun`
      (the same single-word category arithmetic/group-total-sum-of-age
      uses) resolves to the hardcoded DATA measure 'year' the age family
      already commits to everywhere. `n, type: number` also accepts an
      already-condensed "132 years" counted noun (its own `value_kind`
      stays 'count' after merging — the hardcoded 'year' measure below
      does not depend on capturing that trailing unit word at all).
    match:
      sentence:
        - {slot: agg, cat: group_total_marker}
        - {slot: noun, cat: age_noun}
        - {lit: of}
        - {slot: n, type: number}
    satisfies: {n: [quantifies]}
    consumes: [n]
    emits:
      - fact: group_total
        measure: year
        value: n
        verb: have

  - id: arithmetic/fraction-of-pool
    phase: read
    description: >
      "Tom ate half of the sandwiches" / "spent 40% of the money" — a
      fraction of the DEFINITE pool. Emits a FractionQuantity the synthesizer
      resolves against the DEFINITE POOL — the signed sum of the measure's
      prior-sentence facts. After another fraction has depleted that pool,
      an explicit remaining qualifier is required: an unqualified second
      fraction might refer to the original total instead. The qualifier is
      retained as evidence rather than silently assuming a changing base.
      A part of one finite pool cannot exceed the whole; improper
      fractions remain available to unbounded ratio and comparison rules.
      Unresolved ones veto commits.
    match:
      sentence:
        - {slot: who, type: name}
        - {slot: verb, type: verb, finite_form: true}
        - {slot: f, type: fraction, fraction_within_whole: true, generation_explicit_unit_fraction: true}
        - {lit: of}
        - {lit: the, consume_skipped: true}
        - {slot: item, type: noun}
    where:
      - number_compatible: [who, verb]
      - verb_roles_compatible:
          verb: verb
          roles:
            actor: [who]
            theme: [item]
          allow_proper_name: [who]
      - verb_role_compatible: {verb: verb, roles: [item], verb_cat: animate_object_verb, role_cat: quantity_event_participant}
    consumes: [f]
    emits:
      - fact: fraction_quantity
        entity: "{who}"
        measure: "{item}"
        fraction: "f"
        verb: "{verb}"
        pool_qualifier: "{item.qualifier}"

  - id: arithmetic/sequential-percent-remainder-partition
    phase: read
    description: >
      A finite population is divided in three stages: the first percentage
      comes from the whole population, the second percentage comes from what
      remains, and the final destination receives the rest. For example,
      "In a university with 800 students, 25% enrolled in science courses,
      20% of the remaining enrolled in business courses, and the rest
      enrolled in humanities courses." The emitted PartitionQuantity facts
      contain resolved counts, so ordinary partition consumers can reuse
      them. Context, population, destination, verb, and preposition roles are
      pack-declared; the rule contains only the grammatical skeleton.
    match:
      sentence:
        - {lit: in, at_start: true}
        - {lit: a, consume_skipped: true}
        - {slot: context, cat: sequential_partition_context}
        - {lit: with}
        - {slot: total, cat: sequential_partition_population, counted: true}
        - {slot: first_share, type: fraction, fraction_within_whole: true, fraction_positive: true, generation_explicit_unit_fraction: true}
        - {slot: first_verb, cat: sequential_partition_verb, finite_form: true}
        - {slot: first_prep, cat: sequential_partition_preposition}
        - {slot: first_destination, cat: sequential_partition_destination, qualified: true, number: plural}
        - {slot: second_share, type: fraction, fraction_within_whole: true, fraction_positive: true, generation_explicit_unit_fraction: true}
        - {lit: of}
        - {lit: the, consume_skipped: true}
        - {slot: remaining, cat: sequential_partition_remainder}
        - {slot: second_verb, cat: sequential_partition_verb, finite_form: true}
        - {slot: second_prep, cat: sequential_partition_preposition}
        - {slot: second_destination, cat: sequential_partition_destination, qualified: true, number: plural}
        - {lit: and}
        - {lit: the, consume_skipped: true}
        - {slot: rest, cat: partition_remnant, referential: true, generation_bare_reference: true}
        - {slot: rest_verb, cat: sequential_partition_verb, finite_form: true}
        - {slot: rest_prep, cat: sequential_partition_preposition}
        - {slot: rest_destination, cat: sequential_partition_destination, qualified: true, number: plural}
    where:
      - same_lemma: [first_verb, second_verb, rest_verb]
      - number_compatible: [first_share, first_verb]
      - number_compatible: [second_share, second_verb]
      - same_lemma: [first_prep, second_prep, rest_prep]
      - distinct_measure: [first_destination, second_destination, rest_destination]
    consumes: [total, first_share, second_share]
    emits:
      - fact: quantity
        entity: "{context}"
        measure: "{total}"
        value: "total"
        verb: have
      - fact: partition_quantity
        collection: "{total}"
        attribute: "{first_destination.qualified}"
        value: "first_share * total"
        verb: "{first_verb}"
      - fact: partition_quantity
        collection: "{total}"
        attribute: "{second_destination.qualified}"
        value: "second_share * (1 - first_share) * total"
        verb: "{second_verb}"
      - fact: partition_quantity
        collection: "{total}"
        attribute: "{rest_destination.qualified}"
        value: "(1 - second_share) * (1 - first_share) * total"
        verb: "{rest_verb}"

  - id: arithmetic/sequential-percent-remainder-partition-anaphoric
    phase: read
    # This clause is valid only with a preceding collection anchor. Contextual
    # generation supplies that anchor and highlights this sentence as the
    # review target rather than presenting the clause in isolation.
    generation: contextual
    generation_context:
      before:
        - sentence:
            - {lit: a, at_start: true, consume_skipped: true}
            - {slot: context_anchor, cat: sequential_partition_context}
            - {slot: anchor_verb, cat: population_total_verb, finite_form: true}
            - {slot: anchor_total, cat: sequential_partition_population, counted: true}
          where:
            - number_compatible: [context_anchor, anchor_verb]
      required_fact_counts: {partition_quantity: 3}
      target_commas_after: [first_destination, second_destination]
    description: >
      A complete staged allocation whose population total was stated in a
      preceding sentence: "A school has 800 pupils. 25% enrolled in science
      courses, 20% of the remaining enrolled in business courses, and the
      rest enrolled in humanities courses." The rule records the allocation
      without guessing its omitted collection. A generic synthesizer commits
      the three resolved partitions only when exactly one prior collection
      measure and holder are available.
    match:
      sentence:
        - {slot: first_share, type: fraction, fraction_within_whole: true, fraction_positive: true, generation_explicit_unit_fraction: true, at_start: true}
        - {slot: first_verb, cat: sequential_partition_verb, finite_form: true}
        - {slot: first_prep, cat: sequential_partition_preposition}
        - {slot: first_destination, cat: sequential_partition_destination, qualified: true, number: plural}
        - {slot: second_share, type: fraction, fraction_within_whole: true, fraction_positive: true, generation_explicit_unit_fraction: true}
        - {lit: of}
        - {lit: the, consume_skipped: true}
        - {slot: remaining, cat: sequential_partition_remainder}
        - {slot: second_verb, cat: sequential_partition_verb, finite_form: true}
        - {slot: second_prep, cat: sequential_partition_preposition}
        - {slot: second_destination, cat: sequential_partition_destination, qualified: true, number: plural}
        - {lit: and}
        - {lit: the, consume_skipped: true}
        - {slot: rest, cat: partition_remnant, referential: true, generation_bare_reference: true}
        - {slot: rest_verb, cat: sequential_partition_verb, finite_form: true}
        - {slot: rest_prep, cat: sequential_partition_preposition}
        - {slot: rest_destination, cat: sequential_partition_destination, qualified: true, number: plural}
    where:
      - same_lemma: [first_verb, second_verb, rest_verb]
      - number_compatible: [first_share, first_verb]
      - number_compatible: [second_share, second_verb]
      - same_lemma: [first_prep, second_prep, rest_prep]
      - distinct_measure: [first_destination, second_destination, rest_destination]
    satisfies: {first_verb: [subject]}
    consumes: [first_share, second_share]
    emits:
      - fact: sequential_partition
        first_attribute: "{first_destination.qualified}"
        first_fraction: first_share
        second_attribute: "{second_destination.qualified}"
        second_fraction: second_share
        rest_attribute: "{rest_destination.qualified}"
        verb: "{first_verb}"

  - id: arithmetic/sequential-percent-remainder-partition-initial-share
    phase: read
    generation: contextual
    generation_context:
      before:
        - sentence:
            - {lit: a, at_start: true, consume_skipped: true}
            - {slot: context_anchor, cat: sequential_partition_context}
            - {slot: anchor_verb, cat: population_total_verb, finite_form: true}
            - {slot: anchor_total, cat: sequential_partition_population, counted: true}
          where:
            - number_compatible: [context_anchor, anchor_verb]
      after:
        - sentence:
            - {slot: support_second_share, type: fraction, fraction_within_whole: true, fraction_positive: true, generation_explicit_unit_fraction: true, at_start: true}
            - {lit: of}
            - {lit: the, consume_skipped: true}
            - {slot: support_remaining, cat: sequential_partition_remainder}
            - {slot: support_second_verb, cat: sequential_partition_verb, finite_form: true}
            - {slot: support_second_prep, cat: sequential_partition_preposition}
            - {slot: support_second_destination, cat: sequential_partition_destination, qualified: true, number: plural}
          where:
            - number_compatible: [support_second_share, support_second_verb]
        - sentence:
            - {lit: the, at_start: true, consume_skipped: true}
            - {slot: support_rest, cat: partition_remnant, referential: true, generation_bare_reference: true}
            - {slot: support_rest_verb, cat: sequential_partition_verb, finite_form: true}
            - {slot: support_rest_prep, cat: sequential_partition_preposition}
            - {slot: support_rest_destination, cat: sequential_partition_destination, qualified: true, number: plural}
      required_fact_counts: {partition_quantity: 3}
    description: >
      A sentence containing only the first whole-population percentage of a
      staged allocation: "25% enrolled in science courses." It remains an
      incomplete discourse fact until the immediately following sentence
      states a compatible percentage of the remaining population.
    match:
      sentence:
        - {slot: first_share, type: fraction, fraction_within_whole: true, fraction_positive: true, generation_explicit_unit_fraction: true, at_start: true}
        - {slot: first_verb, cat: sequential_partition_verb, finite_form: true}
        - {slot: first_prep, cat: sequential_partition_preposition}
        - {slot: first_destination, cat: sequential_partition_destination, qualified: true, number: plural}
    where:
      # The combined two-stage and complete forms contain "remaining" and
      # belong to their existing rules instead of this sentence-only shape.
      - absent: {cat: sequential_partition_remainder}
      - number_compatible: [first_share, first_verb]
    satisfies: {first_verb: [subject]}
    consumes: [first_share]
    emits:
      - fact: sequential_partition_initial_share
        first_attribute: "{first_destination.qualified}"
        first_fraction: first_share
        verb: "{first_verb}"

  - id: arithmetic/sequential-percent-remainder-partition-remaining-share
    phase: read
    generation: contextual
    generation_context:
      before:
        - sentence:
            - {lit: a, at_start: true, consume_skipped: true}
            - {slot: context_anchor, cat: sequential_partition_context}
            - {slot: anchor_verb, cat: population_total_verb, finite_form: true}
            - {slot: anchor_total, cat: sequential_partition_population, counted: true}
          where:
            - number_compatible: [context_anchor, anchor_verb]
        - sentence:
            - {slot: support_first_share, type: fraction, fraction_within_whole: true, fraction_positive: true, generation_explicit_unit_fraction: true, at_start: true}
            - {slot: support_first_verb, cat: sequential_partition_verb, finite_form: true}
            - {slot: support_first_prep, cat: sequential_partition_preposition}
            - {slot: support_first_destination, cat: sequential_partition_destination, qualified: true, number: plural}
          where:
            - number_compatible: [support_first_share, support_first_verb]
      after:
        - sentence:
            - {lit: the, at_start: true, consume_skipped: true}
            - {slot: support_rest, cat: partition_remnant, referential: true, generation_bare_reference: true}
            - {slot: support_rest_verb, cat: sequential_partition_verb, finite_form: true}
            - {slot: support_rest_prep, cat: sequential_partition_preposition}
            - {slot: support_rest_destination, cat: sequential_partition_destination, qualified: true, number: plural}
      required_fact_counts: {partition_quantity: 3}
    description: >
      A sentence containing the second percentage, explicitly sized from the
      remainder left by the immediately preceding initial-share sentence:
      "20% of the remaining enrolled in business courses." It does not select
      an older or non-adjacent percentage as its antecedent.
    match:
      sentence:
        - {slot: second_share, type: fraction, fraction_within_whole: true, fraction_positive: true, generation_explicit_unit_fraction: true, at_start: true}
        - {lit: of}
        - {lit: the, consume_skipped: true}
        - {slot: remaining, cat: sequential_partition_remainder}
        - {slot: second_verb, cat: sequential_partition_verb, finite_form: true}
        - {slot: second_prep, cat: sequential_partition_preposition}
        - {slot: second_destination, cat: sequential_partition_destination, qualified: true, number: plural}
    satisfies: {second_verb: [subject]}
    where:
      - number_compatible: [second_share, second_verb]
    consumes: [second_share]
    emits:
      - fact: sequential_partition_remaining_share
        second_attribute: "{second_destination.qualified}"
        second_fraction: second_share
        verb: "{second_verb}"

  - id: arithmetic/sequential-percent-remainder-partition-prefix
    phase: read
    # Like the complete anaphoric rule, this is generated only with its linked
    # population anchor and immediately following completion sentence.
    generation: contextual
    generation_context:
      before:
        - sentence:
            - {lit: a, at_start: true, consume_skipped: true}
            - {slot: context_anchor, cat: sequential_partition_context}
            - {slot: anchor_verb, cat: population_total_verb, finite_form: true}
            - {slot: anchor_total, cat: sequential_partition_population, counted: true}
          where:
            - number_compatible: [context_anchor, anchor_verb]
      after:
        - sentence:
            - {lit: the, at_start: true, consume_skipped: true}
            - {slot: support_rest, cat: partition_remnant, referential: true, generation_bare_reference: true}
            - {slot: support_rest_verb, cat: sequential_partition_verb, finite_form: true}
            - {slot: support_rest_prep, cat: sequential_partition_preposition}
            - {slot: support_rest_destination, cat: sequential_partition_destination, qualified: true, number: plural}
      required_fact_counts: {partition_quantity: 3}
      target_commas_after: [first_destination]
    description: >
      The first two stages of an allocation whose final "the rest" clause is
      deferred to the next sentence: "25% enrolled in science courses, 20%
      of the remaining enrolled in business courses." This records an
      incomplete prefix rather than guessing a destination. It can contribute
      to an answer only when the immediately following sentence supplies one
      compatible rest clause and prior discourse supplies one population.
    match:
      sentence:
        - {slot: first_share, type: fraction, fraction_within_whole: true, fraction_positive: true, generation_explicit_unit_fraction: true, at_start: true}
        - {slot: first_verb, cat: sequential_partition_verb, finite_form: true}
        - {slot: first_prep, cat: sequential_partition_preposition}
        - {slot: first_destination, cat: sequential_partition_destination, qualified: true, number: plural}
        - {slot: second_share, type: fraction, fraction_within_whole: true, fraction_positive: true, generation_explicit_unit_fraction: true}
        - {lit: of}
        - {lit: the, consume_skipped: true}
        - {slot: remaining, cat: sequential_partition_remainder}
        - {slot: second_verb, cat: sequential_partition_verb, finite_form: true}
        - {slot: second_prep, cat: sequential_partition_preposition}
        - {slot: second_destination, cat: sequential_partition_destination, qualified: true, number: plural}
    where:
      - same_lemma: [first_verb, second_verb]
      - number_compatible: [first_share, first_verb]
      - number_compatible: [second_share, second_verb]
      - same_lemma: [first_prep, second_prep]
      - distinct_measure: [first_destination, second_destination]
      # Prevent this prefix rule from also firing on the existing complete
      # one-sentence construction.
      - absent: {cat: partition_remnant}
    satisfies: {first_verb: [subject]}
    consumes: [first_share, second_share]
    emits:
      - fact: sequential_partition_prefix
        first_attribute: "{first_destination.qualified}"
        first_fraction: first_share
        second_attribute: "{second_destination.qualified}"
        second_fraction: second_share
        verb: "{first_verb}"

  - id: arithmetic/sequential-percent-remainder-partition-completion
    phase: read
    generation: contextual
    generation_context:
      before:
        - sentence:
            - {lit: a, at_start: true, consume_skipped: true}
            - {slot: context_anchor, cat: sequential_partition_context}
            - {slot: anchor_verb, cat: population_total_verb, finite_form: true}
            - {slot: anchor_total, cat: sequential_partition_population, counted: true}
          where:
            - number_compatible: [context_anchor, anchor_verb]
        - sentence:
            - {slot: support_first_share, type: fraction, fraction_within_whole: true, fraction_positive: true, generation_explicit_unit_fraction: true, at_start: true}
            - {slot: support_first_verb, cat: sequential_partition_verb, finite_form: true}
            - {slot: support_first_prep, cat: sequential_partition_preposition}
            - {slot: support_first_destination, cat: sequential_partition_destination, qualified: true, number: plural}
            - {lit: ",", consume_skipped: true}
            - {slot: support_second_share, type: fraction, fraction_within_whole: true, fraction_positive: true, generation_explicit_unit_fraction: true}
            - {lit: of}
            - {lit: the, consume_skipped: true}
            - {slot: support_remaining, cat: sequential_partition_remainder}
            - {slot: support_second_verb, cat: sequential_partition_verb, finite_form: true}
            - {slot: support_second_prep, cat: sequential_partition_preposition}
            - {slot: support_second_destination, cat: sequential_partition_destination, qualified: true, number: plural}
          where:
            - same_lemma: [support_first_verb, support_second_verb]
            - number_compatible: [support_first_share, support_first_verb]
            - number_compatible: [support_second_share, support_second_verb]
            - same_lemma: [support_first_prep, support_second_prep]
            - distinct_measure: [support_first_destination, support_second_destination]
      required_fact_counts: {partition_quantity: 3}
    description: >
      A sentence-initial "the rest" clause that names the final destination
      of a staged allocation. It remains unresolved unless the immediately
      preceding sentence supplied exactly one compatible two-stage prefix.
    match:
      sentence:
        - {lit: the, at_start: true, consume_skipped: true}
        - {slot: rest, cat: partition_remnant, referential: true, generation_bare_reference: true}
        - {slot: rest_verb, cat: sequential_partition_verb, finite_form: true}
        - {slot: rest_prep, cat: sequential_partition_preposition}
        - {slot: rest_destination, cat: sequential_partition_destination, qualified: true, number: plural}
    emits:
      - fact: sequential_partition_remainder
        rest_attribute: "{rest_destination.qualified}"
        verb: "{rest_verb}"

  - id: arithmetic/fraction-of-pronoun
    phase: read
    description: >
      "She spent one-half OF IT" — the pronoun DENOTES THE POOL itself; the
      synthesizer resolves it by the unique-measure principle (one measure
      in play, else unresolved and the guard declines).

      `cat: pool_pronoun` (not `type: pronoun`) is load-bearing, and the
      category's own notes carry the measurement. A POSSESSIVE determiner
      senses as 'pronoun' too but is a DIFFERENT CONSTRUCTION: in "Ben gave
      half of HIS marbles", 'his' does not denote the pool — it modifies
      'marbles' and names a possessor whose holdings are the intended base.
      Ungated, this rule matched it and the synth sized `half` against the
      whole pool, so with two holders Ben gave away half of Ben's 18 PLUS
      John's 17. A possessive fraction needs a rule that BINDS THE POSSESSOR;
      until one exists the fraction stays unconsumed and the value-accounting
      guard declines, which is the honest outcome and costs nothing (all 78
      GSM8K dev-train and 76 dev-holdout possessive items already declined).
    match:
      sentence:
        - {slot: who, type: name}
        - {slot: verb, type: verb}
        - {slot: f, type: fraction, fraction_within_whole: true}
        - {lit: of}
        - {slot: ref, cat: pool_pronoun}
    where:
      - number_compatible: [who, verb]
    consumes: [f]
    emits:
      - fact: fraction_quantity
        entity: "{who}"
        measure: "{ref}"
        fraction: "f"
        verb: "{verb}"

  - id: arithmetic/fraction-of-remnant
    phase: read
    description: >
      "put half of THE REST in savings" — the remnant word names no measure;
      the synthesizer's unique-measure principle supplies the pool. The
      fraction is a part of that one finite remainder and therefore cannot
      exceed the whole.
    match:
      sentence:
        - {slot: who, type: name}
        - {slot: verb, type: verb}
        - {slot: f, type: fraction, fraction_within_whole: true}
        - {lit: of}
        - {slot: r, cat: remnant}
    where:
      - number_compatible: [who, verb]
    consumes: [f]
    emits:
      - fact: fraction_quantity
        entity: "{who}"
        measure: "{r}"
        fraction: "f"
        verb: "{verb}"

  - id: arithmetic/rest-of-pool
    phase: read
    description: >
      "He picked THE REST" — the remainder of the unique pool after its
      events. Emits a RestQuantity; the synthesizer supplies the value or
      the unresolved-derivation guard declines. Ordinary subject/verb
      agreement applies, and the narrow `non_quantity_object_verb` category
      excludes predicates that cannot take this quantitative object.
    match:
      sentence:
        - {slot: who, type: name}
        - {slot: verb, type: verb}
        - {slot: r, cat: remnant}
    where:
      - number_compatible: [who, verb]
      - slot_not_category: {slot: verb, cat: non_quantity_object_verb}
    emits:
      - fact: rest_quantity
        entity: "{who}"
        verb: "{verb}"

  - id: arithmetic/possessed-location-collection-context
    phase: read
    description: >
      "Mira has a pantry with marbles" introduces an uncounted collection
      inside an owned location. The collection context records the location,
      its owner, and the plural measure without inventing a zero total. Later
      partition anaphors can therefore resolve "them" to marbles, while asks
      about another owner's pantry remain distinct.
    match:
      sentence:
        - {slot: owner, type: entity, referential: true, bare_reference_category: bare_entity_reference}
        - {slot: verb, cat: possession_state, finite_form: true}
        - {lit: [a, an], consume_skipped: true}
        - {slot: place, cat: quantity_location, number: singular}
        - {lit: with}
        - {slot: item, type: plural}
    where:
      - number_compatible: [owner, verb]
      - slot_not_category: {slot: item, cat: many_incompatible_noun}
    emits:
      - fact: collection_context
        holder: "{place}"
        holder_owner: "{owner}"
        collection: "{item}"
        verb: have

  - id: arithmetic/collection-attribute-class-frame
    phase: read
    generation: contextual
    generation_context:
      before:
        - sentence:
            - {slot: context_owner, type: name}
            - {slot: context_verb, cat: possession_state, finite_form: true}
            - {lit: a, consume_skipped: true}
            - {slot: context_place, cat: owned_collection_location, number: singular}
            - {lit: with}
            - {slot: context_item, type: plural}
          where:
            - number_compatible: [context_owner, context_verb]
      target_identity_links:
        context_owner: who
        context_item: item
      required_fact_counts: {collection_context: 1, predication: 1}
    description: >
      A finite quantity predicate can describe plural objects through a count
      of their attribute classes: "She made toys of three different colors in
      it." The chosen verb's declared actor/theme frame decides which subjects
      and objects are compatible. The class count describes diversity, not
      the number of objects or the amount produced, transferred, or consumed.
      Consume that count without emitting an item total, and preserve the
      predicate with an explicitly unquantified object. A total cannot silently
      ignore an activity whose amount is unknown. Generated context reuses the
      target's object identity and does not add an independent semantic filter.
    match:
      sentence:
        - {slot: who, type: entity, referential: true, bare_reference_category: bare_entity_reference}
        - {slot: verb, cat: quantity_ask_verb, finite_form: true}
        - {slot: item, type: plural}
        - {lit: of}
        - {slot: classes, cat: attribute_class_noun, counted: true, qualified: true, qualifier_cat: attribute_class_diversity_adjective}
        - {lit: in}
        - {slot: place, cat: singular_location_anaphor}
    where:
      - number_compatible: [who, verb]
      - verb_roles_compatible:
          verb: verb
          roles: {actor: [who], theme: [item]}
          allow_proper_name: [who]
          require_declared_frame: true
    consumes: [classes]
    emits:
      - fact: predication
        subject: "{who}"
        verb: "{verb}"
        dobj: "{item}"
        dobj_unquantified: true

  - id: arithmetic/partition-cardinal-proportional-delta
    phase: read
    generation: contextual
    generation_context:
      before:
        - sentence:
            - {slot: context_owner, type: entity, referential: true, bare_reference_category: bare_entity_reference}
            - {slot: context_verb, cat: possession_state, finite_form: true}
            - {lit: a, consume_skipped: true}
            - {slot: context_place, cat: quantity_location, number: singular}
            - {lit: with}
            - {slot: context_item, type: plural}
          where:
            - number_compatible: [context_owner, context_verb]
      required_fact_counts: {partition_quantity: 2}
      target_commas_after: [first_attr]
    description: >
      "Sixteen of them are red, and there are 25% more of them in blue"
      states two sibling partitions of one prior collection. The first count
      is explicit; the second is the stated proportional increase or decrease
      from that count. Both become ordinary PartitionQuantity facts, so the
      existing collection resolver and qualified-measure machinery own the
      downstream arithmetic.
    match:
      sentence:
        - {slot: n, type: number, at_start: true}
        - {lit: of}
        - {slot: coll, cat: plural_object_pronoun}
        - {slot: first_verb, cat: copula}
        - {slot: first_attr, cat: color_attribute}
        - {lit: and}
        - {lit: there}
        - {slot: second_verb, cat: copula}
        - {slot: f, type: fraction, fraction_positive: true}
        - {slot: dir, cat: count_quantity_delta}
        - {lit: of}
        - {slot: coll_again, cat: plural_object_pronoun}
        - {slot: attr_prep, cat: partition_attribute_preposition}
        - {slot: second_attr, cat: color_attribute}
    where:
      - same_lemma: [first_verb, second_verb]
      - same_number: [n, first_verb]
      - proportional_delta_compatible: {fraction: f, direction: dir, direction_cat: delta}
      - distinct: [first_attr, second_attr]
    satisfies:
      n: [quantifies]
      coll: [refers]
      coll_again: [refers]
      dir: [standard]
      attr_prep: [object]
    consumes: [n, f]
    emits:
      - fact: partition_quantity
        collection: "{coll}"
        attribute: "{first_attr}"
        value: n
        verb: "{first_verb}"
      - fact: partition_quantity
        collection: "{coll}"
        attribute: "{second_attr}"
        value: "n * (1 + f * sign(dir))"
        verb: "{first_verb}"

  - id: arithmetic/partition-aggregate-share
    phase: read
    description: >
      "There are 25% as many green marbles as there are red and blue
      marbles" sizes one attributed subgroup from the explicit sum of two
      named sibling partitions. The unresolved fact commits nothing until
      both distinct standards are known for one prior collection; its generic
      synthesizer then emits the usual PartitionQuantity.
    match:
      sentence:
        - {lit: there, at_start: true}
        - {slot: verb, cat: copula}
        - opt:
            - {slot: focus, cat: restrictive_focus_adverb}
        - {slot: f, type: fraction, fraction_positive: true}
        - {lit: as}
        - {lit: many}
        - {slot: target, type: qualified, qualifier_cat: color_attribute, number: plural}
        - {lit: as}
        - {lit: there}
        - {slot: standard_verb, cat: copula}
        - {slot: first_attr, cat: color_attribute}
        - {lit: and}
        - {slot: second_standard, type: qualified, qualifier_cat: color_attribute, number: plural}
    where:
      - same_lemma: [verb, standard_verb]
      - same_lemma: [target, second_standard]
      - distinct_measure: [target, second_standard]
      - attribute_compatible: {attribute: first_attr, noun: target}
    satisfies:
      verb: [subject]
      standard_verb: [subject]
    consumes: [f]
    emits:
      - fact: partition_aggregate_share
        collection: "{target}"
        attribute: "{target.qualifier}"
        first_attribute: "{first_attr}"
        second_attribute: "{second_standard.qualifier}"
        fraction: f
        verb: "{verb}"

  - id: arithmetic/partition-attribute
    phase: read
    description: >
      "Ten of THEM are yellow" — N members of a prior collection share an
      attribute (a PartitionQuantity). The plural pronoun denotes the
      collection; the partition synthesizer resolves it against the unique
      prior collection fact (ambiguous or absent context leaves it
      unresolved, and the unresolved-derivation guard declines).
    match:
      sentence:
        - {slot: n, type: number, standalone: true}
        - {lit: of}
        - {slot: coll, cat: plural_object_pronoun}
        - {slot: verb, cat: copula}
        - {slot: attr, type: adjective}
    where:
      - same_number: [n, verb]
    satisfies: {n: [quantifies]}
    consumes: [n]
    emits:
      - fact: partition_quantity
        collection: "{coll}"
        attribute: "{attr}"
        value: "n"
        verb: "{verb}"

  - id: arithmetic/partition-membership
    phase: read
    description: >
      "8 of THEM are dogs" — a MEMBERSHIP-style partition: N members of a
      prior collection ARE a plural common noun, not an adjective (the
      dominant real-world phrasing of a partition). Resolved identically to
      partition-attribute (the same synthesizer resolves the plural pronoun
      against the unique prior collection); a companion synth step then
      emits a Quantity for the named subset noun, so the general
      entity-less "how many NOUN are there" ask answers it directly — no
      bespoke consumer needed.
    match:
      sentence:
        - {slot: n, type: number, standalone: true}
        - {lit: of}
        - {slot: coll, cat: plural_object_pronoun}
        - {slot: verb, cat: copula}
        - {slot: attr, type: plural}
    where:
      - same_number: [n, verb, attr]
    satisfies: {n: [quantifies]}
    consumes: [n]
    emits:
      - fact: partition_quantity
        collection: "{coll}"
        attribute: "{attr}"
        value: "n"
        verb: "{verb}"
        kind: membership

  - id: arithmetic/partition-attribute-fraction
    phase: read
    description: >
      "25% of THEM are red" / "Half of THEM are red" — the FRACTIONAL
      counterpart of partition-attribute: a stated PROPORTION (not a
      cardinal) of a prior collection shares an attribute. Resolved
      identically to partition-attribute (the plural pronoun resolves
      against the unique prior collection); the synthesizer additionally
      sizes the fraction against that collection's own total before
      committing, so an unresolvable total (ambiguous or absent pool)
      leaves it unresolved exactly like fraction-of-pool.
    match:
      sentence:
        - {slot: f, type: fraction}
        - {lit: of}
        - {slot: coll, cat: plural_object_pronoun}
        - {slot: verb, cat: plural_copula}
        - {slot: attr, type: adjective}
    consumes: [f]
    emits:
      - fact: partition_quantity
        collection: "{coll}"
        attribute: "{attr}"
        value: "f"
        verb: "{verb}"
        is_fraction: true

  - id: arithmetic/partition-membership-fraction
    phase: read
    description: >
      "25% of THEM are dogs" — the FRACTIONAL counterpart of
      partition-membership: a stated PROPORTION of a prior collection ARE a
      plural common noun, not an adjective. Resolved identically to
      partition-membership once the fraction sizes against the collection's
      total (see partition-attribute-fraction); the same companion
      membership synth then emits a Quantity for the named subset noun, so
      the general entity-less "how many NOUN are there" ask answers it
      directly — no bespoke consumer needed.
    match:
      sentence:
        - {slot: f, type: fraction}
        - {lit: of}
        - {slot: coll, cat: plural_object_pronoun}
        - {slot: verb, cat: plural_copula}
        - {slot: attr, type: plural}
    consumes: [f]
    emits:
      - fact: partition_quantity
        collection: "{coll}"
        attribute: "{attr}"
        value: "f"
        verb: "{verb}"
        kind: membership
        is_fraction: true

  - id: arithmetic/partition-attribute-of-noun
    phase: read
    description: >
      "6 of the marbles are red" — the definite-NP partition surface: the
      collection is a plural common noun named directly. The definite
      article is claimed explicitly: automatic article skipping must not
      turn the ungrammatical "6 of marbles" into this construction. Since
      the noun IS the
      measure, there is nothing to resolve — the partition synthesizer's
      "already names a real measure" branch leaves it as-is, and the
      unresolved-derivation guard's structural known-measure check (not a
      rule-identity check) recognizes it as resolved directly. Same
      PartitionQuantity fact and partition-complement consumer as
      partition-attribute, reused unchanged. The adjective must additionally
      be licensed for the named noun by a project-declared compatibility
      category pair; this prevents a grammatical token sequence from making
      an unsupported semantic commitment.
    match:
      sentence:
        - {slot: n, type: number, standalone: true}
        - {lit: of}
        - {lit: the, consume_skipped: true}
        - {slot: coll, type: plural}
        - {slot: verb, cat: copula}
        - {slot: attr, type: adjective}
    where:
      - same_number: [n, verb]
      - attribute_compatible: {attribute: attr, noun: coll}
    # The complete partitive connects the standalone count to its collection.
    satisfies: {n: [quantifies]}
    consumes: [n]
    emits:
      - fact: partition_quantity
        collection: "{coll}"
        attribute: "{attr}"
        value: "n"
        verb: "{verb}"

  - id: arithmetic/partition-membership-of-noun
    phase: read
    description: >
      "8 of the animals are dogs" — the definite-NP counterpart of
      partition-membership: the collection is a named plural noun, the
      attribute a distinct plural common noun (membership, not a
      modifier). Same PartitionQuantity fact (kind: membership); the
      companion membership synth step's gate also accepts a collection
      that already names a known measure directly (not only one resolved
      via synth/partition), a structural widening shared with the pronoun
      form, not a per-rule special case.
      `verb, cat: copula` (not the general `verb` type — mining candidate
      modal-spend-measure-price): a membership partition is always a
      COPULAR predication ("ARE dogs"), never any other verb; the
      unrestricted `type: verb` previously let this rule swallow an
      unrelated priced-measure sentence sharing the same surface token
      order ("4 pounds of coffee beans COST 10 dollars each" — 'cost' is a
      verb too), stealing it from learn.py's price-verb emission before it
      ever ran and producing a bogus PartitionQuantity(collection='bean')
      instead of any Price fact. Every real membership-partition instance
      already uses a copula (is/are/was/were), so this is a pure
      narrowing with no coverage loss.
    match:
      sentence:
        - {slot: n, type: number, standalone: true}
        - {lit: of}
        - {lit: the, consume_skipped: true}
        - {slot: coll, type: plural}
        - {slot: verb, cat: copula}
        - {slot: attr, type: plural}
    where:
      - same_number: [n, verb, attr]
      - slot_not_category: {slot: coll, cat: mass_measure}
      # Predicate-noun membership needs an authored ontology, not merely two
      # plural nouns. `animal` is a declared category containing dog/rabbit;
      # unrelated pairs such as student/course therefore remain unread.
      - category_contains: {collection: coll, members: [attr]}
    satisfies: {n: [quantifies]}
    consumes: [n]
    emits:
      - fact: partition_quantity
        collection: "{coll}"
        attribute: "{attr}"
        value: "n"
        verb: "{verb}"
        kind: membership

  # A measurement unit cannot become a member-bearing collection merely
  # because its surface is plural. Consume the exact rejected shape so the
  # generic fold cannot reinterpret it as an unquantified membership fact.
  - id: arithmetic/partition-membership-of-mass-measure-safety
    phase: read
    generation: safety
    match:
      sentence:
        - {slot: n, type: number}
        - {lit: of}
        - {lit: the, consume_skipped: true}
        - {slot: coll, cat: mass_measure, number: plural}
        - {slot: verb, cat: copula}
        - {slot: attr, type: plural}
    where:
      - same_number: [n, verb, attr]
    consumes: [n]
    emits: []

  - id: arithmetic/partition-rest-attribute
    phase: read
    description: >
      "The REST are grey" (mining candidate rest-partitions) — the EXACT
      COMPLEMENT of every OTHER partition already stated for the same
      collection. `partition_remnant` deliberately licenses definite
      "the rest" here, not singular "remainder" or an article-free noun.
      `collection` starts as the remnant placeholder,
      never a real measure, resolved by the partition synthesizer exactly
      as the pronoun placeholder is (the unique-pool-in-play principle) —
      but only once every earlier partition of that collection has itself
      resolved to a real count, at which point the value becomes the
      collection's own total as of this sentence minus their signed sum,
      re-emitted with `is_rest` cleared. `verb, cat: plural_copula`: a rest
      partition is a plural copular predication (are/were), never a
      possession or event verb. That is narrower than
      partition-attribute's cardinal pronoun form on purpose, since "the
      rest" (unlike "N of them") could otherwise sit in front of an
      unrelated priced/rated verb.

      The optional "of the ITEM" span ("the rest OF THE CATS are grey") is
      consumed, including its required definite article, but its noun is
      deliberately never bound into `collection` — the collection stays the
      bare remnant-word placeholder either way, resolved through the SAME
      unique-pool-in-play synth step as the bare surface. A named
      `collection` (the -of-noun surface partition-
      attribute-of-noun uses for the CARDINAL/stated form) would give this
      premise fact the exact same key as its own resolved-value re-
      emission (collection/attribute/verb, unchanged by sizing) and
      self-collide the moment the value changed from the 0 placeholder to
      the real count — is_fraction sizing has the identical constraint,
      which is why it too only ever fires from a placeholder collection.
      When that optional noun is present, `attribute_compatible` requires a
      declared adjective/noun pairing. With no explicit noun the predicate is
      neutral and the discourse-backed "the rest" reading remains available.
    match:
      sentence:
        - {slot: r, cat: partition_remnant, referential: true}
        - opt:
            - {lit: of}
            - {lit: the, consume_skipped: true}
            - {slot: item, type: plural}
        - {slot: verb, cat: plural_copula}
        - {slot: attr, type: adjective}
    where:
      - attribute_compatible: {attribute: attr, noun: item}
    emits:
      - fact: partition_quantity
        collection: "{r}"
        attribute: "{attr}"
        value: "0"
        verb: "{verb}"
        is_rest: true

  - id: arithmetic/partition-rest-membership
    phase: read
    description: >
      "The REST are dogs" (mining candidate rest-partitions) — the
      MEMBERSHIP-style counterpart of partition-rest-attribute: the rest
      names a plural common noun subset, not an adjective. Resolved
      identically (see partition-rest-attribute); the existing companion
      membership synth (`synth/partition-membership-quantity`) then emits a
      Quantity for the named subset noun once the collection resolves, so
      the general entity-less "how many NOUN are there" ask answers it
      directly — no bespoke consumer needed, exactly like
      partition-membership. The same optional, deliberately-unbound "of the
      ITEM" span as partition-rest-attribute (see its description for why).
      Declared non-class predicates such as temporal `times` are refused
      locally without removing that noun from explicit frequency rules.
    match:
      sentence:
        - {slot: r, cat: partition_remnant, referential: true}
        - opt:
            - {lit: of}
            - {lit: the, consume_skipped: true}
            - {slot: item, type: plural}
        - {slot: verb, cat: plural_copula}
        - {slot: attr, type: plural}
    where:
      - bound_requires_category: {bound: item, slot: item, cat: membership_collection_noun}
      - bound_requires_category: {bound: item, slot: attr, cat: membership_member_noun}
      - slot_not_category: {slot: attr, cat: membership_predicate_incompatible_noun}
    emits:
      - fact: partition_quantity
        collection: "{r}"
        attribute: "{attr}"
        value: "0"
        verb: "{verb}"
        kind: membership
        is_rest: true

  - id: arithmetic/ratio-split-of-to
    phase: read
    description: >
      "the ratio of BOYS to GIRLS is 3:2" (mining candidate ratio-split-
      premises) — a collection split by a STATED two-part ratio between
      two labels. Emits a RatioQuantity per label (`fraction` = each
      label's own share of the unnamed collection, m/(m+n) and n/(m+n));
      the ratio synthesizer (saturate.py's `_ratio_split_synth`) resolves
      the collection anchor. That synth deliberately does NOT reuse
      `_pool_before`/`_partition_synth`: a ratio clause typically shares
      its OWN sentence with its anchor ("There are 100 students in class
      AND the ratio of boys to girls is 3:2" — one sentence, joined by
      'and'), unlike the fraction/partition pool machinery, which only
      ever looks at STRICTLY PRIOR sentences (a load-bearing invariant
      elsewhere) — widening that shared scan to also look at the CURRENT
      sentence would widen a shared evidence scan whose callers depend
      on that boundary (docs/methodology.md). RatioQuantity therefore has its own fact kind
      and its own synth instead, leaving every existing pool caller
      byte-for-byte untouched. `verb, cat: copula` — a ratio is always a
      stated copular fact ("is"/"was" 3:2), never any other verb.

      No leading 'the'/'a' token: SKIPPABLE_SENSES already auto-skips any
      article before 'ratio', so both "THE ratio of..." and "A ratio
      of..." match identically, same convention every other rule in this
      file relies on instead of hardcoding an article literal.

      The colon in "3:2" needs no explicit match token either: tokenize.py
      already splits it into its own punctuation unit (senses.py's PUNCT
      set marks ':' as sense 'punct'), which SKIPPABLE_SENSES auto-skips
      between the two adjacent number slots — checked first, per this
      candidate's own brief, before touching the tokenizer at all; no
      kernel touch was needed there.
    match:
      sentence:
        - {lit: ratio}
        - {lit: of}
        - {slot: a, type: plural}
        - {lit: to}
        - {slot: b, type: plural}
        - {slot: verb, cat: copula}
        - {slot: m, type: number}
        - {slot: n, type: number}
    emits:
      - fact: ratio_quantity
        attribute: "{a}"
        fraction: "m / (m + n)"
        verb: "{verb}"
      - fact: ratio_quantity
        attribute: "{b}"
        fraction: "n / (m + n)"
        verb: "{verb}"

  # The former broad state-verb gate admitted possession forms such as
  # "the ratio ... owns 10:90". Preserve a full-span consume-only refusal
  # for that removed sibling so the generic fold cannot invent an anchor.
  - id: arithmetic/ratio-split-of-to-possession-safety
    phase: read
    generation: safety
    match:
      sentence:
        - {lit: ratio}
        - {lit: of}
        - {slot: a, type: plural}
        - {lit: to}
        - {slot: b, type: plural}
        - {slot: verb, cat: possession_state}
        - {slot: m, type: number}
        - {slot: n, type: number}
    emits: []

  - id: arithmetic/stated-currency-holding
    phase: read
    description: >
      A direct currency holding such as "Aven has 20 dollars". This explicit
      rule gives the Designer a bounded premise target for building answerable
      currency asks without copying a question or benchmark example into the
      generator. It is deliberately limited to one complete, unqualified,
      proper-name sentence; the generic learner retains ownership of richer
      common-noun, qualified, partitive, temporal, and coordinated readings.
    match:
      sentence:
        - {slot: who, type: name, at_start: true}
        - {slot: verb, cat: plain_have_state, finite_form: true}
        - {slot: amount, cat: currency, counted: true, bare: true}
        - {lit: ".", consume_skipped: true}
    where:
      - number_compatible: [who, verb]
    consumes: [amount]
    emits:
      - fact: quantity
        entity: "{who}"
        measure: "{amount}"
        value: amount
        verb: "{verb}"

  - id: arithmetic/stated-count-holding
    phase: read
    description: >
      A direct counted holding such as "Aven has 12 apples". This explicit
      target lets the Designer create exact multi-holder evidence without
      inventing a sentence template. It is deliberately limited to one
      complete, unqualified, proper-name sentence; the generic learner retains
      ownership of richer common-noun, qualified, partitive, temporal, and
      coordinated readings.
    match:
      sentence:
        - {slot: who, type: name, at_start: true}
        - {slot: verb, cat: plain_have_state, finite_form: true}
        - {slot: amount, type: counted, bare: true}
        - {lit: ".", consume_skipped: true}
    where:
      - number_compatible: [who, verb]
      - slot_not_category: {slot: amount, cat: many_incompatible_noun}
      - slot_not_category: {slot: amount, cat: mass_quantity_noun}
    consumes: [amount]
    emits:
      - fact: quantity
        entity: "{who}"
        measure: "{amount}"
        value: amount
        verb: "{verb}"

  - id: arithmetic/stated-possessed-location-content
    phase: read
    description: >
      A complete owned-location holding: "Dena's bowl has 7 marbles."
      The owner and any location qualifier belong to this exact instance,
      not a generic per-container class. Richer temporal and coordinated
      sentences remain with the ordinary learner.
    match:
      sentence:
        - {slot: place, cat: quantity_location, possessed: true, number: singular, at_start: true}
        - {slot: verb, cat: plain_have_state, finite_form: true}
        - {slot: item, type: counted, bare: true}
        - {lit: ".", consume_skipped: true}
    where:
      - number_compatible: [place, verb]
      - slot_not_category: {slot: item, cat: many_incompatible_noun}
      - slot_not_category: {slot: item, cat: mass_quantity_noun}
    consumes: [item]
    emits:
      - fact: quantity
        entity: "{place}"
        owner: "{place.owner}"
        qualifier: "{place.qualifier}"
        measure: "{item}"
        value: item
        verb: "{verb}"

  - id: arithmetic/stated-age-at-year
    phase: read
    generation: premise
    description: >
      "The teacher was 20 years old in 1999" states an age at one absolute
      calendar-year coordinate. The entity must be a complete reference and
      compatible with the declared age measure. The final standalone number
      is kept as the coordinate rather than discarded or turned into an
      ordinary timeless Quantity. This licenses elapsed-year projection only
      for the dedicated dated-age fact; other quantities do not inherit a
      trend from appearing beside a year.
    match:
      sentence:
        - {slot: who, type: entity, referential: true, bare_reference_category: bare_entity_reference}
        - {slot: verb, cat: copula}
        - {slot: n, cat: age_measure, counted: true}
        - {lit: old}
        - {lit: in}
        - {slot: calendar_year, type: number, standalone: true, integer: true, value_min: 1000, value_max: 9999}
    where:
      - number_compatible: [who, verb]
      - measure_holder_compatible: {measure: n, holders: [who], allow_proper_name: true}
    satisfies: {calendar_year: [quantifies]}
    consumes: [n, calendar_year]
    emits:
      - fact: age_at_year
        entity: "{who}"
        measure: "{n}"
        value: n
        year: calendar_year
        verb: "{verb}"
        owner: "{who.owner}"
        qualifier: "{who.qualifier}"
        label: "{who.label}"

  - id: arithmetic/stated-age
    phase: read
    description: >
      "Sara is 4 years old" — the copula age predicate: a stated Quantity
      fact scoped to the DATA measure 'year' (the copula + a counted
      `age_measure` noun + the literal 'old' is the grammatical skeleton;
      both the copula and permitted unit remain declared in pack data). This
      lets the general single-entity consumer answer "how old is WHO"
      directly, and the already-shipped anchored-relation-postfix
      synthesizer ("X is N years older/younger than Y") chain through it —
      no new consumer, no date arithmetic, no 'in N years' futures.
    match:
      sentence:
        - {slot: who, type: name}
        - {slot: verb, cat: copula}
        - {slot: n, cat: age_measure, counted: true}
        - {lit: old}
    where:
      - same_number: [who, verb]
    consumes: [n]
    emits:
      - fact: quantity
        temporal_perspective: "{verb.surface}"
        entity: "{who}"
        measure: year
        value: n
        verb: "{verb}"

  - id: arithmetic/temporal-offset-age-future
    phase: read
    description: >
      "In 3 years, Tessa will be 21 years old" (mining candidate
      temporal-offset-age-premises) — a FUTURE temporal-offset age
      premise: the entity's age at a point N years from now, not a direct
      current holding. Emits the SAME Quantity shape arithmetic/stated-age
      does (measure 'year', a state — no `occurrence`), just computed as
      stated-age MINUS the offset, so ask/how-old-is and the relation
      synthesizers chain through it completely unchanged — no new fact
      kind, no new consumer, no date arithmetic beyond one subtraction.
      `{lit: be}` (not `cat: state`) is the grammatical skeleton here:
      English always uses the bare infinitive after a modal ("will be"),
      never 'is'/'was' — this is structure, not a lexicon fact, so it
      needs no category widening. Decline-safety: `absent: relational_
      marker`/`multiplier_marker` (increment 57's clause-boundary
      categories) aborts emission the instant the SAME sentence carries a
      comparative or ratio marker ("will be HALF of Ernesto's age", "will
      be TWICE as old") — those clauses stay for the relation/ratio
      synthesizers to resolve (this pattern's own literal 'old'-anchored,
      plain-number shape never matches them anyway, since a fraction/
      multiplier word never presents as a `type: counted` unit — but the
      explicit gate documents the boundary and blocks the paraphrase-of-
      the-same-clause case where a plain number ALSO happens to appear
      alongside a relational word). Both consumed numbers (the offset and
      the stated future age) are the same accounting story arithmetic/
      stated-age and arithmetic/anchored-relation already use: `consumes`
      marks the slot units read directly, independent of the emitted
      fact's own fields.
    match:
      sentence:
        - {lit: in}
        - {slot: n, cat: age_measure, counted: true}
        - {slot: who, type: name}
        - {slot: aux, cat: future_modal}
        - {lit: be}
        - {slot: m, cat: age_measure, counted: true}
        - {lit: old}
    where:
      - absent: {cat: relational_marker}
      - absent: {cat: multiplier_marker}
    consumes: [n, m]
    emits:
      - fact: quantity
        temporal_perspective: present
        entity: "{who}"
        measure: year
        value: "m - n"
        verb: be

  - id: arithmetic/temporal-offset-age-past
    phase: read
    description: >
      "Five years ago, Tessa was 21 years old" (mining candidate
      temporal-offset-age-premises) — the mirrored PAST form of
      arithmetic/temporal-offset-age-future: the entity's age N years ago,
      resolved to its current age by ADDING the offset (the past form
      naturally uses a past copula — 'was'/'were' — gated by
      `cat: past_copula`, no bare-infinitive skeleton needed here). Same
      Quantity shape, same decline-safety gate, same consumes-based value
      accounting as the future sibling above.
    match:
      sentence:
        - {slot: n, cat: age_measure, counted: true}
        - {lit: ago}
        - {slot: who, type: name}
        - {slot: verb, cat: past_copula}
        - {slot: m, cat: age_measure, counted: true}
        - {lit: old}
    where:
      - number_compatible: [who, verb]
      - absent: {cat: relational_marker}
      - absent: {cat: multiplier_marker}
    consumes: [n, m]
    emits:
      - fact: quantity
        temporal_perspective: present
        entity: "{who}"
        measure: year
        value: "m + n"
        verb: "{verb}"

  - id: arithmetic/temporal-offset-age-future-intensified
    phase: read
    description: >
      A future age with an intensified offset: "In four more years,
      Dena will be 24 years old." The intensifier prevents the ordinary
      adjacent count+noun merge, so this sibling of temporal-offset-age-
      future matches a standalone number, a declared count intensifier,
      and an uncounted age unit. The number and unit must agree; neither
      an already-counted unrelated noun nor a second numeric amount can
      serve as part of this offset. The complete construction structurally
      satisfies the number's quantifies obligation across the intensifier;
      consumes separately accounts for its use in the age calculation.
      The existing current-age Quantity and relation/multiplier exclusion
      gates are shared with the plain future-offset rule.
    match:
      sentence:
        - {lit: in}
        - {slot: n, type: number, standalone: true}
        - {slot: mod, cat: count_intensifier}
        - {slot: yr, cat: age_measure, uncounted: true}
        - {slot: who, type: name}
        - {slot: aux, cat: future_modal}
        - {lit: be}
        - {slot: m, cat: age_measure, counted: true}
        - {lit: old}
    where:
      - same_number: [n, yr]
      - absent: {cat: relational_marker}
      - absent: {cat: multiplier_marker}
    satisfies: {n: [quantifies]}
    consumes: [n, yr, m]
    emits:
      - fact: quantity
        temporal_perspective: present
        entity: "{who}"
        measure: year
        value: "m - n"
        verb: be

  - id: arithmetic/goal-desire-quantity
    phase: read
    description: >
      "Lena wants to collect 30 stamps" / "John intends to arrive at 19
      gardens" — a finite infinitival-goal predicate plus its action introduces
      a stated GOAL quantity, never an event. The matrix vocabulary is supplied
      by one shared grammatical category rather than by this rule. Ordinary
      transitive goal actions take the count directly. A declared arrival verb
      instead requires its declared goal
      preposition and a counted spatial reference; the paired inverse
      condition prevents "arrive 19 gardens" while the existing conditional
      category checks prevent "collect at 19 stamps". A wanted purchase or
      arrival is not evidence that either event happened. The deficit consumer
      resolves the Goal against the entity's single current holding of the
      same measure.
    match:
      sentence:
        - {slot: who, type: name}
        - {slot: want, cat: finite_infinitival_goal_predicate, finite_form: true}
        - {lit: to}
        - {slot: verb, type: verb, bare_form: true}
        - opt:
            - {slot: goal_prep, cat: arrival_goal_preposition}
        - {slot: item, type: counted}
    where:
      - number_compatible: [who, want]
      - bound_requires_category: {bound: goal_prep, slot: verb, cat: arrival_motion_verb}
      - bound_requires_category: {bound: goal_prep, slot: item, cat: spatial_reference_noun}
      - category_requires_bound: {slot: verb, cat: arrival_motion_verb, bound: goal_prep}
    consumes: [item]
    emits:
      - fact: goal
        entity: "{who}"
        measure: "{item}"
        value: "item"
        verb: "{want}"

  - id: arithmetic/goal-need-quantity
    phase: read
    description: >
      "Tom needs 30 apples" / "Tom requires 30 apples" — a direct-quantity
      goal predicate followed by a counted item states a GOAL, never a holding
      or event. Vocabulary membership supplies that non-actual interpretation;
      this rule exists for the direct-object grammar rather than for a
      particular word. It emits the same Goal fact resolved by the generic
      deficit consumer against the entity's current holding.
    match:
      sentence:
        - {slot: who, type: name}
        - {slot: need, cat: direct_quantity_goal_predicate}
        - {slot: item, type: counted}
    where:
      - number_compatible: [who, need]
    consumes: [item]
    emits:
      - fact: goal
        entity: "{who}"
        measure: "{item}"
        value: "item"
        verb: "{need}"

  - id: arithmetic/goal-need-comparative-quantity
    phase: read
    description: >
      "Fia needs 20 fewer pencils than Cato" / "Fia requires 20 fewer pencils
      than Cato" — a comparative goal target. This is not an ordinary
      holdings/event relation: the shared goal-predicate category keeps the
      subject quantity goal-scoped, while the explicit count-agreeing
      measure, count-only direction, and named standard state the relative
      target. The standalone count and noun share declared grammatical
      number, so `1 fewer shopper` and `2 fewer shoppers` use the same rule
      without admitting either disagreement.
      It is deliberately separate from goal-need-quantity's absolute counted
      object and from anchored-relation, whose quantitative-object verb guard
      correctly excludes need.
    match:
      sentence:
        - {slot: who, type: name}
        - {slot: need, cat: direct_quantity_goal_predicate}
        - {slot: n, type: number, standalone: true}
        - {slot: dir, cat: count_quantity_delta}
        - {slot: item, cat: noun}
        - {lit: than}
        - {slot: std, type: name}
    where:
      - number_compatible: [who, need]
      - same_number: [n, item]
      - distinct: [who, std]
      - slot_not_category: {slot: item, cat: many_incompatible_noun}
    satisfies: {n: [quantifies]}
    consumes: [n]
    emits:
      - fact: relation
        subject: "{who}"
        standard: "{std}"
        measure: "{item}"
        factor: 1.0
        offset: "n * sign(dir)"
        verb: "{need}"

  - id: arithmetic/savings-goal-priced-target
    phase: read
    description: >
      A resource-building activity with an explicit priced target, such as
      "Dena is saving money for new shoes which cost $600" or "Aven is raising
      money for a new wallet which costs $300". The target may be singular or
      plural; ordinary determiners and modifiers are handled by the reader.
      The activity is supplied by a shared grammatical category. The amount is
      a Goal, not a holding or unit Price; its target remains attached so a
      later purpose-qualified deficit ask cannot borrow an unrelated monetary
      goal.
    match:
      sentence:
        - {slot: who, type: name}
        - {slot: aux, cat: singular_copula}
        - {slot: save, cat: purpose_resource_goal_activity, present_participle: true}
        - {slot: measure, cat: currency}
        - {lit: for}
        - {slot: target, cat: ownable_quantity_object, generation_all_numbers: true}
        - {lit: which}
        - {slot: cost, cat: price_verb}
        - {slot: amount, cat: currency, counted: true}
    where:
      - number_compatible: [who, aux]
      - number_compatible: [target, cost]
    consumes: [amount]
    emits:
      - fact: goal
        entity: "{who}"
        measure: "{amount}"
        value: "amount"
        verb: "{save}"
        target: "{target}"

  - id: arithmetic/goal-progress-fraction-needed
    phase: read
    description: >
      "Dena has half the money she needs" and "Aven has one third of the money
      she needs" state current progress relative to the subject's unique
      compatible Goal. The optional `of` belongs to the fraction-of-a-whole
      construction. The reserved standard is resolved by the generic
      goal-progress synthesizer; without exactly one goal the relation remains
      unresolved and no holding is invented.
    match:
      sentence:
        - {slot: who, type: name}
        - {slot: have, cat: possession_state, finite_form: true}
        - opt:
            - {slot: focus, cat: restrictive_focus_adverb}
        - {slot: f, type: fraction, word_fraction_within_whole: true, fraction_positive: true}
        - opt:
            - {lit: of}
        - {lit: the, consume_skipped: true}
        - {slot: measure, cat: currency}
        - {slot: pron, cat: animate_pronoun}
        - {slot: need, cat: direct_quantity_goal_predicate, finite_form: true}
    where:
      - number_compatible: [who, have]
      - number_compatible: [who, pron, need]
    consumes: [f]
    emits:
      - fact: relation
        subject: "{who}"
        standard: "$goal:subject$"
        measure: "{measure}"
        factor: "f"
        offset: 0.0
        verb: "{have}"

  - id: arithmetic/committed-transfer-conjoined-relative
    phase: read
    description: >
      A committed contribution followed by an elided comparative sibling:
      "her guardian decided to give her $40, and her brother three times as
      much as her guardian". An explicit purpose-reference adjunct such as
      "for that purpose" may follow the first amount. It licenses only the
      declared purpose preposition and purpose noun; it does not turn arbitrary
      trailing material into part of the transfer. Both contributors, the
      shared beneficiary, and both amounts are preserved as Contribution facts.
      The second amount inherits only the explicitly repeated standard
      contributor and multiplier.
    match:
      sentence:
        - {slot: poss1, cat: possessive_determiner}
        - {slot: giver1, cat: animate}
        - {slot: decision, cat: committed_transfer_decision_verb, finite_form: true}
        - {lit: to}
        - {slot: give, cat: contribution_transfer_verb, bare_form: true}
        - {slot: recipient, cat: animate_object_pronoun}
        - {slot: item, cat: currency, counted: true}
        - opt:
            - {slot: purpose_prep, cat: purpose_preposition}
            - {lit: that, consume_skipped: true}
            - {slot: contribution_purpose, cat: purpose_noun}
        - {lit: and}
        - {slot: poss2, cat: possessive_determiner}
        - {slot: giver2, cat: animate}
        - {slot: k, type: multiplier}
        - {lit: as}
        - {lit: much}
        - {lit: as}
        - {slot: poss3, cat: possessive_determiner}
        - {slot: std, cat: animate}
    where:
      - number_compatible: [giver1, decision]
      - same_surface: [poss1, recipient, poss2, poss3]
      - same_lemma: [giver1, std]
      - distinct: [giver2, std]
      - verb_roles_compatible:
          verb: give
          roles: {actor: [giver1], theme: [item]}
    satisfies:
      poss1: [refers]
      poss2: [refers]
      poss3: [refers]
      purpose_prep: [object]
    consumes: [item, k]
    emits:
      - fact: contribution
        beneficiary: "{recipient}"
        contributor: "{giver1}"
        measure: "{item}"
        value: "item"
        verb: "{give}"
      - fact: contribution
        beneficiary: "{recipient}"
        contributor: "{giver2}"
        measure: "{item}"
        value: "k * item"
        verb: "{give}"
        segment: 1

  - id: arithmetic/activity-scoped-wage-rate
    phase: read
    description: >
      An explicitly activity-scoped wage rate such as "Natalia earns $12 an
      hour for gardening". The ordinary Rate retains the numeric rate while a
      separate RateScope preserves which activity the trailing `for` phrase
      restricts. Consumers must match that scope to an ActivityDuration; they
      may not borrow an unrelated elapsed-time quantity.
    match:
      sentence:
        - {slot: who, type: entity, common_noun_cat: earning_quantity_participant, referential: true, bare_reference_category: bare_entity_reference}
        - {slot: verb, cat: wage_verb, finite_form: true}
        - {slot: pay, cat: currency_measure, counted: true}
        - {lit: [a, an], consume_skipped: true}
        - {slot: span, cat: duration_measure, number: singular}
        - {lit: for}
        - {slot: activity, cat: compensated_activity}
    where:
      - number_compatible: [who, verb]
    consumes: [pay]
    emits:
      - fact: rate
        entity: "{who}"
        measure: "{pay}"
        per: "{span}"
        value: "pay"
        verb: "{verb}"
      - fact: rate_scope
        participant: "{who}"
        activity: "{activity}"
        verb: "{verb}"

  - id: arithmetic/performed-activity-duration
    phase: read
    description: >
      A dated elapsed duration for one named activity, such as "Yesterday she
      did 50 minutes of gardening". This is a dedicated ActivityDuration, not
      a Quantity holding. The activity and participant must later agree with
      an explicit RateScope before rate-span arithmetic can use it.
    match:
      sentence:
        - {slot: period, cat: past_day_marker}
        - {slot: who, type: entity, common_noun_cat: earning_quantity_participant, referential: true, bare_reference_category: bare_entity_reference}
        - opt:
            - {slot: focus_before, cat: restrictive_focus_adverb}
        - {slot: action, cat: activity_duration_verb}
        - opt:
            - {slot: focus_after, cat: restrictive_focus_adverb}
        - {slot: span, cat: duration_measure, counted: true}
        - {lit: of}
        - {slot: activity, cat: compensated_activity}
    where:
      - mutually_exclusive: [focus_before, focus_after]
    consumes: [span]
    emits:
      - fact: activity_duration
        participant: "{who}"
        activity: "{activity}"
        elapsed: "span"
        unit: "{span}"
        verb: "{action}"
        time: "{period}"

  - id: arithmetic/extraposed-duration-rate
    phase: read
    description: >
      "It takes her 5 minutes to paint a lily" (mining candidate
      extraposed-duration-rates) — the extraposed-infinitive duration
      idiom as a PREMISE, stating a COMPOUND rate exactly like
      `_compound_rate_span` in learn.py ("reads 8 pages in 20 minutes"),
      just SVO-inverted: the elapsed span comes before the infinitive
      clause naming the counted item, so value = item/span with
      numerator/denominator preserved for value-accounting exactly as
      the SVO compound-rate branch does (Rate's docstring, model.py).
      The 'it'/'to' literals are grammatical skeleton — the SAME
      extraposed-infinitive construction ask/how-long-take-span's own
      comment already documents as structure, not lexicon. The verb is
      gated on the narrow `duration_verb` category — declared in
      packs/core-english/categories/core.yaml (parent: verb, no members
      there, since 'take' is a difg-mined-only lexicon entry), membered
      in packs/difg-mined/categories/semantic.yaml, the SAME
      declared-in-core/membered-in-mined split 'negation'/'future_modal'
      already use, so a core-english-only registry still compiles this
      rule — rather than a literal: unlike the ask side (always the bare
      infinitive after a modal — one literal fold), a declarative
      premise inflects for tense (takes/took), so the category names
      both inflections directly — mirrors the
      spend_verb/price_verb/wage_verb narrow-gate precedent.

      `consumes: [span, item]` marks the two counted slots read directly
      (independent of the emitted fact's own fields — the same
      discipline arithmetic/temporal-offset-age-future documents).
      Because `verb` and `item` are inside this rule's OWN matched span,
      they become `pattern_consumed` (document.py round 0), which makes
      learn.py's general SVO fold skip the infinitive clause entirely
      (a pattern_consumed verb or dobj is never re-folded) — so it never
      ALSO folds as a bare Quantity holding on the entity (today's
      behavior, and a fold CONFLICT the instant more than one such
      clause is conjoined in one sentence, since they collide on the
      same signed-quantity key). Never a holding — a compound rate is
      not a balance (the increment-58 invariant, verbatim).

      Infrastructure only: the existing rate-span-inverse consumer
      (answer.py) already resolves the inverse span ask the instant a
      matching Rate exists (verified: "Dev can wash 4 windows in 10
      minutes. How many minutes will it take Dev to wash 64 windows?"
      commits 160.0 today) — this rule only supplies the missing Rate
      for the PREMISE side of the idiom. 0 SOLVED is expected from this
      increment alone; the payoff is a separate widening of the
      how-long/how-many-timeunit-take-span asks' `item` slot and a
      conjoined-list consumer sum, named in this candidate's `unblocks`.
    match:
      sentence:
        - {lit: it}
        - {slot: v, cat: duration_verb}
        - {slot: who, type: entity, referential: true, bare_reference_category: bare_entity_reference}
        - {slot: span, cat: duration_measure, counted: true}
        - {lit: to}
        - {slot: verb, type: verb, bare_form: true}
        - {slot: item, type: counted}
    where:
      # The intervening entity controls the infinitive: in "It takes the
      # teacher 5 minutes to receive 4 parcels", the teacher is the receiver.
      # Quantity-changing verbs therefore require a declared plausible event
      # participant. Other infinitives keep their existing entity breadth.
      - verb_role_compatible: {verb: verb, roles: [who], verb_cat: quantity_event_verb, role_cat: quantity_event_participant}
    consumes: [span, item]
    emits:
      - fact: rate
        entity: "{who}"
        measure: "{item}"
        per: "{span}"
        value: "item / span"
        verb: "{verb}"
        numerator: "{item.value}"
        denominator: "{span.value}"

  - id: arithmetic/task-completion-duration
    phase: read
    description: >
      A referential participant taking one declared elapsed duration to
      finish one exact task object. The duration remains a dedicated typed
      fact rather than a Quantity holding or a compound production rate.
    match:
      sentence:
        - {slot: who, type: entity, referential: true, bare_reference_category: bare_entity_reference}
        - {slot: took, cat: duration_verb, finite_form: true}
        - {slot: span, cat: duration_measure, counted: true}
        - {lit: to}
        - {slot: verb, cat: task_completion_verb, bare_form: true}
        - opt:
            - {slot: task_poss, cat: possessive_determiner}
        - {slot: task, type: noun, referential: true}
    where:
      - number_compatible: [who, took]
      - verb_roles_compatible:
          verb: verb
          roles: {actor: [who], theme: [task]}
          frame_categories: [task_completion_verb]
          allow_proper_name: [who]
    consumes: [span]
    emits:
      - fact: task_completion_duration
        participant: "{who}"
        task: "{task.qualified}"
        elapsed: "span"
        unit: "{span}"
        verb: "{verb}"

  - id: arithmetic/coordinated-task-completion-durations
    phase: read
    description: >
      Two complete coordinated duration clauses state elapsed times for two
      distinct referential participants completing the same task. The first
      clause names the exact task object and the second uses the dedicated
      singular task anaphor, keeping the coordination bounded without a broad
      clause split or retry.
    match:
      sentence:
        - {slot: a, type: entity, referential: true, bare_reference_category: bare_entity_reference}
        - {slot: took_a, cat: duration_verb, finite_form: true}
        - {slot: span_a, cat: duration_measure, counted: true}
        - {lit: to}
        - {slot: verb_a, cat: task_completion_verb, bare_form: true}
        - opt:
            - {slot: task_poss, cat: possessive_determiner}
        - {slot: task_a, type: noun, referential: true}
        - {slot: coord, cat: task_completion_duration_coordinator}
        - {slot: b, type: entity, referential: true, bare_reference_category: bare_entity_reference}
        - {slot: took_b, cat: duration_verb, finite_form: true}
        - {slot: span_b, cat: duration_measure, counted: true}
        - {lit: to}
        - {slot: verb_b, cat: task_completion_verb, bare_form: true}
        - {slot: task_ref, cat: task_completion_object_anaphor}
    where:
      - number_compatible: [a, took_a]
      - number_compatible: [b, took_b]
      - same_lemma: [verb_a, verb_b]
      - distinct: [a, b]
      - verb_roles_compatible:
          verb: verb_a
          roles: {actor: [a, b], theme: [task_a]}
          frame_categories: [task_completion_verb]
          allow_proper_name: [a, b]
    satisfies:
      took_b: [subject]
      task_ref: [refers]
    consumes: [span_a, span_b]
    emits:
      - fact: task_completion_duration
        participant: "{a}"
        task: "{task_a.qualified}"
        elapsed: "span_a"
        unit: "{span_a}"
        verb: "{verb_a}"
      - fact: task_completion_duration
        participant: "{b}"
        task: "{task_a.qualified}"
        elapsed: "span_b"
        unit: "{span_b}"
        verb: "{verb_b}"

  - id: arithmetic/periodic-rate-every-span
    phase: read
    description: >
      "A wheel makes 6 turns every 30 seconds" (mining candidate
      rate-every-span-asks) — a PERIODIC rate premise: the SVO-direct
      twin of the compound-rate fold already read for "reads 8 pages in
      20 minutes" (`_compound_rate_span`, learn.py), just marked with a
      definite frequency quantifier ('every') instead of the
      `span_preposition` category ('in'). The dedicated
      `frequency_quantifier` class excludes existential/amount quantifiers
      such as `some`, while `duration_measure, counted: true` requires an
      explicit denominator such as "6 years" rather than an unrelated
      counted object. Emits the SAME Rate fact shape as
      arithmetic/extraposed-duration-rate above (a COMPOUND rate,
      numerator/denominator preserved for value-accounting), read by the
      existing rate-span/rate-span-inverse consumers unchanged.

      Fixes a LATENT PRECISION hazard, not only a coverage gap: today
      this exact sentence shape never satisfies `_compound_rate_span`
      (whose forward scan requires a `preposition`-sense word, and
      'every' is sensed `quantifier`), so the general SVO fold instead
      reads the dobj as a bare Quantity (entity=wheel, measure=turns,
      value=6) and SEPARATELY reads the "every 30 seconds" span as a
      second, unrelated Quantity (measure=seconds, value=30) — two junk
      facts in the store instead of one Rate. Because this rule's own
      match span covers `verb` and `item` (and `span`), ALL of them are
      marked `pattern_consumed` at document.py round 0, and learn.py's
      general fold explicitly skips any verb whose dobj is
      `pattern_consumed` (the same short-circuit arithmetic/extraposed-
      duration-rate already relies on for its own infinitive clause) —
      so the moment this rule matches, both junk Quantities disappear
      and only the Rate fact remains. A sentence that does NOT match
      this shape (no quantifier immediately after the counted item, or
      no counted noun immediately after the quantifier) is completely
      unaffected — the general fold runs exactly as before.

      `consumes: [item, span]` documents the two directly-read counted
      slots for value-accounting, mirroring arithmetic/extraposed-
      duration-rate's own convention (the field itself is informational;
      the actual pattern_consumed marking comes from the match span).

      `opt: [{slot: aux, type: modal}]` between `who` and `verb`: a
      CAPACITY-marked premise ("Priya CAN produce 8 pages every 4
      minutes") states the same periodic rate with a modal auxiliary
      between subject and verb — the general SVO fold already binds
      subject/dobj through this via OBLIGATIONS regardless of the
      intervening token (learn.py's `_bound` reads the dependency graph,
      not surface adjacency), but this rule matches raw TOKEN sequence,
      so without the optional slot a modal premise fails to match at all
      and falls through to the same junk distributive-multiply reading
      this rule exists to subsume. When that optional modal binds,
      `bound_requires_form` requires the following verb's bare form; without
      a modal, ordinary finite SVO agreement remains valid. The auxiliary
      binds nothing downstream (never referenced in `emits`) — it exists so
      the token is consumed when present.
    match:
      sentence:
        - {slot: who, type: entity, common_noun_cat: quantity_holder, referential: true, bare_reference_category: bare_entity_reference}
        - opt:
            - {slot: aux, type: modal}
        - {slot: verb, type: verb, finite_form: true}
        - {slot: item, type: counted}
        - {slot: freq, cat: frequency_quantifier}
        - {slot: span, cat: duration_measure, counted: true}
    where:
      - bound_requires_form: {bound: aux, slot: verb, form: bare}
      - verb_role_compatible: {verb: verb, roles: [who], verb_cat: quantity_event_verb, role_cat: quantity_event_participant}
      - verb_roles_compatible:
          verb: verb
          roles:
            actor: [who]
            theme: [item]
          allow_proper_name: [who]
      - slot_not_category: {slot: who, cat: non_quantity_holder}
    consumes: [item, span]
    emits:
      - fact: rate
        entity: "{who}"
        measure: "{item}"
        per: "{span}"
        value: "item / span"
        verb: "{verb}"
        numerator: "{item.value}"
        denominator: "{span.value}"

  - id: arithmetic/periodic-output-per-unit
    phase: read
    description: >
      A productive event can state its output through a measured product:
      "Aven writes a 40-page book every week." The hyphenated count belongs
      to the product's measure, not to the number of products, and the bare
      recurring unit means one unit. The measure/product licence comes from
      measure_holder_compatibility; extending that data admits another valid
      pair without changing this rule.
    match:
      sentence:
        - {slot: who, type: entity, common_noun_cat: production_quantity_participant, referential: true, bare_reference_category: bare_entity_reference}
        - {slot: verb, type: verb, finite_form: true}
        - {lit: [a, an], consume_skipped: true}
        - {slot: product, cat: output_quantity_product, qualified: true, attributive_counted: true, qualifier_cat: output_quantity_measure}
        - {slot: freq, cat: frequency_quantifier}
        - {slot: span, cat: duration_measure, number: singular}
    where:
      - number_compatible: [who, verb]
      - verb_roles_compatible:
          verb: verb
          roles:
            actor: [who]
            theme: [product]
          allow_proper_name: [who]
    consumes: [product]
    emits:
      - fact: rate
        entity: "{who}"
        measure: "{product.qualifier}"
        per: "{span}"
        value: "product"
        verb: "{verb}"

  - id: arithmetic/periodic-output-per-recipient-frequency
    phase: read
    description: >
      A measured product can be made once for each explicitly counted
      recipient, several times per cadence unit: "Tova writes a 5-page letter
      to 3 friends twice a week." The resulting page rate is pages per letter
      multiplied by recipients and occurrences. Both the governing verb and
      product opt into the unit-recipient frame; this does not make ordinary
      books one-per-reader, and an uncounted audience supplies no multiplier.
    match:
      sentence:
        - {slot: who, type: entity, common_noun_cat: production_quantity_participant, referential: true, bare_reference_category: bare_entity_reference}
        - {slot: verb, cat: unit_recipient_output_verb, finite_form: true}
        - {lit: [a, an], consume_skipped: true}
        - {slot: product, cat: unit_recipient_output_product, qualified: true, attributive_counted: true, qualifier_cat: output_quantity_measure}
        - {slot: recipient_prep, cat: destination_preposition}
        - {slot: recipients, cat: animate, counted: true, number: plural}
        - {slot: frequency, type: multiplier}
        - {lit: [a, an], consume_skipped: true}
        - {slot: span, cat: duration_measure, number: singular}
    where:
      - number_compatible: [who, verb]
      - verb_roles_compatible:
          verb: verb
          roles:
            actor: [who]
            theme: [product]
            recipient: [recipients]
          frame_categories: [unit_recipient_output_verb]
          allow_proper_name: [who]
    consumes: [product, recipients, frequency]
    emits:
      - fact: rate
        entity: "{who}"
        measure: "{product.qualifier}"
        per: "{span}"
        value: "product * recipients * frequency"
        verb: "{verb}"

  - id: arithmetic/content-progress-measured-product
    phase: read
    description: >
      "Aven is reading a 60-page book" states two independent pieces of
      evidence: Aven is engaged in reading the book, and the book has 60
      pages. The measured product is context, not 60 pages already read.
      Keeping its extent on the product prevents a later event-total ask from
      silently adding the whole book to the reader's completed progress.
    match:
      sentence:
        - {slot: who, type: entity, common_noun_cat: quantity_event_participant, referential: true, bare_reference_category: bare_entity_reference}
        - {slot: aux, cat: copula}
        - {slot: verb, cat: content_progress_quantity_verb, present_participle: true}
        - {lit: [a, an], consume_skipped: true}
        - {slot: product, cat: content_progress_product, qualified: true, attributive_counted: true, qualifier_cat: content_progress_measure}
    where:
      - number_compatible: [who, aux]
      - verb_roles_compatible:
          verb: verb
          roles:
            actor: [who]
            theme: [product]
          allow_proper_name: [who]
    consumes: [product]
    emits:
      - fact: predication
        subject: "{who}"
        verb: "{verb}"
        dobj: "{product}"
      - fact: quantity
        entity: "{product}"
        measure: "{product.qualifier}"
        value: "product"
        verb: have

  - id: arithmetic/recipient-count-transfer-proportional-periods
    phase: read
    description: >
      A unit-recipient outbound transfer followed by a proportional transfer
      in another named calendar period: "Mira sold stickers to 32 of her
      students in March, and then she sold one fourth as many stickers in
      April." In this narrow word-problem construction, the counted recipient
      set supplies the first item count (one item per counted recipient); the
      explicitly repeated item and compatible transfer verb license the second
      count. The vocabulary-owned `unit_recipient_transfer_verb` category
      controls which transfer predicates may use this convention. General
      transfers, uncounted recipient sets, mismatched items or verbs, and
      repeated periods remain outside the rule.
    match:
      sentence:
        - {slot: who, type: entity, common_noun_cat: quantity_event_participant, referential: true, bare_reference_category: bare_entity_reference}
        - {slot: first_verb, cat: unit_recipient_transfer_verb, finite_form: true}
        - {slot: item, cat: transferable_quantity_object, number: plural}
        - {slot: recipient_prep, cat: destination_preposition}
        - {slot: recipient_count, type: number}
        - {lit: of}
        - {slot: possessor, cat: third_person_animate_possessive_determiner}
        - {slot: recipients, cat: animate, number: plural}
        - {slot: first_time_prep, cat: temporal_in_point_preposition}
        - {slot: first_period, cat: named_month}
        - {lit: and}
        - {slot: sequence, cat: narration_sequence_adverb}
        - {slot: subject_echo, cat: animate_pronoun}
        - {slot: second_verb, cat: unit_recipient_transfer_verb, finite_form: true}
        - {slot: share, type: fraction, word_fraction_within_whole: true, fraction_positive: true}
        - {lit: as}
        - {lit: many}
        - {slot: second_item, cat: transferable_quantity_object, number: plural}
        - {slot: second_time_prep, cat: temporal_in_point_preposition}
        - {slot: second_period, cat: named_month}
    where:
      - same_lemma: [first_verb, second_verb]
      - same_lemma: [item, second_item]
      - same_lemma: [first_time_prep, second_time_prep]
      - number_compatible: [who, first_verb]
      - number_compatible: [subject_echo, second_verb]
      - distinct: [first_period, second_period]
      - attribute_compatible: {attribute: first_time_prep, noun: first_period}
      - attribute_compatible: {attribute: second_time_prep, noun: second_period}
      - verb_roles_compatible:
          verb: first_verb
          roles:
            actor: [who]
            theme: [item]
            recipient: [recipients]
          allow_proper_name: [who]
    satisfies:
      recipient_count: [quantifies]
      possessor: [refers]
      subject_echo: [refers]
    consumes: [recipient_count, share]
    emits:
      - fact: quantity
        entity: "{who}"
        measure: "{item}"
        measure_qualifier: "{item.qualifier}"
        value: recipient_count
        verb: "{first_verb}"
        time: "{first_period}"
      - fact: quantity
        entity: "{who}"
        measure: "{second_item}"
        measure_qualifier: "{second_item.qualifier}"
        value: "recipient_count * share"
        verb: "{second_verb}"
        time: "{second_period}"

  - id: arithmetic/recipient-counted-transfer-proportional-periods
    phase: read
    description: >
      The direct counted-recipient sibling of
      arithmetic/recipient-count-transfer-proportional-periods: "Mira sold
      stickers to 32 students in March, and then she sold one fourth as many
      stickers in April." The counted destination must be animate, so this
      does not reinterpret arbitrary destinations such as "32 books" as a
      transfer count. The same narrow unit-recipient word-problem convention,
      repeated verb/item boundary, and distinct named-period boundary apply.
    match:
      sentence:
        - {slot: who, type: entity, common_noun_cat: quantity_event_participant, referential: true, bare_reference_category: bare_entity_reference}
        - {slot: first_verb, cat: unit_recipient_transfer_verb, finite_form: true}
        - {slot: item, cat: transferable_quantity_object, number: plural}
        - {slot: recipient_prep, cat: destination_preposition}
        - {slot: recipients, cat: animate, counted: true, number: plural}
        - {slot: first_time_prep, cat: temporal_in_point_preposition}
        - {slot: first_period, cat: named_month}
        - {lit: and}
        - {slot: sequence, cat: narration_sequence_adverb}
        - {slot: subject_echo, cat: animate_pronoun}
        - {slot: second_verb, cat: unit_recipient_transfer_verb, finite_form: true}
        - {slot: share, type: fraction, word_fraction_within_whole: true, fraction_positive: true}
        - {lit: as}
        - {lit: many}
        - {slot: second_item, cat: transferable_quantity_object, number: plural}
        - {slot: second_time_prep, cat: temporal_in_point_preposition}
        - {slot: second_period, cat: named_month}
    where:
      - same_lemma: [first_verb, second_verb]
      - same_lemma: [item, second_item]
      - same_lemma: [first_time_prep, second_time_prep]
      - number_compatible: [who, first_verb]
      - number_compatible: [subject_echo, second_verb]
      - distinct: [first_period, second_period]
      - attribute_compatible: {attribute: first_time_prep, noun: first_period}
      - attribute_compatible: {attribute: second_time_prep, noun: second_period}
      - verb_roles_compatible:
          verb: first_verb
          roles:
            actor: [who]
            theme: [item]
            recipient: [recipients]
          allow_proper_name: [who]
    satisfies:
      subject_echo: [refers]
    consumes: [recipients, share]
    emits:
      - fact: quantity
        entity: "{who}"
        measure: "{item}"
        measure_qualifier: "{item.qualifier}"
        value: recipients
        verb: "{first_verb}"
        time: "{first_period}"
      - fact: quantity
        entity: "{who}"
        measure: "{second_item}"
        measure_qualifier: "{second_item.qualifier}"
        value: "recipients * share"
        verb: "{second_verb}"
        time: "{second_period}"

  - id: arithmetic/realized-progress-anaphoric-multiplier
    phase: read
    description: >
      A realized measured event in one relative period followed by a
      proportional event in another: "Last week Aven was able to read 12
      pages, and today Aven read twice as many pages." The second amount is
      anchored to the immediately preceding count in this same construction,
      not to an arbitrary document quantity. Both events retain their period
      labels and can be summed by the ordinary same-verb event-total consumer.
      A named comparison standard remains unsupported and blocks this reader.
    match:
      sentence:
        - {slot: prior_period, cat: duration_measure, qualified: true, qualifier_cat: relative_period_attribute, number: singular}
        - {slot: who_a, type: entity, common_noun_cat: quantity_event_participant, referential: true, bare_reference_category: bare_entity_reference}
        - {slot: aux, cat: past_copula}
        - {slot: success, cat: realized_ability_adjective}
        - {lit: to}
        - {slot: verb_a, cat: content_progress_quantity_verb, bare_form: true}
        - {slot: item_a, cat: content_progress_measure, counted: true}
        - {lit: and}
        - {slot: current_period, cat: current_day_marker}
        - {slot: who_b, type: entity, common_noun_cat: quantity_event_participant, referential: true, bare_reference_category: bare_entity_reference}
        - {slot: verb_b, cat: content_progress_quantity_verb, finite_form: true}
        - {slot: k, type: nonunit_multiplier}
        - {lit: as, consume_skipped: true}
