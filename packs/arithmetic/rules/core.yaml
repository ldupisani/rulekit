  - id: arithmetic/affine-times-as-much
    phase: read
    description: >
      mining candidate relation-standard-frames: "Alexa has $250 less than
      twice as much money as Cecil" — the MASS-NOUN sibling of arithmetic/
      affine-times-as-many, one field over exactly like arithmetic/times-
