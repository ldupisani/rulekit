      - same_lemma: [verb_a, verb_b]
      - same_lemma: [item_a, item_b]
      - distinct: [prior_period, current_period]
      - slot_not_category: {slot: k, cat: predeterminer_multiplier}
      - verb_roles_compatible:
          verb: verb_a
          roles:
            actor: [who_a]
            theme: [item_a]
          allow_proper_name: [who_a]
      - verb_roles_compatible:
          verb: verb_b
          roles:
            actor: [who_b]
            theme: [item_b]
          allow_proper_name: [who_b]
      - unbound: [standard_seen]
    consumes: [item_a, k]
    emits:
      - fact: quantity
        entity: "{who_a}"
        measure: "{item_a}"
        value: "item_a"
        verb: "{verb_a}"
        time: "{prior_period}"
      - fact: quantity
        entity: "{who_b}"
        measure: "{item_b}"
        value: "k * item_a"
        verb: "{verb_b}"
        time: "{current_period}"

  - id: arithmetic/realized-progress-deictic-explicit-standard-multiplier
    phase: read
    description: >
      Explicit temporal-standard sibling: "Yesterday Aven was able to read
      12 pages, and today Aven read twice as many pages as yesterday." The
      repeated past-day marker must denote the same earlier coordinate that
      owns the stated count. A different or non-temporal standard remains for
      the consume-only safety boundary.
    match:
      sentence:
        - {slot: prior_period, cat: past_day_marker}
        - {slot: who_a, type: entity, common_noun_cat: quantity_event_participant, referential: true, bare_reference_category: bare_entity_reference}
        - {slot: aux, cat: past_copula}
        - {slot: success, cat: realized_ability_adjective}
        - {lit: to}
        - {slot: verb_a, cat: content_progress_quantity_verb, bare_form: true}
        - {slot: item_a, cat: content_progress_measure, counted: true}
        - {lit: and}
        - {slot: current_period, cat: current_day_marker}
        - {slot: who_b, type: entity, common_noun_cat: quantity_event_participant, referential: true, bare_reference_category: bare_entity_reference}
        - {slot: verb_b, cat: content_progress_quantity_verb, finite_form: true}
        - {slot: k, type: nonunit_multiplier}
        - {lit: as, consume_skipped: true}
        - {lit: many}
        - {slot: item_b, cat: content_progress_measure, number: plural}
        - {lit: as, consume_skipped: true}
        - {slot: standard_period, cat: past_day_marker}
    where:
      - number_compatible: [who_a, aux]
      - number_compatible: [who_b, verb_b]
      - same_lemma: [who_a, who_b]
      - same_lemma: [verb_a, verb_b]
      - same_lemma: [item_a, item_b]
      - same_lemma: [prior_period, standard_period]
      - distinct: [prior_period, current_period]
      - slot_not_category: {slot: k, cat: predeterminer_multiplier}
      - verb_roles_compatible:
          verb: verb_a
          roles:
            actor: [who_a]
            theme: [item_a]
          allow_proper_name: [who_a]
      - verb_roles_compatible:
          verb: verb_b
          roles:
            actor: [who_b]
            theme: [item_b]
          allow_proper_name: [who_b]
    consumes: [item_a, k]
    emits:
      - fact: quantity
        entity: "{who_a}"
        measure: "{item_a}"
        value: "item_a"
        verb: "{verb_a}"
        time: "{prior_period}"
      - fact: quantity
        entity: "{who_b}"
        measure: "{item_b}"
        value: "k * item_a"
        verb: "{verb_b}"
        time: "{current_period}"

  - id: arithmetic/realized-progress-deictic-anaphoric-multiplier-safety
    phase: read
    generation: safety
    description: >
      Consume-only boundary for the bare-day realized-progress construction.
      It prevents the first count from surviving alone when actor, verb,
      measure, multiplier, or explicit comparison scope invalidates the
      positive sibling.
    match:
      sentence:
        - {slot: prior_period, cat: past_day_marker}
        - {slot: who_a, type: entity, referential: true, bare_reference_category: bare_entity_reference}
        - {slot: aux, cat: past_copula}
        - {slot: success, cat: realized_ability_adjective}
        - {lit: to}
        - {slot: verb_a, cat: content_progress_quantity_verb, bare_form: true}
        - {slot: item_a, cat: content_progress_measure, counted: true}
        - {lit: and}
        - {slot: current_period, cat: current_day_marker}
        - {slot: who_b, type: entity, referential: true, bare_reference_category: bare_entity_reference}
        - {slot: verb_b, cat: content_progress_quantity_verb, finite_form: true}
        - {slot: k, type: nonunit_multiplier}
        - {lit: as, consume_skipped: true}
        - {lit: many}
        - {slot: item_b, cat: content_progress_measure, number: plural}
        - opt:
            - {lit: as, consume_skipped: true}
            - {slot: standard_seen, type: word}
    consumes: [item_a, k]
    emits: []

  - id: arithmetic/realized-progress-anaphoric-multiplier-safety
    phase: read
    generation: safety
    description: >
      Consume-only boundary for the realized-progress construction when its
      actors, verbs, measures, or comparison scope do not satisfy the positive
      rule. Without this guard, the fallback fold can return only the first
      event and silently discard the unresolved proportional clause.
    match:
      sentence:
        - {slot: prior_period, cat: duration_measure, qualified: true, qualifier_cat: relative_period_attribute, number: singular}
        - {slot: who_a, type: entity, referential: true, bare_reference_category: bare_entity_reference}
        - {slot: aux, cat: past_copula}
        - {slot: success, cat: realized_ability_adjective}
        - {lit: to}
        - {slot: verb_a, cat: content_progress_quantity_verb, bare_form: true}
        - {slot: item_a, cat: content_progress_measure, counted: true}
        - {lit: and}
        - {slot: current_period, cat: current_day_marker}
        - {slot: who_b, type: entity, referential: true, bare_reference_category: bare_entity_reference}
        - {slot: verb_b, cat: content_progress_quantity_verb, finite_form: true}
        - {slot: k, type: nonunit_multiplier}
        - {lit: as, consume_skipped: true}
        - {lit: many}
        - {slot: item_b, cat: content_progress_measure, number: plural}
        - opt:
            - {lit: as, consume_skipped: true}
            - {slot: standard_seen, type: entity}
    emits: []

  - id: arithmetic/capacity-progress-anaphoric-multiplier-safety
    phase: read
    generation: safety
    description: >
      Bare capacity ("could read 12 pages") does not assert that 12 pages
      were actually read. When a later proportional clause refers to that
      capacity, consume the complete unsupported construction so a partial
      event total cannot escape from the fallback fold.
    match:
      sentence:
        - {slot: prior_period, cat: duration_measure, qualified: true, qualifier_cat: relative_period_attribute, number: singular}
        - {slot: who_a, type: entity, referential: true, bare_reference_category: bare_entity_reference}
        - {slot: modal, cat: capacity_modal}
        - {slot: verb_a, cat: content_progress_quantity_verb, bare_form: true}
        - {slot: item_a, cat: content_progress_measure, counted: true}
        - {lit: and}
        - {slot: current_period, cat: current_day_marker}
        - {slot: who_b, type: entity, referential: true, bare_reference_category: bare_entity_reference}
        - {slot: verb_b, cat: content_progress_quantity_verb, finite_form: true}
        - {slot: k, type: nonunit_multiplier}
        - {lit: as, consume_skipped: true}
        - {lit: many}
        - {slot: item_b, cat: content_progress_measure, number: plural}
        - opt:
            - {lit: as, consume_skipped: true}
            - {slot: standard_seen, type: entity}
    emits: []

  - id: arithmetic/discount-percent-off
    phase: read
    description: >
      mining candidate discounted-purchase-totals: "N% off" ("50% off",
      "on sale for 50% off", "10% off all purchases") — a stated PERCENT
      reduction on a priced purchase, scope=total (the bare/default
      reading: applies once to the summed purchase total). Emits a
      Discount fact the purchase-total consumer (answer.py's
      `_purchase_total`) applies to its Σ price × qty total before
      committing — see that function and model.Discount for the full
      mechanism and the decline-safety discipline around more than one
      stated discount. `type: percent` (patterns.py) gates on the SAME
      fraction value_kind every percent relation rule already reads,
      restricted to the `percent` feature numbers.py sets only for "%"/
      "percent" tokens — a bare fraction WORD ("half off") never matches
      this slot type, so this rule cannot collide with the existing
      relation-standard machinery (which reads plain fractions under a
      completely different trailing literal: "more"/"fewer"/"as many as",
      never "off"/"discount").
    match:
      sentence:
        - {slot: pct, type: percent}
        - {lit: off}
    consumes: [pct]
    emits:
      - fact: discount
        value: "pct"
        percent: true
        scope: total

  - id: arithmetic/discount-percent-noun
    phase: read
    description: >
      mining candidate discounted-purchase-totals: "gets a 15% discount" /
      "a 15% discount" — the percent-BEFORE-noun order, sibling of
      arithmetic/discount-percent-off's percent-BEFORE-'off' order. Same
      Discount fact shape, scope=total; see that rule's comment for the
      `type: percent` disjointness argument.
    match:
      sentence:
        - {slot: pct, type: percent}
        - {lit: discount}
    consumes: [pct]
    emits:
      - fact: discount
        value: "pct"
        percent: true
        scope: total

  - id: arithmetic/discount-of-percent
    phase: read
    description: >
      mining candidate discounted-purchase-totals: "he is given a discount
      of 50%" / "there is a discount of 20%" — the percent-AFTER-'discount
      of' order (compare arithmetic/discount-percent-noun's percent-BEFORE
      order — a genuinely different token sequence, so the two rules can
      never both match the same span). Same Discount fact shape,
      scope=total.
    match:
      sentence:
        - {lit: discount}
        - {lit: of}
        - {slot: pct, type: percent}
    consumes: [pct]
    emits:
      - fact: discount
        value: "pct"
        percent: true
        scope: total

  - id: arithmetic/discount-flat-noun
    phase: read
    description: >
      mining candidate discounted-purchase-totals: "a $100 discount" — the
      FLAT-dollar sibling of arithmetic/discount-percent-noun (amount
      BEFORE the 'discount' noun). The amount is a single-token currency
      count such as "$100": the declared currency category excludes bare
      counts, and `single_word` keeps a spelled-out "100 dollars" from
      merging with the following noun into a different phrase. This remains
      structurally disjoint from percent discounts. scope=total (the bare
      reading).
    match:
      sentence:
        - {slot: amt, cat: currency, counted: true, single_word: true}
        - {lit: discount}
    consumes: [amt]
    emits:
      - fact: discount
        value: "amt"
        percent: false
        scope: total

  - id: arithmetic/discount-flat-off
    phase: read
    description: >
      A flat reduction such as "$6 off", "6 dollars off", or elliptical
      "6 off". An explicit measure must be monetary; a standalone amount
      inherits the unit of the priced purchase when the existing consumer
      applies this Discount. The complete reduction phrase satisfies the
      amount's quantifies obligation without inventing a separate holding
      or a purchase total when no priced purchase is known.
    match:
      sentence:
        - {slot: amt, type: number}
        - {lit: off}
    where:
      - bound_requires_category: {bound: amt, bound_cat: noun, slot: amt, cat: currency}
    satisfies: {amt: [quantifies]}
    consumes: [amt]
    emits:
      - fact: discount
        value: "amt"
        percent: false
        scope: total

  - id: arithmetic/discount-of-flat-total
    phase: read
    description: >
      mining candidate discounted-purchase-totals: "a discount of $2" (NO
      trailing 'each') — the flat sibling of arithmetic/discount-of-percent,
      scope=total. Deliberately less specific than arithmetic/discount-of-
      flat-per-unit below (consumes fewer tokens — no 'each'), so a genuine
      per-unit discount ("a discount of $2 each") is always won by that
      strictly-more-specific sibling via ordinary subsumption
      (patterns.subsumes: a superset match at higher specificity wins
      silently); this rule only ever survives a match when 'each' is truly
      absent from the span, matching byte-identical to today whenever this
      candidate's machinery isn't in play at all.
    match:
      sentence:
        - {lit: discount}
        - {lit: of}
        - {slot: amt, type: number}
    where:
      - bound_requires_category: {bound: amt, bound_cat: noun, slot: amt, cat: currency}
    satisfies: {amt: [quantifies]}
    consumes: [amt]
    emits:
      - fact: discount
        value: "amt"
        percent: false
        scope: total

  - id: arithmetic/discount-of-flat-per-unit
    phase: read
    description: >
      mining candidate discounted-purchase-totals: "she was given a
      discount of $0.5 EACH" / "given a discount of $2 each" — the
      trailing 'each' scopes the flat discount to EVERY purchased unit
      rather than the summed total (compare arithmetic/discount-of-flat-
      total's bare form). scope=per_unit: the purchase-total consumer
      multiplies this per-unit amount by the purchased quantity before
      subtracting, rather than subtracting it once from the total.
    match:
      sentence:
        - {lit: discount}
        - {lit: of}
        - {slot: amt, type: number}
        - {slot: per_unit, cat: postpositive_distributive_quantifier}
    where:
      - bound_requires_category: {bound: amt, bound_cat: noun, slot: amt, cat: currency}
    satisfies:
      amt: [quantifies]
      per_unit: [collection]
    consumes: [amt]
    emits:
      - fact: discount
        value: "amt"
        percent: false
        scope: per_unit

asks:
  - id: ask/how-many-in-place
    # If the named place has no matching fact, this rule alone may retry the
    # pack-owned `world` scene. Other single-entity questions do not use this
    # fallback.
    match:
      question:
        - {lit: how}
        - {lit: many}
        # Qualified subsets belong to the partition sibling. Never silently
        # strip a colour/attribute when a more specific ask rejects its tail.
        - {slot: item, type: plural, bare: true}
        - {slot: verb, cat: plural_copula}
        - {slot: prep, cat: spatial_location_preposition}
        - {slot: place, cat: quantity_location, referential: true}
        - opt:
            - {lit: to}
            - {slot: start_marker, cat: start_marker_verb, bare_form: true}
            - {lit: with}
    where:
      - attribute_compatible: {attribute: prep, noun: place}
      - slot_not_category: {slot: item, cat: many_incompatible_noun}
      - unbound: [start_marker]
    resolves:
      consumer: single-entity
      entity: "{place}"
      measure: "{item}"
      verb: have
      place_fallback_entity: world
      # A bare measure may sum compatible qualified variants. For example,
      # "red apples" and "green apples" can answer "how many apples?"
      sum_measure_variants: "true"
      # Preserve a place qualifier so "the first chapter" cannot resolve to
      # facts about another chapter.
      entity_qualifier: "{place.qualifier}"
      evidence_reference_time_required: "true"
    generation:
      omit_slots: [start_marker]

  - id: ask/how-many-container-content-state
    # "How many beads does the bin contain?" asks for the current contents
    # of a declared interior location. A generic entity cannot fill the
    # container slot, and the stative content frame keeps arbitrary
    # transitive verbs out of this construction.
    match:
      question:
        - {lit: how}
        - {lit: many}
        - {slot: item, type: plural}
        - {slot: aux, type: auxiliary}
        - {lit: the, consume_skipped: true}
        - {slot: container, cat: quantity_interior_location, referential: true, number: singular}
        - {slot: verb, cat: container_content_state_verb, bare_form: true}
    where:
      - number_compatible: [container, aux]
      - slot_not_category: {slot: item, cat: many_incompatible_noun}
    resolves:
      consumer: single-entity
      entity: "{container}"
      measure: "{item}"
      measure_qualifier: "{item.qualifier}"
      verb: "{verb}"
      sum_measure_variants: "true"
      evidence_reference_time_required: "true"

  - id: ask/how-many-container-observed-capacity
    # "How many coins can fit in the jar?" asks for capacity established by
    # an explicit filled-container remainder observation. It is deliberately
    # separate from purchase capacity (budget / unit price) and from current
    # container contents.
    match:
      question:
        - {lit: how}
        - {lit: many}
        - {slot: item, type: plural}
        - {slot: modal, cat: capacity_modal}
        - {slot: placement, cat: container_capacity_intransitive_placement_verb, bare_form: true}
        - {slot: prep, cat: quantity_location_preposition}
        - {lit: the, consume_skipped: true}
        - {slot: container, cat: quantity_interior_location, referential: true, number: singular}
    where:
      - attribute_compatible: {attribute: prep, noun: container}
    resolves:
      consumer: container-capacity-observation
      container: "{container}"
      measure: "{item}"

  - id: ask/how-many-container-confirmed-fit
    # "How many coins can we safely say will fit in the jar?" explicitly asks
    # only for the amount warranted by an all-fit lower bound. Deictic "we"
    # denotes the current reasoners and is structurally satisfied here rather
    # than resolved to a story entity.
    match:
      question:
        - {lit: how}
        - {lit: many}
        - {slot: item, type: plural}
        - {slot: modal, cat: capacity_modal}
        - {slot: speaker, cat: first_person_plural_pronoun}
        - {slot: warrant, cat: conservative_inference_adverb}
        - {slot: report, cat: epistemic_report_verb, bare_form: true}
        - {slot: future, cat: future_modal}
        - {slot: placement, cat: container_capacity_intransitive_placement_verb, bare_form: true}
        - {slot: prep, cat: quantity_location_preposition}
        - {lit: the, consume_skipped: true}
        - {slot: container, cat: quantity_interior_location, referential: true, number: singular}
    where:
      - attribute_compatible: {attribute: prep, noun: container}
    satisfies:
      speaker: [refers]
    resolves:
      consumer: container-capacity-observation
      container: "{container}"
      measure: "{item}"
      allow_confirmed_fit: "true"

  - id: ask/how-many-in-owned-place
    # "How many marbles are in Mira's pantry?" names both a location and
    # its owner. Preserve the owner so facts about another person's same-
    # headed location cannot answer. The extra agreement predicate makes this
    # rule strictly more specific than the bare in-place sibling whenever the
    # complete possessed phrase is present.
    match:
      question:
        - {lit: how}
        - {lit: many}
        - {slot: item, type: plural}
        - {slot: verb, cat: plural_copula}
        - {slot: prep, cat: spatial_location_preposition}
        - {slot: place, cat: quantity_location, possessed: true, number: singular}
    where:
      - number_compatible: [item, verb]
      - attribute_compatible: {attribute: prep, noun: place}
      - slot_not_category: {slot: item, cat: many_incompatible_noun}
    resolves:
      consumer: single-entity
      entity: "{place}"
      entity_owner: "{place.owner}"
      require_entity_owner_evidence: "true"
      entity_qualifier: "{place.qualifier}"
      evidence_reference_time_required: "true"
      measure: "{item}"
      measure_qualifier: "{item.qualifier}"
      verb: have
      sum_measure_variants: "true"

  - id: ask/how-many-owner-has-in-owned-place
    # "How many marbles does Mira have in her pantry?" asks about the
    # contents of the named location, not every marble Mira may own. The
    # possessive determiner must resolve to the grammatical subject, and its
    # governed location must retain that same owner. This keeps another
    # person's same-headed location outside the lookup.
    match:
      question:
        - {lit: how}
        - {lit: many}
        - {slot: item, type: plural}
        - {slot: aux, type: future_modal}
        - {slot: owner, type: name}
        - {slot: verb, cat: possession_state, bare_form: true}
        - {slot: prep, cat: spatial_location_preposition}
        - {slot: poss_det, cat: possessive_determiner}
        - {slot: place, cat: quantity_location, possessed: true, number: singular}
    where:
      - number_compatible: [owner, aux]
      - same_lemma: [owner, poss_det]
      - owner_matches: {owner: poss_det, possessed: place}
      - attribute_compatible: {attribute: prep, noun: place}
      - slot_not_category: {slot: item, cat: many_incompatible_noun}
      - verb_roles_compatible:
          verb: verb
          roles: {actor: [owner], theme: [item]}
          frame_categories: [ownership_state]
          allow_proper_name: [owner]
    resolves:
      consumer: single-entity
      entity: "{place}"
      entity_owner: "{place.owner}"
      require_entity_owner_evidence: "true"
      entity_qualifier: "{place.qualifier}"
      evidence_reference_time_required: "true"
      owned_place_holder_fallback: "{owner}"
      measure: "{item}"
      measure_qualifier: "{item.qualifier}"
      verb: "{verb}"
      sum_measure_variants: "true"

  - id: ask/how-many-in-place-partitive
    # Handles a qualified measure in a location question, such as "how many
    # cups of flour are left in the bowl?" `qual` selects the exact
    # `cup[flour]` measure instead of combining cups of different substances.
    # The "of QUALIFIER" tail is required, so this rule cannot compete with
    # the bare-measure `ask/how-many-in-place` rule.
    match:
      question:
        - {lit: how}
        - {lit: many}
        - {slot: item, type: plural}
        - {lit: of}
        - {slot: qual, type: noun, number: singular}
        - {slot: verb, cat: plural_copula}
        - {slot: prep, cat: spatial_location_preposition}
        - {slot: place, cat: quantity_location, referential: true}
    where:
      - partitive_compatible: {measure: item, substance: qual}
      - attribute_compatible: {attribute: prep, noun: place}
    resolves:
      consumer: single-entity
      entity: "{place}"
      measure: "{item}"
      measure_qualifier: "{qual}"
      verb: have
      place_fallback_entity: world
      evidence_reference_time_required: "true"

  - id: ask/how-many-there-in-possessed-place
    # The possessed-container sibling: "how many trees are there in Mira's
    # garden?" names an owner-qualified LOCATION, not Mira herself. A premise
    # must therefore state a quantity on that exact possessed place (for
    # example "Mira's garden has 8 trees"). Mere ownership of the place does
    # not move every quantity Mira holds into it.
    # Requiring a pack-declared `quantity_location` head prevents arbitrary
    # possessions ("Mira's idea", "Mira's dog") from being reinterpreted as
    # locations. The place head remains the query entity and its possessor is
    # preserved as ``entity_owner`` for the consumer's exact owner-scoped
    # lookup.
    match:
      question:
        - {lit: how}
        - {lit: many}
        - {slot: item, type: plural}
        - {slot: verb, cat: plural_copula}
        - {lit: there}
        - {slot: prep, cat: spatial_location_preposition}
        - {slot: place, cat: quantity_location, possessed: true, number: singular}
    where:
      - number_compatible: [item, verb]
      - attribute_compatible: {attribute: prep, noun: place}
      - slot_not_category: {slot: item, cat: many_incompatible_noun}
    resolves:
      consumer: single-entity
      entity: "{place}"
      entity_owner: "{place.owner}"
      entity_qualifier: "{place.qualifier}"
      require_entity_owner_evidence: "true"
      evidence_reference_time_required: "true"
      measure: "{item}"
      verb: have
      measure_qualifier: "{item.qualifier}"
      sum_measure_variants: "true"

  - id: ask/how-many-combined
    match:
      question:
        - {lit: how}
        - {lit: many}
        - {slot: item, type: plural}
        - opt:
            # Accept ordinary and will/would forms, but not capacity modals.
            - {slot: aux, type: future_modal}
            - {slot: who, type: pronoun, number: plural}
            - {slot: verb, type: verb, bare_form: true}
        - opt:
            - {slot: p, cat: group_total_preposition}
        - {slot: agg, cat: group_total_marker}
    where:
      - bound_requires_category: {bound: p, slot: agg, cat: prepositional_group_total_marker}
    resolves:
      consumer: combined
      require_discourse_group: "{who}"
      measure: "{item}"
      verb: "{verb}"

  - id: ask/how-many-combined-discourse-group
    # Exact-discourse sibling of ask/how-many-combined: "How many apples do
    # they receive combined?" The question pronoun's `referent_group` is
    # synthesized from prior referential subjects by document.py. Preserve
    # those exact members in `holders`; the combined consumer must not discard
    # the pronoun and enumerate every same-measure holder in the fact store.
    # The category-gated `who` makes this rule more specific than the generic
    # pronoun surface above while retaining that rule for contexts where no
    # exact discourse group can be established.
    match:
      question:
        - {lit: how}
        - {lit: many}
        - {slot: item, type: plural}
        - {slot: aux, type: future_modal}
        - {slot: who, cat: discourse_subject_group_pronoun}
        - {slot: verb, type: verb, bare_form: true}
        - opt:
            - {slot: p, cat: group_total_preposition}
        - {slot: agg, cat: group_total_marker}
    where:
      - bound_requires_category: {bound: p, slot: agg, cat: prepositional_group_total_marker}
      - number_compatible: [who, aux]
    resolves:
      consumer: combined
      holders: "{who.group_members}"
      measure: "{item}"
      measure_qualifier: "{item.qualifier}"
      verb: "{verb}"
    generation:
      context_required: true
      context_strategy: evidence
      slot_categories:
        aux: [plural_auxiliary]
        item: [transferable_quantity_object]
        verb: [plain_have_state]
      evidence_rules:
        - rule: arithmetic/stated-count-holding
          bindings: {who: holders.0, amount: measure, verb: verb}
        - rule: arithmetic/stated-count-holding
          bindings: {who: holders.1, amount: measure, verb: verb}

  - id: ask/how-many-combined-in-all
    # Handles the two-word total marker "in all". It needs its own rule
    # because the base rule expects one aggregate token, while this marker is
    # a two-token sequence. Do not add `all` to the aggregate category: it is
    # also a general quantifier. The base rule cannot match this tail, so the
    # two rules do not compete.
    match:
      question:
        - {lit: how}
        - {lit: many}
        - {slot: item, type: plural}
        - opt:
            - {slot: aux, type: future_modal}
            - {slot: who, type: pronoun, number: plural}
            - {slot: verb, type: verb, bare_form: true}
        - {lit: in}
        - {lit: all}
    resolves:
      consumer: combined
      require_discourse_group: "{who}"
      measure: "{item}"
      verb: "{verb}"

  - id: ask/how-many-combined-in-all-discourse-group
    # Context-bearing sibling of the two-word "in all" surface. The exact
    # prior-subject/relation group is mandatory; unresolved `they` falls back
    # to the grammar-only rule above and is declined by the consumer.
    match:
      question:
        - {lit: how}
        - {lit: many}
        - {slot: item, type: plural}
        - {slot: aux, cat: auxiliary}
        - {slot: who, cat: discourse_subject_group_pronoun}
        - {slot: verb, type: verb, bare_form: true}
        - {lit: in}
        - {lit: all}
    resolves:
      consumer: combined
      holders: "{who.group_members}"
      measure: "{item}"
      measure_qualifier: "{item.qualifier}"
      verb: "{verb}"
    generation:
      context_required: true
      context_strategy: evidence
      slot_categories:
        aux: [plural_auxiliary]
        item: [transferable_quantity_object]
        verb: [plain_have_state]
      evidence_rules:
        - rule: arithmetic/stated-count-holding
          bindings: {who: holders.0, amount: measure, verb: verb}
        - rule: arithmetic/stated-count-holding
          bindings: {who: holders.1, amount: measure, verb: verb}

  - id: ask/how-many-combined-named
    # Handles totals for two named holders, such as "how many books do Ana
    # and Ben have together?" It binds both names directly. The pronoun form
    # cannot match a named pair, so it remains separate.
    match:
      question:
        - {lit: how}
        - {lit: many}
        - {slot: item, type: plural}
        - {slot: aux, type: auxiliary}
        - {slot: a, type: name}
        - {lit: and}
        - {slot: b, type: name}
        - {slot: verb, type: verb, bare_form: true}
        - opt:
            - {slot: p, cat: group_total_preposition}
        - {slot: agg, cat: group_total_marker}
    where:
      - bound_requires_category: {bound: p, slot: agg, cat: prepositional_group_total_marker}
      - distinct: [a, b]
      - slot_not_category: {slot: item, cat: many_incompatible_noun}
      - slot_not_category: {slot: verb, cat: non_quantity_object_verb}
      - verb_roles_compatible:
          verb: verb
          roles: {theme: [item]}
    resolves:
      consumer: combined
      a: "{a}"
      b: "{b}"
      measure: "{item}"
      verb: "{verb}"
    generation:
      slot_categories:
        aux: [plural_auxiliary]

  - id: ask/how-many-combined-named-list
    # Two or more explicitly named holders, including serial-comma surfaces:
    # "How many books do Ana, Ben, Cato, and Dena have together?" The span
    # backtracks against the required verb, then `{holders.name_list}` checks
    # that every enumeration segment is exactly one name and that the final
    # pair is joined by a declared conjunctive marker. It therefore rejects
    # comma-only lists, disjunctions, and arbitrary noun phrases. The older
    # two-name rule wins its equal-length tie by id and stays byte-compatible.
    # Longer lists preserve exact scope in `holders`; the combined consumer
    # must not enumerate an unrelated same-measure holder.
    match:
      question:
        - {lit: how}
        - {lit: many}
        - {slot: item, type: plural}
        - {slot: aux, type: auxiliary}
        - {slot: holders, span: true}
        - {slot: verb, type: verb, bare_form: true}
        - opt:
            - {slot: p, cat: group_total_preposition}
        - {slot: agg, cat: group_total_marker}
    where:
      - bound_requires_category: {bound: p, slot: agg, cat: prepositional_group_total_marker}
      - slot_not_category: {slot: item, cat: many_incompatible_noun}
      - slot_not_category: {slot: verb, cat: non_quantity_object_verb}
      - verb_roles_compatible:
          verb: verb
          roles: {theme: [item]}
    resolves:
      consumer: combined
      holders: "{holders.name_list}"
      measure: "{item}"
      verb: "{verb}"
    generation:
      slot_categories:
        aux: [plural_auxiliary]







  - id: ask/how-many-combined-named-list-all-together
    # Two-token aggregate-marker sibling of the exact named-list ask:
    # "How many books do Ana, Ben, and Cato have all together?" The marker
    # words are admitted through the same narrow categories that license the
    # trailing GroupTotal premise, so this cannot widen to "all total" or a
    # misspelled one-token form. `{holders.name_list}` retains the ordinary
    # exact-scope, conjunction, uniqueness, and no-authored-arity contract.
    match:
      question:
        - {lit: how}
        - {lit: many}
        - {slot: item, type: plural}
        - {slot: aux, cat: plural_auxiliary}
        - {slot: holders, span: true}
        - {slot: verb, type: verb, bare_form: true}
        - {slot: q, cat: group_total_quantifier}
        - {slot: agg, cat: quantified_group_total_marker}
    where:
      - slot_not_category: {slot: item, cat: mass_quantity_noun}
      - verb_roles_compatible:
          verb: verb
          roles: {theme: [item]}
      - verb_role_compatible: {verb: verb, roles: [item], verb_cat: animate_object_verb, role_cat: teaching_quantity_object}
    satisfies:
      verb: [subject]
      q: [collection]
    resolves:
      consumer: combined
      holders: "{holders.name_list}"
      measure: "{item}"
      verb: "{verb}"

  - id: ask/how-many-combined-named-in-all
    # Named-pair form with the two-word marker "in all". The ordinary named
    # form expects one aggregate token and therefore cannot match this tail.
    match:
      question:
        - {lit: how}
        - {lit: many}
        - {slot: item, type: plural}
        - {slot: aux, type: auxiliary}
        - {slot: a, type: name}
        - {lit: and}
        - {slot: b, type: name}
        - {slot: verb, type: verb, bare_form: true}
        - {lit: in}
        - {lit: all}
    where:
      - distinct: [a, b]
      - slot_not_category: {slot: item, cat: many_incompatible_noun}
      - slot_not_category: {slot: verb, cat: non_quantity_object_verb}
      - verb_roles_compatible:
          verb: verb
          roles: {theme: [item]}
    resolves:
      consumer: combined
      a: "{a}"
      b: "{b}"
      measure: "{item}"
      verb: "{verb}"
    generation:
      slot_categories:
        aux: [plural_auxiliary]

  - id: ask/how-many-combined-partitive
    # Handles combined partitive measures, such as "how many cups of flour
    # do they have altogether?" `measure_substance` prevents values for a
    # different substance under the same unit from joining the total—for
    # example, pairs of socks must not answer a question about pairs of
    # shoes. The required "of QUALIFIER" tail keeps this rule separate from
    # the bare-measure form.
    match:
      question:
        - {lit: how}
        - {lit: many}
        - {slot: item, type: plural}
        - {lit: of}
        - {slot: qual, type: noun}
        - opt:
            - {slot: aux, type: future_modal}
            - {slot: who, type: pronoun}
            - {slot: verb, type: verb, bare_form: true}
        - opt:
            - {slot: p, cat: group_total_preposition}
        - {slot: agg, cat: group_total_marker}
    where:
      - partitive_compatible: {measure: item, substance: qual}
      - bound_requires_category: {bound: p, slot: agg, cat: prepositional_group_total_marker}
    resolves:
      consumer: combined
      measure: "{item}"
      measure_qualifier: "{qual}"
      measure_substance: "{qual}"
      verb: "{verb}"

  - id: ask/how-many-combined-partitive-in-all
    # Partitive form with the two-word marker "in all". The ordinary
    # partitive form expects one aggregate token and cannot match this tail.
    match:
      question:
        - {lit: how}
        - {lit: many}
        - {slot: item, type: plural}
        - {lit: of}
        - {slot: qual, type: noun}
        - {slot: aux, type: future_modal}
        - {slot: who, cat: discourse_subject_group_pronoun}
        - {slot: verb, cat: possession_state, bare_form: true}
        - {lit: in}
        - {lit: all}
    where:
      - partitive_compatible: {measure: item, substance: qual}
      - number_compatible: [who, aux]
    resolves:
      consumer: combined
      measure: "{item}"
      measure_qualifier: "{qual}"
      measure_substance: "{qual}"
      verb: "{verb}"

  - id: ask/how-many-combined-named-partitive
    # Partitive form for two named holders. It binds both names directly and
    # uses `measure_substance` to avoid mixing different substances that use
    # the same unit.
    match:
      question:
        - {lit: how}
        - {lit: many}
        - {slot: item, type: plural}
        - {lit: of}
        - {slot: qual, type: noun}
        - {slot: aux, type: auxiliary}
        - {slot: a, type: name}
        - {lit: and}
        - {slot: b, type: name}
        - {slot: verb, type: verb, bare_form: true}
        - opt:
            - {slot: p, cat: group_total_preposition}
        - {slot: agg, cat: group_total_marker}
    where:
      - partitive_compatible: {measure: item, substance: qual}
      - bound_requires_category: {bound: p, slot: agg, cat: prepositional_group_total_marker}
      - distinct: [a, b]
      - slot_not_category: {slot: verb, cat: non_quantity_object_verb}
      - verb_roles_compatible:
          verb: verb
          roles: {theme: [item]}
    resolves:
      consumer: combined
      a: "{a}"
      b: "{b}"
      measure: "{item}"
      measure_qualifier: "{qual}"
      measure_substance: "{qual}"
      verb: "{verb}"
    generation:
      slot_categories:
        aux: [plural_auxiliary]

  - id: ask/how-many-combined-cardinal-pronoun
    # Handles a numbered holder group, such as "how many books do the three
    # of them have in total?" The cardinal states the expected group size;
    # it does not choose the holders. `holder_count` makes the consumer check
    # that the premises actually contain that many holders and also marks the
    # cardinal as used. The pronoun and named-pair forms cannot match a bare
    # cardinal.
    match:
      question:
        - {lit: how}
        - {lit: many}
        - {slot: item, type: plural}
        - {slot: aux, cat: plural_auxiliary}
        - {lit: the, consume_skipped: true}
        - {slot: n, type: number, standalone: true}
        - opt:
            - {lit: of}
            - {lit: them}
        - {slot: verb, type: verb, bare_form: true}
        - opt:
            - {slot: p, cat: group_total_preposition}
        - {slot: agg, cat: group_total_marker}
    where:
      - bound_requires_category: {bound: p, slot: agg, cat: prepositional_group_total_marker}
      - slot_not_category: {slot: item, cat: many_incompatible_noun}
      - slot_not_category: {slot: verb, cat: non_quantity_object_verb}
      - verb_roles_compatible:
          verb: verb
          roles: {theme: [item]}
      - verb_role_compatible: {verb: verb, roles: [item], verb_cat: spend_verb, role_cat: currency}
    satisfies:
      n: [quantifies]
      p: [object]
      verb: [subject]
    resolves:
      consumer: combined
      measure: "{item}"
      verb: "{verb}"
      holder_count: "{n.value}"

  - id: ask/how-many-more
    match:
      question:
        - {lit: how}
        - {lit: many}
        - {slot: dir, cat: count_quantity_delta}
        - {slot: item, type: plural}
        - {slot: aux, type: auxiliary}
        - {slot: a, type: name}
        - {slot: verb, type: verb, bare_form: true}
        - {lit: than}
        - {slot: b, type: name}
    resolves:
      consumer: difference
      a: "{a}"
      b: "{b}"
      measure: "{item}"
      verb: "{verb}"
    generation:
      slot_categories:
        verb:
          [possession_state, purchase, eating_quantity_verb,
           earning_quantity_verb, enrollment_quantity_verb,
           find_quantity_verb, production_quantity_verb,
           teaching_quantity_verb, initiation_quantity_verb, transfer_out]

  - id: ask/how-many-more-partitive
    # Handles differences between qualified measures, such as "how many more
    # pairs of shoes does Ann have than Bob?" `measure_substance` prevents a
    # holder's pairs of socks from answering a question about shoes. The
    # required "of QUALIFIER" tail keeps this rule separate from the bare
    # measure form.
    match:
      question:
        - {lit: how}
        - {lit: many}
        - {slot: dir, cat: count_quantity_delta}
        - {slot: item, type: plural}
        - {lit: of}
        - {slot: qual, type: noun}
        - {slot: aux, type: auxiliary}
        - {slot: a, type: name}
        - {slot: verb, type: verb, bare_form: true}
        - {lit: than}
        - {slot: b, type: name}
    where:
      - partitive_compatible: {measure: item, substance: qual}
      - number_compatible: [a, aux]
      - slot_not_category: {slot: verb, cat: non_quantity_object_verb}
      - verb_roles_compatible:
          verb: verb
          roles: {theme: [item]}
    resolves:
      consumer: difference
      a: "{a}"
      b: "{b}"
      measure: "{item}"
      measure_qualifier: "{qual}"
      measure_substance: "{qual}"
      verb: "{verb}"
    generation:
      slot_categories:
        verb:
          [possession_state, purchase, eating_quantity_verb,
           earning_quantity_verb, find_quantity_verb,
           production_quantity_verb, transfer_out]

  - id: ask/how-many-more-label-comparative
    # Compares two measure labels, as in "how many more boys than girls are
    # there?" This is not a comparison between named holders. The consumer
    # resolves both measures and requires them to belong to exactly one
    # shared holder.
    match:
      question:
        - {lit: how}
        - {lit: many}
        - {slot: dir, cat: count_quantity_delta}
        - {slot: a, type: plural}
        - {lit: than}
        - {slot: b, type: plural}
        - {slot: verb, cat: plural_copula}
        - {lit: there}
    where:
      - slot_not_category: {slot: a, cat: many_incompatible_noun}
      - slot_not_category: {slot: b, cat: many_incompatible_noun}
    resolves:
      consumer: label-difference
      a: "{a}"
      b: "{b}"

  - id: ask/how-many-more-label-comparative-held
    # Held form of the label comparison: "how many more peaches than apples
    # does Steven have?" The order "A than B" before the auxiliary is
    # essential. It excludes questions that compare people, times, or
    # actions instead of two measures. Do not relax that order. The named
    # holder is a hint; the consumer still requires one shared holder for
    # both measures.
    match:
      question:
        - {lit: how}
        - {lit: many}
        - {slot: dir, cat: count_quantity_delta}
        - {slot: a, type: plural}
        - {lit: than}
        - {slot: b, type: plural}
        - {slot: aux, type: auxiliary}
        - {slot: who, type: entity, referential: true, bare_reference_category: bare_entity_reference}
        - {slot: verb, cat: quantity_ask_verb, bare_form: true}
    where:
      - number_compatible: [who, aux]
      - slot_not_category: {slot: a, cat: many_incompatible_noun}
      - slot_not_category: {slot: b, cat: many_incompatible_noun}
    resolves:
      consumer: label-difference
      a: "{a}"
      b: "{b}"
      # the HOLDER the question names ("...does Steven have?"). A HINT, not
      # a requirement: `label-difference` uses it only when that entity
      # actually holds BOTH measures, and otherwise falls back to its
      # exactly-one-SHARED-holder discipline unchanged. The existential
      # sibling ask names no holder and binds nothing here, so its path is
      # byte-identical. See the consumer for why the fallback (rather than
      # a decline) is the safe direction.
      holder: "{who}"
      # the ask's VERB selects state-vs-activity totals in the consumer,
      # exactly as in the sibling `difference` branch. SVAMP asks the SAME
      # premises both ways ("did baker SELL?" vs "did baker MAKE?") with
      # DIFFERENT golds. The existential sibling binds a `cat: state` verb
      # and therefore keeps the stative path.
      verb: "{verb}"
    generation:
      slot_categories:
        who: [quantity_event_participant]
        verb:
          [possession_state, purchase, eating_quantity_verb,
           earning_quantity_verb, enrollment_quantity_verb,
           find_quantity_verb, production_quantity_verb,
           teaching_quantity_verb, initiation_quantity_verb, transfer_out]

  - id: ask/how-many-entity-event-period-total
    # An exact activity total over two explicitly coordinated named periods:
    # "How many stickers did Mira sell altogether in March and April?" The
    # period slots are consumed by this ask rather than left for single-time
    # arbitration. The consumer requires direct event evidence for both and
    # excludes events from every unlisted period.
    match:
      question:
        - {lit: how}
        - {lit: many}
        - {slot: item, type: plural}
        - {slot: aux, type: future_modal}
        - {slot: who, type: name}
        - {slot: verb, cat: unit_recipient_transfer_verb, bare_form: true}
        - {slot: aggregate, cat: group_total_marker}
        - {slot: period_prep, cat: temporal_in_point_preposition}
        - {slot: first_period, cat: named_month}
        - {slot: conjunction, cat: holder_list_conjunction}
        - {slot: second_period, cat: named_month}
    where:
      - number_compatible: [who, aux]
      - distinct: [first_period, second_period]
      - attribute_compatible: {attribute: period_prep, noun: first_period}
      - verb_roles_compatible:
          verb: verb
          roles: {actor: [who], theme: [item]}
          allow_proper_name: [who]
    resolves:
      consumer: event-period-total
      entity: "{who}"
      measure: "{item}"
      verb: "{verb}"
      periods: ["{first_period}", "{second_period}"]

  - id: ask/how-many-entity
    # Keep `who` restricted to a name. A general entity would overlap the
    # possessed and qualified forms, losing their owner or qualifier data.
    match:
      question:
        - {lit: how}
        - {lit: many}
        - {slot: item, type: plural}
        # `future_modal` accepts do/does/did and will/would forms, but excludes
        # capacity modals such as can or must.
        - {slot: aux, type: future_modal}
        - {slot: who, type: name}
        - {slot: verb, type: verb, bare_form: true}
    where:
      # Apply any complete category-owned frame to this general transitive ask.
      # Literal ownership is therefore narrower than have-possession, while
      # extensions remain data-only additions to the relevant object role.
      - verb_roles_compatible:
          verb: verb
          roles: {actor: [who], theme: [item]}
          frame_categories: [ownership_state, service_activity_verb]
          allow_proper_name: [who]
    resolves:
      consumer: single-entity
      entity: "{who}"
      measure: "{item}"
      verb: "{verb}"
      # Preserve an item qualifier so "green apples" first looks for the
      # exact `apple[green]` measure.
      measure_qualifier: "{item.qualifier}"
      # A bare item may sum compatible qualified variants, but only after
      # exact lookups fail. A qualified question never uses this fallback.
      sum_measure_variants: "true"
      # Do not add a partitive tail here. The single-entity fold does not
      # convert units, so a question in ounces over premises in gallons could
      # produce a confident wrong answer. That form needs conversion-aware
      # consumer logic.
    generation:
      slot_categories:
        verb:
          [possession_state, purchase, eating_quantity_verb,
           earning_quantity_verb, enrollment_quantity_verb,
           find_quantity_verb, production_quantity_verb,
           teaching_quantity_verb, initiation_quantity_verb, transfer_out]

  - id: ask/how-many-components-entity-period
    # A category-scoped quantity-activity ask for a stated discourse interval.
    # The surface component word and activity must satisfy the verb's declared
    # role frame, while `measure_category` resolves only the unique compatible
    # event component measure. This opt-in route does not make category
    # siblings global synonyms.
    match:
      question:
        - {lit: how}
        - {lit: many}
        - {slot: item, cat: component_quantity_measure, number: plural}
        - {slot: aux, type: future_modal}
        - {slot: who, type: name}
        - {slot: verb, cat: quantity_event_verb, bare_form: true}
        - {lit: that, consume_skipped: true}
        - {slot: period, cat: duration_measure, number: singular}
    where:
      - number_compatible: [who, aux]
      - verb_roles_compatible:
          verb: verb
          roles:
            actor: [who]
            theme: [item]
          allow_proper_name: [who]
          require_declared_frame: true
    resolves:
      consumer: single-entity
      entity: "{who}"
      measure: component_quantity_measure
      measure_category: component_quantity_measure
      verb: "{verb}"
      reference_time: "{period}"

  - id: ask/how-many-entity-prenominal-marker
    # Handles an aggregate marker before the measure, such as "how many total
    # toys does James buy?" The total belongs to one holder, so this uses the
    # single-entity consumer. The marker is required; without it, the base
    # single-entity rule applies.
    match:
      question:
        - {lit: how}
        - {lit: many}
        - {slot: pre, cat: prenominal_group_total_marker}
        - {slot: item, type: plural}
        - {slot: aux, type: future_modal}
        - {slot: who, type: name}
        - {slot: verb, type: verb, bare_form: true}
    resolves:
      consumer: single-entity
      entity: "{who}"
      measure: "{item}"
      verb: "{verb}"
    generation:
      slot_categories:
        verb:
          [possession_state, purchase, eating_quantity_verb,
           earning_quantity_verb, enrollment_quantity_verb,
           find_quantity_verb, production_quantity_verb,
           teaching_quantity_verb, initiation_quantity_verb, transfer_out]

  - id: ask/how-many-entity-elided-measure
    # Handles questions that omit the measure, such as "how many does Tom
    # have?" The consumer can answer only when Tom has one clear measure.
    # Because the auxiliary must follow "how many" immediately, this rule
    # cannot claim a question that names an item.
    match:
      question:
        - {lit: how}
        - {lit: many}
        - {slot: aux, type: future_modal}
        - {slot: who, type: name}
        - {slot: verb, type: verb, bare_form: true}
    where:
      - slot_not_category: {slot: verb, cat: non_quantity_object_verb}
    resolves:
      consumer: single-entity-elided-measure
      entity: "{who}"
      verb: "{verb}"
    generation:
      slot_categories:
        verb:
          [possession_state, purchase, eating_quantity_verb,
           earning_quantity_verb, enrollment_quantity_verb,
           find_quantity_verb, production_quantity_verb,
           teaching_quantity_verb, initiation_quantity_verb, transfer_out]

  - id: ask/how-many-entity-possessed
    match:
      question:
        - {lit: how}
        - {lit: many}
        - {slot: item, type: plural}
        - {slot: aux, type: future_modal}
        # `possessed` requires an owner, as in "Kennedy's house". Keeping it
        # separate preserves that owner and excludes a bare common noun.
        - {slot: who, cat: quantity_holder, possessed: true}
        - {slot: verb, cat: possession_state, bare_form: true}
    where:
      - slot_not_category: {slot: item, cat: many_incompatible_noun}
      - number_compatible: [who, aux]
    resolves:
      consumer: single-entity
      entity: "{who}"
      measure: "{item}"
      verb: "{verb}"
      # If the bare entity lookup is empty, retry the owner-qualified key.
      entity_owner: "{who.owner}"

  - id: ask/what-is-the-number-of-possessed
    # Handles a nominal possessive question such as "what is the number of
    # Ana's siblings?" The possessive owner is the entity and the possessed
    # noun is the measure. With no verb in the question, the consumer uses
    # "have".
    match:
      question:
        - {lit: what}
        - {slot: be, cat: present_copula, number: singular}
        - {lit: the, consume_skipped: true}
        - {lit: number}
        - {lit: of}
        - {slot: who, type: possessed, number: plural}
    satisfies: {be: [subject]}
    resolves:
      consumer: single-entity
      entity: "{who.owner}"
      measure: "{who}"
    generation:
      # Keep generated review asks on ordinary countable collections. The
      # reader remains open to other possessed plurals, but a generated
      # "number of Dena's inches" is not useful evidence for this shape.
      slot_categories:
        who: [remainder_collection_noun]

  - id: ask/how-many-entity-qualified
    match:
      question:
        - {lit: how}
        - {lit: many}
        - {slot: item, type: plural}
        - {slot: aux, type: auxiliary}
        # `qualified` requires a merged modifier, as in "coconut trees" or
        # "red apples". Keeping it separate preserves the qualifier.
        - {slot: who, type: qualified}
        - {slot: verb, type: verb, bare_form: true}
    where:
      - slot_not_category: {slot: item, cat: many_incompatible_noun}
      - slot_not_category: {slot: verb, cat: non_quantity_object_verb}
      - number_compatible: [who, aux]
    resolves:
      consumer: single-entity
      entity: "{who}"
      measure: "{item}"
      verb: "{verb}"
      # If the bare entity lookup is empty, retry the qualified key.
      entity_qualifier: "{who.qualifier}"

  - id: ask/how-many-entity-common-noun
    # Handles a singular common-noun holder, such as "how many parts does the
    # vehicle have?" `common_noun` deliberately excludes names, possessives,
    # qualified nouns, and plurals. Those forms have separate rules whose
    # owner, qualifier, or group information must be preserved.
    match:
      question:
        - {lit: how}
        - {lit: many}
        - {slot: item, type: plural}
        - {slot: aux, type: future_modal}
        - {slot: who, type: common_noun}
        - {slot: verb, cat: quantity_ask_verb, bare_form: true}
    where:
      - slot_not_category: {slot: item, cat: many_incompatible_noun}
      - slot_not_category: {slot: who, cat: non_quantity_holder}
      - slot_not_category: {slot: who, cat: timeperiod}
      - slot_not_category: {slot: verb, cat: non_quantity_object_verb}
      - number_compatible: [who, aux]
      - verb_roles_compatible:
          verb: verb
          roles: {theme: [item]}
    resolves:
      consumer: single-entity
      entity: "{who}"
      measure: "{item}"
      verb: "{verb}"
      measure_qualifier: "{item.qualifier}"
      sum_measure_variants: "true"

  # There is intentionally no single-holder partitive rule for questions
  # such as "how many pairs of shoes does Ann have?" The current consumer
  # cannot safely distinguish unit conversions or a qualified measure that
  # exists only through a relation. Its bare-measure fallback can mix
  # substances or units and produce a confident wrong answer. Add this form
  # only with a consumer that can guard those cases.

  - id: ask/how-many-left-entityless
    match:
      question:
        - {lit: how}
        - {lit: many}
        - {slot: item, type: plural}
        - {slot: verb, cat: plural_copula}
        - {lit: left}
    where:
      - slot_not_category: {slot: item, cat: many_incompatible_noun}
    resolves:
      consumer: unique-entity
      measure: "{item}"

  - id: ask/how-many-left-entityless-partitive
    # Qualified sibling of the bare remainder ask. Keeping the `of` tail in
    # its own rule makes pair compatibility mandatory when a substance is
    # present without making it mandatory for an ordinary bare count noun.
    match:
      question:
        - {lit: how}
        - {lit: many}
        - {slot: item, type: plural}
        - {lit: of}
        - {slot: substance, type: noun}
        - {slot: verb, cat: plural_copula}
        - {lit: left}
    where:
      - slot_not_category: {slot: item, cat: many_incompatible_noun}
      - partitive_compatible: {measure: item, substance: substance}
    resolves:
      consumer: unique-entity
      measure: "{item}"
      measure_substance: "{substance}"

  - id: ask/how-many-there
    match:
      question:
        - {lit: how}
        - {lit: many}
        - {slot: item, type: plural}
        # Optional "of SUBSTANCE" tail, used as a decline-safety guard.
        - opt:
            - {lit: of}
            - {slot: substance, type: noun, number: singular}
        - {slot: verb, type: verb, finite_form: true}
        - {lit: there}
    where:
      - partitive_compatible: {measure: item, substance: substance}
      # A directional adjunct needs its own event-bearing ask. The bare
      # existential must not accept the prefix of a rejected location ask.
      - absent: {cat: spatial_goal_preposition}
      - slot_not_category: {slot: verb, cat: possession_state}
      - slot_not_category: {slot: verb, cat: enrollment_quantity_verb}
    resolves:
      consumer: unique-entity
      measure: "{item}"
      measure_substance: "{substance}"
    generation:
      slot_categories:
        verb: [plural_copula]

  - id: ask/how-many-there-combined
    # Handles an entity-less total, such as "how many chairs are there in
    # total?" The aggregate marker is required because it authorizes a sum
    # across holders; without it, the bare rule requires one unique holder.
    #
    # `exclude_entity: world` prevents an unlocated scene-level fact from
    # being counted again beside named holders. An optional partitive tail
    # guards the substance, and an optional trailing group such as "in the
    # two lakes" lets `grp_value` mark its cardinal as used. This rule still
    # supports only one measure at a time.
    match:
      question:
        - {lit: how}
        - {lit: many}
        - {slot: item, type: plural}
        - opt:
            - {lit: of}
            - {slot: substance, type: noun, number: singular}
        - {slot: verb, type: verb}
        - {lit: there}
        - opt:
            - {slot: p, cat: group_total_preposition}
        - {slot: agg, cat: group_total_marker}
        - opt:
            - {slot: p2, cat: group_total_scope_preposition}
            - {slot: grp, cat: group_total_scope, number: plural}
    where:
      - bound_requires_category: {bound: p, slot: agg, cat: prepositional_group_total_marker}
      - partitive_compatible: {measure: item, substance: substance}
      - slot_not_category: {slot: item, cat: mass_quantity_noun}
      - slot_not_category: {slot: verb, cat: possession_state}
      - slot_not_category: {slot: verb, cat: enrollment_quantity_verb}
      - attribute_compatible: {attribute: p2, noun: grp}
    resolves:
      consumer: combined
      measure: "{item}"
      verb: "{verb}"
      exclude_entity: world
      grp_value: "{grp.value}"
      measure_substance: "{substance}"
    generation:
      # The broad reader slot is a decline interceptor for malformed
      # existential continuations. Independent generation authors only the
      # grammatical plural-copula realization.
      slot_categories:
        verb: [plural_copula]

  - id: ask/how-many-passive-combined
    # Passive total form: "how many pies were eaten in total?" The copula and
    # participle identify a subjectless passive clause. The verb slot resolves
    # the participle to its lemma, so the existing combined consumer can sum
    # the event facts.
    #
    # This rule shares the substance, trailing-group, and `world` safeguards
    # of the preceding entity-less total rule. The total marker is essential:
    # a bare passive question would use the wrong signed fold. Passive
    # comparisons by time also remain unsupported because they need a
    # time-scoped consumer.
    match:
      question:
        - {lit: how}
        - {lit: many}
        - {slot: item, cat: passive_quantity_object, number: plural}
        - opt:
            - {lit: of}
            - {slot: substance, type: noun, number: singular}
        - {slot: be, cat: copula}
        - {slot: verb, cat: passive_quantity_participle}
        - opt:
            - {slot: p, cat: group_total_preposition}
        - {slot: agg, cat: group_total_marker}
        - opt:
            - {slot: p2, cat: group_total_scope_preposition}
            - {slot: grp, cat: group_total_scope, number: plural}
    where:
      - bound_requires_category: {bound: p, slot: agg, cat: prepositional_group_total_marker}
      - number_compatible: [item, be]
      - verb_role_compatible:
          {verb: verb, verb_cat: passive_quantity_participle, roles: [item], role_cat: passive_quantity_object}
      - partitive_compatible: {measure: item, substance: substance}
      - slot_not_category: {slot: item, cat: mass_quantity_noun}
      - attribute_compatible: {attribute: p2, noun: grp}
    resolves:
      consumer: combined
      measure: "{item}"
      verb: "{verb}"
      exclude_entity: world
      grp_value: "{grp.value}"
      measure_substance: "{substance}"

  - id: ask/how-many-plural-combined
    # Handles a collective plural subject, such as "how many books do the
    # two boys have in total?" The subject identifies a group rather than a
    # particular holder, so the consumer enumerates the holders. `who_value`
    # marks any merged cardinal as used. Pronoun and named-pair subjects have
    # separate, non-overlapping rules.
    match:
      question:
        - {lit: how}
        - {lit: many}
        - {slot: item, type: plural}
        - {slot: aux, cat: plural_auxiliary}
        - {slot: who, cat: quantity_holder, number: plural}
        - {slot: verb, type: verb, bare_form: true}
        - opt:
            - {slot: p, cat: group_total_preposition}
        - {slot: agg, cat: group_total_marker}
    where:
      - bound_requires_category: {bound: p, slot: agg, cat: prepositional_group_total_marker}
      - slot_not_category: {slot: item, cat: many_incompatible_noun}
      - slot_not_category: {slot: verb, cat: non_quantity_object_verb}
      - verb_roles_compatible:
          verb: verb
          roles: {theme: [item]}
    resolves:
      consumer: combined
      measure: "{item}"
      verb: "{verb}"
      who_value: "{who.value}"
    generation:
      slot_categories:
        who: [quantity_event_participant]
        verb: [quantity_ask_verb]

  - id: ask/how-many-all-combined
    # Handles "all of them" as a collective subject. This grammar-only rule
    # keeps the surface independently realisable, but its query explicitly
    # requires discourse context and the consumer declines without it. When a
    # fact-backed antecedent exists, the more-specific sibling below supplies
    # its exact holders. The inserted words "all of" keep this form separate
    # from the bare "they" or "we" rule.
    match:
      question:
        - {lit: how}
        - {lit: many}
        - {slot: item, type: plural}
        - {slot: aux, type: auxiliary}
        - {lit: all}
        - {lit: of}
        - {slot: who, cat: discourse_group_pronoun}
        - {slot: verb, type: verb, bare_form: true}
        - opt:
            - {slot: p, cat: group_total_preposition}
        - {slot: agg, cat: group_total_marker}
    where:
      - bound_requires_category: {bound: p, slot: agg, cat: prepositional_group_total_marker}
      - slot_not_category: {slot: item, cat: many_incompatible_noun}
      - slot_not_category: {slot: verb, cat: non_quantity_object_verb}
      - verb_roles_compatible:
          verb: verb
          roles: {theme: [item]}
      - verb_role_compatible: {verb: verb, roles: [item], verb_cat: purchase, role_cat: transferable_quantity_object}
    resolves:
      consumer: combined
      # The grammar can round-trip independently, but the consumer must not
      # enumerate holders when no antecedent group exists. In a real discourse
      # the more-specific sibling below wins and supplies exact `holders`.
      require_discourse_group: "true"
      measure: "{item}"
      verb: "{verb}"
    generation:
      slot_categories:
        aux: [plural_auxiliary]
        verb: [quantity_ask_verb]

  - id: ask/how-many-all-combined-discourse-group
    # Context-bearing interpretation of "all of them". A category-gated
    # plural auxiliary gives this sibling greater ask specificity than the
    # independently round-trippable grammar rule above. The resolved object
    # pronoun contributes the exact prior-subject group; no fact-store-wide
    # holder enumeration is permitted.
    match:
      question:
        - {lit: how}
        - {lit: many}
        - {slot: item, type: plural}
        - {slot: aux, cat: auxiliary}
        - {lit: all}
        - {lit: of}
        - {slot: who, cat: discourse_group_pronoun}
        - {slot: verb, type: verb, bare_form: true}
        - opt:
            - {slot: p, cat: group_total_preposition}
        - {slot: agg, cat: group_total_marker}
    where:
      - slot_not_category: {slot: item, cat: many_incompatible_noun}
      - bound_requires_category: {bound: p, slot: agg, cat: prepositional_group_total_marker}
    resolves:
      consumer: combined
      holders: "{who.group_members}"
      measure: "{item}"
      measure_qualifier: "{item.qualifier}"
      verb: "{verb}"
    generation:
      context_required: true
      context_strategy: evidence
      slot_categories:
        aux: [plural_auxiliary]
        item: [transferable_quantity_object]
        verb: [plain_have_state]
      evidence_rules:
        - rule: arithmetic/stated-count-holding
          bindings: {who: holders.0, amount: measure, verb: verb}
        - rule: arithmetic/stated-count-holding
          bindings: {who: holders.1, amount: measure, verb: verb}

  - id: ask/how-many-plural-combined-prenominal-marker
    # Handles the aggregate marker before the measure: "how many total toys
    # do the boys have?" The marker is required. A bare plural question
    # still needs either a trailing total marker or an explicit cardinal.
    # `who_value` marks a cardinal in the plural subject as used.
    match:
      question:
        - {lit: how}
        - {lit: many}
        - {slot: pre, cat: prenominal_group_total_marker}
        - {slot: item, type: plural}
        - {slot: aux, cat: plural_auxiliary}
        - {slot: who, cat: quantity_holder, number: plural}
        - {slot: verb, type: verb, bare_form: true}
    where:
      - slot_not_category: {slot: item, cat: many_incompatible_noun}
      - slot_not_category: {slot: verb, cat: non_quantity_object_verb}
      - verb_roles_compatible:
          verb: verb
          roles: {theme: [item]}
    resolves:
      consumer: combined
      measure: "{item}"
      verb: "{verb}"
      who_value: "{who.value}"
    generation:
      slot_categories:
        who: [quantity_event_participant]
        verb: [quantity_ask_verb]

  - id: ask/how-many-combined-prenominal-marker
    # Pronoun-subject sibling of the plural common-noun rule above:
    # "how many total animals do they have?" The required total marker
    # authorizes the existing combined consumer to enumerate the facts; the
    # pronoun itself does not guess a holder. This keeps the form separate
    # from single-name asks and from unmarked "how many animals do they have?"
    # questions, which remain unsupported without an explicit total signal.
    match:
      question:
        - {lit: how}
        - {lit: many}
        - {slot: pre, cat: prenominal_group_total_marker}
        - {slot: item, type: plural}
        - {slot: aux, type: future_modal}
        - {slot: who, cat: discourse_subject_group_pronoun}
        - {slot: verb, cat: quantity_ask_verb, bare_form: true}
    where:
      - number_compatible: [who, aux]
    resolves:
      consumer: combined
      measure: "{item}"
      verb: "{verb}"

  - id: ask/how-many-plural-combined-quantified-subject
    # Handles a quantifier before a plural noun, such as "all boys" or
    # "both teams". A trailing aggregate marker is still required because
    # the subject has no cardinal of its own. This is distinct from the bare
    # plural form and from the pronoun phrase "all of them".
    match:
      question:
        - {lit: how}
        - {lit: many}
        - {slot: item, type: plural}
        - {slot: aux, cat: plural_auxiliary}
        - {slot: q, cat: plural_subject_quantifier}
        - {slot: who, cat: quantity_holder, number: plural}
        - {slot: verb, type: verb, bare_form: true}
        - opt:
            - {slot: p, cat: group_total_preposition}
        - {slot: agg, cat: group_total_marker}
    where:
      - bound_requires_category: {bound: p, slot: agg, cat: prepositional_group_total_marker}
      - slot_not_category: {slot: item, cat: many_incompatible_noun}
      - slot_not_category: {slot: verb, cat: non_quantity_object_verb}
      - verb_roles_compatible:
          verb: verb
          roles: {theme: [item]}
      - verb_role_compatible: {verb: verb, roles: [item], verb_cat: spend_verb, role_cat: currency}
    resolves:
      consumer: combined
      measure: "{item}"
      verb: "{verb}"
      who_value: "{who.value}"
    generation:
      slot_categories:
        who: [quantity_event_participant]
        verb: [quantity_ask_verb]

  - id: ask/how-many-plural-combined-cardinal-subject
    # Handles an explicit cardinal in the subject, such as "the two boys",
    # "these three boys", or "all three friends". The cardinal itself makes
    # the group total clear, so no aggregate marker is required. `counted` is
    # the essential guard: never widen it to a bare plural subject. If a
    # trailing marker is present, the more specific marked rule wins.
    match:
      question:
        - {lit: how}
        - {lit: many}
        - {slot: item, type: plural}
        - {slot: aux, cat: plural_auxiliary}
        - opt:
            - {slot: q, cat: plural_subject_quantifier}
        - {slot: who, cat: quantity_holder, counted: true, value_min: 2}
        - {slot: verb, type: verb, bare_form: true}
    where:
      - slot_not_category: {slot: item, cat: many_incompatible_noun}
      - slot_not_category: {slot: item, cat: timeperiod}
      - slot_not_category: {slot: verb, cat: non_quantity_object_verb}
      - verb_roles_compatible:
          verb: verb
          roles: {actor: [who], theme: [item]}
    resolves:
      consumer: combined
      measure: "{item}"
      verb: "{verb}"
      who_value: "{who.value}"
    generation:
      slot_categories:
        who: [quantity_event_participant]
        verb:
          [possession_state, eating_quantity_verb, earning_quantity_verb,
           enrollment_quantity_verb, find_quantity_verb,
           production_quantity_verb, teaching_quantity_verb,
           initiation_quantity_verb]

  - id: ask/how-many-combined-named-elided-measure
    # Handles a named pair when the measure is omitted: "how many do Ana and
    # Ben have in total?" The consumer finds the one measure shared by both
    # holders and declines if there is not exactly one. Because the auxiliary
    # follows "how many" immediately, this rule cannot claim an itemed form.
    match:
      question:
        - {lit: how}
        - {lit: many}
        - {slot: aux, type: future_modal}
        - {slot: a, type: name}
        - {lit: and}
        - {slot: b, type: name}
        - {slot: verb, cat: possession_state, bare_form: true}
        - opt:
            - {slot: p, cat: group_total_preposition}
        - {slot: agg, cat: group_total_marker}
    where:
      - bound_requires_category: {bound: p, slot: agg, cat: prepositional_group_total_marker}
      - slot_not_category: {slot: aux, cat: singular_auxiliary}
    resolves:
      consumer: combined-elided-measure
      a: "{a}"
      b: "{b}"
      verb: "{verb}"

  - id: ask/how-much-bare-entity
    # Keep `who` restricted to a name. Allowing any entity would make an
    # item-cost question such as "how much do the jackets cost?" look like a
    # question about one holder and route it to the wrong consumer.
    match:
      question:
        - {lit: how}
        - {lit: much}
        # Accept ordinary and will/would forms, but not capacity modals.
        - {slot: aux, type: future_modal}
        - {slot: who, type: name}
        - {slot: verb, type: verb, bare_form: true}
    where:
      - number_compatible: [who, aux]
    resolves:
      consumer: single-entity
      entity: "{who}"
      # the CATEGORY, not a currency: resolved to the unique currency
      # measure present in the facts (mixed currencies decline)
      measure: currency
      verb: "{verb}"
    generation:
      slot_categories:
        verb: [possession_state, wage_verb, spend_verb]

  - id: ask/how-much-noun-entity
    # `who` accepts any supported entity because the named item keeps this
    # form distinct from the bare "how much" rules. The optional "in UNIT"
    # phrase handles questions such as "how much money, in dollars, does Tom
    # have?" When supplied, `req_unit` must match the resolved unit; otherwise
    # the consumer declines instead of returning the value in another unit.
    match:
      question:
        - {lit: how}
        - {lit: much}
        - {slot: item, cat: mass_quantity_noun}
        - opt:
            - {lit: in}
            - {slot: req_unit, type: noun}
        # Accept ordinary and will/would forms, but not capacity modals.
        - {slot: aux, type: future_modal}
        - {slot: who, type: entity, common_noun_cat: quantity_holder, referential: true, bare_reference_category: bare_entity_reference}
        - {slot: verb, cat: quantity_ask_verb, bare_form: true}
    where:
      - number_compatible: [who, aux]
    resolves:
      consumer: single-entity
      entity: "{who}"
      measure: "{item}"
      verb: "{verb}"
      req_unit: "{req_unit}"
    generation:
      slot_categories:
        req_unit: [currency_measure]

  - id: ask/how-much-noun-entity-uninverted
    # Handles non-inverted word order: "how much money she will have?" The
    # ordinary form places the modal before the subject. The next token after
    # the item is different in each form, so the two rules cannot overlap.
    match:
      question:
        - {lit: how}
        - {lit: much}
        - {slot: item, cat: mass_quantity_noun}
        - {slot: who, type: entity, common_noun_cat: quantity_holder, referential: true, bare_reference_category: bare_entity_reference}
        - {slot: aux, type: future_modal}
        - {slot: verb, cat: quantity_ask_verb, bare_form: true}
    where:
      - number_compatible: [who, aux]
    resolves:
      consumer: single-entity
      entity: "{who}"
      measure: "{item}"
      verb: "{verb}"
    generation:
      context_required: true
      context_strategy: conditional
      slot_categories:
        item: [mass_currency_noun]
        aux: [future_modal]
        verb: [plain_have_state]
      evidence_rules:
        - rule: arithmetic/stated-currency-holding
          bindings: {who: entity, verb: verb}

  - id: ask/how-much-combined
    # Combined "how much" form, such as "how much money do they have in
    # total?" It uses the same total consumer as the "how many" form. The
    # required item and pronoun subject keep it separate from single-holder
    # questions.
    match:
      question:
        - {lit: how}
        - {lit: much}
        - {slot: item, cat: mass_quantity_noun}
        - opt:
            - {slot: aux, type: auxiliary}
            - {slot: who, cat: clause_subject_personal_pronoun}
            - {slot: verb, cat: quantity_ask_verb, bare_form: true}
        - opt:
            - {slot: p, cat: group_total_preposition}
        - {slot: agg, cat: group_total_marker}
    where:
      - bound_requires_category: {bound: p, slot: agg, cat: prepositional_group_total_marker}
      - number_compatible: [who, aux]
      - slot_not_category: {slot: verb, cat: non_quantity_object_verb}
      - verb_roles_compatible:
          verb: verb
          roles: {theme: [item]}
      - verb_role_compatible: {verb: verb, roles: [item], verb_cat: purchase, role_cat: transferable_quantity_object}
    resolves:
      consumer: combined
      measure: "{item}"
      verb: "{verb}"
      # a SINGULAR subject ("how much does HE have total") sums that ONE
      # holder's own state+event holdings, not a multi-holder combination — the
      # combined consumer reads this to accept a lone holder there (see its
      # comment). Empty for a subjectless/plural ask, keeping the >=2 guard.
      subject_number: "{who.number}"
    generation:
      slot_categories:
        aux: [plural_auxiliary]
        who: [discourse_subject_group_pronoun]
        verb:
          [possession_state, purchase, earning_quantity_verb,
           production_quantity_verb, transfer_out]

  - id: ask/how-much-combined-in-all
    # "How much" form with the two-word marker "in all". The ordinary form
    # expects one aggregate token and cannot match this tail.
    match:
      question:
        - {lit: how}
        - {lit: much}
        - {slot: item, cat: mass_quantity_noun}
        - {slot: aux, type: future_modal}
        - {slot: who, cat: discourse_subject_group_pronoun}
        - {slot: verb, cat: quantity_ask_verb, bare_form: true}
        - {lit: in}
        - {lit: all}
    where:
      - number_compatible: [who, aux]
      - slot_not_category: {slot: verb, cat: non_quantity_object_verb}
      - verb_roles_compatible:
          verb: verb
          roles: {theme: [item]}
    resolves:
      consumer: combined
      measure: "{item}"
      verb: "{verb}"

  - id: ask/how-much-combined-named
    # Combined "how much" form for two named holders. It binds both names
    # directly. The pronoun form and the single-name forms cannot match the
    # "NAME and NAME" sequence.
    match:
      question:
        - {lit: how}
        - {lit: much}
        - {slot: item, cat: mass_quantity_noun}
        - {slot: aux, type: auxiliary}
        - {slot: a, type: name}
        - {lit: and}
        - {slot: b, type: name}
        - {slot: verb, cat: quantity_ask_verb, bare_form: true}
        - opt:
            - {slot: p, cat: group_total_preposition}
        - {slot: agg, cat: group_total_marker}
    where:
      - bound_requires_category: {bound: p, slot: agg, cat: prepositional_group_total_marker}
      - distinct: [a, b]
      - slot_not_category: {slot: verb, cat: non_quantity_object_verb}
      - verb_roles_compatible:
          verb: verb
          roles: {theme: [item]}
      - verb_role_compatible: {verb: verb, roles: [item], verb_cat: purchase, role_cat: transferable_quantity_object}
    satisfies:
      verb: [subject]
      p: [object]
    resolves:
      consumer: combined
      a: "{a}"
      b: "{b}"
      measure: "{item}"
      verb: "{verb}"
    generation:
      slot_categories:
        aux: [plural_auxiliary]
        verb:
          [possession_state, purchase, earning_quantity_verb,
           production_quantity_verb, transfer_out]

  - id: ask/how-much-combined-named-in-all
    # Named-pair "how much" form with the two-word marker "in all". The
    # ordinary named form expects one aggregate token and cannot match it.
    match:
      question:
        - {lit: how}
        - {lit: much}
        - {slot: item, cat: mass_quantity_noun}
        - {slot: aux, type: future_modal}
        - {slot: a, type: name}
        - {lit: and}
        - {slot: b, type: name}
        - {slot: verb, cat: possession_state, bare_form: true}
        - {lit: in}
        - {lit: all}
    where:
      - slot_not_category: {slot: aux, cat: singular_auxiliary}
      - distinct: [a, b]
    resolves:
      consumer: combined
      a: "{a}"
      b: "{b}"
      measure: "{item}"
      verb: "{verb}"

  - id: ask/how-much-combined-cardinal-pronoun
    # how-much sibling of ask/how-many-combined-cardinal-pronoun — see
    # that ask's comment for the full class rationale (bare cardinal
    # holder set, literal "of them" tail, `holder_count` double duty).
    # Never a tie with ask/how-much-combined: same non-tie argument as
    # ask/how-many-combined-cardinal-pronoun vs ask/how-many-combined
    # (the pronoun sibling's opt group requires `type: auxiliary` +
    # `type: pronoun` + verb as one atomic subsequence; a cardinal
    # satisfies neither).
    match:
      question:
        - {lit: how}
        - {lit: much}
        - {slot: item, cat: mass_quantity_noun}
        - {slot: aux, type: auxiliary}
        - {slot: n, type: number, standalone: true}
        - opt:
            - {lit: of}
            - {lit: them}
        - {slot: verb, type: verb, bare_form: true}
        - opt:
            - {slot: p, cat: group_total_preposition}
        - {slot: agg, cat: group_total_marker}
    where:
      - bound_requires_category: {bound: p, slot: agg, cat: prepositional_group_total_marker}
    satisfies:
      n: [quantifies]
      p: [object]
      verb: [subject]
    resolves:
      consumer: combined
      measure: "{item}"
      verb: "{verb}"
      holder_count: "{n.value}"

  - id: ask/how-much-noun-more-than
    match:
      question:
        - {lit: how}
        - {lit: much}
        - {slot: dir, cat: mass_quantity_delta}
        - {slot: item, cat: mass_quantity_noun}
        - {slot: aux, type: future_modal}
        - {slot: a, type: name}
        - {slot: verb, type: verb, bare_form: true}
        - {lit: than}
        - {slot: b, type: name}
    resolves:
      consumer: difference
      a: "{a}"
      b: "{b}"
      measure: "{item}"
      verb: "{verb}"
    where:
      - number_compatible: [a, aux]
      - distinct: [a, b]
      - slot_not_category: {slot: verb, cat: non_quantity_object_verb}
      - verb_roles_compatible:
          verb: verb
          roles: {theme: [item]}
      - verb_role_compatible: {verb: verb, roles: [item], verb_cat: spend_verb, role_cat: currency}
    generation:
      slot_categories:
        verb: [possession_state, earning_quantity_verb, spend_verb]

  - id: ask/what-is-the-difference-named
    match:
      question:
        # "what is the difference in/between the number of ITEM NAME and
        # NAME have" — the wh-difference CLASS routed to the EXISTING
        # 'difference' consumer shared with ask/how-many-more; 'the'/'a'
        # articles are skippable senses, never authored as literals.
        # `cat: state` reuses the established has/have/is/are/was/were/
        # own/owns equivalence class (core-english categories) for the
        # copula, exactly as ask/how-old-is does.
        - {lit: what}
        - {slot: be, cat: singular_copula}
        - {lit: the, consume_skipped: true}
        - {lit: difference}
        - {slot: prep, cat: difference_preposition}
        - opt:
            # "the number of"/"the amount of" framing (same aggregate_noun
            # + 'of' pairing as arithmetic/times-the-number-of) — optional
            # because "the difference in ITEM ..." also occurs bare.
            - {lit: the, consume_skipped: true}
            - {slot: frame, cat: aggregate_noun}
            - {lit: of}
        - {slot: item, type: plural}
        - {slot: a, type: name}
        - {lit: and}
        - {slot: b, type: name}
        - {slot: verb, type: verb, finite_form: true}
    where:
      - distinct: [a, b]
    resolves:
      consumer: difference
      a: "{a}"
      b: "{b}"
      measure: "{item}"
      verb: "{verb}"

  - id: ask/what-is-the-difference-pronoun
    match:
      question:
        # the pronoun mirror of ask/what-is-the-difference-named ("...ITEM
        # they have?") — no named pair to bind, so the consumer resolves
        # the pair itself from the FACTS (exactly two holders of the
        # measure, or decline; mirrors the 'combined' consumer's holder
        # enumeration, but difference is inherently BINARY, never a Σ).
        - {lit: what}
        - {slot: be, cat: singular_copula}
        - {lit: the, consume_skipped: true}
        - {lit: difference}
        - {slot: prep, cat: difference_preposition}
        - opt:
            - {lit: the, consume_skipped: true}
            - {slot: frame, cat: aggregate_noun}
            - {lit: of}
        - {slot: item, type: plural}
        - {slot: who, cat: discourse_subject_group_pronoun}
        - {slot: verb, type: verb, finite_form: true}
    where:
      - slot_not_category: {slot: item, cat: many_incompatible_noun}
      - number_compatible: [who, verb]
      - verb_role_compatible: {verb: verb, roles: [item], verb_cat: animate_object_verb, role_cat: teaching_quantity_object}
    resolves:
      consumer: difference
      measure: "{item}"
      verb: "{verb}"
    generation:
      slot_categories:
        verb: [possession_state]

  - id: ask/how-many-unit-task-completion-comparative-than
    # Exact task-completion duration comparison: the requested duration unit,
    # signed speed direction, two participants, completion verb, and task
    # object are all explicit. The dedicated consumer validates that the
    # direction agrees with elapsed-time ordering before returning a gap.
    match:
      question:
        - {lit: how}
        - {lit: many}
        - {slot: unit, cat: duration_measure, number: plural}
        - {slot: dir, cat: task_completion_speed_comparative}
        - {slot: aux, type: auxiliary}
        - {slot: a, type: entity, common_noun_cat: quantity_event_participant, referential: true, bare_reference_category: bare_entity_reference}
        - {slot: verb, cat: task_completion_verb, bare_form: true}
        - opt:
            - {slot: task_poss, cat: possessive_determiner}
        - {slot: task, cat: finishable_quantity_object, referential: true}
        - {lit: than}
        - {slot: b, type: entity, common_noun_cat: quantity_event_participant, referential: true, bare_reference_category: bare_entity_reference}
    where:
      - number_compatible: [a, aux]
    resolves:
      consumer: completion-duration-difference
      a: "{a}"
      b: "{b}"
      task: "{task.qualified}"
      unit: "{unit}"
      direction: "{dir}"
      verb: "{verb}"

  - id: ask/how-many-unit-dimension-comparative-than
    # Handles dimensional differences, such as "how many inches taller is
    # Vlad than his sister?" Taller/shorter and heavier/lighter use one rule
    # because the answer is an absolute difference.
    #
    # The copula is a verb here, not an auxiliary. The optional possessive
    # determiner must be consumed before `b`; otherwise "his" could be mistaken
    # for the standard instead of "sister". `fold_units` combines compatible
    # units—for example, 6 feet 3 inches must become 75 inches before the
    # comparison.
    match:
      question:
        - {lit: how}
        - {lit: many}
        - {slot: item, cat: dimension_difference_measure, number: plural}
        - {slot: dir, cat: dimension_comparative}
        - {slot: aux, cat: copula}
        - {slot: a, type: entity, referential: true, bare_reference_category: bare_entity_reference}
        - {lit: than}
        - opt:
            - {slot: poss, cat: possessive_determiner}
        - {slot: b, type: entity, referential: true, bare_reference_category: bare_entity_reference}
    where:
      - attribute_compatible: {attribute: dir, noun: item}
      - number_compatible: [a, aux]
      - distinct: [a, b]
      - bound_requires_category: {bound: poss, slot: b, cat: animate}
      - measure_holder_compatible:
          measure: item
          holders: [a, b]
          allow_proper_name: true
          proper_name_measure_categories: [length_measure, mass_measure]
    resolves:
      consumer: difference
      a: "{a}"
      b: "{b}"
      measure: "{item}"
      verb: "{aux}"
      fold_units: "true"

  - id: ask/how-much-dimension-comparative-than-unit
    # Same dimensional comparison with the requested unit at the end:
    # "how much taller is Mike than Mark in inches?" It uses the same
    # possessive guard and compatible-unit folding as the preceding rule.
    match:
      question:
        - {lit: how}
        - {lit: much}
        - {slot: dir, cat: dimension_comparative}
        - {slot: aux, cat: copula}
        - {slot: a, type: entity, referential: true, bare_reference_category: bare_entity_reference}
        - {lit: than}
        - opt:
            - {slot: poss, cat: possessive_determiner}
        - {slot: b, type: entity, referential: true, bare_reference_category: bare_entity_reference}
        - {lit: in}
        - {slot: item, cat: dimension_difference_measure, number: plural}
    where:
      - attribute_compatible: {attribute: dir, noun: item}
      - number_compatible: [a, aux]
      - distinct: [a, b]
      - bound_requires_category: {bound: poss, slot: b, cat: animate}
      - measure_holder_compatible:
          measure: item
          holders: [a, b]
          allow_proper_name: true
          proper_name_measure_categories: [length_measure, mass_measure]
    resolves:
      consumer: difference
      a: "{a}"
      b: "{b}"
      measure: "{item}"
      verb: "{aux}"
      fold_units: "true"
    generation:
      slot_categories:
        dir: [linear_dimension_comparative]
        item: [length_measure]

  - id: ask/how-much-age-comparative-than
    # Age form of the dimensional comparison: "how much older is Andy than
    # Rahim?" The comparative implies years, so the rule supplies `year`
    # directly. Ages do not need mixed-unit folding.
    match:
      question:
        - {lit: how}
        - {lit: much}
        - {slot: dir, cat: age_comparative}
        - {slot: aux, cat: copula}
        - {slot: a, type: entity, common_noun_cat: quantity_event_participant, referential: true, bare_reference_category: bare_entity_reference}
        - {lit: than}
        - opt:
            - {slot: poss, cat: possessive_determiner}
        - {slot: b, type: entity, common_noun_cat: quantity_event_participant, referential: true, bare_reference_category: bare_entity_reference}
    where:
      - number_compatible: [a, aux]
      - distinct: [a, b]
      - bound_requires_category: {bound: poss, slot: b, cat: animate}
    resolves:
      consumer: difference
      a: "{a}"
      b: "{b}"
      measure: year
      verb: "{aux}"
      evidence_temporal_perspective: "{aux.surface}"
      evidence_measure_category: age_measure

  - id: ask/how-many-output-rate-span-one
    # Project a measured production cadence across one named duration unit.
    # The governing verb and output measure must satisfy the same declared
    # role frame as the premise; rate-span performs the duration conversion.
    # English permits both "write in a year" and the bare-span "write a
    # year" in this rate-total question, so the structural preposition is
    # optional without changing the query semantics.
    match:
      question:
        - {lit: how}
        - {lit: many}
        - {slot: item, cat: output_quantity_measure, number: plural}
        - {slot: aux, type: auxiliary}
        - {slot: who, type: entity, common_noun_cat: production_quantity_participant, referential: true, bare_reference_category: bare_entity_reference}
        - {slot: verb, cat: output_quantity_verb, bare_form: true}
        - opt:
            - {lit: in}
        - {lit: [a, an], consume_skipped: true}
        - {slot: span, cat: duration_measure, number: singular}
    where:
      - number_compatible: [who, aux]
      - verb_roles_compatible:
          verb: verb
          roles:
            actor: [who]
            theme: [item]
          allow_proper_name: [who]
    resolves:
      consumer: rate-span
      entity: "{who}"
      evidence_subject_number: "{who.number}"
      evidence_entity_qualifier: "{who.qualifier}"
      evidence_entity_owner: "{who.owner}"
      evidence_measure_qualifier: "{item.qualifier}"
      evidence_measure_owner: "{item.owner}"
      evidence_verb: "{verb}"
      measure: "{item}"
      verb: "{verb}"
      span_unit: "{span}"
      span_value: "1"

  - id: ask/how-many-content-progress-perfect-singular
    # Singular present-perfect activity total: "How many pages has Aven
    # read?" The fixed auxiliary is grammatical skeleton and the participial
    # category supplies irregular morphology. The ordinary single-entity
    # consumer sums only matching read events.
    match:
      question:
        - {lit: how}
        - {lit: many}
        - {slot: item, cat: content_progress_measure, number: plural}
        - {lit: has}
        - {slot: who, type: entity, common_noun_cat: quantity_event_participant, referential: true, bare_reference_category: bare_entity_reference, number: singular}
        - {slot: verb, cat: content_progress_perfect_participle}
    where:
      - verb_roles_compatible:
          verb: verb
          roles:
            actor: [who]
            theme: [item]
          allow_proper_name: [who]
    resolves:
      consumer: single-entity
      entity: "{who}"
      measure: "{item}"
      verb: "{verb}"

  - id: ask/how-many-content-progress-fraction-of-remainder
    # Planned progress against a measured product: "How many pages should
    # Aven read tomorrow if Aven wants to read half the remaining pages?"
    # The conditional tail is part of the query specification, not a premise:
    # wanting work does not assert that it happened. The consumer follows the
    # participant's one declared content product, subtracts completed matching
    # events from its capacity, and applies the bounded requested fraction.
    match:
      question:
        - {lit: how}
        - {lit: many}
        - {slot: item, cat: content_progress_measure, number: plural}
        - {slot: aux, cat: planned_progress_modal}
        - {slot: who, type: entity, common_noun_cat: quantity_event_participant, referential: true, bare_reference_category: bare_entity_reference, number: singular}
        - {slot: verb, cat: content_progress_quantity_verb, bare_form: true}
        - {slot: target_time, cat: future_day_marker}
        - {lit: if}
        - {slot: who, type: entity, common_noun_cat: quantity_event_participant, referential: true, bare_reference_category: bare_entity_reference, number: singular}
        - {slot: want, cat: finite_infinitival_goal_predicate, finite_form: true}
        - {lit: to}
        - {slot: verb, cat: content_progress_quantity_verb, bare_form: true}
        - {lit: half}
        - {lit: the, consume_skipped: true}
        - {slot: goal_item, cat: content_progress_measure, number: plural, qualified: true, qualifier_cat: prenominal_remnant_adj}
    where:
      - number_compatible: [who, aux]
      - number_compatible: [who, want]
      - same_lemma: [item, goal_item]
      - verb_roles_compatible:
          verb: verb
          roles:
            actor: [who]
            theme: [item]
          allow_proper_name: [who]
    resolves:
      consumer: content-progress-remainder-fraction
      entity: "{who}"
      measure: "{item}"
      verb: "{verb}"
      fraction: "0.5"
      target_time: "{target_time}"
      product_category: content_progress_product
      capacity_verb: have
    generation:
      context_required: true
      context_strategy: evidence
      evidence_rules:
        - rule: arithmetic/content-progress-measured-product
          bindings: {who: entity, verb: verb}
        - rule: arithmetic/realized-progress-anaphoric-multiplier
          bindings: {who_a: entity, item_a: measure, verb_a: verb}

  - id: ask/how-many-content-progress-fraction-of-remainder-with-of
    # Productive fraction sibling: non-half fractions require the explicit
    # partitive marker ("a third of the remaining pages"). Keeping it separate
    # prevents standalone generation from producing "a third the pages" while
    # retaining the common idiomatic "half the pages" rule above.
    match:
      question:
        - {lit: how}
        - {lit: many}
        - {slot: item, cat: content_progress_measure, number: plural}
        - {slot: aux, cat: planned_progress_modal}
        - {slot: who, type: entity, common_noun_cat: quantity_event_participant, referential: true, bare_reference_category: bare_entity_reference, number: singular}
        - {slot: verb, cat: content_progress_quantity_verb, bare_form: true}
        - {slot: target_time, cat: future_day_marker}
        - {lit: if}
        - {slot: who, type: entity, common_noun_cat: quantity_event_participant, referential: true, bare_reference_category: bare_entity_reference, number: singular}
        - {slot: want, cat: finite_infinitival_goal_predicate, finite_form: true}
        - {lit: to}
        - {slot: verb, cat: content_progress_quantity_verb, bare_form: true}
        - {slot: fraction, type: fraction, fraction_within_whole: true, fraction_positive: true, generation_explicit_unit_fraction: true}
        - {lit: of}
        - {lit: the, consume_skipped: true}
        - {slot: goal_item, cat: content_progress_measure, number: plural, qualified: true, qualifier_cat: prenominal_remnant_adj}
    where:
      - number_compatible: [who, aux]
      - number_compatible: [who, want]
      - same_lemma: [item, goal_item]
      - verb_roles_compatible:
          verb: verb
          roles:
            actor: [who]
            theme: [item]
          allow_proper_name: [who]
    resolves:
      consumer: content-progress-remainder-fraction
      entity: "{who}"
      measure: "{item}"
      verb: "{verb}"
      fraction: "{fraction.value}"
      target_time: "{target_time}"
      product_category: content_progress_product
      capacity_verb: have
    generation:
      context_required: true
      context_strategy: evidence
      evidence_rules:
        - rule: arithmetic/content-progress-measured-product
          bindings: {who: entity, verb: verb}
        - rule: arithmetic/realized-progress-anaphoric-multiplier
          bindings: {who_a: entity, item_a: measure, verb_a: verb}

  - id: ask/if-content-progress-fraction-of-remainder-how-many
    # Conditional-first planning sibling: "If Aven wants to read one third
    # of the remaining pages tomorrow, how many pages should Aven read?"
    # Because one declared ask consumes this whole surface, the document
    # router retains the purpose clause as query structure instead of
    # promoting it to an asserted question premise.
    match:
      question:
        - {lit: if}
        - {slot: who, type: entity, common_noun_cat: quantity_event_participant, referential: true, bare_reference_category: bare_entity_reference, number: singular}
        - {slot: want, cat: finite_infinitival_goal_predicate, finite_form: true}
        - {lit: to}
        - {slot: verb, cat: content_progress_quantity_verb, bare_form: true}
        - {slot: fraction, type: fraction, fraction_within_whole: true, fraction_positive: true, generation_explicit_unit_fraction: true}
        - {lit: of}
        - {lit: the, consume_skipped: true}
        - {slot: goal_item, cat: content_progress_measure, number: plural, qualified: true, qualifier_cat: prenominal_remnant_adj}
        - {slot: target_time, cat: future_day_marker}
        - {lit: how}
        - {lit: many}
        - {slot: item, cat: content_progress_measure, number: plural}
        - {slot: aux, cat: planned_progress_modal}
        - {slot: who, type: entity, common_noun_cat: quantity_event_participant, referential: true, bare_reference_category: bare_entity_reference, number: singular}
        - {slot: verb, cat: content_progress_quantity_verb, bare_form: true}
    where:
      - number_compatible: [who, want]
      - number_compatible: [who, aux]
      - same_lemma: [goal_item, item]
      - verb_roles_compatible:
          verb: verb
          roles:
            actor: [who]
            theme: [item]
          allow_proper_name: [who]
    resolves:
      consumer: content-progress-remainder-fraction
      entity: "{who}"
      measure: "{item}"
      verb: "{verb}"
      fraction: "{fraction.value}"
      target_time: "{target_time}"
      product_category: content_progress_product
      capacity_verb: have
    generation:
      context_required: true
      context_strategy: evidence
      evidence_rules:
        - rule: arithmetic/content-progress-measured-product
          bindings: {who: entity, verb: verb}
        - rule: arithmetic/realized-progress-anaphoric-multiplier
          bindings: {who_a: entity, item_a: measure, verb_a: verb}

  - id: ask/how-much-rate-span
    match:
      question:
        - {lit: how}
        - {lit: much}
        - {slot: aux, type: auxiliary}
        - {slot: who, type: entity, common_noun_cat: earning_quantity_participant, referential: true, bare_reference_category: bare_entity_reference}
        - {slot: verb, cat: spend_verb, bare_form: true}
        - {lit: in}
        - {slot: span, cat: duration_measure, counted: true, value_min: 1}
    where:
      - number_compatible: [who, aux]
    resolves:
      consumer: rate-span
      entity: "{who}"
      evidence_subject_number: "{who.number}"
      evidence_entity_qualifier: "{who.qualifier}"
      evidence_entity_owner: "{who.owner}"
      evidence_verb: "{verb}"
      measure: currency
      verb: "{verb}"
      span_unit: "{span}"
      span_value: "{span.value}"
    generation:
      validated_slot_bindings:
        span: {identity_field: per, value_field: denominator}
      validated_source_bindings:
        aux: aux

  - id: ask/how-much-rate-span-modal
    # Modal currency-rate question. As in the "how many" form, the required
    # "in SPAN" tail keeps it separate from purchase-capacity questions.
    match:
      question:
        - {lit: how}
        - {lit: much}
        - {slot: aux, cat: capacity_modal}
        - {slot: who, type: entity, common_noun_cat: earning_quantity_participant, referential: true, bare_reference_category: bare_entity_reference}
        - {slot: verb, cat: wage_verb, bare_form: true}
        - {lit: in}
        - {slot: span, cat: duration_measure, counted: true, value_min: 1}
    resolves:
      consumer: rate-span
      entity: "{who}"
      evidence_subject_number: "{who.number}"
      evidence_entity_qualifier: "{who.qualifier}"
      evidence_entity_owner: "{who.owner}"
      evidence_verb: "{verb}"
      measure: currency
      verb: "{verb}"
      span_unit: "{span}"
      span_value: "{span.value}"
    generation:
      validated_slot_bindings:
        span: {identity_field: per, value_field: denominator}
      validated_source_bindings:
        aux: aux

  - id: ask/earn-span
    # Wage question: "how much does Rob earn in 8 hours?" The narrow
    # `wage_verb` category prevents unrelated buying or producing questions
    # from matching. The span is optional because an earlier premise may
    # already state it. This rule sorts before the general bare-entity form
    # so wage verbs reach the rate consumer when their shapes tie.
    match:
      question:
        - {lit: how}
        - {lit: much}
        - {slot: aux, type: future_modal}
        - {slot: who, type: entity, common_noun_cat: earning_quantity_participant, referential: true, bare_reference_category: bare_entity_reference}
        - {slot: verb, cat: wage_verb, bare_form: true}
        - opt:
            - {lit: in}
            - {slot: span, cat: duration_measure, counted: true}
    where:
      - number_compatible: [who, aux]
    resolves:
      consumer: rate-span
      entity: "{who}"
      evidence_subject_number: "{who.number}"
      evidence_entity_qualifier: "{who.qualifier}"
      evidence_entity_owner: "{who.owner}"
      evidence_verb: "{verb}"
      measure: currency
      span_unit: "{span}"
      span_value: "{span.value}"

  - id: ask/how-old-is
    match:
      question:
        - {lit: how}
        - {lit: old}
        - {slot: verb, cat: copula}
        - {slot: who, type: name}
    satisfies: {verb: [subject]}
    resolves:
      consumer: single-entity
      entity: "{who}"
      # the DATA measure the stated-age rule commits to — matches its
      # emitted Quantity's measure exactly, no category resolution needed
      measure: year
      verb: "{verb}"
      evidence_temporal_perspective: "{verb.surface}"
      evidence_measure_category: age_measure

  - id: ask/how-old-at-year
    # "How old was the teacher in 2022?" queries an explicit absolute
    # calendar coordinate. The consumer projects only AgeAtYear facts and
    # requires every matching source coordinate to agree on one result.
    match:
      question:
        - {lit: how}
        - {lit: old}
        - {slot: verb, cat: past_copula}
        - {slot: who, type: entity, common_noun_cat: quantity_event_participant, referential: true, bare_reference_category: bare_entity_reference}
        - {lit: in}
        - {slot: target_year, type: number, standalone: true, integer: true, value_min: 1000, value_max: 9999}
    where:
      - number_compatible: [who, verb]
    satisfies:
      target_year: [quantifies]
      verb: [subject]
    resolves:
      consumer: age-at-year
      entity: "{who}"
      entity_owner: "{who.owner}"
      entity_qualifier: "{who.qualifier}"
      entity_label: "{who.label}"
      measure: year
      target_year: "{target_year.value}"

  - id: ask/how-old-discourse-group-now
    # "How old are they now?" returns one labelled age for every member of
    # the exact prior referential-subject group. The subject-case pronoun is
    # deliberately separate from object-case `them`; the current-moment
    # category is deliberately narrower than yesterday/tomorrow. `now` only
    # supplies a relative coordinate here: the caller must provide the
    # absolute reference year, so replay and benchmarks never read a hidden
    # wall clock.
    match:
      question:
        - {lit: how}
        - {lit: old}
        - {slot: verb, cat: plural_copula}
        - {slot: group, cat: discourse_subject_group_pronoun}
        - {slot: when, cat: temporal_marker}
    satisfies: {verb: [subject]}
    resolves:
      consumer: age-at-year
      holders: "{group.group_members}"
      measure: year
      target_marker: "{when}"
    generation:
      context_required: true
      context_strategy: evidence
      evidence_rules:
        - rule: arithmetic/stated-age-at-year
          bindings: {who: holders.0, calendar_year: reference_year}
        - rule: arithmetic/stated-age-at-year
          bindings: {who: holders.1, calendar_year: reference_year}

  - id: ask/what-combined-age-at-year
    # "What was their combined age in 2020?" binds the possessive to the
    # exact prior referential-subject group, projects every member to the
    # explicit integral year, and only then requests a sum. The prenominal
    # marker category admits "combined age" and "total age" without also
    # accepting postpositive "together age"/"altogether age" surfaces.
    match:
      question:
        - {lit: what, at_start: true}
        - {slot: verb, cat: copula}
        - {slot: group, cat: plural_possessive_determiner}
        - {slot: agg, cat: prenominal_group_total_marker}
        - {slot: noun, cat: age_noun}
        - {lit: in}
        - {slot: target_year, type: number, standalone: true, integer: true, value_min: 1000, value_max: 9999}
    satisfies:
      target_year: [quantifies]
      verb: [subject]
    resolves:
      consumer: age-at-year
      holders: "{group.group_members}"
      measure: year
      target_year: "{target_year.value}"
      aggregate: sum
    generation:
      context_required: true
      context_strategy: evidence
      evidence_rules:
        - rule: arithmetic/stated-age-at-year
          bindings: {who: holders.0, calendar_year: target_year}
        - rule: arithmetic/stated-age-at-year
          bindings: {who: holders.1, calendar_year: target_year}

  - id: ask/how-old-is-possessed
    # "How old is her child?" and "How old is Mary's child?" query the
    # exact owner-qualified animate noun. The optional determiner supports
    # the two-unit pronoun form; apostrophe-s possession is already one
    # owner-tagged noun unit. A different owner's same-headed noun is never
    # used as a fallback.
    match:
      question:
        - {lit: how}
        - {lit: old}
        - {slot: verb, cat: singular_copula}
        - {slot: poss_det, cat: possessive_determiner}
        - {slot: who, cat: animate, possessed: true}
    where:
      - owner_matches: {owner: poss_det, possessed: who}
    satisfies: {verb: [subject]}
    resolves:
      consumer: single-entity
      entity: "{who}"
      entity_owner: "{who.owner}"
      measure: year
      verb: "{verb}"
      evidence_temporal_perspective: "{verb.surface}"
      evidence_measure_category: age_measure

  - id: ask/how-old-is-explicitly-possessed
    # Apostrophe-s possession is already one owner-qualified noun unit, so it
    # must not take the separate determiner licensed by the preceding sibling.
    # Keeping the two phrase shapes separate prevents doubled owners such as
    # "their Mary's teacher" while preserving "Mary's teacher".
    match:
      question:
        - {lit: how}
        - {lit: old}
        - {slot: verb, cat: singular_copula}
        - {slot: who, cat: animate, possessed: true}
    satisfies: {verb: [subject]}
    resolves:
      consumer: single-entity
      entity: "{who}"
      entity_owner: "{who.owner}"
      measure: year
      verb: "{verb}"
      evidence_temporal_perspective: "{verb.surface}"
      evidence_measure_category: age_measure

  - id: ask/how-many-years-old-is
    # Unit-explicit age question: "how many years old is Rachel?" It resolves
    # the same `year` measure as the shorter "how old" form. Their literal
    # word order keeps the rules separate.
    match:
      question:
        - {lit: how}
        - {lit: many}
        - {lit: years}
        - {lit: old}
        - {slot: verb, cat: copula}
        - {slot: who, type: name}
    where:
      - number_compatible: [who, verb]
    satisfies: {verb: [subject]}
    resolves:
      consumer: single-entity
      entity: "{who}"
      measure: year
      verb: "{verb}"
      evidence_temporal_perspective: "{verb.surface}"
      evidence_measure_category: age_measure

  - id: ask/how-old-will-be-projected
    # Projected age question: "how old will Rachel be in 8 years?" or
    # "after 8 years?" The consumer adds the counted offset to Rachel's
    # current age. The preposition category covers both wordings.
    match:
      question:
        - {lit: how}
        - {lit: old}
        - {slot: aux, cat: future_modal}
        - {slot: who, type: name}
        - {lit: be}
        - {slot: prep, cat: age_projection_preposition}
        - {slot: n, cat: age_measure, counted: true}
    resolves:
      consumer: age-projected
      entity: "{who}"
      offset: "{n.value}"
      # constitution rule 1: the DATA measure the stated-age rule commits
      # to, read by the age-projected consumer from query["measure"] —
      # never a hardcoded Python literal, exactly as ask/how-old-is does.
      measure: year
      evidence_temporal_perspective: present
      evidence_measure_category: age_measure

  - id: ask/how-old-will-be-projected-from-now
    # Projected-age form with a trailing anchor: "how old will Rachel be
    # 8 years from now?" It uses the same age-plus-offset consumer.
    match:
      question:
        - {lit: how}
        - {lit: old}
        - {slot: aux, cat: future_modal}
        - {slot: who, type: name}
        - {lit: be}
        - {slot: n, cat: age_measure, counted: true}
        - {lit: from}
        - {lit: now}
    resolves:
      consumer: age-projected
      entity: "{who}"
      offset: "{n.value}"
      measure: year
      evidence_temporal_perspective: present
      evidence_measure_category: age_measure

  - id: ask/how-many-unit-dimension-is
    # Unit-qualified dimension question: "how many inches tall is Jake?"
    # The adjective identifies a dimension frame and the stated unit selects
    # the exact measure. Do not add a unit-less sibling such as "how tall is
    # Jake?" An elided measure can confuse physical dimensions with duration
    # or other meanings; requiring the unit makes the rule safe.
    match:
      question:
        - {lit: how}
        - {lit: many}
        - {slot: item, cat: dimension_difference_measure, number: plural}
        - {slot: adj, cat: unit_dimension_adjective}
        - {slot: verb, cat: singular_copula}
        - {slot: who, type: name}
    where:
      - attribute_compatible: {attribute: adj, noun: item}
    resolves:
      consumer: single-entity
      entity: "{who}"
      measure: "{item}"
      verb: "{verb}"

  - id: ask/is-membership
    # `at_start` marks this 'is' as the FRONTED AUXILIARY, and it is load-bearing
    # grammar, not tuning. English inverts subject and auxiliary to ask ("IS Mary
    # a student?"), so here the subject FOLLOWS the copula — which is the only
    # reason `is <name> <noun>` reads a membership question at all.
    #
    # An EMBEDDED DECLARATIVE leaves the copula in place ("...that Jim is a
    # Knicks player"), so its subject PRECEDES it. Unanchored, this shape floated
    # onto that construction and bound the complement's proper-noun modifier
    # ('Knicks') as the member, dropping the real subject entirely — answering
    # about the Knicks a question asked about Jim. Two grammars, one token run.
    match:
      question:
        - {lit: is, at_start: true}
        # blocks_skipped: an INDEFINITE article before the member marks an
        # existential ("Is a Czech a spy?"), never a reference. The
        # `indefinite_article` category lives in the scratch logic pack
        # ONLY, so every benchmark registry is a no-op by construction.
        - {slot: member, type: name, blocks_skipped: indefinite_article}
        - {lit: a, consume_skipped: true}
        - {slot: coll, type: noun, number: singular}
    where:
      - slot_not_category: {slot: coll, cat: non_quantity_holder}
      - slot_not_category: {slot: coll, cat: timeperiod}
    resolves:
      consumer: membership-verdict
      member: "{member}"
      # `.qualified` (patterns._slot_value): the full modifier+head phrase,
      # falling back to the bare lemma for a plain noun — a qualified
      # question ("Is Rex a CHOCOLATE dog?") queries the qualified fact key
      # and can never be satisfied by the bare-head fact alone.
      collection: "{coll.qualified}"
    generation:
      slot_categories:
        coll: [a_article_membership_predicate]

  - id: ask/how-many-capacity
    # Purchase capacity question: "how many pens can Mary buy with £10?"
    # The consumer divides a budget by a unit price, so the verb must be in
    # the narrow `purchase` category. Do not widen it to every verb or to the
    # broader `acquire` category: reading, receiving, earning, or merely
    # having an item does not imply that money was spent.
    match:
      question:
        - {lit: how}
        - {lit: many}
        - {slot: item, type: plural}
        - {slot: modal, cat: capacity_modal}
        - {slot: who, type: entity, common_noun_cat: quantity_event_participant, referential: true, bare_reference_category: bare_entity_reference}
        - {slot: verb, cat: purchase, bare_form: true}
        - opt:
            - {lit: with}
            - {slot: budget, cat: currency_measure, counted: true}
    where:
      - slot_not_category: {slot: item, cat: many_incompatible_noun}
      - verb_roles_compatible:
          verb: verb
          roles: {actor: [who], theme: [item]}
          allow_proper_name: [who]
    resolves:
      consumer: capacity
      entity: "{who}"
      item: "{item}"
      budget_value: "{budget.value}"
    generation:
      slot_categories:
        item: [transferable_quantity_object]

  - id: ask/how-many-partition
    match:
      question:
        - {lit: how}
        - {lit: many}
        - {slot: item, type: plural}
        - {slot: verb, cat: plural_copula}
        - {slot: attr, type: adjective}
    where:
      - attribute_compatible: {attribute: attr, noun: item}
      - slot_not_category: {slot: attr, cat: remnant_adj}
    resolves:
      consumer: partition-complement
      item: "{item}"
      attribute: "{attr}"
      negated: "false"

  - id: ask/what-percentage-sequential-partition
    match:
      question:
        - {lit: what, at_start: true}
        - {lit: percentage}
        - {lit: of}
        - {lit: the, consume_skipped: true}
        - {slot: collection, cat: sequential_partition_population, number: plural}
        - {slot: verb, cat: sequential_partition_verb}
        - {slot: prep, cat: sequential_partition_preposition}
        - {slot: destination, cat: sequential_partition_destination, number: plural, qualified: true}
    resolves:
      consumer: partition-percentage
      collection: "{collection}"
      attribute: "{destination.qualified}"

  - id: ask/how-many-sequential-partition
    # Direct count question for one named destination in a staged population
    # partition: "How many of the students enrolled in science courses?"
    # The destination must remain a qualified phrase, so the bare and
    # underspecified "enrolled in courses" shape does not select a subset.
    match:
      question:
        - {lit: how, at_start: true}
        - {lit: many}
        - opt:
            - {lit: of}
            - {lit: the, consume_skipped: true}
        - {slot: collection, cat: sequential_partition_population, number: plural}
        - {slot: verb, cat: sequential_partition_verb}
        - {slot: prep, cat: sequential_partition_preposition}
        - {slot: destination, cat: sequential_partition_destination, qualified: true}
    resolves:
      consumer: partition-complement
      item: "{collection}"
      attribute: "{destination.qualified}"
      negated: "false"

  - id: ask/how-many-partition-negated
    match:
      question:
        - {lit: how}
        - {lit: many}
        - {slot: item, type: plural}
        - {slot: verb, cat: plural_copula}
        - {lit: not}
        - {slot: attr, type: adjective}
    where:
      - attribute_compatible: {attribute: attr, noun: item}
    resolves:
      consumer: partition-complement
      item: "{item}"
      attribute: "{attr}"
      negated: "true"

  - id: ask/how-many-attribute-partition-in-place
    # Prenominal partition question: "how many grey cats are in this house?"
    # The adjective and noun have already merged into one `qualified` unit,
    # so `item.qualifier` supplies the attribute. A qualified noun also fits
    # the general in-place rule; this rule's id intentionally sorts first so
    # the attribute is preserved. An unqualified noun cannot match here.
    match:
      question:
        - {lit: how}
        - {lit: many}
        - {slot: item, type: qualified}
        - {slot: verb, cat: plural_copula}
        - {slot: prep, cat: spatial_location_preposition}
        - {slot: place, cat: quantity_location, referential: true}
    where:
      - attribute_compatible: {attribute: prep, noun: place}
      - absent: {cat: deictic_temporal_marker}
    resolves:
      consumer: partition-complement
      item: "{item}"
      attribute: "{item.qualifier}"
      negated: "false"

  - id: ask/how-many-attribute-partition-there
    # Entity-less qualified partition: "how many grey cats are there?" As
    # above, the rule id sorts before the bare "there" rule so the modifier
    # is preserved.
    match:
      question:
        - {lit: how}
        - {lit: many}
        - {slot: item, type: qualified}
        - {slot: verb, cat: plural_copula}
        - {lit: there}
    where:
      - absent: {cat: spatial_goal_preposition}
    resolves:
      consumer: partition-complement
      item: "{item}"
      attribute: "{item.qualifier}"
      negated: "false"

  - id: ask/how-many-of-collection-are-label
    # Partitive label question: "how many of the children are girls?" The
    # collection is consumed as sentence structure; the label is the measure
    # to resolve for one unique holder. Complement labels may come from a
    # synthesized partition fact. The verb must be copular because this is a
    # membership statement, not a general action.
    match:
      question:
        - {lit: how}
        - {lit: many}
        - {lit: of}
        - {slot: collection, type: noun, number: plural}
        - {slot: verb, cat: plural_copula}
        - {slot: label, cat: complement_membership_label, number: plural}
    resolves:
      consumer: unique-entity
      measure: "{label}"
      collection: "{collection}"

  - id: ask/how-many-more-goal-need
    match:
      question:
        - {lit: how}
        - {lit: many}
        - {slot: dir, cat: count_quantity_delta}
        - {slot: item, type: plural}
        - {slot: aux, type: future_modal}
        - {slot: who, type: name}
        - {slot: verb, cat: direct_quantity_goal_predicate, bare_form: true}
    where:
      - number_compatible: [who, aux]
      - slot_not_category: {slot: item, cat: many_incompatible_noun}
    resolves:
      consumer: deficit
      entity: "{who}"
      measure: "{item}"

  - id: ask/how-much-more-goal-need-purpose
    # Monetary goal deficit with an explicit purchase purpose: "how much more
    # money does Dena need to buy the shoes?" The target must match the
    # target retained by the Goal fact. Committed contributions are included;
    # unrelated gifts and unrelated savings goals are not.
    match:
      question:
        - {lit: how}
        - {lit: much}
        - {slot: dir, cat: mass_quantity_delta}
        - {slot: item, cat: currency}
        - {slot: aux, type: future_modal}
        - {slot: who, type: name}
        - {slot: need, cat: direct_quantity_goal_predicate, bare_form: true}
        - {lit: to}
        - {slot: buy, cat: purchase, bare_form: true}
        - {lit: the, consume_skipped: true}
        - {slot: target, cat: ownable_quantity_object, generation_all_numbers: true}
    where:
      - number_compatible: [who, aux]
    resolves:
      consumer: deficit
      entity: "{who}"
      measure: "{item}"
      target: "{target}"
      include_contributions: "true"

  - id: ask/how-much-money-entity-left
    # Remaining-money question: "how much money does Ian have left?" The
    # consumer subtracts Ian's priced purchases from one stated holding. The
    # verb must describe a state, because an event total is not a valid
    # starting balance. The optional "in UNIT" phrase requires the result to
    # use that currency unit. The word "left" makes this more specific than a
    # plain money-holding question.
    match:
      question:
        - {lit: how}
        - {lit: much}
        - {lit: money}
        - opt:
            - {lit: in}
            - {slot: req_unit, type: noun}
        # Accept ordinary and will/would forms, but not capacity modals.
        - {slot: aux, type: future_modal}
        - {slot: who, type: entity, common_noun_cat: quantity_holder, referential: true, bare_reference_category: bare_entity_reference}
        - {slot: verb, cat: remaining_balance_state, bare_form: true}
        - {lit: left}
    where:
      - number_compatible: [who, aux]
    resolves:
      consumer: money-left
      entity: "{who}"
      measure: currency
      req_unit: "{req_unit}"
    generation:
      slot_categories:
        req_unit: [currency_measure]

  - id: ask/how-much-change
    # Change question: "how much change did Ana get back?" The consumer
    # subtracts priced purchases from the tendered amount. Any unpriced or
    # split-cost purchase makes it decline. The answer does not depend on
    # whether the question says get, receive, or take, so the verb remains
    # general; "back" is optional.
    match:
      question:
        - {lit: how}
        - {lit: much}
        - {lit: change}
        - {slot: aux, type: future_modal}
        - {slot: who, type: entity, common_noun_cat: quantity_event_participant, referential: true, bare_reference_category: bare_entity_reference}
        - {slot: verb, cat: change_receipt_verb, bare_form: true}
        - opt:
            - {lit: back}
    where:
      - number_compatible: [who, aux]
    resolves:
      consumer: change
      entity: "{who}"

  - id: ask/how-much-item-cost
    # "how much do/does/did ITEM cost" — the item-SUBJECT cost ask (mining
    # candidate item-cost-asks): the item is the grammatical subject of
    # 'cost' itself, never a name (there is no `who` slot at all), so this
    # can never collide with the how-much-noun-entity family ("how much
    # money does Tom have"), which needs item, THEN aux, THEN a name, THEN
    # a general verb — a different token order entirely. The verb is
    # gated to the EXISTING `price_verb` category (cost/costs, increment
    # 15) rather than the general `verb` type, so an unrelated "how much
    # do the shirts weigh" never reaches the item-cost consumer.
    match:
      question:
        - {lit: how}
        - {lit: much}
        - {slot: aux, type: auxiliary}
        - {slot: item, type: noun, referential: true}
        - {slot: verb, cat: price_verb, bare_form: true}
    where:
      - number_compatible: [item, aux]
    resolves:
      consumer: item-cost
      item: "{item}"

  - id: ask/how-much-pay-for-quantity
    # Cost for a stated quantity: "how much did Ana pay for 4 shirts?" The
    # consumer multiplies the question's count by the item's unique price and
    # checks cost-splitting constraints. `spend_target_prep` is limited to
    # "for" and "on" so a time-span question such as "pay in 3 months" is
    # not misrouted.
    #
    # The subjectless form "how much does it cost to buy 4 shirts?" remains
    # unsupported because the noun and verb readings of "cost" are ambiguous
    # in that structure.
    match:
      question:
        - {lit: how}
        - {lit: much}
        # Accept ordinary and will/would forms, but not capacity modals.
        - {slot: aux, type: future_modal}
        - {slot: who, type: name}
        - {slot: verb, cat: spend_verb, bare_form: true}
        - {slot: prep, cat: spend_target_prep}
        - {slot: qty, type: counted}
    resolves:
      consumer: cost-of-quantity
      entity: "{who}"
      item: "{qty}"
      qty_value: "{qty.value}"

  - id: ask/how-much-each-item-cost
    # Unit-price question with "each". When no individual Price fact exists,
    # the consumer recovers the unit price from the stated purchase total.
    # The required "each" keeps this separate from a direct item-cost lookup.
    match:
      question:
        - {lit: how}
        - {lit: much}
        - {slot: aux, type: auxiliary}
        - {lit: each}
        - {slot: item, type: noun, number: singular}
        - {slot: verb, cat: price_verb, bare_form: true}
    where:
      - number_compatible: [item, aux]
    resolves:
      consumer: unit-price-from-total
      item: "{item}"

  - id: ask/what-is-the-cost-of-quantity
    # Cost question with a stated quantity: "what is the cost of 2 pans?"
    # The consumer recovers the unit price from the purchase total, then
    # multiplies it by `qty_value`.
    match:
      question:
        - {lit: what}
        - {slot: be, cat: singular_copula}
        - {lit: cost}
        - {lit: of}
        - {slot: qty, type: counted}
    resolves:
      consumer: unit-price-from-total
      item: "{qty}"
      qty_value: "{qty.value}"

  - id: ask/what-total-combined
    # Copular total question: "what is the total number of books that they
    # have?" The frame noun and trailing pronoun clause are optional. Named
    # or counted subjects need other rules with explicit holder binding. If
    # the verb is omitted, the combined consumer defaults to "have".
    match:
      question:
        - {lit: what}
        - {slot: be, cat: singular_copula}
        - {lit: the, consume_skipped: true}
        - {lit: total}
        - {slot: agg_noun, cat: count_aggregate_noun}
        - {lit: of}
        - {slot: item, type: plural}
        - opt:
            - opt:
                - {lit: that}
            - {slot: who, cat: discourse_subject_group_pronoun}
            - {slot: verb, cat: possession_state}
        - {lit: '?', consume_skipped: true}
    where:
      - slot_not_category: {slot: item, cat: many_incompatible_noun}
      - number_compatible: [who, verb]
    satisfies: {be: [subject]}
    resolves:
      consumer: combined
      measure: "{item}"
      verb: "{verb}"

  - id: ask/what-total-combined-contracted
    # Contracted form of the preceding rule. The tokenizer keeps "'s" as its
    # own token rather than resolving it as a state verb. Matching it literally
    # here avoids widening the shared `state` category for every other rule.
    match:
      question:
        - {lit: what}
        - {lit: "'s"}
        - {lit: the, consume_skipped: true}
        - {lit: total}
        - {lit: number}
        - {lit: of}
        - {slot: item, type: plural}
        - opt:
            - opt:
                - {lit: that}
            - {slot: who, cat: discourse_subject_group_pronoun}
            - {slot: verb, cat: possession_state}
        - {lit: '?', consume_skipped: true}
    where:
      - slot_not_category: {slot: item, cat: many_incompatible_noun}
      - number_compatible: [who, verb]
    resolves:
      consumer: combined
      measure: "{item}"
      verb: "{verb}"

  - id: ask/what-average-combined
    # Average form of the preceding total question. It enumerates at least
    # two holders, sums their values, and divides by the holder count. The
    # literal "average" keeps it separate from "total". Weighted averages
    # and per-unit rates decline because they do not provide the required set
    # of per-holder quantities.
    match:
      question:
        - {lit: what}
        - {slot: be, cat: singular_copula}
        - {lit: the, consume_skipped: true}
        - {lit: average}
        - {slot: agg_noun, cat: aggregate_noun}
        - {lit: of}
        - {slot: item, type: plural}
        - opt:
            - opt:
                - {lit: that}
            - {slot: who, cat: clause_subject_personal_pronoun}
            - {slot: verb, cat: quantity_ask_verb, finite_form: true}
    where:
      - number_compatible: [who, verb]
      - slot_not_category: {slot: item, cat: many_incompatible_noun}
      - slot_not_category: {slot: item, cat: aggregate_noun}
      - verb_roles_compatible:
          verb: verb
          roles: {theme: [item]}
          allow_unbound_trigger: true
    resolves:
      consumer: average
      measure: "{item}"
      verb: "{verb}"

  - id: ask/what-average-combined-contracted
    # Same class as ask/what-average-combined, for the "what's" contraction
    # — mirrors ask/what-total-combined-contracted's own rationale for why
    # this needs a separate ask id rather than widening 'state' to admit
    # the literal "'s" token.
    match:
      question:
        - {lit: what}
        - {lit: "'s"}
        - {lit: the, consume_skipped: true}
        - {lit: average}
        - {slot: agg_noun, cat: aggregate_noun}
        - {lit: of}
        - {slot: item, type: plural}
        - opt:
            - opt:
                - {lit: that}
            - {slot: who, cat: clause_subject_personal_pronoun}
            - {slot: verb, cat: quantity_ask_verb, finite_form: true}
    where:
      - number_compatible: [who, verb]
      - slot_not_category: {slot: item, cat: many_incompatible_noun}
      - slot_not_category: {slot: item, cat: aggregate_noun}
      - verb_roles_compatible:
          verb: verb
          roles: {theme: [item]}
          allow_unbound_trigger: true
    resolves:
      consumer: average
      measure: "{item}"
      verb: "{verb}"

  - id: ask/imperative-combined-dimension
    # Imperative dimension total: "calculate their combined height" or
    # "determine the combined weight of the three". `dimension_noun` names
    # a dimension rather than a unit, so `dimension_measure` resolves the
    # compatible measure from the facts. The optional cardinal supplies an
    # expected holder count. "combined" is literal so this rule cannot be
    # confused with the average form below.
    match:
      question:
        - {slot: verb, cat: compute_verb}
        - opt:
            - {slot: who, type: pronoun}
        - {lit: combined}
        - {slot: item, cat: dimension_noun}
        - opt:
            - {lit: of}
            - {lit: the, consume_skipped: true}
            - {slot: n, type: number}
        - opt:
            # Capture the article-less cardinal tail only to reject it below;
            # otherwise the general floating matcher could accept the valid
            # prefix and silently ignore "of 5".
            - {lit: of}
            - {slot: bare_n, type: number}
    where:
      - unbound: [bare_n]
    resolves:
      consumer: combined
      measure: "{item}"
      dimension_measure: "true"
      holder_count: "{n.value}"
    generation:
      omit_slots: [bare_n]

  - id: ask/imperative-single-dimension
    # Imperative single-holder dimension: "calculate the age of Arden".
    # `dimension_noun` names the dimension while `dimension_measure` asks the
    # single-entity consumer to resolve the compatible concrete measure from
    # Arden's facts (for age, normally `year`).  This is intentionally a
    # separate rule from the combined/average asks: no aggregate word is
    # present and exactly one explicit holder is selected.  The optional
    # coordinated tail is captured only so the consumer can decline it rather
    # than answering a prefix about the first holder.
    match:
      question:
        - {slot: cue, cat: compute_verb}
        - {lit: the, consume_skipped: true}
        - {slot: item, cat: dimension_noun}
        - {lit: of}
        - {slot: who, type: entity, common_noun_cat: quantity_event_participant, referential: true, bare_reference_category: bare_entity_reference}
        - opt:
            - {lit: and}
            - {slot: other, type: entity, common_noun_cat: quantity_event_participant, referential: true, bare_reference_category: bare_entity_reference}
    resolves:
      consumer: single-entity
      entity: "{who}"
      measure: "{item}"
      dimension_measure: "true"
      other_entity: "{other}"
    generation:
      omit_slots: [other]

  - id: ask/imperative-average-dimension
    # Average counterpart to the preceding imperative total rule. The literal
    # "average" selects the average consumer and prevents overlap with
    # "combined".
    match:
      question:
        - {slot: verb, cat: compute_verb}
        - opt:
            - {slot: who, cat: possessive_determiner}
        - {lit: average}
        - {slot: item, cat: dimension_noun}
        - opt:
            - {lit: of}
            - {lit: the, consume_skipped: true}
            - {slot: n, type: number}
        - opt:
            - {lit: of}
            - {slot: bare_n, type: number}
    where:
      - unbound: [bare_n]
      - mutually_exclusive: [who, n]
    resolves:
      consumer: average
      measure: "{item}"
      dimension_measure: "true"
      holder_count: "{n.value}"
    generation:
      omit_slots: [bare_n]

  - id: ask/how-long-is-total-dimension
    # Total-duration question: "how long is the total tape?" `long` is a
    # literal here and resolves through `time_measure`. Do not add it to the
    # general dimension-adjective category: without an explicit duration
    # context it can mean physical length or experience. The required "total"
    # authorizes summing the duration holders. `item` only consumes the head
    # noun; it is not used as the measure.
    match:
      question:
        - {lit: how}
        - {lit: long}
        - {slot: verb, cat: singular_copula}
        - {lit: the, consume_skipped: true}
        - {lit: total}
        - {slot: item, cat: duration_total_subject}
    resolves:
      consumer: combined
      measure: time_measure
      dimension_measure: "true"
      verb: "{verb}"
