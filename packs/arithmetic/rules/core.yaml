      text ("...twice as much as Ana") fails that rule's own `item` slot
      and only this rule survives; conversely, a text WITH an item noun
      present ("...twice as much MONEY as Ana") satisfies affine-times-
      as-much's `item` slot with 'money' and this rule's own trailing
      `{lit: as}` would then have to match the token 'money' itself, which
      fails ('money' is noun-sensed, never the particle 'as') — the two
      spans never tie. `who`/`std, type: name`: unwidened, matching
      arithmetic/times-as-much-elided's own (not-yet-widened) slot type.
      PROVEN minimal pair on unmodified main: "Ben has 250 dollars less
      than twice as much as Ana. Ana has 600 dollars. How much money does
      Ben have?" declines outright even though the identical AFFINE ratio
      under the count-noun 'as many' frame (arithmetic/affine-times-as-
      many) already answers correctly on a parallel text.
    match:
