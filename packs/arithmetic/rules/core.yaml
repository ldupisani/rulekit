  - id: arithmetic/affine-times-as-many-possessive-standard
    phase: read
    description: >
      mining candidate affine-nominal-relations: "Ben has 50 more than
      twice Ana's money" — the AFFINE-PREFIXED sibling of arithmetic/
      times-as-many-possessive-standard (the general possessive-NP
      standard, "Carmela has twice Cecil's money"), one offset field over
      exactly like arithmetic/affine-times-as-much sits beside arithmetic/
      times-as-much. `std, type: possessed` (see times-as-many-possessive-
      standard's own comment for the full owner/measure-read mechanism —
      an ACTUAL "OWNER's NOUN" merge, never a bare common noun) sits
      directly after the multiplier, same as its non-affine sibling.
      Structurally disjoint from every 'as many'/'as much' sibling in this
      file: those all require a literal 'as' immediately after the
      multiplier (or after an item noun that itself follows the
      multiplier), and 'as' can never satisfy `std, type: possessed` (a
      possessive merge, never particle-sensed) — vice versa, a possessed
      NP directly after `k` can never satisfy any of those rules' own
      'as'-anchored continuations, so the spans never tie. `who, type:
      name`: unwidened, matching times-as-many-possessive-standard's own
      (not-yet-widened) slot type. The possessive standard is a count
      quantity NP and therefore requires declared plural morphology; the
      mass-noun sibling below owns singular mass standards. Its verb is a
      possession state because the
      possessed standard denotes the owner's holding, not an unrelated event
      performed by the subject. The additive direction is quantity-only, and
      the multiplier must be non-unit: English does not use adverbial "once"
      directly before this possessive NP. PROVEN minimal pair on unmodified main:
