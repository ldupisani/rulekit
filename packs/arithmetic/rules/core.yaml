        entity: "{who}"
        measure: "{item1}"
        measure_qualifier: "{item1.qualifier}"
        value: "item1"
        verb: "{verb}"
      - fact: quantity
        entity: "{who}"
        measure: "{item1}"
        measure_qualifier: "{item1.qualifier}"
        value: "k * item1"
        verb: "{verb}"
