format: rulekit/rules@1
rules:
- id: arithmetic/absent-proportion
  independent_clause: true
  question_assumption: true
  match:
    sentence:
    - {slot: fraction, type: fraction, at_start: true}
    - opt:
      - {lit: of, consume_skipped: true}
      - {slot: members, cat: person, uncounted: true, number: plural}
    - {slot: be, cat: plural_copula, finite_form: true}
    - {slot: state, cat: absent_status}
    - {lit: ., consume_skipped: true}
  satisfies: {be: [subject]}
  consumes: [fraction, members, be, state]
  emits:
  - {fact: batch_evidence, kind: absent-share, entity: '', measure: '{members.optional}', value: fraction, position: '{fraction.span_start}'}
  disambiguates: [members, be, state]
- id: arithmetic/present-location-proportion
  independent_clause: true
  question_assumption: true
  match:
    sentence:
    - {slot: fraction, type: fraction, at_start: true}
    - {lit: of, consume_skipped: true}
    - {slot: members, cat: person, uncounted: true, number: plural}
    - {lit: who, consume_skipped: true}
    - {slot: be, cat: plural_copula, finite_form: true}
    - {slot: state, cat: present_status}
    - {slot: cop, cat: plural_copula, finite_form: true}
    - {lit: in, consume_skipped: true}
    - {slot: place, cat: activity_location, uncounted: true, bare: true}
    - {lit: ., consume_skipped: true}
  satisfies: {be: [subject], cop: [subject]}
  consumes: [fraction, members, be, state, cop, place]
  emits:
  - {fact: batch_evidence, kind: located-present-share, entity: '', measure: '{members}', value: fraction, position: '{fraction.span_start}',
    container: '{place}'}
  disambiguates: [members, be, state, cop, place]
- id: arithmetic/located-remainder-of-population
  independent_clause: true
  question_assumption: true
  match:
    sentence:
    - {slot: rest, cat: partition_remnant, uncounted: true, bare: true, at_start: true}
    - {slot: be, cat: plural_copula, finite_form: true}
    - {lit: in, consume_skipped: true}
    - {slot: place, cat: activity_location, uncounted: true, bare: true}
    - {lit: ., consume_skipped: true}
  satisfies: {be: [subject]}
  consumes: [rest, be, place]
  emits:
  - {fact: batch_evidence, kind: located-present-rest, entity: '', measure: '', value: 0, position: '{rest.span_start}', container: '{place}'}
  disambiguates: [rest, be, place]
- id: arithmetic/located-share-of-present-members
  independent_clause: true
  question_assumption: true
  match:
    sentence:
    - {slot: fraction, type: fraction, at_start: true}
    - {lit: of, consume_skipped: true}
    - {slot: members, cat: person, uncounted: true, qualified: true, qualifier_cat: present_status}
    - {slot: be, cat: plural_copula, finite_form: true}
    - {lit: in, consume_skipped: true}
    - {slot: place, cat: activity_location, uncounted: true, bare: true}
    - {lit: ., consume_skipped: true}
  satisfies: {be: [subject]}
  consumes: [fraction, members, be, place]
  emits:
  - {fact: batch_evidence, kind: located-present-share, entity: '', measure: '{members}', value: fraction, position: '{fraction.span_start}',
    container: '{place}'}
  disambiguates: [members, be, place]
asks:
- id: ask/located-present-subgroup-count
  match:
    question:
    - {lit: how, consume_skipped: true, at_start: true}
    - {lit: many, consume_skipped: true}
    - {slot: members, cat: person, uncounted: true, number: plural}
    - {slot: be, cat: plural_copula, finite_form: true}
    - {lit: in, consume_skipped: true}
    - {slot: place, cat: activity_location, uncounted: true, bare: true}
    - {lit: '?', consume_skipped: true}
  satisfies: {be: [subject]}
  resolves: {consumer: located-subgroup, measure: '{members}', place: '{place}'}
  disambiguates: [members, be, place]
