asks:
- id: ask/elected-adjusted-hourly-rate
  match:
    question:
    - lit: how
      consume_skipped: true
    - slot: much
      cat: mass_amount_quantifier
    - slot: aux
      type: auxiliary
    - slot: who
      type: entity
      common_noun_cat: intentional_agent
      referential: true
    - slot: earn
      cat: income_action
    - lit: per
      consume_skipped: true
    - slot: unit
      cat: duration_measure
      uncounted: true
      bare: true
    - lit: if
      consume_skipped: true
    - slot: same
      type: entity
      common_noun_cat: intentional_agent
      referential: true
    - slot: decide
      cat: decision_action
    - lit: to
      consume_skipped: true
    - slot: earn2
      cat: income_action
    - slot: bonus
      cat: bonus_noun
      uncounted: true
      bare: true
    - lit: '?'
      consume_skipped: true
  resolves:
    consumer: adjusted-unit-rate
    entity: '{who}'
    other: '{same}'
    unit: '{unit}'
  satisfies:
    earn:
    - subject
    decide:
    - subject
    earn2:
    - subject
  disambiguates:
  - much
  - earn
  - unit
  - decide
  - earn2
  - bonus
- id: ask/adjusted-hourly-rate
  match:
    question:
    - lit: how
      consume_skipped: true
    - slot: much
      cat: mass_amount_quantifier
    - slot: aux
      type: auxiliary
    - slot: who
      type: entity
      common_noun_cat: intentional_agent
      referential: true
    - slot: earn
      cat: income_action
    - lit: per
      consume_skipped: true
    - slot: unit
      cat: duration_measure
      uncounted: true
      bare: true
    - lit: with
      consume_skipped: true
    - slot: bonus
      cat: bonus_noun
      uncounted: true
      bare: true
    - lit: '?'
      consume_skipped: true
  resolves:
    consumer: adjusted-unit-rate
    entity: '{who}'
    unit: '{unit}'
  satisfies:
    earn:
    - subject
  disambiguates:
  - much
  - earn
  - unit
  - bonus
