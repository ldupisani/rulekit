- id: ask/mixture-percentage
  match:
    question:
    - lit: what
      at_start: true
    - slot: percent
      cat: mixture_percentage_noun
    - lit: of
    - slot: source
      cat: mixture_substance
      uncounted: true
    - opt:
      - lit: in
      - slot: holder
        cat: measurement_container
        referential: true
    - slot: copula
      cat: singular_copula
    - slot: component
      cat: mixture_component
      uncounted: true
    - opt:
      - lit: by
      - slot: basis
        cat: mixture_basis
        uncounted: true
    - lit: '?'
      consume_skipped: true
  resolves:
    consumer: mixture-component
    result: percentage
    component: '{component}'
    source: '{source}'
    entity: '{holder}'
    quantity_basis: '{basis}'
- id: ask/mixture-count-component
  match:
    question:
    - lit: how
      at_start: true
    - lit: many
    - slot: component
      cat: discrete_mixture_component
      number: plural
    - slot: copula
      cat: present_copula
    - lit: in
    - slot: source
      cat: mixture_substance
      uncounted: true
    - opt:
      - lit: in
      - slot: holder
        cat: measurement_container
        referential: true
    - lit: '?'
      consume_skipped: true
  resolves:
    consumer: mixture-component
    component: '{component}'
    source: '{source}'
    entity: '{holder}'
    required_dimension: count
