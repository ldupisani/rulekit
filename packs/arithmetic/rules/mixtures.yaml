        cat: measurement_container
        referential: true
    - {slot: verb, cat: plain_have_state, finite_form: true}
    - {slot: share, type: percent}
    - {slot: composition, cat: container_contents_noun, uncounted: true, qualified: true, qualifier_cat:
        mixture_component}
