- id: arithmetic/fraction-of-owned-holding-spent
  independent_clause: true
  match:
    sentence:
    - slot: who
      type: entity
      common_noun_cat: collection_agent
      referential: true
      at_start: true
    - slot: spend
      cat: personal_holding_depletion
      finite_form: true
    - slot: fraction
      type: fraction
      fraction_within_whole: true
    - lit: of
    - opt:
      - slot: owner
        cat: possessive_determiner
    - slot: item
      cat: ownable_quantity_object
      uncounted: true
      possessed: true
      number: plural
    - opt:
      - slot: prep
        cat: spend_target_prep
      - slot: purpose
        cat: ownable_quantity_object
        uncounted: true
        referential: true
        bare_reference_category: bare_pp_object
    - lit: .
