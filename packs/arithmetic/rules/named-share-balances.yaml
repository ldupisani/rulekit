    measure: '{unit}'
  satisfies:
    remain:
    - subject
    with:
    - object
    who:
    - refers
  where: []
- id: ask/named-share-left-over
  match:
    question:
    - lit: how
      at_start: true
    - lit: many
    - opt:
      - slot: unit
        cat: ownable_quantity_object
        uncounted: true
        number: plural
        bare: true
    - slot: modal
      cat: future_modal
    - slot: who
      type: entity
      common_noun_cat: quantity_holder
      referential: true
    - slot: have
      cat: plain_have_state
      bare_form: true
    - slot: left
      cat: remnant_adj
    - opt:
      - slot: particle
        cat: residual_completion_particle
    - lit: '?'
