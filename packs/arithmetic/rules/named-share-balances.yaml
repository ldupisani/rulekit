  emits:
  - fact: batch_evidence
    kind: ratio-withdrawal
    entity: '{who}'
    measure: '{item}'
    value: fraction
    position: '{fraction.span_start}'
    acquisition: '{item.owner}'
  consumes:
  - spend
  - fraction
  satisfies:
    spend:
    - subject
  where:
  - number_compatible:
    - who
    - spend
  question_assumption: true
  description: A fractional withdrawal explicitly names the same holder’s possessed resource.
asks:
- id: ask/named-share-remainder
  match:
    question:
    - lit: how
      at_start: true
    - lit: many
    - slot: modal
      cat: future_modal
    - slot: who
      type: entity
      common_noun_cat: quantity_holder
      referential: true
    - slot: remain
      cat: remainder_state_verb
      bare_form: true
    - slot: with
      cat: residual_complement_link
    - lit: '?'
      consume_skipped: true
  resolves:
    consumer: ratio-holder-remainder
    entity: '{who}'
    measure: ''
  satisfies:
    remain:
    - subject
    with:
    - object
  where: []
- id: ask/named-share-remainder-unit
