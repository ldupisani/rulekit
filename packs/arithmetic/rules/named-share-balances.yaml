  description: An ordered ratio compares the holdings of the first holder with the second, with the repeated possession clause elided.
- id: arithmetic/joint-holder-elided-count
  independent_clause: true
  description: A plural holder group states its combined count. An omitted resource must be recovered from one preceding ordered ratio.
  question_assumption: true
  match:
    sentence:
    - slot: group
      cat: discourse_subject_group_pronoun
      at_start: true
    - slot: have
      cat: plain_have_state
      finite_form: true
    - slot: amount
      type: number
      standalone: true
      integer: true
      value_min: 0
    - slot: total_prep
      cat: group_total_preposition
    - slot: total
      cat: group_total_marker
    - lit: .
      consume_skipped: true
  emits:
  - fact: batch_evidence
    kind: ratio-pool
    entity: ''
    measure: ''
    value: amount
    position: '{amount.span_start}'
    container: '{group.surface}'
  consumes:
  - have
  - amount
  satisfies:
    group:
    - refers
    have:
    - subject
    amount:
    - quantifies
    total_prep:
    - object
  where:
  - number_compatible:
    - group
    - have
- id: arithmetic/joint-holder-resource-count
  independent_clause: true
  description: A plural holder group states its combined count. An omitted resource must be recovered from one preceding ordered ratio.
  question_assumption: true
  match:
    sentence:
    - slot: group
      cat: discourse_subject_group_pronoun
