format: rulekit/rules@1
rules:
- id: arithmetic/material-fabrication-context
  description: An explicit participant and material govern subsequent cut regions; the intended product is not
    another measured removal.
  match:
    sentence:
    - {slot: who, type: entity, common_noun_cat: resource_user, referential: true, bare: true, at_start: true}
    - {slot: aux, cat: copula}
    - {slot: cut, cat: region_cutting_verb, present_participle: true}
    - {slot: material, cat: material_resource, uncounted: true, bare: true}
    - opt:
      - {lit: to}
      - {slot: make, cat: commercial_production_verb, bare_form: true}
      - {slot: product, cat: fabrication_product, uncounted: true}
    - opt:
      - {lit: for}
      - {slot: purpose, cat: fabrication_product, uncounted: true}
    - {lit: ., consume_skipped: true}
  where: [number_compatible: [who, aux], mutually_exclusive: [make, purpose]]
  consumes: [aux, cut, make]
  emits:
  - {fact: region_evidence, stage: context, material: '{material}', entity: '{who}', shape: '', dimension: '',
      value: 0, unit: '', position: '{who.uid}', quantity: ''}
- id: arithmetic/material-stock-dimensions
  description: A rectangular stock has two explicit linear measurements, including an unrolled sheet or roll.
  match:
    sentence:
    - opt:
      - {slot: stock, cat: material_stock_unit, uncounted: true, number: singular}
      - {lit: of}
    - {slot: material, cat: material_resource, uncounted: true, bare: true}
    - {slot: be, cat: copula}
    - {slot: first, cat: length_unit, counted: true}
    - {lit: by}
    - {slot: second, cat: length_unit, counted: true}
    - {lit: ., consume_skipped: true}
  where: [number_compatible: [material, be]]
  satisfies: {be: [subject]}
  consumes: [first, second, be]
  emits:
  - {fact: region_evidence, stage: opening, material: '{material}', entity: '', shape: rectangle, dimension:
      length, value: first, unit: '{first}', position: '{first.uid}', quantity: ''}
  - {fact: region_evidence, stage: opening, material: '{material}', entity: '', shape: rectangle, dimension:
      width, value: second, unit: '{second}', position: '{first.uid}', quantity: ''}
- id: arithmetic/cut-measured-region
  description: A cut rectangle preserves both unit-labelled dimensions and any explicit material or purpose
    location.
  match:
    sentence:
    - {slot: who, type: entity, common_noun_cat: resource_user, referential: true, bare: true}
    - {slot: cut, cat: region_cutting_verb, finite_form: true}
    - {slot: first, cat: length_unit, counted: true}
    - {lit: by}
    - {slot: second, cat: rectangular_shape, counted: true, qualified: true, qualifier_cat: length_unit,
        number: singular}
    - opt: [lit: of, {slot: material, cat: material_resource, uncounted: true, bare: true}]
    - opt: [lit: for, {slot: place, cat: quantity_location, uncounted: true}]
  where: [number_compatible: [who, cut]]
  consumes: [first, second, cut]
  emits:
  - {fact: region_evidence, stage: removal, material: '{material.optional}', entity: '{who}', shape: '{second}',
    dimension: length, value: first, unit: '{first}', position: '{first.uid}', quantity: ''}
  - {fact: region_evidence, stage: removal, material: '{material.optional}', entity: '{who}', shape: '{second}',
    dimension: width, value: second, unit: '{second.qualifier}', position: '{first.uid}', quantity: ''}
- id: arithmetic/cut-measured-region-continuation
  description: A coordinated cut list preserves each rectangle as a distinct removal; its actor needs a
    same-sentence anchor.
  match:
    sentence:
    - {lit: and}
    - {slot: first, cat: length_unit, counted: true}
    - {lit: by}
    - {slot: second, cat: rectangular_shape, counted: true, qualified: true, qualifier_cat: length_unit,
        number: singular}
    - opt: [lit: of, {slot: material, cat: material_resource, uncounted: true, bare: true}]
    - opt: [lit: for, {slot: place, cat: quantity_location, uncounted: true}]
  consumes: [first, second]
  emits:
  - {fact: region_evidence, stage: removal, material: '{material.optional}', entity: '', shape: '{second}',
      dimension: length, value: first, unit: '{first}', position: '{first.uid}', quantity: ''}
  - {fact: region_evidence, stage: removal, material: '{material.optional}', entity: '', shape: '{second}',
      dimension: width, value: second, unit: '{second.qualifier}', position: '{first.uid}', quantity: ''}
  where:
  - preceding_verb_category: {slot: first, cat: measured_resource_removal_verb}
- id: arithmetic/measured-removal-2d
  match:
    sentence:
    - opt:
      - {slot: rectangular, cat: rectangular_attribute}
    - {slot: region, cat: rectangular_shape, uncounted: true, number: singular}
    - opt:
      - {lit: of}
      - {slot: material, cat: material_resource, uncounted: true, bare: true}
    - opt:
      - {slot: measuring, cat: material_stock_state, present_participle: true}
    - {slot: first, cat: length_unit, counted: true}
    - {lit: by}
    - {slot: second, cat: length_unit, counted: true}
    - {slot: be, cat: singular_copula}
    - {slot: remove, cat: region_removal_verb, past_participle: true}
    - opt:
      - {lit: out}
    - {lit: ., consume_skipped: true}
  emits:
  - {fact: region_evidence, stage: removal, material: '{material.optional}', entity: '', shape: rectangle,
      dimension: length, value: first, unit: '{first}', position: '{first.uid}', quantity: '', source_scope:
      opening}
  - {fact: region_evidence, stage: removal, material: '{material.optional}', entity: '', shape: rectangle,
      dimension: width, value: second, unit: '{second}', position: '{first.uid}', quantity: '', source_scope:
      opening}
  consumes:
  - first
  - second
  - be
  - remove
  satisfies:
    be:
    - subject
    remove:
    - subject
- id: arithmetic/measured-removal-2d-shared-unit
  match:
    sentence:
    - opt:
      - {slot: rectangular, cat: rectangular_attribute}
    - {slot: region, cat: rectangular_shape, uncounted: true, number: singular}
    - opt:
      - {lit: of}
      - {slot: material, cat: material_resource, uncounted: true, bare: true}
    - opt:
      - {slot: measuring, cat: material_stock_state, present_participle: true}
    - {slot: first, type: number, standalone: true}
    - {lit: by}
    - {slot: second, cat: length_unit, counted: true}
    - {slot: be, cat: singular_copula}
    - {slot: remove, cat: region_removal_verb, past_participle: true}
    - opt:
      - {lit: out}
    - {lit: ., consume_skipped: true}
  emits:
  - {fact: region_evidence, stage: removal, material: '{material.optional}', entity: '', shape: rectangle,
      dimension: length, value: first, unit: '{second}', position: '{first.uid}', quantity: '', source_scope:
      opening}
  - {fact: region_evidence, stage: removal, material: '{material.optional}', entity: '', shape: rectangle,
      dimension: width, value: second, unit: '{second}', position: '{first.uid}', quantity: '', source_scope:
      opening}
  consumes:
  - first
  - second
  - be
  - remove
  satisfies:
    be:
    - subject
    remove:
    - subject
    first:
    - quantifies
