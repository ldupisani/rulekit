format: rulekit/rules@1
templates:
  allocation-question:
    parameters:
      head: []
      tail: []
      item: ''
      basis: ''
      unit: ''
      satisfies: {}
      disambiguates: []
    rule:
      match:
        question:
        - {parameter: head}
        - {parameter: tail}
        - {lit: '?', consume_skipped: true}
      satisfies: {parameter: satisfies}
      disambiguates: {parameter: disambiguates}
      resolves:
        consumer: uniform-content-distribution
        mode: forward
        item: {parameter: item}
        quantity: {parameter: basis}
        unit: {parameter: unit}
        recipient: '{group}'
rules:
- id: arithmetic/equal-resource-transfer-volume
  match:
    sentence:
    - {slot: who, type: entity, common_noun_cat: resource_user, referential: true, at_start: true}
    - {slot: transfer, cat: allocation_transfer_verb, finite_form: true}
    - {slot: amount, cat: volume_measure, counted: true}
    - {lit: of}
    - {slot: item, cat: material_resource, uncounted: true, bare: true}
    - {slot: equal, cat: equal_division_adverb}
    - {slot: prep, cat: allocation_target_preposition}
    - {slot: group, cat: allocation_recipient, counted: true, number: plural}
    - {lit: ., consume_skipped: true}
  emits:
  - {fact: batch_evidence, kind: allocation-pool, entity: '{who}', measure: '{item}', value: amount, container: '',
      marker: '{amount}', attribute: volume, position: '{amount.uid}'}
  - {fact: batch_evidence, kind: allocation-recipients, entity: '{who}', measure: '{item}', value: group, container: '{group}',
    marker: '', attribute: '', position: '{group.uid}'}
  consumes:
  - transfer
  - amount
  - group
  where:
  - number_compatible:
    - who
    - transfer
  - verb_role_compatible:
      verb: transfer
      roles:
      - item
      verb_cat: material_allocation_verb
      role_cat: material_resource
