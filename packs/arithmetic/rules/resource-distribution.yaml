variants: []
ask_variants:
- id: ask/equal-resource-allocation-count
  template: allocation-question
  arguments:
    head:
    - {lit: how, at_start: true}
    - {lit: many}
    - {slot: item, cat: ownable_quantity_object, uncounted: true, bare: true, number: plural}
    tail:
    - {slot: aux, cat: singular_auxiliary}
    - {slot: each, cat: distributive_quantifier}
    - {slot: group, cat: allocation_recipient, uncounted: true, number: singular, bare: true}
    - {slot: receive, cat: allocation_receipt_verb, bare_form: true}
    item: '{item}'
    basis: count
    satisfies:
      each:
      - collection
      receive:
      - subject
    disambiguates: []
- id: ask/equal-resource-allocation-material
