format: rulekit/rules@1
templates:
  path-site-context:
    parameters:
      who:
      - {slot: who, cat: path_vehicle, bare: true, uncounted: true, referential: true, at_start: true}
    rule:
      phase: read
      description: Ordered route evidence with explicit checkpoints, distances and terminal boundaries.
      match:
        sentence:
        - {parameter: who}
        - opt:
          - {slot: cop, cat: copula}
        - {slot: travel, cat: path_travel_verb}
        - {lit: through}
        - {slot: site, cat: path_site, bare: true, uncounted: true}
        - {lit: with}
        - {lit: many}
        - {slot: points, cat: path_checkpoint, bare: true, uncounted: true}
        - {lit: ., consume_skipped: true}
      consumes: []
      satisfies: {}
      emits:
      - fact: indexed_path_evidence
        kind: context
        entity: '{who}'
        site: '{site}'
        checkpoint: '{points}'
  path-checkpoint-count:
    parameters:
      who:
      - {slot: who, cat: path_vehicle, bare: true, uncounted: true, referential: true}
    rule:
      phase: read
      description: Ordered route evidence with explicit checkpoints, distances and terminal boundaries.
      match:
        sentence:
        - opt:
          - {lit: after, at_start: true}
          - lit: a
            consume_skipped: true
          - {lit: while}
        - {parameter: who}
        - opt:
          - {slot: modal, type: modal}
        - {slot: travel, cat: path_travel_verb}
        - {lit: through}
        - {slot: route, cat: path_route, bare: true, uncounted: true}
        - {lit: that}
        - {slot: require, cat: path_requirement_verb}
        - opt:
          - {lit: total}
          - {lit: of}
        - {slot: points, cat: path_checkpoint, counted: true, bare: true}
        - {lit: ., consume_skipped: true}
      consumes:
      - points
      satisfies:
        require:
        - subject
        who:
        - refers
      emits:
      - fact: indexed_path_evidence
        kind: population
        entity: '{who}'
        route: '{route}'
        checkpoint: '{points}'
        value: points
