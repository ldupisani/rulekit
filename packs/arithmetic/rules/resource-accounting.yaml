format: rulekit/rules@1
templates:
  purchase-collection-context:
    parameters:
      collection_category: purchase_collection_noun
      collection_number: plural
    rule:
      phase: read
      description: >
        A complete progressive introduction names an activity and collection,
        not an additional completed purchase. Plural collections ("buying
        clothes", "purchasing items") and explicitly licensed mass collections
        ("buying stuff") share the same accounting contract. Every subsequent
        purchase must belong to that buyer and fit the collection. Counts,
        prices, specific items, and extra clauses are not discarded as context.
      match:
        sentence:
          - {slot: who, type: entity, common_noun_cat: animate, referential: true, bare: true, at_start: true}
          - {slot: aux, cat: copula, finite_form: true}
          - {slot: verb, cat: purchase, present_participle: true}
          - slot: collection
            cat: {parameter: collection_category}
            number: {parameter: collection_number}
            uncounted: true
            bare: true
            class_only: true
            blocks_skipped: article
          - {lit: '.', consume_skipped: true}
      where:
        - number_compatible: [who, aux]
      consumes: [aux, verb, collection]
      emits:
        - {fact: quantity_event_context, entity: '{who}', measure: '{collection}', verb: '{verb}', place: ''}
variants:
  - id: arithmetic/purchase-collection-context
    template: purchase-collection-context
  - id: arithmetic/purchase-mass-collection-context
    template: purchase-collection-context
    arguments:
      collection_category: mass_purchase_collection_noun
      collection_number: singular
rules:
  - id: arithmetic/uniform-price-purchase-lot
    description: >
      An actual counted purchase whose individual prices are explicitly equal.
      The price remains unknown; the count is not itself a payment or a rate.
      A closed purchase total may later determine that common unit price.
    match:
      sentence:
        - {slot: who, type: entity, common_noun_cat: animate, referential: true, bare: true, at_start: true}
        - opt:
            - {slot: addition, cat: additive_discourse_adverb}
        - {slot: verb, cat: purchase, finite_form: true}
        - {slot: item, cat: transferable_quantity_object, counted: true, value_min: 1, bare: true}
        - {lit: all}
        - {lit: at}
        - {slot: price, cat: price_anaphor, qualified: true, qualifier_cat: uniform_price_attribute, uncounted: true}
        - {lit: '.', consume_skipped: true}
    where:
      - number_compatible: [who, verb]
    consumes: [item, verb]
    emits:
      - fact: expenditure
        entity: '{who}'
        item: '{item}'
        verb: '{verb}'
        lot_measure: '{item}'
        lot_quantity: item
        lot_position: '{item.uid}'
        position: '{item.uid}'
        event: '{verb.uid}'
        uniform_price: true

  - id: arithmetic/resource-budget-opening
    phase: read
    description: >
      "A budget of $150" records an allocation phrase, independently of
      shopping, movement, or a separately stated holding. Grammatical
      attachment must establish the participant before accounting can use it.
    match:
      sentence:
        - {slot: account, cat: resource_budget_noun, referential: true}
        - {lit: of}
        - {slot: amount, cat: currency_measure, counted: true}
    consumes: [amount]
    emits:
      - fact: resource_allocation
        account: "{account}"
        owner: "{account.owner}"
        qualifier: "{account.qualifier}"
        head_span: "{account.span_start}"
        amount_span: "{amount.span_start}"
        measure: "{amount}"
        value: amount

  - id: arithmetic/resource-budget-amount-first
    phase: read
    description: >
      An amount before its account head, as in "a $150 budget", names the
      same allocation as "a budget of $150". Ownership and activity are
      attached separately; this phrase does not imply a purchase or payment.
    match:
      sentence:
        - {slot: amount, cat: currency_measure, counted: true}
        - {slot: account, cat: resource_budget_noun, uncounted: true}
    consumes: [amount]
    emits:
      - fact: resource_allocation
        account: "{account}"
        owner: "{account.owner}"
        amount_owner: "{amount.owner}"
        qualifier: "{account.qualifier}"
        head_span: "{account.span_start}"
        amount_span: "{amount.span_start}"
        measure: "{amount}"
        value: amount

  - id: arithmetic/resource-budget-remainder
    phase: read
    description: >
      A stated amount left from a budget closes that allocation. The account
      owner is preserved so another person's budget cannot be borrowed.
    match:
      sentence:
        - {slot: who, type: entity, common_noun_cat: animate, referential: true}
        - {slot: verb, cat: remaining_balance_state, finite_form: true}
        - {slot: amount, cat: currency_measure, counted: true}
        - {lit: left}
        - {lit: from}
        - opt:
            - {slot: possessor, cat: possessive_determiner}
        - {slot: account, cat: resource_budget_noun, referential: true}
        - {lit: ".", consume_skipped: true}
    where:
      - number_compatible: [who, verb]
    consumes: [amount, verb]
    emits:
      - fact: resource_balance
        entity: "{who}"
        account: "{account}"
        owner: "{account.owner}"
        qualifier: "{account.qualifier}"
        stage: closing
        measure: "{amount}"
        value: amount

asks:
  - id: ask/how-much-pay-for-item
    # Total purchase cost, not unit price. The budget residual requires one
    # opening, one closing balance, and exactly one unknown purchase cost.
    # A declared collective target can also total a complete purchase basket
    # with relative lot prices, without assuming an unstated budget.
    match:
      question:
        - {lit: how}
        - {lit: much}
        - {slot: aux, type: auxiliary}
        - {slot: who, type: entity, common_noun_cat: animate, referential: true}
        - {slot: verb, cat: spend_verb, bare_form: true}
        - {slot: prep, cat: spend_target_prep}
        - {slot: item, type: noun, referential: true, uncounted: true}
        - {lit: "?", consume_skipped: true}
    where:
      - number_compatible: [who, aux]
    resolves:
      consumer: budget-item-cost
      entity: "{who}"
      item: "{item}"
      qualifier: "{item.qualifier}"
    generation:
      slot_categories:
        item: [transferable_quantity_object]
