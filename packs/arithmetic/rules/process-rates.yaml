  match:
    sentence:
    - slot: who
      type: noun
      at_start: true
    - lit: of
    - slot: total
      cat: progress_measure
      counted: true
    - slot: verb
      cat: progressive_process_verb
    - lit: at
    - opt:
      - lit: the
        consume_skipped: true
      - slot: rate
        cat: rate_frame_noun
      - lit: of
    - slot: rate1
      cat: progress_measure
      counted: true
    - lit: per
    - slot: time1
      cat: duration_measure
      uncounted: true
    - lit: for
    - opt:
      - slot: poss
        cat: possessive_determiner
    - slot: first
      cat: progress_measure
      counted: true
      qualified: true
      qualifier_cat: initial_sequence_ordinal
    - lit: ','
      consume_skipped: true
    - lit: and
    - lit: then
    - slot: rate2
      cat: progress_measure
      counted: true
    - lit: per
    - slot: time2
      cat: duration_measure
      uncounted: true
    - slot: rest
      cat: process_remainder_adverb
    - lit: .
      consume_skipped: true
  where:
  - same_lemma:
    - total
    - rate1
    - first
    - rate2
  - same_lemma:
    - time1
    - time2
  - verb_roles_compatible:
      verb: verb
      roles:
        actor:
        - who
        theme:
        - total
      require_declared_frame: true
  satisfies:
    poss:
    - refers
  consumes:
  - total
  - rate1
  - rate2
  - first
  emits:
  - fact: batch_evidence
    kind: bounded-process
    position: '{who.span_start}'
    entity: '{who}'
    measure: '{total}'
    value: total
    per_member: rate1
    subtotal: first
    content_count: rate2
    container: '{time1}'
    verb: '{verb}'
- id: arithmetic/measured-process-interruption
  match:
    sentence:
    - opt:
      - {slot: device, cat: interruption_source_device, uncounted: true}
    - {slot: cause, type: noun, uncounted: true}
    - {slot: pause, cat: process_pause_verb, finite_form: true}
    - {slot: process, cat: process_pause_reference, uncounted: true}
    - {lit: for}
    - {slot: duration, cat: duration_measure, counted: true}
    - {lit: '.', consume_skipped: true}
  emits:
  - fact: batch_evidence
    kind: process-interruption
    entity: '{process}'
    measure: '{duration}'
    value: duration
    position: '{duration.span_start}'
    attribution: {predicate: pause, subject: process, reason: [cause, cause], reason_entities: [cause]}
  consumes: [pause, duration]
  satisfies: {pause: [subject]}
asks:
- id: ask/complete-process-duration
  match:
    question:
    - lit: how
    - slot: long
      cat: elapsed_extent_adjective
    - lit: ','
      consume_skipped: true
    - lit: in
    - slot: unit
      cat: duration_measure
    - lit: ','
      consume_skipped: true
    - slot: aux
      type: auxiliary
    - slot: dummy
      cat: impersonal_subject_pronoun
    - slot: take
      cat: elapsed_duration_verb
    - slot: inf
      cat: infinitival_marker
    - slot: verb
      cat: progressive_process_verb
      bare_form: true
    - slot: complete
      cat: completion_adverb
  resolves:
    consumer: bounded-process-duration
    measure: '{unit}'
    verb: '{verb}'
  satisfies:
    dummy:
    - refers
    inf:
    - object
- id: ask/complete-process-duration-count
  match:
    question:
    - lit: how
    - lit: many
    - slot: unit
      cat: duration_measure
    - slot: aux
      type: auxiliary
    - slot: dummy
      cat: impersonal_subject_pronoun
    - slot: take
      cat: elapsed_duration_verb
    - slot: inf
      cat: infinitival_marker
    - slot: verb
      cat: progressive_process_verb
      bare_form: true
    - slot: complete
      cat: completion_adverb
  resolves:
    consumer: bounded-process-duration
    measure: '{unit}'
    verb: '{verb}'
  satisfies:
    dummy:
    - refers
    inf:
    - object
# The spent-time construction selects active duration even without an adverb.
- id: ask/active-process-duration
  match:
    question:
    - {lit: how, at_start: true}
    - {lit: many}
    - {slot: unit, cat: duration_measure, uncounted: true}
    - {slot: be, cat: past_copula}
    - {slot: spent, cat: spend_verb}
    - opt:
      - {slot: emphasis, cat: active_duration_adverb}
    - {slot: verb, cat: progressive_process_verb, present_participle: true}
    - {lit: '?', consume_skipped: true}
  resolves: {consumer: bounded-process-duration, measure: '{unit}', verb: '{verb}', mode: active}
  satisfies: {be: [subject], spent: [subject, dobj], verb: [subject]}
- id: ask/cause-specific-process-delay
  match:
    question:
    - {lit: how, at_start: true}
    - {lit: many}
    - {slot: unit, cat: duration_measure, uncounted: true}
    - {lit: did}
    - {slot: reason, type: noun, uncounted: true}
    - {slot: pause, cat: process_pause_verb, bare_form: true}
    - {slot: process, cat: process_pause_reference, uncounted: true}
    - {lit: '?', consume_skipped: true}
  resolves: {consumer: bounded-process-duration, measure: '{unit}', mode: delay, reason: '{reason}', process: '{process}'}
  satisfies: {pause: [subject]}
