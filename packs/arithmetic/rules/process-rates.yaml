format: rulekit/rules@1
rules:
- id: arithmetic/bounded-process-rates
  phase: read
  description: An extent, a rate for its initial segment, and a rate for the
    exhaustive remainder. Preserve all source operands.
  match:
    sentence:
    - slot: who
      type: noun
      at_start: true
    - lit: ','
      consume_skipped: true
    - slot: total
      cat: progress_measure
      counted: true
    - lit: in
    - slot: extent
      cat: process_extent_attribute
    - lit: ','
      consume_skipped: true
    - slot: verb
      cat: progressive_process_verb
    - lit: at
    - opt:
      - lit: the
        consume_skipped: true
      - slot: rate
        cat: rate_frame_noun
      - lit: of
    - slot: rate1
      cat: progress_measure
      counted: true
    - lit: per
    - slot: time1
      cat: duration_measure
      uncounted: true
    - lit: for
    - opt:
      - slot: poss
        cat: possessive_determiner
    - slot: first
      cat: progress_measure
      counted: true
      qualified: true
      qualifier_cat: initial_sequence_ordinal
    - lit: ','
      consume_skipped: true
    - lit: and
    - lit: then
    - slot: rate2
      cat: progress_measure
      counted: true
    - lit: per
    - slot: time2
      cat: duration_measure
      uncounted: true
    - slot: rest
      cat: process_remainder_adverb
    - lit: .
      consume_skipped: true
  where:
  - same_lemma:
    - total
    - rate1
    - first
    - rate2
  - same_lemma:
    - time1
    - time2
  - verb_roles_compatible:
      verb: verb
      roles:
        actor:
        - who
        theme:
        - total
      require_declared_frame: true
  satisfies:
    poss:
    - refers
  consumes:
  - total
  - rate1
  - rate2
  - first
  emits:
  - fact: batch_evidence
    kind: bounded-process
    position: '{who.span_start}'
    entity: '{who}'
    measure: '{total}'
    value: total
    per_member: rate1
    subtotal: first
    content_count: rate2
    container: '{time1}'
    verb: '{verb}'
- id: arithmetic/bounded-process-rates-compact
  phase: read
  description: An extent, a rate for its initial segment, and a rate for the
    exhaustive remainder. Preserve all source operands.
  match:
    sentence:
    - slot: who
      type: noun
      at_start: true
    - lit: of
    - slot: total
      cat: progress_measure
      counted: true
    - slot: verb
      cat: progressive_process_verb
    - lit: at
    - opt:
      - lit: the
        consume_skipped: true
      - slot: rate
        cat: rate_frame_noun
      - lit: of
    - slot: rate1
      cat: progress_measure
      counted: true
    - lit: per
    - slot: time1
      cat: duration_measure
      uncounted: true
    - lit: for
    - opt:
      - slot: poss
        cat: possessive_determiner
    - slot: first
      cat: progress_measure
      counted: true
      qualified: true
      qualifier_cat: initial_sequence_ordinal
    - lit: ','
      consume_skipped: true
    - lit: and
    - lit: then
    - slot: rate2
      cat: progress_measure
      counted: true
    - lit: per
    - slot: time2
      cat: duration_measure
      uncounted: true
    - slot: rest
      cat: process_remainder_adverb
    - lit: .
      consume_skipped: true
  where:
  - same_lemma:
    - total
    - rate1
    - first
    - rate2
  - same_lemma:
    - time1
    - time2
  - verb_roles_compatible:
      verb: verb
      roles:
        actor:
        - who
        theme:
        - total
      require_declared_frame: true
  satisfies:
    poss:
    - refers
  consumes:
  - total
  - rate1
  - rate2
  - first
  emits:
  - fact: batch_evidence
    kind: bounded-process
    position: '{who.span_start}'
    entity: '{who}'
    measure: '{total}'
    value: total
    per_member: rate1
    subtotal: first
    content_count: rate2
    container: '{time1}'
    verb: '{verb}'
- id: arithmetic/measured-process-interruption
  match:
    sentence:
    - opt:
      - {slot: device, cat: interruption_source_device, uncounted: true}
    - {slot: cause, type: noun, uncounted: true}
    - {slot: pause, cat: process_pause_verb, finite_form: true}
    - {slot: process, cat: process_pause_reference, uncounted: true}
    - {lit: for}
    - {slot: duration, cat: duration_measure, counted: true}
    - {lit: '.', consume_skipped: true}
  emits:
  - fact: batch_evidence
    kind: process-interruption
    entity: '{process}'
    measure: '{duration}'
    value: duration
    position: '{duration.span_start}'
    attribution: {predicate: pause, subject: process, reason: [cause, cause], reason_entities: [cause]}
  consumes: [pause, duration]
  satisfies: {pause: [subject]}
- id: arithmetic/member-rated-capacity-work
  description: A named group works toward a stated capacity at a rate per participant.
  match:
    sentence:
    - {slot: members, span: true, enumeration_cat: name, enumeration_min_members: 2, at_start: true}
    - {slot: be, cat: plural_copula}
    - {slot: act, cat: batch_loading_activity, present_participle: true}
    - opt: [{lit: up}]
    - {slot: target, cat: progress_target_container, uncounted: true}
    - {lit: with}
    - {slot: capacity, cat: container_capacity_noun}
    - {lit: of}
    - {slot: total, cat: progress_load_unit, counted: true, class_only: true}
    - {lit: at}
    - opt:
      - {slot: rate, cat: rate_frame_noun}
      - {lit: of}
    - {slot: amount, cat: progress_load_unit, counted: true, class_only: true}
    - {lit: per}
    - {slot: period, cat: duration_measure, uncounted: true, bare: true}
    - {lit: per}
    - {slot: participant, cat: allocation_recipient, uncounted: true, bare: true, number: singular}
    - {lit: '.', consume_skipped: true}
  where: [{same_lemma: [total, amount]}]
  disambiguates: [act]
  consumes: [be, act, total, amount]
  satisfies: {be: [subject], act: [subject, dobj]}
  emits:
  - {fact: batch_evidence, kind: crew-process-target, entity: '{target}', measure: '{total}',
     value: total, per_member: amount, container: '{period}', members: '{members.members}',
     verb: '{act}', position: '{target.span_start}'}
- id: arithmetic/member-rated-workforce-expansion
  description: The original crew continues and additional participants join at the same individual rate.
  match:
    sentence:
    - {slot: group, cat: discourse_subject_group_pronoun, at_start: true}
    - {slot: act, cat: crew_activity, finite_form: true}
    - {lit: for}
    - {slot: span, cat: duration_measure, counted: true, bare: true}
    - {lit: and}
    - {slot: be, cat: plural_copula}
    - opt: [{lit: then}]
    - {slot: join, cat: crew_joining_verb, past_participle: true}
    - {lit: by}
    - {slot: others, cat: allocation_recipient, counted: true, class_only: true}
    - {lit: who}
    - opt: [{slot: also, cat: additive_discourse_adverb}]
    - {slot: continue, cat: crew_activity, finite_form: true}
    - {lit: at}
    - {slot: rate, cat: rate_frame_noun, qualified: true, qualifier_cat: uniform_quantity_attribute}
    - {lit: '.', consume_skipped: true}
  where: [{same_lemma: [act, continue]}]
  disambiguates: [act, continue]
  consumes: [act, span, be, join, others, continue]
  satisfies: {group: [refers], act: [subject], be: [subject], join: [subject], continue: [subject]}
  emits:
  - {fact: batch_evidence, kind: crew-process-expansion, entity: '', measure: '{span}', value: span,
     per_member: others, marker: '{group.surface}', position: '{span.span_start}'}
- id: arithmetic/elapsed-crew-expansion
  description: Additional participants join the ongoing process after an explicitly elapsed interval.
  match:
    sentence:
    - {lit: after, at_start: true}
    - {slot: span, cat: duration_measure, counted: true, bare: true}
    - opt: [{lit: ',', consume_skipped: true}]
    - {slot: others, cat: allocation_recipient, counted: true, class_only: true}
    - {slot: join, cat: crew_joining_verb, finite_form: true}
    - {slot: group, cat: discourse_referential_group_pronoun}
    - {lit: at}
    - {slot: rate, cat: rate_frame_noun, qualified: true, qualifier_cat: uniform_quantity_attribute}
    - {lit: '.', consume_skipped: true}
  where: [{number_compatible: [others, join]}]
  consumes: [span, others, join]
  satisfies: {group: [refers], join: [subject, dobj]}
  emits:
  - {fact: batch_evidence, kind: crew-process-expansion, entity: '', measure: '{span}', value: span,
     per_member: others, marker: '{group.surface}', position: '{span.span_start}'}
asks:
- id: ask/complete-process-duration
  match:
    question:
    - lit: how
    - slot: long
      cat: elapsed_extent_adjective
    - lit: ','
      consume_skipped: true
    - lit: in
    - slot: unit
      cat: duration_measure
    - lit: ','
      consume_skipped: true
    - slot: aux
      type: auxiliary
    - slot: dummy
      cat: impersonal_subject_pronoun
    - slot: take
      cat: elapsed_duration_verb
    - slot: inf
      cat: infinitival_marker
    - slot: verb
      cat: progressive_process_verb
      bare_form: true
    - slot: complete
      cat: completion_adverb
  resolves:
    consumer: bounded-process-duration
    measure: '{unit}'
    verb: '{verb}'
  satisfies:
    dummy:
    - refers
    inf:
    - object
- id: ask/complete-process-duration-count
  match:
    question:
    - lit: how
    - lit: many
    - slot: unit
      cat: duration_measure
    - slot: aux
      type: auxiliary
    - slot: dummy
      cat: impersonal_subject_pronoun
    - slot: take
      cat: elapsed_duration_verb
    - slot: inf
      cat: infinitival_marker
    - slot: verb
      cat: progressive_process_verb
      bare_form: true
    - slot: complete
      cat: completion_adverb
  resolves:
    consumer: bounded-process-duration
    measure: '{unit}'
    verb: '{verb}'
  satisfies:
    dummy:
    - refers
    inf:
    - object
# The spent-time construction selects active duration even without an adverb.
- id: ask/active-process-duration
  match:
    question:
    - {lit: how, at_start: true}
    - {lit: many}
    - {slot: unit, cat: duration_measure, uncounted: true}
    - {slot: be, cat: past_copula}
    - {slot: spent, cat: spend_verb}
    - opt:
      - {slot: emphasis, cat: active_duration_adverb}
    - {slot: verb, cat: progressive_process_verb, present_participle: true}
    - {lit: '?', consume_skipped: true}
  resolves: {consumer: bounded-process-duration, measure: '{unit}', verb: '{verb}', mode: active}
  satisfies: {be: [subject], spent: [subject, dobj], verb: [subject]}
- id: ask/cause-specific-process-delay
  match:
    question:
    - {lit: how, at_start: true}
    - {lit: many}
    - {slot: unit, cat: duration_measure, uncounted: true}
    - {lit: did}
    - {slot: reason, type: noun, uncounted: true}
    - {slot: pause, cat: process_pause_verb, bare_form: true}
    - {slot: process, cat: process_pause_reference, uncounted: true}
    - {lit: '?', consume_skipped: true}
  resolves: {consumer: bounded-process-duration, measure: '{unit}', mode: delay, reason: '{reason}', process: '{process}'}
  satisfies: {pause: [subject]}
- id: ask/targeted-process-duration
  match:
    question:
    - {lit: how, at_start: true}
    - {lit: many}
    - {slot: unit, cat: duration_measure, uncounted: true, bare: true}
    - {slot: aux, cat: do_support_auxiliary}
    - {slot: act, cat: batch_loading_activity, present_participle: true}
    - opt: [{lit: up}]
    - {slot: target, cat: progress_target_container, uncounted: true, referential: true}
    - {slot: take, cat: elapsed_duration_verb, bare_form: true}
    - {lit: '?', consume_skipped: true}
  resolves: {consumer: bounded-process-duration, mode: crew, measure: '{unit}', verb: '{act}', process: '{target}'}
  satisfies: {act: [subject, dobj], take: [subject]}
