    entity: ''
    measure: '{item}'
    value: 0
    position: '{people.span_start}'
    attribute: '{other}'
    members: '{people.members}'
    marker: '{both.optional}'
  satisfies:
    both: [collection]
    want:
    - subject
    buy:
    - subject
