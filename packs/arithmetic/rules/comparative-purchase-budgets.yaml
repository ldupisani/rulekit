asks:
- id: ask/relative-purchase-budget-conditional
  match:
    question:
    - lit: how
      at_start: true
    - lit: much
    - slot: modal
      type: modal
    - slot: who
      type: name
    - slot: budget
      cat: budget_action
    - lit: if
    - slot: ref
      cat: animate_pronoun
    - slot: want
      cat: finite_infinitival_goal_predicate
    - lit: to
    - slot: spend
      cat: spend_verb
    - slot: factor
      type: multiplier
    - lit: as
    - lit: much
    - lit: as
    - opt:
      - lit: what
    - slot: other
      type: name
    - slot: spent
      cat: spend_verb
    - opt:
      - slot: on
        cat: spend_target_prep
      - opt:
        - slot: lot
          cat: partitive_pair_measure
        - lit: of
      - slot: first
        cat: purchase_item
        uncounted: true
        bare: true
      - lit: and
      - slot: second
        cat: purchase_item
        uncounted: true
        bare: true
    - lit: '?'
      consume_skipped: true
  resolves:
    consumer: relative-purchase-budget
    entity: '{who}'
    other: '{other}'
    factor: '{factor.value}'
    first: '{first.optional}'
    second: '{second.optional}'
  satisfies:
    ref:
    - refers
    want:
    - subject
    spend:
    - subject
  where:
  - distinct:
    - who
    - other
