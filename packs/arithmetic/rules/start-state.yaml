format: rulekit/rules@1
# START-STATE ASKS: "How many cookies did he have IN THE BEGINNING?"
#
# "Paco ate 19 cookies and had 35 cookies left" folds to 35 + (-19) = 16. That is
# the correct answer to "how many does he have" and a CONFIDENT-WRONG for "how
# many did he have in the beginning" (54). The stated quantity is the END state;
# the question asks for the START, so the events must be UNDONE. The mechanism is
# `_entity_total(invert_events=True)` (answer.py) — a defaulted-off parameter on
# the shared fold, bound ONLY here.
#
# WHY A SEPARATE ASK RATHER THAN AN OPTIONAL TRAILING GROUP: the marker must be
# REQUIRED. `match_ask` ranks by consumed units first, so an ask that CONSUMES the
# marker outranks the base ask (ask/how-many-entity, 6 units) on exactly the
# questions that carry one, and cannot match anything else. An optional group
# would tie with the base ask on every question WITHOUT a marker and be settled by
# alphabetical id order — which encodes nothing.
#
# THE MARKERS ARE LITERALS, not a category, and that is forced rather than chosen:
# they span four parts of speech — 'before' (preposition), 'beginning' (noun),
# 'originally' (adverb), 'begin' (verb) — and a category roots at exactly ONE
# sense. Literals match on a token's fold regardless of POS. 'the' is auto-skipped
# (SKIPPABLE_SENSES), so "in THE beginning" is {lit: in}{lit: beginning}.
#
# SCOPE — this lands the ONE marker + ONE shape a confident-wrong proves. Adding a
# (base shape x marker) pair is a one-line data change here, and each new one is a
# new ask that must be gated: 9 GSM8K TEST items carry a question-position marker,
# and most are `if`-clause PREMISES ("If she had $36 in the beginning, how much
# did Andrea save?") which must NEVER match — they state a start, they do not ask
# for one. The shapes below cannot match those: an if-clause is split off as a
# premise before the ask is tried.
#
# The name-subject "originally" sibling is now licensed by a DEV-holdout
# regression exposed when the anaphoric multiplier premise began accounting
# for "twice as many" in a larger sentence. The ordinary base ask had ignored
# "originally" and returned the current anchor. Reusing the same event
# inversion is exact for this shape: the current state is known, and every
# same-entity event is represented.
#
# SOURCE-TRANSFER items are STILL NOT READ, and that is still deliberate —
# "Rachel picked 3 apples FROM HER TREE. Now the tree has 4." The tree holds NO
# event (the pick folds as rachel/apple/3), so there is nothing to undo and
# inverting returns the same wrong answer. Those need source-marked transfer, a
# different mechanism. Do not reach for this parameter to fix them.
#
# What CHANGED (this session): they no longer answer 4. The base asks
# (ask/how-many-entity-common-noun for "did the TREE have", ask/how-many-in-place
# for "were in the TANK") matched those questions and SILENTLY IGNORED the
# trailing marker — the identical bug this file was created to fix for "in the
# beginning", one shape over. The two shapes below consume the marker, and
# `_entity_total` now returns None when `invert_events` is set and the entity
# holds NO events: nothing to undo is not a start state, it is the current one.
# So they DECLINE. That is the honest outcome and the whole of what was bought;
# the reading itself is untouched and 7/19 stay unreachable.
#
# MEASURED before building (all six corpora, question-position markers): 336
# items carry one and 333 already DECLINE — the engine cannot read this family
# at all. The only two that committed were these, both wrong. So the shapes below
# can only convert a decline into a decline, or a WRONG into a decline. 'to begin
# with'/'to start with' have ZERO GSM8K TEST exposure (TEST carries only
# originally 4, in the beginning 2, at first 1, initially 2) — which is why these
# two markers, and not the others, are the ones that landed.
rules: []
asks:
  - id: ask/how-many-entity-start-state
    # ask/how-many-entity's slots, plus the required marker — but NOT a blind
    # copy of it, and the differences are all deliberate. An earlier version of
    # this ask claimed to "mirror it exactly" and did not; the constitution review
    # found the two confident-wrongs that claim was hiding. Each line below is
    # therefore justified against the base ask, not assumed from it.
    match:
      question:
        - {lit: how}
        - {lit: many}
        - {slot: item, type: plural}
        - {slot: aux, type: future_modal}
        - {slot: who, type: name}
        # `cat: state`, NOT the base ask's `type: verb`. The base ask binds
        # `verb: "{verb}"` and routes a non-state verb to the verb-SCOPED fold
        # ("how many grapes did Tomas EAT?" = 12, the eating). A start state is
        # by definition a STATE — "what did X HAVE before" — and this consumer
        # is only given the `have` fold, so accepting any verb here answered a
        # have-question for an eat-question ("...did Tomas eat in the beginning?"
        # committed 42, the have-fold, instead of 12). Gating the slot means such
        # a question never reaches this ask at all and falls through to the base
        # ask, which reads it correctly. All state verbs are one equivalence
        # class, so resolving them to `have` below is exact, not a flattening.
        - {slot: verb, cat: possession_state, bare_form: true}
        - {lit: in}
        - {lit: the, consume_skipped: true}
        - {lit: beginning}
    where:
      - number_compatible: [who, aux]
      - slot_not_category: {slot: item, cat: mass_quantity_noun}
    resolves:
      consumer: single-entity
      entity: "{who}"
      measure: "{item}"
      verb: have
      start_state: "true"
      # REQUIRED, and its absence was a confident-wrong: without it
      # `measure_qualifier` is permanently empty, the qualified-key retry is
      # skipped, and the consumer rolls up every variant — "how many RED grapes
      # did Tomas have in the beginning?" answered 36 (red + green) where the
      # same question WITHOUT the marker correctly answers 30. The base ask's own
      # comment forbids exactly that: a question naming one SPECIFIC variant must
      # never silently roll up every colour.
      measure_qualifier: "{item.qualifier}"
      # `sum_measure_variants` is DELIBERATELY NOT bound, unlike the base ask.
      # It routes to `_qualified_variant_total`, which does not know about
      # `invert_events` and would return an UN-inverted total — a wrong answer
      # wearing this ask's name. Opting out means a multi-variant start-state
      # question declines instead, which is the safe half of the trade. Binding
      # it requires threading the inversion through that helper first.

  - id: ask/how-many-entity-start-state-originally
    # The name-subject sibling above, with the single-token trailing marker
    # "originally". This must be a separate ask: the implemented
    # "in [the] beginning" marker has a different token shape, and optional
    # marker branches would tie the base ask on questions with no marker.
    # Every resolve field and safety boundary deliberately mirrors the
    # sibling: state verb only, exact item qualifier, event inversion, and
    # no variant roll-up.
    match:
      question:
        - {lit: how}
        - {lit: many}
        - {slot: item, type: plural}
        - {slot: aux, type: future_modal}
        - {slot: who, type: name}
        - {slot: verb, cat: possession_state, bare_form: true}
        - {lit: originally}
    where:
      - slot_not_category: {slot: item, cat: mass_quantity_noun}
      - number_compatible: [who, aux]
    resolves:
      consumer: single-entity
      entity: "{who}"
      measure: "{item}"
      verb: have
      start_state: "true"
      measure_qualifier: "{item.qualifier}"

  - id: ask/how-many-entity-common-noun-start-state
    # ask/how-many-entity-common-noun's slots + the required marker. Checked
    # against that ask LINE BY LINE, not copied — the sibling above carries the
    # scar from a "mirrors it exactly" claim that did not, and the review found
    # the two confident-wrongs the claim was hiding.
    #
    #   who, type: common_noun  — KEPT verbatim. The base ask's own comment
    #     explains why this is its own slot type rather than a widening of
    #     `type: name`, and none of that reasoning changes here.
    #   verb, cat: possession_state — CHANGED from the base ask's `type: verb`, for
    #     the same reason the sibling above changed it: a start state IS a state,
    #     and this consumer is only handed the `have` fold, so accepting any verb
    #     would answer a have-question for an eat-question. A non-state verb now
    #     falls through to the base ask, which reads it correctly.
    #   sum_measure_variants    — DELIBERATELY DROPPED (the base ask binds it).
    #     It routes to `_qualified_variant_total`, which knows nothing of
    #     `invert_events` and would return an UN-inverted total wearing this
    #     ask's name. A multi-variant start-state question declines instead.
    #   measure_qualifier       — KEPT, and required: without it the qualified
    #     retry is skipped and the consumer rolls up every variant ("how many RED
    #     grapes ... to begin with" answering red + green).
    match:
      question:
        - {lit: how}
        - {lit: many}
        - {slot: item, type: plural}
        - {slot: aux, type: future_modal}
        - {slot: who, type: common_noun}
        - {slot: verb, cat: possession_state, bare_form: true}
        - {slot: marker_link, cat: infinitival_marker}
        - {slot: marker, cat: start_marker_verb, bare_form: true}
        - {slot: marker_prep, cat: start_marker_preposition}
    where:
      - slot_not_category: {slot: item, cat: mass_quantity_noun}
      - slot_not_category: {slot: item, cat: many_incompatible_noun}
      - slot_not_category: {slot: who, cat: non_quantity_holder}
      - slot_not_category: {slot: who, cat: timeperiod}
      - number_compatible: [who, aux]
    satisfies:
      marker_link: [object]
      marker_prep: [object]
    resolves:
      consumer: single-entity
      entity: "{who}"
      measure: "{item}"
      verb: have
      start_state: "true"
      measure_qualifier: "{item.qualifier}"

  - id: ask/how-many-in-place-start-state
    # ask/how-many-in-place's slots + the required marker. Two of that ask's
    # three resolve-fields are deliberately NOT carried over, and both would have
    # been silent confident-wrongs:
    #
    #   place_fallback_entity: world — DROPPED. Its branch in the consumer calls
    #     `_entity_total` WITHOUT `invert_events`, so it would answer `world`'s
    #     CURRENT total under this ask's name. answer.py now also refuses that
    #     branch when `invert` is set, so this is belt AND braces — the field is
    #     dropped here because this ask has no business asking for it, and the
    #     consumer refuses it because prose does not enforce.
    #   sum_measure_variants — DROPPED, same reason as the sibling above.
    #   verb, cat: state — the base ask binds `type: verb` but RESOLVES `verb:
    #     have` regardless, which is exactly the mismatch the sibling's comment
    #     warns about: "how many fish did Maria EAT in the tank to start with"
    #     would be handed the have-fold. Gating the slot means it never reaches
    #     here. ("were in the tank" binds 'were' — a state verb — so the class
    #     this ships for is unaffected.)
    match:
      question:
        - {lit: how}
        - {lit: many}
        - {slot: item, type: plural}
        - {slot: verb, cat: plural_copula}
        - {slot: prep, cat: quantity_location_preposition}
        - {slot: place, cat: quantity_interior_location, referential: true}
        - {slot: marker_link, cat: infinitival_marker}
        - {slot: marker, cat: start_marker_verb, bare_form: true}
        - {slot: marker_prep, cat: start_marker_preposition}
    where:
      - number_compatible: [item, verb]
      - slot_not_category: {slot: item, cat: mass_quantity_noun}
      - slot_not_category: {slot: item, cat: many_incompatible_noun}
    satisfies:
      marker_link: [object]
      marker_prep: [object]
    resolves:
      consumer: single-entity
      entity: "{place}"
      measure: "{item}"
      verb: have
      start_state: "true"
      measure_qualifier: "{item.qualifier}"
