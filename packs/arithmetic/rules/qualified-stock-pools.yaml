- id: arithmetic/pooled-stock-shared-within-group
  phase: read
  match:
    sentence:
    - slot: group
      cat: discourse_subject_group_pronoun
      at_start: true
    - slot: combine
      cat: quantity_combination_verb
      finite_form: true
    - slot: all
      cat: group_total_quantifier
    - slot: item
      cat: inventory_item
      uncounted: true
      bare: true
    - opt:
      - lit: together
        consume_skipped: true
    - lit: and
      consume_skipped: true
    - slot: share
      cat: allocation_verb
      finite_form: true
    - slot: object
      cat: plural_object_pronoun
    - slot: equally
      cat: equal_division_adverb
    - lit: between
      consume_skipped: true
    - slot: self
      cat: plural_reflexive_reference
    - lit: .
      consume_skipped: true
  emits:
  - fact: batch_evidence
    kind: qualified-pool
    entity: ''
    measure: '{item}'
    value: 0
    position: '{item.span_start}'
  consumes:
  - combine
  - share
  satisfies:
    group:
    - refers
    combine:
    - subject
    share:
    - subject
    object:
    - refers
    self:
    - refers
    all:
    - collection
  question_assumption: true
  disambiguates:
  - combine
  - item
  - share
asks:
- id: ask/equal-pooled-stock-imperative
  match:
    question:
    - slot: compute
      cat: compute_verb
    - lit: the
      consume_skipped: true
    - slot: number
      cat: count_aggregate_noun
      uncounted: true
      bare: true
    - lit: of
      consume_skipped: true
    - slot: item
      cat: inventory_item
      uncounted: true
      bare: true
    - slot: each
      cat: postpositive_distributive_quantifier
    - slot: get
      cat: acquire
      finite_form: true
    - lit: .
      consume_skipped: true
  resolves:
    consumer: dependent-quantity-total
    operation: pool
    measure: '{item}'
  satisfies:
    each:
    - collection
    get:
    - subject
