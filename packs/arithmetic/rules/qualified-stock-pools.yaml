format: rulekit/rules@1
rules:
- id: arithmetic/coordinated-qualified-relative-stock-associated-fraction
  phase: read
  match:
    sentence:
    - slot: owner
      cat: possessive_determiner
      referential: true
    - slot: role
      cat: person
      uncounted: true
    - slot: who
      type: name
    - slot: have
      cat: possession_state
      finite_form: true
    - slot: factor
      type: fraction
    - opt:
      - lit: times
        consume_skipped: true
    - lit: as
      consume_skipped: true
    - lit: many
      consume_skipped: true
    - slot: first
      cat: inventory_item
      uncounted: true
      qualified: true
    - lit: as
      consume_skipped: true
    - slot: standard
      cat: anaphoric_person_subject
    - opt:
      - slot: have2
        cat: possession_state
        finite_form: true
    - lit: and
      consume_skipped: true
    - slot: factor2
      type: multiplier
    - lit: the
      consume_skipped: true
    - slot: number
      cat: count_aggregate_noun
      uncounted: true
      bare: true
    - lit: of
      consume_skipped: true
    - slot: second
      cat: inventory_item
      uncounted: true
      qualified: true
    - lit: .
      consume_skipped: true
  emits:
  - fact: batch_evidence
    kind: qualified-relative
    entity: '{who}'
    measure: '{first}'
    value: 0
    position: '{who.span_start}'
    container: '{standard}'
    fraction: factor
    attribute: '{first.qualifier}'
  - fact: batch_evidence
    kind: qualified-relative
    entity: '{who}'
    measure: '{second}'
    value: 0
    position: '{second.span_start}'
    container: '{standard}'
    fraction: factor2
    attribute: '{second.qualifier}'
  consumes:
  - have
  - have2
  - factor
  - factor2
  satisfies: {}
  bindings:
    have:
      subject: who
    have2:
      subject: standard
  references:
    standard: owner
  disambiguates:
  - role
  - have
  - first
  - have2
  - number
  - second
  generation: reader-only
  description: Requires an already resolved possessor; standalone generation cannot yet construct this
    antecedent context.
