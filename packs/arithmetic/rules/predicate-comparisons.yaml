rules:
  - id: arithmetic/located-group-activity-context
    phase: read
    description: An unquantified group activity on an excursion establishes context without inventing a count.
    match:
      sentence:
        - {lit: on}
        - {slot: occasion, cat: excursion_noun, uncounted: true}
        - {lit: to}
        - {slot: place, cat: quantity_site_location, uncounted: true}
        - {lit: ',', consume_skipped: true}
        - {slot: who, type: name, at_start: false}
        - {lit: and}
        - {slot: poss, cat: animate_possessive_determiner}
        - {slot: peers, cat: personal_relation_role, number: plural, uncounted: true}
        - {slot: verb, cat: quantity_comparison_verb, finite_form: true}
        - {slot: item, cat: transferable_quantity_object, uncounted: true}
        - {lit: ., consume_skipped: true}
    satisfies:
      poss: [refers]
      verb: [subject]
    emits:
      - {fact: quantity_event_context, entity: '{who}', measure: '{item}', verb: '{verb}', place: '{place}'}
