format: rulekit/rules@1
rules:
- id: arithmetic/explicit-equal-bill-division
  phase: read
  disambiguates: [split, equal]
  match:
    sentence:
    - slot: people
      cat: discourse_subject_group_pronoun
      at_start: true
    - opt:
      - slot: future
        type: future_modal
    - slot: split
      cat: equal_division_verb
      bare_form: true
    - slot: bill
      cat: shared_cost_noun
    - slot: equal
      cat: equal_division_adverb
    - opt:
      - {slot: prep, cat: allocation_distribution_preposition}
      - opt: [{lit: all}]
      - {slot: recipients, cat: account_payer, number: plural, uncounted: true, bare: true}
    - lit: .
      consume_skipped: true
  emits:
  - fact: batch_evidence
    kind: bill-division
    entity: ''
    measure: '{recipients.optional}'
    value: 0
    position: '{split.span_start}'
  bindings: {prep: {object: recipients}}
  satisfies:
    people:
    - refers
- id: arithmetic/equal-account-division-among-payers
  phase: read
  match:
    sentence:
    - {slot: bill, cat: shared_cost_noun, bare: true, uncounted: true, number: singular, at_start: true}
    - {slot: be, cat: singular_copula}
    - {slot: split, cat: equal_division_action, past_participle: true}
    - {slot: equal, cat: equal_division_adverb}
    - {slot: prep, cat: allocation_distribution_preposition}
    - opt: [{lit: all}]
    - {slot: payers, cat: account_payer, bare: true, uncounted: true, number: plural}
    - {lit: '.', consume_skipped: true}
  bindings: {be: {subject: bill}, prep: {object: payers}}
  satisfies: {split: [subject], prep: [anchor]}
  emits:
  - {fact: batch_evidence, kind: bill-division, entity: '', measure: '{payers}', value: 0, position: '{split.span_start}'}
- id: arithmetic/named-equal-account-division
  phase: read
  disambiguates: [split, equal]
  match:
    sentence:
    - {slot: payers, cat: account_payer, number: plural, uncounted: true, bare: true, at_start: true}
    - opt: [{slot: future, type: future_modal}]
    - {slot: split, cat: equal_division_verb, bare_form: true}
    - {slot: bill, cat: shared_cost_noun, uncounted: true, bare: true}
    - {slot: equal, cat: equal_division_adverb}
    - opt:
      - {slot: prep, cat: allocation_distribution_preposition}
      - opt: [{lit: all}]
      - {slot: recipients, cat: account_payer, number: plural, uncounted: true, bare: true}
    - {lit: '.', consume_skipped: true}
  bindings: {split: {subject: payers}, prep: {object: recipients}}
  emits:
  - {fact: batch_evidence, kind: bill-division, entity: '{payers}', measure: '{recipients.optional}', value: 0, position: '{split.span_start}'}
- id: arithmetic/equal-division-within-group
  phase: read
  disambiguates: [share, split, equal]
  match:
    sentence:
    - {slot: each, cat: distributive_quantifier, at_start: true}
    - {slot: group, cat: membership_collective, number: singular, uncounted: true, bare: true}
    - {slot: split, cat: equal_division_action, finite_form: true}
    - {slot: share_owner, cat: impersonal_possessive_reference}
    - {slot: share, cat: allocation_share_noun, uncounted: true}
    - {slot: equal, cat: equal_division_adverb}
    - {slot: prep, cat: allocation_distribution_preposition}
    - {slot: member_owner, cat: impersonal_possessive_reference}
    - {slot: members, cat: cohort_member, uncounted: true, number: plural}
    - {lit: '.', consume_skipped: true}
  where: [{number_compatible: [group, split]}]
  bindings: {each: {collection: group}, split: {subject: group}, prep: {object: members},
             share_owner: {refers: group}, member_owner: {refers: group}}
  emits:
  - {fact: batch_evidence, kind: within-group-division, entity: '{group}', measure: '{members}', value: 0, position: '{split.span_start}'}
- id: arithmetic/billed-service-charge
  match:
    sentence:
    - {slot: service, cat: billable_service, uncounted: true, at_start: true}
    - {slot: cost, cat: price_verb, finite_form: true}
    - {slot: amount, cat: currency_unit, counted: true}
    - {lit: '.', consume_skipped: true}
  emits:
  - fact: batch_evidence
    kind: account-base-charge
    entity: '{service}'
    measure: '{amount}'
    value: amount
    position: '{amount.span_start}'
  consumes: [cost, amount]
  satisfies: {cost: [subject, dobj]}
- id: arithmetic/itemized-supplementary-charge
  match:
    sentence:
    - {slot: who, type: entity, referential: true, at_start: true}
    - {slot: add, cat: collection_addition_quantity_verb, finite_form: true}
    - {slot: amount, cat: currency_unit, counted: true}
    - {slot: fee, cat: surcharge_noun, uncounted: true, qualified: true, qualifier_cat: surcharge_type}
    - opt:
      - {slot: marker, cat: explicit_cause_preposition}
      - {slot: reason, type: noun, uncounted: true}
    - {lit: '.', consume_skipped: true}
  emits:
  - fact: batch_evidence
    kind: account-additional-charge
    entity: '{who}'
    measure: '{amount}'
    value: amount
    position: '{amount.span_start}'
    container: '{fee.qualifier}'
    attribution: {predicate: add, actor: who, subject: fee, reason: [reason, reason], reason_entities: [reason]}
  consumes: [add, amount]
  satisfies: {add: [subject, dobj], marker: [anchor, object]}
asks:
- id: ask/equal-itemized-bill-group
  match:
    question:
    - lit: how
      at_start: true
    - lit: much
    - slot: modal
      type: future_modal
    - lit: each
    - lit: of
    - slot: group
      cat: discourse_referential_group_pronoun
    - slot: pay
      cat: payment_verb
    - lit: if
    - slot: people
      cat: discourse_referential_group_pronoun
    - opt:
      - slot: future
        type: future_modal
    - slot: split
      cat: equal_division_verb
      bare_form: true
    - slot: bill
      cat: shared_cost_noun
    - slot: equal
      cat: equal_division_adverb
    - lit: '?'
      consume_skipped: true
  resolves:
    consumer: shared-account-cost
    equal: 'true'
  satisfies:
    group:
    - refers
    people:
    - refers
    pay:
    - subject
- id: ask/stated-equal-bill-group
  match:
    question:
    - lit: how
      at_start: true
    - lit: much
    - slot: aux
      type: auxiliary
    - lit: each
    - lit: of
    - slot: group
      cat: discourse_group_pronoun
    - slot: pay
      cat: payment_verb
    - lit: '?'
      consume_skipped: true
  resolves:
    consumer: shared-account-cost
  satisfies:
    group:
    - refers
    pay:
    - subject
- id: ask/stated-equal-bill-group-modal
  match:
    question:
    - lit: how
      at_start: true
    - lit: much
    - slot: aux
      type: future_modal
    - lit: each
    - lit: of
    - slot: group
      cat: discourse_group_pronoun
    - slot: pay
      cat: payment_verb
    - lit: '?'
      consume_skipped: true
  resolves:
    consumer: shared-account-cost
  satisfies:
    group:
    - refers
    pay:
    - subject
- id: ask/itemized-charge-total
  match:
    question:
    - {lit: how, at_start: true}
    - {lit: much}
    - {slot: be, cat: copula}
    - {slot: account, cat: shared_cost_noun, uncounted: true}
    - {lit: '?', consume_skipped: true}
  resolves: {consumer: itemized-charge-total}
  satisfies: {be: [subject]}
- id: ask/itemized-charge-subtotal
  match:
    question:
    - {lit: how, at_start: true}
    - {lit: much}
    - {lit: of}
    - {slot: account, cat: shared_cost_noun, uncounted: true}
    - {slot: be, cat: copula}
    - {slot: attributed, cat: attribution_descriptor}
    - {lit: to}
    - {slot: charge, cat: surcharge_type, uncounted: true}
    - {lit: '?', consume_skipped: true}
  resolves: {consumer: itemized-charge-total, charge: '{charge}'}
  satisfies: {be: [subject]}
templates:
  payer-share-question:
    parameters:
      auxiliary: {slot: aux, type: auxiliary}
      condition: []
      division: {}
      obligations: {pay: [subject]}
    rule:
      match:
        question:
        - {lit: how, at_start: true}
        - {lit: much}
        - {parameter: auxiliary}
        - {lit: each}
        - {slot: person, cat: account_payer, number: singular, uncounted: true, bare: true}
        - opt:
          - {slot: membership, cat: cohort_membership_preposition}
          - {slot: cohort, cat: membership_collective, number: singular, uncounted: true, class_only: true, qualified: true, qualifier_cat: relative_holder_descriptor, all_qualifiers: true}
        - {slot: pay, cat: payment_verb, bare_form: true}
        - {parameter: condition}
        - {lit: '?', consume_skipped: true}
      resolves: {parameter: division}
      satisfies: {parameter: obligations}
  itemized-payer-list:
    parameters:
      group_category: account_payer
      context: []
      roster: []
      counts: [group]
      constraints: []
      bindings: {}
    rule:
      phase: read
      match:
        sentence:
        - {slot: group, cat: {parameter: group_category}, counted: true, bare: true, at_start: true}
        - {parameter: context}
        - {slot: order, cat: itemized_acquisition_verb, finite_form: true}
        - {slot: list, cat: list_introduction_marker}
        - {lit: ':', consume_skipped: true}
      where:
      - {number_compatible: [group, order]}
      - {parameter: constraints}
      bindings: {parameter: bindings}
      emits:
      - &payer_population {fact: batch_evidence, kind: bill-population, entity: '{group}', measure: '', value: group, position: '{group.span_start}'}
      - {parameter: roster}
      consumes: {parameter: counts}
      satisfies: {order: [subject]}
  itemized-price-quote:
    parameters:
      introduction:
      - {lit: [':', ';'], consume_skipped: true}
      - opt: [{lit: and}]
      population: []
      population_operands: []
      introduction_constraints: []
      ending:
      - opt:
        - cat: postpositive_distributive_quantifier
          slot: each
      pricing:
        quantity: count
        total: null
        unit: price
      quote:
      - cat: price_quote_participle
        present_participle: true
        slot: cost
      satisfaction:
        cost:
        - subject
        each:
        - collection
      subject:
        constraints: [{partitive_compatible: {measure: count, substance: item}}]
        item: '{item}'
        qualifier: '{item.qualifier}'
        tokens:
        - bare: true
          cat: purchase_count_measure
          counted: true
          slot: count
        - lit: of
        - cat: purchase_item
          slot: item
          uncounted: true
    rule:
      consumes:
      - count
      - price
      - {parameter: population_operands}
      description: An explicit itemized asking-price quote, with unit and
        whole-line prices kept distinct. Estimated values do not establish
        charges.
      emits:
      - {parameter: population}
      - basis: quote
        entity: ''
        event: '{count.uid}'
        fact: expenditure
        item:
          parameter: subject.item
        lot_measure: '{count}'
        lot_position: '{count.uid}'
        lot_quantity: count
        measure: '{price}'
        position: '{price.uid}'
        qualifier:
          parameter: subject.qualifier
        quantity:
          parameter: pricing.quantity
        quantity_position: '{count.uid}'
        unit_price:
          parameter: pricing.unit
        value:
          parameter: pricing.total
        verb: '{cost}'
      match:
        sentence:
        - parameter: introduction
        - parameter: subject.tokens
        - parameter: quote
        - bare: true
          cat: currency_unit
          counted: true
          slot: price
        - parameter: ending
      phase: read
      where:
      - {parameter: subject.constraints}
      - {parameter: introduction_constraints}
      satisfies:
        parameter: satisfaction
variants:
- id: arithmetic/itemized-order-population
  template: itemized-payer-list
- id: arithmetic/itemized-payer-groups-with-members
  template: itemized-payer-list
  arguments:
    context:
    - {slot: content_prep, cat: counted_content_preposition}
    - {slot: members, cat: cohort_member, counted: true, bare: true, class_only: true}
    - {slot: each, cat: postpositive_distributive_quantifier}
    bindings: {content_prep: {anchor: group, object: members}, each: {collection: group}}
    group_category: membership_collective
    counts: [group, members]
    roster:
    - {fact: quantity, entity: '{group}', measure: '{members}', value: members, verb: have, distributive: true}
- id: arithmetic/activity-itemized-account-population
  template: itemized-payer-list
  arguments:
    context:
    - {slot: activity, cat: purchase_context_activity, finite_form: true}
    - opt:
      - {slot: prep, cat: quantity_site_preposition}
      - {slot: site, cat: activity_site, uncounted: true}
    - {lit: and}
    constraints:
    - {number_compatible: [group, activity]}
    - verb_roles_compatible:
        verb: activity
        roles: {actor: [group]}
        frame_categories: [purchase_context_activity]
        require_declared_frame: true
    bindings: {activity: {subject: group}, prep: {object: site}}
- id: arithmetic/occasion-itemized-account-population
  template: itemized-payer-list
  arguments:
    context:
    - {slot: act, cat: activity_account_participation, finite_form: true}
    - {slot: occasion, cat: account_activity, uncounted: true, bare: true, number: singular}
    - opt:
      - {slot: prep, cat: quantity_site_preposition}
      - {slot: site, cat: activity_site, uncounted: true}
    - {lit: and}
    constraints:
    - {number_compatible: [group, act]}
    - verb_roles_compatible:
        verb: act
        roles: {activity: [occasion], actor: [group]}
        frame_categories: [activity_account_participation]
        require_declared_frame: true
    bindings: {act: {subject: group}, prep: {object: site}}
