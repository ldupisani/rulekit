  arguments:
    auxiliary: &future_auxiliary {slot: aux, type: future_modal}
    division: *payer_query
- id: ask/equal-itemized-bill-person
  template: payer-share-question
  arguments:
    condition: &pronoun_division
    - {lit: if}
    - {slot: people, cat: discourse_referential_group_pronoun}
    - opt: [{slot: future, type: future_modal}]
    - {slot: split, cat: equal_division_verb, bare_form: true}
    - {slot: bill, cat: shared_cost_noun, uncounted: true, bare: true}
    - {slot: equal, cat: equal_division_adverb}
    - opt:
      - {slot: prep, cat: allocation_distribution_preposition}
      - opt: [{lit: all}]
      - {slot: recipients, cat: account_payer, number: plural, uncounted: true, bare: true}
