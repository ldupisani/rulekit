    entity: '{who}'
    item: '{item}'
    stage: quoted
    measure: '{amount}'
    value: amount
    qualifier: '{item.qualifier}'
  consumes:
  - plan
  - buy
  - amount
  satisfies:
    aux:
    - subject
    plan:
    - subject
    buy:
    - subject
    cost:
    - subject
  where:
  - number_compatible:
    - item
    - cost
  - number_compatible:
    - who
    - plan
  - number_compatible:
    - who
    - aux
