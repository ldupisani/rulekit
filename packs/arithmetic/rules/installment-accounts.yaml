format: rulekit/rules@1
rules:
- id: arithmetic/planned-priced-purchase
  match:
    sentence:
    - slot: who
      type: entity
      common_noun_cat: intentional_agent
      referential: true
      at_start: true
    - slot: plan
      cat: purchase_plan_verb
      finite_form: true
    - lit: to
    - slot: buy
      cat: purchase
      bare_form: true
    - slot: item
      cat: ownable_quantity_object
      uncounted: true
      referential: true
    - lit:
      - which
      - that
    - slot: cost
      cat: price_verb
      finite_form: true
    - slot: amount
      cat: currency_unit
      counted: true
      bare: true
    - lit: .
      consume_skipped: true
  emits:
  - fact: purchase_endpoint
    entity: '{who}'
    item: '{item}'
    stage: quoted
    measure: '{amount}'
    value: amount
    qualifier: '{item.qualifier}'
  consumes:
  - plan
  - buy
  - amount
  satisfies:
    plan:
    - subject
    buy:
    - subject
    cost:
    - subject
  where:
  - number_compatible:
    - item
    - cost
  - number_compatible:
    - who
    - plan
- id: arithmetic/planned-priced-purchase-progressive
  match:
