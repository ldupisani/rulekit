asks:
- id: ask/projected-installment-balance
  match:
    question:
    - lit: how
      at_start: true
    - lit: much
    - slot: will
      cat: future_modal
    - slot: owner
      cat: possessive_determiner
    - slot: balance
      cat: balance_quantity_noun
      uncounted: true
    - slot: be
      cat: planning_state_auxiliary
      bare_form: true
    - lit: after
    - slot: pay
      cat: payment_verb
      present_participle: true
    - opt:
      - lit: for
    - slot: elapsed
      cat: duration_measure
      counted: true
      bare: true
      value_min: 0
    - lit: '?'
      consume_skipped: true
  resolves:
    consumer: installment-balance
    entity: '{balance.owner}'
    elapsed: '{elapsed.value}'
    period: '{elapsed}'
  satisfies:
    be:
    - subject
    pay:
    - subject
  where: []
- id: ask/projected-installment-balance-what
  match:
    question:
    - lit: what
      at_start: true
    - slot: will
      cat: future_modal
    - slot: owner
      cat: possessive_determiner
    - slot: balance
      cat: balance_quantity_noun
      uncounted: true
    - slot: be
      cat: planning_state_auxiliary
      bare_form: true
    - lit: after
    - slot: pay
      cat: payment_verb
      present_participle: true
    - opt:
      - lit: for
    - slot: elapsed
      cat: duration_measure
      counted: true
      bare: true
      value_min: 0
    - lit: '?'
      consume_skipped: true
  resolves:
