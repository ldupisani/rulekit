      counted: true
      bare: true
      value_min: 0
    - lit: of
    - slot: payments
      cat: periodic_payment_noun
      uncounted: true
      bare: true
      number: plural
    span_satisfies:
      be:
      - subject
- id: ask/projected-payment-balance-after-periods-what
  template: projected-payment-balance
  arguments:
    opener:
    - lit: what
      at_start: true
    payment_span:
    - slot: elapsed
      cat: duration_measure
      counted: true
      bare: true
      value_min: 0
    - lit: of
    - slot: payments
      cat: periodic_payment_noun
      uncounted: true
      bare: true
      number: plural
    span_satisfies:
      be:
      - subject
