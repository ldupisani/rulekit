        - {slot: referenceunit, cat: component_measure, bare: true, uncounted: true}
        - {lit: of}
        - {slot: reference, cat: component_material, bare: true, uncounted: true}
        - {lit: ., consume_skipped: true}
      consumes:
      - factor
      satisfies:
        make:
        - subject
        need:
        - subject
      emits:
      - fact: measured_component
        entity: '{who}'
        component: '{target}'
        measure: '{targetunit}'
        value: factor
        reference: '{reference}'
        reference_measure: '{referenceunit}'
        product: '{product.optional}'
