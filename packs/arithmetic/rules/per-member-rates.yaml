ask_variants:
  - id: ask/how-many-passive-per-period
    template: per-member-ask
  - id: ask/how-many-passive-period-span
    template: per-member-ask
    arguments:
      timing: &ask_span
        - {lit: in}
        - {slot: span, cat: duration_measure, counted: true, bare: true, value_min: 0}
  - id: ask/how-many-passive-daily
    template: per-member-ask
    arguments:
      selection: [frequency]
      timing: [{slot: frequency, cat: daily_frequency_adverb}]
      period: day
  - id: ask/how-many-passive-one-period-span
    template: per-member-ask
    arguments:
      timing: &ask_one_span
        - {lit: in}
        - {lit: [a, an], consume_skipped: true}
        - {slot: span, cat: duration_measure, number: singular, uncounted: true, bare: true}
      span_value: '1'
  - id: ask/how-many-active-per-period
    template: per-member-ask
    arguments:
      generation: &active_generation
        slot_categories: {who: [quantity_event_participant]}
      voice: &active_voice
        - {slot: aux, type: auxiliary}
        - opt:
            - {slot: all_members, cat: group_total_quantifier}
        - opt:
            - {slot: poss, cat: possessive_determiner}
        - {slot: who, type: noun, uncounted: true}
      voice_guards: &active_guards
        - bound_requires_type: {bound: all_members, slot: who, type: plural}
        - bound_requires_type: {bound: poss, slot: who, type: possessed}
        - number_compatible: [who, aux]
      roles: &active_roles {actor: [who], theme: [item]}
      verb: &active_verb {slot: verb, cat: quantity_event_verb, bare_form: true}
      entity: '{who}'
      subject_number: '{who.number}'
  - id: ask/how-many-active-daily
    template: per-member-ask
    arguments:
      selection: [frequency]
      generation: *active_generation
      voice: *active_voice
      voice_guards: *active_guards
      roles: *active_roles
      verb: *active_verb
      entity: '{who}'
      subject_number: '{who.number}'
      timing: [{slot: frequency, cat: daily_frequency_adverb}]
      period: day
  - id: ask/how-many-active-one-period-span
    template: per-member-ask
    arguments:
      generation: *active_generation
      voice: *active_voice
      voice_guards: *active_guards
      roles: *active_roles
      verb: *active_verb
      entity: '{who}'
      subject_number: '{who.number}'
      timing: *ask_one_span
      span_value: '1'
  - id: ask/how-many-future-passive-per-period
    template: per-member-ask
    arguments:
      voice: [{lit: will}, {lit: be}]
      voice_guards: []
  - id: ask/how-many-fronted-per-period
    template: per-member-ask
    arguments:
      prefix:
        - {lit: [each, every, per], at_start: true}
        - {slot: period, cat: duration_measure, number: singular, uncounted: true, bare: true}
      head: [{lit: how}, {lit: many}]
      timing: []
  - id: ask/total-number-passive-per-period
