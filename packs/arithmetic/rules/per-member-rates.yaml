        - slot_not_category: {slot: item2, cat: many_incompatible_noun}
        - verb_roles_compatible: {verb: verb2, roles: {actor: [actor2], theme: [item2]}, require_declared_frame: true}
        - number_compatible: [actor3, verb3]
