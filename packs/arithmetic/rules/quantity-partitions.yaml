format: rulekit/rules@1
templates:
  nested-subset-shares:
    parameters:
      item_category: inventory_item
      attribute_category: intrinsic_attribute
      inner_predicate:
        - {slot: detail, cat: intrinsic_attribute}
      attribute_guards:
        - attribute_compatible: {attribute: attribute, noun: item}
        - attribute_compatible: {attribute: detail, noun: item}
        - distinct: [attribute, detail]
      kind: subset-nested-attribute-share
    rule:
      description: State the share with a parent attribute and the share within it with a second attribute.
      match:
        sentence:
        - {slot: share, type: fraction, fraction_positive: true, fraction_within_whole: true, at_start: true}
        - {lit: of}
        - {slot: item, cat: {parameter: item_category}, uncounted: true, bare: true, number: plural}
        - {slot: be, cat: plural_copula}
        - {slot: attribute, cat: {parameter: attribute_category}}
        - opt: [{lit: ',', consume_skipped: true}]
        - {lit: and}
        - {slot: nested, type: fraction, fraction_positive: true, fraction_within_whole: true}
        - {lit: of}
        - {slot: subset, cat: {parameter: item_category}, uncounted: true, qualified: true,
           qualifier_cat: {parameter: attribute_category}, all_qualifiers: true, number: plural}
        - {slot: nested_be, cat: plural_copula}
        - {parameter: inner_predicate}
        - {lit: '.', consume_skipped: true}
      where:
      - same_lemma: [item, subset]
      - {parameter: attribute_guards}
      consumes: [share, be, nested, nested_be]
      satisfies: {be: [subject], nested_be: [subject]}
      emits:
      - &parent_attribute_share {fact: batch_evidence, kind: subset-parent-share, entity: '', measure: '{item}',
         value: share, attribute: '{attribute}', position: '{share.span_start}'}
      - &child_attribute_share {fact: batch_evidence, kind: {parameter: kind}, entity: '', measure: '{subset}',
         value: nested, container: '{subset}', marker: '{detail}', position: '{nested.span_start}'}
  qualified-subset-share:
    parameters:
      item_category: inventory_item
      attribute_category: intrinsic_attribute
      inner_predicate: [{slot: detail, cat: intrinsic_attribute}]
      guards: [{attribute_compatible: {attribute: detail, noun: subset}}]
      kind: subset-nested-attribute-share
    rule:
      independent_clause: true
      match:
        sentence:
        - {slot: nested, type: fraction, fraction_positive: true, fraction_within_whole: true, at_start: true}
        - {lit: of}
        - {slot: subset, cat: {parameter: item_category}, uncounted: true, qualified: true,
           qualifier_cat: {parameter: attribute_category}, all_qualifiers: true, number: plural}
        - {slot: be, cat: plural_copula}
        - {parameter: inner_predicate}
        - {lit: '.', consume_skipped: true}
      consumes: [nested, be]
      satisfies: {be: [subject]}
      where: {parameter: guards}
      emits: [*child_attribute_share]
  nested-subset-observed-count:
    parameters:
      count: {slot: item, cat: inventory_item, counted: true, bare: true, at_start: true}
      predicate:
      - opt: [{slot: both, cat: joint_pair_quantifier}]
      - {slot: first, cat: intrinsic_attribute}
      - {lit: and}
      - {slot: second, cat: intrinsic_attribute}
      measure: '{item}'
      parent: '{first}'
      detail: '{second}'
      subject_reference: ''
      obligations: {item: [quantifies], be: [subject], both: [collection]}
      guards:
      - distinct: [first, second]
      - attribute_compatible: {attribute: first, noun: item}
      - attribute_compatible: {attribute: second, noun: item}
    rule:
      description: Supply an observed count with both attributes explicitly identified.
      match:
        sentence:
        - {parameter: count}
        - {slot: be, cat: plural_copula}
        - {parameter: predicate}
        - {lit: '.', consume_skipped: true}
      question_assumption: true
      where:
      - number_compatible: [item, be]
      - {parameter: guards}
      consumes: [item, be]
      satisfies: {parameter: obligations}
      emits:
      - {fact: batch_evidence, kind: subset-observed-attribute-count, entity: '',
         measure: {parameter: measure}, value: item, container: {parameter: subject_reference},
         attribute: {parameter: parent}, marker: {parameter: detail}, position: '{item.span_start}'}
variants:
- {id: arithmetic/qualified-subset-attribute-share, template: qualified-subset-share}
- id: arithmetic/qualified-subset-flavor-share
  template: qualified-subset-share
  arguments:
    item_category: edible_quantity_object
    attribute_category: color_attribute
    inner_predicate: &flavor_predicate
    - {slot: detail, cat: flavor_source, uncounted: true, bare: true}
    - {slot: flavored, cat: flavor_descriptor}
    guards: []
    kind: subset-nested-share
- {id: arithmetic/nested-attribute-shares, template: nested-subset-shares}
- id: arithmetic/nested-flavor-shares
  template: nested-subset-shares
  arguments:
    item_category: edible_quantity_object
    attribute_category: color_attribute
    inner_predicate: *flavor_predicate
    attribute_guards: []
    kind: subset-nested-share
- {id: arithmetic/nested-subset-observed-count, template: nested-subset-observed-count}
- id: arithmetic/nested-subset-observed-qualified-count
  template: nested-subset-observed-count
  arguments:
    count: {slot: item, cat: inventory_item, counted: true, class_only: true, qualified: true,
            qualifier_cat: intrinsic_attribute, all_qualifiers: true, at_start: true}
    predicate: [{slot: second, cat: intrinsic_attribute}]
    parent: '{item.qualifier}'
    subject_reference: '{item}'
    obligations: {be: [subject]}
    guards:
    - attribute_compatible: {attribute: second, noun: item}
- id: arithmetic/nested-subset-observed-elided-count
  template: nested-subset-observed-count
  arguments:
    count: {slot: item, type: number, standalone: true, integer: true, at_start: true}
    measure: ''
    guards: [{distinct: [first, second]}]
rules:
- id: arithmetic/unqualified-subset-attribute-share
  independent_clause: true
  match:
    sentence:
    - {slot: share, type: fraction, fraction_positive: true, fraction_within_whole: true, at_start: true}
    - {lit: of}
    - {slot: item, cat: inventory_item, uncounted: true, bare: true, number: plural}
    - {slot: be, cat: plural_copula}
    - {slot: attribute, cat: intrinsic_attribute}
    - {lit: '.', consume_skipped: true}
  where: [{attribute_compatible: {attribute: attribute, noun: item}}]
  consumes: [share, be]
  satisfies: {be: [subject]}
  emits: [*parent_attribute_share]
- id: arithmetic/uncounted-contained-population
  description: Establish which collection the following partition refers to.
  match:
    sentence:
    - {lit: there, at_start: true, consume_skipped: true}
    - {slot: be, cat: plural_copula}
    - {slot: some, cat: indefinite_subset_quantifier}
    - {slot: item, cat: inventory_item, uncounted: true, bare: true, number: plural}
    - {slot: in, cat: contained_population_preposition}
    - {slot: holder, cat: quantity_container, uncounted: true, bare: true}
    - {lit: '.', consume_skipped: true}
  consumes: [be]
  satisfies: {be: [subject], some: [collection], in: [object]}
  emits:
  - {fact: batch_evidence, kind: subset-population, entity: '{holder}', measure: '{item}',
     value: 0, position: '{item.span_start}'}
- id: arithmetic/flavor-subset-count
  match:
    sentence:
    - {slot: item, cat: edible_quantity_object, counted: true, class_only: true, at_start: true}
    - {slot: be, cat: plural_copula}
    - {slot: flavor, cat: flavor_source, uncounted: true, bare: true}
    - {slot: flavored, cat: flavor_descriptor}
    - {lit: '.', consume_skipped: true}
  question_assumption: true
  where: [{number_compatible: [item, be]}]
  consumes: [item, be]
  satisfies: {be: [subject]}
  emits:
  - {fact: batch_evidence, kind: subset-observed-count, entity: '', measure: '{item}', value: item,
     attribute: '{item.qualifier}', marker: '{flavor}', position: '{item.span_start}'}
- id: arithmetic/owned-output-scope-fraction
  match:
    sentence:
    - slot: who
      type: entity
      common_noun_cat: quantity_holder
      referential: true
      at_start: true
    - slot: act
      cat: scoped_quantity_predicate
      finite_form: true
    - slot: share
      type: fraction
      fraction_within_whole: true
    - lit: of
      consume_skipped: true
    - slot: owner
      cat: possessive_determiner
    - slot: item
      cat: partition_count_unit
      uncounted: true
      possessed: true
    - slot: link
      cat: group_total_preposition
    - slot: scope
      type: entity
      common_noun_cat: allocation_section
      referential: true
  emits:
  - fact: batch_evidence
    kind: partition-fraction
    entity: '{who}'
    measure: '{item}'
    value: share
    position: '{share.span_start}'
    container: '{scope}'
    acquisition: '{item.owner}'
    marker: '{item.qualifier}'
  consumes:
  - act
  - share
  satisfies:
    act:
    - subject
    link:
    - object
  where: []
  references:
    owner: who
  description: Preserve the holder, item, partition label and basis before scaling or valuing an exhaustive 
    account.
- id: arithmetic/owned-output-scope-fraction-continuation
  match:
    sentence:
    - lit: ','
      consume_skipped: true
    - slot: share
      type: fraction
      fraction_within_whole: true
    - lit: of
      consume_skipped: true
    - slot: owner
      cat: possessive_determiner
    - slot: item
      cat: partition_count_unit
      uncounted: true
      possessed: true
    - slot: link
      cat: group_total_preposition
    - slot: scope
      type: entity
      common_noun_cat: allocation_section
      referential: true
  emits:
  - fact: batch_evidence
    kind: partition-fraction
    entity: ''
    measure: '{item}'
    value: share
    position: '{share.span_start}'
    container: '{scope}'
    acquisition: '{item.owner}'
    marker: '{item.qualifier}'
  consumes:
  - share
  satisfies:
    link:
    - object
  where: []
  description: Preserve the holder, item, partition label and basis before scaling or valuing an exhaustive 
    account.
- id: arithmetic/scoped-output-explicit-remainder
  match:
    sentence:
    - lit: and
      consume_skipped: true
    - slot: rest
      cat: partition_remnant
      uncounted: true
      bare: true
    - slot: link
      cat: group_total_preposition
    - slot: scope
      type: entity
      common_noun_cat: allocation_section
      referential: true
    - lit: .
      consume_skipped: true
  emits:
  - fact: batch_evidence
    kind: partition-rest
    entity: ''
    measure: ''
    value: '0'
    position: '0'
    container: '{scope}'
  consumes: []
  satisfies:
    link:
    - object
  where: []
  description: Preserve the holder, item, partition label and basis before scaling or valuing an exhaustive 
    account.
- id: arithmetic/collective-transaction-output-count
  match:
    sentence:
    - slot: who
      cat: discourse_subject_group_pronoun
      at_start: true
    - slot: act
      cat: partition_output_verb
      finite_form: true
    - slot: amount
      cat: transaction_count_unit
      counted: true
      bare: true
    - opt:
      - slot: time
        cat: time
    - lit: .
      consume_skipped: true
  emits:
  - fact: quantity
    entity: '{who}'
    measure: '{amount}'
    value: amount
    verb: '{act}'
    time: '{time.optional}'
  consumes:
  - act
  - amount
  satisfies:
    who:
    - refers
    act:
    - subject
  where: []
  description: Preserve the holder, item, partition label and basis before scaling or valuing an exhaustive 
    account.
- id: arithmetic/packaged-classified-content
  match:
    sentence:
    - slot: each
      cat: distributive_quantifier
      at_start: true
    - slot: package
      cat: quantity_container
      uncounted: true
      bare: true
    - slot: have
      cat: possession_state
      finite_form: true
    - slot: amount
      cat: inventory_item
      counted: true
      bare: true
    - lit: and
      consume_skipped: true
    - slot: share
      type: fraction
      fraction_within_whole: true
    - lit: of
      consume_skipped: true
    - lit: those
      consume_skipped: true
    - slot: item
      cat: inventory_item
      uncounted: true
      bare: true
      number: plural
    - slot: be
      cat: plural_copula
    - slot: label
      cat: inventory_classification_attribute
    - lit: .
      consume_skipped: true
  emits:
  - fact: batch_evidence
    kind: partition-pool
    entity: ''
    measure: '{amount}'
    value: amount
    position: '{amount.span_start}'
    container: '{package}'
  - fact: batch_evidence
    kind: partition-fraction
    entity: ''
    measure: '{item}'
    value: share
    position: '{share.span_start}'
    attribute: '{label}'
  consumes:
  - have
  - amount
  - share
  - be
  satisfies:
    each:
    - collection
    have:
    - subject
    be:
    - subject
  where:
  - same_lemma:
    - amount
    - item
  - number_compatible:
    - package
    - have
  description: Preserve the holder, item, partition label and basis before scaling or valuing an exhaustive 
    account.
- id: arithmetic/repeated-item-population
  match:
    sentence:
    - slot: who
      type: entity
      common_noun_cat: collection_agent
      referential: true
      at_start: true
    - slot: act
      cat: partition_input_activity
      finite_form: true
    - slot: amount
      cat: purchase_item
      counted: true
      bare: true
    - lit:
      - a
      - per
      consume_skipped: true
    - slot: period
      cat: duration_measure
      uncounted: true
      bare: true
    - lit: for
      consume_skipped: true
    - slot: span
      cat: duration_measure
      counted: true
      bare: true
      value_min: 0
    - lit: .
      consume_skipped: true
  emits:
  - fact: batch_evidence
    kind: partition-pool
    entity: '{who}'
    measure: '{amount}'
    value: amount
    position: '{amount.span_start}'
    marker: '{period}'
    per_member: span
    attribute: '{span}'
  consumes:
  - act
  - amount
  - span
  satisfies:
    act:
    - subject
  where:
  - number_compatible: [who, act]
  - bound_requires_category:
      bound: act
      bound_cat: partition_consumption_verb
      slot: amount
      cat: consumable_quantity_object
  description: A repeated, counted input population can be valued using an exhaustive price partition.
    Consumptive readings of taking require a consumable item.
- id: arithmetic/counted-partition-price
  match:
    sentence:
    - lit: of
      consume_skipped: true
    - lit: these
      consume_skipped: true
    - slot: total
      cat: purchase_item
      counted: true
      bare: true
    - lit: ','
      consume_skipped: true
    - slot: subset
      cat: purchase_item
      counted: true
      bare: true
    - slot: cost
      cat: price_verb
      finite_form: true
    - slot: price
      cat: currency_unit
      counted: true
      bare: true
    - slot: each
      cat: postpositive_distributive_quantifier
    - lit: ','
      consume_skipped: true
  emits:
  - fact: batch_evidence
    kind: partition-reference
    entity: ''
    measure: '{total}'
    value: total
    position: '{total.span_start}'
  - fact: batch_evidence
    kind: partition-count
    entity: ''
    measure: '{subset}'
    value: subset
    position: '{subset.span_start}'
    attribute: specified
  - fact: batch_evidence
    kind: partition-price
    entity: ''
    measure: '{price}'
    value: price
    position: '{price.span_start}'
    attribute: specified
  consumes:
  - total
  - subset
  - cost
  - price
  satisfies:
    cost:
    - subject
    each:
    - collection
  where:
  - same_lemma:
    - total
    - subset
  description: Preserve the holder, item, partition label and basis before scaling or valuing an exhaustive 
    account.
- id: arithmetic/remaining-partition-relative-unit-price
  match:
    sentence:
    - lit: and
      consume_skipped: true
    - slot: item
      cat: purchase_item
      qualified: true
      uncounted: true
      qualifier_cat: complementary_partition_attribute
      number: plural
    - slot: each
      cat: postpositive_distributive_quantifier
    - slot: cost
      cat: price_verb
      finite_form: true
    - slot: price
      cat: currency_unit
      counted: true
      bare: true
    - slot: more
      cat: more_dir
    - lit: .
      consume_skipped: true
  emits:
  - fact: batch_evidence
    kind: partition-rest
    entity: ''
    measure: '{item}'
    value: '0'
    position: '0'
    attribute: remaining
  - fact: batch_evidence
    kind: partition-price-offset
    entity: ''
    measure: '{price}'
    value: price
    position: '{price.span_start}'
    attribute: remaining
  consumes:
  - cost
  - price
  - more
  satisfies:
    each:
    - collection
    cost:
    - subject
    more:
    - standard
  where: []
  description: Preserve the holder, item, partition label and basis before scaling or valuing an exhaustive 
    account.
asks:
- id: ask/scoped-output-count
  match:
    question:
    - lit: how
      consume_skipped: true
    - lit: many
      consume_skipped: true
    - slot: unit
      cat: partition_count_unit
      uncounted: true
      bare: true
      number: plural
    - slot: be
      cat: plural_copula
    - slot: link
      cat: group_total_preposition
    - slot: scope
      type: entity
      common_noun_cat: allocation_section
      referential: true
    - lit: '?'
      consume_skipped: true
  resolves:
    consumer: partitioned-account
    measure: '{unit}'
    scope: '{scope}'
    operation: amount
  satisfies:
    be:
    - subject
    link:
    - object
- id: ask/partitioned-acquisition-count
  match:
    question:
    - lit: how
      consume_skipped: true
    - lit: many
      consume_skipped: true
    - slot: unit
      cat: inventory_item
      uncounted: true
      number: plural
    - slot: aux
      cat: auxiliary
    - slot: who
      type: entity
      common_noun_cat: collection_agent
      referential: true
    - slot: act
      cat: allocation_receipt_verb
      bare_form: true
    - lit: '?'
      consume_skipped: true
  resolves:
    consumer: partitioned-account
    entity: '{who}'
    measure: '{unit}'
    operation: amount
  satisfies:
    act:
    - subject
- id: ask/partitioned-item-expenditure
  match:
    question:
    - lit: how
      consume_skipped: true
    - slot: amount_query
      cat: mass_amount_interrogative
    - slot: aux
      cat: auxiliary
    - slot: who
      type: entity
      common_noun_cat: collection_agent
      referential: true
    - slot: spend
      cat: spend_verb
      bare_form: true
    - slot: link
      cat: group_total_preposition
    - slot: total
      cat: group_total_marker
    - lit: on
      consume_skipped: true
    - slot: item
      type: entity
      common_noun_cat: purchase_item
      referential: true
    - lit: '?'
      consume_skipped: true
  resolves:
    consumer: partitioned-account
    entity: '{who}'
    item: '{item}'
    operation: value
  satisfies:
    spend:
    - subject
    link:
    - object
