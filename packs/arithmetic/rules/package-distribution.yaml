format: rulekit/rules@1
rules:
- id: arithmetic/owned-provision-responsibility
  phase: read
  match:
    sentence:
    - slot: dummy
      cat: impersonal_subject_pronoun
      at_start: true
    - slot: be
      cat: copula
    - slot: principal
      type: name
    - slot: poss
      cat: contracted_copula_clitic
    - slot: turn
      cat: responsibility_role
      uncounted: true
    - lit: to
    - slot: provide
      cat: provision_verb
      bare_form: true
    - slot: resource
      cat: provision_purpose_noun
      uncounted: true
    - lit: for
    - slot: team
      cat: social_group
      uncounted: true
    - lit: after
    - slot: event
      cat: scheduled_event
      uncounted: true
    - lit: and
    - slot: who
      cat: anaphoric_person_subject
    - slot: decide
      cat: supply_decision_verb
      finite_form: true
    - lit: to
    - slot: bring
      cat: supply_transport_verb
      bare_form: true
    - slot: item
      cat: purchase_item
      uncounted: true
      bare: true
    - lit: .
      consume_skipped: true
  emits:
  - fact: batch_evidence
    kind: distribution-context
    entity: '{principal}'
    measure: '{item}'
    value: 0
    position: '{item.span_start}'
    container: '{team}'
  consumes:
  - be
  - provide
  - decide
  - bring
  satisfies:
    dummy:
    - refers
    be:
    - subject
    provide:
    - subject
    decide:
    - subject
    bring:
    - subject
  disambiguates:
  - turn
  bindings:
    poss:
      owner: principal
      owned: turn
  references:
    who: principal
  description: Preserve stocks, units per package or whole, counted recipient groups and explicit serving
    participants.
- id: arithmetic/packaged-unit-capacity
  phase: read
  match:
    sentence:
    - slot: item
      cat: purchase_item
      uncounted: true
      bare: true
      at_start: true
    - slot: come
      cat: packaging_availability_verb
      finite_form: true
    - lit: in
    - slot: package
      cat: quantity_container
      uncounted: true
      number: plural
      bare: true
    - lit: of
    - slot: units
      cat: package_distribution_unit
      counted: true
    - lit: .
      consume_skipped: true
  emits:
  - fact: batch_evidence
    kind: distribution-capacity
    entity: ''
    measure: '{units}'
    value: units
    position: '{units.span_start}'
    container: '{package}'
    acquisition: '{item}'
    attribute: '{units.qualifier}'
  consumes:
  - come
  - units
  satisfies:
    come:
    - subject
  description: Preserve stocks, units per package or whole, counted recipient groups and explicit serving
    participants.
- id: arithmetic/affiliated-recipient-groups
  phase: read
  match:
    sentence:
    - slot: who
      type: entity
      common_noun_cat: allocation_recipient
      referential: true
      bare: true
    - slot: have
      cat: possession_state
      finite_form: true
    - slot: first
      cat: person
      counted: true
      bare: true
    - lit: on
    - slot: owner
      cat: possessive_determiner
    - slot: team
      cat: social_group
      uncounted: true
    - lit: ','
      consume_skipped: true
    - lit: plus
    - slot: others
      span: true
      enumeration_cat: person
      enumeration_counted: true
      enumeration_min_members: 1
    - lit: .
      consume_skipped: true
  emits:
  - fact: batch_evidence
    kind: distribution-population
    entity: '{who}'
    measure: '{first}'
    value: first
    position: '{first.span_start}'
    container: '{team}'
  - fact: batch_evidence
    kind: distribution-population
    entity: '{who}'
    measure: '{item}'
    value: item
    position: '{item.span_start}'
    container: '{team}'
    each: others
  consumes:
  - have
  - first
  - others
  satisfies:
    have:
    - subject
  references:
    owner: who
  description: Preserve stocks, units per package or whole, counted recipient groups and explicit serving
    participants.
- id: arithmetic/partitioned-stock-served-to-mixed-roster
  phase: read
  match:
    sentence:
    - slot: each
      cat: partitive_distributive_quantifier
      at_start: true
    - lit: of
    - slot: whole
      cat: decomposable_quantity_whole
      uncounted: true
      number: plural
    - slot: be
      cat: copula
    - slot: cut
      cat: portion_division_verb
      past_participle: true
    - lit: into
    - slot: pieces
      cat: component_quantity_measure
      counted: true
      bare: true
    - lit: and
    - slot: who
      type: entity
      common_noun_cat: allocation_recipient
      referential: true
      bare: true
    - lit: ','
      consume_skipped: true
    - slot: owner
      cat: possessive_determiner
    - slot: peers
      cat: person
      uncounted: true
      number: plural
    - lit: ','
      consume_skipped: true
    - lit: and
    - slot: named
      type: name
    - slot: all
      cat: group_serving_distributor
    - slot: have
      cat: possession_state
      finite_form: true
    - slot: serving
      cat: component_quantity_measure
      counted: true
      bare: true
    - lit: .
      consume_skipped: true
  emits:
  - fact: batch_evidence
    kind: distribution-partition
    entity: '{who}'
    measure: '{pieces}'
    value: pieces
    position: '{pieces.span_start}'
    container: '{whole}'
  - fact: batch_evidence
    kind: distribution-serving
    entity: '{who}'
    measure: '{serving}'
    value: serving
    position: '{serving.span_start}'
    container: '{named}'
    acquisition: '{peers}'
    marker: include-owner
  question_assumption: true
  consumes:
  - be
  - cut
  - pieces
  - have
  - serving
  satisfies:
    be:
    - subject
    cut:
    - subject
    have:
    - subject
    each:
    - collection
  description: Preserve stocks, units per package or whole, counted recipient groups and explicit serving
    participants.
  references:
    owner: who
- id: arithmetic/explicit-per-recipient-unit-count
  phase: read
  match:
    sentence:
    - slot: each
      cat: partitive_distributive_quantifier
      at_start: true
    - slot: person
      cat: allocation_recipient
      uncounted: true
      bare: true
    - slot: need
      cat: goal_predicate
      finite_form: true
    - slot: units
      cat: package_distribution_unit
      counted: true
      bare: true
    - lit: .
      consume_skipped: true
  emits:
  - fact: batch_evidence
    kind: distribution-per-recipient
    entity: ''
    measure: '{units}'
    value: units
    position: '{units.span_start}'
    container: '{person}'
  consumes:
  - need
  - units
  satisfies:
    each:
    - collection
    need:
    - subject
  description: Preserve stocks, units per package or whole, counted recipient groups and explicit serving
    participants.
asks:
- id: ask/required-whole-packages
  match:
    question:
    - lit: how
      at_start: true
    - lit: many
    - slot: package
      cat: quantity_container
      uncounted: true
      bare: true
    - lit: of
    - slot: item
      cat: purchase_item
      uncounted: true
      bare: true
    - slot: aux
      type: auxiliary
    - slot: who
      type: entity
      common_noun_cat: allocation_recipient
      referential: true
      bare: true
    - slot: need
      cat: goal_predicate
      bare_form: true
    - slot: infinitive
      cat: infinitival_marker
    - slot: buy
      cat: purchase
      bare_form: true
    - lit: '?'
      consume_skipped: true
  resolves:
    consumer: unit-distribution
    mode: packages
    entity: '{who}'
    package: '{package}'
    item: '{item}'
  satisfies:
    need:
    - subject
    buy:
    - subject
    infinitive:
    - object
- id: ask/distributed-pieces-left
  match:
    question:
    - lit: how
      at_start: true
    - lit: many
    - slot: piece
      cat: component_quantity_measure
      uncounted: true
      bare: true
    - slot: be
      cat: copula
    - slot: left
      cat: batch_left_verb
    - lit: '?'
      consume_skipped: true
  resolves:
    consumer: unit-distribution
    mode: remainder
    measure: '{piece}'
  satisfies:
    be:
    - subject
- id: ask/distributed-pieces-remain
  match:
    question:
    - {lit: how, at_start: true}
    - {lit: many}
    - {slot: piece, cat: component_quantity_measure, uncounted: true, bare: true}
    - {slot: remain, cat: remainder_state_verb, finite_form: true}
    - {lit: '?', consume_skipped: true}
  where: [{number_compatible: [piece, remain]}]
  resolves: {consumer: unit-distribution, mode: remainder, measure: '{piece}'}
  satisfies: {remain: [subject]}
- id: ask/distributed-pieces-to-take
  match:
    question:
    - {lit: how, at_start: true}
    - {lit: many}
    - {slot: piece, cat: component_quantity_measure, uncounted: true, bare: true}
    - {slot: aux, cat: ability_modal}
    - {slot: who, type: entity, common_noun_cat: allocation_recipient, referential: true}
    - {slot: take, cat: inventory_withdrawal_particle_head, bare_form: true}
    - {slot: destination, cat: removal_destination_noun}
    - {lit: '?', consume_skipped: true}
  resolves: {consumer: unit-distribution, mode: remainder, measure: '{piece}', recipient: '{who}'}
  satisfies: {take: [subject]}
templates:
  mixed-recipient-roster:
    parameters:
      opening: []
      peers: []
      count: peers
      position: '{peers.span_start}'
      shared_items: ""
      stock: []
      consumes: [share, peers]
      satisfies: {share: [subject]}
      references: {owner: who, other_owner: who}
    rule:
      phase: read
      description: Keep a counted group and one named recipient attached to the stock holder.
      match:
        sentence:
        - {slot: who, type: entity, common_noun_cat: allocation_recipient, referential: true, bare: true, at_start: true}
        - {parameter: opening}
        - {lit: with}
        - {parameter: peers}
        - {lit: and}
        - {slot: other_owner, cat: possessive_determiner}
        - {slot: role, cat: person, uncounted: true, number: singular}
        - {lit: ',', consume_skipped: true}
        - {slot: named, type: name}
        - {lit: '.', consume_skipped: true}
      emits:
      - {parameter: stock}
      - {fact: batch_evidence, kind: distribution-population, entity: '{who}', measure: '{peers}',
         value: {parameter: count}, position: {parameter: position}, acquisition: {parameter: shared_items}}
      - {fact: batch_evidence, kind: distribution-population, entity: '{who}', measure: '{role}',
         value: 1, position: '{role.span_start}', container: '{named}', acquisition: {parameter: shared_items}}
      consumes: {parameter: consumes}
      satisfies: {parameter: satisfies}
      references: {parameter: references}
  active-provision:
    parameters:
      resource:
        slot: item
        cat: purchase_item
        uncounted: true
      decision: []
      item: '{item}'
      consumes:
      - be
      - provide
      satisfies:
        be:
        - subject
        provide:
        - subject
      references: {}
    rule:
      description: An ongoing provision or an explicitly selected supply identifies the material and recipient
        group.
      phase: read
      match:
        sentence:
        - slot: who
          type: entity
          common_noun_cat: intentional_agent
          referential: true
          at_start: true
        - slot: be
          cat: copula
        - slot: provide
          cat: provision_verb
          present_participle: true
        - parameter: resource
        - lit: for
        - opt:
          - slot: owner
            cat: possessive_determiner
        - slot: team
          cat: social_group
          uncounted: true
        - opt:
          - lit: after
          - slot: event
            cat: scheduled_event
            uncounted: true
        - parameter: decision
        - {lit: '.', consume_skipped: true}
      emits:
      - fact: batch_evidence
        kind: distribution-context
        entity: '{who}'
        measure:
          parameter: item
        value: 0
        position: '0'
        container: '{team}'
      consumes:
        parameter: consumes
      satisfies:
        parameter: satisfies
      where:
      - number_compatible:
        - who
        - be
      references:
        parameter: references
variants:
- id: arithmetic/stock-for-counted-and-named-recipients
  template: mixed-recipient-roster
  arguments:
    opening:
    - {slot: have, cat: possession_state, finite_form: true}
    - {slot: stock, cat: decomposable_quantity_whole, counted: true}
    - {lit: to}
    - {slot: share, cat: allocation_verb, bare_form: true}
    peers:
    - {slot: owner, cat: possessive_determiner}
    - {slot: peers, cat: person, counted: true}
    stock:
    - {fact: batch_evidence, kind: distribution-stock, entity: '{who}', measure: '{stock}',
       value: stock, position: '{stock.span_start}', container: '{stock}'}
    consumes: [have, stock, share, peers]
    satisfies: {have: [subject], share: [subject]}
- id: arithmetic/stock-for-counted-group-and-possessed-role
  template: mixed-recipient-roster
  arguments:
    opening:
    - {slot: have, cat: possession_state, finite_form: true}
    - {slot: stock, cat: decomposable_quantity_whole, counted: true}
    - {lit: to}
    - {slot: share, cat: allocation_verb, bare_form: true}
    peers:
    - {slot: peers, cat: person, counted: true}
    stock:
    - {fact: batch_evidence, kind: distribution-stock, entity: '{who}', measure: '{stock}',
       value: stock, position: '{stock.span_start}', container: '{stock}'}
    consumes: [have, stock, share, peers]
    satisfies: {have: [subject], share: [subject]}
    references: {other_owner: who}
- id: arithmetic/initial-stock-for-mixed-roster
  template: mixed-recipient-roster
  arguments:
    opening:
    - {slot: have, cat: stock_start_action, finite_form: true}
    - {lit: with}
    - {slot: stock, cat: decomposable_quantity_whole, counted: true}
    - {lit: to}
    - {slot: share, cat: allocation_verb, bare_form: true}
    peers:
    - {slot: owner, cat: possessive_determiner}
    - {slot: peers, cat: person, counted: true}
    stock:
    - {fact: batch_evidence, kind: distribution-stock, entity: '{who}', measure: '{stock}',
       value: stock, position: '{stock.span_start}', container: '{stock}'}
    consumes: [have, stock, share, peers]
    satisfies: {have: [subject], share: [subject]}
- id: arithmetic/stock-for-partitive-and-named-recipients
  template: mixed-recipient-roster
  arguments:
    opening:
    - {slot: have, cat: possession_state, finite_form: true}
    - {slot: stock, cat: decomposable_quantity_whole, counted: true}
    - {lit: to}
    - {slot: share, cat: allocation_verb, bare_form: true}
    peers:
    - {slot: group_count, type: number, standalone: true, value_min: 1}
    - {lit: of}
    - {slot: owner, cat: possessive_determiner}
    - {slot: peers, cat: person, uncounted: true, number: plural}
    count: group_count
    position: '{group_count.span_start}'
    stock:
    - {fact: batch_evidence, kind: distribution-stock, entity: '{who}', measure: '{stock}',
       value: stock, position: '{stock.span_start}', container: '{stock}'}
    consumes: [have, stock, share, group_count]
    satisfies: {have: [subject], share: [subject], group_count: [quantifies]}
- id: arithmetic/shared-stock-mixed-roster
  template: mixed-recipient-roster
  arguments:
    opening:
    - {slot: share, cat: allocation_verb, finite_form: true}
    - {slot: items, cat: plural_object_pronoun}
    peers:
    - {slot: owner, cat: possessive_determiner}
    - {slot: peers, cat: person, counted: true}
    shared_items: '{items}'
    satisfies: {share: [subject, dobj], items: [refers]}

- id: arithmetic/active-provision-of-item
  template: active-provision
- id: arithmetic/active-provision-with-supply-choice
  template: active-provision
  arguments:
    resource:
      slot: resource
      cat: provision_purpose_noun
      uncounted: true
    decision:
    - lit: and
    - slot: subject
      cat: anaphoric_person_subject
    - slot: decide
      cat: supply_decision_verb
      finite_form: true
    - lit: to
    - slot: bring
      cat: supply_transport_verb
      bare_form: true
    - slot: item
      cat: purchase_item
      uncounted: true
      bare: true
    consumes:
    - be
    - provide
    - decide
    - bring
    satisfies:
      be:
      - subject
      provide:
      - subject
      decide:
      - subject
      bring:
      - subject
    references:
      subject: who
