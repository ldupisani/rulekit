      consume_skipped: true
    - slot: factor
      type: multiplier
    - lit: as
    - lit: many
    - slot: second
      cat: inventory_item
      uncounted: true
      bare: true
    - lit:
      - as
      - than
    - slot: standard
      cat: inventory_item
      uncounted: true
      bare: true
    - lit: .
      consume_skipped: true
  emits:
  - fact: batch_evidence
    kind: item-amount
    entity: '{who}'
    measure: '{first}'
    value: first
    position: '{first.span_start}'
