    entity: '{event}'
    measure: ''
    value: 0
    position: '{a.span_start}'
    container: '{a}'
    acquisition: '{b}'
  - fact: batch_evidence
    kind: saving-share
    entity: '{event}'
    measure: ''
    value: fraction
    position: '{fraction.span_start}'
  consumes:
  - save
  - fraction
  satisfies:
    save:
    - subject
    owner:
    - refers
asks:
- id: ask/weekly-open-day-schedule
  match:
    question:
    - lit: how
      consume_skipped: true
    - lit: many
      consume_skipped: true
    - slot: item
      cat: inventory_item
      uncounted: true
      bare: true
    - slot: aux
      type: auxiliary
    - slot: who
      type: entity
      common_noun_cat: intentional_agent
      referential: true
    - slot: act
      cat: recurring_quantity_verb
    - lit: in
      consume_skipped: true
    - lit: a
      consume_skipped: true
    - slot: week
      cat: duration_measure
      uncounted: true
      bare: true
    - lit: if
      consume_skipped: true
    - slot: site
      cat: quantity_location
      uncounted: true
      bare: true
    - slot: be
      cat: copula
    - slot: open
      cat: open_state
    - lit: from
      consume_skipped: true
    - slot: first
      cat: named_weekday
      uncounted: true
      bare: true
    - lit: to
      consume_skipped: true
    - slot: last
      cat: named_weekday
      uncounted: true
      bare: true
    - lit: '?'
      consume_skipped: true
  resolves:
    consumer: calendar-resource-total
    operation: week
    entity: '{who}'
    measure: '{item}'
    verb: '{act}'
    first: '{first}'
    last: '{last}'
    site: '{site}'
    period: '{week}'
  satisfies:
    act:
    - subject
    be:
    - subject
  disambiguates:
  - item
  - act
  - week
  - site
  - be
  - open
  - first
  - last
- id: ask/named-month-resource-requirement
  match:
