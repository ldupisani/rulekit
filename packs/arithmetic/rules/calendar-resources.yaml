format: rulekit/rules@1
rules:
- id: arithmetic/work-location-context
  phase: read
  match:
    sentence:
    - slot: who
      type: entity
      common_noun_cat: intentional_agent
      referential: true
      at_start: true
    - slot: work
      cat: scheduled_activity_verb
      finite_form: true
    - lit: in
      consume_skipped: true
    - slot: site
      cat: quantity_location
      uncounted: true
      bare: true
    - lit: .
      consume_skipped: true
  emits:
  - fact: batch_evidence
    kind: schedule-site
    entity: '{who}'
    measure: ''
    value: 0
    position: '{who.span_start}'
    container: '{site}'
  consumes:
  - work
  satisfies:
    work:
    - subject
  disambiguates:
  - work
  - site
- id: arithmetic/ordinary-daily-average
  phase: read
  match:
    sentence:
    - slot: who
      type: entity
      common_noun_cat: intentional_agent
      referential: true
      at_start: true
    - slot: act
      cat: recurring_quantity_verb
      finite_form: true
    - lit: an
      consume_skipped: true
    - slot: average
      cat: schedule_average_noun
    - lit: of
      consume_skipped: true
    - slot: amount
      cat: inventory_item
      counted: true
      bare: true
    - lit: every
      consume_skipped: true
    - slot: period
      cat: duration_measure
      uncounted: true
      bare: true
    - lit: .
      consume_skipped: true
  emits:
  - fact: batch_evidence
    kind: schedule-baseline
    entity: '{who}'
    measure: '{amount}'
    value: amount
    position: '{who.span_start}'
    marker: '{period}'
    verb: '{act}'
  consumes:
  - act
  - amount
  - average
  satisfies:
    act:
    - subject
  disambiguates:
  - act
  - average
  - amount
  - period
- id: arithmetic/weekday-relative-to-daily-average
  phase: read
  match:
    sentence:
    - lit: every
      consume_skipped: true
    - slot: weekday
      cat: named_weekday
      uncounted: true
      bare: true
    - opt:
      - lit: ','
        consume_skipped: true
    - slot: owner
      cat: possessive_determiner
    - slot: number
      cat: count_aggregate_noun
      uncounted: true
    - lit: of
      consume_skipped: true
    - slot: act
      cat: recurring_quantity_verb
      past_participle: true
    - slot: item
      cat: inventory_item
      uncounted: true
      bare: true
    - slot: be
      cat: copula
    - opt:
      - slot: approx
        cat: approximation_marker
    - slot: fraction
      type: fraction
    - slot: direction
      cat: higher
    - lit: than
      consume_skipped: true
    - slot: daily
      cat: daily_frequency_attribute
    - slot: average
      cat: schedule_average_noun
    - lit: .
      consume_skipped: true
  emits:
  - fact: batch_evidence
    kind: schedule-exception
    entity: '{number.owner}'
    measure: '{item}'
    value: fraction
    position: '{weekday.span_start}'
    marker: '{weekday}'
    verb: '{act}'
    sign: 1
    attribute: '{approx.optional}'
  consumes:
  - act
  - be
  - fraction
  - direction
  - average
  satisfies:
    be:
    - subject
    direction:
    - standard
  disambiguates:
  - weekday
  - owner
  - number
  - act
  - item
  - be
  - approx
  - direction
  - daily
  - average
- id: arithmetic/weekday-more-quantity
  phase: read
  match:
    sentence:
    - lit: on
      consume_skipped: true
    - slot: weekday
      cat: named_weekday
      uncounted: true
      bare: true
    - opt:
      - lit: ','
        consume_skipped: true
    - slot: who
      type: entity
      common_noun_cat: intentional_agent
      referential: true
    - slot: act
      cat: recurring_quantity_verb
    - slot: fraction
      type: fraction
    - slot: direction
      cat: count_quantity_delta
    - slot: item
      cat: inventory_item
      uncounted: true
      bare: true
    - lit: than
      consume_skipped: true
    - slot: daily
      cat: daily_frequency_attribute
    - slot: average
      cat: schedule_average_noun
    - lit: .
      consume_skipped: true
  where:
  - slot_not_category: {slot: direction, cat: lower}
  emits:
  - fact: batch_evidence
    kind: schedule-exception
    entity: '{who}'
    measure: '{item}'
    value: fraction
    position: '{weekday.span_start}'
    marker: '{weekday}'
    verb: '{act}'
    sign: 1
  consumes:
  - act
  - fraction
  - average
  satisfies:
    act:
    - subject
    direction:
    - standard
  disambiguates:
  - weekday
  - act
  - direction
  - item
  - daily
  - average
- id: arithmetic/named-joint-plan-context
  phase: read
  match:
    sentence:
    - slot: a
      type: name
      at_start: true
    - lit: and
      consume_skipped: true
    - slot: b
      type: name
    - slot: make
      cat: production_quantity_verb
    - slot: plan
      cat: plan_noun
      uncounted: true
      bare: true
    - lit: to
      consume_skipped: true
    - slot: go
      cat: spatial_motion_verb
    - lit: on
      consume_skipped: true
    - slot: event
      cat: travel_event
      uncounted: true
    - lit: at
      consume_skipped: true
    - slot: end
      cat: period_boundary_noun
      uncounted: true
      bare: true
    - lit: of
      consume_skipped: true
    - slot: period
      cat: calendar_year_unit
      uncounted: true
      bare: true
    - lit: .
      consume_skipped: true
  emits:
  - fact: batch_evidence
    kind: saving-group
    entity: '{event}'
    measure: ''
    value: 0
    position: '{a.span_start}'
    container: '{a}'
    acquisition: '{b}'
  consumes:
  - make
  - go
  satisfies:
    make:
    - subject
    go:
    - subject
  disambiguates:
  - make
  - plan
  - go
  - event
  - end
  - period
- id: arithmetic/joint-saving-policy
  phase: read
  match:
    sentence:
    - slot: group
      cat: discourse_subject_group_pronoun
      at_start: true
    - opt:
      - lit: both
        consume_skipped: true
    - slot: decide
      cat: decision_action
    - lit: to
      consume_skipped: true
    - slot: work
      cat: scheduled_activity_verb
    - lit: as
      consume_skipped: true
    - slot: role
      cat: person
      uncounted: true
      bare: true
    - lit: and
      consume_skipped: true
    - slot: save
      cat: saving_action
    - slot: fraction
      type: fraction
    - lit: of
      consume_skipped: true
    - lit: what
      consume_skipped: true
    - slot: group2
      cat: discourse_subject_group_pronoun
    - slot: earn
      cat: income_action
    - opt:
      - lit: for
        consume_skipped: true
      - slot: owner
        cat: plural_possessive_determiner
      - slot: event
        cat: travel_event
        uncounted: true
    - lit: .
      consume_skipped: true
  emits:
  - fact: batch_evidence
    kind: saving-share
    entity: '{event.optional}'
    measure: ''
    value: fraction
    position: '{fraction.span_start}'
  consumes:
  - decide
  - work
  - save
  - earn
  - fraction
  satisfies:
    group:
    - refers
    group2:
    - refers
    owner:
    - refers
    decide:
    - subject
    work:
    - subject
    save:
    - subject
    earn:
    - subject
  disambiguates:
  - group
  - decide
  - work
  - role
  - save
  - group2
  - earn
  - owner
  - event
- id: arithmetic/named-joint-saving-share
  phase: read
  match:
    sentence:
    - slot: a
      type: name
      at_start: true
    - lit: and
      consume_skipped: true
    - slot: b
      type: name
    - slot: save
      cat: saving_action
    - slot: fraction
      type: fraction
    - lit: of
      consume_skipped: true
    - slot: owner
      cat: plural_possessive_determiner
    - slot: income
      cat: income_resource_noun
      uncounted: true
    - opt:
      - lit: for
        consume_skipped: true
      - slot: event
        cat: travel_event
        uncounted: true
        bare: true
    - lit: .
      consume_skipped: true
  emits:
  - fact: batch_evidence
    kind: saving-group
    entity: '{event.optional}'
    measure: ''
    value: 0
    position: '{a.span_start}'
    container: '{a}'
    acquisition: '{b}'
  - fact: batch_evidence
    kind: saving-share
    entity: '{event.optional}'
    measure: ''
    value: fraction
    position: '{fraction.span_start}'
  consumes:
  - save
  - fraction
  satisfies:
    save:
    - subject
    owner:
    - refers
asks:
- id: ask/weekly-open-day-schedule
  match:
    question:
    - lit: how
      consume_skipped: true
    - lit: many
      consume_skipped: true
    - slot: item
      cat: inventory_item
      uncounted: true
      bare: true
    - slot: aux
      type: auxiliary
    - slot: who
      type: entity
      common_noun_cat: intentional_agent
      referential: true
    - slot: act
      cat: recurring_quantity_verb
    - lit: in
      consume_skipped: true
    - lit: a
      consume_skipped: true
    - slot: week
      cat: duration_measure
      uncounted: true
      bare: true
    - lit: if
      consume_skipped: true
    - slot: site
      cat: quantity_location
      uncounted: true
      bare: true
    - slot: be
      cat: copula
    - slot: open
      cat: open_state
    - lit: from
      consume_skipped: true
    - slot: first
      cat: named_weekday
      uncounted: true
      bare: true
    - lit: to
      consume_skipped: true
    - slot: last
      cat: named_weekday
      uncounted: true
      bare: true
    - lit: '?'
      consume_skipped: true
  resolves:
    consumer: calendar-resource-total
    operation: week
    entity: '{who}'
    measure: '{item}'
    verb: '{act}'
    first: '{first}'
    last: '{last}'
    site: '{site}'
    period: '{week}'
  satisfies:
    act:
    - subject
    be:
    - subject
  disambiguates:
  - item
  - act
  - week
  - site
  - be
  - open
  - first
  - last
- id: ask/joint-calendar-savings
  match:
    question:
    - lit: how
      consume_skipped: true
    - slot: much
      cat: mass_amount_quantifier
    - slot: money
      cat: currency
      uncounted: true
    - slot: future
      type: modal
    - slot: group
      cat: discourse_subject_group_pronoun
    - opt:
      - lit: both
        consume_skipped: true
    - slot: save
      cat: saving_action
    - lit: for
      consume_skipped: true
    - slot: owner
      cat: plural_possessive_determiner
    - slot: event
      cat: travel_event
      uncounted: true
    - lit: after
      consume_skipped: true
    - lit: a
      consume_skipped: true
    - slot: period
      cat: calendar_year_unit
      uncounted: true
      bare: true
    - lit: '?'
      consume_skipped: true
  resolves:
    consumer: calendar-resource-total
    operation: savings
    event: '{event}'
    period: '{period}'
  satisfies:
    save:
    - subject
    group:
    - refers
    owner:
    - refers
  disambiguates:
  - much
  - money
  - group
  - save
  - owner
  - event
  - period
- id: ask/joint-calendar-savings-without-purpose
  match:
    question:
    - lit: how
      consume_skipped: true
    - slot: much
      cat: mass_amount_quantifier
    - slot: money
      cat: currency
      uncounted: true
    - slot: future
      type: modal
    - slot: group
      cat: discourse_subject_group_pronoun
    - opt:
      - lit: both
        consume_skipped: true
    - slot: save
      cat: saving_action
    - lit: after
      consume_skipped: true
    - lit: a
      consume_skipped: true
    - slot: period
      cat: calendar_year_unit
      uncounted: true
      bare: true
    - lit: '?'
      consume_skipped: true
  resolves:
    consumer: calendar-resource-total
    operation: savings
    period: '{period}'
  satisfies:
    save:
    - subject
    group:
    - refers
  disambiguates:
  - much
  - money
  - group
  - save
  - period
templates:
  named-month-provision:
    parameters:
      participants:
        - &provision_recipient {slot: recipient, cat: allocation_recipient, uncounted: true, bare: true}
        - opt:
          - opt: [{slot: link, cat: provision_complement_preposition}]
          - &provision_material {slot: material, cat: material_resource, uncounted: true, bare: true}
      complement_constraints:
        - &provision_with_license {bound_requires_category: {bound: link, slot: act, cat: supply_with_complement_action}}
        - &provision_with_required {category_requires_bound: {slot: act, cat: provision_verb, bound: link}}
        - category_requires_bound: {slot: act, cat: recipient_giving_action, bound: material}
      extra_selections: [link]
      year_clause: []
      year_value: 0
      extra_quantities: []
      roles: {like: [subject], act: [subject]}
    rule:
      phase: read
      match:
        sentence:
        - {slot: who, type: entity, common_noun_cat: intentional_agent, referential: true, at_start: true}
        - opt:
          - {slot: like, cat: preference_action}
          - {lit: to, consume_skipped: true}
        - {slot: act, cat: recipient_provision_action, finite_form: true}
        - {parameter: participants}
        - {lit: in, consume_skipped: true}
        - {slot: months, span: true, enumeration_cat: named_month}
        - {parameter: year_clause}
        - {lit: '.', consume_skipped: true}
      where:
      - {parameter: complement_constraints}
      - bound_requires_form: {bound: like, slot: act, form: bare}
      - verb_roles_compatible:
          verb: act
          roles: {recipient: [recipient]}
          frame_categories: [recipient_provision_action]
          require_declared_frame: true
      emits:
      - {fact: batch_evidence, kind: calendar-months, entity: '{who}', measure: '', value: 0,
         position: '{who.span_start}', verb: '{act}', container: '{recipient}', attribute: '{material.optional}',
         members: '{months.members}', subtotal: {parameter: year_value}}
      consumes: [like, act, {parameter: extra_quantities}]
      satisfies: {parameter: roles}
      disambiguates: [like, act, recipient, material, {parameter: extra_selections}]
  daily-portions:
    parameters:
      independent: true
      continuation: []
      extra_portions: []
      extra_quantities: []
      extra_selections: []
    rule:
      independent_clause: {parameter: independent}
      phase: read
      match:
        sentence:
        - slot: who
          type: entity
          common_noun_cat: intentional_agent
          referential: true
          at_start: true
        - slot: act
          cat: recipient_provision_action
          finite_form: true
        - {slot: recipient, cat: third_person_object_pronoun}
        - opt: [{slot: link, cat: provision_complement_preposition}]
        - slot: first
          type: fraction
        - slot: unit
          cat: resource_measure_unit
          uncounted: true
          bare: true
        - opt:
          - {lit: of, consume_skipped: true}
          - {slot: material, cat: material_resource, uncounted: true, bare: true}
        - lit: in
          consume_skipped: true
        - slot: part1
          cat: part_of_day
          uncounted: true
          bare: true
        - {parameter: continuation}
        - {lit: '.', consume_skipped: true}
      where: [*provision_with_license, *provision_with_required, {number_compatible: [who, act]}]
      emits:
      - fact: batch_evidence
        kind: daily-portion
        entity: '{who}'
        measure: '{unit}'
        value: first
        position: '{first.span_start}'
        marker: '{part1}'
        container: '{recipient}'
        attribute: '{material.optional}'
        verb: '{act}'
      - {parameter: extra_portions}
      consumes: [act, first, {parameter: extra_quantities}]
      satisfies: {act: [subject], recipient: [refers]}
      disambiguates: [act, link, unit, material, part1, {parameter: extra_selections}]
  scheduled-month-requirement:
    parameters:
      months:
      - opt: [{lit: all, consume_skipped: true}]
      - {slot: months, cat: calendar_month_unit, counted: true, bare: true}
      count: '{months.value}'
    rule:
      match:
        question:
        - lit: how
          consume_skipped: true
        - lit: many
          consume_skipped: true
        - slot: unit
          cat: resource_measure_unit
          number: plural
          uncounted: true
          bare: true
        - lit: of
          consume_skipped: true
        - slot: item
          cat: material_resource
          uncounted: true
          bare: true
        - slot: future
          type: modal
        - slot: who
          type: entity
          common_noun_cat: intentional_agent
          referential: true
        - slot: need
          cat: component_requirement_verb
          bare_form: true
        - lit: for
          consume_skipped: true
        - {parameter: months}
        - lit: '?'
          consume_skipped: true
      resolves:
        consumer: calendar-resource-total
        operation: months
        entity: '{who}'
        measure: '{unit}'
        material: '{item}'
        month_count: {parameter: count}
      satisfies:
        need:
        - subject
      disambiguates:
      - unit
      - item
      - need
      - months
ask_variants:
- {id: ask/named-month-resource-requirement, template: scheduled-month-requirement}
- id: ask/both-months-resource-requirement
  template: scheduled-month-requirement
  arguments:
    months:
    - {slot: pair, cat: joint_pair_quantifier}
    - {slot: months, cat: calendar_month_unit, uncounted: true, bare: true, number: plural}
    count: '2'

variants:
- {id: arithmetic/named-month-activity-schedule, template: named-month-provision}
- id: arithmetic/year-qualified-month-schedule
  template: named-month-provision
  arguments:
    year_clause: &provision_year
    - {lit: of, consume_skipped: true}
    - {slot: year, type: number, integer: true, value_positive: true, standalone: true}
    year_value: year
    extra_quantities: [year]
    roles: &dated_provision_roles {like: [subject], act: [subject], year: [quantifies]}
- id: arithmetic/named-month-material-to-recipient
  template: named-month-provision
  arguments:
    participants: &material_to_recipient [*provision_material, {lit: to, consume_skipped: true}, *provision_recipient]
    complement_constraints: []
    extra_selections: []
- id: arithmetic/year-qualified-material-to-recipient
  template: named-month-provision
  arguments:
    participants: *material_to_recipient
    complement_constraints: []
    extra_selections: []
    year_clause: *provision_year
    year_value: year
    extra_quantities: [year]
    roles: *dated_provision_roles
- {id: arithmetic/daily-portion, template: daily-portions}
- id: arithmetic/daily-two-part-quantities
  template: daily-portions
  arguments:
    independent: false
    continuation:
    - lit: and
      consume_skipped: true
    - slot: second
      type: fraction
    - slot: unit2
      cat: resource_measure_unit
      uncounted: true
      bare: true
    - opt:
      - {lit: of, consume_skipped: true}
      - {slot: material2, cat: material_resource, uncounted: true, bare: true}
    - lit: in
      consume_skipped: true
    - slot: part2
      cat: part_of_day
      uncounted: true
      bare: true
    extra_portions:
    - fact: batch_evidence
      kind: daily-portion
      entity: '{who}'
      measure: '{unit2}'
      value: second
      position: '{second.span_start}'
      marker: '{part2}'
      container: '{recipient}'
      attribute: '{material2.optional}'
      verb: '{act}'
    extra_quantities: [second]
    extra_selections: [unit2, material2, part2]
