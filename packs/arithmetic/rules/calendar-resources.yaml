    - lit: how
      consume_skipped: true
    - lit: many
      consume_skipped: true
    - slot: unit
      cat: resource_measure_unit
      uncounted: true
      bare: true
    - lit: of
      consume_skipped: true
    - slot: item
      cat: material_resource
      uncounted: true
      bare: true
    - slot: future
      type: modal
    - slot: who
      type: entity
      common_noun_cat: intentional_agent
      referential: true
    - slot: need
      cat: component_requirement_verb
    - lit: for
      consume_skipped: true
    - lit: all
      consume_skipped: true
    - slot: months
      cat: calendar_month_unit
      counted: true
      bare: true
    - lit: '?'
      consume_skipped: true
  resolves:
    consumer: calendar-resource-total
    operation: months
    entity: '{who}'
    measure: '{unit}'
    month_count: '{months.value}'
  satisfies:
    need:
    - subject
  disambiguates:
  - unit
  - item
  - need
  - months
