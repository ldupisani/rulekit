format: rulekit/rules@1
rules:
- id: arithmetic/work-location-context
  phase: read
  match:
    sentence:
    - slot: who
      type: entity
      common_noun_cat: intentional_agent
      referential: true
      at_start: true
    - slot: work
      cat: scheduled_activity_verb
      finite_form: true
    - lit: in
      consume_skipped: true
    - slot: site
      cat: quantity_location
      uncounted: true
      bare: true
    - lit: .
      consume_skipped: true
  emits:
  - fact: batch_evidence
    kind: schedule-site
    entity: '{who}'
    measure: ''
    value: 0
    position: '{who.span_start}'
    container: '{site}'
  consumes:
  - work
  satisfies:
    work:
    - subject
  disambiguates:
  - work
  - site
- id: arithmetic/ordinary-daily-average
  phase: read
  match:
    sentence:
    - slot: who
      type: entity
      common_noun_cat: intentional_agent
      referential: true
      at_start: true
    - slot: act
      cat: recurring_quantity_verb
      finite_form: true
    - lit: an
      consume_skipped: true
    - slot: average
      cat: schedule_average_noun
    - lit: of
      consume_skipped: true
    - slot: amount
      cat: inventory_item
      counted: true
      bare: true
    - lit: every
      consume_skipped: true
    - slot: period
      cat: duration_measure
      uncounted: true
      bare: true
    - lit: .
      consume_skipped: true
  emits:
  - fact: batch_evidence
    kind: schedule-baseline
    entity: '{who}'
    measure: '{amount}'
    value: amount
    position: '{who.span_start}'
    marker: '{period}'
    verb: '{act}'
  consumes:
  - act
  - amount
  - average
  satisfies:
    act:
    - subject
  disambiguates:
  - act
  - average
  - amount
  - period
- id: arithmetic/weekday-relative-to-daily-average
  phase: read
  match:
    sentence:
    - lit: every
      consume_skipped: true
    - slot: weekday
      cat: named_weekday
      uncounted: true
      bare: true
    - opt:
      - lit: ','
        consume_skipped: true
    - slot: owner
      cat: possessive_determiner
    - slot: number
      cat: count_aggregate_noun
      uncounted: true
    - lit: of
      consume_skipped: true
    - slot: act
      cat: recurring_quantity_verb
      past_participle: true
    - slot: item
      cat: inventory_item
      uncounted: true
      bare: true
    - slot: be
      cat: copula
    - opt:
      - slot: approx
        cat: approximation_marker
    - slot: fraction
      type: fraction
    - slot: direction
      cat: higher
    - lit: than
      consume_skipped: true
    - slot: daily
      cat: daily_frequency_attribute
    - slot: average
      cat: schedule_average_noun
    - lit: .
      consume_skipped: true
  emits:
  - fact: batch_evidence
    kind: schedule-exception
    entity: '{number.owner}'
    measure: '{item}'
    value: fraction
    position: '{weekday.span_start}'
    marker: '{weekday}'
    verb: '{act}'
    sign: 1
    attribute: '{approx.optional}'
  consumes:
  - act
  - be
  - fraction
  - direction
  - average
  satisfies:
    be:
    - subject
    direction:
    - standard
  disambiguates:
  - weekday
  - owner
  - number
  - act
  - item
  - be
  - approx
  - direction
  - daily
  - average
- id: arithmetic/weekday-more-quantity
  phase: read
  match:
    sentence:
    - lit: on
      consume_skipped: true
    - slot: weekday
      cat: named_weekday
      uncounted: true
      bare: true
    - opt:
      - lit: ','
        consume_skipped: true
    - slot: who
      type: entity
      common_noun_cat: intentional_agent
      referential: true
    - slot: act
      cat: recurring_quantity_verb
    - slot: fraction
      type: fraction
    - slot: direction
      cat: count_quantity_delta
    - slot: item
      cat: inventory_item
      uncounted: true
      bare: true
    - lit: than
      consume_skipped: true
    - slot: daily
      cat: daily_frequency_attribute
    - slot: average
      cat: schedule_average_noun
    - lit: .
      consume_skipped: true
  where:
  - slot_not_category: {slot: direction, cat: lower}
  emits:
  - fact: batch_evidence
    kind: schedule-exception
    entity: '{who}'
    measure: '{item}'
    value: fraction
    position: '{weekday.span_start}'
    marker: '{weekday}'
    verb: '{act}'
    sign: 1
  consumes:
  - act
  - fraction
  - average
  satisfies:
    act:
    - subject
    direction:
    - standard
  disambiguates:
  - weekday
  - act
  - direction
  - item
  - daily
  - average
- id: arithmetic/named-month-activity-schedule
  phase: read
  match:
    sentence:
    - slot: who
      type: entity
      common_noun_cat: intentional_agent
      referential: true
      at_start: true
    - opt:
      - slot: like
        cat: preference_action
      - lit: to
        consume_skipped: true
    - slot: act
      cat: feeding_action
    - slot: recipient
      cat: allocation_recipient
      uncounted: true
      bare: true
    - lit: in
      consume_skipped: true
    - slot: months
      span: true
      enumeration_cat: named_month
    - lit: .
      consume_skipped: true
  emits:
  - fact: batch_evidence
    kind: calendar-months
    entity: '{who}'
    measure: ''
    value: 0
    position: '{who.span_start}'
    container: '{recipient}'
    members: '{months.members}'
    verb: '{act}'
  consumes:
  - like
  - act
  satisfies:
    like:
    - subject
    act:
    - subject
  disambiguates:
  - like
  - act
  - recipient
- id: arithmetic/daily-two-part-quantities
  phase: read
  match:
    sentence:
    - slot: who
      type: entity
      common_noun_cat: intentional_agent
      referential: true
      at_start: true
    - slot: act
      cat: feeding_action
    - slot: recipient
      type: pronoun
    - slot: first
      type: fraction
    - slot: unit
      cat: resource_measure_unit
      uncounted: true
      bare: true
    - lit: in
      consume_skipped: true
    - slot: part1
      cat: part_of_day
      uncounted: true
      bare: true
    - lit: and
      consume_skipped: true
    - slot: second
      type: fraction
    - slot: unit2
      cat: resource_measure_unit
      uncounted: true
      bare: true
    - lit: in
      consume_skipped: true
    - slot: part2
      cat: part_of_day
      uncounted: true
      bare: true
    - lit: .
      consume_skipped: true
  emits:
  - fact: batch_evidence
    kind: daily-portion
    entity: '{who}'
    measure: '{unit}'
    value: first
    position: '{first.span_start}'
    marker: '{part1}'
    container: '{recipient}'
    verb: '{act}'
  - fact: batch_evidence
    kind: daily-portion
    entity: '{who}'
    measure: '{unit2}'
    value: second
    position: '{second.span_start}'
    marker: '{part2}'
    container: '{recipient}'
    verb: '{act}'
  consumes:
  - act
  - first
  - second
  satisfies:
    act:
    - subject
    recipient:
    - refers
  disambiguates:
  - act
  - unit
  - part1
  - unit2
  - part2
- id: arithmetic/named-joint-plan-context
  phase: read
  match:
    sentence:
    - slot: a
      type: name
      at_start: true
    - lit: and
      consume_skipped: true
    - slot: b
      type: name
    - slot: make
      cat: production_quantity_verb
    - slot: plan
      cat: plan_noun
      uncounted: true
      bare: true
    - lit: to
      consume_skipped: true
    - slot: go
      cat: spatial_motion_verb
    - lit: on
      consume_skipped: true
    - slot: event
      cat: travel_event
      uncounted: true
    - lit: at
      consume_skipped: true
    - slot: end
      cat: period_boundary_noun
      uncounted: true
      bare: true
    - lit: of
      consume_skipped: true
    - slot: period
      cat: calendar_year_unit
      uncounted: true
      bare: true
    - lit: .
      consume_skipped: true
  emits:
  - fact: batch_evidence
    kind: saving-group
    entity: '{event}'
    measure: ''
    value: 0
    position: '{a.span_start}'
    container: '{a}'
    acquisition: '{b}'
  consumes:
  - make
  - go
  satisfies:
    make:
    - subject
    go:
    - subject
  disambiguates:
  - make
  - plan
  - go
  - event
  - end
  - period
- id: arithmetic/joint-saving-policy
  phase: read
  match:
    sentence:
    - slot: group
      cat: discourse_subject_group_pronoun
      at_start: true
    - opt:
      - lit: both
        consume_skipped: true
    - slot: decide
      cat: decision_action
    - lit: to
      consume_skipped: true
    - slot: work
      cat: scheduled_activity_verb
    - lit: as
      consume_skipped: true
    - slot: role
      cat: person
      uncounted: true
      bare: true
    - lit: and
      consume_skipped: true
    - slot: save
      cat: saving_action
    - slot: fraction
      type: fraction
    - lit: of
      consume_skipped: true
    - lit: what
      consume_skipped: true
    - slot: group2
      cat: discourse_subject_group_pronoun
    - slot: earn
      cat: income_action
    - lit: for
      consume_skipped: true
    - slot: owner
      cat: plural_possessive_determiner
    - slot: event
      cat: travel_event
      uncounted: true
    - lit: .
      consume_skipped: true
  emits:
  - fact: batch_evidence
    kind: saving-share
    entity: '{event}'
    measure: ''
    value: fraction
    position: '{fraction.span_start}'
  consumes:
  - decide
  - work
  - save
  - earn
  - fraction
  satisfies:
    group:
    - refers
    group2:
    - refers
    owner:
    - refers
    decide:
    - subject
    work:
    - subject
    save:
    - subject
    earn:
    - subject
  disambiguates:
  - group
  - decide
  - work
  - role
  - save
  - group2
  - earn
  - owner
  - event
- id: arithmetic/year-qualified-month-schedule
  phase: read
  match:
    sentence:
    - slot: who
      type: entity
      common_noun_cat: intentional_agent
      referential: true
      at_start: true
    - opt:
      - slot: like
        cat: preference_action
      - lit: to
        consume_skipped: true
    - slot: act
      cat: feeding_action
    - slot: recipient
      cat: allocation_recipient
      uncounted: true
      bare: true
    - lit: in
      consume_skipped: true
    - slot: months
      span: true
      enumeration_cat: named_month
    - lit: of
      consume_skipped: true
    - slot: year
      type: number
      integer: true
      value_positive: true
      standalone: true
    - lit: .
      consume_skipped: true
  emits:
  - fact: batch_evidence
    kind: calendar-months
    entity: '{who}'
    measure: ''
    value: 0
    position: '{who.span_start}'
    container: '{recipient}'
    members: '{months.members}'
    verb: '{act}'
    subtotal: year
  consumes:
  - like
  - act
  - year
  satisfies:
    like:
    - subject
    act:
    - subject
    year:
    - quantifies
  disambiguates:
  - like
  - act
  - recipient
- id: arithmetic/named-joint-saving-share
  phase: read
  match:
    sentence:
    - slot: a
      type: name
      at_start: true
    - lit: and
      consume_skipped: true
    - slot: b
