format: rulekit/rules@1
rules:
- id: arithmetic/named-indexed-activity-context
  phase: read
  match:
    sentence:
    - slot: a
      type: name
      at_start: true
    - lit: and
      consume_skipped: true
    - slot: b
      type: name
    - slot: have
      cat: possession_state
      finite_form: true
    - slot: event
      cat: indexed_activity_context
      uncounted: true
    - opt:
      - {lit: at, consume_skipped: true}
      - {slot: context, cat: activity_setting, uncounted: true}
    - lit: .
      consume_skipped: true
  emits:
  - fact: batch_evidence
    kind: indexed-participants
    entity: '{event}'
    measure: ''
    value: 0
    position: '{a.span_start}'
    container: '{a}'
    acquisition: '{b}'
  consumes:
  - have
  satisfies:
    have:
    - subject
  disambiguates:
  - have
  - event
  - context
- id: arithmetic/partitioned-indexed-activity
  phase: read
  match:
    sentence:
    - slot: event
      cat: indexed_activity_context
      uncounted: true
      bare: true
      at_start: true
    - slot: be
      cat: copula
    - slot: split
      cat: divide
      past_participle: true
    - lit: into
      consume_skipped: true
    - slot: periods
      cat: repeating_event
      counted: true
      bare: true
    - lit: .
      consume_skipped: true
  emits: &indexed_range
  - fact: batch_evidence
    kind: indexed-range
    entity: '{event}'
    measure: '{periods}'
    value: periods
    position: '{periods.span_start}'
  consumes:
  - be
  - split
  - periods
  satisfies:
    be:
    - subject
    split:
    - subject
  disambiguates:
  - event
  - be
  - split
  - periods
- id: arithmetic/indexed-additive-performance-comparison
  phase: read
  match:
    sentence:
    - slot: who
      type: entity
      common_noun_cat: intentional_agent
      referential: true
      at_start: true
    - slot: act
      cat: repetition_performance_verb
      finite_form: true
    - slot: amount
      type: number
    - slot: direction
      cat: count_quantity_delta
    - slot: item
      cat: repetition_count_unit
      uncounted: true
      bare: true
    - lit: than
      consume_skipped: true
    - slot: standard
      type: entity
      common_noun_cat: intentional_agent
      referential: true
    - {slot: scope, cat: temporal_interval_preposition}
    - slot: period
      cat: repeating_event
      uncounted: true
      qualified: true
    - lit: .
      consume_skipped: true
  emits:
  - fact: batch_evidence
    kind: indexed-relation
    entity: '{who}'
    measure: '{item}'
    value: amount
    position: '{who.span_start}'
    container: '{standard}'
    verb: '{act}'
    sign: sign(direction)
    attribute: '{period.qualifier}'
    marker: '{period}'
  consumes:
  - act
  - amount
  - direction
  satisfies:
    amount:
    - quantifies
  bindings:
    act:
      subject: who
  disambiguates:
  - act
  - item
  - scope
  - period
- id: arithmetic/uniform-indexed-performance
  phase: read
  match:
    sentence:
    - slot: who
      type: entity
      common_noun_cat: intentional_agent
      referential: true
      at_start: true
    - slot: act
      cat: repetition_performance_verb
      finite_form: true
    - slot: amount
      cat: repetition_count_unit
      counted: true
      bare: true
    - {slot: scope, cat: temporal_interval_preposition}
    - slot: each
      cat: distributive_quantifier
    - slot: period
      cat: repeating_event
      uncounted: true
      bare: true
      number: singular
    - lit: .
      consume_skipped: true
  emits:
  - fact: batch_evidence
    kind: indexed-uniform
    entity: '{who}'
    measure: '{amount}'
    value: amount
    position: '{who.span_start}'
    verb: '{act}'
    marker: '{period}'
  consumes:
  - act
  - amount
  satisfies:
    act:
    - subject
    each:
    - collection
  question_assumption: true
  disambiguates:
  - act
  - amount
  - scope
  - period
- id: arithmetic/uniform-repetition-frequency
  phase: read
  match:
    sentence:
    - slot: who
      type: entity
      common_noun_cat: intentional_agent
      referential: true
      at_start: true
    - slot: act
      cat: self_named_count_action
      finite_form: true
    - slot: amount
      type: multiplier
    - {slot: scope, cat: temporal_interval_preposition}
    - slot: each
      cat: distributive_quantifier
    - slot: period
      cat: repeating_event
      uncounted: true
      bare: true
      number: singular
    - lit: .
      consume_skipped: true
  emits:
  - fact: batch_evidence
    kind: indexed-uniform
    entity: '{who}'
    measure: '{act}'
    value: amount
    position: '{who.span_start}'
    verb: '{act}'
    marker: '{period}'
  consumes:
  - act
  - amount
  satisfies:
    act:
    - subject
    each:
    - collection
  question_assumption: true
  disambiguates:
  - act
  - period
asks:
- id: ask/mean-indexed-performance
  match:
    question:
    - lit: what
      consume_skipped: true
    - slot: be
      cat: copula
    - lit: the
      consume_skipped: true
    - lit: average
      consume_skipped: true
    - slot: number
      cat: count_aggregate_noun
      uncounted: true
      bare: true
    - lit: of
      consume_skipped: true
    - slot: item
      cat: repetition_count_unit
      uncounted: true
      bare: true
    - lit: per
      consume_skipped: true
    - slot: period
      cat: repeating_event
      uncounted: true
      bare: true
    - slot: complete
      cat: repetition_performance_verb
      past_participle: true
    - lit: by
      consume_skipped: true
    - slot: who
      type: entity
      common_noun_cat: intentional_agent
      referential: true
    - lit: '?'
      consume_skipped: true
  resolves: &indexed_mean
    consumer: scoped-comparison
    operation: indexed-mean
    entity: '{who}'
    measure: '{item}'
    period: '{period}'
  satisfies:
    be:
    - subject
    complete:
    - subject

- id: ask/mean-indexed-performance-active
  match:
    question:
    - {lit: what, at_start: true}
    - {slot: be, cat: singular_copula}
    - {lit: the, consume_skipped: true}
    - {slot: average, cat: mean_aggregate}
    - {slot: number, cat: count_aggregate_noun, uncounted: true, bare: true}
    - {lit: of}
    - &performance_item {slot: item, cat: repetition_count_unit, uncounted: true, bare: true, number: plural}
    - {lit: per}
    - &performance_period {slot: period, cat: repeating_event, uncounted: true, bare: true, number: singular}
    - &performer {slot: who, type: entity, common_noun_cat: intentional_agent, referential: true}
    - {slot: complete, cat: repetition_completion_verb, finite_form: true}
    - {lit: '?', consume_skipped: true}
  where: [{number_compatible: [who, complete]}]
  resolves: *indexed_mean
  satisfies: {be: [subject], complete: [subject]}
- id: ask/average-performance-per-period
  match:
    question:
    - {lit: how, at_start: true}
    - {lit: many}
    - *performance_item
    - {slot: aux, cat: do_support_auxiliary}
    - *performer
    - {slot: average, cat: averaging_verb, bare_form: true}
    - {lit: per}
    - *performance_period
    - {lit: '?', consume_skipped: true}
  where: [{number_compatible: [who, aux]}]
  resolves: *indexed_mean
  satisfies: {average: [subject]}
templates:
  indexed-activity-range:
    parameters:
      clause:
        - &event_subject {slot: event, cat: indexed_activity_context, uncounted: true, bare: true, number: singular, at_start: true}
        - {slot: verb, cat: whole_composition_verb, finite_form: true}
        - {lit: of, consume_skipped: true}
        - &event_periods {slot: periods, cat: indexed_activity_period, counted: true, bare: true}
      agreement: event
    rule:
      phase: read
      match:
        sentence:
        - {parameter: clause}
        - {lit: '.', consume_skipped: true}
      where: [{number_compatible: [{parameter: agreement}, verb]}]
      emits: *indexed_range
      consumes: [verb, periods]
      satisfies: {verb: [subject]}
      disambiguates: [event, verb, periods]
  indexed-fractional-performance:
    parameters:
      comparison:
        - {lit: the, consume_skipped: true}
        - {slot: number, cat: count_aggregate_noun, uncounted: true, bare: true}
        - {lit: of, consume_skipped: true}
      selections: [number]
    rule:
      phase: read
      match:
        sentence:
        - {slot: who, type: entity, common_noun_cat: intentional_agent, referential: true, at_start: true}
        - opt:
          - {slot: get, cat: acquire, finite_form: true}
          - {slot: condition, cat: performance_condition_attribute}
          - {lit: and, consume_skipped: true}
        - opt: [{lit: only, consume_skipped: true}]
        - {slot: act, cat: repetition_performance_verb, finite_form: true}
        - {slot: fraction, type: fraction}
        - {parameter: comparison}
        - *performance_item
        - {lit: as, consume_skipped: true}
        - {slot: standard, type: entity, common_noun_cat: intentional_agent, referential: true}
        - {slot: scope, cat: temporal_interval_preposition}
        - {slot: period, cat: repeating_event, uncounted: true, qualified: true}
        - {lit: '.', consume_skipped: true}
      emits:
      - {fact: batch_evidence, kind: indexed-relation, entity: '{who}', measure: '{item}', value: 0,
         position: '{who.span_start}', container: '{standard}', verb: '{act}', fraction: fraction,
         attribute: '{period.qualifier}', marker: '{period}'}
      consumes: [get, act, fraction]
      satisfies: {get: [subject], act: [subject]}
      disambiguates: [get, act, {parameter: selections}, item, scope, period]

variants:
- {id: arithmetic/indexed-activity-consists-of-periods, template: indexed-activity-range}
- id: arithmetic/indexed-activity-lasts-periods
  template: indexed-activity-range
  arguments:
    clause:
    - *event_subject
    - {slot: verb, cat: event_duration_verb, finite_form: true}
    - opt: [{lit: for, consume_skipped: true}]
    - *event_periods
- id: arithmetic/existential-indexed-activity-periods
  template: indexed-activity-range
  arguments:
    clause:
    - {lit: there, at_start: true}
    - {slot: verb, cat: copula}
    - *event_periods
    - {lit: in, consume_skipped: true}
    - {slot: event, cat: indexed_activity_context, uncounted: true, bare: true, number: singular}
    agreement: periods
- {id: arithmetic/indexed-fractional-performance-comparison, template: indexed-fractional-performance}
- id: arithmetic/indexed-fraction-as-many-performances
  template: indexed-fractional-performance
  arguments:
    comparison: [{lit: as}, {lit: many}]
    selections: []
