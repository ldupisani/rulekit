format: rulekit/rules@1
rules:
- id: arithmetic/measured-state-before-event
  phase: read
  match:
    sentence:
    - slot: who
      type: entity
      common_noun_cat: measurement_subject
      referential: true
      bare: true
      at_start: true
    - slot: state
      cat: measurement_mass_verb
      finite_form: true
    - opt:
      - {lit: in}
      - {lit: at}
    - slot: amount
      cat: mass_unit
      counted: true
      bare: true
    - opt: [{lit: [at, ','], consume_skipped: true}]
    - slot: span
      cat: duration_measure
      counted: true
      bare: true
    - {slot: horizon_link, cat: event_horizon_preposition}
    - slot: event
      cat: scheduled_event
      uncounted: true
      bare: true
    - lit: .
      consume_skipped: true
  emits:
  - fact: batch_evidence
    kind: forecast-opening
    entity: '{who}'
    measure: '{amount}'
    value: amount
    position: '{amount.span_start}'
    per_member: span
    container: '{event}'
    acquisition: '{span}'
  consumes:
  - state
  - amount
  - span
  bindings:
    state:
      subject: who
  where: [{number_compatible: [who, state]}]
  description: Keep an observed measurement, explicit time to an event and a planned change rate as separate
    operands.
asks:
- id: ask/projected-measurement-at-event
  match:
    question:
    - lit: how
      at_start: true
    - lit: much
    - slot: modal
      type: future_modal
    - slot: who
      type: entity
      common_noun_cat: measurement_subject
      referential: true
      bare: true
    - slot: state
      cat: measurement_mass_verb
      bare_form: true
    - {slot: time_link, cat: event_time_preposition}
    - opt:
      - {slot: day, cat: event_date_anchor, uncounted: true, bare: true}
      - {lit: of}
    - {lit: the, consume_skipped: true}
    - slot: event
      cat: scheduled_event
      uncounted: true
      bare: true
    - lit: '?'
      consume_skipped: true
  resolves:
    consumer: projected-measured-state
    entity: '{who}'
    event: '{event}'
  satisfies:
    state:
    - subject

- id: ask/projected-nominal-measurement-at-event
  match:
    question:
    - {lit: what, at_start: true}
    - {slot: modal, type: future_modal}
    - {slot: who, cat: third_person_animate_possessive_determiner}
    - {slot: state, cat: mass_dimension_noun, uncounted: true, possessed: true}
    - {slot: be, cat: copular_infinitive, bare_form: true}
    - {slot: time_link, cat: event_time_preposition}
    - opt:
      - {slot: day, cat: event_date_anchor, uncounted: true, bare: true}
      - {lit: of}
    - {lit: the, consume_skipped: true}
    - {slot: event, cat: scheduled_event, uncounted: true, bare: true}
    - {lit: '?', consume_skipped: true}
  resolves: {consumer: projected-measured-state, entity: '{who}', event: '{event}'}
  satisfies: {be: [subject]}
templates:
  measured-rate-to-event:
    parameters:
      opening: []
      subject: {slot: who, type: entity, common_noun_cat: measurement_subject, referential: true, bare: true, at_start: true}
      frame: []
      form: {slot: change, cat: measurement_change_verb, finite_form: true}
      cause: ""
      action: ""
      consumes: [change, amount]
      satisfies: {change: [subject]}
      bindings: {}
      references: {}
      where: [{number_compatible: [who, change]}]
      disambiguates: [change]
      conditional: false
    rule:
      phase: read
      description: Preserve the subject, rate, deadline and any explicitly stated means of change.
      question_assumption: {parameter: conditional}
      match:
        sentence:
        - {parameter: opening}
        - {parameter: subject}
        - {parameter: frame}
        - {parameter: form}
        - {slot: amount, cat: mass_unit, counted: true, bare: true}
        - {lit: per}
        - {slot: period, cat: duration_measure, uncounted: true, bare: true}
        - {lit: until}
        - opt:
          - {slot: day, cat: event_date_anchor, uncounted: true, bare: true}
          - {lit: of}
        - {lit: the, consume_skipped: true}
        - {slot: event, cat: scheduled_event, uncounted: true, bare: true}
        - {lit: '.', consume_skipped: true}
      emits:
      - {fact: batch_evidence, kind: forecast-rate, entity: '{who}', measure: '{amount}', value: amount,
         position: '{amount.span_start}', container: '{event}', acquisition: '{period}',
         verb: '{change}', sign: sign(change), attribute: {parameter: cause}, marker: {parameter: action}}
      consumes: {parameter: consumes}
      satisfies: {parameter: satisfies}
      disambiguates: {parameter: disambiguates}
      bindings: {parameter: bindings}
      references: {parameter: references}
      where: {parameter: where}
variants:
- id: arithmetic/measured-rate-until-event
  template: measured-rate-to-event
  arguments: {conditional: true}
- id: arithmetic/planned-measured-rate-until-event
  template: measured-rate-to-event
  arguments:
    frame:
    - {slot: be, cat: specification_adoption_predicate, finite_form: true}
    - {slot: link, cat: specification_adoption_preposition}
    - {slot: plan, cat: specification_noun, uncounted: true, bare: true}
    - {lit: that}
    - {slot: cause, cat: specification_infinitive_cause, finite_form: true}
    - {slot: recipient, cat: singular_animate_object_pronoun}
    - {lit: to}
    form: {slot: change, cat: measurement_change_verb, bare_form: true}
    cause: '{plan}'
    action: '{cause}'
    consumes: [be, cause, change, amount]
    satisfies: {be: [subject], cause: [subject], change: [subject]}
    bindings: {link: {object: plan}}
    references: {recipient: who}
    where: [{number_compatible: [who, be]}]
    disambiguates: [change, plan]
- id: arithmetic/caused-bare-measured-rate-until-event
  template: measured-rate-to-event
  arguments:
    frame:
    - {slot: be, cat: specification_adoption_predicate, finite_form: true}
    - {slot: link, cat: specification_adoption_preposition}
    - {slot: plan, cat: specification_noun, uncounted: true, bare: true}
    - {lit: that}
    - {slot: cause, cat: specification_bare_cause, finite_form: true}
    - {slot: recipient, cat: singular_animate_object_pronoun}
    form: {slot: change, cat: measurement_change_verb, bare_form: true}
    cause: '{plan}'
    action: '{cause}'
    consumes: [be, cause, change, amount]
    satisfies: {be: [subject], cause: [subject], change: [subject]}
    bindings: {link: {object: plan}}
    references: {recipient: who}
    where: [{number_compatible: [who, be]}]
    disambiguates: [change, plan]
- id: arithmetic/resulting-measured-rate-until-event
  template: measured-rate-to-event
  arguments:
    frame:
    - {slot: be, cat: specification_adoption_predicate, finite_form: true}
    - {slot: link, cat: specification_adoption_preposition}
    - {slot: plan, cat: specification_noun, uncounted: true, bare: true}
    - {lit: that}
    - {slot: cause, cat: specification_result_predicate, finite_form: true}
    - {lit: in}
    - {slot: recipient, cat: singular_animate_object_pronoun}
    form: {slot: change, cat: measurement_change_verb, present_participle: true}
    cause: '{plan}'
    action: '{cause}'
    consumes: [be, cause, change, amount]
    satisfies: {be: [subject], cause: [subject], change: [subject]}
    bindings: {link: {object: plan}}
    references: {recipient: who}
    where: [{number_compatible: [who, be]}]
    disambiguates: [change, plan]
- id: arithmetic/adopted-specification-and-measured-rate
  template: measured-rate-to-event
  arguments:
    frame:
    - {slot: be, cat: specification_adoption_predicate, finite_form: true}
    - {slot: link, cat: specification_adoption_preposition}
    - {slot: plan, cat: specification_noun, uncounted: true, bare: true}
    - {lit: and}
    cause: '{plan}'
    consumes: [be, change, amount]
    satisfies: {be: [subject], change: [subject]}
    bindings: {link: {object: plan}}
    where: [{number_compatible: [who, be, change]}]
    disambiguates: [change, plan]
- id: arithmetic/means-prefaced-measured-rate
  template: measured-rate-to-event
  arguments:
    subject: {slot: who, type: entity, common_noun_cat: measurement_subject, referential: true, bare: true}
    opening:
    - {slot: link, cat: intervention_means_preposition, at_start: true}
    - {slot: means, cat: measured_change_intervention, uncounted: true}
    - opt: [{lit: ',', consume_skipped: true}]
    cause: '{means}'
    bindings: {link: {object: means}}
- id: arithmetic/action-prefaced-measured-rate
  template: measured-rate-to-event
  arguments:
    subject: {slot: who, type: entity, common_noun_cat: measurement_subject, referential: true, bare: true}
    opening:
    - {slot: link, cat: intervention_means_preposition, at_start: true}
    - {slot: action, cat: measured_change_intervention_action, present_participle: true}
    - {slot: owner, cat: possessive_determiner}
    - {slot: means, cat: specification_noun, uncounted: true}
    - opt: [{lit: ',', consume_skipped: true}]
    cause: '{means}'
    action: '{action}'
    consumes: [action, change, amount]
    satisfies: {action: [subject], change: [subject]}
    bindings: {action: {dobj: means}, link: {object: action}}
    references: {owner: who}
