        sentence:
        - slot: who
          type: entity
          common_noun_cat: quantity_event_participant
          referential: true
          at_start: true
          bare: true
        - slot: acquire
          cat: batch_acquisition_verb
          finite_form: true
        - slot: item
          cat: ownable_quantity_object
          counted: true
          value_min: 1
          bare: true
        - slot: join
          cat: batch_continuation_conjunction
        - opt:
          - slot: again
            cat: batch_repetition_adverb
        - slot: verb
          cat: batch_disposal_verb
          finite_form: true
        - slot: share
          type: fraction
          word_fraction_within_whole: true
        - lit: of
        - slot: them
          cat: plural_object_pronoun
        - parameter: ending
        - lit: .
          consume_skipped: true
      where:
      - number_compatible:
        - who
        - acquire
      - verb_roles_compatible:
          verb: acquire
          roles:
            theme:
            - item
          require_declared_frame: true
      - verb_roles_compatible:
          verb: verb
          roles:
            theme:
            - item
          require_declared_frame: true
      satisfies:
        parameter: satisfaction
      consumes:
      - item
      - share
      emits:
      - fact: batch_evidence
        kind: acquired-discard
        entity: '{who}'
        measure: '{item}'
        value: item
        position: '{item.span_start}'
        fraction: share
        verb: '{verb.optional}'
        acquisition: '{acquire}'
