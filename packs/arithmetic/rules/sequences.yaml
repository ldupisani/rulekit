format: rulekit/rules@1
rules:

  - id: arithmetic/carrier-event-cadence
    phase: read
    description: >
      "Mira delivers a box once every two days" states a carrier-event cadence. The number of contents per carrier is deliberately
      unknown. A later total and adjacent-term relation may determine those amounts.
    match:
      sentence:
        - {slot: who, type: entity, common_noun_cat: quantity_event_participant, at_start: true}
        - {slot: verb, cat: carrier_transitive_event_verb, finite_form: true}
        - {lit: a, consume_skipped: true}
        - {slot: series, cat: sequence_carrier, number: singular, uncounted: true, bare: true}
        - {slot: frequency, type: multiplier}
        - {lit: every}
        - {slot: interval, cat: duration_measure, counted: true, value_min: 1}
        - {lit: ., consume_skipped: true}
    where:
      - number_compatible: [who, verb]
      - slot_not_category: {slot: frequency, cat: predeterminer_multiplier}
    consumes: [frequency, interval]
    emits:
      - fact: event_cadence
        entity: '{who}'
        entity_qualifier: '{who.qualifier}'
        verb: '{verb}'
        series: '{series}'
        value: frequency
        elapsed: interval
        unit: '{interval}'

  - id: arithmetic/purpose-carrier-event-cadence
    phase: read
    description: >
      A recurring departure or return may name the carrier event as its purpose. This preserves cadence and the named event
      separately from motion and an optional nonnumeric motive. Interpreting the event as covering one whole carrier is a
      reported assumption of the sequence consumer, not a general fact about motion or consumption.
    match:
      sentence:
        - {slot: who, type: entity, common_noun_cat: quantity_event_participant, at_start: true}
        - {slot: motion, cat: sequence_motion_verb, finite_form: true}
        - opt:
            - {slot: from, cat: sequence_origin_preposition}
            - {slot: origin, cat: quantity_location, uncounted: true}
        - {slot: frequency, type: multiplier}
        - {lit: every}
        - {slot: interval, cat: duration_measure, counted: true, value_min: 1}
        - {lit: to}
        - {slot: verb, cat: sequence_event_verb, bare_form: true}
        - opt:
            - {slot: on, cat: carrier_event_object_preposition}
        - {lit: a, consume_skipped: true}
        - {slot: series, cat: sequence_carrier, number: singular, uncounted: true, bare: true}
        - opt:
            - {lit: and}
            - {slot: motive_verb, cat: sequence_motive_verb, bare_form: true}
            - {slot: poss, cat: possessive_determiner}
            - {slot: motive, cat: sequence_motive_noun, uncounted: true}
        - {lit: ., consume_skipped: true}
    where:
      - number_compatible: [who, motion]
      - slot_not_category: {slot: frequency, cat: predeterminer_multiplier}
      - bound_requires_category: {bound: on, slot: verb, cat: carrier_prepositional_event_verb}
      - category_requires_bound: {slot: verb, cat: carrier_prepositional_event_verb, bound: on}
    consumes: [frequency, interval]
    emits:
      - fact: event_cadence
        entity: '{who}'
        entity_qualifier: '{who.qualifier}'
        verb: '{verb}'
        series: '{series}'
        value: frequency
        elapsed: interval
        unit: '{interval}'

  - id: arithmetic/bounded-sequence-event-total
    phase: read
    description: >
      "Over six days, Mira has delivered seventy toys" preserves a total and its duration. It does not assert seventy toys
      per delivery. A neutral subject pronoun stays symbolic until the consumer can bind it to one preceding cadence with
      a compatible event.
    match:
      sentence:
        - {slot: prep, cat: sequence_elapsed_preposition, at_start: true}
        - {slot: span, cat: duration_measure, counted: true, value_min: 1}
        - {lit: ',', consume_skipped: true}
        - {slot: who, type: entity, common_noun_cat: quantity_event_participant, referential: true,
            bare_reference_category: bare_entity_reference}
        - {slot: verb, cat: carrier_transitive_event_verb, past_participle: true}
        - {slot: amount, type: counted}
        - {lit: ., consume_skipped: true}
    where:
      - number_compatible: [who, verb]
      - slot_not_category: {slot: amount, cat: many_incompatible_noun}
    consumes: [span, amount]
    emits:
      - fact: sequence_total
        entity: '{who}'
        entity_qualifier: '{who.qualifier}'
        verb: '{verb}'
        measure: '{amount}'
        value: amount
        elapsed: span
        unit: '{span}'

  - id: arithmetic/bounded-sequence-anaphoric-total
    phase: read
    generation: contextual
    generation_context:
      before:
        - sentence:
            - {slot: context_actor, type: name}
            - {slot: context_event, cat: carrier_transitive_event_verb, finite_form: true}
            - {lit: a, consume_skipped: true}
            - {slot: context_carrier, cat: sequence_carrier, number: singular, bare: true}
            - {slot: context_frequency, type: multiplier}
            - {lit: every}
            - {slot: context_interval, cat: duration_measure, counted: true, value_min: 1}
      target_identity_links: {context_event: verb}
      required_fact_counts: {event_cadence: 1}
    description: >
      A neutral pronoun can name the cadence actor in a bounded event total. The fact preserves the pronoun unless ordinary
      discourse has already resolved it. Only one preceding compatible cadence can resolve a remaining symbolic subject; this
      rule never invents a global referent.
    match:
      sentence:
        - {slot: prep, cat: sequence_elapsed_preposition, at_start: true}
        - {slot: span, cat: duration_measure, counted: true, value_min: 1}
        - {lit: ',', consume_skipped: true}
        - {slot: who, cat: sequence_singular_anaphor}
        - {slot: verb, cat: carrier_transitive_event_verb, past_participle: true}
        - {slot: amount, type: counted}
        - {lit: ., consume_skipped: true}
    consumes: [span, amount]
    where:
      - slot_not_category: {slot: amount, cat: many_incompatible_noun}
    emits:
      - fact: sequence_total
        entity: '{who}'
        verb: '{verb}'
        measure: '{amount}'
        value: amount
        elapsed: span
        unit: '{span}'

asks:

  - id: ask/ordered-carrier-contents
    # Contents of an explicitly indexed carrier in one bounded series.
    match:
      question:
        - {lit: how}
        - {lit: many}
        - {slot: item, type: plural}
        - {slot: copula, cat: plural_copula}
        - {slot: prep, cat: sequence_location_preposition}
        - {slot: series, cat: sequence_carrier, qualified: true, qualifier_cat: sequence_index_descriptor, number:
            singular, referential: true}
        - {lit: '?', consume_skipped: true}
    where:
      - slot_not_category: {slot: item, cat: many_incompatible_noun}
    resolves:
      consumer: ordered-sequence
      series: '{series}'
      measure: '{item}'
      index: '{series.qualifier}'

  - id: ask/ordered-carrier-event-period
    # Actor, event, carrier and indexed interval must agree with the premises.
    match:
      question:
        - {lit: how}
        - {lit: many}
        - {slot: item, type: plural}
        - {slot: copula, cat: plural_copula}
        - {slot: prep, cat: sequence_location_preposition}
        - {slot: series, cat: sequence_carrier, number: singular, referential: true, bare: true}
        - {slot: who, type: entity, common_noun_cat: quantity_event_participant, referential: true}
        - {slot: verb, cat: carrier_transitive_event_verb, finite_form: true}
        - {lit: in}
        - {slot: period, cat: duration_measure, counted: true, qualified: true, qualifier_cat: sequence_index_descriptor}
        - {lit: '?', consume_skipped: true}
    where:
      - slot_not_category: {slot: item, cat: many_incompatible_noun}
    resolves:
      consumer: ordered-sequence
      series: '{series}'
      measure: '{item}'
      entity: '{who}'
      entity_qualifier: '{who.qualifier}'
      verb: '{verb}'
      index: '{period.qualifier}'
      period: '{period.value}'
      unit: '{period}'

templates:

  adjacent-carrier:
    parameters:
      opening:
        tokens:
          - {lit: each, at_start: true}
        guards: []
      comparison:
        tokens:
          - {lit: as}
          - {lit: many}
        join: {lit: as}
        guards: []
        consumes: []
        emits:
          - fact: sequence_step
            series: '{series}'
            measure: '{item}'
            factor: 1
    rule:
      phase: read
      match:
        sentence:
          - {parameter: opening.tokens}
          - {slot: series, cat: sequence_carrier, qualified: true, qualifier_cat: sequence_current_descriptor, number:
              singular}
          - {slot: verb, cat: container_content_state_verb, finite_form: true}
          - {parameter: comparison.tokens}
          - {slot: item, type: plural}
          - {parameter: comparison.join}
          - {slot: previous, cat: sequence_carrier, qualified: true, qualifier_cat: sequence_previous_descriptor, number:
              singular, referential: true}
          - {lit: ., consume_skipped: true}
      where:
        - {same_lemma: [series, previous]}
        - {parameter: opening.guards}
        - {number_compatible: [series, verb]}
        - {parameter: comparison.guards}
        - slot_not_category: {slot: item, cat: many_incompatible_noun}
      emits: {parameter: comparison.emits}
      consumes: {parameter: comparison.consumes}

variants:

  - id: arithmetic/adjacent-carrier-multiplier
    template: adjacent-carrier
    description: >
      Each new carrier has a stated multiple of the previous carrier's contents. The two carrier mentions denote distinct
      occurrences, not a self-relation on one holder. An optional qualitative construction background supplies no arithmetic
      amount.
    arguments:
      opening:
        tokens:
          - opt:
              - {slot: background, cat: sequence_carrier, number: plural, at_start: true}
              - {slot: passive, cat: sequence_passive_auxiliary}
              - {slot: creation, cat: sequence_creation_verb}
              - {slot: growth, cat: sequence_growth_descriptor}
              - {slot: elapsed_prep, cat: sequence_elapsed_preposition}
              - {slot: time, cat: abstract_time_noun, uncounted: true}
              - {lit: ',', consume_skipped: true}
              - {slot: result, cat: sequence_result_conjunction}
          - {lit: each}
        guards:
          - {same_lemma: [background, series]}
          - {number_compatible: [background, passive]}
      comparison:
        tokens:
          - {slot: factor, type: nonunit_multiplier}
          - {lit: as}
          - {lit: many}
        join: {lit: as}
        guards:
          - slot_not_category: {slot: factor, cat: predeterminer_multiplier}
        consumes: [factor]
        emits:
          - fact: sequence_step
            series: '{series}'
            measure: '{item}'
            factor: factor

  - id: arithmetic/adjacent-carrier-equative
    template: adjacent-carrier
    description: >
      Each new carrier has as many items as the previous carrier. The plain equative fixes the adjacent factor at one; a frequency
      adverb is not a valid substitute for this comparison.

  - id: arithmetic/adjacent-carrier-offset
    template: adjacent-carrier
    description: >
      "Each new box has five more toys than the last box" records an additive step using the same affine relation as multiplicative
      series. Positive and negative steps retain their declared direction.
    arguments:
      comparison:
        tokens:
          - {slot: amount, type: number, standalone: true}
          - {slot: dir, cat: count_quantity_delta}
        join: {lit: than}
        guards: []
        consumes: [amount]
        emits:
          - fact: sequence_step
            series: '{series}'
            measure: '{item}'
            offset: amount * sign(dir)

  - id: arithmetic/adjacent-carrier-fraction
    template: adjacent-carrier
    description: >
      A fractional adjacent-term comparison shares the multiplicative sequence fact. This includes decreasing sequences without
      rewriting the fraction into a percentage or a rounded count.
    arguments:
      comparison:
        tokens:
          - {slot: factor, type: fraction, fraction_positive: true}
          - {lit: as}
          - {lit: many}
        join: {lit: as}
        guards: []
        consumes: [factor]
        emits:
          - fact: sequence_step
            series: '{series}'
            measure: '{item}'
            factor: factor
