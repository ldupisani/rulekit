format: rulekit/rules@1
rules:
- id: arithmetic/named-shared-quantity
  description: A named group has one shared lot available for later distribution or use.
  match:
    sentence:
    - {slot: people, span: true, enumeration_cat: name, enumeration_min_members: 2, at_start: true}
    - {slot: action, cat: shared_lot_verb, finite_form: true}
    - {slot: items, cat: inventory_item, counted: true, class_only: true}
    - opt:
      - {slot: from, cat: transaction_supplier_preposition}
      - {slot: supplier, cat: purchase_context_site, uncounted: true, referential: true}
    - {lit: '.', consume_skipped: true}
  consumes: [action, items]
  satisfies: {action: [subject, dobj], from: [object]}
  emits:
  - {fact: batch_evidence, kind: shared-lot, entity: '', measure: '{items}', value: items,
     attribute: '{items.qualifier}', verb: '{action}', position: '{items.span_start}', members: '{people.members}'}
- id: arithmetic/distributed-relative-use
  description: Each listed participant used a stated multiple of the standard participant's amount.
  match:
    sentence:
    - {slot: people, span: true, enumeration_cat: name, enumeration_min_members: 2, at_start: true}
    - {slot: each, cat: postpositive_distributive_quantifier}
    - {slot: action, cat: component_depletion_verb, finite_form: true}
    - {slot: factor, type: multiplier}
    - {lit: as}
    - {lit: many}
    - opt: [{slot: item, cat: inventory_item, uncounted: true, class_only: true}]
    - {lit: as}
    - {slot: standard, type: name}
    - opt: [{slot: repeated, cat: past_factual_auxiliary}]
    - {lit: '.', consume_skipped: true}
  consumes: [action, factor, repeated]
  satisfies: {each: [collection], action: [subject, dobj], repeated: [subject]}
  emits:
  - {fact: batch_evidence, kind: shared-lot-relative-use, entity: '{standard}', measure: '{item.optional}',
     container: '{item.optional}', value: factor, verb: '{action}', position: '{factor.span_start}', members: '{people.members}'}
- id: arithmetic/named-individual-portions
  phase: read
  description: A named group acquires one divisible whole per person with a common piece count.
  match:
    sentence:
    - {slot: people, span: true, enumeration_cat: name, at_start: true}
    - {lit: each}
    - {slot: acquisition, cat: portion_acquisition_verb, finite_form: true}
    - {slot: whole, cat: decomposable_quantity_whole, uncounted: true}
    - {slot: division, cat: portion_division_verb}
    - {lit: into}
    - {slot: parts, cat: component_quantity_measure, counted: true, bare: true}
    - {lit: '.', consume_skipped: true}
  consumes: [parts]
  satisfies: {acquisition: [subject], division: [subject]}
  emits:
  - {fact: batch_evidence, kind: component-population, entity: '{whole}', measure: '{parts}', value: parts,
     position: '{parts.span_start}', members: '{people.members}'}
- id: arithmetic/named-portion-consumption
  phase: read
  description: A named subgroup explicitly uses a fraction of its own divisible wholes.
  match:
    sentence:
    - {slot: people, span: true, enumeration_cat: name, at_start: true}
    - {slot: consumption, cat: component_depletion_verb, finite_form: true}
    - {slot: fraction, type: fraction}
    - {lit: of}
    - opt:
      - {slot: owner, cat: possessive_determiner}
    - {slot: whole, cat: decomposable_quantity_whole, uncounted: true}
    - {lit: '.', consume_skipped: true}
  where:
  - verb_roles_compatible:
      verb: consumption
      roles: {theme: [whole]}
      frame_categories: [eating_quantity_verb]
  consumes: [fraction]
  satisfies: {consumption: [subject], owner: [refers]}
  emits:
  - {fact: batch_evidence, kind: component-share, entity: '{whole}', measure: '{whole}', value: fraction,
     position: '{fraction.span_start}', members: '{people.members}', attribute: '{owner.optional}', verb: '{consumption}'}
asks:
- id: ask/portion-pieces-left-unconsumed
  match:
    question:
    - {lit: how, at_start: true}
    - {lit: many}
    - {slot: parts, cat: component_quantity_measure, uncounted: true, number: plural}
    - {slot: cop, cat: plural_copula}
    - {lit: left}
    - opt:
      - {slot: state, cat: component_residual_attribute}
    - {lit: '?', consume_skipped: true}
  resolves: {consumer: portion-remainder, measure: '{parts}', whole: '{parts.qualifier}'}
- id: ask/portion-pieces-unconsumed
  match:
    question:
    - {lit: how, at_start: true}
    - {lit: many}
    - {slot: parts, cat: component_quantity_measure, uncounted: true, number: plural}
    - {slot: cop, cat: plural_copula}
    - {slot: state, cat: component_residual_attribute}
    - {lit: '?', consume_skipped: true}
  resolves: {consumer: portion-remainder, measure: '{parts}', whole: '{parts.qualifier}'}
