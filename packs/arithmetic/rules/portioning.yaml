format: rulekit/rules@1
rules:
- id: arithmetic/named-individual-portions
  phase: read
  description: A named group acquires one divisible whole per person with a common piece count.
  match:
    sentence:
    - {slot: people, span: true, enumeration_cat: name, at_start: true}
    - {lit: each}
    - {slot: acquisition, cat: portion_acquisition_verb, finite_form: true}
    - {slot: whole, cat: decomposable_quantity_whole, uncounted: true}
    - {slot: division, cat: portion_division_verb}
    - {lit: into}
    - {slot: parts, cat: component_quantity_measure, counted: true, bare: true}
    - {lit: '.', consume_skipped: true}
  consumes: [parts]
  satisfies: {acquisition: [subject], division: [subject]}
  emits:
  - {fact: batch_evidence, kind: component-population, entity: '{whole}', measure: '{parts}', value: parts,
     position: '{parts.span_start}', members: '{people.members}'}
- id: arithmetic/named-portion-consumption
  phase: read
  description: A named subgroup explicitly uses a fraction of its own divisible wholes.
  match:
    sentence:
    - {slot: people, span: true, enumeration_cat: name, at_start: true}
    - {slot: consumption, cat: component_depletion_verb, finite_form: true}
    - {slot: fraction, type: fraction}
    - {lit: of}
    - opt:
      - {slot: owner, cat: possessive_determiner}
    - {slot: whole, cat: decomposable_quantity_whole, uncounted: true}
    - {lit: '.', consume_skipped: true}
  where:
  - verb_roles_compatible:
      verb: consumption
      roles: {theme: [whole]}
      frame_categories: [eating_quantity_verb]
  consumes: [fraction]
  satisfies: {consumption: [subject], owner: [refers]}
  emits:
  - {fact: batch_evidence, kind: component-share, entity: '{whole}', measure: '{whole}', value: fraction,
     position: '{fraction.span_start}', members: '{people.members}', attribute: '{owner.optional}', verb: '{consumption}'}
asks:
- id: ask/portion-pieces-left-unconsumed
  match:
    question:
    - {lit: how, at_start: true}
    - {lit: many}
    - {slot: parts, cat: component_quantity_measure, uncounted: true, number: plural}
    - {slot: cop, cat: plural_copula}
    - {lit: left}
    - opt:
      - {slot: state, cat: component_residual_attribute}
    - {lit: '?', consume_skipped: true}
  resolves: {consumer: portion-remainder, measure: '{parts}', whole: '{parts.qualifier}'}
- id: ask/portion-pieces-unconsumed
  match:
    question:
    - {lit: how, at_start: true}
    - {lit: many}
    - {slot: parts, cat: component_quantity_measure, uncounted: true, number: plural}
    - {slot: cop, cat: plural_copula}
    - {slot: state, cat: component_residual_attribute}
    - {lit: '?', consume_skipped: true}
  resolves: {consumer: portion-remainder, measure: '{parts}', whole: '{parts.qualifier}'}
