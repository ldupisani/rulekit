format: rulekit/rules@1
templates:
  prior-basket-sales-1:
    parameters:
      opening: []
      closing: []
    rule:
      phase: read
      description: Product counts sold in one explicitly prior period.
      match:
        sentence:
        - {parameter: opening}
        - {slot: who, type: entity, common_noun_cat: animate, referential: true, bare: true}
        - {slot: sale, cat: sell, finite_form: true}
        - {slot: item0, cat: commercial_product, counted: true}
        - {parameter: closing}
        - {lit: ., consume_skipped: true}
      consumes:
      - item0
      emits:
      - fact: commercial_term
        entity: '{who}'
        item: '{item0}'
        qualifier: '{item0.qualifier}'
        basis: basket-count
        measure: ''
        value: item0
        period: '{period}'
  prior-basket-sales-2:
    parameters:
      opening: []
      closing: []
    rule:
      phase: read
      description: Product counts sold in one explicitly prior period.
      match:
        sentence:
        - {parameter: opening}
        - {slot: who, type: entity, common_noun_cat: animate, referential: true, bare: true}
        - {slot: sale, cat: sell, finite_form: true}
        - {slot: item0, cat: commercial_product, counted: true}
        - {lit: and}
        - {slot: item1, cat: commercial_product, counted: true}
        - {parameter: closing}
        - {lit: ., consume_skipped: true}
      consumes:
      - item0
      - item1
      emits:
      - fact: commercial_term
        entity: '{who}'
        item: '{item0}'
        qualifier: '{item0.qualifier}'
        basis: basket-count
        measure: ''
        value: item0
        period: '{period}'
      - fact: commercial_term
        entity: '{who}'
        item: '{item1}'
        qualifier: '{item1.qualifier}'
        basis: basket-count
        measure: ''
        value: item1
        period: '{period}'
variants:
- id: arithmetic/prior-basket-sales-1-front
  template: prior-basket-sales-1
  arguments:
    opening:
    - {slot: period, cat: duration_measure, uncounted: true, qualified: true, qualifier_cat:
        sequence_previous_descriptor}
- id: arithmetic/prior-basket-sales-1-end
  template: prior-basket-sales-1
  arguments:
    closing:
    - {slot: period, cat: duration_measure, uncounted: true, qualified: true, qualifier_cat:
        sequence_previous_descriptor}
- id: arithmetic/prior-basket-sales-2-front
  template: prior-basket-sales-2
  arguments:
    opening:
    - {slot: period, cat: duration_measure, uncounted: true, qualified: true, qualifier_cat:
        sequence_previous_descriptor}
- id: arithmetic/prior-basket-sales-2-end
  template: prior-basket-sales-2
  arguments:
    closing:
    - {slot: period, cat: duration_measure, uncounted: true, qualified: true, qualifier_cat:
        sequence_previous_descriptor}
rules:
- id: arithmetic/named-sales-purpose-context
  match:
    sentence:
    - {slot: people, span: true, enumeration_cat: name, enumeration_min_members: 2, at_start: true}
    - {slot: be, cat: plural_copula}
    - {slot: sell, cat: sale_activity_verb, present_participle: true}
    - {slot: product, cat: commercial_product, uncounted: true}
    - {lit: to}
    - opt: [{slot: help, cat: revenue_purpose_support_verb, bare_form: true}]
    - {slot: fund, cat: revenue_purpose_verb, bare_form: true}
    - {slot: owner, cat: group_possessive_determiner}
    - {slot: purpose, cat: revenue_purpose_noun, uncounted: true}
    - {lit: '.', consume_skipped: true}
  consumes: [be, sell, help, fund]
  satisfies: {be: [subject], sell: [subject], help: [subject], fund: [subject], owner: [refers]}
  emits:
  - {fact: batch_evidence, kind: sales-purpose, entity: '', measure: '{product}', attribute: '{product.qualifier}',
     marker: '{purpose}', container: '{purpose}', members: '{people.members}', value: 0, position: '{sell.span_start}'}
- id: arithmetic/individual-commercial-count-with-total
  match:
    sentence:
    - {slot: who, type: entity, common_noun_cat: animate, referential: true, at_start: true}
    - {slot: sale, cat: sell, finite_form: true}
    - {slot: product, cat: commercial_product, counted: true, class_only: true}
    - opt: [{slot: prep, cat: group_total_preposition}]
    - {slot: total, cat: group_total_marker}
    - {lit: '.', consume_skipped: true}
  where:
  - number_compatible: [who, sale]
  - bound_requires_category: {bound: prep, slot: total, cat: prepositional_group_total_marker}
  consumes: [sale, product, total]
  satisfies: {sale: [subject, dobj], prep: [object]}
  emits:
  - {fact: quantity, entity: '{who}', measure: '{product}', measure_qualifier: '{product.qualifier}', value: product, verb: '{sale}'}
- id: arithmetic/commercial-work-context
  phase: read
  description: A participant makes a declared product and offers that product at a declared location.
  match:
    sentence:
    - {slot: who, type: entity, common_noun_cat: animate, referential: true, bare: true, at_start: true}
    - {slot: production, cat: commercial_production_verb, finite_form: true}
    - {slot: item, cat: commercial_product, uncounted: true}
    - {lit: and}
    - {slot: sale, cat: sell, finite_form: true}
    - {slot: reference, cat: commercial_object_anaphor}
    - {slot: prep, cat: quantity_site_preposition}
    - {slot: place, cat: quantity_site_location, bare: true}
    - {lit: ., consume_skipped: true}
  satisfies:
    reference:
    - refers
  emits:
  - fact: predication
    subject: '{who}'
    verb: '{production}'
    dobj: '{item}'
- id: arithmetic/current-sales-factor
  phase: read
  description: The current sales amount is a stated multiple of the preceding sales amount.
  match:
    sentence:
    - {slot: who, type: entity, common_noun_cat: animate, referential: true, bare: true, at_start: true}
    - {slot: sale, cat: sell, finite_form: true}
    - {slot: factor, type: multiplier}
    - {lit: as}
    - {lit: much}
    - {lit: this, consume_skipped: true}
    - {slot: period, cat: duration_measure, uncounted: true, bare: true}
    - {lit: ., consume_skipped: true}
  consumes:
  - factor
  emits:
  - fact: commercial_term
    entity: '{who}'
    item: ''
    basis: sales-scale
    measure: ''
    value: factor
    period: '{period}'
- id: arithmetic/basket-unit-quotes-1
  phase: read
  description: Explicit per-product currency quotes, preserving product descriptors.
  match:
    sentence:
    - {slot: who, type: entity, common_noun_cat: animate, referential: true, bare: true, at_start: true}
    - {slot: quote, cat: commercial_quote_verb, finite_form: true}
    - {slot: price0, cat: currency_unit, counted: true}
    - {lit: for}
    - {slot: item0, cat: commercial_product, uncounted: true}
    - {lit: ., consume_skipped: true}
  consumes:
  - price0
  emits:
  - fact: commercial_term
    entity: '{who}'
    item: '{item0}'
    qualifier: '{item0.qualifier}'
    basis: basket-price
    measure: '{price0}'
    value: price0
- id: arithmetic/basket-unit-quotes-2
  phase: read
  description: Explicit per-product currency quotes, preserving product descriptors.
  match:
    sentence:
    - {slot: who, type: entity, common_noun_cat: animate, referential: true, bare: true, at_start: true}
    - {slot: quote, cat: commercial_quote_verb, finite_form: true}
    - {slot: price0, cat: currency_unit, counted: true}
    - {lit: for}
    - {slot: item0, cat: commercial_product, uncounted: true}
    - {lit: and}
    - {slot: price1, cat: currency_unit, counted: true}
    - {lit: for}
    - {slot: item1, cat: commercial_product, uncounted: true}
    - {lit: ., consume_skipped: true}
  consumes:
  - price0
  - price1
  emits:
  - fact: commercial_term
    entity: '{who}'
    item: '{item0}'
    qualifier: '{item0.qualifier}'
    basis: basket-price
    measure: '{price0}'
    value: price0
  - fact: commercial_term
    entity: '{who}'
    item: '{item1}'
    qualifier: '{item1.qualifier}'
    basis: basket-price
    measure: '{price1}'
    value: price1
asks:
- id: ask/product-sales-revenue-difference
  match:
    question:
    - {lit: how, at_start: true}
    - {lit: much}
    - {slot: direction, cat: mass_quantity_delta}
    - opt: [{slot: money, cat: mass_currency_noun, uncounted: true, bare: true}]
    - {slot: aux, cat: do_support_auxiliary}
    - {slot: who, type: entity, common_noun_cat: animate, referential: true}
    - {slot: earn, cat: wage_verb, bare_form: true}
    - opt:
      - {lit: for}
      - {slot: purpose, cat: revenue_purpose_noun, uncounted: true, referential: true, class_only: true}
    - opt: [{lit: from}]
    - {slot: sell, cat: sale_activity_verb, present_participle: true}
    - {slot: product, cat: commercial_product, uncounted: true, number: plural, class_only: true}
    - {lit: [than, compared to, compared with]}
    - {slot: other, type: entity, common_noun_cat: animate, referential: true}
    - {lit: '?', consume_skipped: true}
  where: [{distinct: [who, other]}, {number_compatible: [who, aux]}]
  resolves: {consumer: sales-revenue, mode: difference, entity: '{who}', other: '{other}', item: '{product}',
             qualifier: '{product.qualifier}', direction: '{direction}', purpose: '{purpose.optional}'}
  satisfies: {earn: [subject], sell: [subject]}
- id: ask/current-sales-value
  match:
    question:
    - {lit: how, at_start: true}
    - {lit: much}
    - {slot: cop, cat: copula}
    - {slot: owner, cat: possessive_determiner}
    - {slot: sales, cat: sale_revenue_noun, possessed: true, uncounted: true}
    - {lit: for}
    - {lit: this, consume_skipped: true}
    - {slot: period, cat: duration_measure, uncounted: true, bare: true}
    - {lit: '?', consume_skipped: true}
  satisfies:
    cop:
    - subject
  resolves:
    consumer: sales-revenue
    entity: '{sales.owner_identity}'
    period: '{period}'
