format: rulekit/rules@1
rules:
- id: arithmetic/container-filling-context
  phase: read
  match:
    sentence:
    - slot: who
      type: entity
      common_noun_cat: living_agent
      referential: true
      bare: true
    - slot: be
      cat: copula
    - slot: fill
      cat: container_filling_verb
      present_participle: true
    - slot: container
      cat: volumetric_container
      uncounted: true
      number: singular
    - opt:
      - lit: for
      - slot: owner
        cat: possessive_determiner
      - slot: purpose
        cat: living_agent
        uncounted: true
    - lit: .
      consume_skipped: true
  emits:
  - fact: batch_evidence
    kind: content-container-context
    entity: '{who}'
    measure: ''
    value: '0'
    position: '{container.span_start}'
    container: '{container}'
  consumes:
  - be
  - fill
  satisfies:
    be:
    - subject
    fill:
    - subject
    owner:
    - refers
  description: Preserve one measured container, its capacity dimensions and ordered changes to current
    contents.
- id: arithmetic/temporary-departure-for-response
  phase: read
  match:
    sentence:
    - slot: who
      type: entity
      common_noun_cat: living_agent
      referential: true
      bare: true
    - slot: sequence
      cat: narration_sequence_adverb
    - slot: go
      cat: temporary_departure_verb
      finite_form: true
    - lit: to
    - slot: response
      cat: response_activity_verb
      bare_form: true
    - slot: target
      cat: response_target
      uncounted: true
      bare: true
    - lit: .
      consume_skipped: true
  emits:
  - fact: batch_evidence
    kind: content-container-transition
    entity: '{who}'
    measure: ''
    value: 0
    position: '{go.span_start}'
  consumes:
  - go
  - response
  - sequence
  satisfies:
    go:
    - subject
    response:
    - subject
  description: A separate departure clause can establish the context of a later content change.
- id: arithmetic/fractional-container-spill
  phase: read
  match:
    sentence:
    - opt:
      - {slot: owner, cat: possessive_determiner}
    - slot: who
      type: entity
      referential: true
    - slot: spill
      cat: content_spill_verb
      finite_form: true
    - slot: share
      type: fraction
      fraction_within_whole: true
    - opt:
      - lit: of
    - slot: content
      cat: material_resource
      uncounted: true
      bare: true
    - lit: in
    - slot: container
      cat: volumetric_container
      uncounted: true
      number: singular
    - lit: .
      consume_skipped: true
  emits:
  - fact: measured_content_change
    attribution: {predicate: spill, actor: who, subject: content}
    container: '{container}'
    content: '{content}'
    operation: remove_fraction
    value: share
  consumes:
  - spill
  - share
  satisfies:
    spill:
    - subject
  description: Preserve one measured container, its capacity dimensions and ordered changes to current
    contents.
- id: arithmetic/contextual-fractional-content-loss
  phase: read
  match:
    sentence:
    - lit: while
      at_start: true
    - slot: absent
      type: entity
      common_noun_cat: living_agent
      referential: true
      bare: true
    - slot: clitic
      cat: contracted_copula_clitic
    - slot: gone
      cat: temporary_departure_verb
    - lit: ','
      consume_skipped: true
    - slot: share
      type: fraction
      fraction_within_whole: true
    - opt:
      - lit: of
    - slot: content
      cat: material_resource
      uncounted: true
      bare: true
    - lit: in
    - slot: container
      cat: volumetric_container
      uncounted: true
      number: singular
    - slot: loss
      cat: solvent_removal_verb
      finite_form: true
    - lit: .
      consume_skipped: true
  emits:
  - fact: measured_content_change
    attribution: {predicate: loss, subject: content}
    container: '{container}'
    content: '{content}'
    operation: remove_fraction
    value: share
  consumes:
  - gone
  - loss
  - share
  satisfies:
    gone:
    - subject
    loss:
    - subject
    clitic:
    - owner
    - owned
  description: An explicit fraction of current contents is lost from the named container.
- id: arithmetic/measured-container-opening
  phase: read
  match:
    sentence:
    - {slot: container, cat: volumetric_container, uncounted: true, number: singular, at_start: true}
    - {slot: hold, cat: container_content_state_verb, finite_form: true}
    - {slot: volume, cat: volume_measure, counted: true, bare: true}
    - opt:
      - {lit: of}
      - {slot: content, cat: material_resource, uncounted: true, bare: true}
    - {lit: '.', consume_skipped: true}
  emits:
  - fact: batch_evidence
    kind: content-opening-amount
    entity: ''
    measure: '{volume}'
    value: volume
    position: '{volume.span_start}'
    container: '{container}'
    attribute: '{content.optional}'
  consumes: [hold, volume]
  satisfies: {hold: [subject]}
- id: arithmetic/container-disturbance-observation
  match:
    sentence:
    - {slot: actor, type: entity, referential: true, at_start: true}
    - {slot: disturb, cat: container_overturn_verb, finite_form: true}
    - {slot: particle, cat: overturn_result_particle}
    - {slot: container, cat: volumetric_container, uncounted: true, number: singular}
    - {lit: '.', consume_skipped: true}
  emits:
  - fact: batch_evidence
    kind: content-container-disturbance
    entity: '{actor}'
    measure: ''
    value: 0
    position: '{disturb.span_start}'
    container: '{container}'
    attribution: {predicate: disturb, actor: actor, subject: container}
  consumes: [disturb]
  satisfies: {disturb: [subject, dobj], particle: [anchor, object]}
asks:
- id: ask/container-content-cubic-amount
  match:
    question:
    - lit: how
      at_start: true
    - lit: many
    - slot: unit
      cat: length_unit
      uncounted: true
      qualified: true
      qualifier_cat: volume_unit_modifier
      all_qualifiers: true
    - lit: of
    - slot: content
      cat: material_resource
      uncounted: true
      bare: true
    - slot: be
      cat: copula
    - lit: in
    - slot: container
      cat: volumetric_container
      uncounted: true
      number: singular
    - lit: '?'
      consume_skipped: true
  resolves:
    consumer: container-content-state
    container: '{container}'
    content: '{content}'
    unit: '{unit}'
  satisfies:
    be:
    - subject
- id: ask/remaining-measured-container-amount
  match:
    question:
    - {lit: how, at_start: true}
    - {lit: many}
    - {slot: unit, cat: volume_measure, uncounted: true, bare: true}
    - opt:
      - {lit: of}
      - {slot: content, cat: material_resource, uncounted: true, bare: true}
    - {slot: remain, cat: inventory_remainder_verb, finite_form: true}
    - {lit: in}
    - {slot: container, cat: volumetric_container, uncounted: true, number: singular}
    - {lit: '?', consume_skipped: true}
  resolves: {consumer: container-content-state, container: '{container}', content: '{content.optional}', unit: '{unit}'}
  satisfies: {remain: [subject]}
templates:
  fractional-fill:
    parameters:
      object:
        slot: object
        cat: commercial_object_anaphor
      container: $active:measured-container$
    rule:
      phase: read
      match:
        sentence:
        - slot: who
          type: entity
          common_noun_cat: living_agent
          referential: true
          bare: true
        - slot: fill
          cat: container_filling_verb
          finite_form: true
        - parameter: object
        - slot: fraction
          cat: fractional_fill_adverb
        - opt:
          - lit: and
          - slot: go
            cat: temporary_departure_verb
            finite_form: true
          - lit: to
          - slot: response
            cat: response_activity_verb
            bare_form: true
          - slot: target
            cat: response_target
            uncounted: true
            bare: true
        - lit: .
          consume_skipped: true
      emits:
      - fact: batch_evidence
        kind: content-opening-fraction
        entity: '{who}'
        measure: ''
        value: 0.5
        position: '{fraction.span_start}'
        container:
          parameter: container
      consumes:
      - fill
      - go
      - response
      satisfies:
        fill:
        - subject
        go:
        - subject
        response:
        - subject
        object:
        - refers
      description: Preserve one measured container, its capacity dimensions and ordered changes to current
        contents.
  contextual-spill:
    parameters:
      opener:
      - {lit: while, at_start: true}
      - {slot: absent, type: entity, common_noun_cat: living_agent, referential: true, bare: true}
      - {slot: clitic, cat: contracted_copula_clitic}
      - {slot: gone, cat: temporary_departure_verb}
      - {lit: ',', consume_skipped: true}
      actor:
      - {slot: owner, cat: possessive_determiner}
      - {slot: agent, type: entity, referential: true}
      effect: {slot: spill, cat: content_spill_verb, finite_form: true}
      tail: []
      content_prefix: []
      content_bare: true
      connector: {lit: in}
      references: {}
      attribution: {predicate: spill, actor: agent, subject: content}
      cause:
      - slot: cause_action
        cat: container_disturbance_action
        finite_form: true
      - slot: cause_container
        cat: volumetric_container
        uncounted: true
        number: singular
      - opt:
        - slot: result_particle
          cat: overturn_result_particle
      - lit: and
      location:
        slot: object
        cat: measured_object_reference_form
        number: singular
      container: '{cause_container}'
      cause_constraints:
      - category_requires_bound: {slot: cause_action, cat: container_overturn_verb, bound: result_particle}
      - bound_requires_category: {bound: result_particle, slot: cause_action, cat: container_overturn_verb}
      consumes:
      - gone
      - cause_action
      - spill
      - share
      obligations:
        gone: [subject]
        cause_action: [subject]
        result_particle: [object]
        spill: [subject]
        clitic: [owner, owned]
        owner: [refers]
        object: [refers]
    rule:
      phase: read
      match:
        sentence:
        - parameter: opener
        - parameter: actor
        - parameter: cause
        - parameter: effect
        - slot: share
          type: fraction
          fraction_within_whole: true
        - opt:
          - lit: of
        - parameter: content_prefix
        - slot: content
          cat: material_resource
          uncounted: true
          bare: {parameter: content_bare}
        - parameter: connector
        - parameter: location
        - parameter: tail
        - lit: .
          consume_skipped: true
      where: {parameter: cause_constraints}
      references: {parameter: references}
      emits:
      - fact: measured_content_change
        attribution: {parameter: attribution}
        container: {parameter: container}
        content: '{content}'
        operation: remove_fraction
        value: share
      consumes:
        parameter: consumes
      satisfies: {parameter: obligations}
      description: Apply the explicit spill fraction to current contents. A preceding disturbance supplies
        context and can identify the container.
  measured-content-transfer:
    parameters:
      opener:
      - opt:
        - {slot: owner, cat: possessive_determiner}
      - {slot: actor, type: entity, referential: true}
      - {slot: action, cat: content_spill_verb, finite_form: true}
      location: {lit: from}
      ending: []
      operation: remove_quantity
      attribution: {predicate: action, actor: actor, subject: content}
      obligations: {action: [subject]}
    rule:
      phase: read
      match:
        sentence:
        - parameter: opener
        - {slot: volume, cat: volume_measure, counted: true, bare: true}
        - {lit: of}
        - {slot: content, cat: material_resource, uncounted: true, bare: true}
        - parameter: location
        - {slot: container, cat: volumetric_container, uncounted: true, number: singular}
        - parameter: ending
        - {lit: '.', consume_skipped: true}
      emits:
      - fact: measured_content_change
        attribution: {parameter: attribution}
        container: '{container}'
        content: '{content}'
        operation: {parameter: operation}
        measure: '{volume}'
        value: volume
      consumes: [action, volume]
      satisfies: {parameter: obligations}
      description: Record one measured transfer of material into or out of its stated container.
  intransitive-content-loss:
    parameters:
      opener: []
      start: true
      location:
      - {lit: in}
      - {slot: container, cat: volumetric_container, uncounted: true, number: singular}
      ending: []
      attribution: {predicate: loss, subject: content}
      constraints: []
      obligations: {loss: [subject, dobj]}
    rule:
      phase: read
      match:
        sentence:
        - parameter: opener
        - {slot: share, type: fraction, fraction_within_whole: true, at_start: {parameter: start}}
        - opt:
          - {lit: of}
        - {slot: content, cat: material_resource, uncounted: true, bare: true}
        - parameter: location
        - {slot: loss, cat: content_spill_verb, finite_form: true}
        - parameter: ending
        - {lit: '.', consume_skipped: true}
      where: {parameter: constraints}
      emits:
      - fact: measured_content_change
        attribution: {parameter: attribution}
        container: '{container}'
        content: '{content}'
        operation: remove_fraction
        value: share
      consumes: [share, loss]
      satisfies: {parameter: obligations}
      description: Apply a stated loss fraction to the contents of its explicitly linked container.
  container-content-scaling:
    parameters:
      opener:
      - opt:
        - slot: sequence
          cat: narration_sequence_adverb
      - slot: who
        type: entity
        common_noun_cat: living_agent
        referential: true
        bare: true
      - opt:
        - slot: return
          cat: return_activity_verb
          finite_form: true
        - lit: back
        - lit: and
      scaling:
        verb: {slot: scale, cat: intrinsic_quantity_scaling_verb, finite_form: true}
        tail: []
        value: attr(scale, scaling_factor)
        explicit: false
      obligations: {return: [subject], scale: [subject]}
      factor_consumes: []
      references: {}
    rule:
      phase: read
      match:
        sentence:
        - parameter: opener
        - parameter: scaling.verb
        - slot: amount
          cat: allocation_amount_noun
          uncounted: true
          bare: true
        - lit: of
        - slot: content
          cat: material_resource
          uncounted: true
          bare: true
        - lit: in
        - slot: container
          cat: volumetric_container
          uncounted: true
          number: singular
        - parameter: scaling.tail
        - lit: .
          consume_skipped: true
      emits:
      - fact: measured_content_change
        attribution: {predicate: scale, actor: who, subject: content}
        container: '{container}'
        content: '{content}'
        operation: multiply_total
        value: {parameter: scaling.value}
        explicit_factor: {parameter: scaling.explicit}
      consumes: [return, scale, {parameter: factor_consumes}]
      satisfies: {parameter: obligations}
      description: Scale the current amount of the named contents by a lexical or explicitly stated factor.
      references: {parameter: references}
  three-axis-container:
    parameters:
      first:
        tokens:
        - {slot: first_amount, cat: length_unit, counted: true, bare: true}
        - {slot: first_axis, cat: linear_axis_adjective}
        unit: '{first_amount}'
        basis: ''
        verbs: []
      second:
        tokens:
        - {slot: second_amount, cat: length_unit, counted: true, bare: true}
        - {slot: second_axis, cat: linear_axis_adjective}
        unit: '{second_amount}'
        basis: ''
        verbs: []
      third:
        tokens:
        - {slot: third_amount, cat: length_unit, counted: true, bare: true}
        - {slot: third_axis, cat: linear_axis_adjective}
        unit: '{third_amount}'
        basis: ''
        verbs: []
      references: {}
      obligations: {be: [subject]}
    rule:
      description: A cuboid takes three measured axes, each stated directly or as a ratio of another axis.
      question_assumption: true
      phase: read
      match:
        sentence:
        - {slot: container, cat: volumetric_container, uncounted: true, number: singular}
        - {slot: be, cat: copula}
        - {parameter: first.tokens}
        - {lit: ',', consume_skipped: true}
        - {parameter: second.tokens}
        - opt:
          - {lit: ',', consume_skipped: true}
        - {lit: and}
        - {parameter: third.tokens}
        - {lit: ., consume_skipped: true}
      where:
      - distinct: [first_axis, second_axis, third_axis]
      consumes:
      - be
      - first_amount
      - second_amount
      - third_amount
      - {parameter: first.verbs}
      - {parameter: second.verbs}
      - {parameter: third.verbs}
      satisfies: {parameter: obligations}
      references: {parameter: references}
      emits:
      - fact: batch_evidence
        kind: content-container-dimension
        entity: '{container}'
        measure: {parameter: first.unit}
        value: first_amount
        position: '{first_amount.span_start}'
        acquisition: cuboid
        marker: '{first_axis}'
        container: '{container}'
        attribute: {parameter: first.basis}
      - fact: batch_evidence
        kind: content-container-dimension
        entity: '{container}'
        measure: {parameter: second.unit}
        value: second_amount
        position: '{second_amount.span_start}'
        acquisition: cuboid
        marker: '{second_axis}'
        container: '{container}'
        attribute: {parameter: second.basis}
      - fact: batch_evidence
        kind: content-container-dimension
        entity: '{container}'
        measure: {parameter: third.unit}
        value: third_amount
        position: '{third_amount.span_start}'
        acquisition: cuboid
        marker: '{third_axis}'
        container: '{container}'
        attribute: {parameter: third.basis}
variants:
- id: arithmetic/fractional-container-fill-with-departure
  template: fractional-fill
- id: arithmetic/fractional-fill-of-named-container
  template: fractional-fill
  arguments:
    object:
    - opt:
      - {slot: owner, cat: possessive_determiner}
    - slot: object
      cat: volumetric_container
      uncounted: true
      number: singular
    container: '{object}'
- id: arithmetic/contextual-container-spill
  template: contextual-spill
- id: arithmetic/contextual-spill-from-referenced-container
  template: contextual-spill
  arguments:
    cause: []
    cause_constraints: []
    container: '{object}'
    obligations: {gone: [subject], spill: [subject], clitic: [owner, owned], owner: [refers], object: [refers]}
    consumes:
    - gone
    - spill
    - share
- id: arithmetic/contextual-spill-from-named-container
  template: contextual-spill
  arguments:
    cause: []
    cause_constraints: []
    container: '{object}'
    obligations: {gone: [subject], spill: [subject], clitic: [owner, owned], owner: [refers]}
    location:
      slot: object
      cat: volumetric_container
      uncounted: true
      number: singular
    consumes:
    - gone
    - spill
    - share
- id: arithmetic/explicit-result-content-spill
  template: contextual-spill
  arguments:
    opener: []
    actor:
    - opt:
      - {slot: agent_owner, cat: possessive_determiner, at_start: true}
    - {slot: agent, type: entity, referential: true}
    cause:
    - {slot: cause_action, cat: container_disturbance_action, finite_form: true}
    - {slot: cause_container, cat: volumetric_container, uncounted: true, number: singular}
    - opt:
      - {slot: result_particle, cat: overturn_result_particle}
    - {lit: ',', consume_skipped: true}
    effect: {slot: spill, cat: content_spill_verb, present_participle: true}
    location: {slot: object, cat: measured_object_reference_form, number: singular}
    attribution:
      predicate: spill
      actor: agent
      subject: content
      reason: [agent, cause_container]
      reason_tail: result_particle
      reason_actor: agent
      reason_predicate: cause_action
    cause_constraints:
    - category_requires_bound: {slot: cause_action, cat: container_overturn_verb, bound: result_particle}
    - bound_requires_category: {bound: result_particle, slot: cause_action, cat: container_overturn_verb}
    obligations: {cause_action: [subject], result_particle: [object], spill: [subject], object: [refers]}
    consumes: [cause_action, spill, share]
- id: arithmetic/explicit-result-spill-of-possessed-content
  template: contextual-spill
  arguments:
    opener: []
    actor:
    - opt:
      - {slot: agent_owner, cat: possessive_determiner, at_start: true}
    - {slot: agent, type: entity, referential: true}
    cause:
    - {slot: cause_action, cat: container_disturbance_action, finite_form: true}
    - {slot: cause_container, cat: volumetric_container, uncounted: true, number: singular}
    - opt:
      - {slot: result_particle, cat: overturn_result_particle}
    - {lit: ',', consume_skipped: true}
    effect: {slot: spill, cat: content_spill_verb, present_participle: true}
    location: []
    connector: []
    content_bare: false
    content_prefix:
    - {slot: owner_of_content, cat: possessive_determiner}
    references: {owner_of_content: cause_container}
    attribution:
      predicate: spill
      actor: agent
      subject: content
      reason: [agent, cause_container]
      reason_tail: result_particle
      reason_actor: agent
      reason_predicate: cause_action
    cause_constraints:
    - category_requires_bound: {slot: cause_action, cat: container_overturn_verb, bound: result_particle}
    - bound_requires_category: {bound: result_particle, slot: cause_action, cat: container_overturn_verb}
    obligations: {cause_action: [subject], result_particle: [object], spill: [subject]}
    consumes: [cause_action, spill, share]
- id: arithmetic/unattributed-fractional-content-loss
  template: intransitive-content-loss
- id: arithmetic/fractional-content-loss-with-cause-clause
  template: intransitive-content-loss
  arguments:
    location:
    - opt:
      - {lit: in}
      - {slot: source, cat: volumetric_container, uncounted: true, number: singular}
    ending:
    - {lit: because}
    - opt:
      - {slot: reason_owner, cat: possessive_determiner}
    - {slot: reason_actor, type: entity, referential: true}
    - {slot: reason_action, cat: container_overturn_verb, finite_form: true}
    - {slot: container, cat: volumetric_container, uncounted: true, number: singular}
    - {slot: result, cat: overturn_result_particle}
    attribution:
      predicate: loss
      subject: content
      reason: [reason_actor, result]
      reason_actor: reason_actor
      reason_predicate: reason_action
    constraints:
    - same_lemma: [source, container]
    obligations: {loss: [subject, dobj], reason_action: [subject], result: [object]}
- id: arithmetic/measured-content-spill
  template: measured-content-transfer
- id: arithmetic/measured-content-pour
  template: measured-content-transfer
  arguments:
    opener:
    - {slot: actor, type: entity, referential: true, at_start: true}
    - {slot: action, cat: content_addition_verb, finite_form: true}
    location:
    - opt:
      - {lit: back}
    - {lit: into}
    operation: add_quantity
- id: arithmetic/measured-content-causative-loss
  template: measured-content-transfer
  arguments:
    opener:
    - {slot: reason, type: noun, uncounted: true, at_start: true}
    - {slot: action, cat: causative_result_verb, finite_form: true}
    ending:
    - {slot: to, cat: infinitival_marker}
    - {slot: loss, cat: content_loss_verb, bare_form: true}
    - opt:
      - {lit: out}
    attribution: {predicate: loss, subject: content, reason: [reason, reason], reason_entities: [reason]}
    obligations: {action: [subject], to: [object], loss: [subject, dobj]}
- id: arithmetic/fractional-content-loss-after-event
  template: intransitive-content-loss
  arguments:
    location:
    - opt:
      - {lit: in}
      - {slot: source, cat: volumetric_container, uncounted: true, number: singular}
    ending:
    - {lit: after}
    - opt:
      - {slot: reason_owner, cat: possessive_determiner}
    - {slot: reason_actor, type: entity, referential: true}
    - {slot: reason_action, cat: container_overturn_verb, finite_form: true}
    - {slot: container, cat: volumetric_container, uncounted: true, number: singular}
    - {slot: result, cat: overturn_result_particle}
    attribution: {predicate: loss, subject: content}
