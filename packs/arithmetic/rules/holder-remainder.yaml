format: rulekit/rules@1
rules:
- id: arithmetic/holder-prefix-combined-0-bare
  phase: read
  description: An exhaustive holder population and an equal-content initial group.
  match:
    sentence:
    - {lit: there, at_start: true}
    - {slot: cop, cat: plural_copula}
    - {slot: population, cat: ordinal_quantity_holder, counted: true, bare: true}
    - {lit: and}
    - {lit: each}
    - {lit: of}
    - {slot: holders, cat: ordinal_quantity_holder, counted: true, qualified: true, qualifier_cat: holder_prefix_order}
    - {slot: verb, cat: possession_state, finite_form: true}
    - {slot: contents, cat: ownable_quantity_object, counted: true, bare: true}
    - opt:
      - {slot: local_prep, cat: spatial_location_preposition}
      - {slot: local, cat: spatial_reference_noun, bare: true}
    - {lit: ., consume_skipped: true}
  satisfies:
    cop: [subject]
  consumes: [population, holders, contents]
  emits:
  - {fact: batch_evidence, kind: holder-population, entity: '{population}', measure: '{population}', value: population, position: '{population.span_start}',
    container: ''}
  - {fact: batch_evidence, kind: holder-share, entity: '{holders}', measure: '{contents}', value: holders, position: '{holders.span_start}',
    marker: '{holders.qualifier}', per_member: contents}
- id: arithmetic/holder-prefix-combined-0-located
  phase: read
  description: An exhaustive holder population and an equal-content initial group.
  match:
    sentence:
    - {lit: there, at_start: true}
    - {slot: cop, cat: plural_copula}
    - {slot: population, cat: ordinal_quantity_holder, counted: true, bare: true}
    - {slot: place_prep, cat: spatial_location_preposition}
    - {slot: place, cat: spatial_reference_noun, bare: true}
    - {lit: and}
    - {lit: each}
    - {lit: of}
    - {slot: holders, cat: ordinal_quantity_holder, counted: true, qualified: true, qualifier_cat: holder_prefix_order}
    - {slot: verb, cat: possession_state, finite_form: true}
    - {slot: contents, cat: ownable_quantity_object, counted: true, bare: true}
    - opt:
      - {slot: local_prep, cat: spatial_location_preposition}
      - {slot: local, cat: spatial_reference_noun, bare: true}
    - {lit: ., consume_skipped: true}
  satisfies:
    cop: [subject]
  consumes: [population, holders, contents]
  emits:
  - {fact: batch_evidence, kind: holder-population, entity: '{population}', measure: '{population}', value: population, position: '{population.span_start}',
    container: '{place_prep} {place}'}
  - {fact: batch_evidence, kind: holder-share, entity: '{holders}', measure: '{contents}', value: holders, position: '{holders.span_start}',
    marker: '{holders.qualifier}', per_member: contents}
- id: arithmetic/holder-prefix-0
  phase: read
  description: A counted initial group of holders with equal contents.
  match:
    sentence:
    - {lit: each, at_start: true}
    - {lit: of}
    - {slot: holders, cat: ordinal_quantity_holder, counted: true, qualified: true, qualifier_cat: holder_prefix_order}
    - {slot: verb, cat: possession_state, finite_form: true}
    - &id001 {slot: contents, cat: ownable_quantity_object, counted: true, bare: true}
    - opt:
      - {slot: local_prep, cat: spatial_location_preposition}
      - {slot: local, cat: spatial_reference_noun, bare: true}
    - &id002 {lit: ., consume_skipped: true}
  consumes: [holders, contents]
  emits:
  - &id003 {fact: batch_evidence, kind: holder-share, entity: '{holders}', measure: '{contents}', value: holders, position: '{holders.span_start}',
    marker: '{holders.qualifier}', per_member: contents}
