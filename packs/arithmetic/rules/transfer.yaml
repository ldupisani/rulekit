format: rulekit/rules@1
# The ditransitive transfer: "Tom gave Mary 3 apples" / "Tom gave 3 apples
# to Mary". The rule emits TWO quantity facts and the CATEGORY DATA does the
# signing: the giver's side carries the sentence's own verb (give/sold/… ∈
# transfer_out ⊂ lose → −), the recipient's side carries `receive`
# (∈ acquire → +). No arithmetic lives in the rule; tagging a new verb in
# transfer_out is the only change "handed"/"donated" would ever need.
templates:

  transfer:
    parameters:
      complements:
        - {slot: recipient, type: name}
        - {slot: item, type: counted}
    rule:
      phase: read
      match:
        sentence:
          - {slot: giver, type: name}
          - {slot: verb, cat: transfer_out, finite_form: true}
          - {parameter: complements}
      where:
        - {distinct: [giver, recipient]}
        - {number_compatible: [giver, verb]}
        - verb_roles_compatible:
            verb: verb
            roles: {actor: [giver], theme: [item]}
            allow_proper_name: [giver]
      consumes: [item]
      emits:
        - fact: quantity
          entity: '{giver}'
          measure: '{item}'
          value: item
          verb: '{verb}'
        - fact: quantity
          entity: '{recipient}'
          measure: '{item}'
          value: item
          verb: receive

variants:

  - id: arithmetic/transfer-ditransitive
    template: transfer
    description: >-
      "Tom gave Mary 3 apples" — giver loses, recipient gains.

  - id: arithmetic/transfer-prepositional
    template: transfer
    description: >-
      "Tom gave 3 apples to Mary" — same transfer, object first.
    arguments:
      complements:
        - {slot: item, type: counted}
        - {lit: to}
        - {slot: recipient, type: name}
