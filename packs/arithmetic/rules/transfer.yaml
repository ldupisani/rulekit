format: rulekit/rules@1
# The ditransitive transfer: "Tom gave Mary 3 apples" / "Tom gave 3 apples
# to Mary". The rule emits TWO quantity facts and the CATEGORY DATA does the
# signing: the giver's side carries the sentence's own verb (give/sold/… ∈
# lose → −), the recipient's side carries `receive` (∈ acquire → +). No
# arithmetic lives in the rule; tagging a new transfer verb in the lose
# category is the only change "handed"/"donated" would ever need.
rules:
  - id: arithmetic/transfer-ditransitive
    phase: read
    description: '"Tom gave Mary 3 apples" — giver loses, recipient gains.'
    match:
      sentence:
        - {slot: giver, type: name}
        - {slot: verb, cat: lose}
        - {slot: recipient, type: name}
        - {slot: item, type: counted}
    where:
      - distinct: [giver, recipient]
    consumes: [item]
    emits:
      - fact: quantity
        entity: "{giver}"
        measure: "{item}"
        value: "item"
        verb: "{verb}"
      - fact: quantity
        entity: "{recipient}"
        measure: "{item}"
        value: "item"
        verb: receive

  - id: arithmetic/transfer-prepositional
    phase: read
    description: '"Tom gave 3 apples to Mary" — same transfer, object first.'
    match:
      sentence:
        - {slot: giver, type: name}
        - {slot: verb, cat: lose}
        - {slot: item, type: counted}
        - {lit: to}
        - {slot: recipient, type: name}
    where:
      - distinct: [giver, recipient]
    consumes: [item]
    emits:
      - fact: quantity
        entity: "{giver}"
        measure: "{item}"
        value: "item"
        verb: "{verb}"
      - fact: quantity
        entity: "{recipient}"
        measure: "{item}"
        value: "item"
        verb: receive
