- id: ask/service-receipt-subtotal
  match:
    question:
    - {lit: how, at_start: true}
    - {lit: much}
    - {lit: did}
    - {slot: who, type: entity, common_noun_cat: collection_agent, referential: true}
    - {slot: receive, cat: receive, bare_form: true}
    - {lit: in}
    - {slot: receipt, cat: supplemental_receipt_noun, uncounted: true}
    - opt:
      - {slot: marker, cat: explicit_cause_preposition}
      - {slot: reason, type: noun, uncounted: true}
    - {lit: '?', consume_skipped: true}
  resolves: {consumer: weighted-account-total, mode: earnings, receipt: '{receipt}', reason: '{reason.optional}'}
  satisfies: {receive: [subject, dobj], marker: [anchor, object]}
templates:
  service-unit-quote:
    parameters:
      price_link:
      - lit: and
      - slot: charge
        cat: service_tariff_verb
        finite_form: true
      price_consumes:
      - charge
      price_satisfies:
        act:
        - subject
        charge:
        - subject
      price_agreement:
      - number_compatible:
        - who
        - charge
    rule:
      match:
        sentence:
        - slot: who
          type: entity
          common_noun_cat: collection_agent
          referential: true
          at_start: true
        - slot: act
          cat: habitual_service_predicate
          finite_form: true
        - slot: item
          cat: service_object
          counted: true
          bare: true
          value_min: 1
        - parameter: price_link
        - slot: amount
          cat: currency_unit
          counted: true
          bare: true
        - lit: .
          consume_skipped: true
      emits:
      - fact: earning_rate
        entity: '{who}'
        measure: '{amount}'
        per: '{item}'
        value: amount / item
        verb: '{act}'
        basis: service
        numerator: amount
        denominator: item
      consumes:
      - act
      - item
      - amount
      - parameter: price_consumes
      satisfies:
        parameter: price_satisfies
      where:
      - number_compatible:
        - who
        - act
      - slot_not_category:
          slot: act
          cat: past_service_predicate
      - verb_roles_compatible:
          verb: act
          roles:
            actor:
            - who
            theme:
            - item
          allow_proper_name:
          - who
          frame_categories:
          - service_activity_verb
          require_declared_frame: true
      - parameter: price_agreement
  work-and-receipt:
    parameters:
      giver_phrase:
      - slot: givers
        cat: intentional_agent
        counted: true
        bare: true
        value_min: 1
      - slot: each
        cat: postpositive_distributive_quantifier
      count: givers
      position: '{givers.span_start}'
      interpretation: ''
      count_consumes:
      - givers
      satisfaction:
        give:
        - subject
        each:
        - collection
        act:
        - subject
      giver_agreement:
      - number_compatible:
        - givers
        - give
      role_bindings: {}
    rule:
      match:
        sentence:
        - opt:
          - slot: period
            cat: duration_measure
            uncounted: true
            qualified: true
            qualifier_cat: relative_period_attribute
            all_qualifiers: true
        - slot: who
          type: entity
          common_noun_cat: collection_agent
          referential: true
          at_start: false
        - slot: act
          cat: past_service_predicate
          finite_form: true
        - slot: item
          cat: service_object
          counted: true
          bare: true
        - lit: and
        - parameter: giver_phrase
        - slot: give
