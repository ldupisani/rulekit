- id: arithmetic/supplement-per-completed-service
  description: A receipt for each completed service reuses the explicit compatible work population,
    without inventing additional work.
  match:
    sentence:
    - lit: for
      at_start: true
    - slot: each
      cat: distributive_quantifier
    - slot: item
      cat: service_object
      uncounted: true
      bare: true
      number: singular
    - slot: who
      type: entity
      common_noun_cat: collection_agent
      referential: true
    - slot: receipt
      cat: completed_income_receipt
      finite_form: true
    - slot: amount
      cat: currency_unit
      counted: true
      bare: true
    - slot: adjustment
      cat: supplemental_receipt_noun
      uncounted: true
      bare: true
    - lit: .
      consume_skipped: true
  consumes:
  - receipt
  - amount
  satisfies: {}
  bindings:
    each:
      collection: item
    receipt:
      subject: who
  emits:
  - fact: batch_evidence
    kind: account-unit-supplement
    entity: '{who}'
    measure: '{amount}'
    value: amount
    position: '{amount.span_start}'
    container: '{item}'
- id: arithmetic/supplement-for-counted-services
  description: A supplemental receipt attached to a counted service subset; the per-service reading
    is an explicit answer assumption.
  match:
    sentence:
    - lit: for
      at_start: true
    - slot: item
      cat: service_object
      counted: true
      bare: true
      value_min: 1
    - slot: who
      type: entity
      common_noun_cat: collection_agent
      referential: true
    - slot: receipt
      cat: completed_income_receipt
      finite_form: true
    - slot: amount
      cat: currency_unit
      counted: true
      qualified: true
      qualifier_cat: supplemental_payment_descriptor
      all_qualifiers: true
    - slot: adjustment
      cat: supplemental_receipt_noun
      uncounted: true
      bare: true
    - lit: .
      consume_skipped: true
  consumes:
  - receipt
  - amount
  - item
  satisfies:
    receipt:
    - subject
  emits:
  - fact: batch_evidence
    kind: account-product
    entity: '{who}'
    measure: '{amount}'
    value: item
    position: '{item.span_start}'
    per_member: amount
    acquisition: '{item}'
    attribute: implicit-per-service
- id: arithmetic/supplement-from-all-service-clients
  description: All clients supply a per-client supplement; one client per completed service remains
    a reported default, not a textual population count.
  match:
    sentence:
    - slot: all
      cat: group_total_quantifier
      at_start: true
    - lit: of
    - slot: owner
      cat: possessive_determiner
    - slot: clients
      cat: service_client
      uncounted: true
      possessed: true
      number: plural
    - slot: each
      cat: postpositive_distributive_quantifier
    - slot: give
      cat: completed_receipt_transfer
      finite_form: true
    - slot: recipient
      type: entity
      common_noun_cat: collection_agent
      referential: true
    - slot: amount
      cat: currency_unit
      counted: true
      bare: true
    - slot: adjustment
      cat: supplemental_receipt_noun
      uncounted: true
      bare: true
    - lit: .
      consume_skipped: true
  consumes:
  - give
  - amount
  satisfies:
    owner:
    - refers
  bindings:
    give:
      subject: clients
    each:
      collection: clients
    all:
      collection: clients
  emits:
  - fact: batch_evidence
    kind: account-client-supplement
    entity: '{recipient}'
    measure: '{amount}'
    value: amount
    position: '{amount.span_start}'
    container: '{clients}'
    acquisition: '{clients.owner}'
asks:
- id: ask/service-earned-total
  match:
    question:
    - lit: how
      at_start: true
    - lit: many
    - slot: unit
      cat: currency_unit
      uncounted: true
      number: plural
      bare: true
    - slot: aux
      cat: auxiliary
    - slot: who
      type: entity
      common_noun_cat: intentional_agent
      referential: true
    - slot: earn
      cat: wage_verb
      bare_form: true
    - slot: act
      cat: service_activity_verb
      present_participle: true
    - slot: item
      cat: service_object
      uncounted: true
      number: plural
      bare: true
    - opt:
      - slot: period
        cat: duration_measure
        uncounted: true
        qualified: true
        qualifier_cat: relative_period_attribute
        all_qualifiers: true
    - lit: '?'
      consume_skipped: true
  resolves:
    consumer: weighted-account-total
    mode: earnings
    entity: '{who}'
    measure: '{unit}'
    verb: '{act}'
    item: '{item}'
    period: '{period.optional}'
  satisfies:
    earn:
    - subject
    act:
    - subject
  where:
  - number_compatible:
    - who
    - aux
  disambiguates:
  - act
- id: ask/collected-components-total
