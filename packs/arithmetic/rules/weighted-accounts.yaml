asks:
- id: ask/service-earned-total
  match:
    question:
    - lit: how
      at_start: true
    - lit: many
    - slot: unit
      cat: currency_unit
      uncounted: true
      number: plural
      bare: true
    - slot: aux
      cat: auxiliary
    - slot: who
      type: entity
      common_noun_cat: intentional_agent
      referential: true
    - slot: earn
      cat: wage_verb
      bare_form: true
    - slot: act
      cat: service_activity_verb
      present_participle: true
    - slot: item
      cat: service_object
      uncounted: true
      number: plural
      bare: true
    - opt:
      - slot: period
        cat: duration_measure
        uncounted: true
        qualified: true
        qualifier_cat: relative_period_attribute
        all_qualifiers: true
    - lit: '?'
      consume_skipped: true
  resolves:
    consumer: weighted-account-total
    mode: earnings
    entity: '{who}'
    measure: '{unit}'
    verb: '{act}'
    item: '{item}'
    period: '{period.optional}'
  satisfies:
    earn:
    - subject
    act:
    - subject
  where:
  - number_compatible:
    - who
    - aux
  disambiguates:
  - act
- id: ask/collected-components-total
  match:
    question:
    - lit: how
      at_start: true
    - lit: many
    - slot: unit
      cat: countable_component
      uncounted: true
      number: plural
      bare: true
    - slot: aux
      cat: auxiliary
    - lit: the
      consume_skipped: true
    - slot: hosts
      cat: noun
      uncounted: true
      number: plural
      bare: true
    - slot: who
      type: entity
      common_noun_cat: intentional_agent
      referential: true
    - slot: act
      cat: collection_account_verb
      finite_form: true
    - slot: have
      cat: plain_have_state
      bare_form: true
    - opt:
      - slot: total_prep
        cat: group_total_preposition
      - slot: total
        cat: group_total_marker
    - lit: '?'
      consume_skipped: true
  resolves:
    consumer: weighted-account-total
    mode: components
    entity: '{who}'
    measure: '{unit}'
    host: '{hosts}'
    verb: '{act}'
  satisfies:
    act:
    - subject
    have:
    - subject
    total_prep:
    - object
  where:
  - number_compatible:
    - hosts
    - aux
