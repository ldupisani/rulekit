format: rulekit/rules@1
rules:
- id: arithmetic/bounded-completed-service
  match:
    sentence:
    - slot: period
      cat: duration_measure
      uncounted: true
      qualified: true
      qualifier_cat: relative_period_attribute
      all_qualifiers: true
    - slot: who
      type: entity
      common_noun_cat: collection_agent
      referential: true
      at_start: false
    - slot: act
      cat: past_service_predicate
      finite_form: true
    - slot: item
      cat: service_object
      counted: true
      bare: true
    - lit: .
      consume_skipped: true
  emits:
  - fact: quantity
    entity: '{who}'
    measure: '{item}'
    value: item
    verb: '{act}'
    time: '{period.qualifier} {period}'
  consumes:
  - act
  - item
  satisfies:
    act:
    - subject
  where:
  - number_compatible:
    - who
    - act
  - verb_roles_compatible:
      verb: act
      roles:
        actor:
        - who
        theme:
        - item
      allow_proper_name:
      - who
      frame_categories:
      - service_activity_verb
      require_declared_frame: true
- id: arithmetic/collected-components-each
  match:
    sentence:
    - slot: who
      type: entity
      common_noun_cat: collection_agent
      referential: true
      at_start: true
    - slot: act
      cat: component_account_activity
      finite_form: true
    - slot: host0
      cat: component_bearing_object
      counted: true
      bare: true
      value_min: 1
    - lit: with
    - slot: parts0
      cat: countable_component
      counted: true
      bare: true
    - slot: each0
      cat: postpositive_distributive_quantifier
    - lit: .
      consume_skipped: true
  emits:
  - fact: batch_evidence
    kind: account-product
    entity: '{who}'
    measure: '{parts0}'
    value: host0
    position: '{host0.span_start}'
    container: '{host0}'
    per_member: parts0
    verb: '{act}'
