format: rulekit/rules@1
rules:
- id: arithmetic/service-unit-price
  match:
    sentence:
    - slot: who
      type: entity
      common_noun_cat: collection_agent
      referential: true
      at_start: true
    - slot: act
      cat: habitual_service_predicate
      finite_form: true
    - slot: item
      cat: service_object
      counted: true
      bare: true
      value_min: 1
    - lit: and
    - slot: charge
      cat: service_tariff_verb
      finite_form: true
    - slot: amount
      cat: currency_unit
      counted: true
      bare: true
    - lit: .
      consume_skipped: true
  emits:
  - fact: earning_rate
    entity: '{who}'
    measure: '{amount}'
    per: '{item}'
    value: amount / item
    verb: '{act}'
    basis: service
    numerator: amount
    denominator: item
  consumes:
  - act
  - charge
  - item
  - amount
  satisfies:
    act:
    - subject
    charge:
    - subject
  where:
  - number_compatible:
    - who
    - act
  - number_compatible:
    - who
    - charge
  - slot_not_category:
      slot: act
      cat: past_service_predicate
  - verb_roles_compatible:
      verb: act
      roles:
        actor:
        - who
        theme:
        - item
      allow_proper_name:
      - who
      frame_categories:
      - service_activity_verb
      require_declared_frame: true
- id: arithmetic/bounded-completed-service
  match:
    sentence:
    - slot: period
      cat: duration_measure
      uncounted: true
      qualified: true
      qualifier_cat: relative_period_attribute
      all_qualifiers: true
    - slot: who
      type: entity
      common_noun_cat: collection_agent
      referential: true
      at_start: false
    - slot: act
      cat: past_service_predicate
      finite_form: true
    - slot: item
      cat: service_object
      counted: true
      bare: true
    - lit: .
      consume_skipped: true
  emits:
  - fact: quantity
    entity: '{who}'
    measure: '{item}'
    value: item
    verb: '{act}'
    time: '{period.qualifier} {period}'
  consumes:
  - act
  - item
  satisfies:
    act:
    - subject
  where:
  - number_compatible:
    - who
    - act
  - verb_roles_compatible:
      verb: act
      roles:
        actor:
        - who
        theme:
        - item
      allow_proper_name:
      - who
      frame_categories:
      - service_activity_verb
      require_declared_frame: true
- id: arithmetic/completed-service-with-supplement
  match:
    sentence:
    - opt:
      - slot: period
        cat: duration_measure
        uncounted: true
        qualified: true
        qualifier_cat: relative_period_attribute
        all_qualifiers: true
    - slot: who
      type: entity
      common_noun_cat: collection_agent
      referential: true
      at_start: false
    - slot: act
      cat: past_service_predicate
      finite_form: true
    - slot: item
      cat: service_object
      counted: true
      bare: true
    - lit: and
    - slot: givers
      cat: intentional_agent
      counted: true
      bare: true
      value_min: 1
    - slot: each
      cat: postpositive_distributive_quantifier
    - slot: give
      cat: completed_receipt_transfer
      finite_form: true
    - slot: recipient
      cat: singular_animate_object_pronoun
    - slot: amount
      cat: currency_unit
      counted: true
      bare: true
    - slot: adjustment
      cat: supplemental_receipt_noun
      uncounted: true
      bare: true
    - lit: .
      consume_skipped: true
  emits:
  - fact: batch_evidence
    kind: account-work
    entity: '{who}'
    measure: '{item}'
    value: item
    position: '{item.span_start}'
    verb: '{act}'
    marker: '{period.optional}'
    container: '{period.optional}'
  - fact: batch_evidence
    kind: account-product
    entity: '{recipient}'
    measure: '{amount}'
    value: givers
    position: '{givers.span_start}'
    per_member: amount
    marker: '{period.optional}'
    verb: '{act}'
    container: '{period.optional}'
  consumes:
  - act
  - item
  - give
  - amount
  - givers
  satisfies:
    act:
    - subject
    give:
    - subject
    each:
    - collection
  where:
  - number_compatible:
    - who
    - act
  - number_compatible:
    - givers
    - give
  - verb_roles_compatible:
      verb: act
      roles:
        actor:
        - who
        theme:
        - item
      allow_proper_name:
      - who
      frame_categories:
      - service_activity_verb
      require_declared_frame: true
- id: arithmetic/distributed-supplemental-receipt
  match:
    sentence:
    - slot: givers
      cat: intentional_agent
      counted: true
      bare: true
      at_start: true
      value_min: 1
    - slot: each
      cat: postpositive_distributive_quantifier
    - slot: give
      cat: completed_receipt_transfer
      finite_form: true
    - slot: recipient
      type: entity
      common_noun_cat: collection_agent
      referential: true
    - slot: amount
      cat: currency_unit
      counted: true
      bare: true
    - slot: adjustment
      cat: supplemental_receipt_noun
      uncounted: true
      bare: true
    - lit: .
      consume_skipped: true
  emits:
  - fact: batch_evidence
    kind: account-product
    entity: '{recipient}'
    measure: '{amount}'
    value: givers
    position: '{givers.span_start}'
    per_member: amount
  consumes:
  - givers
  - give
  - amount
  satisfies:
    give:
    - subject
    each:
    - collection
  where:
  - number_compatible:
    - givers
    - give
