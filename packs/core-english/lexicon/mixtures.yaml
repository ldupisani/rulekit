format: rulekit/lexicon@1
entries:
  stranded: {senses: [adjective]}
  seawater: {senses: [noun]}
  brine: {senses: [noun]}
  evaporate: {senses: [verb]}
  evaporates: {senses: [verb], verb: {lemma: evaporate}}
  evaporated: {senses: [verb], verb: {lemma: evaporate}}
  salt:
    senses:
    - noun
  collect:
    senses:
    - verb
  collects:
    senses:
    - verb
    verb:
      lemma: collect
  collected:
    senses:
    - verb
    verb:
      lemma: collect
  milliliter:
    # The SINGULAR was missing while 'milliliters' had its own entry, so the
    # plural never canonicalized (lemma stayed 'milliliters') and no conversion
    # could key on it. `plural:` restores the one-identity invariant every other
    # unit noun already has — a noun's number-forms share ONE lemma.
    senses:
    - noun
    plural: [milliliters, millilitres]
  ml:
    senses:
    - noun
  saltwater: {senses: [noun]}
  salt water: {senses: [noun], lexical_phrase: true}
  sugar water: {senses: [noun], lexical_phrase: true}
  obtain: {senses: [verb]}
  obtains: {senses: [verb], verb: {lemma: obtain}}
  obtained: {senses: [verb], verb: {lemma: obtain}}
  completely: {senses: [adverb]}
  fully: {senses: [adverb]}
  volume: {senses: [noun], plural: volumes}
  oil:
