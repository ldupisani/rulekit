format: rulekit/lexicon@1
# Definitive dictionary, never heuristics: absent = unknown = reportable.
entries:
    # articles (skippable structure words)
    the: {senses: [article]}
    a: {senses: [article]}
    an: {senses: [article]}
    this: {senses: [article]}

    # quantifiers
    each: {senses: [quantifier], notes: "distributive; singular agreement"}
    every: {senses: [quantifier]}
    some: {senses: [quantifier]}
    all: {senses: [quantifier]}
    no: {senses: [quantifier]}

    # modal auxiliaries
    can: {senses: [modal, noun], plural: cans}
    could: {senses: [modal]}
    may: {senses: [modal]}
    might: {senses: [modal]}
    must: {senses: [modal]}
    should: {senses: [modal]}
    will: {senses: [modal]}
    would: {senses: [modal]}

    # deictic temporal markers
    now: {senses: [time]}
    today: {senses: [time]}

    # core temporal/adverbial grammar
    currently: {senses: [adverb]}
    far: {senses: [adverb]}
    ago: {senses: [adverb]}

    # prepositions
    of: {senses: [preposition]}
    in: {senses: [preposition]}
    on: {senses: [preposition]}
    with: {senses: [preposition]}
    from: {senses: [preposition]}
    to: {senses: [preposition]}
    at: {senses: [preposition]}

    # pronouns
    he: {senses: [pronoun]}
    she: {senses: [pronoun]}
    they: {senses: [pronoun], number: plural}
    it: {senses: [pronoun]}
    someone: {senses: [pronoun]}
    somebody: {senses: [pronoun]}
    everybody: {senses: [pronoun]}
    nobody: {senses: [pronoun]}
    i:
        senses: [pronoun]
        notes: >
            first-person singular — a base-lexicon gap this project never needed
            until now (GSM8K narratives are almost always third-person), closed
            as a decline-safety prerequisite for condense.py's merge-label pass
            (mining candidate labeled-entity-identity): without a lexicon entry,
            the single capital letter "I" is indistinguishable from a genuine
            index label ("Jar B") and "the jar I have" would wrongly fuse into
            one label-distinguished noun. With this entry it keeps its own
            pronoun sense (its `refers` obligation then simply goes unmet, same
            decline discipline every other unresolved pronoun already has).
    anything: {senses: [pronoun]}
    either: {senses: [pronoun]}
    everyone: {senses: [pronoun]}
    everything: {senses: [pronoun]}
    her: {senses: [pronoun]}
    herself: {senses: [pronoun]}
    him: {senses: [pronoun]}
    himself: {senses: [pronoun]}
    his: {senses: [pronoun]}
    its: {senses: [pronoun]}
    my: {senses: [pronoun]}
    ones: {senses: [pronoun]}
    their: {senses: [pronoun]}
    theirs: {senses: [pronoun]}
    them: {senses: [pronoun], number: plural}
    themselves: {senses: [pronoun]}
    you: {senses: [pronoun]}
    your: {senses: [pronoun]}

    # negation
    not: {senses: [negator]}

    # the possessive clitic — tokenized as its own unit ("Tom's" -> Tom + 's)
    "'s":
        senses: [possessive]
        notes: >
            owner (left) + owned (right) bind and condense into an owner-attributed
            noun. The copula reading ("he's got") leaves `owned` unmet and the
            sentence declines — never a wrong fact.

    # auxiliaries / question words (structure)
    does: {senses: [auxiliary]}
    do: {senses: [auxiliary]}
    did: {senses: [auxiliary]}
    how: {senses: [interrogative]}
    much: {senses: [interrogative, quantifier], notes: "moved from difg-mined; also the how-MUCH ask cue"}
    many: {senses: [interrogative]}
    double: {senses: [quantifier]}
    triple: {senses: [quantifier, verb]}
    what: {senses: [interrogative]}
    who: {senses: [interrogative]}

    # imperative task cue ("Compute the total…") — a task sentence is a
    # question even without a question mark; calculate/determine gain the
    # imperative sense in difg-mined where their verb entries live
    compute: {senses: [imperative]}

    # question/remainder skeleton (moved from difg-mined)
    left: {senses: [adjective], notes: "'are left' / 'have left' — the remainder frame"}
    old: {senses: [adjective]}
    there: {senses: [existential]}

    # clause boundary — argument binding never crosses it
    that: {senses: [complementizer], notes: "moved from difg-mined (was mis-lexiconed as article there)"}

    # comparatives
    more: {senses: [comparative]}
    fewer: {senses: [comparative]}
    less: {senses: [comparative]}
    # Generic age comparatives belong with the core relation grammar. The
    # benchmark-mined pack still extends them with its higher/lower categories.
    older: {senses: [comparative]}
    younger: {senses: [comparative]}
    # Generic physical-dimension comparatives. Their signed dimension category
    # is core grammar; difg-mined may add broader magnitude memberships.
    heavier: {senses: [comparative]}
    higher: {senses: [comparative]}
    larger: {senses: [comparative]}
    lighter: {senses: [comparative]}
    longer: {senses: [comparative]}
    shorter: {senses: [comparative]}
    smaller: {senses: [comparative]}
    taller: {senses: [comparative]}
    wider: {senses: [comparative]}
    than: {senses: [particle]}
    as: {senses: [particle]}
    altogether: {senses: [aggregate]}
    total: {senses: [aggregate]}
    combined: {senses: [aggregate]}
    together: {senses: [aggregate]}
    # moved from difg-mined (mining candidate average-asks): was mis-lexiconed
    # as a bare noun there, which let condense.py's general NOUN+NOUN
    # merge-compound pass eat it into a "average number"/"average amount"
    # compound before any ask pattern ever saw a separate 'average' token —
    # the same reason 'total'/'combined' above are tagged 'aggregate' rather
    # than 'noun'. 'averaged'/'averages' (the verb forms) are untouched and
    # stay in difg-mined.
    average: {senses: [aggregate]}
    and: {senses: [conjunction]}

    # copula / possession verbs (state)
    be: {senses: [verb]}
    is: {senses: [verb], number: singular, verb: {lemma: be}}
    are: {senses: [verb], number: plural, verb: {lemma: be}}
    was: {senses: [verb], number: singular, verb: {lemma: be}}
    were: {senses: [verb], number: plural, verb: {lemma: be}}
    has: {senses: [verb], number: singular, verb: {lemma: have}}
    have: {senses: [verb], number: plural, verb: {lemma: have}}
    had: {senses: [verb], verb: {lemma: have}}
    owns: {senses: [verb], number: singular, verb: {lemma: own}}
    own: {senses: [verb], number: plural, verb: {lemma: own}}

    # event verbs — gains
    gets: {senses: [verb], number: singular, verb: {lemma: get}}
    get: {senses: [verb], number: plural, verb: {lemma: get}}
    got: {senses: [verb], verb: {lemma: get}}
    finds: {senses: [verb], number: singular, verb: {lemma: find}}
    find: {senses: [verb], number: plural, verb: {lemma: find}}
    found: {senses: [verb], verb: {lemma: find}}
    buys: {senses: [verb], number: singular, verb: {lemma: buy}}
    buy: {senses: [verb], number: plural, verb: {lemma: buy}}
    bought: {senses: [verb], verb: {lemma: buy}}
    receives: {senses: [verb], number: singular, verb: {lemma: receive}}
    receive: {senses: [verb], number: plural, verb: {lemma: receive}}
    received: {senses: [verb], verb: {lemma: receive}}
    wins: {senses: [verb], number: singular, verb: {lemma: win}}
    win: {senses: [verb], number: plural, verb: {lemma: win}}
    won: {senses: [verb], verb: {lemma: win}}

    # event verbs — losses
    loses: {senses: [verb], number: singular, verb: {lemma: lose}}
    lose: {senses: [verb], number: plural, verb: {lemma: lose}}
    lost: {senses: [verb], verb: {lemma: lose}}
    eats: {senses: [verb], number: singular, verb: {lemma: eat}}
    eat: {senses: [verb], number: plural, verb: {lemma: eat}}
    ate: {senses: [verb], verb: {lemma: eat}}
    gives: {senses: [verb], number: singular, verb: {lemma: give}}
    give: {senses: [verb], number: plural, verb: {lemma: give}}
    gave: {senses: [verb], verb: {lemma: give}}
    sells: {senses: [verb], number: singular, verb: {lemma: sell}}
    sell: {senses: [verb], number: plural, verb: {lemma: sell}}
    sold: {senses: [verb], verb: {lemma: sell}}
    spends: {senses: [verb], number: singular, verb: {lemma: spend}}
    spend: {senses: [verb], number: plural, verb: {lemma: spend}}
    spent: {senses: [verb], verb: {lemma: spend}}
    drops: {senses: [verb], number: singular, verb: {lemma: drop}}
    dropped: {senses: [verb], verb: {lemma: drop}}

    # other verbs
    wilted: {senses: [verb], verb: {lemma: wilt}}
    jumped: {senses: [verb], verb: {lemma: jump}}
    walked: {senses: [verb], verb: {lemma: walk}}
    ran: {senses: [verb], verb: {lemma: run}}
    travel: {senses: [verb], number: plural}
    traveled: {senses: [verb], verb: {lemma: travel}}
    travels: {senses: [verb], number: singular, verb: {lemma: travel}}
    take: {senses: [verb], number: plural}
    takes: {senses: [verb], verb: {lemma: take}}
    took: {senses: [verb], verb: {lemma: take}}
    want: {senses: [verb], number: plural}
    wanted: {senses: [verb], verb: {lemma: want}}
    wanting: {senses: [verb], verb: {lemma: want}}
    wants: {senses: [verb], verb: {lemma: want}}
    need: {senses: [verb], number: plural}
    needed: {senses: [verb], verb: {lemma: need}}
    needs: {senses: [verb], verb: {lemma: need}}

    # the classic multi-sense demonstrator
    rose:
        senses: [noun, verb]
        plural: roses
        verb: {lemma: rise}
        notes: "flower (noun) or past of rise (verb) — coverage arbitrates"

    # common nouns
    apple: {senses: [noun], plural: apples}
    animal: {senses: [noun], plural: animals}
    age: {senses: [noun], plural: ages}
    amount: {senses: [noun], plural: amounts}
    number: {senses: [noun], plural: numbers}
    price: {senses: [noun], plural: prices}
    # Generic mass currency language is needed by the core arithmetic
    # relation grammar; corpus-mined packs may extend the category with
    # narrower financial heads.
    money: {senses: [noun]}
    cost: {senses: [noun, verb], plural: costs}
    remainder: {senses: [noun]}
    rest: {senses: [noun]}
    year: {senses: [noun], plural: years}
    time: {senses: [noun], plural: times}
    inch: {senses: [noun], plural: inches}
    pound: {senses: [noun], plural: pounds}
    # promoted from difg-mined 2026-07-20: packs/reference needs it too, and
    # packs may not shadow — the shared base is the one home both can require
    area: {senses: [noun], plural: areas}
    plum: {senses: [noun], plural: plums}
    marble: {senses: [noun], plural: marbles}
    book: {senses: [noun], plural: books}
    cookie: {senses: [noun], plural: cookies}
    ball: {senses: [noun], plural: balls}
    toy: {senses: [noun], plural: toys}
    pencil: {senses: [noun], plural: pencils}
    sticker: {senses: [noun], plural: stickers}
    card: {senses: [noun], plural: cards}
    coin: {senses: [noun], plural: coins}
    dollar: {senses: [noun], plural: dollars}
    egg: {senses: [noun], plural: eggs}
    flower: {senses: [noun], plural: flowers}
    garden: {senses: [noun], plural: gardens}
    teacher: {senses: [noun], plural: teachers}
    student: {senses: [noun], plural: students}
    child: {senses: [noun], plural: children}
    friend: {senses: [noun], plural: friends}
    dog: {senses: [noun], plural: dogs}
    cat: {senses: [noun], plural: cats}
    fish: {senses: [noun], plural: fish}
    bird: {senses: [noun], plural: birds}
    rabbit: {senses: [noun], plural: rabbits}
    hamster: {senses: [noun], plural: hamsters}
    litter: {senses: [noun], plural: litter}
    tree: {senses: [noun], plural: trees}

    # Broad, ordinary vocabulary for deterministic rule exploration. These
    # words are useful across several count, comparison, partition, and
    # location frames; their narrower semantic roles are declared in the
    # category file rather than inferred by the generator.
    drum: {senses: [noun], plural: drums}
    puzzle: {senses: [noun], plural: puzzles}
    key: {senses: [noun], plural: keys}
    envelope: {senses: [noun], plural: envelopes}
    tomato: {senses: [noun], plural: tomatoes}
    pear: {senses: [noun], plural: pears}
    grape: {senses: [noun], plural: grapes}
    apricot: {senses: [noun], plural: apricots}
    alpaca: {senses: [noun], plural: alpacas}

    # Unambiguous people for referential common-noun subjects and standards.
    gardener: {senses: [noun], plural: gardeners}
    librarian: {senses: [noun], plural: librarians}
    violinist: {senses: [noun], plural: violinists}
    shopper: {senses: [noun], plural: shoppers}
    guardian: {senses: [noun], plural: guardians}

    # Common quantitative locations. Their compatible prepositions are
    # declared separately, so adding them does not make every PP acceptable.
    pantry: {senses: [noun], plural: pantries}
    cupboard: {senses: [noun], plural: cupboards}
    storeroom: {senses: [noun], plural: storerooms}
    bench: {senses: [noun], plural: benches}

    # Ordinary mass quantities. Paper also has a valid count reading.
    sand: {senses: [noun]}
    clay: {senses: [noun]}
    wool: {senses: [noun]}
    paper: {senses: [noun], plural: papers}

    # adjectives
    red: {senses: [adjective]}
    green: {senses: [adjective]}
    blue: {senses: [adjective]}
    beige: {senses: [adjective]}
    turquoise: {senses: [adjective]}
    violet: {senses: [adjective]}
    small: {senses: [adjective]}
    large: {senses: [adjective]}
