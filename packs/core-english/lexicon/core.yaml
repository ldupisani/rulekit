format: rulekit/lexicon@1
# Definitive dictionary, never heuristics: absent = unknown = reportable.
entries:
    # articles (skippable structure words)
    the: {senses: [article]}
    a: {senses: [article]}
    an: {senses: [article]}
    this: {senses: [article]}

    # clause structure
    if: {senses: [conjunction]}

    # quantifiers
    each: {senses: [quantifier], notes: "distributive; singular agreement"}
    every: {senses: [quantifier]}
    some: {senses: [quantifier]}
    all: {senses: [quantifier]}
    no: {senses: [quantifier]}

    # modal auxiliaries
    can: {senses: [modal, noun], plural: cans}
    could: {senses: [modal]}
    may: {senses: [modal, noun]}
    might: {senses: [modal]}
    must: {senses: [modal]}
    should: {senses: [modal]}
    will: {senses: [modal]}
    would: {senses: [modal]}

    # deictic temporal markers
    now: {senses: [time]}
    today: {senses: [time]}
    tomorrow: {senses: [time]}
    yesterday: {senses: [time]}

    # Calendar-point nouns are ordinary core English. Their membership in
    # `timeperiod` does not by itself assign an event time; only a licensed
    # temporal-point construction may do that. `may` is lexically ambiguous;
    # only an explicit calendar category inside a licensed temporal phrase
    # selects its month reading, while ordinary modal syntax remains modal.
    monday: {senses: [noun]}
    tuesday: {senses: [noun]}
    wednesday: {senses: [noun]}
    thursday: {senses: [noun]}
    friday: {senses: [noun]}
    saturday: {senses: [noun]}
    sunday: {senses: [noun]}
    january: {senses: [noun]}
    february: {senses: [noun]}
    march: {senses: [noun]}
    april: {senses: [noun]}
    june: {senses: [noun]}
    july: {senses: [noun]}
    august: {senses: [noun]}
    september: {senses: [noun]}
    october: {senses: [noun]}
    november: {senses: [noun]}
    december: {senses: [noun]}

    # core temporal/adverbial grammar
    currently: {senses: [adverb]}
    finally: {senses: [adverb]}
    just: {senses: [adverb]}
    only: {senses: [adverb]}
    far: {senses: [adverb]}
    then: {senses: [adverb]}
    ago: {senses: [adverb]}
    individually: {senses: [adverb]}

    # Event-progress grammar. ``able`` marks the realized "was able to"
    # construction; ``last`` qualifies a named period such as "last week".
    able: {senses: [adjective]}
    last: {senses: [adjective, verb]}
    new: {senses: [adjective]}

    # General English prepositions. Narrow semantic roles such as source,
    # goal, location, duration, and instrument belong in categories and rules;
    # recognition here does not infer any one of those readings.
    about: {senses: [preposition]}
    above: {senses: [preposition]}
    across: {senses: [preposition]}
    after: {senses: [preposition]}
    against: {senses: [preposition]}
    along: {senses: [preposition]}
    among: {senses: [preposition]}
    amongst: {senses: [preposition]}
    around: {senses: [preposition]}
    of: {senses: [preposition]}
    in: {senses: [preposition]}
    on: {senses: [preposition]}
    with: {senses: [preposition]}
    from: {senses: [preposition]}
    to: {senses: [preposition]}
    at: {senses: [preposition]}
    before: {senses: [preposition]}
    below: {senses: [preposition]}
    between: {senses: [preposition]}
    by: {senses: [preposition]}
    during: {senses: [preposition]}
    except: {senses: [preposition]}
    for: {senses: [preposition]}
    including: {senses: [preposition]}
    inside: {senses: [preposition]}
    into: {senses: [preposition]}
    near: {senses: [preposition]}
    onto: {senses: [preposition]}
    over: {senses: [preposition]}
    past: {senses: [preposition]}
    through: {senses: [preposition]}
    throughout: {senses: [preposition]}
    towards: {senses: [preposition]}
    under: {senses: [preposition]}
    until: {senses: [preposition]}
    versus: {senses: [preposition]}
    via: {senses: [preposition]}
    within: {senses: [preposition]}
    without: {senses: [preposition]}

    # Less frequent and polysemous preposition uses. These are still only
    # lexical recognition: semantic role categories below decide which uses
    # can produce a relation, and unsupported readings remain visible.
    aboard: {senses: [preposition]}
    alongside: {senses: [preposition]}
    amid: {senses: [preposition]}
    amidst: {senses: [preposition]}
    atop: {senses: [preposition]}
    barring: {senses: [preposition]}
    behind: {senses: [preposition]}
    beneath: {senses: [preposition]}
    beside: {senses: [preposition]}
    besides: {senses: [preposition]}
    beyond: {senses: [preposition]}
    circa: {senses: [preposition]}
    concerning: {senses: [preposition]}
    despite: {senses: [preposition]}
    down: {senses: [adverb, preposition]}
    effective: {senses: [preposition]}
    excepting: {senses: [preposition]}
    failing: {senses: [preposition]}
    following: {senses: [adjective, preposition]}
    like: {senses: [preposition]}
    notwithstanding: {senses: [preposition]}
    off: {senses: [adverb, preposition]}
    opposite: {senses: [preposition]}
    outside: {senses: [adverb, preposition]}
    pending: {senses: [preposition]}
    regarding: {senses: [preposition]}
    respecting: {senses: [preposition]}
    since: {senses: [conjunction, preposition]}
    toward: {senses: [noun, preposition]}
    underneath: {senses: [preposition]}
    unlike: {senses: [preposition]}
    upon: {senses: [preposition]}
    vs: {senses: [preposition]}

    # Multiword prepositions are lexemes in their own right. The analyzer
    # merges the longest declared phrase before disambiguation, so component
    # words keep their independent ordinary senses.
    "apart from": {senses: [preposition]}
    "because of": {senses: [preposition]}
    "but for": {senses: [preposition]}
    "due to": {senses: [preposition]}
    "instead of": {senses: [preposition]}
    "next to": {senses: [preposition]}
    "out of": {senses: [preposition]}
    "short of": {senses: [preposition]}

    # pronouns
    he: {senses: [pronoun], number: singular}
    she: {senses: [pronoun], number: singular}
    they: {senses: [pronoun], number: plural}
    it: {senses: [pronoun], number: singular}
    someone: {senses: [pronoun]}
    somebody: {senses: [pronoun]}
    everybody: {senses: [pronoun]}
    nobody: {senses: [pronoun]}
    i:
        senses: [pronoun]
        notes: >
            first-person singular — a base-lexicon gap this project never needed
            until now (GSM8K narratives are almost always third-person), closed
            as a decline-safety prerequisite for condense.py's merge-label pass
            (mining candidate labeled-entity-identity): without a lexicon entry,
            the single capital letter "I" is indistinguishable from a genuine
            index label ("Jar B") and "the jar I have" would wrongly fuse into
            one label-distinguished noun. With this entry it keeps its own
            pronoun sense (its `refers` obligation then simply goes unmet, same
            decline discipline every other unresolved pronoun already has).
    anything: {senses: [pronoun]}
    either: {senses: [pronoun]}
    everyone: {senses: [pronoun]}
    everything: {senses: [pronoun]}
    her: {senses: [pronoun]}
    herself: {senses: [pronoun]}
    him: {senses: [pronoun]}
    himself: {senses: [pronoun]}
    his: {senses: [pronoun]}
    its: {senses: [pronoun]}
    my: {senses: [pronoun]}
    ones: {senses: [pronoun]}
    their: {senses: [pronoun]}
    theirs: {senses: [pronoun]}
    them: {senses: [pronoun], number: plural}
    themselves: {senses: [pronoun]}
    you: {senses: [pronoun]}
    your: {senses: [pronoun]}

    # negation
    not: {senses: [negator]}

    # clause coordination and relative-question structure
    or: {senses: [conjunction]}
    which: {senses: [wh_which]}

    # the possessive clitic — tokenized as its own unit ("Tom's" -> Tom + 's)
    "'s":
        senses: [possessive]
        notes: >
            owner (left) + owned (right) bind and condense into an owner-attributed
            noun. The copula reading ("he's got") leaves `owned` unmet and the
            sentence declines — never a wrong fact.

    # auxiliaries / question words (structure)
    does: {senses: [auxiliary], number: singular}
    do: {senses: [auxiliary], number: plural}
    did: {senses: [auxiliary]}
    how: {senses: [interrogative]}
    much: {senses: [interrogative, quantifier], notes: "moved from difg-mined; also the how-MUCH ask cue"}
    many: {senses: [interrogative]}
    double: {senses: [quantifier]}
    triple: {senses: [quantifier, verb]}
    what: {senses: [interrogative]}
    who: {senses: [interrogative]}

    # imperative task cue ("Compute the total…") — a task sentence is a
    # question even without a question mark; calculate/determine gain the
    # imperative sense in difg-mined where their verb entries live
    compute: {senses: [imperative]}

    # question/remainder skeleton (moved from difg-mined)
    left:
        senses: [adjective, verb]
        notes: >
            Past departure verb or remainder adjective. Governed rules and
            argument structure choose the reading; the surface alone does not.
    old: {senses: [adjective]}
    there: {senses: [existential]}

    # clause boundary — argument binding never crosses it
    that: {senses: [complementizer], notes: "moved from difg-mined (was mis-lexiconed as article there)"}

    # comparatives
    more: {senses: [comparative]}
    fewer: {senses: [comparative]}
    less: {senses: [comparative]}
    faster: {senses: [comparative]}
    slower: {senses: [comparative]}
    # Generic age comparatives belong with the core relation grammar. The
    # benchmark-mined pack still extends them with its higher/lower categories.
    older: {senses: [comparative]}
    younger: {senses: [comparative]}
    # Generic physical-dimension comparatives. Their signed dimension category
    # is core grammar; difg-mined may add broader magnitude memberships.
    heavier: {senses: [comparative]}
    higher: {senses: [comparative]}
    larger: {senses: [comparative]}
    lighter: {senses: [comparative]}
    longer: {senses: [comparative]}
    shorter: {senses: [comparative]}
    smaller: {senses: [comparative]}
    taller: {senses: [comparative]}
    wider: {senses: [comparative]}
    than: {senses: [particle]}
    as: {senses: [particle]}
    altogether: {senses: [aggregate]}
    total: {senses: [aggregate]}
    combined: {senses: [aggregate]}
    together: {senses: [aggregate]}
    # moved from difg-mined (mining candidate average-asks): was mis-lexiconed
    # as a bare noun there, which let condense.py's general NOUN+NOUN
    # merge-compound pass eat it into a "average number"/"average amount"
    # compound before any ask pattern ever saw a separate 'average' token —
    # the same reason 'total'/'combined' above are tagged 'aggregate' rather
    # than 'noun'. 'averaged'/'averages' (the verb forms) are untouched and
    # stay in difg-mined.
    average: {senses: [aggregate]}
    and: {senses: [conjunction]}
    while: {senses: [conjunction]}

    # copula / possession verbs (state)
    be: {senses: [verb]}
    is: {senses: [verb], number: singular, verb: {lemma: be}}
    are: {senses: [verb], number: plural, verb: {lemma: be}}
    was: {senses: [verb], number: singular, verb: {lemma: be}}
    were: {senses: [verb], number: plural, verb: {lemma: be}}
    has: {senses: [verb], number: singular, verb: {lemma: have}}
    have: {senses: [verb], number: plural, verb: {lemma: have}}
    had: {senses: [verb], verb: {lemma: have}}
    owns: {senses: [verb], number: singular, verb: {lemma: own}}
    own: {senses: [verb], number: plural, verb: {lemma: own}}

    # event verbs — gains
    gets: {senses: [verb], number: singular, verb: {lemma: get}}
    get: {senses: [verb], number: plural, verb: {lemma: get}}
    got: {senses: [verb], verb: {lemma: get}}
    finds: {senses: [verb], number: singular, verb: {lemma: find}}
    find: {senses: [verb], number: plural, verb: {lemma: find}}
    found: {senses: [verb], verb: {lemma: find}}
    buys: {senses: [verb], number: singular, verb: {lemma: buy}}
    buy: {senses: [verb], number: plural, verb: {lemma: buy}}
    bought: {senses: [verb], verb: {lemma: buy}}
    buying: {senses: [verb], verb: {lemma: buy}}
    decide: {senses: [verb], number: plural}
    decides: {senses: [verb], number: singular, verb: {lemma: decide}}
    decided: {senses: [verb], verb: {lemma: decide}}
    earns: {senses: [verb], number: singular, verb: {lemma: earn}}
    earn: {senses: [verb], number: plural, verb: {lemma: earn}}
    earned: {senses: [verb], verb: {lemma: earn}}
    earning: {senses: [verb], verb: {lemma: earn}}
    makes: {senses: [verb], number: singular, verb: {lemma: make}}
    make: {senses: [verb], number: plural, verb: {lemma: make}}
    made: {senses: [verb], verb: {lemma: make}}
    writes: {senses: [verb], number: singular, verb: {lemma: write}}
    write: {senses: [verb], number: plural, verb: {lemma: write}}
    wrote: {senses: [verb], verb: {lemma: write}}
    reads: {senses: [verb], number: singular, verb: {lemma: read}}
    read: {senses: [verb]}
    reading: {senses: [verb], verb: {lemma: read}}
    receives: {senses: [verb], number: singular, verb: {lemma: receive}}
    receive: {senses: [verb], number: plural, verb: {lemma: receive}}
    received: {senses: [verb], verb: {lemma: receive}}
    wins: {senses: [verb], number: singular, verb: {lemma: win}}
    win: {senses: [verb], number: plural, verb: {lemma: win}}
    won: {senses: [verb], verb: {lemma: win}}

    # event verbs — losses
    loses: {senses: [verb], number: singular, verb: {lemma: lose}}
    lose: {senses: [verb], number: plural, verb: {lemma: lose}}
    lost: {senses: [verb], verb: {lemma: lose}}
    eats: {senses: [verb], number: singular, verb: {lemma: eat}}
    eat: {senses: [verb], number: plural, verb: {lemma: eat}}
    ate: {senses: [verb], verb: {lemma: eat}}
    gives: {senses: [verb], number: singular, verb: {lemma: give}}
    give: {senses: [verb], number: plural, verb: {lemma: give}}
    gave: {senses: [verb], verb: {lemma: give}}
    save: {senses: [verb], number: plural}
    saves: {senses: [verb], number: singular, verb: {lemma: save}}
    saved: {senses: [verb], verb: {lemma: save}}
    saving: {senses: [verb], verb: {lemma: save}}
    sells: {senses: [verb], number: singular, verb: {lemma: sell}}
    sell: {senses: [verb], number: plural, verb: {lemma: sell}}
