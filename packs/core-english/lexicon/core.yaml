# Shared English dictionary, alphabetized by lexical identity.
# Semantic roles and compatibility belong in categories/.
format: rulekit/lexicon@1
entries:
  "'s":
    senses: [possessive]
    notes: >
      owner (left) + owned (right) bind and condense into an owner-attributed
      noun. The copula reading ("he's got") leaves `owned` unmet and the
      sentence declines — never a wrong fact.

