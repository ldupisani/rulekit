format: rulekit/lexicon@1
# General background vocabulary; none of these words supplies an amount.
entries:
  doing: {senses: [verb], verb: {lemma: do}}
  bonus: {senses: [noun], plural: bonuses}
  out: {senses: [adverb]}
  town: {senses: [noun], plural: towns}
  observe: {senses: [verb]}
  observes: {senses: [verb], verb: {lemma: observe}}
  observed: {senses: [verb], verb: {lemma: observe}}
  observing: {senses: [verb], verb: {lemma: observe}}
  action: {senses: [noun], plural: actions}
  discount: {senses: [noun], plural: discounts}
  refund: {senses: [noun], plural: refunds}
  fee: {senses: [noun], plural: fees}
  tax: {senses: [noun], plural: taxes}
  desert:
    senses:
    - noun
    plural: deserts
  island:
    senses:
    - noun
    plural: islands
  season:
    senses:
    - noun
    plural: seasons
  jack:
    senses:
    - noun
    - name
    plural: jacks
  when: {senses: [conjunction]}
