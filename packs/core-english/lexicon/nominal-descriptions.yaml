format: rulekit/lexicon@1
entries:
  stamp: {senses: [noun], plural: stamps}
  snowflake: {senses: [noun], plural: snowflakes}
  # The verb family previously belonged to scratch. Keep one lexical owner
  # while adding the ordinary count-noun sense used by descriptions.
  design: {senses: [noun, verb], plural: designs, verb: {lemma: design}}
  designs: {senses: [noun, verb], verb: {lemma: design}}
  designed: {senses: [verb], verb: {lemma: design}}
  pattern: {senses: [noun], plural: patterns}
  post office: {senses: [noun], plural: post offices, lexical_phrase: true}
