format: rulekit/lexicon@1
entries:
  work: {senses: [verb, noun]}
  works: {senses: [verb], number: singular, verb: {lemma: work}}
  worked: {senses: [verb], verb: {lemma: work}}
  working: {senses: [verb], verb: {lemma: work}}
  eligible: {senses: [adjective]}
  overtime: {senses: [noun]}
  shift: {senses: [noun], plural: shifts}
  hourly: {senses: [adjective]}
  wage: {senses: [noun], plural: wages}
  per: {senses: [rate]}
  plus: {senses: [operator]}
  '+': {senses: [operator]}
