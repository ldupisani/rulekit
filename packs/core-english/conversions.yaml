format: rulekit/conversions@1
conversions:
- from: kilometer
  to: meter
  factor: 1000
- from: mile
  to: kilometer
  factor: 1.609344
- from: kilogram
  to: gram
  factor: 1000
# Substance-scoped density bridge. This is deliberately absent from the
# global conversion graph: kilograms and litres are not interchangeable
# without knowing what material is being measured.
- from: kilogram
  to: liter
  factor: 1
  substance: water
- from: hour
  to: minute
  factor: 60
- from: day
  to: hour
  factor: 24
- from: week
  to: day
  factor: 7
# Conventional whole-period arithmetic used by elementary word problems.
# Calendar dates remain a separate domain; this pair says how a stated yearly
# cadence is projected when no dates or partial weeks are supplied.
- from: year
  to: week
  factor: 52
  scope: cadence
# Standard volume abbreviation, alongside the spelled-out unit.
- from: liter
  to: ml
  factor: 1000
- from: milliliter
  to: ml
  factor: 1
- from: liter
  to: milliliter
  factor: 1000.0

# Standard avoirdupois mass units, shared by measured-content and recipe roles.
- from: pound
  to: ounce
  factor: 16
- from: pound
  to: kilogram
  factor: 0.45359237
- from: ounce
  to: kilogram
  factor: 0.028349523125
