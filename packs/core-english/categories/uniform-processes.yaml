format: rulekit/categories@1
categories:
  partitioned_activity_whole:
    parent: noun
    includes: [decomposable_quantity_whole, partitioned_process]
  partition_component_measure:
    parent: noun
    includes: [component_quantity_measure, process_part]
  whole_partition_verb:
    parent: verb
  partition_progress_activity_verb:
    parent: quantity_ask_verb
    notes: >
      Activities whose completed component measures progress through the whole.
      Existing event and task-completion categories retain their selectional roles;
      acquiring or losing a component does not measure this progress.
  equal_part_size_attribute:
    parent: adjective
    notes: Explicit equality of the portions, not an inference from their count.
  continuation_rate_noun:
    parent: noun
    includes: [rate_frame_noun]
  rate_continuity_attribute: {parent: adjective}
  complete_extent_attribute: {parent: adjective}
members:
  partition_progress_activity_verb: [ate, eat, eats, finish, finished, finishes]
  equal_part_size_attribute: [equal]
  continuation_rate_noun: [pace]
  rate_continuity_attribute: [same]
  complete_extent_attribute: [entire, full, whole]
attribute_compatibility:
  equal_part_size_attribute: [partition_component_measure]
  rate_continuity_attribute: [continuation_rate_noun]
  complete_extent_attribute: [partitioned_activity_whole]
