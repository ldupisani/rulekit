format: rulekit/categories@1
# The semantic layer: hierarchy, polarity pairs, context synonyms, attrs.
# Polarity is declared HERE and only here — every consumer (signed folds,
# sign() in rule expressions) derives from it (the difg LOSS_VERBS lesson).
categories:
    membership_member_noun:
        parent: noun
        notes: >
            Predicate nouns licensed beneath an explicit remainder-membership
            superclass. `animal` is the first declared member family; other
            ontologies can extend this category without widening `animal`.
    animal:
        parent: membership_member_noun
        coordinated_superordinate: true
        notes: >
            A countable superclass for authored animal subtypes. This lets an
            explicit total ask add two or more animal kinds stated together,
            such as penguins plus bears. Unlike a closed subtype family, animal
            kinds stated in separate premises are not assumed exhaustive. The
            generic consumer also declines when only one subtype is known, when
            any held measure is outside this family, or when a direct animal
            total is already present. Member words remain pack-owned below.
    pet: {parent: animal}
    quantity_holder:
        parent: noun
        notes: >
            Common nouns licensed to hold or be compared by an arithmetic
            quantity. Proper names remain independently valid in entity slots.
            This is a positive role boundary: adding an ordinary noun to the
            lexicon does not silently make it a quantity holder.
    dimension_holder:
        parent: quantity_holder
        notes: >
            Common nouns that can bear at least one physical or temporal
            dimension. Narrower holder classes remain distinct so having a
            length or weight does not imply having a duration.
    linear_dimension_holder:
        parent: dimension_holder
        notes: "Entities ordinarily comparable by a declared length measure."
    mass_dimension_holder:
        parent: dimension_holder
        notes: "Entities ordinarily comparable by a declared mass measure."
    duration_holder:
        parent: dimension_holder
        notes: "Events or intervals ordinarily comparable by elapsed time."
    duration_total_subject:
        parent: noun
        notes: >
            Head nouns that can name the whole whose elapsed time is requested
            by a total-duration question. This is separate from a holder's own
            duration: a video can collect section durations without itself
            appearing as a Quantity holder.
    motion_participant:
        parent: quantity_holder
        notes: >
            Common nouns that can plausibly perform a motion event. Proper
            names remain independently valid in verb-role premises. Quantity-
            event participants inherit this role because the currently
            declared people and animals can also move; ordinary objects do not.
    quantity_event_participant:
        parent: motion_participant
        notes: >
            Common nouns that can plausibly perform or undergo an arithmetic
            quantity event such as receiving, buying, eating, giving, or
            losing counted items. Proper names remain independently valid in
            verb-role premises. This category is deliberately narrower than
            `noun`: an object may possess features in a stative comparison
            without being a plausible participant in an event.
    animate:
        parent: quantity_event_participant
        notes: >
            PERSON-DENOTING common nouns — the antecedent-eligibility signal for
            a singular personal pronoun, and the ONLY thing separating "Baker
            made 157 cakes. He sold 158." (bindable) from "The basket has 7
            peaches. He ..." (must stay unbound). Read ONLY by document.py's
            zero-name coreference fallback.

            MEMBERSHIP IS A SOUNDNESS CLAIM, not a vocabulary list: a member
            asserts a singular personal pronoun MAY corefer with this noun, so
            an ambiguous word admitted here becomes a wrong-hazard in every
            corpus at once. Three deliberate exclusions, do not re-add without
            measuring: 'player' ("MP3 player" is a DEVICE — the documented trap
            that cost 2 GSM8K items), 'cook' (verb sense; the 'paint'/'work'/
            'second' precedent), 'king' (name-like; names are already
            candidates). Animals are NOT members — `animal` is a sibling under
            `noun`, and "the dog ... he" has no measured buyer.
    definite_article:
        parent: article
        notes: >
            Articles that make a common-noun phrase referential. Premise
            patterns use this category through `referential: true`; the matcher
            never hardcodes an article word.
    possessive_determiner:
        parent: pronoun
        notes: >
            Pronoun-sensed forms that can determine a following noun ("her
            cousin", "their garden"). This is narrower than `pronoun`: subject,
            object, reflexive, and standalone possessive forms do not license a
            noun merely by preceding it.
    plural_possessive_determiner:
        parent: possessive_determiner
        notes: >
            Possessive determiners that can denote more than one possessor.
            Aggregate noun phrases such as "the sum of their ages" need this
            narrower category: a singular "his ages" cannot establish the
            multiple holders whose values are being summed.
    clause_subject_possessive_determiner:
        parent: possessive_determiner
        notes: >
            Third-person possessive determiners that may take the unique
            preceding clause subject as their owner ("Maya ... her sister",
            "the company ... its building"). First- and second-person forms
            are excluded because "Maya ... my/your sister" cannot identify
            Maya as the possessor.
    animate_possessive_determiner:
        parent: possessive_determiner
        notes: >
            Possessive determiners licensed before an animate appositive role.
            Excludes inanimate `its`; person-neutral `my`, `your`, and `their`
            remain valid without inventing a gender feature in the kernel.
    third_person_animate_possessive_determiner:
        parent: possessive_determiner
        notes: >
            Singular third-person possessives that require an animate local
            subject when a rule treats the optional PP as subject-owned.
            `my`/`your` remain externally deictic, `their` remains number-
            neutral, and inanimate `its` is deliberately separate.
    holder_list_conjunction:
        parent: conjunction
        notes: >
            Additive coordinator licensed between explicitly named holders in
            an exact combined-total question. A general conjunction sense is
            insufficient because disjunction must never become summation.
    bare_pp_object:
        parent: noun
        notes: >
            Nouns independently licensed as bare prepositional adjunct objects
            ("by day", "at night"). Other PP nouns require a definite article
            or possessive determiner when a rule opts into `referential`.
            Corpus-owned temporal members extend this category from their own
            pack.
    timeperiod:
        parent: bare_pp_object
        notes: >
            Nouns that can identify a temporal reference or interval. Core owns
            the category and its generic `year` member; domain packs may extend
            it with weekdays, months, and other calendar vocabulary.
    named_calendar_period:
        parent: timeperiod
        notes: >
            Proper calendar-name nouns that occur bare in the supported
            adjunct grammar. A simple generated PP does not license articles
            or possessive determiners before these names.
    named_weekday:
        parent: named_calendar_period
    named_month:
        parent: named_calendar_period
    temporal_on_point_object:
        parent: timeperiod
        notes: "Temporal point nouns conventionally governed by `on`."
    temporal_in_point_object:
        parent: timeperiod
        notes: "Temporal point/interval nouns conventionally governed by `in`."
    temporal_at_point_object:
        parent: timeperiod
        notes: "Temporal point nouns conventionally governed by `at`."
    bare_entity_reference:
        parent: quantity_holder
        notes: >
            Common-noun-sensed forms also attested as bare entity labels in
            arithmetic prose. This is an exact pack-owned exception for lexical
            name homographs, not a general capitalization heuristic. Their
            independently licensed entity-label reading also makes them valid
            quantity holders.
    quantity_location:
        parent: quantity_holder
        notes: >
            Ordinary place/container nouns admitted as the object of an
            optional quantitative locative adjunct. Referentiality alone makes
            "in the dog" syntactically complete but does not make it a useful
            holder context.
    quantity_interior_location:
        parent: quantity_location
        notes: >
            Locations that admit an interior reading with "in". Surface-only
            objects such as a bench or tree remain quantity locations for
            "on"/"at" but do not become containers merely because they can
            host a quantitative event nearby.
    quantity_container:
        parent: quantity_holder
        notes: >
            Enumerable container heads licensed before an "of NOUN" content
            tail in a bare existential ("30 boxes of apples"). This is narrower
            than `quantity_location`: a place can hold a quantity without its
            own counted instances licensing a container-content partitive.
    quantity_location_preposition:
        parent: preposition
        notes: >
            The general inside/within locative compatible with every declared
            `quantity_location`. Surface and point-location readings use their
            own narrower categories so a preposition is not treated as
            interchangeable merely because all of them are locative.
    quantity_surface_location:
        parent: quantity_location
        notes: >
            Quantity locations that license a surface attachment with "on".
    tree_quantity_surface_location:
        parent: quantity_surface_location
        notes: >
            Tree surfaces whose nominal "on" attachment is restricted to
            things conventionally borne by trees.
    quantity_surface_preposition:
        parent: preposition
        notes: >
            Surface locatives compatible with `quantity_surface_location`.
    quantity_site_location:
        parent: quantity_location
        notes: >
            Quantity locations that license a point/site attachment with "at".
    quantity_site_preposition:
        parent: preposition
        notes: >
            Point locatives compatible with `quantity_site_location`.
    quantity_topic:
        parent: quantity_holder
        notes: >
            Subjects that can organize a distributive quantity by topic, as
            in "14 books about each topic".
    quantity_topic_preposition:
        parent: preposition
        notes: >
            Topical attachment markers compatible with `quantity_topic`.
    topical_quantity_host:
        parent: noun
        notes: >
            Counted things that can naturally carry a topic modifier, as in
            "books about the topic". This is a host boundary, separate from
            the noun allowed after the preposition.
    tree_borne_quantity:
        parent: noun
        notes: >
            Counted produce conventionally borne by trees. This is deliberately
            narrower than edible or ripenable produce: tomatoes and grapes do
            not acquire a tree attachment merely because they are produce.
    quantity_remainder_preposition:
        parent: preposition
        notes: >
            The preposition class that can attach a declared remnant to a
            quantitative conjunct ("with the rest").
    spatial_preposition:
        parent: preposition
        notes: >
            Prepositions with at least one declared spatial reading. Membership
            only makes a word eligible for a narrower location, source, goal,
            or path role; it never chooses among those roles by itself.
    spatial_location_preposition:
        parent: spatial_preposition
        notes: >
            Static location markers licensed with a declared spatial reference.
            Polysemous members such as "at" and "in" remain temporal elsewhere;
            the complement and governing frame decide which reading applies.
    spatial_source_preposition:
        parent: spatial_preposition
        notes: >
            Markers that can identify the source of a declared motion event.
    spatial_goal_preposition:
        parent: spatial_preposition
        notes: >
            Markers that can identify the goal of a declared motion event.
    arrival_goal_preposition:
        parent: preposition
        notes: >
            Point marker licensed as a destination only by a declared arrival
            predicate. It is deliberately separate from spatial_goal_preposition:
            admitting it there would also license "walked at the garden".
    spatial_path_preposition:
        parent: spatial_preposition
        notes: >
            Markers that can identify the path traversed by a declared motion
            event. A member may also have a static location reading.
    spatial_reference_noun:
        parent: noun
        notes: >
            Common nouns independently licensed as spatial reference objects.
            Proper names remain structurally available without being guessed to
            denote places; arbitrary common nouns do not become locations.
    spatial_relation_verb:
        parent: verb
        notes: >
            Predicates that can anchor a static or dynamic spatial relation.
            Copular and motion predicates remain distinct subcategories.
    spatial_copular_verb:
        parent: spatial_relation_verb
        notes: "Copular predicates that anchor a static spatial relation."
    spatial_motion_verb:
        parent: spatial_relation_verb
        notes: >
            Finite motion predicates that license source, goal, and path
            relations. Static copular location uses the existing `copula`
            category instead of widening every verb into a spatial event.
    arrival_motion_verb:
        parent: verb
        notes: >
            Arrival predicates that license their own governed goal frames.
            Kept separate from spatial_motion_verb so the general static
            location frame does not compete with "arrive at" for the same PP.
    location_state_verb:
        parent: verb
        notes: >
            Canonical predicates whose spatial-location frame directly observes
            a location fluent at the stated event time.
    location_initiating_verb:
        parent: verb
        notes: >
            Predicates whose licensed spatial goal initiates a location fluent.
            The kernel reasons over this semantic category, never a word list.
    location_terminating_verb:
        parent: verb
        notes: >
            Predicates whose licensed source or direct place object terminates
            a location fluent. Modal uses do not become observed transitions.
    location_terminating_past_verb:
        parent: location_terminating_verb
        notes: >
            Past surfaces used by the factual no-departure construction. Kept
            narrower than the full termination category so bare and present
            forms cannot enter that rule.
    location_impossibility_modal:
        parent: modal
        notes: >
            Modal admitted by the explicit universal inability construction.
            Kept separate from permission and obligation modals so a prohibition
            cannot silently become physical impossibility.
    negative_person_pronoun:
        parent: pronoun
        notes: >
            Negative human quantifier-pronouns that can scope a universal
            transition constraint. Narrower than ordinary pronoun reference.
    discourse_referential_group_pronoun:
        parent: pronoun
        notes: >
            Plural pronouns that may denote one conservatively constructed
            group of prior referential subjects. Case-specific children keep
            subject and object grammar separate at individual ask slots.
    discourse_group_pronoun:
        parent: discourse_referential_group_pronoun
        notes: >
            Object-case discourse group pronouns, used after forms such as
            "which of". Subject-case forms remain in their sibling category.
    discourse_subject_group_pronoun:
        parent: discourse_referential_group_pronoun
        notes: >
            Subject-case discourse group pronouns, used after an inverted
            copula in questions such as "how old are they".
    clause_subject_personal_pronoun:
        parent: pronoun
        notes: >
            Personal pronouns licensed as finite-clause subjects. Object,
            possessive, and reflexive forms remain outside this category.
    temporal_preposition:
        parent: preposition
        notes: >
            Prepositions with a declared temporal reading. Membership only
            becomes temporal beside a `timeperiod` object; spatial and other
            readings of the same surface remain independent.
    temporal_point_preposition:
        parent: temporal_preposition
    temporal_on_point_preposition:
        parent: temporal_point_preposition
    temporal_in_point_preposition:
        parent: temporal_point_preposition
    temporal_at_point_preposition:
        parent: temporal_point_preposition
        notes: "Markers locating an event at one stated temporal reference."
    temporal_before_preposition:
        parent: temporal_preposition
        notes: "Markers locating an event before a stated temporal reference."
    temporal_after_preposition:
        parent: temporal_preposition
        notes: "Markers locating an event after a stated temporal reference."
    age_projection_preposition:
        parent: preposition
        notes: >
            Prepositions that introduce a future age offset, as in "in five
            years" or "after five years".
    temporal_duration_preposition:
        parent: temporal_preposition
        notes: "Markers locating an event within or across a stated interval."
    temporal_start_preposition:
        parent: temporal_preposition
        notes: "Markers identifying the start boundary of an interval."
    temporal_end_preposition:
        parent: temporal_preposition
        notes: "Markers identifying the end boundary of an interval."
    temporal_deadline_preposition:
        parent: temporal_preposition
        notes: "Markers identifying a latest completion boundary."
    temporal_approximate_preposition:
        parent: temporal_preposition
        notes: "Markers locating an event approximately around a reference."
    circumstantial_preposition:
        parent: preposition
        notes: >
            Prepositions with a declared event-circumstance reading. A marker
            alone never chooses accompaniment, instrument, means, manner,
            cause, or purpose; the governed verb and object categories do.
    accompaniment_preposition: {parent: circumstantial_preposition}
    instrument_preposition: {parent: circumstantial_preposition}
    means_preposition: {parent: circumstantial_preposition}
    manner_preposition: {parent: circumstantial_preposition}
    cause_preposition: {parent: circumstantial_preposition}
    purpose_preposition: {parent: circumstantial_preposition}
    instrument_noun:
        parent: noun
        notes: "Objects conventionally usable as an instrument in a governed frame."
    means_noun:
        parent: bare_pp_object
        notes: "Bare transport or channel nouns licensed after a means marker."
    manner_noun:
        parent: bare_pp_object
        notes: "Abstract nouns independently licensed as a manner description."
    cause_noun:
        parent: noun
        notes: "Nouns independently licensed as the cause of an event."
    purpose_noun:
        parent: noun
        notes: "Nouns independently licensed as the purpose of an event."
    accompaniment_compatible_verb:
        parent: verb
        notes: "Predicates that can be performed in another participant's company."
    instrument_compatible_verb:
        parent: verb
        notes: "Predicates that conventionally admit an instrument argument."
    means_compatible_verb:
        parent: verb
        notes: "Predicates that conventionally admit a means or conveyance."
    manner_compatible_verb:
        parent: verb
        notes: "Predicates that conventionally admit a manner adjunct."
    cause_compatible_verb:
        parent: verb
        notes: "Predicates that conventionally admit a causal adjunct."
    purpose_compatible_verb:
        parent: verb
        notes: "Predicates that conventionally admit a purpose adjunct."
    membership_collection_noun:
        parent: noun
        notes: >
            Explicit superclass nouns licensed in a remainder-membership
            clause ("the rest of the animals were dogs"). When the collection
            noun is stated, the predicate noun must also belong to its
            separately declared member class; a bare "the rest were dogs"
            continues to resolve from discourse without this gate.
    many_incompatible_noun:
        parent: noun
        notes: >
            Noun heads whose declared plural morphology does not license the
            arithmetic "many" count frame. This is a narrow refusal boundary:
            ordinary plural nouns remain available without requiring an
            exhaustive count-noun vocabulary.
    bare_possession_incompatible_noun:
        parent: noun
        notes: >
            Ambiguous abstract noun heads that do not independently license a
            bare quantitative possession reading. This is scoped to
            possession-state verbs: event predicates may still count these
            nouns when their own frame makes the interpretation explicit.
    findable_quantity_object:
        parent: noun
        notes: >
            Counted objects that can ordinarily be found as discrete things.
            This is a positive object-role boundary for quantitative uses of
            find: an abstract noun does not become findable merely because it
            has plural morphology. Concrete size-bearing nouns inherit this
            role below, keeping the vocabulary in one declared hierarchy.
    membership_predicate_incompatible_noun:
        parent: noun
        notes: >
            Noun heads that cannot name the member class in a remainder
            partition. This boundary is local to membership predicates: a
            noun such as `time` remains available as an explicit frequency
            measure in comparison rules.
    conjunct_comparison_incompatible_noun:
        parent: noun
        notes: >
            Noun heads that cannot be the second counted object when an
            elided-standard conjunct derives its value from the first object.
            This is local to that direct-object construction, so explicit
            motion-frequency comparisons may still use `times`.
    existential_incompatible_noun:
        parent: noun
        notes: >
            Counted noun heads whose ordinary plural surface is not an entity
            population in an existential quantity premise. Temporal `times`
            remains available to explicit frequency and duration relations;
            it does not become a scene-held collection through "there are".
    non_quantity_holder:
        parent: noun
        notes: >
            Noun readings known not to denote the subject of an arithmetic
            quantity clause. This is a narrow refusal boundary rather than an
            exhaustive allowlist, so name-like and newly loaded entities stay
            available unless evidence places them here.
    partition_remnant:
        parent: remnant
        notes: >
            Remnant nouns that support the plural subset construction "the
            rest are ...". Singular `remainder` remains available to other
            remnant rules but is not interchangeable with this construction.
    partition_attribute_preposition:
        parent: preposition
        notes: >
            Prepositions that realize an attribute as a subgroup label in a
            partition comparison, as in "more of them in purple". This is
            separate from spatial uses of the same preposition.
    sequential_partition_context:
        parent: noun
        notes: >
            Settings that can explicitly contain one finite population in a
            staged allocation statement.
    sequential_partition_population:
        parent: noun
        notes: >
            Countable populations that can be divided by successive shares.
    sequential_partition_destination:
        parent: noun
        notes: >
            Destination heads used to distinguish the subsets in a staged
            allocation. The full qualified phrase remains the subset key.
    academic_course_modifier:
        parent: adjective
        notes: >
            Academic fields that can qualify a course destination in a staged
            enrollment allocation.
    sequential_partition_remainder:
        parent: adjective
        notes: >
            A marker saying that the next share is taken from the pool left
            after earlier shares, rather than from the original total.
    sequential_partition_verb:
        parent: quantity_event_verb
        notes: >
            Predicates that assign population members to a destination.
    sequential_partition_preposition:
        parent: preposition
        notes: >
            Prepositions that connect a staged-allocation predicate to its
            destination.
    predeterminer_multiplier:
        parent: quantifier
        notes: >
            Multiplicative predeterminers used before a noun phrase, as in
            "double the amount" or "triple the number". They do not license
            the adverbial comparative frame "as many/as much"; that frame
            uses `twice`, `thrice`, or an explicit "N times" multiplier.
    mass_quantity_noun:
        parent: noun
        notes: >
            Non-count quantity heads licensed by "much". Kept separate from
            `mass_measure`, which denotes physical weight units rather than
            mass-noun countability.
    partitive_weight_measure:
        parent: noun
        notes: "Weight units licensed before an 'of SUBSTANCE' complement."
    partitive_volume_measure:
        parent: noun
        notes: "Volume units licensed before an 'of SUBSTANCE' complement."
    partitive_pair_measure:
        parent: noun
        notes: "Pair-counting units whose complements must be pairable."
    partitive_piece_measure:
        parent: noun
        notes: "Piece-counting units whose complements can be divided into pieces."
    weighable_partitive_substance:
        parent: noun
        notes: "Bulk substances conventionally quantified by weight."
    volume_partitive_substance:
        parent: noun
        notes: "Bulk substances conventionally quantified by volume."
    pairable_partitive_substance:
        parent: noun
        notes: "Countable objects conventionally quantified in pairs."
    piecewise_partitive_substance:
        parent: noun
        notes: "Materials or collections conventionally quantified in pieces."
    non_quantity_object_verb:
        parent: verb
        notes: >
            Verb forms known not to license the direct quantitative object
            frame used by arithmetic comparative premises. Rules exclude this
            category declaratively while leaving newly loaded transitive
            quantity verbs available for human review.
    animate_pronoun:
        parent: pronoun
        notes: >
            Singular PERSONAL pronouns — the pronoun-side half of the `animate`
            gate. The kernel has NO gender or person feature (a pronoun unit
            carries only `number`), so without this category the zero-name
            fallback would bind 'it' to a person noun. Excludes 'it' (already
            `pool_pronoun`) and every plural (`_bind_discourse` refuses plurals
            outright — group referents are unbuilt).
    animate_object_pronoun:
        parent: pronoun
        notes: >
            Objective-case animate pronouns. This stays separate from subject
            pronouns and possessive determiners so a transfer recipient cannot
            be generated as an invalid form such as `their` or `his`.
    non_event_verb:
        parent: verb
        notes: >
            verbs excluded from flat event-predicate readers. `state` is the
            quantitative-holding subclass used by arithmetic folds; other forms may
            be non-events for logic parsing without acquiring holding semantics.
            The DSL type remains named `nonstate_verb` for compatibility, but its
            structural exclusion boundary is this category.
    state:
        parent: non_event_verb
        notes: >
            stative verbs — a quantity they state is a HOLDING (same-key
            disagreement is a conflict); any other verb is an EVENT (each
            occurrence is a distinct fact that accumulates, signed by polarity)
    possession_state:
        parent: state
        notes: >
            Stative possession forms that can head a direct quantitative
            holding relation. Copulas remain in sibling `copula`: they state
            quantities in other grammatical frames but cannot connect a
            subject directly to a possessive quantity standard.
    ownership_state:
        parent: possession_state
        selectional_roles:
            actor: quantity_event_participant
            theme: ownable_quantity_object
        notes: >
            Literal ownership predicates. Unlike broad have-possession, these
            require an ordinarily ownable counted theme; temporal dimensions
            such as years cannot become property merely because they occur in
            a general quantity-question slot.
    population_total_verb:
        parent: possession_state
        notes: >
            Possession forms that state how many members a population setting
            has. Ownership predicates remain outside this construction.
    copula:
        parent: state
        notes: >
            Finite forms of "be" used for identity and predication. This is
            deliberately narrower than `state`: possession verbs such as
            have/own may state quantities, but cannot grammatically connect a
            partition to its attribute or a person to an age predicate.
    plural_copula:
        parent: copula
        notes: >
            The plural-agreeing copula forms. Fractional partitions always denote
            a plural collection on their surface ("half of them ARE red"), so
            they use this closed subcategory instead of the general copula.
    singular_copula:
        parent: copula
        notes: >
            Copula forms compatible with a singular grammatical subject or
            predicate head. This keeps fixed singular question frames such as
            "what is the cost" and "what was the difference" from drawing a
            plural form merely because every copula shares the same state sense.
    present_copula:
        parent: copula
        notes: >
            Present-tense copulas used when an ask requires evidence asserted
            at the current discourse perspective. Kept distinct from number:
            both singular `is` and plural `are` belong here.
    past_copula:
        parent: copula
        notes: >
            Past-tense copulas used by explicitly past age constructions.
            Keeping this separate from general `copula` prevents "three years
            ago Fia is..." while retaining ordinary present/past age premises.
    quantity_event_verb:
        parent: quantity_ask_verb
        notes: >
            Quantity-changing event verbs whose common-noun subjects and
            comparison standards must be declared plausible event
            participants. Stative possession verbs remain outside this class.
    animate_subject_verb:
        parent: quantity_ask_verb
        notes: >
            Verbs whose grammatical subject must denote an animate participant.
            Rules opt into this role boundary explicitly; ordinary quantity
            holders do not become sentient merely because they can hold facts.
    teaching_quantity_verb:
        parent: animate_subject_verb
        selectional_roles:
            actor: animate
            theme: teaching_quantity_object
        notes: >
            Teaching predicates whose actor must be person-denoting and whose
            counted theme must be a declared teachable person or subject. The
            category owns this complete frame so premise and ask rules only
            map their surface slots to actor/theme roles; they do not repeat
            teaching-specific category pairs.
    animate_object_verb:
        parent: verb
        notes: >
            Verbs whose direct object must denote an animate participant. This
            keeps a quantitative object frame such as "met half of the group"
            without admitting times, units, or arbitrary physical objects.
    currency_quantity_verb:
        parent: quantity_ask_verb
        notes: >
            Verbs that can govern a money-valued quantity in an affine
            comparison. This is a positive boundary for the bare "the money
            X VERB" frame: motion, arrival, desire, and unrelated event verbs
            do not become monetary merely because the item slot says money.
    enrollment_quantity_verb:
        parent: verb
        selectional_roles:
            actor: quantity_event_participant
            theme: enrollment_quantity_object
        notes: >
            Enrollment predicates whose compared object must be a declared
            enrollable class rather than an arbitrary unit or count noun.
    drop_quantity_verb:
        parent: quantity_event_verb
        selectional_roles:
            actor: quantity_event_participant
            theme: droppable_quantity_object
        notes: >
            Dropping predicates whose compared object must be a portable
            quantity object rather than an area, place, or abstract measure.
    consumption_quantity_verb:
        parent: lose
        selectional_roles:
            actor: quantity_event_participant
            theme: consumable_quantity_object
        notes: >
            Consumption events select an ordinary quantity participant and a
            counted object that can be consumed. More specific verb families
            may narrow the object role without repeating that relationship in
            every grammar rule.
    eating_quantity_verb:
        parent: consumption_quantity_verb
        selectional_roles:
            theme: edible_quantity_object
        notes: >
            Eating predicates whose compared object must be declared edible.
    past_departure_quantity_verb:
        parent: verb
        notes: >
            The ambiguous past departure form when it heads an overt
            quantitative event. It constrains the event actor without making
            the comparison standard itself an actor in that event. The
            construction maps its actor and theme slots because different
            comparison shapes give the standard a different semantic role.
    finishable_quantity_object:
        parent: noun
        notes: "Counted things that can ordinarily be completed or finished."
    student_quantity_measure:
        parent: noun
        notes: >
            Student populations whose holder must be a plausible person or
            educational institution rather than an arbitrary quantity holder.
    student_quantity_holder:
        parent: noun
        notes: >
            People and institutions that may conventionally have students.
    institution_quantity_measure:
        parent: noun
        notes: >
            Counted institutions whose holder must be a plausible geographic
            or organizational scope. Proper names remain independently
            available where a grammar rule permits them.
    institution_quantity_holder:
        parent: quantity_holder
        notes: >
            Geographic or organizational scopes that may conventionally have
            counted institutions. Extension packs can add cities, regions,
            states, companies, or other suitable holder classes here.
    enrollment_quantity_object:
        parent: noun
        notes: "Counted classes that can ordinarily be enrolled or taken."
    teaching_quantity_object:
        parent: noun
        notes: "Counted people or subjects that can ordinarily be taught."
    ownable_quantity_object:
        parent: noun
        notes: >
            Counted objects that can ordinarily be owned. Transferable and
            portable object categories inherit this role, so extension packs
            normally extend ownership through the existing object hierarchy.
    transferable_quantity_object:
        parent: ownable_quantity_object
        notes: >
            Counted objects that can ordinarily be given or sold without an
            omitted measure or special interpretation. Extension packs add
            their own concrete transfer objects to this shared role.
    droppable_quantity_object:
        parent: transferable_quantity_object
        notes: "Portable counted objects that can ordinarily be dropped."
    consumable_quantity_object:
        parent: noun
        notes: "Counted objects that can ordinarily be consumed."
    edible_quantity_object:
        parent: consumable_quantity_object
        notes: "Counted objects that can ordinarily be eaten."
    shucking_verb:
        parent: quantity_event_verb
        selectional_roles:
            actor: quantity_event_participant
            theme: shuckable_item
        notes: "Quantity events whose counted object must be shuckable."
    shuckable_item:
        parent: noun
        notes: "Counted objects that can ordinarily be shucked."
    acquire: {parent: quantity_event_verb, antonym: lose, polarity: 1}
    purchase:
        parent: acquire
        notes: "Verbs that license an ordinary purchase-capacity question."
    wage_verb:
        parent: quantity_ask_verb
        notes: >
            Narrow earnings verbs used by wage-rate questions. Membership is
            separate from broader acquisition and production event meanings.
    compensated_activity:
        parent: noun
        notes: >
            Activities that may explicitly scope a wage rate and an elapsed
            duration. Membership says only that the noun denotes an activity;
            the sentence must still state both the rate and the matching time.
    activity_duration_verb:
        parent: auxiliary
        notes: >
            Forms that can head the bounded "did DURATION of ACTIVITY"
            elapsed-time construction. This remains separate from question
            auxiliaries even when a surface form belongs to both categories.
    initiation_quantity_verb:
        parent: quantity_ask_verb
        selectional_roles:
            actor: initiation_quantity_participant
            theme: initiable_quantity_object
        notes: >
            Direct-object senses of begin/start in quantitative comparisons.
            The object must denote an activity or institution that can
            ordinarily be initiated; start-state marker use remains separate.
    initiation_quantity_participant:
        parent: noun
    initiable_quantity_object:
        parent: noun
    earning_quantity_verb:
        parent: quantity_ask_verb
        selectional_roles:
            actor: earning_quantity_participant
            theme: earnable_quantity_object
        notes: >
            Direct quantitative earning predicates. Their subjects/standards
            must be plausible earners and their objects must be money or a
            declared reward, not prices or arbitrary physical populations.
    earning_quantity_participant:
        parent: noun
    earnable_quantity_object:
        parent: noun
    production_quantity_verb:
        parent: quantity_ask_verb
        selectional_roles:
            actor: production_quantity_participant
            theme: producible_quantity_object
        notes: >
            Direct quantitative production predicates, kept separate from
            wage-question `make` so both actor and produced-object roles are
            explicit in premise rules.
    production_quantity_participant:
        parent: noun
    producible_quantity_object:
        parent: noun
    output_quantity_verb:
        parent: quantity_ask_verb
        selectional_roles:
            actor: production_quantity_participant
            theme: output_quantity_measure
        notes: >
            Productive actions that can be asked about in the units making up
            their output, such as pages written. This frame is separate from
            the product-object frame: writing a book selects the book, while
            asking how many pages were written selects the output measure.
    output_quantity_measure:
        parent: noun
    output_quantity_product:
        parent: producible_quantity_object
    content_progress_quantity_verb:
        parent: quantity_event_verb
        selectional_roles:
            actor: quantity_event_participant
            theme: content_progress_object
        notes: >
            Events that advance through measured content. The object contract
            covers both a content product (a book) and its progress measure
            (pages), while grammar rules decide which surface is present.
    content_progress_perfect_participle:
        parent: content_progress_quantity_verb
        notes: >
            Irregular or otherwise non-obvious participial surfaces licensed
            after a perfect auxiliary. Membership is morphology data: the
            surrounding ask supplies the perfect construction.
    content_progress_object:
        parent: noun
    content_progress_measure:
        parent: content_progress_object
    content_progress_product:
        parent: content_progress_object
    realized_ability_adjective:
        parent: adjective
        notes: >
            Predicative adjectives whose "was ADJECTIVE to VERB" use states a
            successfully realized event amount, rather than bare capacity.
    relative_period_attribute:
        parent: adjective
        notes: >
            Attributes that turn a duration noun into a discourse-relative
            period, such as "last week". The duration head remains the period
            identity; this category licenses the qualifier.
    price_verb:
        parent: quantity_ask_verb
        notes: >
            Verbs that state or ask for an item's unit price with the item as
            grammatical subject.
    passive_quantity_participle:
        parent: verb
        notes: >
            Declared passive participles whose event quantities may be summed
            by an entity-less total ask. Membership supplies the voice evidence
            for irregular forms that cannot be recognized from a suffix.
    passive_quantity_object:
        parent: noun
        notes: >
            Countable objects that may head an entity-less passive quantity
            question. Units, dimensions, times, and abstract totals do not
            become things that were bought, sold, eaten, or given merely
            because they are nouns.
    spend_target_prep:
        parent: preposition
        notes: >
            The narrow `for`/`on` target markers used by priced-purchase and
            cost-of-quantity questions; temporal `in` remains outside it.
    find_quantity_verb:
        parent: acquire
        selectional_roles:
            actor: quantity_event_participant
            theme: findable_quantity_object
        notes: >
            Forms of find whose counted direct object must be a declared
            findable quantity object. Other acquiring predicates retain their
            own independently reviewable object boundaries.
    win_quantity_verb:
        parent: acquire
        selectional_roles:
            actor: animate
            theme: winnable_quantity_object
        notes: >
            Forms of win whose compared object must be a declared prize-like
            quantity. This is narrower than generic acquisition: finding or
            receiving a material does not make that material something that
            can ordinarily be won.
    winnable_quantity_object:
        parent: noun
        notes: >
            Quantity nouns that can ordinarily denote what is won. Extension
            packs may add awards or prizes without widening every acquired
            object into this role.
    lose: {parent: quantity_event_verb, antonym: acquire, polarity: -1}
    directional_change_verb:
        parent: verb
        notes: >
            Verbs whose lexical meaning itself declares an increase or
            decrease. This is deliberately separate from acquire/lose:
            "received less" is valid quantity comparison, while "rose less"
            carries contradictory change directions.
    increase_verb:
        parent: directional_change_verb
        antonym: decrease_verb
        polarity: 1
    decrease_verb:
        parent: directional_change_verb
        antonym: increase_verb
        polarity: -1
    price_relation_verb:
        parent: verb
        notes: >
            Finite copular and cost forms that can relate an item to an
            anaphoric price ("the bed is ten times that price", "the refill
            costs twice that price"). General motion and event verbs do not
            state a price merely by preceding the frame.
    transfer_out:
        parent: lose
        selectional_roles:
            actor: quantity_event_participant
            theme: transferable_quantity_object
        notes: >
            Outbound transfer verbs that license a recipient argument in either
            ditransitive ("gave Kim 3 apples") or prepositional ("gave 3 apples
            to Kim") form. Loss, consumption, dropping, and spending remain in
            `lose` but do not acquire a recipient merely because "to NAME"
            follows them.
    committed_transfer_decision_verb:
        parent: verb
        notes: >
            Finite decision predicates that introduce an explicit infinitival
            contribution, as in "her guardian decided to give her $40". The
            surrounding rule preserves the beneficiary and contributor; this
            category alone never asserts that an arbitrary decision transfers
            anything.
    contribution_transfer_verb:
        parent: transfer_out
        notes: >
            Outgoing transfers that directly contribute the stated amount to
            their recipient. A sale remains an outgoing transfer but is not a
            contribution, so it deliberately stays outside this narrower
            category.
    spend_verb:
        parent: verb
        notes: >
            'pay'/'spend' asks over priced purchases ("3 toys at $10 each") are a
            DERIVED total, not a literal event verb — the purchase-total
            consumer's gate, kept narrower than the general 'lose' category so
            an unrelated 'sell' ask never answers from purchase data.
    sell:
        parent: lose
        notes: >
            Sales verbs. This narrower class remains distinct from general
            outbound loss so rules can constrain sales-specific objects and
            consumers without treating eating, giving, or spending as sales.
    delta: {parent: comparative, notes: "direction words in 'N more/fewer X than Y'"}
    quantity_delta:
        parent: comparative
        notes: >
            General additive amount directions for explicit quantity and
            count-measure relations. Age-specific "older/younger" remain in
            `delta` for age constructions but do not license phrases such as
            "older than twice as many apples".
    age_comparative:
        parent: comparative
        notes: >
            the age-specific comparative pair ('older'/'younger') — a sibling of
            'delta', not a member of it, so a MULTIPLICATIVE age relation ("X is
            13 times older than Y", no stated noun) never sweeps in the general
            magnitude words 'more'/'fewer'/'less' that also sit in 'delta' (and
            in 'higher'/'lower'). Scoped to exactly these two words. Their
            generic comparative lexicon and `more_dir`/`less_dir` memberships
            live here; difg-mined may still extend them with its own
            `higher`/`lower` categories.
    dimension_comparative:
        parent: comparative
        notes: >
            mining candidate dimension-comparatives: physical-dimension
            comparative adjectives ('taller'/'shorter', 'longer'/'shorter',
            'heavier'/'lighter', 'wider'/'narrower', 'larger'/'smaller',
            'higher'/...) that anchor a Relation exactly like 'age_comparative'
            anchors the age family — a sibling of 'delta', NOT a member of it.
            Unlike 'older'/'younger' (which ALSO tag 'more_dir'/'less_dir' for
            their additive form), these words are otherwise unused elsewhere, so
            admitting them to 'more_dir'/'less_dir' would silently widen
            'delta' itself for every OTHER delta-gated rule (the shared-category
            HANDOFF invariant) — the whole reason this is its OWN category
            rather than an extension of an existing one. `dimension_more`/
            `dimension_less` below carry the actual sign, mirroring 'more_dir'/
            'less_dir's own polarity structure but scoped to this family only;
            the generic comparative words and their signed memberships live
            here, while difg-mined may extend them with its broader
            `higher`/`lower` categories.
    dimension_more: {parent: dimension_comparative, antonym: dimension_less, polarity: 1}
    dimension_less: {parent: dimension_comparative, antonym: dimension_more, polarity: -1}
    linear_dimension_comparative:
        parent: comparative
        notes: >
            Dimension comparatives licensed with declared length units; the
            duration-compatible pair also licenses time units through the
            compatibility table below.
    mass_dimension_comparative:
        parent: comparative
        notes: "Dimension comparatives licensed with declared mass units."
    duration_dimension_comparative:
        parent: comparative
        notes: "Duration comparatives licensed with concrete elapsed-time units."
    measured_comparative:
        parent: comparative
        notes: >
            Comparatives that may follow an explicit counted measure without a
            stated standard. The consume-only dangling rule uses this union to
            expose every supported form without emitting a semantic fact.
    dimension_adjective:
        parent: adjective
        notes: >
            mining candidate dimension-comparatives: the POSITIVE (base) form of
            a physical-dimension adjective ('tall', 'long', 'heavy', 'wide',
            'high', 'large', 'small', 'short') — gates the dimension asks ("how
            tall is X", "how many inches tall is X"), modelled on ask/how-old-is
            but needing a CATEGORY (several base words) rather than one literal
            ('old'). A sibling of 'dimension_comparative' (the comparative
            forms), not a member of it: an ask needs the base form only, never
            'taller'/'shorter' etc. Most members are difg-mined words; 'small'/
            'large' are core-english, tagged in this file's own `members:`.
    unit_dimension_adjective:
        parent: dimension_adjective
        notes: >
            Base dimension adjectives that can follow an explicit counted
            unit in an absolute question, such as "inches tall" or "pounds
            heavy". Relative-only and generic size adjectives remain outside.
    linear_unit_dimension_adjective:
        parent: unit_dimension_adjective
    mass_unit_dimension_adjective:
        parent: unit_dimension_adjective
    size_attribute:
        parent: dimension_adjective
        notes: >
            Base adjectives that may describe the size or magnitude of a noun.
            Compatibility remains separately declared: a size adjective can apply
            to more than one noun category without making those noun categories
            interchangeable.
    color_attribute:
        parent: adjective
        notes: >
            Color adjectives used in explicit-noun partition predicates. Membership
            is extensible by packs; applicability is licensed independently through
            `attribute_compatibility`.
    ripeness_attribute:
        parent: adjective
        notes: >
            Ripeness predicates. Core declares the reusable category boundary while
            corpus-backed packs own their adjective members.
    colorable_noun:
        parent: noun
        notes: "Nouns for which a color partition is an ordinary reading."
    physical_size_noun:
        parent: findable_quantity_object
        notes: "Concrete nouns for which small/large is an ordinary size predicate."
    magnitude_noun:
        parent: noun
        notes: "Aggregate or scalar nouns for which small/large describes magnitude."
    remainder_collection_noun:
        parent: noun
        notes: "Countable collection nouns that license the remnant predicate 'left'."
    ripenable_noun:
        parent: noun
        notes: "Produce nouns that license a ripeness predicate."
    start_marker_verb:
        parent: verb
        notes: >
            The VERB inside a trailing start-state marker — "to BEGIN with", "to
            START with". Gates the start-state asks (packs/arithmetic/rules/
            start-state.yaml), whose consumer UNDOES the narrated events.

            That file explains why the markers there are LITERALS rather than a
            category: they span four parts of speech ('before' preposition,
            'beginning' noun, 'originally' adverb), and a category roots at exactly
            ONE sense. That reasoning still holds and this does not contradict it —
            it is the SUBSET that happens to share a sense. 'begin' and 'start' are
            both `verb`, and "to _ with" is one frame around them, so one category
            turns what would be (2 markers x N shapes) asks into (1 x N). Any marker
            whose word is not a verb still needs its own literal ask.

            Members live in difg-mined — both words are difg-mined lexicon entries,
            so a core-only registry must still compile (the litter/age_noun rule).
    pool_pronoun:
        parent: pronoun
        notes: >
            A pronoun that DENOTES A POOL — "she lost one fourth OF IT", "half OF
            THEM". Gates arithmetic/fraction-of-pronoun, whose synthesizer sizes the
            fraction against the definite pool.

            It exists to keep that rule off the POSSESSIVE determiners, which sense
            as plain 'pronoun' too and are a different construction: in "Ben gave
            half of HIS marbles", 'his' does not denote the pool — it modifies
            'marbles' and names a possessor whose holdings are the intended base.
            Ungated, the rule read "half of his marbles" as half of THE POOL and, in
            a two-holder document, sized Ben's half against Ben's 18 PLUS John's 17.

            MEMBERSHIP IS MEASURED, not intuited (all six corpora, the word after
            "<fraction> of"): them 100 · it 23 are pool-denoting; his 78 · her 73 ·
            its 18 · their 15 are possessive and deliberately EXCLUDED. 'her' is the
            one to think twice about — it is a possessive determiner here ("half of
            her cookies"), never the object pronoun.

            Both generic members live in core-english and are tagged in this file;
            corpus-mined vocabulary is not required for this grammatical category.
    plural_object_pronoun:
        parent: pronoun
        notes: >
            Object-case plural pronouns licensed as the collection in cardinal and
            fractional partition premises ("3 of THEM", "half of THEM"). This is
            narrower than `pool_pronoun`: "it" can denote a fraction's source pool,
            but singular "of it/he/she/I" is not the partition surface these rules
            describe.
    currency:
        parent: noun
        interchangeable: true
        notes: >
            money words. A bare how-much ask resolves `measure: currency` to the
            UNIQUE currency measure in the facts; mixed currencies decline.
            `interchangeable` because denominations name the same stuff — the ONLY
            category allowed to resolve a factless ask noun to its in-store
            sibling (cat/dog in 'animal' must never stand in for each other).
    mass_currency_noun:
        parent: currency
        notes: >
            Currency-denoting mass nouns that can head a direct proportional
            amount phrase ("twice the money Sam has"). Denomination count nouns
            such as "dollar" remain in the parent currency category but cannot
            fill this narrower grammatical role.
    age_noun:
        parent: noun
        notes: >
            mining candidate sum-constraint-premise-surfaces: the noun 'age'
            (singular lemma; 'ages' collapses onto it via the ordinary plural
            mapping) — gates the sum-constraint premise surfaces that state an
            AGE total ("the sum of their ages is N", "a combined age of N") so
            they can emit the same DATA measure 'year' the age family already
            commits to everywhere else (arithmetic/stated-age, ask/how-old-is),
            never a bare 'age' measure key nothing else in the age family would
            ever match. Scoped to exactly this one word — a separate class from
            'age_comparative' (the comparative ADJECTIVES 'older'/'younger'),
            which anchors a Relation, not a group total. 'Age' is generic English
            vocabulary and lives in core-english beside this membership, so every
            project that loads the core grammar can realize and inspect these age
            constructions without depending on corpus-mined vocabulary.
    compute_verb:
        parent: imperative
        notes: >
            mining candidate dimension asks: the closed set of
            IMPERATIVE task-cue verbs ('compute'/'calculate'/'determine') that
            head the imperative single-holder and aggregate asks ("Calculate
            the age of Arden", "Calculate their combined height", "Determine
            the average weight of the three"). Rooted at
            'imperative' (added to registry.ROOT_SENSES the same way 'time'/
            'article'/'pronoun' were — purely additive, see that file's own
            comment), NOT 'verb': 'compute' carries ONLY the `imperative` sense
            (packs/core-english/lexicon/core.yaml — it is never used as an
            ordinary verb in this grammar), so a category rooted at 'verb'
            could never admit it as a member (the "member carries the root
            sense" compile invariant). 'calculate'/'determine' carry BOTH
            `verb` and `imperative` senses and satisfy either root; rooting
            here keeps all three members in one category. A separate category
            from the bare `imperative` SENSE itself (which `cat: imperative`
            would also match directly via the degenerate-sense fallback): this
            ask family names its own precondition explicitly so a FUTURE
            imperative-sensed word admitted for an unrelated purpose never
            silently widens it too. 'compute' is core-english (tagged in this
            file's own `members:` below); 'calculate'/'determine' are
            difg-mined words, so their membership lives in packs/difg-mined/
            categories/semantic.yaml.
    dimension_noun:
        parent: noun
        notes: >
            mining candidate dimension asks: nouns that name a
            MEASURE by the DIMENSION being measured rather than by the unit
            itself ('height'/'weight'/'age'/'distance'/'balance'/'earnings'/
            'cost' — "their combined HEIGHT", "the average WEIGHT of the
            three", "the AGE of Arden"). Gates the `item` slot on the
            imperative-headed single, combined, and average dimension asks
            (packs/arithmetic/rules/core.yaml) — a PURE PATTERN-MATCHING gate,
            structurally analogous
            to `age_noun`/`dimension_adjective` above, never itself consulted
            for measure RESOLUTION (that is `length_measure`/`mass_measure`/
            `time_measure`/`currency_measure` below, a deliberately SEPARATE
            set of categories — see `dimension` in data/schemas.py's
            CategoryDef for why resolution needs its own opt-in flag rather
            than reusing `interchangeable`). Generic `age` is core-owned below;
            the remaining corpus-mined members extend this category from
            packs/difg-mined/categories/semantic.yaml.
    length_measure:
        parent: noun
        dimension: true
        notes: >
            mining candidate dimension asks: the physical-LENGTH
            unit family — concrete units ('foot'/'inch'/'yard'/'meter'/
            'centimeter'/'kilometer'/'mile') AND the dimension nouns that name
            the same family without naming a unit ('height'/'distance') are
            members of this ONE category (both kinds are noun-sensed, so both
            satisfy this category's root sense — see CategoryDef's `dimension`
            field docstring). `answer.py`'s `_resolve_dimension_measure`
            (called only when a single, combined, or average ask opts in via
            `dimension_measure: true`) resolves a dimension-noun ask like
            "the height of Arden" or "their combined height" to whichever
            concrete length unit is UNIQUELY present in the relevant facts —
            the same UNIQUE-OR-DECLINE
            discipline `currency`'s `interchangeable` resolution already uses,
            via a SEPARATE registry set (`dimension_categories`, never
            `interchangeable_categories`) so this never widens
            `_resolve_measure`/`_resolve_measure_against`, which every OTHER
            consumer keeps calling unchanged. Generic `inch` and its
            membership are core-owned; the remaining corpus-mined members
            extend this category from packs/difg-mined/categories/
            semantic.yaml.
    mass_measure:
        parent: noun
        dimension: true
        notes: >
            sibling of `length_measure` for WEIGHT — concrete units
            ('pound'/'ounce'/'kilogram'/'gram') plus the dimension noun
            'weight'. Generic `pound` is core-owned; the remaining
            corpus-mined members extend this category from difg-mined. See
            `length_measure`'s note for the shared mechanism.
            'pound' is ALSO a member of the pre-existing `currency` category
            (British pounds sterling) — harmless multi-category membership,
            exactly like 'older'/'younger' already carrying two category tags
            elsewhere in this file; the two categories are consulted by
            entirely separate resolution paths (`interchangeable_categories`
            vs `dimension_categories`) and never interact.
    volume_measure:
        parent: noun
        dimension: true
        notes: >
            Concrete volume units. A mass-to-volume answer may cross into this
            family only through a substance-scoped conversion; membership
            alone never relates mass and volume.
    measurement_container:
        parent: noun
        notes: >
            Containers whose aggregate contents can be observed by a
            measurement instrument. Membership does not assign a mass to the
            empty container; a premise must state a total-reading anchor.
    measurement_instrument:
        parent: noun
        notes: >
            Instruments that observe an aggregate physical dimension without
            acquiring that dimension as an intrinsic property.
    measured_content_substance:
        parent: noun
        notes: >
            Substances introduced into a measured container. An update keeps
            the substance identity even when only its effect on the aggregate,
            rather than its independent amount, is stated.
    measurement_placement_verb:
        parent: verb
        notes: "Predicates that position a measured container on an instrument."
    measured_content_transfer_verb:
        parent: verb
        notes: "Predicates that introduce content into an explicit container."
    measured_content_adjustment_verb:
        parent: verb
        notes: "Predicates that add content to the active measured container."
    measurement_target_verb:
        parent: verb
        notes: "Predicates whose complement states a resulting aggregate reading."
    measurement_observation_verb:
        parent: verb
        notes: "Predicates that name an instrument's observed reading."
    measurement_mass_verb:
        parent: verb
        notes: "Predicates that state an entity's intrinsic measured mass."
    measurement_sufficiency_marker:
        parent: adjective
        notes: >
            Markers saying an unspecified content amount is sufficient to
            produce the separately stated aggregate effect.
    measurement_container_entry_preposition:
        parent: spatial_goal_preposition
        notes: "Goal markers that place introduced content inside a container."
    final_measurement_attribute:
        parent: adjective
        notes: "Attributes that explicitly request the terminal observed reading."
    mass_dimension_noun:
        parent: dimension_noun
        notes: >
            Dimension nouns that name an aggregate mass reading rather than a
            concrete unit.
    time_measure:
        parent: noun
        dimension: true
        notes: >
            sibling of `length_measure`/`mass_measure` for DURATION and AGE —
            concrete units ('minute'/'hour'/'day'/'week'/'month'/'year') plus
            the dimension noun 'age' (an age total always folds to 'year'
            elsewhere in this grammar — arithmetic/stated-age, ask/how-old-is
            — so resolving 'age' against whichever time unit is uniquely
            in-store lands on the same place; "calculate the age of Arden",
            "calculate their combined age", and "determine the average age of
            the three" reuse the SAME dimension-resolution mechanism that
            `length_measure`/`mass_measure` already gate). A dimension-
            ADJECTIVE totality sibling ("how long
            is the total X?", binding this category's OWN NAME directly as
            `measure` — the same move `currency`'s `measure: currency`
            precedent makes) was PROTOTYPED and DROPPED, then RE-LANDED
            (mining candidate distributive-holder-enum) once its blocker was
            fixed: dev-train's "Bart makes a mixtape... How long is the total
            tape?" exposed a pre-existing latent oversum in the entity-less
            'combined' consumer — a bare rate-defining sentence ("Each song is
            4 minutes") left its OWN raw Quantity(entity='song',
            measure='minute', value=4) fact behind ALONGSIDE the
            container-contents synth's bridged per-side totals, and
            enumerating every 'minute' holder summed all three (44 instead of
            gold 40). `_combined_holder_totals`'s entity enumeration
            (answer.py) now drops any entity whose Quantity was CONSUMED by a
            bridging synth (synth/container-contents,
            synth/distributive-container-total) to derive some other holder's
            total — ArithmeticLog.consumed_rate_keys, populated at the synth's
            own emission site, never guessed from the sentence's shape. The
            ask itself is `ask/how-long-is-total-dimension` (packs/arithmetic/
            rules/core.yaml), binding `measure: time_measure` directly and
            `dimension_measure: true` — 'long' is deliberately NOT a member of
            this category (adjective-sensed; this category is noun-rooted, so
            it could never join anyway); the ask names the category directly
            instead, exactly the `_resolve_dimension_measure` docstring already
            anticipated.
    duration_measure:
        parent: noun
        notes: >
            Concrete elapsed-time units accepted by duration-rate premises.
            This is narrower than `time_measure`, which also contains the
            abstract dimension noun `age`; "70 ages" is not a duration span.
    dimension_difference_measure:
        parent: noun
        notes: >
            Concrete units licensed by "how many UNIT taller/lighter/..."
            questions. Dimension nouns such as cost, height, and weight stay
            outside because this surface asks for a count of units.
    frequency_quantifier:
        parent: quantifier
        notes: >
            Quantifiers that license an explicit counted recurring rate span
            ("every six months"). Existential and amount quantifiers such as
            "some" do not state a definite frequency. The valid implicit-one
            "each year" shape needs its own representation rather than
            pretending that `each 6 years` is grammatical.
    distributive_quantifier:
        parent: quantifier
        notes: >
            Quantifiers that distribute a stated quantity over each member of
            a container class ("in each row" / "in every box"). This is
            separate from the broad `quantifier` sense so amount and totality
            words such as "some" and "all" cannot become container
            determiners.
    postpositive_distributive_quantifier:
        parent: quantifier
        notes: >
            The narrow post-coordination marker in questions such as "how
            many books do Ana and Ben each have?" This is separate from the
            container determiner category above because "every" is valid in
            "every box" but not in "Ana and Ben every have".
    individualizing_adverb:
        parent: adverb
        notes: >
            Manner markers that request one answer for every explicitly named
            holder. They may occur immediately before or after the question's
            lexical verb; ordinary adverbs do not acquire that answer scope.
    holding_anchor_adverb:
        parent: adverb
        notes: >
            Temporal or aspectual adverbs that can naturally appear before a
            stative holding verb in a conjoined quantity anchor ("and still
            had 5 hats"). Directional adverbs such as "off" do not belong.
    narration_sequence_adverb:
        parent: adverb
        notes: >
            Clause-medial markers that order successive narrated events. They
            do not change the event's participants or quantitative effect.
    restrictive_focus_adverb:
        parent: adverb
        notes: >
            Restrictive focus markers that may immediately precede an event
            verb or its measured amount while preserving that amount as the
            asserted upper bound. Ordinary manner and temporal adverbs remain
            outside this category.
    currency_measure:
        parent: noun
        dimension: true
        notes: >
            sibling of `length_measure`/`mass_measure`/`time_measure` for
            MONEY — the concrete unit 'dollar' (tagged in this file's own
            `members:` below, a core-english word) plus the dimension nouns
            'cent'/'balance'/'earnings' and core-owned 'cost' (memberships in
            the difg-mined extension pack). Deliberately a SEPARATE category from
            the pre-existing `currency` (`interchangeable: true`): adding
            'balance'/'earnings'/'cost' to `currency` itself would widen
            `_resolve_measure_against`, consulted by every non-opted-in ask,
            not just the dimension-aware single/combined/average paths —
            exactly the shared-function blast radius `length_measure`'s note
            above avoids.
    count_intensifier:
        parent: comparative
        notes: >
            mining candidate relation-standard-frames: 'more' used as a bare
            INTENSIFIER wedged between a bare count and its noun ("in eight MORE
            years", "eight more years, ...") — never the comparative-DELTA use
            of the same word ("5 MORE apples THAN Tom", cat: more_dir/delta).
            'more' carries BOTH tags at once, exactly like 'older'/'younger'
            already carry both 'age_comparative' and 'more_dir'/'less_dir'
            elsewhere in this file: a word belonging to two categories never
            widens either category's own membership, so every OTHER rule gated
            on 'delta'/'more_dir' keeps matching exactly as before. Root sense
            'comparative' (not 'adjective'): 'more's own lexicon sense above is
            'comparative', and every category member must carry its category's
            root sense (registry.py's compile-time invariant) — this is why
            'additional' (an 'adjective'-sensed synonym) is NOT folded into this
            same category rather than widening the root; it would need its own
            sibling category, out of scope until a second proven pair needs it.
    aggregate_noun:
        parent: noun
        notes: >
            'the NUMBER of X' / 'the AMOUNT of X' — frame nouns for ratio
            rules. These generic frame nouns are core-owned so the generation
            workbench can expose every rule premise they license.
    count_aggregate_noun:
        parent: noun
        notes: >
            Aggregate frame nouns that govern plural count nouns ("the number
            of books"). Mass frames remain outside this rule family until a
            declared mass-noun realization exists.
    group_total_marker:
        parent: aggregate
        notes: >
            Aggregate words that assert a sum rather than an average. This
            semantic subset is the marker domain for GroupTotal premises.
    prenominal_group_total_marker:
        parent: group_total_marker
        notes: >
            Sum markers that can directly modify a dimension noun, as in
            "combined age" or "total weight". Postpositive markers such as
            "together" and "altogether" remain outside this word order.
    group_total_quantifier:
        parent: quantifier
        notes: >
            Quantifiers licensed before a trailing GroupTotal marker. The
            marker itself has a separate compatibility category so declaring
            "all" here does not create "all total" or other arbitrary
            quantifier/aggregate combinations.
    plural_subject_quantifier:
        parent: quantifier
        notes: >
            Quantifiers that may directly determine a plural subject in a
            combined-total question ("all children", "both teams").
            Distributive singular forms such as "each" remain outside.
    quantified_group_total_marker:
        parent: group_total_marker
        notes: >
            Group-total markers licensed after the declared totality
            quantifier. This represents the conventional "all together"
            pairing without narrowing bare "together", "total", "combined",
            or "altogether".
    prepositional_group_total_marker:
        parent: group_total_marker
        notes: >
            Group-total markers licensed after the declared total-marker
            preposition. This keeps "in total" without admitting combinations
            such as "in combined".
    group_total_preposition:
        parent: preposition
        notes: >
            Prepositions licensed immediately before a prepositional
            GroupTotal marker.
    group_total_scope:
        parent: noun
        notes: >
            Locations or containers that may delimit an entity-less combined
            total, as in "in the two lakes". This is not an exclusion class.
    group_total_scope_preposition:
        parent: preposition
        notes: >
            Locative prepositions licensed before a trailing combined-total
            scope, such as "in the two lakes" or "on the two farms".
    frame_prepositional_verb:
        parent: verb
        notes: >
            Verbs licensed when a ratio-frame head includes the optional
            destination preposition and repeats it after the relative-clause
            standard.
    ratio_particle_verb:
        parent: verb
        notes: >
            Quantity-event verbs whose particle may appear between the verb
            and a count-ratio frame such as "throws in twice the number".
            Destination motion belongs to the repeated relative-clause frame,
            not the shorter "as STANDARD" construction.
    frame_head_preposition:
        parent: preposition
        notes: >
            Prepositions licensed between a ratio-frame verb and multiplier.
            A bound member conditionally requires a declared frame-
            prepositional verb; direct heads remain unaffected.
    motion_comparison_verb:
        parent: verb
        selectional_roles:
            actor: motion_participant
            theme: motion_comparison_measure
        notes: >
            Motion verbs licensed in explicit frequency and distance ratio
            comparisons. This category is separate from the prepositional-
            frame category: it controls participant plausibility and whether
            an elided `as many` measure is informative enough to accept.
    motion_comparison_measure:
        parent: noun
        notes: >
            Count nouns that can overtly measure a motion comparison, such as
            repetitions or units of distance. Arbitrary transported objects
            do not become motion measures merely because they are countable.
    destination_preposition:
        parent: preposition
        notes: >
            Destination prepositions paired across a prepositional ratio-frame
            relative clause.
    remnant:
        parent: noun
        notes: "'the REST' / 'the REMAINDER' — remainder-of-pool referents"
    remnant_adj:
        parent: adjective
        notes: "'the REMAINING pages' / 'pages LEFT' — remainder-anchored fractions defer to the rest machinery"
    prenominal_remnant_adj:
        parent: remnant_adj
        notes: >
            Remainder attributes grammatical before their noun. Postpositive
            forms such as "pages left" remain in the parent only.
    more_dir: {parent: delta, antonym: less_dir, polarity: 1}
    less_dir: {parent: delta, antonym: more_dir, polarity: -1}
    count_quantity_delta:
        parent: quantity_delta
        notes: >
            Additive directions licensed before an overt plural count noun.
            `less` remains available to mass-quantity siblings but not to the
            count-frame family, which requires `fewer` or neutral `more`.
    mass_quantity_delta:
        parent: quantity_delta
        notes: >
            Additive directions licensed for a declared singular mass noun.
            `fewer` remains available to count-quantity siblings but not to a
            mass frame, which requires `less` or neutral `more`.
    goal_predicate:
        parent: verb
        notes: >
            Predicates whose declared construction introduces a target quantity
            rather than an event or current holding. This semantic parent is
            deliberately untagged for arithmetic polarity: wanting, requiring,
            saving, or raising a quantity toward a target does not assert that
            the quantity was received or already exists. Child categories
            describe complement grammar, so new vocabulary extends compatible
            constructions without adding word-specific arithmetic rules.
    finite_infinitival_goal_predicate:
        parent: goal_predicate
        notes: >
            Finite predicates that take a controlled `to` infinitive whose
            counted object states the goal amount: "WHO wants/hopes/intends to
            collect N ITEMS". Participial forms remain outside this category
            because they cannot head the finite matrix-clause slot.
    direct_quantity_goal_predicate:
        parent: goal_predicate
        notes: >
            Predicates that take a counted quantity directly: "WHO
            needs/requires N ITEMS". The same category licenses a matching
            deficit ask ("how many more ITEMS does WHO need/require?"); adding a
            compatible predicate therefore extends both sides of the contract.
    purpose_resource_goal_activity:
        parent: goal_predicate
        notes: >
            Activities that can link a resource to an explicitly priced purpose:
            "WHO is saving/raising money for TARGET which costs AMOUNT". The
            price supplies the target amount; the activity itself does not state
            an acquisition or current holding.
    span_preposition:
        parent: preposition
        notes: >
            the preposition introducing a COMPOUND rate's elapsed span ("sews 8
            shirts IN 20 minutes") — kept as its own category, not a literal
            string compared in Python, mirroring the 'per'->'rate' sense
            precedent (a word-specific fact belongs in the pack, never the
            kernel). Narrower than the general 'preposition' sense: 'in' keeps
            its ordinary locative/temporal preposition uses everywhere else —
            this category only gates the compound-rate-span scan in learn.py,
            it never changes 'in's own committed sense or disambiguation.
    negation:
        parent: negator
        notes: >
            clause-level negation markers. learn.py's Quantity fold declines a
            verb's numeric contribution whenever a negation-category token sits
            in the SAME CLAUSE as that verb ("Tom does NOT have 5 apples" / "Tom
            NEVER eats 5 apples") — decline-only, never computing negated
            semantics (constitution rule 4). Scoped to single-token markers only;
            multi-word negation ("no longer") is deliberately NOT a member here —
            it needs its own phrase-level structural check, out of scope for this
            increment.
    future_modal:
        parent: modal
        notes: >
            the FUTURE-TENSE modal pair (will/would) — a narrower cut of the
            general 'modal' sense increment 14 split from 'auxiliary' (which
            spans all 8 capacity/hypothetical modals: can/could/will/would/
            should/may/might/must). Gates the new `future_modal` slot type
            (data/schemas.py SLOT_TYPES, kernel/patterns.py _slot_ok) so an
            ORDINARY factual ask ("how many X does WHO have") can also match
            the identical question phrased in the future/conditional tense
            ("how many X will WHO have") without widening to the capacity
            modals — can/could/should/may/might/must stay excluded so a
            hypothetical/capacity-shaped question can never satisfy a factual
            ask's aux slot (the increment-14 kirsty lesson generalized: a
            wanted/hypothetical purchase is not a purchase). 'modal' is added to
            registry.ROOT_SENSES to let this category resolve. The generic
            lexical declarations and this future-tense membership live in core;
            extension packs may add other categories without duplicating the
            words.
    plural_auxiliary:
        parent: auxiliary
        notes: >
            Do-support forms compatible with a coordinated or otherwise
            plural question subject. Past `did` is number-neutral; present
            singular `does` is deliberately outside this category.
    singular_auxiliary:
        parent: auxiliary
        notes: >
            Present do-support restricted to a singular subject. Coordinated
            question subjects exclude this category while retaining the
            number-neutral past auxiliary and future modals.
    plural_present_auxiliary:
        parent: auxiliary
        notes: >
            Present do-support that conflicts with a fixed singular subject.
            Past `did` and the future modals remain number-neutral.
    change_receipt_verb:
        parent: verb
        notes: >
            Verbs that can ask for money returned after a tendered payment.
            This is narrower than general acquisition: buying, finding, or
            winning money does not describe receiving change.
    quantity_ask_verb:
        parent: verb
        notes: >
            Bare transitive or possessive verbs that can head a general
            quantity question. This is an explicit union for ask grammar, not
            a claim that the verbs share event semantics. Motion and unrelated
            intransitive verbs stay outside, so generation cannot ask how many
            prices somebody "travels" merely because both words are known.
    remaining_balance_state:
        parent: possession_state
        notes: >
            Bare possession forms licensed before postpositive "left" in a
            remaining-balance question ("does Ana have left"). Other holding
            verbs may describe ownership but do not share this idiom.
    a_article_membership_predicate:
        parent: noun
        notes: >
            Singular class nouns whose generated surface is licensed after
            the indefinite article "a". The reader remains broader; this is
            an authoring vocabulary boundary that prevents the generator from
            producing the wrong indefinite-article allomorph.
    difference_preposition:
        parent: preposition
        notes: >
            Prepositions licensed by the supported nominal difference frame,
            as in "the difference in" and "the difference between".
    capacity_modal:
        parent: modal
        notes: >
            mining candidate rate-every-span-asks: the six CAPACITY/
            HYPOTHETICAL modals (can/could/should/may/might/must) — the
            general 'modal' sense with the future-tense pair (will/would, the
            sibling 'future_modal' category above) explicitly EXCLUDED. Gates
            ask/how-many-rate-span-modal / ask/how-much-rate-span-modal's
            `aux` slot: those two asks read a Rate fact as a straightforward
            "how many CAN WHO do" capacity question (dev-train: "Bob can eat
            10 apples in 5 minutes. How many apples can he eat in 2 hours?"
            -> 240.0), which is a DIFFERENT semantic commitment from a
            future-tense factual question ("how many WILL WHO do") — a
            future-tense question can carry an unrelated, un-modeled exception
            clause (dev-train: "Adam teaches 50 students a year... in the
            first year he only teaches 40" — the rate-span consumer has no
            way to read that override, so answering it at all is a confident-
            wrong) that a genuinely hypothetical-capacity question does not.
            `future_modal` already documents this exact split as "a wanted/
            hypothetical purchase is not a purchase" (its own comment, one
            slot type over) — this category is that same split applied to the
            rate-span consumer's aux slot instead of a factual ask's. The six
            generic lexical declarations and their capacity membership live
            in core.
    planned_progress_modal:
        parent: modal
        notes: >
            A modal that asks for a recommended future activity quantity. It
            specifies a plan; it never asserts that the activity occurred.
    duration_verb:
        parent: verb
        notes: >
            'takes'/'took' in the extraposed-infinitive duration idiom ("it
            TAKES her 5 minutes to paint a lily", mining candidate
            extraposed-duration-rates) — a narrow consumer gate for
            arithmetic/extraposed-duration-rate, mirroring the spend_verb/
            price_verb/wage_verb precedent: 'take' is not an `acquire` verb —
            "it takes 5 minutes" is not a
            possession event), so this exists purely so the pattern rule can
            name the compatible declarative-tense inflections (takes/took)
            directly,
            since — unlike an ask's bare infinitive after a modal, a single
            literal fold — a declarative premise inflects for tense. The forms
            are core-owned so rule generation can expose whether that premise
            is too broad; human review, not category availability, judges the
            resulting sentence. Bare `take` is deliberately excluded: the
            construction's finite subject is expletive singular `it`.
    task_completion_verb:
        parent: quantity_ask_verb
        selectional_roles:
            actor: quantity_event_participant
            theme: finishable_quantity_object
        notes: >
            Verbs that assert completion of one exact task object. This is
            deliberately separate from broad quantity-event and motion verb
            classes: completing a task states elapsed time only in the
            dedicated completion-duration constructions.
    task_completion_speed_comparative:
        parent: comparative
        notes: >
            Directional comparatives for elapsed task-completion time. Their
            polarity describes duration ordering: negative is faster (less
            elapsed time), positive is slower (more elapsed time).
    task_completion_object_anaphor:
        parent: pronoun
        notes: >
            Singular object anaphor licensed by the tightly bounded
            two-clause task-completion construction. The rule preserves the
            first clause's exact task object; this category does not enable a
            general pronoun fallback.
    task_completion_duration_coordinator:
        parent: conjunction
        notes: >
            Temporal two-clause coordinator licensed only by the bounded
            task-completion-duration premise. General conjunctions do not
            imply that two clauses compare completion of one shared task.
    task_completion_faster:
        parent: task_completion_speed_comparative
        antonym: task_completion_slower
        polarity: -1
    task_completion_slower:
        parent: task_completion_speed_comparative
        antonym: task_completion_faster
        polarity: 1
    relational_marker:
        parent: particle
        notes: >
            the comparative/ratio clause-boundary word 'than' — sensed
            'particle' in the lexicon (core.yaml), unchanged. engine.py's
            `_is_relational_clause` (mining candidate conjoined-clause-holdings)
            ORs membership in this category alongside 'comparative'/'multiplier'
            to recognize a comparative/ratio clause structurally — the SAME
            "test a category, never enumerate the word in Python" shape as
            'clause_marker'/'clause_marker_prep' (packs/difg-mined/categories/
            clauses.yaml). 'particle' was added to registry.ROOT_SENSES to let
            this category resolve, purely additive (mirrors the earlier 'modal'
            root-sense addition) — 'than' keeps its single existing sense, so no
            new ambiguity is introduced for the many sentences that use it.
    verb_particle:
        parent: adverb
        notes: >
            the closed set of directional/completive particles that fuse to a
            polarity-tagged event verb ("gives AWAY", "takes AWAY", "throws
            AWAY") — sensed 'adverb' in the lexicon, unchanged. 'adverb' is added
            to registry.ROOT_SENSES to let this category resolve, purely
            additive (mirrors the earlier 'modal'/'particle' root-sense
            additions) — no existing adverb-sensed word gains a new sense or new
            behavior. condense.py's merge-particle-verb pass fuses a unit tagged
            this category onto an IMMEDIATELY PRECEDING verb, but ONLY when that
            verb already carries a polarity tag (_has_event_polarity, the
            increment-45 invariant): an untagged verb + particle ("looked up")
            stays exactly as today, decline-safe by construction. Deliberately
            NOT "every adverb" — that would risk merging manner/locative adverbs
            after an unrelated polarity verb ("sold quickly"). The four members
            (away/out/off/up) are difg-mined-only words — no core-english word
            carries the 'adverb' sense — so, mirroring 'future_modal'/
            'relational_marker's sibling pattern, this category has NO members
            here; they live in packs/difg-mined/categories/semantic.yaml. A
            core-english-only registry (no difg-mined) compiles with this
            category simply empty.
    temporal_marker:
        parent: time
        notes: >
            The current-moment words 'now' and 'today'. An equative age
            relation may use the category as an `absent` gate, while the
            future standard-pinned sibling consumes one marker to keep the
            standard's offset at zero. This stays narrower than the relative
            event-time category below: 'yesterday' and 'tomorrow' are ordered
            markers but do not mean the current moment.
    deictic_temporal_marker:
        parent: time
        notes: >
            Relative day words that can anchor one unambiguous predicate.
            Their signed coordinates live in temporal_offsets below. This
            category preserves event time without broadening rules whose
            temporal_marker slot specifically requires the current moment.
    day_deictic_marker:
        parent: deictic_temporal_marker
        notes: >
            Day-grained relative markers. `now` deliberately remains outside:
            sharing offset zero does not make an instant interchangeable with
            the whole current day.
    current_day_marker:
        parent: day_deictic_marker
        notes: >
            The day-grained current point used when a construction explicitly
            contrasts an earlier relative period with today's event.
    past_day_marker:
        parent: day_deictic_marker
        notes: >
            A day-grained deictic marker whose declared temporal offset is
            past-facing. Rules use this when an earlier event must be stated
            by a bare day marker rather than a qualified duration phrase.
    future_day_marker:
        parent: day_deictic_marker
        notes: >
            A day-grained deictic marker whose declared temporal offset is
            future-facing. Consumers still verify the signed offset.
    age_measure:
        parent: noun
        notes: >
            mining candidate age-equative-recut: the closed set of nouns that
            name a person's AGE unit ('year') — sensed 'noun' in the lexicon,
            unchanged. src/rulekit/kernel/saturate.py's `_bare_age_anchor_synth`
            gates its bare-copula-number promotion on
            `reg.word_in_category(measure, "age_measure")` rather than a
            hardcoded `"year"` string literal (constitution rule 1; `currency`
            at packs/core-english/categories/core.yaml:65 plus
            src/rulekit/kernel/answer.py's `q.measure == "currency" or
            reg.word_in_category(q.measure, "currency")` is the reference
            implementation this mirrors). 'year' is generic English vocabulary
            and therefore lives in core-english alongside this membership. That
            keeps the grammar needed by arithmetic/stated-age available to every
            project that loads core-english + arithmetic, without depending on a
            corpus-mined vocabulary pack.
    partitive:
        parent: preposition
        notes: >
            'of' in a MEASURE-of-ITEM partitive noun phrase ("a pound OF coffee
            beans", "4 pounds OF coffee beans") — exactly one member, so this is
            never a general preposition widening (mining candidate
            modal-spend-measure-price). learn.py's price-verb branch uses this
            category structurally (never a literal 'of' string comparison) to
            find the partitive phrase whose OBJECT is the price statement's
            subject, so it can key the emitted Price fact on the MEASURE noun
            the phrase anchors to (the SAME noun the purchase-verb premise's own
            Quantity.measure already uses) rather than on the item noun itself.
    complement_membership_label:
        parent: noun
        notes: >
            Predicate nouns that belong to a declared exhaustive complement
            pair and can therefore complete a partitive membership question
            such as "how many of the students are girls?".  Ordinary nouns
            do not acquire this role merely by being countable.
    complement_boy:
        parent: complement_membership_label
        antonym: complement_girl
        notes: >
            mining candidate complement-labeled-subsets: a PACK-DECLARED
            complementary-label PAIR — 'boy' and 'girl' EXHAUSTIVELY partition a
            collection they both label (unlike an arbitrary sibling noun pair,
            which increment 16 explicitly refused to assume exhaustive). Reuses
            the SAME `antonym:` mechanism polarity pairs use (acquire/lose,
            more_dir/less_dir), but deliberately carries NO `polarity` — this
            pairing is not a signed direction, just two singleton categories so
            saturate.py's `_complement_word` can look up 'the other label' by
            category-antonym instead of a hardcoded word pair (constitution
            rule 1). 'boy'/'girl' are difg-mined-only words — no core-english
            word carries either sense — so, mirroring 'temporal_marker'/
            'age_measure's sibling pattern above, this category has NO members
            here; they live in packs/difg-mined/categories/semantic.yaml. A
            core-english-only registry (no difg-mined) compiles with both
            categories simply empty (the synth then never fires, decline-safe).
    complement_girl:
        parent: complement_membership_label
        antonym: complement_boy
        notes: "the symmetric half of complement_boy — see its notes."
    child:
        parent: noun
        # mining candidate subtype-total-asks: only a category EXPLICITLY
        # opted in here may feed answer.py's `_superordinate_total` — see
        # `superordinate`'s own schema docstring (data/schemas.py CategoryDef)
        # for why this must be a SEPARATE flag from merely "has members":
        # `pet` below also declares members for unrelated decline-safety
        # coverage, with a deliberately partial list that must never be read
        # as an exhaustive subtype set. `animal` uses the separate coordinated
        # superordinate boundary for its open-ended member family.
        superordinate: true
        notes: >
            a PACK-DECLARED SUPERORDINATE — 'daughter' and 'son' are SUBTYPES of
            'child' ("Sandro has six times as many daughters as sons... how many
            children does he have?"). The category's NAME IS the superordinate
            WORD itself: a generic consumer (answer.py's `_superordinate_total`)
            sums an entity's own subtype holdings into the asked measure's total
            whenever the asked measure carries no fact of its own and every
            measure the entity DOES hold is a declared member here — resolved
            via `reg.category_members.get(asked_measure)`, never a hardcoded
            word in Python (constitution rule 1). Deliberately NO `polarity`/
            `interchangeable`: subtypes are not signed and are never
            interchangeable stand-ins for each other (that would let a 'son'
            fact answer a 'daughter' ask) — they only ever SUM into the
            superordinate. 'daughter'/'son' are difg-mined-only words, so
            (mirroring complement_boy/girl's sibling pattern above) this
            category has NO members here; they live in packs/difg-mined/
            categories/semantic.yaml. A core-english-only registry compiles with
            this category simply empty (the consumer then never fires,
            decline-safe).
    toy:
        parent: noun
        superordinate: true
        notes: >
            sibling of 'child' (subtype-total-asks) — subtypes: toy soldier / toy
            car ("James buys twice as many toy soldiers as toy cars... how many
            total toys does he buy?"). Same structural-only definition; members
            ('soldier'/'car', difg-mined-only) live in packs/difg-mined/
            categories/semantic.yaml. See child's note for the full mechanism.
    fish:
        parent: noun
        superordinate: true
        notes: >
            sibling of 'child' (subtype-total-asks) — subtypes: goldfish /
            angelfish / guppy ("Catriona has 8 goldfish... 4 more angelfish than
            goldfish... twice as many guppies as angelfish... how many fish does
            Catriona have?"). Same structural-only definition; members (difg-
            mined-only) live in packs/difg-mined/categories/semantic.yaml. See
            child's note for the full mechanism.
    litter:
        parent: noun
        superordinate: true
        notes: >
            sibling of 'child'/'toy'/'fish' (subtype-total-asks) — a discarded-item
            superordinate whose subtypes are the container nouns a cleanup problem
            counts as litter ("picked up 10 bottles and 8 cans... how many pieces of
            litter altogether?" -> 18). Members 'bottle'/'can' are difg-mined-only
            words, so (mirroring child/toy/fish above) they live in packs/difg-mined/
            categories/semantic.yaml, and a core-english-only registry compiles with
            this category simply empty (decline-safe). Same _superordinate_total guard
            (fires only when EVERY held measure is a subtype and >=2 are held), so a
            lone "5 bottles of water" never reads as a litter total.
    indefinite_article:
        parent: article
        notes: >
            mining candidate generic-unit-price-premises: 'a'/'an' mark a
            SINGULAR noun as a GENERIC instance ('A book costs $5' means every
            book of that kind, the same per-unit reading 'each book costs $5'
            already carries) rather than one specific previously-established
            referent — unlike 'the', which is deliberately NOT a member here
            (a definite singular price statement is a separate, more ambiguous
            class left out of scope). learn.py's price_verb branch reads this
            structurally (an indefinite article immediately left of an
            uncounted singular subject, crossing only adjectives) as an
            ADDITIONAL per-unit signal alongside the existing distributive-
            determiner/trailing-each/bare-measure gates — never a replacement
            for any of them.
    quantity_anaphor:
        parent: noun
        notes: >
            mining candidate anaphoric-multiplier-standards: the closed set of
            QUANTITY-anaphor head NOUNS that name a previously-stated amount
            without repeating it — 'amount'/'number' are ALSO members of
            'aggregate_noun'
            for a completely different frame-noun purpose ("the NUMBER of X")
            — this is a separate, sibling category, never a widening of
            aggregate_noun, so aggregate_noun's own gated rules never see a new
            member from this. Deliberately EXCLUDES 'much'/'many' — the
            lexicon's own root-sense invariant (registry.compile_registry)
            requires every category member to actually carry that category's
            root sense, and 'much'/'many' are sensed quantifier/interrogative,
            not noun — so this pack's sibling pattern rules
            (arithmetic/anaphoric-multiplier-standard-much/-many) gate on
            those two literally instead, mirroring how 'much'/'many' are
            ALREADY two separate literal-gated rule families everywhere else
            in this file (times-as-much / times-as-many), never a shared
            category. Gates arithmetic/anaphoric-multiplier-standard's
            head-noun slot: "3 times THAT AMOUNT" / "twice THAT NUMBER" — a
            demonstrative standard that names no ENTITY at all (unlike a name
            or a common noun, "that"/"this" never denotes a holder); saturate.py's
            `_relations_synth` resolves the emitted Relation's sentinel standard
            against the UNIQUE prior Quantity known document-wide instead of
            any entity's own holdings — zero or two-or-more candidates declines,
            never a guess.
    price_anaphor:
        parent: noun
        notes: >
            mining candidate anaphoric-multiplier-standards: sibling of
            'quantity_anaphor' for the PRICE-denominated anaphor head nouns
            ('price'/'cost'). Gates arithmetic/anaphoric-
            price-standard ("3 times THAT PRICE"); saturate.py resolves the
            emitted Relation's sentinel standard against the UNIQUE prior Price
            known document-wide rather than a Quantity — kept a SEPARATE
            category from 'quantity_anaphor' (never folded together) because
            the two anchor against two entirely different fact kinds.
    measure_anaphor:
        parent: pronoun
        notes: >
            mining candidate measure-noun-anaphor (infrastructure): the measure-
            NOUN sibling of 'quantity_anaphor' — where 'amount'/'number' stand in
            for a whole prior QUANTITY (a demonstrative standard, "twice THAT
            NUMBER"), this category's member ('ones', difg-mined-only — extends
            from packs/difg-mined/categories/semantic.yaml) is the elided HEAD
            NOUN of a counted, qualified NP ("12 yellow ONES", "twice as many
            green ONES as yellow ones"): the word itself never denotes the real
            measure, only its color/qualifier is genuine. Rooted at 'pronoun',
            never 'noun' — 'ones' already carries the 'pronoun' sense alone (its
            `refers` obligation simply goes unmet today, same decline discipline
            every unresolved pronoun has), and giving it a SECOND, ambiguous
            'noun' sense would make 'noun' always win obligations.disambiguate()'s
            coverage race (a pronoun's mandatory, never-locally-bindable 'refers'
            need is strictly worse-covering than a noun's none), silently
            reinterpreting EVERY 'ones' in the corpus — including the unrelated
            relative-clause/definite forms ("the ones she didn't do") — as a
            noun from round 0 on, corpus-wide, for a change meant to touch only
            this one counted-NP shape. Rooting at 'pronoun' keeps 'ones' single-
            sensed everywhere except the one condense.py merge (adjective +
            measure_anaphor pronoun) that opts in by category membership: that
            merge explicitly re-declares the compound's own `senses` to
            `[noun]` (so every EXISTING generic noun-consumption path — count-
            merge, dobj/subject Quantity-building — picks it up unchanged,
            untouched by this pack) while keeping the adjective's qualifier
            LOCAL and marking the compound `measure_anaphor: true`. Resolution
            of WHAT it stands for is a separate, later step — document.py's
            `_bind_measure_anaphor` binds it to the UNIQUE prior counted-noun
            lemma in the document (never a name, never a quantity — the
            measure-noun sibling of `_bind_discourse`'s antecedent search),
            exactly as the ordinary pronoun binder resolves "he" to its
            antecedent: zero or two-or-more candidates leaves it unresolved, and
            learn.py's `_lemma` then returns a reserved sentinel no ask can ever
            match — a silent, harmless decline, never a guess. THIS CATEGORY
            CANNOT MOVE A NUMBER ALONE: it only makes the anaphor resolvable;
            summing the qualified variants it produces is the conjunct-
            comparative class's job, built on top of this.
