format: rulekit/categories@1
categories:
  ball: {parent: noun}
  batch_order:
    parent: adjective
    notes: First starts a disjoint sequence; next advances to a new batch.
  batch_partitive_preposition: {parent: preposition}
  accomplishment_verb:
    parent: verb
    notes: A finite affirmative implicative followed by an infinitive asserts its completion.
  collection_loading_verb: {parent: verb}
  collection_loading_target: {parent: noun}
  initial_state_verb: {parent: verb}
  discrete_object_event_verb:
    parent: animate_subject_verb
    selectional_roles: {actor: quantity_event_participant, theme: ownable_quantity_object}
members:
  accomplishment_verb: [manage, managed, manages]
  ball: [ball, tennis ball]
  batch_order: [first, next]
  batch_partitive_preposition: [of, out of]
  collection_loading_target: [bag, basket, box, machine, truck]
  collection_loading_verb: [load, loaded, loads]
  discrete_object_event_verb: [hit, hits, inspect, inspected, inspects]
  initial_state_verb: [start, started, starts]
attribute_compatibility:
  batch_order: [ownable_quantity_object]
