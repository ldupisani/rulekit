format: rulekit/categories@1
categories:
  activity_context: {parent: noun}
  occupational_activity_context: {parent: activity_context}
  planned_activity_context: {parent: activity_context}
  operational_activity_context: {parent: activity_context}
  activity_context_descriptor: {parent: adjective}
  scoped_activity_participle: {parent: verb}
  activity_context_preposition: {parent: preposition}
  responsibility_role:
    parent: noun
  provision_verb:
    parent: verb
  provision_purpose_noun:
    parent: noun
    includes: [purchase_item, dining_account_activity]
  supply_decision_verb:
    parent: verb
  supply_transport_verb:
    parent: verb
  temporary_departure_verb:
    parent: verb
  response_activity_verb:
    parent: verb
  response_target:
    parent: noun
  return_activity_verb:
    parent: verb
  accumulated_activity_verb:
    parent: verb
  activity_experience_noun:
    parent: noun
  comparison_activity_verb:
    parent: verb
  comparison_property_noun:
    parent: noun
  comparison_report_verb:
    parent: verb
  activity_setting:
    parent: noun
    includes:
    - quantity_site_location
    - timeperiod
  output_production_verb:
    parent: verb
  stock_placement_verb:
    parent: verb
