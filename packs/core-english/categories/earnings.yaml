format: rulekit/categories@1
categories:
  recurring_expense_target: {parent: noun, includes: [purchase_collection_noun, material_resource]}
  recurring_activity_noun: {parent: noun}
  sports_activity_noun: {parent: recurring_activity_noun}
  recurring_activity_verb: {parent: verb}
  annual_activity_period: {parent: noun}
  averaging_verb: {parent: verb}
  resource_funding_verb: {parent: verb}
  service_activity_verb:
    parent: quantity_event_verb
    notes: Countable work on an object; a tariff is still required to infer earnings.
  service_object: {parent: noun}
  habitual_service_predicate:
    parent: service_activity_verb
    notes: Present habitual declarations offer a service; past work is a separate, counted event.
  past_service_predicate:
    parent: service_activity_verb
    notes: >
      Overt past forms excluded from habitual declarations. Category slots
      accept lemmas too, so the positive present-form category alone does
      not establish tense; the surface exclusion is independently required.
  cuttable_ground: {parent: service_object}
  clearable_surface: {parent: service_object}
  washable_surface: {parent: service_object}
  coatable_surface: {parent: service_object}
  ground_cutting_service:
    parent: service_activity_verb
    selectional_roles: {actor: animate, theme: cuttable_ground}
  ground_tending_service:
    parent: service_activity_verb
    selectional_roles: {actor: animate, theme: cuttable_ground}
  surface_clearing_service:
    parent: service_activity_verb
    selectional_roles: {actor: animate, theme: clearable_surface}
  surface_washing_service:
    parent: service_activity_verb
    selectional_roles: {actor: animate, theme: washable_surface}
  surface_coating_service:
    parent: service_activity_verb
    selectional_roles: {actor: animate, theme: coatable_surface}
  service_tariff_verb: {parent: verb}
  periodic_income_verb: {parent: acquire}
  resource_accumulation_verb: {parent: purpose_resource_goal_activity}
  periodic_income_noun: {parent: noun}
  accumulation_particle: {parent: adverb}
  accumulation_period_descriptor: {parent: preposition}
  cash_remainder_noun: {parent: noun}
  supplemental_receipt_noun:
    parent: transaction_adjustment_noun
  completed_receipt_transfer:
    parent: tender_verb
context_synonyms:
  wage_earnings:
    gate: currency
    # Earning/making a monetary amount are equivalent only in this resource
    # context. Producing a non-currency object is not an earning event.
    forms: [earn, make]
members:
  recurring_expense_target: [supply]
  recurring_activity_noun: [gardening, yoga]
  sports_activity_noun: [baseball, tennis, volleyball]
  recurring_activity_verb: [play, plays, playing, work, working]
  annual_activity_period: [season]
  averaging_verb:
  - average
  - averages
  resource_funding_verb: [afford]
  accumulation_particle: [up]
  accumulation_period_descriptor: [past]
  cash_remainder_noun: [change]
  clearable_surface: [driveway]
  coatable_surface: [gate, window]
  cuttable_ground: [lawn]
  ground_cutting_service: [mow, mowed, mowing, mows]
  ground_tending_service: [rake, raked, raking, rakes]
  habitual_service_predicate: [mow, mows, paint, paints, shovel, shovels, wash, washes]
  past_service_predicate: [mowed, painted, shoveled, shovelled, washed]
  periodic_income_noun:
  - allowance
  - income
  - salary
  periodic_income_verb: [earn, earned, earns, get, gets, got, receive, received, receives]
  resource_accumulation_verb: [save, saved, saves, saving]
  service_activity_verb: [mow, mowed, mowing, mows, paint, painted, paints, rake, raking, rakes, raked, shovel,
      shoveled, shovelled, shoveling, shovelling, shovels, wash, washed, washes, washing]
  service_object: [car, driveway, gate, lawn, window]
  service_tariff_verb: [charge, charged, charges]
  surface_clearing_service: [shovel, shoveled, shovelled, shovels]
  surface_coating_service: [paint, painted, paints]
  surface_washing_service: [wash, washed, washes, washing]
  washable_surface: [car, driveway, gate, window]
  supplemental_receipt_noun:
  - tip
  - bonus
  - gratuity
  completed_receipt_transfer:
  - gave
  - paid
