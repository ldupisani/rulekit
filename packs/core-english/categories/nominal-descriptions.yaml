format: rulekit/categories@1
categories:
  nominal_attribute_noun:
    parent: noun
    notes: An attribute expressed by a qualified noun, without an item count.
  nominal_attribute_preposition:
    parent: preposition
    notes: Introduces a declared nominal description attached to an item.
  indefinite_subset_quantifier:
    parent: quantifier
    notes: Introduces an existing but uncounted, non-exhaustive subset.
  depictable_noun:
    parent: noun
    notes: A concrete subject that can be depicted on another object.
  depiction_bearing_noun:
    parent: noun
    notes: A representation or surface that can carry a depicted subject.
  numeric_index_head:
    parent: noun
    notes: A trailing integer identifies a collection rather than counting its following members.
  conventionally_capitalized_modifier:
    parent: adjective
    notes: Common modifiers whose conventional capitalization does not introduce a person name.
members:
  depictable_noun: [flower, rose, snowflake, tree, truck]
  depiction_bearing_noun: [card, design, drawing, pattern, portraits, stamp]
  indefinite_subset_quantifier: [some]
  nominal_attribute_noun: [design, pattern]
  nominal_attribute_preposition: [with]
attribute_compatibility:
  depictable_noun: [depiction_bearing_noun]
