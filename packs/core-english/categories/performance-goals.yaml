format: rulekit/categories@1
categories:
  performance_goal_noun: {parent: noun}
  performance_unit:
    parent: noun
    includes: [finishable_quantity_object]
  performance_goal_context:
    parent: noun
    includes: [activity_context, exercise_activity]
  daily_goal_descriptor: {parent: adjective, attrs: {goal_cycle_days: 1}}
  daily_recurrence_unit: {parent: duration_measure}
  minimum_goal_descriptor: {parent: adjective}
  bare_performance_auxiliary: {parent: auxiliary}
  achievement_capacity_adjective: {parent: adjective}
  compensation_verb: {parent: verb}
  goal_attainment_verb: {parent: verb}
  omitted_performance_unit: {parent: pronoun}
  weekly_goal_descriptor:
    parent: adjective
    attrs:
      goal_cycle_days: 7
  weekday_cycle_period:
    parent: duration_measure
members:
  performance_goal_noun: [goal, quota, target]
  performance_unit: [page, task, exercise]
  daily_goal_descriptor: [daily]
  daily_recurrence_unit: [day]
  minimum_goal_descriptor: [minimum]
  bare_performance_auxiliary: [do]
  achievement_capacity_adjective: [able]
  compensation_verb: [make up]
  goal_attainment_verb: [meet, reach]
  omitted_performance_unit: [ones]
  weekly_goal_descriptor:
  - weekly
  weekday_cycle_period:
  - week
attribute_compatibility:
  daily_goal_descriptor: [performance_goal_noun]
  minimum_goal_descriptor: [performance_goal_noun]
  performance_goal_context: [performance_goal_noun]
  weekly_goal_descriptor:
  - performance_goal_noun
