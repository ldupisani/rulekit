format: rulekit/categories@1
categories:
  allocatable_resource: {parent: noun}
  allocation_source: {parent: noun}
  allocation_participant:
    parent: noun
    includes: [intentional_agent]
    notes: People or organizations explicitly receiving a share, not an inferred allocation.
  allocation_verb: {parent: verb}
  allocation_distribution_preposition: {parent: preposition}
  allocation_ratio_noun: {parent: noun}
  allocation_order_marker: {parent: adverb}
  allocation_share_noun: {parent: noun}
  commercial_context_descriptor: {parent: adjective}
  determiner_required_noun:
    parent: noun
    notes: >
      A singular count-noun use needs a determiner or owner. After an
      infinitival marker, a bare verb homograph is therefore the verb,
      unlike nominal activity/location words that permit bare reference.
  unspecified_amount_descriptor:
    parent: adjective
  allocation_amount_noun:
    parent: noun
members:
  allocatable_resource: [money, prize, profit]
  allocation_distribution_preposition: [among, between, amongst]
  allocation_order_marker: [respectively]
  allocation_ratio_noun: [ratio]
  allocation_share_noun: [share]
  allocation_source: [business, transaction]
  allocation_verb: [share, shared]
  commercial_context_descriptor: [business]
  determiner_required_noun: [load, practice, share]
  unspecified_amount_descriptor:
  - certain
  allocation_amount_noun:
  - amount
attribute_compatibility:
  commercial_context_descriptor: [allocation_participant, allocation_source]
  unspecified_amount_descriptor:
  - allocation_amount_noun
