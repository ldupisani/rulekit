format: rulekit/categories@1
categories:
  resource_budget_noun:
    parent: noun
    notes: "An explicitly bounded allocation, not an ordinary current holding."
  contrastive_conjunction:
    parent: conjunction
    notes: "Contrasts two asserted clauses rather than offering alternatives."
  resource_account_preposition:
    parent: preposition
    notes: "Introduces an allocation accompanying an independently read activity."
  transaction_supplier_preposition:
    parent: preposition
  transaction_supplier:
    parent: noun
    notes: "A commercial source, not necessarily a physical destination."
  transaction_channel:
    parent: adverb
    notes: "A channel of purchase, not a supplier or a place."
  transaction_channel_descriptor:
    parent: adjective
  shopping_activity:
    parent: verb
  transaction_price_preposition:
    parent: preposition
  transaction_account_preposition:
    parent: preposition
  payment_verb:
    parent: spend_verb
    notes: "An actual payment; a purchase alone does not assert payment."
  purchase_request:
    parent: verb
    notes: "An order is a request, not evidence of settlement or expenditure."
members:
  resource_budget_noun: [budget]
  quantity_interior_location: [store]
  contrastive_conjunction: [but]
  purchase: [purchase, purchased, purchases, purchasing]
  spend_verb: [pay, paid, pays, paying]
  partitive_pair_measure: [pair]
  spatial_motion_verb: [go, goes, went, going]
  pairable_partitive_substance: [shoe, sock]
  transferable_quantity_object: [belt, clothes, coat, hat, pants, shirt, sock, suit]
  resource_account_preposition: [with]
  transaction_supplier_preposition: [from]
  transaction_supplier: [retailer, store, shop]
  transaction_channel: [online]
  transaction_channel_descriptor: [online]
  shopping_activity: [shop, shopped, shopping]
  transaction_price_preposition: [for]
  transaction_account_preposition: [with, from]
  payment_verb: [pay, paid, pays, paying]
  purchase_request: [order, ordered, orders, ordering]
attribute_compatibility:
  transaction_channel_descriptor: [transaction_supplier]
adverb_verb_compatibility:
  transaction_channel: [purchase, spend_verb, shopping_activity, purchase_request]
adposition_roles:
  allocation-context:
    preposition_category: resource_account_preposition
    object_category: resource_budget_noun
    verb_category: verb
  supplier:
    preposition_category: transaction_supplier_preposition
    object_category: transaction_supplier
    verb_category: purchase
    allow_name_object: true
