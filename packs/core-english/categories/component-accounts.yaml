format: rulekit/categories@1
categories:
  countable_component:
    parent: noun
    includes:
    - body_part
    - mechanical_component
    - component_quantity_measure
  mechanical_component:
    parent: noun
  component_account_activity:
    parent: quantity_event_verb
    notes: An activity identifies a population whose explicitly stated parts can be counted; it does not imply ownership or action on every part.
  collection_account_verb:
    parent: component_account_activity
  component_bearing_object:
    parent: noun
    includes:
    - living_agent
    - vehicle
    - quantity_container
    - production_device
    - computing_device
  assembled_component_bearer:
    parent: noun
    includes:
    - vehicle
    - quantity_container
    - production_device
  component_collection_verb:
    parent: collection_account_verb
    selectional_roles:
      actor: collection_agent
      theme: component_bearing_object
  component_assembly_verb:
    parent: collection_account_verb
    selectional_roles:
      actor: collection_agent
      theme: assembled_component_bearer
  component_depiction_activity:
    parent: component_account_activity
    selectional_roles:
      actor: collection_agent
      theme: component_bearing_object
  component_observation_activity:
    parent: component_account_activity
    selectional_roles:
      actor: collection_agent
      theme: component_bearing_object
members:
  mechanical_component:
  - wheel
  - blade
  - button
  - door
  - seat
  collection_account_verb:
  - collect
  - collected
  - collects
  - gathered
  - assemble
  - assembled
  - assembles
  component_collection_verb:
  - collect
  - collects
  - collected
  - gathered
  component_assembly_verb:
  - assemble
  - assembles
  - assembled
  component_depiction_activity: [paint, paints, painted]
  component_observation_activity: [observe, observes, observed]
