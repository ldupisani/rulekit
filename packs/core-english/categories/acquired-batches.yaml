format: rulekit/categories@1
categories:
  batch_acquisition_verb:
    parent: acquire
  batch_disposal_verb:
    parent: verb
  batch_realization_verb:
    parent: verb
  batch_quality:
    parent: adjective
  batch_round_noun:
    parent: noun
  batch_round_ordinal:
    parent: adjective
  batch_repetition_adverb:
    parent: adverb
  batch_additional_marker:
    parent: comparative
  batch_relevance_positive:
    parent: batch_quality
    polarity: 1
    antonym: batch_relevance_negative
  batch_relevance_negative:
    parent: batch_quality
    polarity: -1
  batch_left_verb:
    parent: verb
  batch_continuation_conjunction:
    parent: conjunction
  reviewable_quantity_object:
    parent: transferable_quantity_object
members:
  batch_acquisition_verb: [collect, collected, collects, download, downloaded, downloading, downloads, receive,
    received, receives]
  batch_additional_marker: [more]
  batch_continuation_conjunction: [and, but]
  batch_disposal_verb: [delete, deleted, deletes, deleting, discard, discarded, discarding, discards, reject,
      rejected, rejecting, rejects]
  batch_left_verb: [left]
  batch_realization_verb: [realize, realized, realizes]
  batch_relevance_negative: [irrelevant, unhelpful, unrelated, useless]
  batch_relevance_positive: [helpful, relevant, useful, valuable]
  batch_repetition_adverb: [again]
  batch_round_noun: [batch, round]
  batch_round_ordinal: [first, last, second, third]
  reviewable_quantity_object: [book, document, file, image, letter, page, photo, photograph]
attribute_compatibility:
  batch_quality: [reviewable_quantity_object]
  batch_round_ordinal: [batch_round_noun]
