format: rulekit/categories@1
categories:
  purchase_lot_measure:
    parent: noun
    notes: A measured or packaged purchase can have one price for the whole lot.
  purchase_collection_noun:
    parent: noun
    notes: A collective ask or activity introduction covers every purchased item, by its named category or an
      explicit generic collection licence.
  generic_purchase_collection_noun:
    parent: purchase_collection_noun
    notes: An unspecified shopping collection; every ledger item must still be an ownable object. This does
      not assert extra purchases or make its words global synonyms.
  mass_purchase_collection_noun:
    parent: purchase_collection_noun
    notes: Collection terms usable without a determiner in singular mass form, rather than a plural count
      form.
  clothes:
    parent: noun
    notes: Clothing and wearable accessories grouped as one shopping collection.
  ingredient:
    parent: noun
    notes: Purchased food inputs, not a license to include unrelated purchases.
members:
  clothes: [belt, coat, hat, pants, shirt, shoe, shorts, sock, suit, top]
  generic_purchase_collection_noun: [goods, item, merchandise, stuff, thing]
  ingredient: [apple, charcuterie, cheddar cheese, cheese, cold cut, cream cheese, sugar]
  mass_purchase_collection_noun: [merchandise, stuff]
  purchase_collection_noun: [clothes, ingredient]
  purchase_lot_measure: [bottle, box, gram, kilogram, pack, pound]
