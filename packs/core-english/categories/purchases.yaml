format: rulekit/categories@1
categories:
  new_purchase_condition:
    parent: adjective
    notes: New condition requested for an intended purchase.
  price_at_marker: {parent: preposition}
  price_for_marker: {parent: preposition}
  price_quote_participle:
    parent: verb
    notes: Reduced-relative cost quotes; these do not assert payment.
  marked_price_participle:
    parent: verb
    notes: A quoted asking price requires an explicit at complement; valuation is separate.
  sale_offer_participle:
    parent: verb
    notes: A selling-for quote states the offered price, not a completed sale.
  purchase_lot_measure:
    parent: noun
    notes: A measured or packaged purchase can have one price for the whole lot.
  purchase_collection_noun:
    parent: noun
    notes: A collective ask or activity introduction covers every purchased item, by its named category or an
      explicit generic collection licence.
  generic_purchase_collection_noun:
    parent: purchase_collection_noun
    notes: An unspecified shopping collection; every ledger item must still be an ownable object. This does
      not assert extra purchases or make its words global synonyms.
  mass_purchase_collection_noun:
    parent: purchase_collection_noun
    notes: Collection terms usable without a determiner in singular mass form, rather than a plural count
      form.
  clothes:
    parent: noun
    notes: Clothing and wearable accessories grouped as one shopping collection.
    disjoint_with: [building, vehicle]
  ingredient:
    parent: noun
    notes: Purchased food inputs, not a license to include unrelated purchases.
  equal_division_verb:
    parent: verb
  equal_division_adverb:
    parent: adverb
  list_introduction_marker:
    parent: adjective
  itemized_acquisition_verb:
    parent: verb
    notes: Introduces an explicit priced list; ordering does not assert payment.
  purchase_count_measure:
    parent: noun
    notes: Discrete counted packages or servings in an itemized price quote.
    includes:
    - serving_measure
  purchase_item:
    parent: noun
    includes:
    - ownable_quantity_object
    - edible_quantity_object
    notes: Goods or food named by a priced purchase line; the price remains explicit.
  shared_cost_noun:
    parent: noun
  charge_record_noun:
    parent: shared_cost_noun
    notes: A document or account identifying charges in an explicit priced-list and sharing context. These
      words are not global synonyms and do not imply payment, settlement, or a known balance.
  purchase_context_activity:
    parent: verb
    notes: A stated group activity preceding an explicit itemized acquisition.
  purchase_context_site:
    parent: noun
    includes:
    - quantity_interior_location
    - organization
    - nominal_location
  clothing:
    parent: clothes
    notes: Wearable garments, separate from any particular purchase or owner.
members:
  new_purchase_condition: [new]
  price_at_marker: [at]
  price_for_marker: [for]
  price_quote_participle: [costing]
  marked_price_participle: [priced, listed]
  sale_offer_participle: [selling]
  clothes: [beanie, belt, boot, cap, coat, costume, dress, hat, jacket, jeans, leggings, mitten,
      outfit, pants, scarf, shirt, shoe, shorts, skirt, sock, suit, sunglass, sweater, top]
  generic_purchase_collection_noun: [goods, item, merchandise, stuff, thing]
  ingredient: [apple, charcuterie, cheddar cheese, cheese, cold cut, cream cheese, sugar]
  mass_purchase_collection_noun: [merchandise, stuff]
  purchase_collection_noun: [clothes, ingredient, treat]
  purchase_lot_measure: [bottle, box, bunch, carton, gallon, gram, kilogram, pack, packet, pint, pound, quart,
      sack, tub]
  equal_division_verb:
  - split
  - share
  - divide
  equal_division_adverb:
  - equally
  list_introduction_marker:
  - following
  itemized_acquisition_verb:
  - order
  - orders
  - ordered
  - buy
  - buys
  - bought
  - purchase
  - purchases
  - purchased
  purchase_count_measure: [bottle, box, bunch, pack, packet, sack, scoop, tub]
  shared_cost_noun:
