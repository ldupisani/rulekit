format: rulekit/categories@1
categories:
  named_season:
    parent: timeperiod
  period_boundary_noun:
    parent: noun
  period_end_boundary_noun:
    parent: period_boundary_noun
  same_day_transaction_marker:
    parent: time
  transaction_sequence_adverb:
    parent: adverb
  prior_period_attribute:
    parent: adjective
  calendar_day_unit:
    parent: duration_measure
    attrs:
      calendar_day_unit: 1
  calendar_week_unit:
    parent: duration_measure
    attrs:
      calendar_week_unit: 1
  calendar_year_unit:
    parent: duration_measure
    attrs:
      calendar_months: 12
  calendar_month_unit:
    parent: duration_measure
    attrs:
      calendar_months: 1
  retrospective_period_marker:
    parent: preposition
  retrospective_window_preposition:
    parent: preposition
  recurring_quantity_verb:
    parent: verb
  daily_frequency_attribute:
    parent: adjective
  part_of_day:
    parent: timeperiod
  schedule_average_noun:
    parent: aggregate
  open_state:
    parent: verb
  feeding_action:
    parent: verb
  preference_action:
    parent: verb
  saving_action:
    parent: verb
  decision_action:
    parent: verb
  travel_event:
    parent: noun
  approximation_marker:
    parent: preposition
  plan_noun:
    parent: noun
  period_start_boundary_noun:
    parent: period_boundary_noun
  relative_period_attribute:
    parent: adjective
  past_relative_period_attribute:
    parent: relative_period_attribute
    attrs:
      relative_period_offset: -1
  current_relative_period_attribute:
    parent: relative_period_attribute
    attrs:
      relative_period_offset: 0
  future_relative_period_attribute:
    parent: relative_period_attribute
    attrs:
      relative_period_offset: 1
  reporting_period_unit:
    parent: duration_measure
    includes:
    - calendar_span_unit
  reporting_time_marker:
    parent: day_deictic_marker
