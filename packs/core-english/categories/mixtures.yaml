  - added
  mixture_loss_verb:
  - losing
  mixture_purity:
  - pure
  mixture_uniformity:
  - homogeneous
  - uniform
  mixture_weight_verb:
  - weigh
  - weighs
  - weighed
  aqueous_evaporation_retained_component:
  - salt
  - sugar
  mixture_result_noun:
  - mixture
  mixture_percentage_noun:
  - percentage
  mixture_additivity:
  - additive
  mixture_count_measure:
