  - mass
  - weight
  mixture_mole_basis:
  - moles
  mixture_mass_quantity:
  - mass
  - weight
  mixture_blending_verb:
  - mix
  - mixes
  - mixed
  - combine
  - combines
  mixture_addition_verb:
