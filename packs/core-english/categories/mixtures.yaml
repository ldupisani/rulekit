format: rulekit/categories@1
categories:
  aqueous_mixture: {parent: noun}
  aqueous_solvent: {parent: noun}
  mixture_substance: {parent: noun, includes: [mixture_material]}
  mixture_component: {parent: noun}
  mixture_sampling_verb: {parent: verb}
  solvent_removal_verb:
    parent: intransitive_process_verb
    notes: >
      Solvent-removal processes used by mixture recovery constructions.
      They do not license the generic direct count-object comparison frame;
      component recovery keeps its explicit source, solvent and conservation
      evidence in the mixture model.
  evaporation_perfect_auxiliary: {parent: verb}
  component_recovery_verb: {parent: verb}
  mixture_composition_verb: {parent: verb}
  mixture_volume_basis: {parent: noun}
  evaporation_completion_adverb: {parent: adverb}
  mixture_material:
    parent: noun
    includes:
    - aqueous_mixture
  mixture_measure:
    parent: noun
    includes:
    - volume_measure
    - mass_measure
    - mixture_mole_measure
    - mixture_count_measure
  mixture_mole_measure:
    parent: noun
  mixture_basis:
    parent: noun
    includes:
    - mixture_volume_basis
    - mixture_mass_basis
    - mixture_mole_basis
    - mixture_count_basis
  mixture_mass_basis:
    parent: noun
  mixture_mole_basis:
    parent: noun
  mixture_mass_quantity:
    parent: noun
  mixture_blending_verb:
    parent: verb
  mixture_addition_verb:
    parent: verb
  mixture_loss_verb:
    parent: verb
  mixture_purity:
    parent: adjective
  mixture_uniformity:
    parent: adjective
  mixture_weight_verb:
    parent: verb
  aqueous_evaporation_retained_component:
    parent: noun
  mixture_result_noun:
    parent: noun
  mixture_percentage_noun:
    parent: noun
  mixture_additivity:
    parent: adjective
  mixture_count_measure:
    parent: noun
  mixture_count_basis:
    parent: noun
  discrete_mixture_component:
    parent: noun
members:
  aqueous_evaporation_retained_component: [salt, sugar]
  aqueous_mixture: [brine, salt water, saltwater, seawater, sugar water]
  aqueous_solvent: [water]
  component_recovery_verb: [get, gets, got, obtain, obtained, obtains]
  discrete_mixture_component: [glass bead, plastic bead]
  evaporation_completion_adverb: [completely, fully]
  evaporation_perfect_auxiliary: [had, has]
  mixture_addition_verb: [add, added, adds]
  mixture_additivity: [additive]
  mixture_blending_verb: [combine, combines, mix, mixed, mixes]
  mixture_component: [copper, ethanol, glass bead, helium, nitrogen, oil, plastic bead, raisin, resin, salt,
      sugar, sunflower oil, tin, water]
  mixture_composition_verb: [contain, contained, contains, had, has, have]
  mixture_count_basis: [count]
  mixture_count_measure: [bead]
  mixture_loss_verb: [losing]
  mixture_mass_basis: [mass, weight]
  mixture_mass_quantity: [mass, weight]
  mixture_material: [alloy, bead mixture, bronze, cereal, gas mixture, mixture, oil blend, resin solution,
      solution]
  mixture_mole_basis: [moles]
  mixture_mole_measure: [moles]
  mixture_percentage_noun: [percentage]
  mixture_purity: [pure]
  mixture_result_noun: [mixture]
  mixture_sampling_verb: [collect, collected, collects, get, gets, got, had, has, have, obtain, obtained,
      obtains]
  mixture_substance: [water]
  mixture_uniformity: [homogeneous, uniform]
  mixture_volume_basis: [volume]
  mixture_weight_verb: [weigh, weighed, weighs]
  solvent_removal_verb: [evaporate, evaporated, evaporates]
attribute_compatibility:
  mixture_component: [container_contents_noun]
  mixture_purity: [mixture_component]
