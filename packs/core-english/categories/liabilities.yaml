format: rulekit/categories@1
categories:
  liability_account: {parent: noun}
  liability_limit: {parent: noun}
  liability_grant_verb: {parent: verb}
  liability_state: {parent: verb}
  liability_use_verb: {parent: verb}
  repayment_verb: {parent: verb}
  complete_account_attribute: {parent: adjective}
  settlement_event: {parent: noun}
  settlement_modal: {parent: modal}
  infinitive_complement_predicate: {parent: verb}
  nominal_activity: {parent: noun, includes: [account_activity]}
  nominal_activity_modifier: {parent: noun}
  nominal_activity_auxiliary: {parent: auxiliary}
members:
  complete_account_attribute: [entire, full]
  infinitive_complement_predicate: [need]
  liability_account: [credit, debt]
  liability_grant_verb: [allow, allowed, allows]
  liability_limit: [credit, credit limit]
  liability_state: [owe, owed, owes, owing]
  liability_use_verb: [spend, spends, spent, use, used, uses]
  nominal_activity: [shop, shopping]
  nominal_activity_auxiliary: [did, do, does]
  nominal_activity_modifier: [grocery]
  repayment_verb: [repaid, repay, repaying, repays]
  settlement_event: [trip]
  settlement_modal: [must]
attribute_compatibility:
  complete_account_attribute: [liability_account, liability_limit]
