format: rulekit/categories@1
categories:
  nonpersonal_actor_predicate: {parent: verb}
  singular_animate_object_pronoun:
    parent: animate_object_pronoun
  precardinal_attribute:
    parent: adjective
    notes: A modifier placed before the cardinal count in a counted noun phrase.
  universal_item_reference:
    parent: pronoun
    notes: All items in an independently established domain; the consuming rule must establish completeness.
  impersonal_subject_pronoun:
    parent: pronoun
  initial_sequence_ordinal:
    parent: adjective
  generic_addressee_pronoun:
    parent: pronoun
  universal_person_reference:
    parent: pronoun
    notes: All people in an independently established discourse scope; no population is inferred.
  group_possessive_determiner: {parent: possessive_determiner}
  anaphoric_person_subject:
    parent: pronoun
    notes: Subject forms; a construction must separately establish their referent.
  anaphoric_person_possessive:
    parent: possessive_determiner
    notes: Third-person forms, including number-neutral ownership.
  ordinal_quantity_holder:
    parent: noun
    includes:
    - quantity_holder
    - quantity_container
  holder_prefix_order:
    parent: precardinal_attribute
  holder_ordinal:
    parent: adjective
  holder_terminal_order:
    parent: adjective
  person_title:
    parent: title
  quantity_remnant_noun:
    parent: noun
    includes: [partition_remnant]
    notes: A remaining quantity reference, without licensing a collective plural subject.
  singular_present_possession:
    parent: verb
members:
  nonpersonal_actor_predicate: [gain, gained, gains, devour, devours, devoured, feast, feasts, feasted, eat, eats,
      ate, need, needed, needs, earn, earned, earns, make, made, makes, work, worked, works]
  quantity_remnant_noun: [remainder]
  singular_animate_object_pronoun: [her, him]
  precardinal_attribute: [next]
  universal_item_reference: [everything]
  impersonal_subject_pronoun:
  - it
  initial_sequence_ordinal:
  - first
  generic_addressee_pronoun: [you]
  universal_person_reference: [everyone]
  group_possessive_determiner: [their]
  anaphoric_person_possessive: [her, his, their]
  anaphoric_person_subject: [he, she, they]
  holder_ordinal: [fifth, first, fourth, second, sixth, third]
  holder_prefix_order: [first]
  holder_terminal_order: [final, last, remaining]
  person_title:
  - dr
  - mr
  - mrs
  - ms
  singular_present_possession:
  - has
attribute_compatibility:
  initial_sequence_ordinal: [progress_measure]
  holder_ordinal: [ordinal_quantity_holder, path_checkpoint, local_yield_site, process_part,
      component_quantity_measure, duration_measure]
  holder_prefix_order: [ordinal_quantity_holder]
  holder_terminal_order: [ordinal_quantity_holder]
