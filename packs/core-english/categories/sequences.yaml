format: rulekit/categories@1
categories:
  sequence_carrier:
    parent: noun
    notes: Distinct carriers or batches whose contents can form an ordered series.
  sequence_event_verb:
    parent: verb
    notes: Actual carrier events; purpose and quantity summaries must name the same event family.
  carrier_transitive_event_verb: {parent: sequence_event_verb}
  carrier_prepositional_event_verb: {parent: sequence_event_verb}
  sequence_singular_anaphor:
    parent: pronoun
    notes: An unresolved neutral subject may refer to the unique compatible cadence actor.
  sequence_current_descriptor: {parent: adjective}
  sequence_previous_descriptor: {parent: adjective}
  sequence_index_descriptor: {parent: adjective}
  sequence_location_preposition: {parent: preposition}
  carrier_event_object_preposition: {parent: preposition}
  sequence_motion_verb: {parent: verb}
  sequence_origin_preposition: {parent: preposition}
  sequence_motive_verb: {parent: verb}
  sequence_motive_noun: {parent: noun}
  sequence_creation_verb: {parent: verb}
  sequence_growth_descriptor: {parent: comparative}
  sequence_elapsed_preposition: {parent: preposition}
  sequence_result_conjunction: {parent: conjunction}
  sequence_passive_auxiliary: {parent: verb}
  abstract_time_noun: {parent: noun}
  completion_boundary_noun:
    parent: noun
    notes: A final boundary of the stated sequence, not an unstated later event.
  completion_frame_preposition: {parent: preposition}
context_synonyms:
  carrier_consumption:
    gate: sequence_carrier
    forms: [eat, consume, feast]
members:
  completion_boundary_noun: [end]
  completion_frame_preposition: [at, in]
  abstract_time_noun: [time]
  carrier_event_object_preposition: [on]
  carrier_prepositional_event_verb: [feast, feasted, feasts]
  carrier_transitive_event_verb: [ate, consume, consumed, consumes, deliver, delivered, delivers, eat, eats,
      receive, received, receives, send, sends, sent]
  sequence_carrier: [bag, basket, batch, box, delivery, ship, truck]
  sequence_creation_verb: [built, made, produced]
  sequence_current_descriptor: [new, next]
  sequence_elapsed_preposition: [over]
  sequence_event_verb: [ate, consume, consumed, consumes, deliver, delivered, delivers, eat, eats, feast,
      feasted, feasts, receive, received, receives, send, sends, sent]
  sequence_growth_descriptor: [bigger, larger]
  sequence_index_descriptor: [final, first, last]
  sequence_location_preposition: [in, on]
  sequence_motion_verb: [return, returned, returns, rise, rises, rose]
  sequence_motive_noun: [appetite, hunger]
  sequence_motive_verb: [sate, satisfy]
  sequence_origin_preposition: [from]
  sequence_passive_auxiliary: [had been, has been, have been]
  sequence_previous_descriptor: [last, previous]
  sequence_result_conjunction: [so]
  sequence_singular_anaphor: [it]
attribute_compatibility:
  sequence_current_descriptor: [sequence_carrier]
  sequence_index_descriptor: [duration_measure, sequence_carrier]
  sequence_previous_descriptor: [sequence_carrier, duration_measure]
