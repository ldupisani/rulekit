    - organization
    - production_device
    - computing_device
  nonpersonal_actor_anaphor:
    parent: pronoun
  opening_state_adverb:
    parent: adverb
  material_allocation_verb:
    parent: allocation_transfer_verb
  allocation_receipt_preposition:
    parent: preposition
