format: rulekit/categories@1
categories:
  allocation_recipient:
    parent: noun
    includes:
    - living_agent
    - organization
    - production_device
    - computing_device
    - allocation_storage
  uniform_quantity_attribute: {parent: adjective}
  retention_verb: {parent: verb}
  recipient_distribution_preposition: {parent: preposition}
  allocation_storage:
    parent: noun
    includes:
    - quantity_container
    - resource_store
  collection_agent:
    parent: noun
