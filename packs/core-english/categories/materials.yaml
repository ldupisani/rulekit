format: rulekit/categories@1
categories:
  divisible_material_whole:
    parent: decomposable_quantity_whole
  sheet_material: {parent: material_resource}
  material_stock_unit: {parent: quantity_container}
  rectangular_shape: {parent: noun}
  region_cutting_verb: {parent: verb}
  room_location: {parent: quantity_interior_location}
  area_unit_modifier: {parent: spatial_unit_modifier, attrs: {measurement_power: 2}}
  fabrication_product: {parent: ownable_quantity_object}
  mass_amount_interrogative: {parent: interrogative}
  mass_amount_quantifier: {parent: quantifier}
  material_resource:
    parent: ownable_quantity_object
    includes:
    - measured_content_substance
    - mixture_component
  material_stock_state:
    parent: verb
  solid_stock_unit:
    parent: material_stock_unit
  linear_stock_unit:
    parent: material_stock_unit
  region_removal_verb:
    parent: verb
  resource_remnant_verb:
    parent: verb
  quantity_dimension_noun:
    parent: noun
  length_interrogative_adjective:
    parent: adjective
    notes: >
      Physical extent queried with a measured material. Kept separate from
      general holder dimensions because the same word can ask about duration.
  resource_remnant_attribute:
    parent: adjective
  volume_unit_modifier:
    parent: spatial_unit_modifier
    attrs:
      measurement_power: 3
  rectangular_attribute:
    parent: adjective
  separate_region_attribute:
    parent: adjective
  material_stock_holding_verb:
    parent: verb
  resource_measure_unit:
    parent: noun
    includes: [mass_unit, length_unit, volume_measure]
  production_variety_noun: {parent: noun}
  measured_resource_removal_verb:
    parent: verb
    notes: Licenses a same-sentence elliptical measured removal; this does not give a verb a general loss
      polarity.
  spatial_unit_modifier:
    parent: adjective
  precipitation_resource:
    parent: material_resource
  weather_quantity_verb:
    parent: verb
  calibrated_collection_verb:
    parent: verb
  storage_container:
    parent: quantity_container
  precipitation_output:
    parent: material_resource
