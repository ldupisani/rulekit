format: rulekit/categories@1
categories:
  journey_activity_verb: {parent: spatial_motion_verb}
  nominal_object_verb:
    parent: verb
    notes: Takes a nominal theme here, not an object followed by a bare verbal complement.
  journey_vehicle_verb:
    parent: nominal_object_verb
    selectional_roles: {actor: animate, theme: journey_vehicle}
  journey_vehicle: {parent: noun}
  journey_destination: {parent: noun}
  journey_expletive: {parent: pronoun}
  journey_duration_ask_verb: {parent: verb}
  journey_goal_verb: {parent: verb}
  nominal_location: {parent: noun}
  locative_source_preposition: {parent: preposition}
  locative_goal_preposition: {parent: preposition}
  journey_mode_list_preposition: {parent: preposition}
  return_direction_adverb: {parent: adverb}
  working_day_unit: {parent: noun}
  weekly_leisure_period: {parent: adjective}
  cycling_journey_noun: {parent: noun}
  journey_distance_measure: {parent: noun}
  distance_separation_adverb: {parent: adverb}
  miles_per_hour_unit: {parent: noun}
  journey_start_verb: {parent: spatial_motion_verb}
  journey:
    parent: noun
    notes: A journey noun; distance, duration and participants require explicit evidence.
  motion:
    parent: motion_comparison_verb
  vehicle:
    parent: motion_participant
    notes: Manufactured conveyances, independently classified from their use in a particular journey.
  two_wheeled_vehicle:
    parent: vehicle
    attrs:
      wheels: 2
  four_wheeled_vehicle:
    parent: vehicle
    attrs:
      wheels: 4
