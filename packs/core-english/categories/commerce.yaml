format: rulekit/categories@1
categories:
  commercial_product: {parent: ownable_quantity_object}
  commercial_product_family:
    parent: commercial_product
    notes: >
      Children group a reproducible work and its saleable representation.
      These are not synonyms. A profit account may link them only within
      one explicitly costed, otherwise unambiguous production stream.
  audiovisual_product: {parent: commercial_product_family}
  audio_product: {parent: commercial_product_family}
  publication_product: {parent: commercial_product_family}
  commercial_production_verb: {parent: verb}
  commercial_organization: {parent: organization}
  profit_measure: {parent: noun}
  infinitival_marker: {parent: preposition}
  income_resource_noun:
    parent: noun
    notes: An income source, not itself a known amount or a currency unit.
  income_modifier:
    parent: noun
  transaction_adjustment_noun:
    parent: noun
    notes: A possible price or payment adjustment; requires explicit accounting scope.
  visual_product:
    parent: commercial_product_family
  sale_revenue_noun:
    parent: noun
  commercial_quote_verb:
    parent: verb
  commercial_object_anaphor:
    parent: pronoun
  coin:
    parent: noun
  discount:
    parent: noun
    notes: >-
      An explicitly stated adjustment to a quoted price or payment.
  cashtoken:
    parent: noun
  charge:
    parent: noun
  tender_verb:
    parent: verb
    notes: >
      'pay'/'give' when their object is a stated currency amount ("pays
      with a $50 bill" / "gave $250 [to the cashier]" — mining candidate
      change-asks) is the buyer's TENDER, a narrower concept than the
      general 'lose' polarity event both verbs already carry (spending
      money is a loss for the general money fold; a change ask needs the
      specific "amount handed over" isolated from that, the same
      multi-membership pattern as 'sell' beside 'lose'). The already-
      general SVO fold emits the plain currency Quantity event on its
      own (no learn.py change needed); this category only lets the
      change consumer (answer.py) name tender events specifically
      without picking up 'ate'/'sold'/'spent'/etc, which also live under
      'lose'. Gated additionally on the fact's measure resolving to
      `currency` — an ordinary "gives 3 apples" never qualifies.
members:
  audio_product: [album, cd]
  audiovisual_product: [dvd, film, movie, video]
  commercial_organization: [business, company, empire]
  commercial_production_verb:
  - create
  - created
  - creates
  - made
  - make
  - makes
  - paint
  - painted
  - paints
  - produce
  - produced
  - produces
  income_modifier: [bonus]
  income_resource_noun: [bonus, income, pay, salary, windfall, winnings]
  infinitival_marker: [to]
  profit_measure: [profit]
  publication_product: [book, paperback, textbook]
  transaction_adjustment_noun: [discount, fee, refund, tax, tip, tithe]
  visual_product:
  - painting
  - picture
  sale_revenue_noun: [sale]
  commercial_quote_verb:
  - charge
  - charged
  - charges
  commercial_object_anaphor:
  - it
  - them
  coin: [dime, nickel, penny, quarter]
  discount: [coupon, discount, tip]
  cashtoken: [bill, coin]
  charge: [bill, cost, expense, fee, price]
  tender_verb: [gave, give, gives, paid, pay, pays]
attribute_compatibility:
  income_modifier: [income_resource_noun]
