format: rulekit/categories@1
categories:
  living_agent:
    parent: noun
    includes: [person, animal]
    notes: A living actor; unlike personal-pronoun eligibility, this includes animals.
    disjoint_with: [building, clothes, vehicle]
  social_group:
    parent: quantity_holder
    notes: A collective group of people; the noun does not assert its members or their count.
  person:
    parent: quantity_event_participant
    includes: [animate]
    notes: >
      Person-denoting nouns reuse the existing, vetted personal-reference
      inventory. Extension packs can also classify people here without
      granting animate's stricter personal-pronoun eligibility. Neither
      route needs separate earning, production, or student-holder lists.
  organization:
    parent: quantity_holder
    notes: >
      Collective institutions capable of explicitly stated economic or
      productive activity. Membership is not personal-pronoun eligibility.
  educational_institution:
    parent: organization
    notes: An educational organization; a stated student count is an association.
  role_location:
    parent: noun
    includes:
    - organization
    - activity_site
    notes: A location associated with a stated personal role; no employment or organizational membership is
      implied.
  role_location_preposition:
    parent: preposition
  intentional_agent:
    parent: noun
    includes: [person, organization]
    notes: >
      People and organizations may initiate activities or earn resources.
      This licenses a sentence's actor; it never asserts an event by itself.
  production_device:
    parent: quantity_holder
    notes: >
      Devices capable of producing output in an explicit production frame.
      Production capability does not imply earning, intention, or personhood.
  geographic_area:
    parent: quantity_holder
    notes: A geographic scope that can contain a stated institutional population.
  named_city:
    parent: geographic_area
  situated_role:
    parent: person
    notes: A stated occupational, educational or organizational role; kinship is relational and excluded.
  office_role:
    parent: situated_role
    notes: An office title also licensed without an indefinite article after a copula.
  activity_site:
    parent: noun
    notes: A physical site at which a person can carry out a stated role.
  persongroup:
    parent: quantity_holder
    notes: A collection of people; membership does not supply a group size.
members:
  role_location_preposition: [at]
  social_group: [couple, crew, crowd, family, household, team, tribe, varsity]
  educational_institution: [college, high school, school, university]
  geographic_area: [area, city, country, neighborhood, subdivision, town]
  production_device: [desktop, heater, laptop, lawnmower, machine, monitor, mower, printer, pump, robot,
      scanner]
  person: [adult, artist, athlete, attendee, aunt, baby, babysitter, baker, bodyguard, boss, boy, boyfriend,
      brunette, buyer, camper, cannoneer, captain, carpenter, chef, child, citizen, classmate, clerk, clown,
      contestant, cousin, cowgirl, customer, dad, dancer, daughter, delegate, doctor, dog-walker, driver,
      employee, farmer, father, fisherman, friend, girl, goalkeeper, grandchild, granddaughter, grandfather,
      grandkid, grandmother, grandpa, guest, gymnast, housewife, hunter, husband, kid, kindergartner, lady,
      magician, man, manager, mason, member, merchandiser, mother, mum, neighbor, nephew, nerd, nurse, painter,
    pal, partner, passenger, person, roommate, salesman, scientist, senior, sibling, soldier, son, spectator,
      student, tailor, teammate, technician, traveler, uncle, vet, visitor, waitress, wife, woman, worker,
      writer]
  named_city:
  - chicago
  situated_role: [artist, athlete, babysitter, baker, bodyguard, cannoneer, captain, carpenter, chef, clerk,
