categories:
  preference_attribute:
    parent: adjective
  intrinsic_attribute:
    parent: adjective
    notes: An intrinsic property such as colour, size or ripeness; excludes discourse order and remainder
      references.

  quality_bearer_noun:
    parent: noun
    notes: Inanimate nouns with a measured ordinary quality predicate.
  quality_attribute:
    parent: adjective
    notes: >
      Broad evaluative adjectives. Compatibility is still explicit: the
      adjective may describe either a declared quality bearer or an animate
      noun without making those noun categories equivalent.
  marital_status_attribute:
    parent: adjective
    notes: Marital-status predicates licensed only for animate nouns.
  capacity_attribute:
    parent: adjective
    notes: Capacity-state predicates such as 'full'.
  capacity_noun:
    parent: noun
    notes: Container nouns that license a capacity-state predicate.
  equal_size_descriptor:
    parent: adjective
  variable_size_descriptor:
    parent: adjective
  size_property_noun:
    parent: noun
  customer_attitude_attribute:
    parent: adjective
  individual_unit_attribute:
    parent: adjective
members:
  preference_attribute:
  - favorite

  quality_bearer_noun: [carrot]
  quality_attribute: [good, tough, wonderful]
  marital_status_attribute: [married]
