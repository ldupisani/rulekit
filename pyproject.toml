[project]
name = "rulekit"
version = "0.1.0"
description = "Grammar-driven reading & reasoning engine: small deterministic kernel, declarative YAML rule packs, no LLM at runtime."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "ruamel.yaml>=0.18",
]

[project.optional-dependencies]
bench = [
    "pyarrow>=16",
]
server = ["fastapi>=0.111", "uvicorn>=0.30"]

[project.scripts]
rulekit = "rulekit.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rulekit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
