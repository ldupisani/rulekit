[project]
name = "rulekit"
version = "0.1.0"
description = "Grammar-driven reading & reasoning engine: small deterministic kernel, declarative YAML rule packs, no LLM at runtime."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "ruamel.yaml>=0.18",
]

[project.optional-dependencies]
bench = [
    "pyarrow>=16",
]
server = ["fastapi>=0.111", "uvicorn>=0.30", "markdown-it-py>=3"]
# the DuckDB resolver (rulekit.reference.db) — absence is safe: the
# reference-aggregate consumer declines when the import fails
reference = ["duckdb>=1.0"]

[project.scripts]
rulekit = "rulekit.cli:main"

[dependency-groups]
# duckdb here so the test suite exercises the aggregate path, not its decline
dev = ["pytest>=8", "pytest-xdist>=3.8", "duckdb>=1.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rulekit"]

# The Markdown files are the single authored copy, including in installed wheels.
[tool.hatch.build.targets.wheel.force-include]
"docs/yaml-reference.md" = "rulekit/server/docs/yaml-reference.md"
"docs/architecture.md" = "rulekit/server/docs/architecture.md"

[tool.pytest.ini_options]
testpaths = ["tests"]
